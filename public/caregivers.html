% 0%, oklch(1 0 0 \/ 0.18), transparent 60%); pointer-events: none; }\n.cta-card h2 { color: #fff; position: relative; }\n.cta-card p { color: oklch(0.95 0.02 220); font-size: 1.18rem; margin: 18px auto 32px; max-width: 50ch; position: relative; }\n.cta-card .btn-primary { background: #fff; color: var(--blue-deep); box-shadow: 0 8px 24px oklch(0.2 0.05 240 \/ 0.3); }\n.cta-card .btn-primary:hover { background: oklch(0.96 0.02 220); }\n.cta-card .actions { position: relative; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }\n.cta-card .fine { margin-top: 20px; font-size: 0.86rem; color: oklch(0.9 0.02 220); position: relative; }\n\n\/* ---------- Footer ---------- *\/\n.footer { padding-block: 60px 40px; border-top: 1px solid var(--line); background: var(--surface); }\n.footer-grid { display: grid; grid-template-columns: 1.4fr repeat(4, 1fr); gap: 40px; }\n.footer .brand { margin-bottom: 16px; }\n.footer .blurb { color: var(--ink-soft); font-size: 0.92rem; max-width: 30ch; }\n.footer h5 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); margin-bottom: 16px; font-weight: 700; }\n.footer ul { list-style: none; display: flex; flex-direction: column; gap: 11px; }\n.footer a { color: var(--ink-soft); font-size: 0.94rem; transition: color .15s; }\n.footer a:hover { color: var(--blue-deep); }\n.footer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--line); font-size: 0.86rem; color: var(--ink-faint); }\n@media (max-width: 820px) { .footer-grid { grid-template-columns: 1fr 1fr; } }\n\n\/* ---------- Reveal on scroll ---------- *\/\n.reveal { opacity: 0; transform: translateY(22px); transition: opacity .6s ease, transform .6s ease; }\n.reveal.in { opacity: 1; transform: none; }\n\n@media (prefers-reduced-motion: reduce) {\n  * { animation: none !important; transition: none !important; }\n  .reveal { opacity: 1; transform: none; }\n}\n<\/style>\n<style>\/* ===========================================================\n   iCanCall — shared audience-page components\n   Loaded by every tailored audience landing page (seniors,\n   parents, caregivers) on top of styles.css. Per-audience\n   files add their own signature sections.\n   =========================================================== *\/\n\n\/* ---------- Hero audience badge ---------- *\/\n.aud-badge {\n  display: inline-flex; align-items: center; gap: 9px;\n  background: var(--surface); border: 1px solid var(--line);\n  padding: 8px 15px 8px 11px; border-radius: 999px;\n  font-size: 0.92rem; font-weight: 600; color: var(--blue-deep);\n  box-shadow: var(--shadow-sm); margin-bottom: 22px;\n}\n.aud-badge .hh {\n  width: 26px; height: 26px; border-radius: 50%; flex: none;\n  background: linear-gradient(150deg, var(--blue), var(--teal-deep));\n  display: grid; place-items: center;\n}\n.aud-badge .hh svg { width: 14px; height: 14px; }\n\n\/* ---------- Reassurance callout under hero actions ---------- *\/\n.hero-reassure {\n  margin-top: 26px; display: flex; gap: 14px; align-items: flex-start;\n  max-width: 42ch; padding: 14px 16px; border-radius: var(--r-md);\n  background: oklch(0.70 0.13 158 \/ 0.10); border: 1px solid oklch(0.70 0.13 158 \/ 0.28);\n}\n.hero-reassure svg { width: 22px; height: 22px; flex: none; margin-top: 1px; color: oklch(0.45 0.13 158); }\n.hero-reassure p { font-size: 0.98rem; color: var(--ink-soft); }\n.hero-reassure b { color: var(--ink); }\n\n\/* ---------- Single-story spotlight (replaces 3-up quotes) ---------- *\/\n.spotlight-card {\n  display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 0;\n  border-radius: var(--r-xl); overflow: hidden;\n  border: 1px solid var(--line); box-shadow: var(--shadow-lg); background: var(--surface);\n}\n.spotlight-quote { padding: clamp(34px, 4vw, 56px); display: flex; flex-direction: column; }\n.spotlight-quote .stars { color: var(--teal-deep); letter-spacing: 4px; font-size: 1.05rem; margin-bottom: 18px; }\n.spotlight-quote blockquote {\n  font-size: clamp(1.3rem, 2.1vw, 1.7rem); line-height: 1.4; font-weight: 600;\n  letter-spacing: -0.02em; color: var(--ink); flex: 1;\n}\n.spotlight-quote .by { display: flex; align-items: center; gap: 13px; margin-top: 28px; }\n.spotlight-quote .by .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 0.95rem; }\n.spotlight-quote .by b { font-size: 1rem; display: block; }\n.spotlight-quote .by span { font-size: 0.9rem; color: var(--ink-faint); }\n.spotlight-aside {\n  background: linear-gradient(160deg, var(--blue-deep), var(--blue) 55%, var(--teal-deep));\n  color: #fff; padding: clamp(34px, 4vw, 52px); display: flex; flex-direction: column; justify-content: center; gap: 26px;\n}\n.spotlight-aside .stat-xl b { display: block; font-size: clamp(2.4rem, 4vw, 3.4rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1; }\n.spotlight-aside .stat-xl span { font-size: 1rem; color: oklch(0.92 0.02 220); margin-top: 8px; display: block; }\n.spotlight-aside .divider { height: 1px; background: oklch(1 0 0 \/ 0.22); }\n@media (max-width: 820px) { .spotlight-card { grid-template-columns: 1fr; } }\n<\/style>\n<style>\/* ===========================================================\n   iCanCall — Special-abilities caregivers\n   Layers on styles.css + audience.css. Signature section:\n   a 24-hour care-coverage timeline showing the one number\n   always routes to the right caregiver, with no gaps.\n   Person-first, dignified. Calm violet accent.\n   =========================================================== *\/\n\n:root {\n  --care:      oklch(0.55 0.11 280);    \/* calm violet — care-team accent *\/\n  --care-deep: oklch(0.45 0.11 282);\n  --care-tint: oklch(0.95 0.03 285);\n}\n\n\/* violet-tinted hero reassurance for this audience *\/\n.hero-reassure.care { background: var(--care-tint); border-color: oklch(0.55 0.11 280 \/ 0.30); }\n.hero-reassure.care svg { color: var(--care-deep); }\n\n\/* ---------- \"Someone is always responsible\" coverage timeline ---------- *\/\n.coverage { padding-block: clamp(64px, 9vw, 110px); }\n.timeline-card {\n  margin-top: 52px; border-radius: var(--r-xl); padding: clamp(24px, 3vw, 36px);\n  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg);\n}\n.tl-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }\n.tl-head .num {\n  display: inline-flex; align-items: center; gap: 11px; font-weight: 700; font-size: 1.06rem; letter-spacing: -0.02em;\n}\n.tl-head .num .ring {\n  width: 38px; height: 38px; border-radius: 11px; flex: none;\n  background: linear-gradient(150deg, var(--care), var(--blue)); display: grid; place-items: center;\n}\n.tl-head .num .ring svg { width: 19px; height: 19px; }\n.tl-head .num small { display: block; font-size: 0.74rem; font-weight: 500; color: var(--ink-faint); letter-spacing: 0.01em; }\n.tl-now-badge {\n  display: inline-flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 600;\n  color: var(--care-deep); background: var(--care-tint); border: 1px solid oklch(0.55 0.11 280 \/ 0.28);\n  padding: 6px 13px; border-radius: 999px;\n}\n.tl-now-badge .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--care); }\n\n.track {\n  display: flex; height: 76px; border-radius: var(--r-md); overflow: hidden; position: relative;\n  border: 1px solid var(--line);\n}\n.seg {\n  display: flex; flex-direction: column; justify-content: center; gap: 2px;\n  padding: 0 14px; color: #fff; min-width: 0; overflow: hidden; white-space: nowrap;\n}\n.seg b { font-size: 0.92rem; font-weight: 700; text-overflow: ellipsis; overflow: hidden; }\n.seg span { font-size: 0.76rem; opacity: 0.85; text-overflow: ellipsis; overflow: hidden; }\n\n\/* now marker *\/\n.now {\n  position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink);\n  z-index: 3; transform: translateX(-1px);\n}\n.now::before {\n  content: \"\"; position: absolute; top: -4px; left: 50%; transform: translateX(-50%);\n  width: 12px; height: 12px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px var(--surface);\n}\n.now::after {\n  content: \"Now\"; position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%);\n  font-size: 0.7rem; font-weight: 700; color: var(--ink); background: var(--surface);\n  padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap;\n}\n\n.hours {\n  display: flex; justify-content: space-between; margin-top: 12px;\n  font-family: var(--mono); font-size: 0.74rem; color: var(--ink-faint);\n}\n.tl-legend { display: flex; flex-wrap: wrap; gap: 16px 22px; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }\n.tl-legend .item { display: flex; align-items: center; gap: 9px; font-size: 0.9rem; color: var(--ink-soft); }\n.tl-legend .item .dot { width: 12px; height: 12px; border-radius: 4px; flex: none; }\n.tl-legend .item b { color: var(--ink); font-weight: 600; }\n\n.tl-foot { margin-top: 22px; display: flex; gap: 12px; align-items: flex-start; font-size: 0.94rem; color: var(--ink-soft); }\n.tl-foot svg { width: 20px; height: 20px; flex: none; margin-top: 1px; color: var(--care-deep); }\n\n@media (max-width: 680px) {\n  .track { height: 66px; }\n  .seg span { display: none; }\n  .seg b { font-size: 0.8rem; white-space: normal; }\n}\n\n\/* ---------- Simplicity emphasis chips (used under hero or in a band) ---------- *\/\n.one-press { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }\n.one-press .chip {\n  display: inline-flex; align-items: center; gap: 9px; padding: 10px 16px;\n  border-radius: 999px; background: var(--surface); border: 1px solid var(--line);\n  font-size: 0.92rem; font-weight: 600; color: var(--ink-soft); box-shadow: var(--shadow-sm);\n}\n.one-press .chip svg { width: 17px; height: 17px; color: var(--care-deep); }\n<\/style>\n<\/head>\n<body>\n\n\n\n<!-- ============== HEADER ============== -->\n<header class=\"header\">\n  <div class=\"wrap header-inner\">\n    <a class=\"brand\" href=\"\/\" aria-label=\"iCanCall home\">\n      <svg class=\"logo-main\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\" viewBox=\"0 0 800 553.0305\" style=\"height: 40px; width: auto; display: block;\">\n        <style>\n          .logo-main .cls-1 { fill: #1c2530; }\n          .logo-main .cls-2 { fill: #4083ae; }\n          .logo-main .cls-3 { fill: #fff; }\n        <\/style>\n        <g>\n          <path class=\"cls-1\" d=\"M707.4397,239.6996l-.4398-.6591c-31.0327-46.2476-71.4038-97.0542-117.1563-115.2897-5.2177-2.4717-6.9757-4.9985-2.5277-9.777,4.9441-5.1081,11.2601-11.0948,14.6112-17.796,20.8722-36.6356-8.074-84.4763-50.1482-82.2791-44.1058.769-68.9324,53.1134-43.0062,88.0463,4.1744,6.7561,14.6648,13.4569,16.3129,17.4664.8783,2.3621-.2749,3.9548-2.6913,5.8225-22.9037,11.9189-41.9093,33.4498-63.4398,49.1585-24.9366,18.51-48.3902.5495-73.1069-12.9625-9.777-4.6686-13.7865-8.4035-5.9311-18.8946,20.4873-28.2321-1.3195-70.5248-36.9651-68.438-25.7064.5495-45.2603,25.0466-40.866,50.0929.7147,4.449,2.0879,8.788,4.1744,12.7975,3.7896,8.0743,12.0285,14.226,11.8649,18.8946-.3299,6.0421-9.5584,9.1179-16.8077,15.2146-26.2548,20.4323-47.7867,57.5624-82.9938,31.088-4.7779-3.0758-9.9969-6.5362-14.8847-9.5571-4.6679-3.2404-8.6238-4.8335-9.2272-9.7767-.1649-4.6689,6.9757-11.3697,9.0623-19.7186,8.019-24.7167-16.1479-50.477-41.4694-43.5013-19.1142,4.1195-30.9227,25.7603-24.6617,44.2704,1.868,8.074,10.8752,16.4228,12.5233,20.4873,1.5931,3.6253-2.4714,6.3716-5.5476,8.3489-58.7156,40.4255-120.2325,184.3318-124.0771,280.7269-.6048,22.6295,5.2177,72.887,37.185,64.3185,28.6163-14.0611,45.0941-46.5225,70.4142-67.0098,19.7189-18.3454,45.369-26.3644,67.6693-7.1403,19.9925,14.7201,39.5465,46.2476,68.0528,35.8665,22.8501-8.6781,39.2729-36.4706,61.5719-45.6435,45. 12.9075,87.3332-28.6166,77.0051-48.1153,156.0444,57.0133,183.4524-14.2257l.3299-.879c16.3129-69.5362-30.7041-135.0629-73.1069-178.3447ZM161.9688,375.0375c-45.369-4.3394-43.2811-69.9757,2.1978-71.6238h.8783c48.6637,2.2522,45.8638,73.546-3.0762,71.6238ZM378.5432,327.0872c-15.051,43.9408-80.3025,36.9651-85.6302-9.2279-3.6246,25.3758,17.9059-49.653,43.446-49.3785h.7697c29.3296-.4392,51.575,31.0883,41.4144,58.6063ZM601.2122,303.5237c-4.7779,58.1668-84.4756,71.0193-107.5443,17.5764-16.0393-35.592,12.0835-78.6541,51.1901-78.05h.8247c31.8574-.2746,58.5507,28.6716,55.5295,60.4736Z\"\/>\n        <\/g>\n      <\/svg>\n    <\/a>\n    <nav class=\"nav\">\n      <a href=\"#coverage\">Coverage<\/a>\n      <a href=\"#how\">How it works<\/a>\n      <a href=\"#build\">Build the circle<\/a>\n      <a href=\"#pricing\">Pricing<\/a>\n      <a href=\"#faq\">Questions<\/a>\n    <\/nav>\n    <div class=\"header-cta\" style=\"display: flex; align-items: center; gap: 12px;\">\n      <a class=\"btn btn-ghost\" href=\"#how\">See how it works<\/a>\n      <a class=\"btn btn-primary\" href=\"#pricing\">Get started<\/a>\n      <select id=\"langSelect\" class=\"lang-select\" style=\"background: transparent; border: 1px solid var(--line); color: var(--ink-soft); padding: 6px 10px; border-radius: 20px; font-size: 0.86rem; font-weight: 600; cursor: pointer; outline: none; font-family: var(--font); margin-left: 4px;\">\n        <option value=\"en\">🇺🇸 EN<\/option>\n        <option value=\"es\">🇪🇸 ES<\/option>\n        <option value=\"fr\">🇫🇷 FR<\/option>\n        <option value=\"ja\">🇯🇵 JA<\/option>\n        <option value=\"zh\">🇨🇳 ZH<\/option>\n        <option value=\"ar\">🇸🇦 AR<\/option>\n        <option value=\"hi\">🇮🇳 HI<\/option>\n        <option value=\"pt\">🇵🇹 PT<\/option>\n        <option value=\"de\">🇩🇪 DE<\/option>\n        <option value=\"it\">🇮🇹 IT<\/option>\n        <option value=\"ko\">🇰🇷 KO<\/option>\n      <\/select>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main id=\"top\">\n\n<!-- ============== HERO ============== -->\n<section class=\"hero\">\n  <div class=\"wrap hero-grid\">\n    <div class=\"hero-copy\">\n      <span class=\"aud-badge\">\n        <span class=\"hh\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9Z\"><\/path><\/svg><\/span>\n        For families &amp; caregivers of loved ones with special abilities\n      <\/span>\n      <h1>One press.<br><span class=\"accent\">The right caregiver, every time.<\/span><\/h1>\n      <p class=\"lead\">For a loved one who can't work through a contact list, a single number — or one speed-dial button — connects them to exactly the right person on your care team. You decide who answers and when. They just press call.<\/p>\n      <div class=\"hero-actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"#pricing\">Get started<\/a>\n        <a class=\"btn btn-ghost btn-lg\" href=\"#how\">How it works<\/a>\n      <\/div>\n      <div class=\"hero-reassure care\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\/path><\/svg>\n        <p><b>No list to navigate. No decision to make.<\/b> One press reaches a real person who knows them — and your whole care team is alerted the moment they call.<\/p>\n      <\/div>\n    <\/div>\n\n    <!-- Animated routing demo -->\n    <div class=\"demo\" id=\"demo\" aria-label=\"Live call-routing demonstration\">\n      <div class=\"demo-head\">\n        <div class=\"demo-number\">\n          <span class=\"ring\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n          <\/span>\n          <span class=\"num\">(415) 200-CARE<small>Daniel's iCanCall number<\/small><\/span>\n        <\/div>\n        <span class=\"demo-status\"><span class=\"live\"><\/span><span class=\"txt\">Incoming call<\/span><\/span>\n      <\/div>\n      <p class=\"demo-caption\">One press finds the right caregiver, in order, until someone who knows him answers<\/p>\n      <div class=\"chain\">\n        <div class=\"contact\">\n          <span class=\"order\">1<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.58 0.115 232)\">MA<\/span>\n          <span class=\"who\"><b>Maria<\/b><span>Mom · primary caregiver<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">2<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.55 0.11 280)\">JC<\/span>\n          <span class=\"who\"><b>James C.<\/b><span>Co-caregiver<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">3<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.62 0.10 198)\">SP<\/span>\n          <span class=\"who\"><b>Sunrise Program<\/b><span>Day program<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">4<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.6 0.12 30)\">ND<\/span>\n          <span class=\"who\"><b>Nurse Dawn<\/b><span>On-call<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== TRUST STRIP ============== -->\n<section class=\"trust\">\n  <div class=\"wrap trust-inner\">\n    <span class=\"trust-label\">Independence for them, reassurance for you<\/span>\n    <div class=\"trust-stats\">\n      <div class=\"stat\"><b>1<\/b><span>press to reach help<\/span><\/div>\n      <div class=\"stat\"><b>0<\/b><span>lists to navigate<\/span><\/div>\n      <div class=\"stat\"><b>24\/7<\/b><span>caregiver coverage<\/span><\/div>\n      <div class=\"stat\"><b>Whole<\/b><span>care team alerted<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== COVERAGE TIMELINE (signature) ============== -->\n<section class=\"section coverage\" id=\"coverage\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Around-the-clock coverage<\/span>\n      <h2>Someone is always responsible.<\/h2>\n      <p class=\"lead\">The number never changes — but who answers it does. iCanCall routes the same call to the right caregiver for the time of day, so coverage hands off cleanly and there's never a gap.<\/p>\n    <\/div>\n\n    <div class=\"timeline-card reveal\">\n      <div class=\"tl-head\">\n        <span class=\"num\">\n          <span class=\"ring\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg><\/span>\n          (415) 200-CARE<small>Daniel's number — one number, all day<\/small>\n        <\/span>\n        <span class=\"tl-now-badge\"><span class=\"pip\"><\/span>Right now: <b id=\"now-who\" style=\"margin-left:2px\">—<\/b><\/span>\n      <\/div>\n\n      <div class=\"track\" id=\"cov-track\">\n        <div class=\"seg\" style=\"flex-basis:29.17%; background:oklch(0.44 0.105 240)\"><b>Nurse Dawn<\/b><span>On-call · overnight<\/span><\/div>\n        <div class=\"seg\" style=\"flex-basis:33.33%; background:oklch(0.62 0.10 198)\"><b>Sunrise Program<\/b><span>Weekday day program<\/span><\/div>\n        <div class=\"seg\" style=\"flex-basis:25%; background:oklch(0.58 0.115 232)\"><b>Maria (Mom)<\/b><span>Primary caregiver<\/span><\/div>\n        <div class=\"seg\" style=\"flex-basis:12.5%; background:oklch(0.55 0.11 280)\"><b>James C.<\/b><span>Evening<\/span><\/div>\n        <div class=\"now\" id=\"cov-now\" style=\"left:0\"><\/div>\n      <\/div>\n      <div class=\"hours\">\n        <span>12a<\/span><span>6a<\/span><span>12p<\/span><span>6p<\/span><span>12a<\/span>\n      <\/div>\n\n      <div class=\"tl-legend\">\n        <span class=\"item\"><span class=\"dot\" style=\"background:oklch(0.58 0.115 232)\"><\/span><b>Maria<\/b> · primary, afternoons<\/span>\n        <span class=\"item\"><span class=\"dot\" style=\"background:oklch(0.55 0.11 280)\"><\/span><b>James C.<\/b> · evenings<\/span>\n        <span class=\"item\"><span class=\"dot\" style=\"background:oklch(0.62 0.10 198)\"><\/span><b>Sunrise Program<\/b> · weekdays<\/span>\n        <span class=\"item\"><span class=\"dot\" style=\"background:oklch(0.44 0.105 240)\"><\/span><b>Nurse Dawn<\/b> · overnight on-call<\/span>\n      <\/div>\n\n      <div class=\"tl-foot\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z\"><\/path><path d=\"m9 12 2 2 4-4\"><\/path><\/svg>\n        <p>If the assigned caregiver can't pick up, the call cascades to the next person in the circle — so a call is never left unanswered, at any hour.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== HOW IT WORKS ============== -->\n<section class=\"section tint-band\" id=\"how\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">How it works<\/span>\n      <h2>You build the care team.<br>They press one button.<\/h2>\n      <p class=\"lead\">All of the complexity lives with you, in the dashboard. For your loved one, it stays as simple as a single call.<\/p>\n    <\/div>\n    <div class=\"steps\">\n      <div class=\"step reveal\">\n        <div class=\"idx\">1<\/div>\n        <h3>Claim one number<\/h3>\n        <p>Pick a single iCanCall number and set it as a speed-dial or a one-touch button on whatever device they use — a phone, a tablet, or an adaptive caller. That one button is all they ever need.<\/p>\n        <svg class=\"step-arrow\" width=\"60\" height=\"24\" viewBox=\"0 0 60 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M0 12h54m0 0-7-7m7 7-7 7\"><\/path><\/svg>\n      <\/div>\n      <div class=\"step reveal\">\n        <div class=\"idx\">2<\/div>\n        <h3>Build the care team<\/h3>\n        <p>Add up to six caregivers — family, co-caregivers, a day program, a group home, an on-call nurse — and set who should answer, and when, across the day.<\/p>\n        <svg class=\"step-arrow\" width=\"60\" height=\"24\" viewBox=\"0 0 60 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M0 12h54m0 0-7-7m7 7-7 7\"><\/path><\/svg>\n      <\/div>\n      <div class=\"step reveal\">\n        <div class=\"idx\">3<\/div>\n        <h3>They reach the right person<\/h3>\n        <p>When they press call, iCanCall routes to the right caregiver for that moment and <b>cascades<\/b> on if needed — while every caregiver gets an instant text that the call came in.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== INTERACTIVE BUILDER ============== -->\n<section class=\"section\" id=\"build\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Try it yourself<\/span>\n      <h2>Build the care team that answers.<\/h2>\n      <p class=\"lead\">Add the caregivers you trust, set their order, then place a pretend call. Choose <b>cascade<\/b> — ring each caregiver in turn until someone picks up — or a simple <b>caller menu<\/b>. Your loved one only ever makes one call.<\/p>\n    <\/div>\n    <div class=\"mode-toggle reveal\">\n      <span class=\"mode-label\">Routing mode<\/span>\n      <div class=\"seg\" role=\"tablist\" aria-label=\"Routing mode\">\n        <button class=\"seg-btn active\" type=\"button\" data-mode=\"cascade\" role=\"tab\">Call cascade<\/button>\n        <button class=\"seg-btn\" type=\"button\" data-mode=\"menu\" role=\"tab\">Caller menu<\/button>\n      <\/div>\n      <span class=\"mode-note\">\n        <svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"10\" rx=\"2\"><\/rect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\/path><\/svg>\n        You set this once in the dashboard\n      <\/span>\n    <\/div>\n    <div class=\"builder reveal\">\n      <!-- editor -->\n      <div class=\"builder-panel\">\n        <div class=\"builder-head\">\n          <h3>The care team<\/h3>\n          <span class=\"count\"><span id=\"ccount\">0<\/span>\/6 contacts<\/span>\n        <\/div>\n        <div id=\"circle-list\" class=\"circle-list\"><\/div>\n        <form id=\"add-form\" class=\"add-form\" autocomplete=\"off\">\n          <input id=\"add-name\" type=\"text\" placeholder=\"Name\" maxlength=\"22\" required=\"\">\n          <input id=\"add-rel\" type=\"text\" placeholder=\"Role\" maxlength=\"22\">\n          <button class=\"btn btn-primary add-btn\" type=\"submit\" aria-label=\"Add caregiver\" title=\"Add caregiver\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg>\n          <\/button>\n        <\/form>\n      <\/div>\n      <!-- simulator -->\n      <div class=\"sim-panel\">\n        <div class=\"sim-screen\" id=\"sim-screen\">\n          <span class=\"num-line\">(415) 200-CARE<\/span>\n          <div class=\"sim-avatar\" id=\"sim-avatar\">—<\/div>\n          <div class=\"sim-name\" id=\"sim-name\">Ready<\/div>\n          <div class=\"sim-state\" id=\"sim-state\">Press call to start routing<\/div>\n          <div class=\"sim-dots\" id=\"sim-dots\"><\/div>\n        <\/div>\n        <button class=\"btn btn-primary\" id=\"place-call\">\n          <svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n          Place a call\n        <\/button>\n        <p class=\"sim-hint\">Toggle a caregiver to \"Busy\" to see the cascade skip ahead.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== FEATURES ============== -->\n<section class=\"section tint-band\" id=\"features\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Why caregivers choose iCanCall<\/span>\n      <h2>Simple for them.<br>Complete for you.<\/h2>\n    <\/div>\n    <div class=\"features\">\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><circle cx=\"12\" cy=\"12\" r=\"3.2\"><\/circle><\/svg><\/div>\n        <h3>One press, one action<\/h3>\n        <p>No contact list, no menus, no choosing. A single number or button is the entire interaction — designed for those a list would only overwhelm.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 7v5l3 2\"><\/path><\/svg><\/div>\n        <h3>Always the right caregiver<\/h3>\n        <p>Time-aware routing sends the call to whoever's on for that part of the day — primary caregiver, day program, evening, or overnight on-call.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16v11H7l-3 3V5Z\"><\/path><path d=\"M8 9h8M8 12h5\"><\/path><\/svg><\/div>\n        <h3>Whole team alerted<\/h3>\n        <p>Every caregiver gets a text the instant a call comes in — vital when a loved one may not be able to explain where they are or what they need.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2 6 4-14 2 8h6\"><\/path><\/svg><\/div>\n        <h3>No gaps at handoff<\/h3>\n        <p>Coverage passes cleanly from one caregiver to the next. If the assigned person can't answer, the call cascades onward — never a dead end.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v4a2 2 0 0 1-2.2 2A16 16 0 0 1 3 6.2 2 2 0 0 1 5 4Z\"><\/path><\/svg><\/div>\n        <h3>Works with their setup<\/h3>\n        <p>Program it on a phone, a tablet, an adaptive caller, or a single speed-dial button. No app to install and nothing new to learn.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"11\" rx=\"2\"><\/rect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\/path><\/svg><\/div>\n        <h3>Private &amp; protected<\/h3>\n        <p>Every caregiver's personal number stays hidden behind the single iCanCall line. All routing is encrypted, and your data is never sold.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== SPOTLIGHT STORY ============== -->\n\n\n<!-- ============== PRICING ============== -->\n<section class=\"section tint-band\" id=\"pricing\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Simple, honest pricing<\/span>\n      <h2>Coverage that costs less<br>than a single co-pay.<\/h2>\n      <p class=\"lead\">Both plans include cascade routing, the caller menu, time-aware coverage, and 24\/7 reliability. Cancel anytime.<\/p>\n    <\/div>\n\n    <div class=\"bill-toggle reveal\" id=\"bill-toggle\">\n      <button class=\"bill-btn active\" type=\"button\" data-cycle=\"monthly\">Monthly<\/button>\n      <button class=\"bill-btn\" type=\"button\" data-cycle=\"annual\">Annual <em>Save 17%<\/em><\/button>\n    <\/div>\n\n    <div class=\"pricing\">\n      <div class=\"plan reveal\" data-m-amt=\"$12.99\" data-m-per=\"\/ month\" data-m-note=\"Billed monthly · cancel anytime\" data-a-amt=\"$129\" data-a-per=\"\/ year\" data-a-note=\"Just $10.75\/mo, billed annually\">\n        <h3>Essential<\/h3>\n        <p class=\"desc\">One number for one loved one.<\/p>\n        <div class=\"price\"><b class=\"amt\">$12.99<\/b><span class=\"per\">\/ month<\/span><\/div>\n        <p class=\"price-yr\">Billed monthly · cancel anytime<\/p>\n        <ul>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> 1 number included<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> 3 routable trusted contacts<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" st ction class=\"section\" id=\"faq\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Questions, answered<\/span>\n      <h2>What caregivers ask us most.<\/h2>\n    <\/div>\n    <div class=\"faq reveal\">\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">My loved one is non-verbal or can't explain where they are. Does this still help?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Yes — that's exactly who it's built for. They don't need to choose a contact or say anything in particular. One press connects them to a caregiver who knows them, and every caregiver in the circle gets an instant text that the call came in, so the right people are aware right away.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Can it work as a single speed-dial button or with an adaptive device?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Absolutely. Because iCanCall is just one phone number, you can program it as a one-touch speed dial, a favorite, or a single button on whatever phone, tablet, or adaptive caller they already use. There's no app to install and nothing new for them to learn.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">How do multiple caregivers and shift changes work?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>From your dashboard, you set who should answer at different times of day — a day program on weekday mornings, a primary caregiver in the afternoon, an evening caregiver, an overnight on-call nurse. The same number routes to whoever's on for that window, so coverage hands off without a gap.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">What if the assigned caregiver can't pick up?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>The call cascades to the next person in the circle until someone answers. If everyone is unreachable, it goes to voicemail that's transcribed and texted to the whole team — so a call is never simply lost.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Can a group home or day program be part of the circle?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Yes. Any phone number can be a contact — a group home line, a day program, a case manager, a nurse, or family. You decide the order and the times, and adjust anytime as the care plan changes.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Is iCanCall a medical alert or emergency service?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>No — iCanCall connects your loved one to the people on their care team quickly and simply. It complements, but does not replace, 911 or a medical-monitoring service. For life-threatening emergencies, always teach and rely on 911 where possible.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== FINAL CTA ============== -->\n<section class=\"section cta-band\" id=\"cta\">\n  <div class=\"wrap\">\n    <div class=\"cta-card reveal\">\n      <h2>One number. The right person. Every time.<\/h2>\n      <p>Give your loved one the independence of reaching help on their own — and give your care team the certainty of always being there. Set up iCanCall in minutes.<\/p>\n      <div class=\"actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"#pricing\">Get started<\/a>\n        <a class=\"btn btn-ghost btn-lg\" href=\"#how\" style=\"color:#fff;border-color:oklch(1 0 0 \/ 0.5)\">See how it works<\/a>\n      <\/div>\n      <p class=\"fine\">Set up in minutes · No setup fees · Cancel anytime<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\/main>\n\n<!-- ============== FOOTER ============== -->\n<footer class=\"footer\">\n  <div class=\"wrap\">\n    <div class=\ 됨 ✓\"\n    },\n    \"attrs\": {\n      \"Name\": \"이름\",\n      \"Relationship\": \"관계\"\n    }\n  }\n};\n\n     function translateDOM(node, dict) {\n       if (node.nodeType === Node.TEXT_NODE) {\n         const text = node.nodeValue.trim();\n         if (dict[text]) {\n           node.nodeValue = dict[text];\n         }\n       } else if (node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {\n         node.childNodes.forEach(child => translateDOM(child, dict));\n       }\n     }\n\n     function translatePage(lang) {\n       \/\/ Support RTL for Arabic\n       document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';\n\n       const dict = DICT_MAP[lang];\n       if (dict) {\n         translateDOM(document.body, dict.text);\n         \n         document.querySelectorAll('[placeholder]').forEach(el => {\n           const p = el.getAttribute('placeholder').trim();\n           if (dict.attrs[p]) el.setAttribute('placeholder', dict.attrs[p]);\n         });\n         \n         document.querySelectorAll('.avail .lbl').forEach(el => {\n           const availMap = {\n             'es': { 'Available': 'Disponible', 'Busy': 'Ocupado' },\n             'fr': { 'Available': 'Disponible', 'Busy': 'Occupé' },\n             'ja': { 'Available': '対応可能', 'Busy': '忙しい' },\n             'zh': { 'Available': '在线可用', 'Busy': '忙碌' },\n             'ar': { 'Available': 'متاح', 'Busy': 'مشغول' },\n             'hi': { 'Available': 'उपलब्ध', 'Busy': 'व्यस्त' },\n             'pt': { 'Available': 'Disponível', 'Busy': 'Ocupado' },\n             'de': { 'Available': 'Verfügbar', 'Busy': 'Besetzt' },\n             'it': { 'Available': 'Disponibile', 'Busy': 'Occupato' },\n             'ko': { 'Available': '통화 가능', 'Busy': '바쁨' }\n           };\n           const m = availMap[lang];\n           if (m) {\n             if (el.textContent.trim() === 'Available') el.textContent = m['Available'];\n             if (el.textContent.trim() === 'Busy') el.textContent = m['Busy'];\n           }\n         });\n         \n         document.querySelectorAll('.sim-hint').forEach(el => {\n           const hintMap = {\n             'es': 'Desactive contactos a «Ocupado» para ver cómo salta la cascada.',\n             'fr': \"Désactivez des contacts sur « Occupé » pour voir l'appel sauter au suivant.\",\n             'ja': '連絡先を「忙しい」に切り替えて、カスケード転送が次へ進む様子を確認できます。',\n             'zh': '将联系人切换为“忙碌”状态，查看顺次呼叫如何自动跳过并呼叫下一位。',\n             'ar': 'قم بتحويل جهات الاتصال إلى ' + \"'مشغول'\" + ' لرؤية الرنين المتتالي يتجاوزهم إلى التالي.',\n             'hi': 'कैस्केड को आगे बढ़ते देखने के लिए सदस्यों को “व्यस्त” पर टॉगल करें।',\n             'pt': 'Mude contatos para “Ocupado” para ver a chamada saltar para o próximo.',\n             'de': 'Schalten Sie Kontakte auf „Besetzt“, um zu sehen wie der Anruf zum nächsten springt.',\n             'it': 'Imposta i contati su “Occupato” per vedere la chiamata passare al successivo.',\n             'ko': '연락처를 “통화 중”으로 토글하여 순차 통화가 다음 보호자로 넘어가는 것을 확인하세요.'\n           };\n           if (hintMap[lang] && el.textContent.includes('Toggle contacts')) {\n             el.textContent = hintMap[lang];\n           }\n         });\n       } else {\n         window.location.reload();\n       }\n     }\n\n     document.addEventListener('DOMContentLoaded', () => {\n       const select = document.getElementById('langSelect');\n       if (select) {\n         const saved = localStorage.getItem('lang') || 'en';\n         select.value = saved;\n         if (saved !== 'en') translatePage(saved);\n         \n         select.addEventListener('change', (e) => {\n           localStorage.setItem('lang', e.target.value);\n           window.dispatchEvent(new Event('storage'));\n           translatePage(e.target.value);\n         });\n       }\n     });\n\n     window.addEventListener('storage', () => {\n       const select = document.getElementById('langSelect');\n       if (select) {\n         const active = localStorage.getItem('lang') || 'en';\n         if (select.value !== active) {\n           select.value = active;\n           translatePage(active);\n         }\n       }\n     });\n   <\/script>\n <\/body>\n <\/html>\n<\/html>"</script>
