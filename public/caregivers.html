m espaço para um segundo cuidador.\",\n      \"Just $12.42\/mo, billed annually\": \"Apenas $12.42\/mês, cobrado anualmente\",\n      \"Just $20.75\/mo, billed annually\": \"Apenas $20.75\/mês, cobrado anualmente\",\n      \"Just $41.58\/mo, billed annually\": \"Apenas $41.58\/mês, cobrado anualmente\",\n      \"1 Dedicated Safety Number\": \"1 número de segurança dedicado\",\n      \"Up to 3 Roster Contacts\": \"Até 3 contatos na lista\",\n      \"Call Cascade (Sequential)\": \"Encaminhamento em cascata (sequencial)\",\n      \"Real-time Email Alerts\": \"Alertas por e-mail em tempo real\",\n      \"Standard voicemail box\": \"Caixa postal padrão\",\n      \"30-day money-back guarantee\": \"Garantia de reembolso de 30 dias\",\n      \"2 Dedicated Safety Numbers\": \"2 números de segurança dedicados\",\n      \"Up to 6 Roster Contacts\": \"Até 6 contatos na lista\",\n      \"Cascade & Caller Menu (IVR)\": \"Cascata e menu vocal (URA)\",\n      \"Time-of-day Scheduling\": \"Agendamento por horário\",\n      \"Bilingual Greeting Options\": \"Mensagens de saudação bilingues\",\n      \"Instant Voicemail Email Transcriptions\": \"Transcrição instantânea da caixa postal por e-mail\",\n      \"5 Dedicated Safety Numbers\": \"5 números de segurança dedicados\",\n      \"Up to 15 Roster Contacts per Number\": \"Até 15 contatos na lista por número\",\n      \"All Routing Modes + Scheduling\": \"Todos os modos de encaminhamento + agendamento\",\n      \"150 pooled voice minutes\": \"150 minutos de voz compartilhados\",\n      \"2 Caregiver Logins\": \"2 acessos para cuidadores\",\n      \"All plans include cascade routing, the caller menu, and 24\/7 reliability. Set it up for your parent in minutes — cancel anytime.\": \"Todos os planos incluem encaminhamento em cascata, menu vocal e confiabilidade 24\/7. Configure para seus pais em minutos — cancele quando quiser.\",\n      \"All plans include cascade routing, the caller menu, and 24\/7 reliability. Set it up in minutes — cancel anytime.\": \"Todos os planos incluem encaminhamento em cascata, menu vocal e confiabilidade 24\/7. Configure em minutos — cancele quando quiser.\",\n      \"All plans include cascade routing, the caller menu, time-aware coverage, and 24\/7 reliability. Cancel anytime.\": \"Todos os planos incluem encaminhamento em cascata, menu vocal, cobertura por horário e confiabilidade 24\/7. Cancele quando quiser.\",\n      \"Designed for the moments that matter\": \"Feito para os momentos que importam\",\n      \"iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.\": \"O iCanCall adapta-se de forma única a famílias que precisam de comunicação de segurança sem telas e de forma simples.\",\n      \"For Kids\": \"Para crianças\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"Permite que as crianças liguem para a família de qualquer telefone fixo ou básico, sem distrações de smartphones.\",\n      \"For Seniors\": \"Para idosos\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"Um canal direto para pais ou avós. Eles só precisam se lembrar de um único número para falar com toda a família.\",\n      \"For Special Needs\": \"Necessidades especiais\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"Simplifica o processo de ligação para pessoas com dificuldades cognitivas ou limitações de mobilidade.\",\n      \"Coverage\": \"Cobertura\",\n      \"Build the circle\": \"Monte o círculo\",\n      \"Questions\": \"Perguntas\",\n      \"For families & caregivers of loved ones with special abilities\": \"Para famílias e cuidadores de pessoas com necessidades especiais\",\n      \"One press.\": \"Um toque.\",\n      \"The right caregiver, every time.\": \"O cuidador certo, sempre.\",\n      \"For a loved one who can't work through a contact list, a single number — or one speed-dial button — connects them to exactly the right person on your care team. You decide who answers and when. They just press call.\": \"Para quem você ama e não consegue percorrer uma lista de contatos, um único número — ou um botão de discagem rápida — conecta exatamente à pessoa certa da sua equipe de cuidado. Você decide quem atende e quando. Eles só apertam para ligar.\",\n      \"No list to navigate. No decision to make.\": \"Nenhuma lista para percorrer. Nenhuma decisão a tomar.\",\n      \"One press reaches a real person who knows them — and your whole care team is alerted the moment they call.\": \"Um toque chama uma pessoa de verdade, que os conhece — e toda a sua equipe de cuidado é avisada no momento da ligação.\",\n      \"Daniel's iCanCall number\": \"Número iCanCall do Daniel\",\n      \"Incoming call\": \"Chamada recebida\",\n      \"One press finds the right caregiver, in order, until someone who knows him answers\": \"Um toque encontra o cuidador certo, na ordem, até alguém que o conhece atender\",\n      \"Mom · primary caregiver\": \"Mãe · cuidadora principal\",\n      \"Standing by\": \"De prontidão\",\n      \"Co-caregiver\": \"Cocuidador\",\n      \"Day program\": \"Centro-dia\",\n      \"Nurse Dawn\": \"Enfermeira Dawn\",\n      \"On-call\": \"De plantão\",\n      \"Independence for them, reassurance for you\": \"Independência para eles, tranquilidade para você\",\n      \"press to reach help\": \"toque para pedir ajuda\",\n      \"lists to navigate\": \"listas para percorrer\",\n      \"caregiver coverage\": \"cobertura de cuidadores\",\n      \"Whole\": \"Toda\",\n      \"care team alerted\": \"a equipe de cuidado avisada\",\n      \"Around-the-clock coverage\": \"Cobertura 24 horas por dia\",\n      \"Someone is always responsible.\": \"Sempre há alguém responsável.\",\n      \"The number never changes — but who answers it does. iCanCall routes the same call to the right caregiver for the time of day, so coverage hands off cleanly and there's never a gap.\": \"O número nunca muda — mas quem atende, sim. O iCanCall encaminha a mesma ligação ao cuidador certo para cada horário, para que a cobertura passe de um a outro sem falhas e nunca haja lacuna.\",\n      \"Daniel's number — one number, all day\": \"Número do Daniel — um só número, o dia todo\",\n      \"Right now:\": \"Agora:\",\n      \"On-call · overnight\": \"De plantão · madrugada\",\n      \"Weekday day program\": \"Centro-dia nos dias úteis\",\n      \"Maria (Mom)\": \"Maria (mãe)\",\n      \"Primary caregiver\": \"Cuidadora principal\",\n      \"Evening\": \"Noite\",\n      \"12a\": \"0h\",\n      \"6a\": \"6h\",\n      \"12p\": \"12h\",\n      \"6p\": \"18h\",\n      \"· primary, afternoons\": \"· principal, tardes\",\n      \"· evenings\": \"· noites\",\n      \"· weekdays\": \"· dias úteis\",\n      \"· overnight on-call\": \"· plantão da madrugada\",\n      \"If the assigned caregiver can't pick up, the call cascades to the next person in the circle — so a call is never left unanswered, at any hour.\": \"Se o cuidador designado não puder atender, a ligação segue em cascata para a próxima pessoa do círculo — assim, nenhuma ligação fica sem resposta, a qualquer hora.\",\n      \"You build the care team.\": \"Você monta a equipe de cuidado.\",\n      \"They press one button.\": \"Eles apertam um botão.\",\n      \"All of the complexity lives with you, in the dashboard. For your loved one, it stays as simple as a single call.\": \"Toda a complexidade fica com você, no painel. Para quem você ama, continua tão simples quanto uma única ligação.\",\n      \"Claim one number\": \"Garanta um número\",\n      \"Pick a single iCanCall number and set it as a speed-dial or a one-touch button on whatever device they use — a phone, a tablet, or an adaptive caller. That one button is all they ever need.\": \"Escolha um único número iCanCall e configure-o como discagem rápida ou botão de um toque no aparelho que eles usam — um telefone, um tablet ou um telefone adaptado. Esse botão é tudo de que eles vão precisar.\",\n      \"Build the care team\": \"Monte a equipe de cuidado\",\n      \"Add up to six caregivers — family, co-caregivers, a day program, a group home, an on-call nurse — and set who should answer, and when, across the day.\": \"Adicione até seis cuidadores — família, cocuidadores, um centro-dia, uma residência assistida, uma enfermeira de plantão — e defina quem deve atender, e quando, ao longo do dia.\",\n      \"They reach the right person\": \"Eles falam com a pessoa certa\",\n      \"When they press call, iCanCall routes to the right caregiver for that moment and\": \"Quando eles apertam para ligar, o iCanCall encaminha ao cuidador certo para aquele momento e\",\n      \"cascades\": \"segue em cascata\",\n      \"on if needed — while every caregiver gets an instant text that the call came in.\": \"adiante, se necessário — enquanto cada cuidador recebe um SMS imediato avisando que a ligação chegou.\",\n      \"Try it yourself\": \"Experimente você mesmo\",\n      \"Build the care team that answers.\": \"Monte a equipe de cuidado que atende.\",\n      \"Add the caregivers you trust, set their order, then place a pretend call. Choose\": \"Adicione os cuidadores em quem você confia, defina a ordem e faça uma ligação simulada. Escolha a\",\n      \"cascade\": \"cascata\",\n      \"— ring each caregiver in turn until someone picks up — or a simple\": \"— que chama cada cuidador, um de cada vez, até alguém atender — ou um simples\",\n      \"caller menu\": \"menu vocal\",\n      \". Your loved one only ever makes one call.\": \". Quem você ama só faz uma única ligação.\",\n      \"Routing mode\": \"Modo de encaminhamento\",\n      \"Call cascade\": \"Cascata de chamadas\",\n      \"Caller menu\": \"Menu vocal\",\n      \"You set this once in the dashboard\": \"Você define isso uma única vez no painel\",\n      \"The care team\": \"A equipe de cuidado\",\n      \"\/6 contacts\": \"\/6 contatos\",\n      \"Ready\": \"Pronto\",\n      \"Press call to start routing\": \"Toque em ligar para iniciar o encaminhamento\",\n      \"Place a call\": \"Fazer uma ligação\",\n      \"Toggle a caregiver to \\\"Busy\\\" to see the cascade skip ahead.\": \"Marque um cuidador como “Ocupado” para ver a cascata passar adiante.\",\n      \"Why caregivers choose iCanCall\": \"Por que os cuidadores escolhem o iCanCall\",\n      \"Simple for them.\": \"Simples para eles.\",\n      \"Complete for you.\": \"Completo para você.\",\n      \"One press, one action\": \"Um toque, uma ação\",\n      \"No contact list, no menus, no choosing. A single number or button is the entire interaction — designed for those a list would only overwhelm.\": \"Sem lista de contatos, sem menus, sem escolhas. Um único número ou botão é toda a interação — pensado para quem uma lista só iria sobrecarregar.\",\n      \"Always the right caregiver\": \"Sempre o cuidador certo\",\n      \"Time-aware routing sends the call to whoever's on for that part of the day — primary caregiver, day program, evening, or overnight on-call.\": \"O encaminhamento por horário envia a ligação a quem está responsável naquela parte do dia — cuidador principal, centro-dia, noite ou plantão da madrugada.\",\n      \"Whole team alerted\": \"Toda a equipe avisada\",\n      \"Every caregiver gets a text the instant a call comes in — vital when a loved one may not be able to explain where they are or what they need.\": \"Cada cuidador recebe um SMS no instante em que a ligação chega — essencial quando a pessoa talvez não consiga explicar onde está ou do que precisa.\",\n      \"No gaps at handoff\": \"Sem lacunas na troca de turno\",\n      \"Coverage passes cleanly from one caregiver to the next. If the assigned person can't answer, the call cascades onward — never a dead end.\": \"A cobertura passa de um cuidador ao outro sem falhas. Se a pessoa designada não puder atender, a ligação segue em cascata — nunca um beco sem saída.\",\n      \"Works with their setup\": \"Funciona com o que eles já usam\",\n      \"Program it on a phone, a tablet, an adaptive caller, or a single speed-dial button. No app to install and nothing new to learn.\": \"Programe em um telefone, um tablet, um telefone adaptado ou um único botão de discagem rápida. Sem aplicativo para instalar e nada novo para aprender.\",\n      \"Private & protected\": \"Privado e protegido\",\n      \"Every caregiver's personal number stays hidden behind the single iCanCall line. All routing is encrypted, and your data is never sold.\": \"O número pessoal de cada cuidador fica oculto atrás da linha única do iCanCall. Todo o encaminhamento é criptografado, e seus dados nunca são vendidos.\",\n      \"Simple, honest pricing\": \"Preços simples e honestos\",\n      \"Coverage that costs less\": \"Cobertura que custa menos\",\n      \"than a single co-pay.\": \"que uma única coparticipação.\",\n      \"\/ month\": \"\/ mês\",\n      \"What caregivers ask us most.\": \"O que os cuidadores mais nos perguntam.\",\n      \"My loved one is non-verbal or can't explain where they are. Does this still help?\": \"Meu familiar não fala ou não consegue explicar onde está. Isso ainda ajuda?\",\n      \"Yes — that's exactly who it's built for. They don't need to choose a contact or say anything in particular. One press connects them to a caregiver who knows them, and every caregiver in the circle gets an instant text that the call came in, so the right people are aware right away.\": \"Sim — é exatamente para quem ele foi criado. A pessoa não precisa escolher um contato nem dizer nada em especial. Um toque a conecta a um cuidador que a conhece, e cada cuidador do círculo recebe um SMS imediato avisando que a ligação chegou, para que as pessoas certas saibam na hora.\",\n      \"Can it work as a single speed-dial button or with an adaptive device?\": \"Pode funcionar como um único botão de discagem rápida ou com um dispositivo adaptado?\",\n      \"Absolutely. Because iCanCall is just one phone number, you can program it as a one-touch speed dial, a favorite, or a single button on whatever phone, tablet, or adaptive caller they already use. There's no app to install and nothing new for them to learn.\": \"Com certeza. Como o iCanCall é apenas um número de telefone, você pode programá-lo como discagem rápida de um toque, como favorito ou como um único botão no telefone, tablet ou telefone adaptado que a pessoa já usa. Não há aplicativo para instalar nem nada novo para aprender.\",\n      \"How do multiple caregivers and shift changes work?\": \"Como funcionam vários cuidadores e as trocas de turno?\",\n      \"From your dashboard, you set who should answer at different times of day — a day program on weekday mornings, a primary caregiver in the afternoon, an evening caregiver, an overnight on-call nurse. The same number routes to whoever's on for that window, so coverage hands off without a gap.\": \"No painel, você define quem deve atender em cada horário do dia — um centro-dia nas manhãs dos dias úteis, um cuidador principal à tarde, um cuidador à noite, uma enfermeira de plantão na madrugada. O mesmo número encaminha a quem está responsável naquele período, para que a cobertura passe adiante sem lacunas.\",\n      \"What if the assigned caregiver can't pick up?\": \"E se o cuidador designado não puder atender?\",\n      \"The call cascades to the next person in the circle until someone answers. If everyone is unreachable, it goes to voicemail that's transcribed and texted to the whole team — so a call is never simply lost.\": \"A ligação segue em cascata para a próxima pessoa do círculo até alguém atender. Se ninguém estiver disponível, ela vai para a caixa postal, que é transcrita e enviada por SMS a toda a equipe — assim, uma ligação nunca se perde.\",\n      \"Can a group home or day program be part of the circle?\": \"Uma residência assistida ou um centro-dia pode fazer parte do círculo?\",\n      \"Yes. Any phone number can be a contact — a group home line, a day program, a case manager, a nurse, or family. You decide the order and the times, and adjust anytime as the care plan changes.\": \"Sim. Qualquer número de telefone pode ser um contato — a linha de uma residência assistida, um centro-dia, um gestor de caso, uma enfermeira ou a família. Você decide a ordem e os horários, e ajusta quando quiser, conforme o plano de cuidado muda.\",\n      \"Is iCanCall a medical alert or emergency service?\": \"O iCanCall é um serviço de alerta médico ou de emergência?\",\n      \"No — iCanCall connects your loved one to the people on their care team quickly and simply. It complements, but does not replace, 911 or a medical-monitoring service. For life-threatening emergencies, always teach and rely on 911 where possible.\": \"Não — o iCanCall conecta quem você ama às pessoas da equipe de cuidado, de forma rápida e simples. Ele complementa, mas não substitui, o 911 nem um serviço de monitoramento médico. Em emergências com risco de vida, sempre ensine e conte com o 911 quando possível.\",\n      \"One number. The right person. Every time.\": \"Um número. A pessoa certa. Sempre.\",\n      \"Give your loved one the independence of reaching help on their own — and give your care team the certainty of always being there. Set up iCanCall in minutes.\": \"Dê a quem você ama a independência de pedir ajuda por conta própria — e dê à sua equipe de cuidado a certeza de estar sempre presente. Configure o iCanCall em minutos.\",\n      \"One memorable number — or one button — that always connects your loved one to the right caregiver, while keeping the whole team in the loop.\": \"Um número memorável — ou um botão — que sempre conecta quem você ama ao cuidador certo, mantendo toda a equipe informada.\",\n      \"For every family\": \"Para todas as famílias\",\n      \"iCanCall, Inc. All rights reserved.\": \"iCanCall, Inc. Todos os direitos reservados.\"\n    },\n    \"attrs\": {\n      \"Name\": \"Nome\",\n      \"Relationship\": \"Parentesco\",\n      \"Role\": \"Função\"\n    }\n  },\n  \"de\": {\n    \"text\": {\n      \"How it works\": \"Funktionsweise\",\n      \"Features\": \"Funktionen\",\n      \"Who it's for\": \"Für wen\",\n      \"Pricing\": \"Preise\",\n      \"FAQ\": \"FAQ\",\n      \"Login\": \"Anmelden\",\n      \"See how it works\": \"Wie es funktioniert\",\n      \"Select a Plan\": \"Tarif wählen\",\n      \"See How We Compare\": \"Sehen Sie, wie wir uns vergleichen\",\n      \"Comparison Chart\": \"Vergleichstabelle\",\n      \"Key:\": \"Legende:\",\n      \"Included\": \"Inklusive\",\n      \"Not available\": \"Nicht verfügbar\",\n      \"Limited or conditional\": \"Teilweise Eingeschränkt oder optional\",\n      \"Product\": \"Produkt\",\n      \"Who\": \"Für wen\",\n      \"Company\": \"Unternehmen\",\n      \"Trust\": \"Vertrauen\",\n      \"Parents\": \"Eltern\",\n      \"Caregivers\": \"Betreuer\",\n      \"Seniors\": \"Senioren\",\n      \"About\": \"Über uns\",\n      \"Careers\": \"Karriere\",\n      \"Stories\": \"Kundengeschichten\",\n      \"Contact\": \"Kontakt\",\n      \"Privacy\": \"Datenschutz\",\n      \"Security\": \"Sicherheit\",\n      \"Terms\": \"AGB\",\n      \"Made for the moments that matter.\": \"Gemacht für die Momente, die zählen.\",\n      \"© 2026 iCanCall, Inc. All rights reserved.\": \"© 2026 iCanCall, Inc. Alle Rechte vorbehalten.\",\n      \"One memorable number that always connects to the people who matter most. Safety on autopilot.\": \"Eine einprägsame Nummer, die immer mit den wichtigsten Menschen verbindet. Sicherheit auf Autopilot.\",\n      \"Ready to secure your family?\": \"Bereit, Ihre Familie abzusichern?\",\n      \"Give your loved ones the safety and simplicity of iCanCall today. Set up in under 5 minutes.\": \"Geben Sie Ihren Lieben heute die Einfachheit von iCanCall. In unter 5 Minuten einsatzbereit.\",\n      \"Get Started Now\": \"Jetzt starten\",\n      \"Back to Homepage\": \"Zur Startseite\",\n      \"Set up in minutes · No setup fees · Cancel anytime\": \"In Minuten eingerichtet · Keine Gebühr · Jederzeit kündbar\",\n      \"One number your parent will never forget.\": \"Eine Nummer, die Ihr Elternteil nie vergessen wird.\",\n      \"iCanCall connects seniors to their circle of support without smartphones, apps, or complicated tech. Starting at $12.99\/mo.\": \"iCanCall verbindet Senioren mit ihrem Betreuungskreis, ohne Smartphones, Apps oder komplizierte Technik. Ab $12.99\/Monat.\",\n      \"See how it works for seniors\": \"Funktionsweise für Senioren ansehen\",\n      \"Set it up for them\": \"Für sie einrichten\",\n      \"Get started\": \"Jetzt starten\",\n      \"Select a plan for them\": \"Einen Tarif für sie wählen\",\n      \"How it works for seniors\": \"Funktionsweise für Senioren\",\n      \"Safe, screen-free call routing for elderly parents.\": \"Sichere, bildschirmfreie Rufweiterleitung für ältere Eltern.\",\n      \"One number your child will never forget.\": \"Eine Nummer, die Ihr Kind nie vergessen wird.\",\n      \"iCanCall connects your kids to their circle of care without screen time, apps, or complex devices. Starting at $12.99\/mo.\": \"iCanCall verbindet Ihre Kinder mit ihrem Betreuungskreis ohne Bildschirmzeit, Apps oder komplizierte Geräte. Ab $12.99\/Monat.\",\n      \"See how it works for kids\": \"Funktionsweise für Kinder ansehen\",\n      \"How it works for parents\": \"Funktionsweise für Eltern\",\n      \"Safe, screen-free call routing for young children.\": \"Sichere, bildschirmfreie Rufweiterleitung für junge Kinder.\",\n      \"One number your client will never forget.\": \"Eine Nummer, die Ihr Angehöriger nie vergessen wird.\",\n      \"iCanCall connects your clients or loved ones to their care network instantly, without complex devices. Starting at $12.99\/mo.\": \"iCanCall verbindet Angehörige sofort mit ihrem Pflegekreis, ganz ohne Zusatzgeräte. Ab $12.99\/Monat.\",\n      \"See how it works for caregivers\": \"Funktionsweise für Betreuer ansehen\",\n      \"How it works for caregivers\": \"Funktionsweise für Betreuer\",\n      \"Safe, screen-free call routing for caregivers.\": \"Sichere, bildschirmfreie Rufweiterleitung für Pflegekräfte.\",\n      \"Aging parent\": \"Älterer Elternteil\",\n      \"Aging parents\": \"Ältere Eltern\",\n      \"Child calling home\": \"Kind ruft zu Hause an\",\n      \"Young children\": \"Junge Kinder\",\n      \"Special-abilities care\": \"Besondere Bedürfnisse\",\n      \"Special abilities & caregivers\": \"Besondere Bedürfnisse & Betreuer\",\n      \"Essential\": \"Essential\",\n      \"Essential Plan\": \"Essential-Tarif\",\n      \"Pro\": \"Pro\",\n      \"Pro Plan\": \"Pro-Tarif\",\n      \"Select Essential\": \"Essential wählen\",\n      \"Select Pro\": \"Pro wählen\",\n      \"Most popular\": \"Am beliebtesten\",\n      \"Monthly\": \"Monatlich\",\n      \"Annual\": \"Jährlich\",\n      \"Save 17%\": \"17% sparen\",\n      \"Save 20%\": \"20% sparen\",\n      \"One number for one loved one.\": \"Eine Nummer für eine pflegebedürftige Person.\",\n      \"Full protection for the whole circle.\": \"Kompletter Schutz für den gesamten Rufkreis.\",\n      \"Billed monthly · cancel anytime\": \"Monatlich abgerechnet · jederzeit kündbar\",\n      \"Just $10.75\/mo, billed annually\": \"Nur $10.75\/Monat bei jährlicher Abrechnung\",\n      \"Just $16.58\/mo, billed annually\": \"Nur $16.58\/Monat bei jährlicher Abrechnung\",\n      \"Everything included in the plan:\": \"Alles im Tarif enthalten:\",\n      \"1 number included\": \"1 eigene Sicherheitsnummer\",\n      \"3 routable trusted contacts\": \"Bis zu 3 Kontakte im Rufkreis\",\n      \"Cascade routing + Caller Menu\": \"Kaskadenweiterleitung + Sprachmenü\",\n      \"30 voice minutes\": \"30 Sprachminuten\",\n      \"Bilingual greeting options\": \"Zweisprachige Ansagen möglich\",\n      \"Works on any phone — no app needed\": \"Funktioniert auf jedem Telefon — ohne App\",\n      \"2 dedicated phone numbers\": \"2 eigene Sicherheitsnummern\",\n      \"6 routable trusted contacts\": \"Bis zu 6 Kontakte im Rufkreis\",\n      \"60 minutes included\": \"60 Minuten inklusive\",\n      \"Real-time call alerts\": \"Anrufsignale in Echtzeit\",\n      \"Admin dashboard\": \"Betreuer-Dashboard\",\n      \"SMS & email notifications\": \"SMS- & E-Mail-Benachrichtigungen\",\n      \"Stories from families\": \"Kundengeschichten\",\n      \"The calls that got through.\": \"Die Anrufe, die zustande kamen.\",\n      \"Questions, answered\": \"Häufig gestellte Fragen\",\n      \"Everything you might ask.\": \"Alles, was Sie fragen möchten.\",\n      \"Ringing…\": \"Es klingelt…\",\n      \"Connected ✓\": \"Verbunden ✓\",\n      \"Care Team\": \"Care Team\",\n      \"Select Plan\": \"Tarif wählen\",\n      \"One number for one parent.\": \"Eine Nummer für ein Elternteil.\",\n      \"Full coverage for the whole care team.\": \"Volle Abdeckung für das gesamte Pflegeteam.\",\n      \"Built for shared caregiving across several loved ones, with room for a second caregiver.\": \"Für die gemeinsame Betreuung mehrerer Angehöriger — mit Platz für eine zweite Pflegeperson.\",\n      \"Just $12.42\/mo, billed annually\": \"Nur $12.42\/Monat bei jährlicher Abrechnung\",\n      \"Just $20.75\/mo, billed annually\": \"Nur $20.75\/Monat bei jährlicher Abrechnung\",\n      \"Just $41.58\/mo, billed annually\": \"Nur $41.58\/Monat bei jährlicher Abrechnung\",\n      \"1 Dedicated Safety Number\": \"1 eigene Sicherheitsnummer\",\n      \"Up to 3 Roster Contacts\": \"Bis zu 3 Kontakte im Rufkreis\",\n      \"Call Cascade (Sequential)\": \"Kaskadenweiterleitung (nacheinander)\",\n      \"Real-time Email Alerts\": \"E-Mail-Benachrichtigungen in Echtzeit\",\n      \"Standard voicemail box\": \"Standard-Mailbox\",\n      \"30-day money-back guarantee\": \"30 Tage Geld-zurück-Garantie\",\n      \"2 Dedicated Safety Numbers\": \"2 eigene Sicherheitsnummern\",\n      \"Up to 6 Roster Contacts\": \"Bis zu 6 Kontakte im Rufkreis\",\n      \"Cascade & Caller Menu (IVR)\": \"Kaskade & Sprachmenü (IVR)\",\n      \"Time-of-day Scheduling\": \"Zeitgesteuerte Weiterleitung\",\n      \"Bilingual Greeting Options\": \"Zweisprachige Ansagen möglich\",\n      \"Instant Voicemail Email Transcriptions\": \"Sofortige Mailbox-Transkripte per E-Mail\",\n      \"5 Dedicated Safety Numbers\": \"5 eigene Sicherheitsnummern\",\n      \"Up to 15 Roster Contacts per Number\": \"Bis zu 15 Kontakte im Rufkreis pro Nummer\",\n      \"All Routing Modes + Scheduling\": \"Alle Weiterleitungsarten + Zeitsteuerung\",\n      \"150 pooled voice minutes\": \"150 Sprachminuten zur gemeinsamen Nutzung\",\n      \"2 Caregiver Logins\": \"2 Zugänge für Pflegepersonen\",\n      \"All plans include cascade routing, the caller menu, and 24\/7 reliability. Set it up for your parent in minutes — cancel anytime.\": \"Alle Tarife enthalten Kaskadenweiterleitung, Sprachmenü und rund um die Uhr zuverlässigen Betrieb. In wenigen Minuten für Ihre Eltern eingerichtet — jederzeit kündbar.\",\n      \"All plans include cascade routing, the caller menu, and 24\/7 reliability. Set it up in minutes — cancel anytime.\": \"Alle Tarife enthalten Kaskadenweiterleitung, Sprachmenü und rund um die Uhr zuverlässigen Betrieb. In wenigen Minuten eingerichtet — jederzeit kündbar.\",\n      \"All plans include cascade routing, the caller menu, time-aware coverage, and 24\/7 reliability. Cancel anytime.\": \"Alle Tarife enthalten Kaskadenweiterleitung, Sprachmenü, zeitgesteuerte Abdeckung und rund um die Uhr zuverlässigen Betrieb. Jederzeit kündbar.\",\n      \"Designed for the moments that matter\": \"Entwickelt für die wichtigsten Momente\",\n      \"iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.\": \"iCanCall passt perfekt in das Leben von Familien, die eine einfache und bildschirmfreie Sicherheitsverbindung wünschen.\",\n      \"For Kids\": \"Für Kinder\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"Ermöglicht es Kindern, die Familie von jedem Festnetz- oder Standardtelefon zu erreichen, ohne Ablenkungen durch Smartphones.\",\n      \"For Seniors\": \"Für Senioren\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"Eine Lebenslinie für Eltern und Großeltern. Sie müssen sich nur eine einzige Nummer merken, um die Familie zu erreichen.\",\n      \"For Special Needs\": \"Besondere Bedürfnisse\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"Vereinfacht das Telefonieren für Menschen mit kognitiven oder körperlichen Einschränkungen und bietet direkten Support.\",\n      \"Coverage\": \"Abdeckung\",\n      \"Build the circle\": \"Rufkreis aufbauen\",\n      \"Questions\": \"Fragen\",\n      \"For families & caregivers of loved ones with special abilities\": \"Für Familien & Betreuer von Angehörigen mit besonderen Bedürfnissen\",\n      \"One press.\": \"Ein Tastendruck.\",\n      \"The right caregiver, every time.\": \"Immer der richtige Betreuer.\",\n      \"For a loved one who can't work through a contact list, a single number — or one speed-dial button — connects them to exactly the right person on your care team. You decide who answers and when. They just press call.\": \"Für einen Angehörigen, der sich nicht durch eine Kontaktliste arbeiten kann, stellt eine einzige Nummer – oder eine einzige Kurzwahltaste – die Verbindung zu genau der richtigen Person in Ihrem Pflegeteam her. Sie entscheiden, wer wann abnimmt. Ihr Angehöriger drückt einfach auf Anrufen.\",\n      \"No list to navigate. No decision to make.\": \"Keine Liste zum Durchsuchen. Keine Entscheidung zu treffen.\",\n      \"One press reaches a real person who knows them — and your whole care team is alerted the moment they call.\": \"Ein Tastendruck erreicht einen echten Menschen, der Ihren Angehörigen kennt – und Ihr gesamtes Pflegeteam wird im Moment des Anrufs benachrichtigt.\",\n      \"Daniel's iCanCall number\": \"Daniels iCanCall-Nummer\",\n      \"Incoming call\": \"Eingehender Anruf\",\n      \"One press finds the right caregiver, in order, until someone who knows him answers\": \"Ein Tastendruck findet den richtigen Betreuer, der Reihe nach, bis jemand abnimmt, der ihn kennt\",\n      \"Mom · primary caregiver\": \"Mama · Hauptbetreuung\",\n      \"Standing by\": \"In Bereitschaft\",\n      \"Co-caregiver\": \"Mitbetreuer\",\n      \"Day program\": \"Tagesbetreuung\",\n      \"Nurse Dawn\": \"Schwester Dawn\",\n      \"On-call\": \"Rufbereitschaft\",\n      \"Independence for them, reassurance for you\": \"Selbstständigkeit für Ihre Lieben, Gewissheit für Sie\",\n      \"press to reach help\": \"Tastendruck bis zur Hilfe\",\n      \"lists to navigate\": \"Listen zum Durchsuchen\",\n      \"caregiver coverage\": \"Abdeckung durch Betreuer\",\n      \"Whole\": \"Gesamtes\",\n      \"care team alerted\": \"Pflegeteam informiert\",\n      \"Around-the-clock coverage\": \"Abdeckung rund um die Uhr\",\n      \"Someone is always responsible.\": \"Es ist immer jemand zuständig.\",\n      \"The number never changes — but who answers it does. iCanCall routes the same call to the right caregiver for the time of day, so coverage hands off cleanly and there's never a gap.\": \"Die Nummer ändert sich nie – wer abnimmt, schon. iCanCall leitet denselben Anruf an den Betreuer weiter, der zur jeweiligen Tageszeit zuständig ist. So gelingt jede Übergabe reibungslos, und es entsteht nie eine Lücke.\",\n      \"Daniel's number — one number, all day\": \"Daniels Nummer – eine Nummer, den ganzen Tag\",\n      \"Right now:\": \"Gerade jetzt:\",\n      \"On-call · overnight\": \"Rufbereitschaft · nachts\",\n      \"Weekday day program\": \"Tagesbetreuung werktags\",\n      \"Maria (Mom)\": \"Maria (Mama)\",\n      \"Primary caregiver\": \"Hauptbetreuung\",\n      \"Evening\": \"Abend\",\n      \"12a\": \"0 Uhr\",\n      \"6a\": \"6 Uhr\",\n      \"12p\": \"12 Uhr\",\n      \"6p\": \"18 Uhr\",\n      \"· primary, afternoons\": \"· Hauptbetreuung, nachmittags\",\n      \"· evenings\": \"· abends\",\n      \"· weekdays\": \"· werktags\",\n      \"· overnight on-call\": \"· nächtliche Rufbereitschaft\",\n      \"If the assigned caregiver can't pick up, the call cascades to the next person in the circle — so a call is never left unanswered, at any hour.\": \"Kann der zuständige Betreuer nicht abnehmen, geht der Anruf kaskadenartig an die nächste Person im Rufkreis weiter – so bleibt kein Anruf unbeantwortet, zu keiner Uhrzeit.\",\n      \"You build the care team.\": \"Sie stellen das Pflegeteam zusammen.\",\n      \"They press one button.\": \"Ihr Angehöriger drückt eine Taste.\",\n      \"All of the complexity lives with you, in the dashboard. For your loved one, it stays as simple as a single call.\": \"Die ganze Komplexität liegt bei Ihnen, im Dashboard. Für Ihren Angehörigen bleibt es so einfach wie ein einziger Anruf.\",\n      \"Claim one number\": \"Eine Nummer sichern\",\n      \"Pick a single iCanCall number and set it as a speed-dial or a one-touch button on whatever device they use — a phone, a tablet, or an adaptive caller. That one button is all they ever need.\": \"Wählen Sie eine einzige iCanCall-Nummer und legen Sie sie als Kurzwahl oder Ein-Tasten-Wahl auf dem Gerät an, das Ihr Angehöriger nutzt – Telefon, Tablet oder adaptives Telefon. Mehr als diese eine Taste braucht es nie.\",\n      \"Build the care team\": \"Das Pflegeteam aufbauen\",\n      \"Add up to six caregivers — family, co-caregivers, a day program, a group home, an on-call nurse — and set who should answer, and when, across the day.\": \"Fügen Sie bis zu sechs Betreuer hinzu – Familie, Mitbetreuer, eine Tagesbetreuung, eine Wohngruppe, eine Pflegekraft in Rufbereitschaft – und legen Sie fest, wer im Tagesverlauf wann abnehmen soll.\",\n      \"They reach the right person\": \"Die richtige Person erreichen\",\n      \"When they press call, iCanCall routes to the right caregiver for that moment and\": \"Wenn Ihr Angehöriger auf Anrufen drückt, leitet iCanCall den Anruf an den in diesem Moment richtigen Betreuer und bei Bedarf\",\n      \"cascades\": \"kaskadenartig\",\n      \"on if needed — while every caregiver gets an instant text that the call came in.\": \"weiter – während jeder Betreuer sofort eine SMS erhält, dass der Anruf eingegangen ist.\",\n      \"Try it yourself\": \"Probieren Sie es selbst aus\",\n      \"Build the care team that answers.\": \"Bauen Sie das Pflegeteam, das abnimmt.\",\n      \"Add the caregivers you trust, set their order, then place a pretend call. Choose\": \"Fügen Sie die Betreuer hinzu, denen Sie vertrauen, legen Sie die Reihenfolge fest und starten Sie dann einen Probeanruf. Wählen Sie die\",\n      \"cascade\": \"Kaskade\",\n      \"— ring each caregiver in turn until someone picks up — or a simple\": \"– jeder Betreuer wird nacheinander angerufen, bis jemand abnimmt – oder ein einfaches\",\n      \"caller menu\": \"Sprachmenü\",\n      \". Your loved one only ever makes one call.\": \". Ihr Angehöriger tätigt immer nur einen einzigen Anruf.\",\n      \"Routing mode\": \"Weiterleitungsart\",\n      \"Call cascade\": \"Anrufkaskade\",\n      \"Caller menu\": \"Sprachmenü\",\n      \"You set this once in the dashboard\": \"Das legen Sie einmal im Dashboard fest\",\n      \"The care team\": \"Das Pflegeteam\",\n      \"\/6 contacts\": \"\/6 Kontakte\",\n      \"Ready\": \"Bereit\",\n      \"Press call to start routing\": \"Starten Sie einen Anruf, um die Weiterleitung zu beginnen\",\n      \"Place a call\": \"Anruf starten\",\n      \"Toggle a caregiver to \\\"Busy\\\" to see the cascade skip ahead.\": \"Schalten Sie einen Betreuer auf „Besetzt“, um zu sehen, wie die Kaskade ihn überspringt.\",\n      \"Why caregivers choose iCanCall\": \"Warum Betreuer iCanCall wählen\",\n      \"Simple for them.\": \"Einfach für Ihre Lieben.\",\n      \"Complete for you.\": \"Umfassend für Sie.\",\n      \"One press, one action\": \"Ein Tastendruck, eine Aktion\",\n      \"No contact list, no menus, no choosing. A single number or button is the entire interaction — designed for those a list would only overwhelm.\": \"Keine Kontaktliste, keine Menüs, keine Auswahl. Eine einzige Nummer oder Taste ist die gesamte Bedienung – gemacht für Menschen, die eine Liste nur überfordern würde.\",\n      \"Always the right caregiver\": \"Immer der richtige Betreuer\",\n      \"Time-aware routing sends the call to whoever's on for that part of the day — primary caregiver, day program, evening, or overnight on-call.\": \"Die zeitgesteuerte Weiterleitung schickt den Anruf an die Person, die zu dieser Tageszeit zuständig ist – Hauptbetreuung, Tagesbetreuung, Abenddienst oder nächtliche Rufbereitschaft.\",\n      \"Whole team alerted\": \"Das ganze Team informiert\",\n      \"Every caregiver gets a text the instant a call comes in — vital when a loved one may not be able to explain where they are or what they need.\": \"Jeder Betreuer erhält eine SMS, sobald ein Anruf eingeht – entscheidend, wenn ein Angehöriger vielleicht nicht erklären kann, wo er ist oder was er braucht.\",\n      \"No gaps at handoff\": \"Keine Lücken bei der Übergabe\",\n      \"Coverage passes cleanly from one caregiver to the next. If the assigned person can't answer, the call cascades onward — never a dead end.\": \"Die Zuständigkeit geht nahtlos von einem Betreuer zum nächsten über. Kann die zuständige Person nicht abnehmen, läuft der Anruf kaskadenartig weiter – nie eine Sackgasse.\",\n      \"Works with their setup\": \"Passt zu den vorhandenen Geräten\",\n      \"Program it on a phone, a tablet, an adaptive caller, or a single speed-dial button. No app to install and nothing new to learn.\": \"Richten Sie die Nummer auf einem Telefon, einem Tablet, einem adaptiven Telefon oder einer einzelnen Kurzwahltaste ein. Keine App zu installieren und nichts Neues zu lernen.\",\n      \"Private & protected\": \"Privat & geschützt\",\n      \"Every caregiver's personal number stays hidden behind the single iCanCall line. All routing is encrypted, and your data is never sold.\": \"Die private Nummer jedes Betreuers bleibt hinter der einen iCanCall-Nummer verborgen. Die gesamte Weiterleitung ist verschlüsselt, und Ihre Daten werden niemals verkauft.\",\n      \"Simple, honest pricing\": \"Einfache, ehrliche Preise\",\n      \"Coverage that costs less\": \"Absicherung, die weniger kostet\",\n      \"than a single co-pay.\": \"als eine einzige Zuzahlung.\",\n      \"\/ month\": \"\/ Monat\",\n      \"What caregivers ask us most.\": \"Was Betreuer uns am häufigsten fragen.\",\n      \"My loved one is non-verbal or can't explain where they are. Does this still help?\": \"Mein Angehöriger spricht nicht oder kann nicht erklären, wo er ist. Hilft das trotzdem?\",\n      \"Yes — that's exactly who it's built for. They don't need to choose a contact or say anything in particular. One press connects them to a caregiver who knows them, and every caregiver in the circle gets an instant text that the call came in, so the right people are aware right away.\": \"Ja – genau dafür ist es gemacht. Ihr Angehöriger muss keinen Kontakt auswählen und nichts Bestimmtes sagen. Ein Tastendruck verbindet ihn mit einem Betreuer, der ihn kennt, und jeder Betreuer im Rufkreis erhält sofort eine SMS, dass der Anruf eingegangen ist – so wissen die richtigen Menschen gleich Bescheid.\",\n      \"Can it work as a single speed-dial button or with an adaptive device?\": \"Funktioniert es als einzelne Kurzwahltaste oder mit einem adaptiven Gerät?\",\n      \"Absolutely. Because iCanCall is just one phone number, you can program it as a one-touch speed dial, a favorite, or a single button on whatever phone, tablet, or adaptive caller they already use. There's no app to install and nothing new for them to learn.\": \"Auf jeden Fall. Da iCanCall einfach eine Telefonnummer ist, können Sie sie als Ein-Tasten-Kurzwahl, als Favorit oder als einzelne Taste auf dem Telefon, Tablet oder adaptiven Telefon einrichten, das bereits genutzt wird. Keine App zu installieren und nichts Neues zu lernen.\",\n      \"How do multiple caregivers and shift changes work?\": \"Wie funktioniert es mit mehreren Betreuern und Schichtwechseln?\",\n      \"From your dashboard, you set who should answer at different times of day — a day program on weekday mornings, a primary caregiver in the afternoon, an evening caregiver, an overnight on-call nurse. The same number routes to whoever's on for that window, so coverage hands off without a gap.\": \"In Ihrem Dashboard legen Sie fest, wer zu welcher Tageszeit abnehmen soll – eine Tagesbetreuung an Werktagvormittagen, die Hauptbetreuung am Nachmittag, ein Betreuer am Abend, eine Pflegekraft in nächtlicher Rufbereitschaft. Dieselbe Nummer leitet an die Person weiter, die im jeweiligen Zeitfenster zuständig ist – so gelingt die Übergabe ohne Lücke.\",\n      \"What if the assigned caregiver can't pick up?\": \"Was, wenn der zuständige Betreuer nicht abnehmen kann?\",\n      \"The call cascades to the next person in the circle until someone answers. If everyone is unreachable, it goes to voicemail that's transcribed and texted to the whole team — so a call is never simply lost.\": \"Der Anruf geht kaskadenartig an die nächste Person im Rufkreis weiter, bis jemand abnimmt. Ist niemand erreichbar, geht er auf eine Mailbox, deren Nachricht transkribiert und per SMS an das ganze Team geschickt wird – so geht ein Anruf nie einfach verloren.\",\n      \"Can a group home or day program be part of the circle?\": \"Kann eine Wohngruppe oder Tagesbetreuung Teil des Rufkreises sein?\",\n      \"Yes. Any phone number can be a contact — a group home line, a day program, a case manager, a nurse, or family. You decide the order and the times, and adjust anytime as the care plan changes.\": \"Ja. Jede Telefonnummer kann ein Kontakt sein – der Anschluss einer Wohngruppe, eine Tagesbetreuung, ein Fallmanager, eine Pflegekraft oder die Familie. Sie bestimmen Reihenfolge und Zeiten und passen sie jederzeit an, wenn sich der Betreuungsplan ändert.\",\n      \"Is iCanCall a medical alert or emergency service?\": \"Ist iCanCall ein Hausnotruf oder Notdienst?\",\n      \"No — iCanCall connects your loved one to the people on their care team quickly and simply. It complements, but does not replace, 911 or a medical-monitoring service. For life-threatening emergencies, always teach and rely on 911 where possible.\": \"Nein – iCanCall verbindet Ihren Angehörigen schnell und einfach mit den Menschen in seinem Pflegeteam. Es ergänzt den Notruf 911 oder einen medizinischen Überwachungsdienst, ersetzt sie aber nicht. Bringen Sie Ihrem Angehörigen für lebensbedrohliche Notfälle nach Möglichkeit immer den Notruf 911 bei und verlassen Sie sich darauf.\",\n      \"One number. The right person. Every time.\": \"Eine Nummer. Die richtige Person. Jedes Mal.\",\n      \"Give your loved one the independence of reaching help on their own — and give your care team the certainty of always being there. Set up iCanCall in minutes.\": \"Schenken Sie Ihrem Angehörigen die Selbstständigkeit, eigenständig Hilfe zu erreichen – und Ihrem Pflegeteam die Gewissheit, immer da zu sein. Richten Sie iCanCall in wenigen Minuten ein.\",\n      \"One memorable number — or one button — that always connects your loved one to the right caregiver, while keeping the whole team in the loop.\": \"Eine einprägsame Nummer – oder eine einzige Taste –, die Ihren Angehörigen immer mit dem richtigen Betreuer verbindet und das ganze Team auf dem Laufenden hält.\",\n      \"For every family\": \"Für jede Familie\",\n      \"iCanCall, Inc. All rights reserved.\": \"iCanCall, Inc. Alle Rechte vorbehalten.\"\n    },\n    \"attrs\": {\n      \"Name\": \"Name\",\n      \"Relationship\": \"Beziehung\",\n      \"Role\": \"Rolle\"\n    }\n  },\n  \"it\": {\n    \"text\": {\n      \"How it works\": \"Come funziona\",\n      \"Features\": \"Funionalità\",\n      \"Who it's for\": \"Per chi è\",\n      \"Pricing\": \"Prezzi\",\n      \"FAQ\": \"FAQ\",\n      \"Login\": \"Accedi\",\n      \"See how it works\": \"Come funziona\",\n      \"Select a Plan\": \"Scegli un piano\",\n      \"See How We Compare\": \"Scopri Come Ci Confrontiamo\",\n      \"Comparison Chart\": \"Tabella di Confronto\",\n      \"Key:\": \"Legenda:\",\n      \"Included\": \"Incluso\",\n      \"Not available\": \"Non disponibile\",\n      \"Limited or conditional\": \"Parziale Limitato o con condizioni\",\n      \"Product\": \"Prodotto\",\n      \"Who\": \"Per chi è\",\n      \"Company\": \"Società\",\n      \"Trust\": \"Sicurezza e Supporto\",\n      \"Parents\": \"Genitori\",\n      \"Caregivers\": \"Caregiver\",\n      \"Seniors\": \"Anziani\",\n      \"About\": \"Chi siamo\",\n      \"Careers\": \"Lavora con noi\",\n      \"Stories\": \"Storie\",\n      \"Contact\": \"Contatti\",\n      \"Privacy\": \"Privacy policy\",\n      \"Security\": \"Sicurezza dati\",\n      \"Terms\": \"Termini di servizio\",\n      \"Made for the moments that matter.\": \"Creato per i momenti che contano.\",\n      \"© 2026 iCanCall, Inc. All rights reserved.\": \"© 2026 iCanCall, Inc. Tutti i diritti riservati.\",\n      \"One memorable number that always connects to the people who matter most. Safety on autopilot.\": \"Un numero facile da ricordare che collega sempre alle persone più importanti. Sicurezza con autopilota.\",\n      \"Ready to secure your family?\": \"Pronto a proteggere la tua famiglia?\",\n      \"Give your loved ones the safety and simplicity of iCanCall today. Set up in under 5 minutes.\": \"Regala oggi ai tuoi cari la semplicità di iCanCall. Setup in meno di 5 minuti.\",\n      \"Get Started Now\": \"Inizia ora\",\n      \"Back to Homepage\": \"Torna alla home\",\n      \"Set up in minutes · No setup fees · Cancel anytime\": \"Attivo in pochi minuti · Nessun costo di attivazione · Disdici quando vuoi\",\n      \"One number your parent will never forget.\": \"Un solo numero che il tuo genitore non dimenticherà mai.\",\n      \"iCanCall connects seniors to their circle of support without smartphones, apps, or complicated tech. Starting at $12.99\/mo.\": \"iCanCall collega gli anziani alla cerchia di supporto senza smartphone, app o tecnologie complesse. Da $12.99\/mese.\",\n      \"See how it works for seniors\": \"Vedi funzionamento per anziani\",\n      \"Set it up for them\": \"Configura per loro\",\n      \"Get started\": \"Inizia ora\",\n      \"Select a plan for them\": \"Scegli un piano per loro\",\n      \"How it works for seniors\": \"Come funziona per gli anziani\",\n      \"Safe, screen-free call routing for elderly parents.\": \"Inoltro sicuro e senza schermi per genitori anziani.\",\n      \"One number your child will never forget.\": \"Un solo numero che tuo figlio non dimenticherà mai.\",\n      \"iCanCall connects your kids to their circle of care without screen time, apps, or complex devices. Starting at $12.99\/mo.\": \"iCanCall collega i tuoi bambini alla cerchia dei contatti senza schermi, app o dispositivi complessi. Da $12.99\/mese.\",\n      \"See how it works for kids\": \"Vedi funzionamento per bambini\",\n      \"How it works for parents\": \"Come funziona per genitori\",\n      \"Safe, screen-free call routing for young children.\": \"Inoltro sicuro e senza schermi per bambini piccoli.\",\n      \"One number your client will never forget.\": \"Un solo numero che il tuo caro non dimenticherà mai.\",\n      \"iCanCall connects your clients or loved ones to their care network instantly, without complex devices. Starting at $12.99\/mo.\": \"iCanCall collega i tuoi cari alla rete di cure istantaneamente, senza dispositivi complessi. Da $12.99\/mese.\",\n      \"See how it works for caregivers\": \"Vedi funzionamento per caregiver\",\n      \"How it works for caregivers\": \"Come funziona per caregiver\",\n      \"Safe, screen-free call routing for caregivers.\": \"Inoltro sicuro e senza schermi per caregiver.\",\n      \"Aging parent\": \"Genitore anziano\",\n      \"Aging parents\": \"Genitori anziani\",\n      \"Child calling home\": \"Bambino che chiama casa\",\n      \"Young children\": \"Bambini piccoli\",\n      \"Special-abilities care\": \"Bisogni speciali\",\n      \"Special abilities & caregivers\": \"Bisogni speciali & caregiver\",\n      \"Essential\": \"Essenziale\",\n      \"Essential Plan\": \"Piano Essenziale\",\n      \"Pro\": \"Pro\",\n      \"Pro Plan\": \"Piano Pro\",\n      \"Select Essential\": \"Scegli Essenziale\",\n      \"Select Pro\": \"Scegli Pro\",\n      \"Most popular\": \"Più popolare\",\n      \"Monthly\": \"Mensile\",\n      \"Annual\": \"Annuale\",\n      \"Save 17%\": \"Risparmia 17%\",\n      \"Save 20%\": \"Risparmia 20%\",\n      \"One number for one loved one.\": \"Un numero per una persona cara.\",\n      \"Full protection for the whole circle.\": \"Protezione completa per l'intera cerchia.\",\n      \"Billed monthly · cancel anytime\": \"Fatturato mensilmente · cancella quando vuoi\",\n      \"Just $10.75\/mo, billed annually\": \"Solo $10.75\/mese, fatturato annualmente\",\n      \"Just $16.58\/mo, billed annually\": \"Solo $16.58\/mese, fatturato annualmente\",\n      \"Everything included in the plan:\": \"Tutto quello che è incluso nel piano:\",\n      \"1 number included\": \"1 numero di sicurezza dedicato\",\n      \"3 routable trusted contacts\": \"Fino a 3 contatti in lista\",\n      \"Cascade routing + Caller Menu\": \"Inoltro in cascata + Menu vocale\",\n      \"30 voice minutes\": \"30 minuti di conversazione\",\n      \"Bilingual greeting options\": \"Messaggio di benvenuto bilingue\",\n      \"Works on any phone — no app needed\": \"Funziona su qualsiasi telefono — senza app\",\n      \"2 dedicated phone numbers\": \"2 numeri di sicurezza dedicati\",\n      \"6 routable trusted contacts\": \"Fino a 6 contatti in lista\",\n      \"60 minutes included\": \"60 minuti inclusi\",\n      \"Real-time call alerts\": \"Notifiche ed avvisi in tempo reale\",\n      \"Admin dashboard\": \"Dashboard amministratore\",\n      \"SMS & email notifications\": \"Notifiche SMS ed e-mail\",\n      \"Stories from families\": \"Storie di famiglie\",\n      \"The calls that got through.\": \"Le chiamate andate a buon fine.\",\n      \"Questions, answered\": \"Domande frequenti\",\n      \"Everything you might ask.\": \"Tutto quello che potresti chiedere.\",\n      \"Ringing…\": \"Squilla…\",\n      \"Connected ✓\": \"Connesso ✓\",\n      \"Care Team\": \"Team di Cura\",\n      \"Select Plan\": \"Scegli il piano\",\n      \"One number for one parent.\": \"Un numero per un genitore.\",\n      \"Full coverage for the whole care team.\": \"Copertura completa per l'intero team di cura.\",\n      \"Built for shared caregiving across several loved ones, with room for a second caregiver.\": \"Pensato per l'assistenza condivisa di più persone care, con spazio per un secondo caregiver.\",\n      \"Just $12.42\/mo, billed annually\": \"Solo $12.42\/mese, fatturato annualmente\",\n      \"Just $20.75\/mo, billed annually\": \"Solo $20.75\/mese, fatturato annualmente\",\n      \"Just $41.58\/mo, billed annually\": \"Solo $41.58\/mese, fatturato annualmente\",\n      \"1 Dedicated Safety Number\": \"1 numero di sicurezza dedicato\",\n      \"Up to 3 Roster Contacts\": \"Fino a 3 contatti in lista\",\n      \"Call Cascade (Sequential)\": \"Inoltro in cascata (sequenziale)\",\n      \"Real-time Email Alerts\": \"Avvisi e-mail in tempo reale\",\n      \"Standard voicemail box\": \"Segreteria telefonica standard\",\n      \"30-day money-back guarantee\": \"Garanzia soddisfatti o rimborsati in 30 giorni\",\n      \"2 Dedicated Safety Numbers\": \"2 numeri di sicurezza dedicati\",\n      \"Up to 6 Roster Contacts\": \"Fino a 6 contatti in lista\",\n      \"Cascade & Caller Menu (IVR)\": \"Cascata e menu vocale (IVR)\",\n      \"Time-of-day Scheduling\": \"Programmazione per fasce orarie\",\n      \"Bilingual Greeting Options\": \"Messaggio di benvenuto bilingue\",\n      \"Instant Voicemail Email Transcriptions\": \"Trascrizioni istantanee della segreteria via e-mail\",\n      \"5 Dedicated Safety Numbers\": \"5 numeri di sicurezza dedicati\",\n      \"Up to 15 Roster Contacts per Number\": \"Fino a 15 contatti in lista per numero\",\n      \"All Routing Modes + Scheduling\": \"Tutte le modalità di inoltro + programmazione\",\n      \"150 pooled voice minutes\": \"150 minuti di conversazione condivisi\",\n      \"2 Caregiver Logins\": \"2 accessi per caregiver\",\n      \"All plans include cascade routing, the caller menu, and 24\/7 reliability. Set it up for your parent in minutes — cancel anytime.\": \"Tutti i piani includono l'inoltro in cascata, il menu vocale e affidabilità 24\/7. Configuralo per i tuoi genitori in pochi minuti — disdici quando vuoi.\",\n      \"All plans include cascade routing, the caller menu, and 24\/7 reliability. Set it up in minutes — cancel anytime.\": \"Tutti i piani includono l'inoltro in cascata, il menu vocale e affidabilità 24\/7. Configuralo in pochi minuti — disdici quando vuoi.\",\n      \"All plans include cascade routing, the caller menu, time-aware coverage, and 24\/7 reliability. Cancel anytime.\": \"Tutti i piani includono l'inoltro in cascata, il menu vocale, la copertura per fasce orarie e affidabilità 24\/7. Disdici quando vuoi.\",\n      \"Designed for the moments that matter\": \"Ideato per i momenti che contano\",\n      \"iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.\": \"iCanCall si adatta in modo unico alla vita delle famiglie che cercano una comunicazione di sicurezza semplice e senza schermi.\",\n      \"For Kids\": \"Per i bambini\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"Consente ai bambini di chiamare la famiglia da qualsiasi telefono fisso o classico di casa, senza distrazioni tecnologiche.\",\n      \"For Seniors\": \"Per gli anziani\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"Un'ancora di salvezza per genitori o nonni anziani. Devono solo ricordare un numero per contattare tutta la famiglia.\",\n      \"For Special Needs\": \"Bisogni speciali\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"Semplifica il processo di telefonata per persone con limitazioni cognitive o motorie, garantendo accesso rapido all'aiuto.\",\n      \"Coverage\": \"Copertura\",\n      \"Build the circle\": \"Crea la cerchia\",\n      \"Questions\": \"Domande\",\n      \"For families & caregivers of loved ones with special abilities\": \"Per famiglie e caregiver di persone care con bisogni speciali\",\n      \"One press.\": \"Un solo tocco.\",\n      \"The right caregiver, every time.\": \"Il caregiver giusto, ogni volta.\",\n      \"For a loved one who can't work through a contact list, a single number — or one speed-dial button — connects them to exactly the right person on your care team. You decide who answers and when. They just press call.\": \"Per una persona cara che non riesce a orientarsi in una rubrica, un solo numero — o un solo tasto di chiamata rapida — la collega esattamente alla persona giusta del tuo team di cura. Tu decidi chi risponde e quando. A chi chiama basta premere un tasto.\",\n      \"No list to navigate. No decision to make.\": \"Nessun elenco da scorrere. Nessuna decisione da prendere.\",\n      \"One press reaches a real person who knows them — and your whole care team is alerted the moment they call.\": \"Un solo tocco raggiunge una persona vera che li conosce — e tutto il tuo team di cura viene avvisato nel momento in cui chiamano.\",\n      \"Daniel's iCanCall number\": \"Il numero iCanCall di Daniel\",\n      \"Incoming call\": \"Chiamata in arrivo\",\n      \"One press finds the right caregiver, in order, until someone who knows him answers\": \"Un solo tocco cerca il caregiver giusto, in ordine, finché risponde qualcuno che lo conosce\",\n      \"Mom · primary caregiver\": \"Mamma · caregiver principale\",\n      \"Standing by\": \"In attesa\",\n      \"Day program\": \"Centro diurno\",\n      \"Nurse Dawn\": \"Infermiera Dawn\",\n      \"On-call\": \"Reperibile\",\n      \"Independence for them, reassurance for you\": \"Indipendenza per loro, tranquillità per te\",\n      \"press to reach help\": \"tocco per chiedere aiuto\",\n      \"lists to navigate\": \"elenchi da scorrere\",\n      \"caregiver coverage\": \"copertura dei caregiver\",\n      \"Whole\": \"Tutto\",\n      \"care team alerted\": \"il team di cura avvisato\",\n      \"Around-the-clock coverage\": \"Copertura 24 ore su 24\",\n      \"Someone is always responsible.\": \"C'è sempre un responsabile.\",\n      \"The number never changes — but who answers it does. iCanCall routes the same call to the right caregiver for the time of day, so coverage hands off cleanly and there's never a gap.\": \"Il numero non cambia mai — cambia chi risponde. iCanCall inoltra la stessa chiamata al caregiver giusto per quell'ora del giorno, così il passaggio di consegne è pulito e non resta mai un vuoto.\",\n      \"Daniel's number — one number, all day\": \"Il numero di Daniel — un solo numero, tutto il giorno\",\n      \"Right now:\": \"In questo momento:\",\n      \"On-call · overnight\": \"Reperibile · notte\",\n      \"Weekday day program\": \"Centro diurno nei giorni feriali\",\n      \"Maria (Mom)\": \"Maria (mamma)\",\n      \"Primary caregiver\": \"Caregiver principale\",\n      \"Evening\": \"Sera\",\n      \"12a\": \"00\",\n      \"6a\": \"06\",\n      \"12p\": \"12\",\n      \"6p\": \"18\",\n      \"· primary, afternoons\": \"· principale, pomeriggio\",\n      \"· evenings\": \"· sera\",\n      \"· weekdays\": \"· giorni feriali\",\n      \"· overnight on-call\": \"· reperibile di notte\",\n      \"If the assigned caregiver can't pick up, the call cascades to the next person in the circle — so a call is never left unanswered, at any hour.\": \"Se il caregiver di turno non può rispondere, la chiamata passa a cascata alla persona successiva della cerchia — così nessuna chiamata resta senza risposta, a nessuna ora.\",\n      \"You build the care team.\": \"Tu crei il team di cura.\",\n      \"They press one button.\": \"Loro premono un solo tasto.\",\n      \"All of the complexity lives with you, in the dashboard. For your loved one, it stays as simple as a single call.\": \"Tutta la complessità resta a te, nella dashboard. Per la persona a te cara, tutto resta semplice come una sola chiamata.\",\n      \"Claim one number\": \"Riserva un solo numero\",\n      \"Pick a single iCanCall number and set it as a speed-dial or a one-touch button on whatever device they use — a phone, a tablet, or an adaptive caller. That one button is all they ever need.\": \"Scegli un unico numero iCanCall e impostalo come chiamata rapida o come tasto unico sul dispositivo che usano — un telefono, un tablet o un telefono adattato. Quel solo tasto è tutto ciò che serve loro.\",\n      \"Build the care team\": \"Crea il team di cura\",\n      \"Add up to six caregivers — family, co-caregivers, a day program, a group home, an on-call nurse — and set who should answer, and when, across the day.\": \"Aggiungi fino a sei caregiver — familiari, co-caregiver, un centro diurno, una casa famiglia, un infermiere reperibile — e stabilisci chi deve rispondere, e quando, nell'arco della giornata.\",\n      \"They reach the right person\": \"Raggiungono la persona giusta\",\n      \"When they press call, iCanCall routes to the right caregiver for that moment and\": \"Quando premono il tasto, iCanCall inoltra la chiamata al caregiver giusto per quel momento e\",\n      \"cascades\": \"procede a cascata\",\n      \"on if needed — while every caregiver gets an instant text that the call came in.\": \"verso i successivi, se serve — mentre ogni caregiver riceve subito un SMS che segnala la chiamata.\",\n      \"Try it yourself\": \"Provalo tu\",\n      \"Build the care team that answers.\": \"Crea il team di cura che risponde.\",\n      \"Add the caregivers you trust, set their order, then place a pretend call. Choose\": \"Aggiungi i caregiver di cui ti fidi, stabilisci l'ordine e poi fai una chiamata di prova. Scegli la\",\n      \"cascade\": \"cascata\",\n      \"— ring each caregiver in turn until someone picks up — or a simple\": \"— squillano i caregiver uno dopo l'altro finché qualcuno non risponde — oppure un semplice\",\n      \"caller menu\": \"menu vocale\",\n      \". Your loved one only ever makes one call.\": \". La persona a te cara fa sempre e solo una chiamata.\",\n      \"Routing mode\": \"Modalità di inoltro\",\n      \"Call cascade\": \"Inoltro in cascata\",\n      \"Caller menu\": \"Menu vocale\",\n      \"You set this once in the dashboard\": \"Lo imposti una sola volta nella dashboard\",\n      \"The care team\": \"Il team di cura\",\n      \"\/6 contacts\": \"\/6 contatti\",\n      \"Ready\": \"Pronto\",\n      \"Press call to start routing\": \"Premi «chiama» per avviare l'inoltro\",\n      \"Place a call\": \"Fai una chiamata\",\n      \"Toggle a caregiver to \\\"Busy\\\" to see the cascade skip ahead.\": \"Imposta un caregiver su «Occupato» per vedere la cascata passare oltre.\",\n      \"Why caregivers choose iCanCall\": \"Perché i caregiver scelgono iCanCall\",\n      \"Simple for them.\": \"Semplice per loro.\",\n      \"Complete for you.\": \"Completo per te.\",\n      \"One press, one action\": \"Un tocco, un gesto\",\n      \"No contact list, no menus, no choosing. A single number or button is the entire interaction — designed for those a list would only overwhelm.\": \"Nessuna rubrica, nessun menu, nessuna scelta. Un solo numero o un solo tasto: l'interazione è tutta qui — pensata per chi da un elenco verrebbe soltanto sopraffatto.\",\n      \"Always the right caregiver\": \"Sempre il caregiver giusto\",\n      \"Time-aware routing sends the call to whoever's on for that part of the day — primary caregiver, day program, evening, or overnight on-call.\": \"L'inoltro per fasce orarie manda la chiamata a chi è di turno in quella parte della giornata — caregiver principale, centro diurno, sera o reperibile di notte.\",\n      \"Whole team alerted\": \"Tutto il team avvisato\",\n      \"Every caregiver gets a text the instant a call comes in — vital when a loved one may not be able to explain where they are or what they need.\": \"Ogni caregiver riceve un SMS nell'istante in cui arriva una chiamata — fondamentale quando una persona cara potrebbe non riuscire a spiegare dove si trova o di cosa ha bisogno.\",\n      \"No gaps at handoff\": \"Nessun vuoto al cambio turno\",\n      \"Coverage passes cleanly from one caregiver to the next. If the assigned person can't answer, the call cascades onward — never a dead end.\": \"La copertura passa in modo pulito da un caregiver all'altro. Se la persona di turno non può rispondere, la chiamata prosegue a cascata — mai un vicolo cieco.\",\n      \"Works with their setup\": \"Funziona con ciò che usano già\",\n      \"Program it on a phone, a tablet, an adaptive caller, or a single speed-dial button. No app to install and nothing new to learn.\": \"Impostalo su un telefono, un tablet, un telefono adattato o un solo tasto di chiamata rapida. Nessuna app da installare e niente di nuovo da imparare.\",\n      \"Private & protected\": \"Privato e protetto\",\n      \"Every caregiver's personal number stays hidden behind the single iCanCall line. All routing is encrypted, and your data is never sold.\": \"Il numero personale di ogni caregiver resta nascosto dietro l'unica linea iCanCall. Tutto l'inoltro è crittografato e i tuoi dati non vengono mai venduti.\",\n      \"Simple, honest pricing\": \"Prezzi semplici e trasparenti\",\n      \"Coverage that costs less\": \"Una copertura che costa meno\",\n      \"than a single co-pay.\": \"di un solo ticket sanitario.\",\n      \"\/ month\": \"\/ mese\",\n      \"What caregivers ask us most.\": \"Le domande più frequenti dei caregiver.\",\n      \"My loved one is non-verbal or can't explain where they are. Does this still help?\": \"La persona a me cara non parla o non sa spiegare dove si trova. È utile lo stesso?\",\n      \"Yes — that's exactly who it's built for. They don't need to choose a contact or say anything in particular. One press connects them to a caregiver who knows them, and every caregiver in the circle gets an instant text that the call came in, so the right people are aware right away.\": \"Sì — è pensato proprio per chi è in questa situazione. Non deve scegliere un contatto né dire nulla in particolare. Un solo tocco la collega a un caregiver che la conosce, e ogni caregiver della cerchia riceve subito un SMS che segnala la chiamata, così le persone giuste lo sanno immediatamente.\",\n      \"Can it work as a single speed-dial button or with an adaptive device?\": \"Può funzionare come un solo tasto di chiamata rapida o con un dispositivo adattato?\",\n      \"Absolutely. Because iCanCall is just one phone number, you can program it as a one-touch speed dial, a favorite, or a single button on whatever phone, tablet, or adaptive caller they already use. There's no app to install and nothing new for them to learn.\": \"Certamente. Poiché iCanCall è semplicemente un numero di telefono, puoi impostarlo come chiamata rapida a un tasto, come preferito o come tasto unico sul telefono, sul tablet o sul telefono adattato che usano già. Nessuna app da installare e niente di nuovo da imparare.\",\n      \"How do multiple caregivers and shift changes work?\": \"Come funziona con più caregiver e i cambi turno?\",\n      \"From your dashboard, you set who should answer at different times of day — a day program on weekday mornings, a primary caregiver in the afternoon, an evening caregiver, an overnight on-call nurse. The same number routes to whoever's on for that window, so coverage hands off without a gap.\": \"Dalla tua dashboard stabilisci chi deve rispondere nei diversi momenti della giornata — un centro diurno nelle mattine feriali, un caregiver principale il pomeriggio, un caregiver serale, un infermiere reperibile di notte. Lo stesso numero inoltra la chiamata a chi è di turno in quella fascia, così la copertura passa di mano senza vuoti.\",\n      \"What if the assigned caregiver can't pick up?\": \"E se il caregiver di turno non può rispondere?\",\n      \"The call cascades to the next person in the circle until someone answers. If everyone is unreachable, it goes to voicemail that's transcribed and texted to the whole team — so a call is never simply lost.\": \"La chiamata passa a cascata alla persona successiva della cerchia finché qualcuno risponde. Se nessuno è raggiungibile, va alla segreteria telefonica: il messaggio viene trascritto e inviato via SMS a tutto il team — così una chiamata non va mai semplicemente persa.\",\n      \"Can a group home or day program be part of the circle?\": \"Una casa famiglia o un centro diurno possono far parte della cerchia?\",\n      \"Yes. Any phone number can be a contact — a group home line, a day program, a case manager, a nurse, or family. You decide the order and the times, and adjust anytime as the care plan changes.\": \"Sì. Qualsiasi numero di telefono può essere un contatto — la linea di una casa famiglia, un centro diurno, un case manager, un infermiere o un familiare. Decidi tu l'ordine e gli orari, e li modifichi quando vuoi man mano che il piano di assistenza cambia.\",\n      \"Is iCanCall a medical alert or emergency service?\": \"iCanCall è un servizio di allarme medico o di emergenza?\",\n      \"No — iCanCall connects your loved one to the people on their care team quickly and simply. It complements, but does not replace, 911 or a medical-monitoring service. For life-threatening emergencies, always teach and rely on 911 where possible.\": \"No — iCanCall collega la persona a te cara al suo team di cura in modo rapido e semplice. Affianca, ma non sostituisce, il 911 o un servizio di monitoraggio medico. Per le emergenze in cui c'è pericolo di vita, insegna sempre a chiamare il 911 e, dove possibile, fai affidamento su quello.\",\n      \"One number. The right person. Every time.\": \"Un solo numero. La persona giusta. Ogni volta.\",\n      \"Give your loved one the independence of reaching help on their own — and give your care team the certainty of always being there. Set up iCanCall in minutes.\": \"Dai alla persona a te cara l'indipendenza di chiedere aiuto da sola — e al tuo team di cura la certezza di esserci sempre. Configura iCanCall in pochi minuti.\",\n      \"One memorable number — or one button — that always connects your loved one to the right caregiver, while keeping the whole team in the loop.\": \"Un numero facile da ricordare — o un solo tasto — che collega sempre la persona a te cara al caregiver giusto, tenendo aggiornato tutto il team.\",\n      \"For every family\": \"Per ogni famiglia\",\n      \"iCanCall, Inc. All rights reserved.\": \"iCanCall, Inc. Tutti i diritti riservati.\"\n    },\n    \"attrs\": {\n      \"Name\": \"Nome\",\n      \"Relationship\": \"Relazione\",\n      \"Role\": \"Ruolo\"\n    }\n  },\n  \"ko\": {\n    \"text\": {\n      \"How it works\": \"이용 방법\",\n      \"Features\": \"기능 안내\",\n      \"Who it's for\": \"이용 대상\",\n      \"Pricing\": \"요금제\",\n      \"FAQ\": \"FAQ\",\n      \"Login\": \"로그인\",\n      \"See how it em\": \"부모님용 요금제 선택\",\n      \"How it works for seniors\": \"시니어용 이용 방법\",\n      \"Safe, screen-free call routing for elderly parents.\": \"고령의 부모님을 위한 안전하고 화면 조작 없는 전화 연결망.\",\n      \"One number your child will never forget.\": \"아이가 절대 잊어버리지 않을 단 하나의 안심 연락처.\",\n      \"iCanCall connects your kids to their circle of care without screen time, apps, or complex devices. Starting at $12.99\/mo.\": \"iCanCall은 스마트폰이나 앱 사용 없이 아이들을 신뢰할 수 있는 가족 연락처로 직접 연결합니다. 월 $12.99부터.\",\n      \"See how it works for kids\": \"자녀용 기능 이용 방법 보기\",\n      \"How it works for parents\": \"부모 자녀 안심 통화 방법\",\n      \"Safe, screen-free call routing for young children.\": \"어린 자녀들을 위한 안전하고 화면 조작 없는 전화 연결망.\",\n      \"One number your client will never forget.\": \"사랑하는 가족이 절대 잊어버리지 않을 단 하나의 안심 연락처.\",\n      \"iCanCall connects your clients or loved ones to their care network instantly, without complex devices. Starting at $12.99\/mo.\": \"iCanCall은 복잡한 기기 없이 부모님이나 돌봄 대상자를 보호자 네트워크에 즉시 연결합니다. 월 $12.99부터.\",\n      \"See how it works for caregivers\": \"간병인\/보호자용 기능 보기\",\n      \"How it works for caregivers\": \"보호자 간병인 이용 방법\",\n      \"Safe, screen-free call routing for caregivers.\": \"돌봄 및 보호 업무를 위한 안전하고 화면 조작 없는 전화 연결망.\",\n      \"Aging parent\": \"고령의 부모님\",\n      \"Aging parents\": \"고령의 부모님\",\n      \"Child calling home\": \"집으로 전화 거는 자녀\",\n      \"Young children\": \"어린 자녀\",\n      \"Special-abilities care\": \"특별 케어 대상자\",\n      \"Special abilities & caregivers\": \"보호자 및 간병인 대상\",\n      \"Essential\": \"에센셜 플랜\",\n      \"Essential Plan\": \"에센셜 요금제\",\n      \"Pro\": \"프로 플랜\",\n      \"Pro Plan\": \"프로 요금제\",\n      \"Select Essential\": \"에센셜 선택하기\",\n      \"Select Pro\": \"프로 선택하기\",\n      \"Most popular\": \"가장 인기 있는 플랜\",\n      \"Monthly\": \"월간 결제\",\n      \"Annual\": \"연간 결제\",\n      \"Save 17%\": \"17% 할인\",\n      \"Save 20%\": \"20% 할인\",\n      \"One number for one loved one.\": \"단일 가족의 기본 안심망 구축.\",\n      \"Full protection for the whole circle.\": \"돌봄 서
