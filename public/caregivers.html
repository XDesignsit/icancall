    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // attributes through, so match the full opening tag. slice() rather than

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to

  <script type="__bundler/template">"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>iCanCall for Caregivers \u2014 One number. The right caregiver. Every time.<\/title>\n<style>\/* ===========================================================\n   iCanCall \u2014 landing page styles\n   Warm & reassuring \u00b7 soft blue\/teal \u00b7 clean neutral sans\n   =========================================================== *\/\n\n:root {\n  \/* Surfaces \u2014 subtly cool whites *\/\n  --bg:        oklch(0.992 0.005 220);\n  --surface:   oklch(1 0 0);\n  --tint:      oklch(0.965 0.018 218);   \/* soft blue wash *\/\n  --tint-2:    oklch(0.945 0.028 210);\n  --line:      oklch(0.90 0.012 225);\n\n  \/* Ink \u2014 cool near-blacks *\/\n  --ink:       oklch(0.26 0.028 248);\n  --ink-soft:  oklch(0.45 0.022 245);\n  --ink-faint: oklch(0.60 0.018 242);\n\n  \/* Brand \u2014 calm blues + teal *\/\n  --blue:      oklch(0.58 0.115 232);\n  --blue-deep: oklch(0.44 0.105 240);\n  --blue-ink:  oklch(0.34 0.085 244);\n  --teal:      oklch(0.72 0.095 196);\n  --teal-deep: oklch(0.62 0.10 198);\n  --green:     oklch(0.70 0.13 158);\n\n  --shadow-sm: 0 1px 2px oklch(0.4 0.05 240 \/ 0.06), 0 2px 6px oklch(0.4 0.05 240 \/ 0.05);\n  --shadow-md: 0 4px 14px oklch(0.4 0.05 240 \/ 0.08), 0 10px 30px oklch(0.4 0.05 240 \/ 0.07);\n  --shadow-lg: 0 12px 28px oklch(0.4 0.06 240 \/ 0.10), 0 30px 60px oklch(0.4 0.06 240 \/ 0.10);\n\n  --r-sm: 10px;\n  --r-md: 16px;\n  --r-lg: 24px;\n  --r-xl: 32px;\n\n  --maxw: 1180px;\n  --pad: clamp(20px, 5vw, 56px);\n\n  --font: \"Helvetica Neue\", Helvetica, Arial, \"Segoe UI\", sans-serif;\n  --mono: ui-monospace, \"SF Mono\", \"Roboto Mono\", Menlo, monospace;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }\n\nbody {\n  font-family: var(--font);\n  background: var(--bg);\n  color: var(--ink);\n  line-height: 1.55;\n  font-size: 17px;\n  letter-spacing: -0.01em;\n}\n\na { color: inherit; text-decoration: none; }\nimg { display: block; max-width: 100%; }\n\n.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad); }\n\n\/* ---------- Typography ---------- *\/\nh1, h2, h3, h4 { letter-spacing: -0.025em; line-height: 1.06; font-weight: 700; color: var(--ink); }\nh1 { font-size: clamp(2.6rem, 6vw, 4.6rem); }\nh2 { font-size: clamp(2rem, 4vw, 3.1rem); }\nh3 { font-size: clamp(1.25rem, 2vw, 1.6rem); }\n.lead { font-size: clamp(1.1rem, 1.6vw, 1.32rem); color: var(--ink-soft); line-height: 1.5; }\n\n.eyebrow {\n  display: inline-flex; align-items: center; gap: 8px;\n  font-size: 0.82rem; font-weight: 600; letter-spacing: 0.04em;\n  text-transform: uppercase; color: var(--blue-deep);\n}\n.eyebrow::before {\n  content: \"\"; width: 22px; height: 2px; border-radius: 2px;\n  background: var(--teal-deep);\n}\n\n.section { padding-block: clamp(72px, 10vw, 130px); }\n.section-head { max-width: 680px; }\n.section-head .eyebrow { margin-bottom: 18px; }\n.section-head .lead { margin-top: 18px; }\n.center { margin-inline: auto; text-align: center; }\n.center .eyebrow { justify-content: center; }\n\n\/* ---------- Buttons ---------- *\/\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 9px;\n  font-family: var(--font); font-size: 1rem; font-weight: 600;\n  padding: 14px 26px; border-radius: 999px; border: 1px solid transparent;\n  cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, background .18s ease;\n  white-space: nowrap;\n}\n.btn-primary {\n  background: var(--blue); color: #fff;\n  box-shadow: 0 6px 18px oklch(0.58 0.115 232 \/ 0.32);\n}\n.btn-primary:hover { background: var(--blue-deep); transform: translateY(-2px); box-shadow: 0 10px 24px oklch(0.58 0.115 232 \/ 0.38); }\n.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }\n.btn-ghost:hover { background: var(--tint); border-color: var(--blue); transform: translateY(-2px); }\n.btn-lg { padding: 17px 34px; font-size: 1.06rem; }\n\n\/* ---------- Header ---------- *\/\n.header {\n  position: sticky; top: 0; z-index: 60;\n  backdrop-filter: blur(12px);\n  background: oklch(0.992 0.005 220 \/ 0.78);\n  border-bottom: 1px solid transparent;\n  transition: border-color .25s ease, background .25s ease;\n}\n.header.scrolled { border-color: var(--line); background: oklch(0.992 0.005 220 \/ 0.92); }\n.header-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }\n.brand { display: flex; align-items: center; gap: 11px; font-weight: 700; font-size: 1.22rem; letter-spacing: -0.03em; }\n.brand .mark {\n  width: 34px; height: 34px; border-radius: 10px; flex: none;\n  background: linear-gradient(150deg, var(--blue), var(--teal-deep));\n  display: grid; place-items: center; box-shadow: var(--shadow-sm);\n}\n.brand .mark svg { width: 18px; height: 18px; }\n.brand b { color: var(--blue-deep); }\n.nav { display: flex; align-items: center; gap: 20px; }\n.nav a { font-size: 0.94rem; color: var(--ink-soft); font-weight: 500; transition: color .15s; white-space: nowrap; }\n.nav a:hover { color: var(--ink); }\n.header-cta { display: flex; align-items: center; gap: 14px; }\n.nav-toggle { display: none; }\n@media (max-width: 880px) {\n  .nav { display: none; }\n  .header-cta .btn-ghost { display: none; }\n}\n\n\/* ---------- Hero ---------- *\/\n.hero { position: relative; overflow: hidden; padding-top: clamp(48px, 7vw, 86px); padding-bottom: clamp(60px, 8vw, 110px); }\n.hero::before {\n  content: \"\"; position: absolute; inset: -20% -10% auto -10%; height: 760px;\n  background:\n    radial-gradient(60% 60% at 78% 12%, oklch(0.72 0.095 196 \/ 0.18), transparent 70%),\n    radial-gradient(55% 55% at 18% 0%, oklch(0.58 0.115 232 \/ 0.16), transparent 70%);\n  pointer-events: none; z-index: 0;\n}\n.hero-grid {\n  p .num small { display: block; font-size: 0.72rem; font-weight: 500; color: var(--ink-faint); letter-spacing: 0.02em; }\n.demo-status {\n  font-size: 0.78rem; font-weight: 600; color: var(--blue-deep);\n  background: var(--tint); border: 1px solid var(--line);\n  padding: 6px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px;\n  transition: color .3s, background .3s, border-color .3s;\n}\n.demo-status .live { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }\n.demo.is-connected .demo-status { color: oklch(0.42 0.13 158); background: oklch(0.94 0.05 158); border-color: oklch(0.84 0.07 158); }\n.demo.is-connected .demo-status .live { background: var(--green); }\n\n.demo-caption { font-size: 0.78rem; color: var(--ink-faint); margin-bottom: 14px; padding-left: 2px; }\n\n.chain { display: flex; flex-direction: column; gap: 9px; }\n.contact {\n  position: relative; display: flex; align-items: center; gap: 13px;\n  padding: 11px 14px; border-radius: var(--r-md);\n  border: 1px solid var(--line); background: var(--surface);\n  transition: border-color .3s, background .3s, box-shadow .3s, opacity .3s, transform .3s;\n}\n.contact .avatar {\n  width: 38px; height: 38px; border-radius: 50%; flex: none;\n  display: grid; place-items: center; font-weight: 700; font-size: 0.9rem; color: #fff;\n}\n.contact .who { flex: 1; min-width: 0; }\n.contact .who b { font-size: 0.97rem; font-weight: 600; }\n.contact .who span { display: block; font-size: 0.8rem; color: var(--ink-faint); }\n.contact .state { font-size: 0.78rem; font-weight: 600; color: var(--ink-faint); white-space: nowrap; }\n.contact .order {\n  position: absolute; left: -1px; top: -1px;\n  width: 20px; height: 20px; border-radius: 0 0 10px 0;\n  background: var(--tint); color: var(--ink-faint);\n  font-size: 0.66rem; font-weight: 700; display: grid; place-items: center;\n}\n\n\/* states *\/\n.contact.is-ringing {\n  border-color: var(--blue); background: var(--tint);\n  box- n-height: 60px; }\n.circle-row {\n  display: flex; align-items: center; gap: 12px; padding: 10px 12px;\n  border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface);\n  transition: border-color .25s, background .25s, box-shadow .25s, opacity .25s, transform .25s;\n}\n.circle-row .avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; color: #fff; }\n.circle-row .who { flex: 1; min-width: 0; }\n.circle-row .who b { font-size: 0.94rem; font-weight: 600; display: block; line-height: 1.2; }\n.circle-row .who span { font-size: 0.78rem; color: var(--ink-faint); }\n.circle-row.is-ringing { border-color: var(--blue); background: var(--tint); box-shadow: 0 0 0 3px oklch(0.58 0.115 232 \/ 0.12); }\n.circle-row.is-ringing .avatar { animation: wiggle .6s ease-in-out infinite; }\n.circle-row.is-missed { opacity: 0.45; }\n.circle-row.is-connected { border-color: oklch(0.80 0.09 158); background: oklch(0.96 0.04 158); box-shadow: 0 0 0 3px oklch(0.70 0.13 158 \/ 0.16); }\n\n.row-tools { display: flex; align-items: center; gap: 4px; }\n.icon-btn {\n  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line);\n  background: var(--surface); color: var(--ink-soft); cursor: pointer; display: grid; place-items: center;\n  transition: background .15s, color .15s, border-color .15s, opacity .15s;\n}\n.icon-btn:hover:not(:disabled) { background: var(--tint); color: var(--blue-deep); border-color: var(--blue); }\n.icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }\n.icon-btn svg { width: 15px; height: 15px; }\n.icon-btn.danger:hover:not(:disabled) { color: oklch(0.55 0.18 25); border-color: oklch(0.55 0.18 25); background: oklch(0.96 0.04 25); }\n\n\/* availability switch (button-driven) *\/\n.avail { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; flex: none; background: none; border: none; padding: 0; font-famil olor: #fff; position: relative; overflow: hidden; min-height: 280px;\n  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;\n}\n.sim-screen .num-line { font-size: 0.8rem; color: oklch(0.9 0.03 220); letter-spacing: 0.02em; }\n.sim-avatar { width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 1.7rem; color: #fff; background: oklch(1 0 0 \/ 0.16); position: relative; transition: background .3s; }\n.sim-avatar.ringing::after { content: \"\"; position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 0 oklch(1 0 0 \/ 0.4); animation: simpulse 1.4s ease-out infinite; }\n@keyframes simpulse { 0% { box-shadow: 0 0 0 0 oklch(1 0 0 \/ 0.35); } 70% { box-shadow: 0 0 0 22px oklch(1 0 0 \/ 0); } 100% { box-shadow: 0 0 0 0 oklch(1 0 0 \/ 0); } }\n.sim-name { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; min-height: 1.3em; }\n.sim-state { font-size: 0.92rem; color: oklch(0.92 0.02 220); min-height: 1.3em; }\n.sim-screen.connected { background: linear-gradient(165deg, oklch(0.42 0.12 158), oklch(0.52 0.13 158)); }\n.sim-screen.voicemail { background: linear-gradient(165deg, oklch(0.4 0.06 250), oklch(0.5 0.06 255)); }\n.sim-dots { display: flex; gap: 6px; }\n.sim-dots i { width: 7px; height: 7px; border-radius: 50%; background: oklch(1 0 0 \/ 0.28); transition: background .25s, transform .25s; }\n.sim-dots i.active { background: #fff; transform: scale(1.3); }\n.sim-dots i.done { background: oklch(1 0 0 \/ 0.55); }\n.sim-panel .btn { width: 100%; margin-top: 18px; }\n.sim-hint { font-size: 0.8rem; color: var(--ink-faint); margin-top: 10px; }\n\n\/* caller-menu mode *\/\n.sim-screen.menu-mode { justify-content: flex-start; align-items: stretch; text-align: left; }\n.sim-menu { display: flex; flex-direction: column; gap: 8px; width: 100%; }\n.sim-menu .menu-title { font-size: 0.85rem; color: oklch(0.92 0.02 220); margin-bottom: 4px; font-weight: 600; }\n.si lex; align-items: center; gap: 12px; margin-top: 22px; }\n.quote .by .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 0.85rem; }\n.quote .by b { font-size: 0.92rem; display: block; }\n.quote .by span { font-size: 0.82rem; color: var(--ink-faint); }\n@media (max-width: 820px) { .quotes { grid-template-columns: 1fr; } }\n\n\/* ---------- FAQ ---------- *\/\n.faq { max-width: 800px; margin: 48px auto 0; }\n.faq-item { border-bottom: 1px solid var(--line); }\n.faq-q { width: 100%; text-align: left; background: none; border: none; cursor: pointer; font-family: var(--font); padding: 24px 4px; display: flex; align-items: center; justify-content: space-between; gap: 20px; font-size: 1.1rem; font-weight: 600; color: var(--ink); }\n.faq-q .pm { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--tint); display: grid; place-items: center; transition: transform .25s, background .25s; color: var(--blue-deep); font-size: 1.2rem; line-height: 1; }\n.faq-item.open .faq-q .pm { transform: rotate(45deg); background: var(--blue); color: #fff; }\n.faq-a { max-height: 0; overflow: hidden; transition: max-height .32s ease; }\n.faq-a p { padding: 0 4px 24px; color: var(--ink-soft); font-size: 1rem; max-width: 68ch; }\n\n\/* ---------- Final CTA ---------- *\/\n.cta-band { position: relative; overflow: hidden; }\n.cta-card {\n  position: relative; border-radius: var(--r-xl); padding: clamp(48px, 7vw, 88px) clamp(28px, 5vw, 72px);\n  background: linear-gradient(150deg, var(--blue-deep), var(--blue) 55%, var(--teal-deep));\n  color: #fff; text-align: center; overflow: hidden;\n  box-shadow: var(--shadow-lg);\n}\n.cta-card::before { content: \"\"; position: absolute; inset: 0; background: radial-gradient(50% 80% at 80% 0%, oklch(1 0 0 \/ 0.18), transparent 60%); pointer-events: none; }\n.cta-card h2 { color: #fff; position: relative; }\n.cta-card p { color: oklch(0.95 0.02 220); font-size: 1.18rem; margin: 18px auto 32px; max-width: 50ch; position: relative; }\n.cta-card .btn-primary { background: #fff; color: var(--blue-deep); box-shadow: 0 8px 24px oklch(0.2 0.05 240 \/ 0.3); }\n.cta-card .btn-primary:hover { background: oklch(0.96 0.02 220); }\n.cta-card .actions { position: relative; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }\n.cta-card .fine { margin-top: 20px; font-size: 0.86rem; color: oklch(0.9 0.02 220); position: relative; }\n\n\/* ---------- Footer ---------- *\/\n.footer { padding-block: 60px 40px; border-top: 1px solid var(--line); background: var(--surface); }\n.footer-grid { display: grid; grid-template-columns: 1.4fr repeat(4, 1fr); gap: 40px; }\n.footer .brand { margin-bottom: 16px; }\n.footer .blurb { color: var(--ink-soft); font-size: 0.92rem; max-width: 30ch; }\n.footer h5 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); margin-bottom: 16px; font-weight: 700; }\n.footer ul { list-style: none; display: flex; flex-direction: column; gap: 11px; }\n.footer a { color: var(--ink-soft); font-size: 0.94rem; transition: color .15s; }\n.footer a:hover { color: var(--blue-deep); }\n.footer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--line); font-size: 0.86rem; color: var(--ink-faint); }\n@media (max-width: 820px) { .footer-grid { grid-template-columns: 1fr 1fr; } }\n\n\/* ---------- Reveal on scroll ---------- *\/\n.reveal { opacity: 0; transform: translateY(22px); transition: opacity .6s ease, transform .6s ease; }\n.reveal.in { opacity: 1; transform: none; }\n\n@media (prefers-reduced-motion: reduce) {\n  * { animation: none !important; transition: none !important; }\n  .reveal { opacity: 1; transform: none; }\n}\n<\/style>\n<style>\/* ===========================================================\n   iCanCall \u2014 shared audience-page c ont-weight: 600;\n  letter-spacing: -0.02em; color: var(--ink); flex: 1;\n}\n.spotlight-quote .by { display: flex; align-items: center; gap: 13px; margin-top: 28px; }\n.spotlight-quote .by .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 0.95rem; }\n.spotlight-quote .by b { font-size: 1rem; display: block; }\n.spotlight-quote .by span { font-size: 0.9rem; color: var(--ink-faint); }\n.spotlight-aside {\n  background: linear-gradient(160deg, var(--blue-deep), var(--blue) 55%, var(--teal-deep));\n  color: #fff; padding: clamp(34px, 4vw, 52px); display: flex; flex-direction: column; justify-content: center; gap: 26px;\n}\n.spotlight-aside .stat-xl b { display: block; font-size: clamp(2.4rem, 4vw, 3.4rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1; }\n.spotlight-aside .stat-xl span { font-size: 1rem; color: oklch(0.92 0.02 220); margin-top: 8px; display: block; }\n.spotlight-aside .divider { height: 1px; background: oklch(1 0 0 \/ 0.22); }\n@media (max-width: 820px) { .spotlight-card { grid-template-columns: 1fr; } }\n<\/style>\n<style>\/* ===========================================================\n   iCanCall \u2014 Special-abilities caregivers\n   Layers on styles.css + audience.css. Signature section:\n   a 24-hour care-coverage timeline showing the one number\n   always routes to the right caregiver, with no gaps.\n   Person-first, dignified. Calm violet accent.\n   =========================================================== *\/\n\n:root {\n  --care:      oklch(0.55 0.11 280);    \/* calm violet \u2014 care-team accent *\/\n  --care-deep: oklch(0.45 0.11 282);\n  --care-tint: oklch(0.95 0.03 285);\n}\n\n\/* violet-tinted hero reassurance for this audience *\/\n.hero-reassure.care { background: var(--care-tint); border-color: oklch(0.55 0.11 280 \/ 0.30); }\n.hero-reassure.care svg { color: var(--care-deep); }\n\n\/* ---------- \"Someone is always responsible\" coverage timeline ---------- *\/\n.coverage { padding-block: clamp(64px, 9vw, 110px); }\n.timeline-card {\n  margin-top: 52px; border-radius: var(--r-xl); padding: clamp(24px, 3vw, 36px);\n  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg);\n}\n.tl-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }\n.tl-head .num {\n  display: inline-flex; align-items: center; gap: 11px; font-weight: 700; font-size: 1.06rem; letter-spacing: -0.02em;\n}\n.tl-head .num .ring {\n  width: 38px; height: 38px; border-radius: 11px; flex: none;\n  background: linear-gradient(150deg, var(--care), var(--blue)); display: grid; place-items: center;\n}\n.tl-head .num .ring svg { width: 19px; height: 19px; }\n.tl-head .num small { display: block; font-size: 0.74rem; font-weight: 500; color: var(--ink-faint); letter-spacing: 0.01em; }\n.tl-now-badge {\n  display: inline-flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 600;\n  color: var(--care-deep); background: var(--care-tint); border: 1px solid oklch(0.55 0.11 280 \/ 0.28);\n  padding: 6px 13px; border-radius: 999px;\n}\n.tl-now-badge .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--care); }\n\n.track {\n  display: flex; height: 76px; border-radius: var(--r-md); overflow: hidden; position: relative;\n  border: 1px solid var(--line);\n}\n.seg {\n  display: flex; flex-direction: column; justify-content: center; gap: 2px;\n  padding: 0 14px; color: #fff; min-width: 0; overflow: hidden; white-space: nowrap;\n}\n.seg b { font-size: 0.92rem; font-weight: 700; text-overflow: ellipsis; overflow: hidden; }\n.seg span { font-size: 0.76rem; opacity: 0.85; text-overflow: ellipsis; overflow: hidden; }\n\n\/* now marker *\/\n.now {\n  position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink);\n  z-index: 3; transform: translateX(-1px);\n}\n.now::before {\n  content: \"\"; position: absolute; top: -4px; left: 50%; transform: translateX(-50%);\n  width: 12px; height: 12px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px var(--surface);\n}\n.now::after {\n  content: \"Now\"; position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%);\n  font-size: 0.7rem; font-weight: 700; color: var(--ink); background: var(--surface);\n  padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap;\n}\n\n.hours {\n  display: flex; justify-content: space-between; margin-top: 12px;\n  font-family: var(--mono); font-size: 0.74rem; color: var(--ink-faint);\n}\n.tl-legend { display: flex; flex-wrap: wrap; gap: 16px 22px; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }\n.tl-legend .item { display: flex; align-items: center; gap: 9px; font-size: 0.9rem; color: var(--ink-soft); }\n.tl-legend .item .dot { width: 12px; height: 12px; border-radius: 4px; flex: none; }\n.tl-legend .item b { color: var(--ink); font-weight: 600; }\n\n.tl-foot { margin-top: 22px; display: flex; gap: 12px; align-items: flex-start; font-size: 0.94rem; color: var(--ink-soft); }\n.tl-foot svg { width: 20px; height: 20px; flex: none; margin-top: 1px; color: var(--care-deep); }\n\n@media (max-width: 680px) {\n  .track { height: 66px; }\n  .seg span { display: none; }\n  .seg b { font-size: 0.8rem; white-space: normal; }\n}\n\n\/* ---------- Simplicity emphasis chips (used under hero or in a band) ---------- *\/\n.one-press { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }\n.one-press .chip {\n  display: inline-flex; align-items: center; gap: 9px; padding: 10px 16px;\n  border-radius: 999px; background: var(--surface); border: 1px solid var(--line);\n  font-size: 0.92rem; font-weight: 600; color: var(--ink-soft); box-shadow: var(--shadow-sm);\n}\n.one-press .chip svg { width: 17px; height: 17px; color: var(--care-deep); }\n<\/style>\n<\/head>\n<body>\n\n\n\n<!-- ============== HEADER ============== -->\n<header class=\"header\">\n  <div class=\"wrap header-inner\">\n    <a class=\"brand\" href=\"\/\" aria-label=\"iCanCall home\">\n      <span class=\"mark\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n      <\/span>\n      <span>i<b>Can<\/b>Call<\/span>\n    <\/a>\n    <nav class=\"nav\">\n      <a href=\"#coverage\">Coverage<\/a>\n      <a href=\"#how\">How it works<\/a>\n      <a href=\"#build\">Build the circle<\/a>\n      <a href=\"#pricing\">Pricing<\/a>\n      <a href=\"#faq\">Questions<\/a>\n    <\/nav>\n    <div class=\"header-cta\" style=\"display: flex; align-items: center; gap: 12px;\">\n      <a class=\"btn btn-ghost\" href=\"#how\">See how it works<\/a>\n      <a class=\"btn btn-primary\" href=\"#pricing\">Get started<\/a>\n      <select id=\"langSelect\" class=\"lang-select\" style=\"background: transparent; border: 1px solid var(--line); color: var(--ink-soft); padding: 6px 10px; border-radius: 20px; font-size: 0.86rem; font-weight: 600; cursor: pointer; outline: none; font-family: var(--font); margin-left: 4px;\">\n        <option value=\"en\">\ud83c\uddfa\ud83c\uddf8 EN<\/option>\n        <option value=\"es\">\ud83c\uddea\ud83c\uddf8 ES<\/option>\n        <option value=\"fr\">\ud83c\uddeb\ud83c\uddf7 FR<\/option>\n        <option value=\"ja\">\ud83c\uddef\ud83c\uddf5 JA<\/option>\n        <option value=\"zh\">\ud83c\udde8\ud83c\uddf3 ZH<\/option>\n        <option value=\"ar\">\ud83c\uddf8\ud83c\udde6 AR<\/option>\n        <option value=\"hi\">\ud83c\uddee\ud83c\uddf3 HI<\/option>\n      <\/select>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main id=\"top\">\n\n<!-- ============== HERO ============== -->\n<section class=\"hero\">\n  <div class=\"wrap hero-grid\">\n    <div class=\"hero-copy\">\n      <span class=\"aud-badge\">\n        <span class=\"hh\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9Z\"><\/path><\/svg><\/span>\n        For families &amp; caregivers of loved ones with special abilities\n      <\/span>\n      <h1>One press.<br><span class=\"accent\">The right caregiver, every time.<\/span><\/h1>\n      <p class=\"lead\">For a loved one who can't work through a contact list, a single number \u2014 or one speed-dial button \u2014 connects them to exactly the right person on your care team. You decide who answers and when. They just press call.<\/p>\n      <div class=\"hero-actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"#pricing\">Get started<\/a>\n        <a class=\"btn btn-ghost btn-lg\" href=\"#how\">How it works<\/a>\n      <\/div>\n      <div class=\"hero-reassure care\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\/path><\/svg>\n        <p><b>No list to navigate. No decision to make.<\/b> One press reaches a real person who knows them \u2014 and your whole care team is alerted the moment they call.<\/p>\n      <\/div>\n    <\/div>\n\n    <!-- Animated routing demo -->\n    <div class=\"demo\" id=\"demo\" aria-label=\"Live call-routing demonstration\">\n      <div class=\"demo-head\">\n        <div class=\"demo-number\">\n          <span class=\"ring\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n          <\/span>\n          <span class=\"num\">(415) 200-CARE<small>Daniel's iCanCall number<\/small><\/span>\n        <\/div>\n        <span class=\"demo-status\"><span class=\"live\"><\/span><span class=\"txt\">Incoming call<\/span><\/span>\n      <\/div>\n      <p class=\"demo-caption\">One press finds the right caregiver, in order, until someone who knows him answers<\/p>\n      <div class=\"chain\">\n        <div class=\"contact\">\n          <span class=\"order\">1<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.58 0.115 232)\">MA<\/span>\n          <span class=\"who\"><b>Maria<\/b><span>Mom \u00b7 primary caregiver<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">2<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.55 0.11 280)\">JC<\/span>\n          <span class=\"who\"><b>James C.<\/b><span>Co-caregiver<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">3<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.62 0.10 198)\">SP<\/span>\n          <span class=\"who\"><b>Sunrise Program<\/b><span>Day program<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">4<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.6 0.12 30)\">ND<\/span>\n          <span class=\"who\"><b>Nurse Dawn<\/b><span>On-call<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== TRUST STRIP ============== -->\n<section class=\"trust\">\n  <div class=\"wrap trust-inner\">\n    <span class=\"trust-label\">Independence for them, reassurance for you<\/span>\n    <div class=\"trust-stats\">\n      <div class=\"stat\"><b>1<\/b><span>press to reach help<\/span><\/div>\n      <div class=\"stat\"><b>0<\/b><span>lists to navigate<\/span><\/div>\n      <div class=\"stat\"><b>24\/7<\/b><span>caregiver coverage<\/span><\/div>\n      <div class=\"stat\"><b>Whole<\/b><span>care team alerted<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== COVERAGE TIMELINE (signature) ============== -->\n<section class=\"section coverage\" id=\"coverage\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Around-the-clock coverage<\/span>\n      <h2>Someone is always responsible.<\/h2>\n      <p class=\"lead\">The number never changes \u2014 but who answers it does. iCanCall routes the same call to the right caregiver for the time of day, so coverage hands off cleanly and there's never a gap.<\/p>\n    <\/div>\n\n    <div class=\"timeline-card reveal\">\n      <div class=\"tl-head\">\n        <span class=\"num\">\n          <span class=\"ring\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg><\/span>\n          (415) 200-CARE<small>Daniel's number \u2014 one number, all day<\/small>\n        <\/span>\n        <span class=\"tl-now-badge\"><span class=\"pip\"><\/span>Right now: <b id=\"now-who\" style=\"margin-left:2px\">\u2014<\/b><\/span>\n      <\/div>\n\n      <div class=\"track\" id=\"cov-track\">\n        <div class=\"seg\" style=\"flex-basis:29.17%; background:oklch(0.44 0.105 240)\"><b>Nurse Dawn<\/b><span>On-call \u00b7 overnight<\/span><\/div>\n        <div class=\"seg\" style=\"flex-basis:33.33%; background:oklch(0.62 0.10 198)\"><b>Sunrise Program<\/b><span>Weekday day program<\/span><\/div>\n        <div class=\"seg\" style=\"flex-basis:25%; background:oklch(0.58 0.115 232)\"><b>Maria (Mom)<\/b><span>Primary caregiver<\/span><\/div>\n        <div class=\"seg\" style=\"flex-basis:12.5%; background:oklch(0.55 0.11 280)\"><b>James C.<\/b><span>Evening<\/span><\/div>\n        <div class=\"now\" id=\"cov-now\" style=\"left:0\"><\/div>\n      <\/div>\n      <div class=\"hours\">\n        <span>12a<\/span><span>6a<\/span><span>12p<\/span><span>6p<\/span><span>12a<\/span>\n      <\/div>\n\n      <div class=\"tl-legend\">\n        <span class=\"item\"><span class=\"dot\" style=\"background:oklch(0.58 0.115 232)\"><\/span><b>Maria<\/b> \u00b7 primary, afternoons<\/span>\n        <span class=\"item\"><span class=\"dot\" style=\"background:oklch(0.55 0.11 280)\"><\/span><b>James C.<\/b> \u00b7 evenings<\/span>\n        <span class=\"item\"><span class=\"dot\" style=\"background:oklch(0.62 0.10 198)\"><\/span><b>Sunrise Program<\/b> \u00b7 weekdays<\/span>\n        <span class=\"item\"><span class=\"dot\" style=\"background:oklch(0.44 0.105 240)\"><\/span><b>Nurse Dawn<\/b> \u00b7 overnight on-call<\/span>\n      <\/div>\n\n      <div class=\"tl-foot\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z\"><\/path><path d=\"m9 12 2 2 4-4\"><\/path><\/svg>\n        <p>If the assigned caregiver can't pick up, the call cascades to the next person in the circle \u2014 so a call is never left unanswered, at any hour.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== HOW IT WORKS ============== -->\n<section class=\"section tint-band\" id=\"how\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">How it works<\/span>\n      <h2>You build the care team.<br>They press one button.<\/h2>\n      <p class=\"lead\">All of the complexity lives with you, in the dashboard. For your loved one, it stays as simple as a single call.<\/p>\n    <\/div>\n    <div class=\"steps\">\n      <div class=\"step reveal\">\n        <div class=\"idx\">1<\/div>\n        <h3>Claim one number<\/h3>\n        <p>Pick a single iCanCall number and set it as a speed-dial or a one-touch button on whatever device they use \u2014 a phone, a tablet, or an adaptive caller. That one button is all they ever need.<\/p>\n        <svg class=\"step-arrow\" width=\"60\" height=\"24\" viewBox=\"0 0 60 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M0 12h54m0 0-7-7m7 7-7 7\"><\/path><\/svg>\n      <\/div>\n      <div class=\"step reveal\">\n        <div class=\"idx\">2<\/div>\n        <h3>Build the care team<\/h3>\n        <p>Add up to six caregivers \u2014 family, co-caregivers, a day program, a group home, an on-call nurse \u2014 and set who should answer, and when, across the day.<\/p>\n        <svg class=\"step-arrow\" width=\"60\" height=\"24\" viewBox=\"0 0 60 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M0 12h54m0 0-7-7m7 7-7 7\"><\/path><\/svg>\n      <\/div>\n      <div class=\"step reveal\">\n        <div class=\"idx\">3<\/div>\n        <h3>They reach the right person<\/h3>\n        <p>When they press call, iCanCall routes to the right caregiver for that moment and <b>cascades<\/b> on if needed \u2014 while every caregiver gets an instant text that the call came in.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== INTERACTIVE BUILDER ============== -->\n<section class=\"section\" id=\"build\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Try it yourself<\/span>\n      <h2>Build the care team that answers.<\/h2>\n      <p class=\"lead\">Add the caregivers you trust, set their order, then place a pretend call. Choose <b>cascade<\/b> \u2014 ring each caregiver in turn until someone picks up \u2014 or a simple <b>caller menu<\/b>. Your loved one only ever makes one call.<\/p>\n    <\/div>\n    <div class=\"mode-toggle reveal\">\n      <span class=\"mode-label\">Routing mode<\/span>\n      <div class=\"seg\" role=\"tablist\" aria-label=\"Routing mode\">\n        <button class=\"seg-btn active\" type=\"button\" data-mode=\"cascade\" role=\"tab\">Call cascade<\/button>\n        <button class=\"seg-btn\" type=\"button\" data-mode=\"menu\" role=\"tab\">Caller menu<\/button>\n      <\/div>\n      <span class=\"mode-note\">\n        <svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"10\" rx=\"2\"><\/rect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\/path><\/svg>\n        You set this once in the dashboard\n      <\/span>\n    <\/div>\n    <div class=\"builder reveal\">\n      <!-- editor -->\n      <div class=\"builder-panel\">\n        <div class=\"builder-head\">\n          <h3>The care team<\/h3>\n          <span class=\"count\"><span id=\"ccount\">0<\/span>\/6 contacts<\/span>\n        <\/div>\n        <div id=\"circle-list\" class=\"circle-list\"><\/div>\n        <form id=\"add-form\" class=\"add-form\" autocomplete=\"off\">\n          <input id=\"add-name\" type=\"text\" placeholder=\"Name\" maxlength=\"22\" required=\"\">\n          <input id=\"add-rel\" type=\"text\" placeholder=\"Role\" maxlength=\"22\">\n          <button class=\"btn btn-primary add-btn\" type=\"submit\" aria-label=\"Add caregiver\" title=\"Add caregiver\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg>\n          <\/button>\n        <\/form>\n      <\/div>\n      <!-- simulator -->\n      <div class=\"sim-panel\">\n        <div class=\"sim-screen\" id=\"sim-screen\">\n          <span class=\"num-line\">(415) 200-CARE<\/span>\n          <div class=\"sim-avatar\" id=\"sim-avatar\">\u2014<\/div>\n          <div class=\"sim-name\" id=\"sim-name\">Ready<\/div>\n          <div class=\"sim-state\" id=\"sim-state\">Press call to start routing<\/div>\n          <div class=\"sim-dots\" id=\"sim-dots\"><\/div>\n        <\/div>\n        <button class=\"btn btn-primary\" id=\"place-call\">\n          <svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n          Place a call\n        <\/button>\n        <p class=\"sim-hint\">Toggle a caregiver to \"Busy\" to see the cascade skip ahead.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== FEATURES ============== -->\n<section class=\"section tint-band\" id=\"features\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Why caregivers choose iCanCall<\/span>\n      <h2>Simple for them.<br>Complete for you.<\/h2>\n    <\/div>\n    <div class=\"features\">\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><circle cx=\"12\" cy=\"12\" r=\"3.2\"><\/circle><\/svg><\/div>\n        <h3>One press, one action<\/h3>\n        <p>No contact list, no menus, no choosing. A single number or button is the entire interaction \u2014 designed for those a list would only overwhelm.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 7v5l3 2\"><\/path><\/svg><\/div>\n        <h3>Always the right caregiver<\/h3>\n        <p>Time-aware routing sends the call to whoever's on for that part of the day \u2014 primary caregiver, day program, evening, or overnight on-call.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16v11H7l-3 3V5Z\"><\/path><path d=\"M8 9h8M8 12h5\"><\/path><\/svg><\/div>\n        <h3>Whole team alerted<\/h3>\n        <p>Every caregiver gets a text the instant a call comes in \u2014 vital when a loved one may not be able to explain where they are or what they need.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2 6 4-14 2 8h6\"><\/path><\/svg><\/div>\n        <h3>No gaps at handoff<\/h3>\n        <p>Coverage passes cleanly from one caregiver to the next. If the assigned person can't answer, the call cascades onward \u2014 never a dead end.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v4a2 2 0 0 1-2.2 2A16 16 0 0 1 3 6.2 2 2 0 0 1 5 4Z\"><\/path><\/svg><\/div>\n        <h3>Works with their setup<\/h3>\n        <p>Program it on a phone, a tablet, an adaptive caller, or a single speed-dial button. No app to install and nothing new to learn.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"11\" rx=\"2\"><\/rect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\/path><\/svg><\/div>\n        <h3>Private &amp; protected<\/h3>\n        <p>Every caregiver's personal number stays hidden behind the single iCanCall line. All routing is encrypted, and your data is never sold.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== SPOTLIGHT STORY ============== -->\n<section class=\"section\" id=\"story\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">A story from a family like yours<\/span>\n      <h2>One button. The right person.<\/h2>\n    <\/div>\n    <div class=\"spotlight-card reveal\">\n      <div class=\"spotlight-quote\">\n        <div class=\"stars\">\u2605\u2605\u2605\u2605\u2605<\/div>\n        <blockquote>\"For our son, a contact list was impossible \u2014 too many choices, too much to manage. Now it's one button, one number, and the right caregiver answers every single time. He has more independence, and our whole team knows the moment he reaches out. It changed everything for us.\"<\/blockquote>\n        <figcaption class=\"by\">\n          <span class=\"avatar\" style=\"background:oklch(0.55 0.11 280)\">PR<\/span>\n          <span><b>Priya R.<\/b><span>Parent &amp; care coordinator<\/span><\/span>\n        <\/figcaption>\n      <\/div>\n      <div class=\"spotlight-aside\">\n        <div class=\"stat-xl\"><b>1<\/b><span>button for him to press<\/span><\/div>\n        <div class=\"divider\"><\/div>\n        <div class=\"stat-xl\"><b>Every<\/b><span>caregiver alerted, every call<\/span><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== PRICING ============== -->\n<section class=\"section tint-band\" id=\"pricing\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Simple, honest pricing<\/span>\n      <h2>Coverage that costs less<br>than a single co-pay.<\/h2>\n      <p class=\"lead\">Both plans include cascade routing, the caller menu, time-aware coverage, and 24\/7 reliability. Cancel anytime.<\/p>\n    <\/div>\n\n    <div class=\"bill-toggle reveal\" id=\"bill-toggle\">\n      <button class=\"bill-btn active\" type=\"button\" data-cycle=\"monthly\">Monthly<\/button ound\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Real-time call alerts<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Bilingual greeting options<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Admin dashboard<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> SMS &amp; email notifications<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Works on any phone \u2014 no app needed<\/li>\n        <\/ul>\n        <a class=\"btn btn-primary plan-select\" href=\"\/onboarding?plan=pro&amp;billing=monthly\">Select Pro<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== FAQ ============== -->\n<section class=\"section\" id=\"faq\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Questions, answered<\/span>\n      <h2>What caregivers ask us most.<\/h2>\n    <\/div>\n    <div class=\"faq reveal\">\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">My loved one is non-verbal or can't explain where they are. Does this still help?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Yes \u2014 that's exactly who it's built for. They don't need to choose a contact or say anything in particular. One press connects them to a caregiver who knows them, and every caregiver in the circle gets an instant text that the call came in, so the right people are aware right away.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Can it work as a single speed-dial button or with an adaptive device?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Absolutely. Because iCanCall is just one phone number, you can program it as a one-touch speed dial, a favorite, or a single button on whatever phone, tablet, or adaptive caller they already use. There's no app to install and nothing new for them to learn.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">How do multiple caregivers and shift changes work?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>From your dashboard, you set who should answer at different times of day \u2014 a day program on weekday mornings, a primary caregiver in the afternoon, an evening caregiver, an overnight on-call nurse. The same number routes to whoever's on for that window, so coverage hands off without a gap.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">What if the assigned caregiver can't pick up?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>The call cascades to the next person in the circle until someone answers. If everyone is unreachable, it goes to voicemail that's transcribed and texted to the whole team \u2014 so a call is never simply lost.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Can a group home or day program be part of the circle?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Yes. Any phone number can be a contact \u2014 a group home line, a day program, a case manager, a nurse, or family. You decide the order and the times, and adjust anytime as the care plan changes.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Is iCanCall a medical alert or emergency service?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>No \u2014 iCanCall connects your loved one to the people on their care team quickly and simply. It complements, but does not replace, 911 or a medical-monitoring service. For life-threatening emergencies, always teach and rely on 911 where possible.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== FINAL CTA ============== -->\n<section class=\"section cta-band\" id=\"cta\">\n  <div class=\"wrap\">\n    <div class=\"cta-card reveal\">\n      <h2>One number. The right person. Every time.<\/h2>\n      <p>Give your loved one the independence of reaching help on their own \u2014 and give your care team the certainty of always being there. Set up iCanCall in minutes.<\/p>\n      <div class=\"actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"#pricing\">Get started<\/a>\n        <a class=\"btn btn-ghost btn-lg\" href=\"#how\" style=\"color:#fff;border-color:oklch(1 0 0 \/ 0.5)\">See how it works<\/a>\n      <\/div>\n      <p class=\"fine\">Set up in minutes \u00b7 No setup fees \u00b7 Cancel anytime<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\/main>\n\n<!-- ============== FOOTER ============== -->\n<footer class=\"footer\">\n  <div class=\"wrap\">\n    <div class=\"footer-grid\">\n      <div>\n        <a class=\"brand\" href=\"\/\">\n          <span class=\"mark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg><\/span>\n          <span>i<b>Can<\/b>Call<\/span>\n        <\/a>\n        <p class=\"blurb\">One memorable number \u2014 or one button \u2014 that always connects your loved one to the right caregiver, while keeping the whole team in the loop.<\/p>\n      <\/div>\n      <div>\n        <h5>Product<\/h5>\n        <ul>\n          <li><a h on any phone \u2014 no app needed\": \"\u0915\u093f\u0938\u0940 \u092d\u0940 \u092b\u094b\u0928 \u092a\u0930 \u0915\u093e\u092e \u0915\u0930\u0924\u093e \u0939\u0948 \u2014 \u0910\u092a \u0906\u0935\u0936\u094d\u092f\u0915 \u0928\u0939\u0940\u0902\", \"2 dedicated phone numbers\": \"2 \u0938\u092e\u0930\u094d\u092a\u093f\u0924 \u0938\u0941\u0930\u0915\u094d\u0937\u093e \u0928\u0902\u092c\u0930\", \"6 routable trusted contacts\": \"\u0905\u0927\u093f\u0915\u0924\u092e 6 \u0938\u0902\u092a\u0930\u094d\u0915 \u0938\u0926\u0938\u094d\u092f\", \"60 minutes included\": \"60 \u0915\u0949\u0932 \u092e\u093f\u0928\u091f \u0936\u093e\u092e\u093f\u0932\", \"Real-time call alerts\": \"\u0935\u093e\u0938\u094d\u0924\u0935\u093f\u0915 \u0938\u092e\u092f \u092e\u0947\u0902 \u0915\u0949\u0932 \u0905\u0932\u0930\u094d\u091f\", \"Admin dashboard\": \"\u0915\u0947\u092f\u0930\u091f\u0947\u0915\u0930 \u0921\u0948\u0936\u092c\u094b\u0930\u094d\u0921\", \"SMS & email notifications\": \"\u090f\u0938\u090f\u092e\u090f\u0938 \u0914\u0930 \u0908\u092e\u0947\u0932 \u0938\u0942\u091a\u0928\u093e\u090f\u0902\", \"Stories from families\": \"\u092a\u0930\u093f\u0935\u093e\u0930\u094b\u0902 \u0915\u0940 \u0915\u0939\u093e\u0928\u093f\u092f\u093e\u0902\", \"The calls that got through.\": \"\u0938\u092b\u0932\u0924\u093e\u092a\u0942\u0930\u094d\u0935\u0915 \u0915\u0928\u0947\u0915\u094d\u091f \u0939\u0941\u0908 \u0915\u0949\u0932\u0964\", \"Questions, answered\": \"\u0905\u0915\u094d\u0938\u0930 \u092a\u0942\u091b\u0947 \u091c\u093e\u0928\u0947 \u0935\u093e\u0932\u0947 \u092a\u094d\u0930\u0936\u094d\u0928\", \"Everything you might ask.\": \"\u0935\u0939 \u0938\u092c \u0915\u0941\u091b \u091c\u094b \u0906\u092a \u092a\u0942\u091b\u0928\u093e \u091a\u093e\u0939\u0924\u0947 \u0939\u0948\u0902\u0964\", \"Ringing\u2026\": \"\u0930\u093f\u0902\u0917 \u0939\u094b \u0930\u0939\u0940 \u0939\u0948\u2026\", \"Connected \u2713\": \"\u0915\u0928\u0947\u0915\u094d\u091f \u0939\u094b \u0917\u092f\u093e \u2713\"}, \"attrs\": {\"Name\": \"\u0928\u093e\u092e\", \"Relationship\": \"\u0938\u0902\u092c\u0902\u0927\"}};\n\n     const DICT_MAP = {\n       'es': DICT_ES,\n       'fr': DICT_FR,\n       'ja': DICT_JA,\n       'zh': DICT_ZH,\n       'ar': DICT_AR,\n       'hi': DICT_HI\n     };\n\n     function translateDOM(node, dict) {\n       if (node.nodeType === Node.TEXT_NODE) {\n         const text = node.nodeValue.trim();\n         if (dict[text]) {\n           node.nodeValue = dict[text];\n         }\n       } else if (node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {\n         node.childNodes.forEach(child => translateDOM(child, dict));\n       }\n     }\n\n     function translatePage(lang) {\n       \/\/ Support RTL for Arabic\n       document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';\n\n       const dict = DICT_MAP[lang];\n       if (dict) {\n         translateDOM(document.body, dict.text);\n         \n         document.querySelectorAll('[placeholder]').forEach(el => {\n           const p = el.getAttribute('placeholder').trim();\n           if (dict.attrs[p]) el.setAttribute('placeholder', dict.attrs[p]);\n         });\n         \n         document.querySelectorAll('.avail .lbl').forEach(el => {\n           const availMap = {\n             'es': { 'Available': 'Disponible', 'Busy': 'Ocupado' },\n             'fr': { 'Available': 'Disponible', 'Busy': 'Occup\u00e9' },\n             'ja': { 'Available': '\u5bfe\u5fdc\u53ef\u80fd', 'Busy': '\u5fd9\u3057\u3044' },\n             'zh': { 'Available': '\u5728\u7ebf\u53ef\u7528', 'Busy': '\u5fd9\u788c' },\n             'ar': { 'Available': '\u0645\u062a\u0627\u062d', 'Busy': '\u0645\u0634\u063a\u0648\u0644' },\n             'hi': { 'Available': '\u0909\u092a\u0932\u092c\u094d\u0927', 'Busy': '\u0935\u094d\u092f\u0938\u094d\u0924' }\n           };\n           const m = availMap[lang];\n           if (m) {\n             if (el.textContent.trim() === 'Available') el.textContent = m['Available'];\n             if (el.textContent.trim() === 'Busy') el.textContent = m['Busy'];\n           }\n         });\n         \n         document.querySelectorAll('.sim-hint').forEach(el => {\n           const hintMap = {\n             'es': 'Desactive contactos a \u00abOcupado\u00bb para ver c\u00f3mo salta la cascada.',\n             'fr': \"D\u00e9sactivez des contacts sur \u00ab Occup\u00e9 \u00bb pour voir l'appel sauter au suivant.\",\n             'ja': '\u9023\u7d61\u5148\u3092\u300c\u5fd9\u3057\u3044\u300d\u306b\u5207\u308a\u66ff\u3048\u3066\u3001\u30ab\u30b9\u30b1\u30fc\u30c9\u8ee2\u9001\u304c\u6b21\u3078\u9032\u3080\u69d8\u5b50\u3092\u78ba\u8a8d\u3067\u304d\u307e\u3059\u3002',\n             'zh': '\u5c06\u8054\u7cfb\u4eba\u5207\u6362\u4e3a\u201c\u5fd9\u788c\u201d\u72b6\u6001\uff0c\u67e5\u770b\u987a\u6b21\u547c\u53eb\u5982\u4f55\u81ea\u52a8\u8df3\u8fc7\u5e76\u547c\u53eb\u4e0b\u4e00\u4f4d\u3002',\n             'ar': '\u0642\u0645 \u0628\u062a\u062d\u0648\u064a\u0644 \u062c\u0647\u0627\u062a \u0627\u0644\u0627\u062a\u0635\u0627\u0644 \u0625\u0644\u0649 '\u0645\u0634\u063a\u0648\u0644' \u0644\u0631\u0624\u064a\u0629 \u0627\u0644\u0631\u0646\u064a\u0646 \u0627\u0644\u0645\u062a\u062a\u0627\u0644\u064a \u064a\u062a\u062c\u0627\u0648\u0632\u0647\u0645 \u0625\u0644\u0649 \u0627\u0644\u062a\u0627\u0644\u064a.',\n             'hi': '\u0915\u0948\u0938\u094d\u0915\u0947\u0921 \u0915\u094b \u0906\u0917\u0947 \u092c\u0922\u093c\u0924\u0947 \u0926\u0947\u0916\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0938\u0926\u0938\u094d\u092f\u094b\u0902 \u0915\u094b \u201c\u0935\u094d\u092f\u0938\u094d\u0924\u201d \u092a\u0930 \u091f\u0949\u0917\u0932 \u0915\u0930\u0947\u0902\u0964'\n           };\n           if (hintMap[lang] && el.textContent.includes('Toggle contacts')) {\n             el.textContent = hintMap[lang];\n           }\n         });\n       } else {\n         window.location.reload();\n       }\n     }\n\n     document.addEventListener('DOMContentLoaded', () => {\n       const select = document.getElementById('langSelect');\n       if (select) {\n         const saved = localStorage.getItem('lang') || 'en';\n         select.value = saved;\n         if (saved !== 'en') translatePage(saved);\n         \n         select.addEventListener('change', (e) => {\n           localStorage.setItem('lang', e.target.value);\n           window.dispatchEvent(new Event('storage'));\n           translatePage(e.target.value);\n         });\n       }\n     });\n\n     window.addEventListener('storage', () => {\n       const select = document.getElementById('langSelect');\n       if (select) {\n         const active = localStorage.getItem('lang') || 'en';\n         if (select.value !== active) {\n           select.value = active;\n           translatePage(active);\n         }\n       }\n     });\n   <\/script>\n<\/body>\n<\/html>"</script>
