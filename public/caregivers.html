-radius: var(--r-xl); overflow: hidden;\n  border: 1px solid var(--line); box-shadow: var(--shadow-lg); background: var(--surface);\n}\n.spotlight-quote { padding: clamp(34px, 4vw, 56px); display: flex; flex-direction: column; }\n.spotlight-quote .stars { color: var(--teal-deep); letter-spacing: 4px; font-size: 1.05rem; margin-bottom: 18px; }\n.spotlight-quote blockquote {\n  font-size: clamp(1.3rem, 2.1vw, 1.7rem); line-height: 1.4; font-weight: 600;\n  letter-spacing: -0.02em; color: var(--ink); flex: 1;\n}\n.spotlight-quote .by { display: flex; align-items: center; gap: 13px; margin-top: 28px; }\n.spotlight-quote .by .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 0.95rem; }\n.spotlight-quote .by b { font-size: 1rem; display: block; }\n.spotlight-quote .by span { font-size: 0.9rem; color: var(--ink-faint); }\n.spotlight-aside {\n  background: linear-gradient(160deg, var(--blue-deep), var(--blue) 55%, var(--teal-deep));\n  color: #fff; padding: clamp(34px, 4vw, 52px); display: flex; flex-direction: column; justify-content: center; gap: 26px;\n}\n.spotlight-aside .stat-xl b { display: block; font-size: clamp(2.4rem, 4vw, 3.4rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1; }\n.spotlight-aside .stat-xl span { font-size: 1rem; color: oklch(0.92 0.02 220); margin-top: 8px; display: block; }\n.spotlight-aside .divider { height: 1px; background: oklch(1 0 0 \/ 0.22); }\n@media (max-width: 820px) { .spotlight-card { grid-template-columns: 1fr; } }\n<\/style>\n<style>\/* ===========================================================\n   iCanCall — Special-abilities caregivers\n   Layers on styles.css + audience.css. Signature section:\n   a 24-hour care-coverage timeline showing the one number\n   always routes to the right caregiver, with no gaps.\n   Person-first, dignified. Calm violet accent.\n   =========================================================== *\/\n\n:root {\n  --care:      oklch(0.55 0.11 280);    \/* calm violet — care-team accent *\/\n  --care-deep: oklch(0.45 0.11 282);\n  --care-tint: oklch(0.95 0.03 285);\n}\n\n\/* violet-tinted hero reassurance for this audience *\/\n.hero-reassure.care { background: var(--care-tint); border-color: oklch(0.55 0.11 280 \/ 0.30); }\n.hero-reassure.care svg { color: var(--care-deep); }\n\n\/* ---------- \"Someone is always responsible\" coverage timeline ---------- *\/\n.coverage { padding-block: clamp(64px, 9vw, 110px); }\n.timeline-card {\n  margin-top: 52px; border-radius: var(--r-xl); padding: clamp(24px, 3vw, 36px);\n  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg);\n}\n.tl-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }\n.tl-head .num {\n  display: inline-flex; align-items: center; gap: 11px; font-weight: 700; font-size: 1.06rem; letter-spacing: -0.02em;\n}\n.tl-head .num .ring {\n  width: 38px; height: 38px; border-radius: 11px; flex: none;\n  background: linear-gradient(150deg, var(--care), var(--blue)); display: grid; place-items: center;\n}\n.tl-head .num .ring svg { width: 19px; height: 19px; }\n.tl-head .num small { display: block; font-size: 0.74rem; font-weight: 500; color: var(--ink-faint); letter-spacing: 0.01em; }\n.tl-now-badge {\n  display: inline-flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 600;\n  color: var(--care-deep); background: var(--care-tint); border: 1px solid oklch(0.55 0.11 280 \/ 0.28);\n  padding: 6px 13px; border-radius: 999px;\n}\n.tl-now-badge .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--care); }\n\n.track {\n  display: flex; height: 76px; border-radius: var(--r-md); overflow: hidden; position: relative;\n  border: 1px solid var(--line);\n}\n.seg {\n  display: flex; flex-direction: column; justify-content: center; gap: 2px;\n  padding: 0 14px; color: #fff; min-width: 0; overflow: hidden; white-space: nowrap;\n}\n.seg b { font-size: 0.92rem; font-weight: 700; text-overflow: ellipsis; overflow: hidden; }\n.seg span { font-size: 0.76rem; opacity: 0.85; text-overflow: ellipsis; overflow: hidden; }\n\n\/* now marker *\/\n.now {\n  position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink);\n  z-index: 3; transform: translateX(-1px);\n}\n.now::before {\n  content: \"\"; position: absolute; top: -4px; left: 50%; transform: translateX(-50%);\n  width: 12px; height: 12px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px var(--surface);\n}\n.now::after {\n  content: \"Now\"; position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%);\n  font-size: 0.7rem; font-weight: 700; color: var(--ink); background: var(--surface);\n  padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap;\n}\n\n.hours {\n  display: flex; justify-content: space-between; margin-top: 12px;\n  font-family: var(--mono); font-size: 0.74rem; color: var(--ink-faint);\n}\n.tl-legend { display: flex; flex-wrap: wrap; gap: 16px 22px; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }\n.tl-legend .item { display: flex; align-items: center; gap: 9px; font-size: 0.9rem; color: var(--ink-soft); }\n.tl-legend .item .dot { width: 12px; height: 12px; border-radius: 4px; flex: none; }\n.tl-legend .item b { color: var(--ink); font-weight: 600; }\n\n.tl-foot { margin-top: 22px; display: flex; gap: 12px; align-items: flex-start; font-size: 0.94rem; color: var(--ink-soft); }\n.tl-foot svg { width: 20px; height: 20px; flex: none; margin-top: 1px; color: var(--care-deep); }\n\n@media (max-width: 680px) {\n  .track { height: 66px; }\n  .seg span { display: none; }\n  .seg b { font-size: 0.8rem; white-space: normal; }\n}\n\n\/* ---------- Simplicity emphasis chips (used under hero or in a band) ---------- *\/\n.one-press { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }\n.one-press .chip {\n  display: inline-flex; align-items: center; gap: 9px; padding: 10px 16px;\n  border-radius: 999px; background: var(--surface); border: 1px solid var(--line);\n  font-size: 0.92rem; font-weight: 600; color: var(--ink-soft); box-shadow: var(--shadow-sm);\n}\n.one-press .chip svg { width: 17px; height: 17px; color: var(--care-deep); }\n<\/style>\n<\/head>\n<body>\n\n\n\n<!-- ============== HEADER ============== -->\n<header class=\"header\">\n  <div class=\"wrap header-inner\">\n    <a class=\"brand\" href=\"\/\" aria-label=\"iCanCall home\">\n      <svg class=\"logo-main\" xmlns=\"http:\/\/www.w3.org\/2000\/svg\" viewBox=\"0 0 800 553.0305\" style=\"height: 40px; width: auto; display: block;\">\n        <style>\n          .logo-main .cls-1 { fill: #1c2530; }\n          .logo-main .cls-2 { fill: #4083ae; }\n          .logo-main .cls-3 { fill: #fff; }\n        <\/style>\n        <g>\n          <path class=\"cls-1\" d=\"M707.4397,239.6996l-.4398-.6591c-31.0327-46.2476-71.4038-97.0542-117.1563-115.2897-5.2177-2.4717-6.9757-4.9985-2.5277-9.777,4.9441-5.1081,11.2601-11.0948,14.6112-17.796,20.8722-36.6356-8.074-84.4763-50.1482-82.2791-44.1058.769-68.9324,53.1134-43.0062,88.0463,4.1744,6.7561,14.6648,13.4569,16.3129,17.4664.8783,2.3621-.2749,3.9548-2.6913,5.8225-22.9037,11.9189-41.9093,33.4498-63.4398,49.1585-24.9366,18.51-48.3902.5495-73.1069-12.9625-9.777-4.6686-13.7865-8.4035-5.9311-18.8946,20.4873-28.2321-1.3195-70.5248-36.9651-68.438-25.7064.5495-45.2603,25.0466-40.866,50.0929.7147,4.449,2.0879,8.788,4.1744,12.7975,3.7896,8.0743,12.0285,14.226,11.8649,18.8946-.3299,6.0421-9.5584,9.1179-16.8077,15.2146-26.2548,20.4323-47.7867,57.5624-82.9938,31.088-4.7779-3.0758-9.9969-6.5362-14.8847-9.5571-4.6679-3.2404-8.6238-4.8335-9.2272-9.7767-.1649-4.6689,6.9757-11.3697,9.0623-19.7186,8.019-24.7167-16.1479-50.477-41.4694-43.5013-19.1142,4.1195-30.9227,25.7603-24.6617,44.2704,1.868,8.074,10.8752,16.4228,12.5233,20.4873,1.5931,3.6253-2.4714,6.3716-5.5476,8.3489-58.7156,40.4 -104.0846,134.2393-3.6246,17.851-9.777,64.3185,18.2358,62.3959,23.6171-4.9981,43.0062-29.0008,68.2727-30.8684,29.9894-5.7122,52.1248,23.838,76.7315,30.7038,36.9101,8.3489,57.1225-52.2347,101.7781-51.7952,30.8677-1.5931,52.3997,26.0349,76.4016,41.1395,31.9673,19.7186,58.8806-12.9075,87.3332-28.6166,77.0051-48.1153,156.0444,57.0133,183.4524-14.2257l.3299-.879c16.3129-69.5362-30.7041-135.0629-73.1069-178.3447ZM161.9688,375.0375c-45.369-4.3394-43.2811-69.9757,2.1978-71.6238h.8783c48.6637,2.2522,45.8638,73.546-3.0762,71.6238ZM378.5432,327.0872c-15.051,43.9408-80.3025,36.9651-85.6302-9.2279-3.6246,25.3758,17.9059-49.653,43.446-49.3785h.7697c29.3296-.4392,51.575,31.0883,41.4144,58.6063ZM601.2122,303.5237c-4.7779,58.1668-84.4756,71.0193-107.5443,17.5764-16.0393-35.592,12.0835-78.6541,51.1901-78.05h.8247c31.8574-.2746,58.5507,28.6716,55.5295,60.4736Z\"\/>\n        <\/g>\n      <\/svg>\n    <\/a>\n    <nav class=\"nav\">\n      <a href=\"#coverage\">Coverage<\/a>\n      <a href=\"#how\">How it works<\/a>\n      <a href=\"#build\">Build the circle<\/a>\n      <a href=\"#pricing\">Pricing<\/a>\n      <a href=\"#faq\">Questions<\/a>\n    <\/nav>\n    <div class=\"header-cta\" style=\"display: flex; align-items: center; gap: 12px;\">\n      <a class=\"btn btn-ghost\" href=\"#how\">See how it works<\/a>\n      <a class=\"btn btn-primary\" href=\"#pricing\">Get started<\/a>\n      <select id=\"langSelect\" class=\"lang-select\" style=\"background: transparent; border: 1px solid var(--line); color: var(--ink-soft); padding: 6px 10px; border-radius: 20px; font-size: 0.86rem; font-weight: 600; cursor: pointer; outline: none; font-family: var(--font); margin-left: 4px;\">\n        <option value=\"en\">🇺🇸 EN<\/option>\n        <option value=\"es\">🇪🇸 ES<\/option>\n        <option value=\"fr\">🇫🇷 FR<\/option>\n        <option value=\"ja\">🇯🇵 JA<\/option>\n        <option value=\"zh\">🇨🇳 ZH<\/option>\n        <option value=\"ar\">🇸🇦 AR<\/option>\n        <option value=\"hi\">🇮🇳 HI<\/option>\n        <option value=\"pt\">🇵🇹 PT<\/option>\n        <option value=\"de\">🇩🇪 DE<\/option>\n        <option value=\"it\">🇮🇹 IT<\/option>\n        <option value=\"ko\">🇰🇷 KO<\/option>\n      <\/select>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main id=\"top\">\n\n<!-- ============== HERO ============== -->\n<section class=\"hero\">\n  <div class=\"wrap hero-grid\">\n    <div class=\"hero-copy\">\n      <span class=\"aud-badge\">\n        <span class=\"hh\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9Z\"><\/path><\/svg><\/span>\n        For families &amp; caregivers of loved ones with special abilities\n      <\/span>\n      <h1>One press.<br><span class=\"accent\">The right caregiver, every time.<\/span><\/h1>\n      <p class=\"lead\">For a loved one who can't work through a contact list, a single number — or one speed-dial button — connects them to exactly the right person on your care team. You decide who answers and when. They just press call.<\/p>\n      <div class=\"hero-actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"#pricing\">Get started<\/a>\n        <a class=\"btn btn-ghost btn-lg\" href=\"#how\">How it works<\/a>\n      <\/div>\n      <div class=\"hero-reassure care\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\/path><\/svg>\n        <p><b>No list to navigate. No decision to make.<\/b> One press reaches a real person who knows them — and your whole care team is alerted the moment they call.<\/p>\n      <\/div>\n    <\/div>\n\n    <!-- Animated routing demo -->\n    <div class=\"demo\" id=\"demo\" aria-label=\"Live call-routing demonstration\">\n      <div class=\"demo-head\">\n        <div class=\"demo-number\">\n          <span class=\"ring\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n          <\/span>\n          <span class=\"num\">(415) 200-CARE<small>Daniel's iCanCall number<\/small><\/span>\n        <\/div>\n        <span class=\"demo-status\"><span class=\"live\"><\/span><span class=\"txt\">Incoming call<\/span><\/span>\n      <\/div>\n      <p class=\"demo-caption\">One press finds the right caregiver, in order, until someone who knows him answers<\/p>\n      <div class=\"chain\">\n        <div class=\"contact\">\n          <span class=\"order\">1<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.58 0.115 232)\">MA<\/span>\n          <span class=\"who\"><b>Maria<\/b><span>Mom · primary caregiver<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">2<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.55 0.11 280)\">JC<\/span>\n          <span class=\"who\"><b>James C.<\/b><span>Co-caregiver<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">3<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.62 0.10 198)\">SP<\/span>\n          <span class=\"who\"><b>Sunrise Program<\/b><span>Day program<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">4<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.6 0.12 30)\">ND<\/span>\n          <span class=\"who\"><b>Nurse Dawn<\/b><span>On-call<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== TRUST STRIP ============== -->\n<section class=\"trust\">\n  <div class=\"wrap trust-inner\">\n    <span class=\"trust-label\">Independence for them, reassurance for you<\/span>\n    <div class=\"trust-stats\">\n      <div class=\"stat\"><b>1<\/b><span>press to reach help<\/span><\/div>\n      <div class=\"stat\"><b>0<\/b><span>lists to navigate<\/span><\/div>\n      <div class=\"stat\"><b>24\/7<\/b><span>caregiver coverage<\/span><\/div>\n      <div class=\"stat\"><b>Whole<\/b><span>care team alerted<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== COVERAGE TIMELINE (signature) ============== -->\n<section class=\"section coverage\" id=\"coverage\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Around-the-clock coverage<\/span>\n      <h2>Someone is always responsible.<\/h2>\n      <p class=\"lead\">The number never changes — but who answers it does. iCanCall routes the same call to the right caregiver for the time of day, so coverage hands off cleanly and there's never a gap.<\/p>\n    <\/div>\n\n    <div class=\"timeline-card reveal\">\n      <div class=\"tl-head\">\n        <span class=\"num\">\n          <span class=\"ring\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg><\/span>\n          (415) 200-CARE<small>Daniel's number — one number, all day<\/small>\n        <\/span>\n        <span class=\"tl-now-badge\"><span class=\"pip\"><\/span>Right now: <b id=\"now-who\" style=\"margin-left:2px\">—<\/b><\/span>\n      <\/div>\n\n      <div class=\"track\" id=\"cov-track\">\n        <div class=\"seg\" style=\"flex-basis:29.17%; background:oklch(0.44 0.105 240)\"><b>Nurse Dawn<\/b><span>On-call · overnight<\/span><\/div>\n        <div class=\"seg\" style=\"flex-basis:33.33%; background:oklch(0.62 0.10 198)\"><b>Sunrise Program<\/b><span>Weekday day program<\/span><\/div>\n        <div class=\"seg\" style=\"flex-basis:25%; background:oklch(0.58 0.115 232)\"><b>Maria (Mom)<\/b><span>Primary caregiver<\/span><\/div>\n        <div class=\"seg\" style=\"flex-basis:12.5%; background:oklch(0.55 0.11 280)\"><b>James C.<\/b><span>Evening<\/span><\/div>\n        <div class=\"now\" id=\"cov-now\" style=\"left:0\"><\/div>\n      <\/div>\n      <div class=\"hours\">\n        <span>12a<\/span><span>6a<\/span><span>12p<\/span><span>6p<\/span><span>12a<\/span>\n      <\/div>\n\n      <div class=\"tl-legend\">\n        <span class=\"item\"><span class=\"dot\" style=\"background:oklch(0.58 0.115 232)\"><\/span><b>Maria<\/b> · primary, afternoons<\/span>\n        <span class=\"item\"><span class=\"dot\" style=\"background:oklch(0.55 0.11 280)\"><\/span><b>James C.<\/b> · evenings<\/span>\n        <span class=\"item\"><span class=\"dot\" style=\"background:oklch(0.62 0.10 198)\"><\/span><b>Sunrise Program<\/b> · weekdays<\/span>\n        <span class=\"item\"><span class=\"dot\" style=\"background:oklch(0.44 0.105 240)\"><\/span><b>Nurse Dawn<\/b> · overnight on-call<\/span>\n      <\/div>\n\n      <div class=\"tl-foot\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z\"><\/path><path d=\"m9 12 2 2 4-4\"><\/path><\/svg>\n        <p>If the assigned caregiver can't pick up, the call cascades to the next person in the circle — so a call is never left unanswered, at any hour.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== HOW IT WORKS ============== -->\n<section class=\"section tint-band\" id=\"how\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">How it works<\/span>\n      <h2>You build the care team.<br>They press one button.<\/h2>\n      <p class=\"lead\">All of the complexity lives with you, in the dashboard. For your loved one, it stays as simple as a single call.<\/p>\n    <\/div>\n    <div class=\"steps\">\n      <div class=\"step reveal\">\n        <div class=\"idx\">1<\/div>\n        <h3>Claim one number<\/h3>\n        <p>Pick a single iCanCall number and set it as a speed-dial or a one-touch button on whatever device they use — a phone, a tablet, or an adaptive caller. That one button is all they ever need.<\/p>\n        <svg class=\"step-arrow\" width=\"60\" height=\"24\" viewBox=\"0 0 60 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M0 12h54m0 0-7-7m7 7-7 7\"><\/path><\/svg>\n      <\/div>\n      <div class=\"step reveal\">\n        <div class=\"idx\">2<\/div>\n        <h3>Build the care team<\/h3>\n        <p>Add up to six caregivers — family, co-caregivers, a day program, a group home, an on-call nurse — and set who should answer, and when, across the day.<\/p>\n        <svg class=\"step-arrow\" width=\"60\" height=\"24\" viewBox=\"0 0 60 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M0 12h54m0 0-7-7m7 7-7 7\"><\/path><\/svg>\n      <\/div>\n      <div class=\"step reveal\">\n        <div class=\"idx\">3<\/div>\n        <h3>They reach the right person<\/h3>\n        <p>When they press call, iCanCall routes to the right caregiver for that moment and <b>cascades<\/b> on if needed — while every caregiver gets an instant text that the call came in.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== INTERACTIVE BUILDER ============== -->\n<section class=\"section\" id=\"build\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Try it yourself<\/span>\n      <h2>Build the care team that answers.<\/h2>\n      <p class=\"lead\">Add the caregivers you trust, set their order, then place a pretend call. Choose <b>cascade<\/b> — ring each caregiver in turn until someone picks up — or a simple <b>caller menu<\/b>. Your loved one only ever makes one call.<\/p>\n    <\/div>\n    <div class=\"mode-toggle reveal\">\n      <span class=\"mode-label\">Routing mode<\/span>\n      <div class=\"seg\" role=\"tablist\" aria-label=\"Routing mode\">\n        <button class=\"seg-btn active\" type=\"button\" data-mode=\"cascade\" role=\"tab\">Call cascade<\/button>\n        <button class=\"seg-btn\" type=\"button\" data-mode=\"menu\" role=\"tab\">Caller menu<\/button>\n      <\/div>\n      <span class=\"mode-note\">\n        <svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"10\" rx=\"2\"><\/rect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\/path><\/svg>\n        You set this once in the dashboard\n      <\/span>\n    <\/div>\n    <div class=\"builder reveal\">\n      <!-- editor -->\n      <div class=\"builder-panel\">\n        <div class=\"builder-head\">\n          <h3>The care team<\/h3>\n          <span class=\"count\"><span id=\"ccount\">0<\/span>\/6 contacts<\/span>\n        <\/div>\n        <div id=\"circle-list\" class=\"circle-list\"><\/div>\n        <form id=\"add-form\" class=\"add-form\" autocomplete=\"off\">\n          <input id=\"add-name\" type=\"text\" placeholder=\"Name\" maxlength=\"22\" required=\"\">\n          <input id=\"add-rel\" type=\"text\" placeholder=\"Role\" maxlength=\"22\">\n          <button class=\"btn btn-primary add-btn\" type=\"submit\" aria-label=\"Add caregiver\" title=\"Add caregiver\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg>\n          <\/button>\n        <\/form>\n      <\/div>\n      <!-- simulator -->\n      <div class=\"sim-panel\">\n        <div class=\"sim-screen\" id=\"sim-screen\">\n          <span class=\"num-line\">(415) 200-CARE<\/span>\n          <div class=\"sim-avatar\" id=\"sim-avatar\">—<\/div>\n          <div class=\"sim-name\" id=\"sim-name\">Ready<\/div>\n          <div class=\"sim-state\" id=\"sim-state\">Press call to start routing<\/div>\n          <div class=\"sim-dots\" id=\"sim-dots\"><\/div>\n        <\/div>\n        <button class=\"btn btn-primary\" id=\"place-call\">\n          <svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n          Place a call\n        <\/button>\n        <p class=\"sim-hint\">Toggle a caregiver to \"Busy\" to see the cascade skip ahead.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== FEATURES ============== -->\n<section class=\"section tint-band\" id=\"features\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Why caregivers choose iCanCall<\/span>\n      <h2>Simple for them.<br>Complete for you.<\/h2>\n    <\/div>\n    <div class=\"features\">\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><circle cx=\"12\" cy=\"12\" r=\"3.2\"><\/circle><\/svg><\/div>\n        <h3>One press, one action<\/h3>\n        <p>No contact list, no menus, no choosing. A single number or button is the entire interaction — designed for those a list would only overwhelm.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 7v5l3 2\"><\/path><\/svg><\/div>\n        <h3>Always the right caregiver<\/h3>\n        <p>Time-aware routing sends the call to whoever's on for that part of the day — primary caregiver, day program, evening, or overnight on-call.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16v11H7l-3 3V5Z\"><\/path><path d=\"M8 9h8M8 12h5\"><\/path><\/svg><\/div>\n        <h3>Whole team alerted<\/h3>\n        <p>Every caregiver gets a text the instant a call comes in — vital when a loved one may not be able to explain where they are or what they need.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2 6 4-14 2 8h6\"><\/path><\/svg><\/div>\n        <h3>No gaps at handoff<\/h3>\n        <p>Coverage passes cleanly from one caregiver to the next. If the assigned person can't answer, the call cascades onward — never a dead end.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v4a2 2 0 0 1-2.2 2A16 16 0 0 1 3 6.2 2 2 0 0 1 5 4Z\"><\/path><\/svg><\/div>\n        <h3>Works with their setup<\/h3>\n        <p>Program it on a phone, a tablet, an adaptive caller, or a single speed-dial button. No app to install and nothing new to learn.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"11\" rx=\"2\"><\/rect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\/path><\/svg><\/div>\n        <h3>Private &amp; protected<\/h3>\n        <p>Every caregiver's personal number stays hidden behind the single iCanCall line. All routing is encrypted, and your data is never sold.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== SPOTLIGHT STORY ============== -->\n\n\n<!-- ============== PRICING ============== -->\n<section class=\"section tint-band\" id=\"pricing\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Simple, honest pricing<\/span>\n      <h2>Coverage that costs less<br>than a single co-pay.<\/h2>\n      <p class=\"lead\">All plans include cascade routing, the caller menu, time-aware coverage, and 24\/7 reliability. Cancel anytime.<\/p>\n    <\/div>\n\n    <div class=\"bill-toggle reveal\" id=\"bill-toggle\">\n      <button class=\"bill-btn active\" type=\"button\" data-cycle=\"monthly\">Monthly<\/button>\n      <button class=\"bill-btn\" type=\"button\" data-cycle=\"annual\">Annual <em>Save 17%<\/em><\/button>\n    <\/div>\n\n    <div class=\"pricing\">\n      <div class=\"plan reveal\" data-m-amt=\"$14.99\" data-m-per=\"\/ month\" data-m-note=\"Billed monthly · cancel anytime\" data-a-amt=\"$149\" data-a-per=\"\/ year\" data-a-note=\"Just $12.42\/mo, billed annually\">\n        <h3>Essential<\/h3>\n        <p class=\"desc\">One number for one loved one.<\/p>\n        <div class=\"price\"><b class=\"amt\">$14.99<\/b><span class=\"per\">\/ month<\/span><\/div>\n        <p class=\"price-yr\">Billed monthly · cancel anytime<\/p>\n        <ul>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> 1 Dedicated Safety Number<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentCol ton>\n        <div class=\"faq-a\"><p>Absolutely. Because iCanCall is just one phone number, you can program it as a one-touch speed dial, a favorite, or a single button on whatever phone, tablet, or adaptive caller they already use. There's no app to install and nothing new for them to learn.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">How do multiple caregivers and shift changes work?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>From your dashboard, you set who should answer at different times of day — a day program on weekday mornings, a primary caregiver in the afternoon, an evening caregiver, an overnight on-call nurse. The same number routes to whoever's on for that window, so coverage hands off without a gap.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">What if the assigned caregiver can't pick up?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>The call cascades to the next person in the circle until someone answers. If everyone is unreachable, it goes to voicemail that's transcribed and texted to the whole team — so a call is never simply lost.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Can a group home or day program be part of the circle?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Yes. Any phone number can be a contact — a group home line, a day program, a case manager, a nurse, or family. You decide the order and the times, and adjust anytime as the care plan changes.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Is iCanCall a medical alert or emergency service?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>No — iCanCall connects your loved one to the people on their care team quickly and simply. It complements, but does not replace, 911 or a medical-monitoring service. For life-threatening emergencies, always teach and rely on 911 where possible.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== USE CASES ============== -->\n<section class=\"section\" id=\"usecases\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Who it's for<\/span>\n      <h2>Designed for the moments that matter<\/h2>\n      <p class=\"lead\">iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.<\/p>\n    <\/div>\n    <div class=\"usecases\">\n      <article class=\"usecase reveal\">\n        <a class=\"ph\" href=\"\/parents\" aria-label=\"For Kids\"><img src=\"\/usecases\/child-calling.png\" alt=\"Young children\" style=\"transform:scale(1.25);transform-origin:center bottom;object-position:center bottom\"><\/a>\n        <div class=\"body\">\n          <h3><a href=\"\/parents\">For Kids<\/a><\/h3>\n          <p>Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.<\/p>\n        <\/div>\n      <\/article>\n      <article class=\"usecase reveal\">\n        <a class=\"ph\" href=\"\/seniors\" aria-label=\"For Seniors\"><img src=\"\/usecases\/aging-parent.png\" alt=\"Aging parents\" style=\"transform:scale(1.4);transform-origin:center center;object-position:center 58%\"><\/a>\n        <div class=\"body\">\n          <h3><a href=\"\/seniors\">For Seniors<\/a><\/h3>\n          <p>A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.<\/p>\n        <\/div>\n      <\/article>\n      <article class=\"usecase reveal\">\n        <a class=\"ph\" href=\"\/caregivers\" aria-label=\"For Special Needs\"><img src=\"\/usecases\/special-abilities.png\" alt=\"Special abilities &amp; caregivers\" style=\"transform:scale(1.4);transform-origin:center center;object-position:center 70%\"><\/a>\n        <div class=\"body\">\n mmunication.\": \"iCanCall se adapta de manera única a las familias que necesitan una comunicación de seguridad simple y libre de pantallas.\",\n      \"For Kids\": \"Para Niños\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"Permite a los niños comunicarse con la familia desde cualquier teléfono de casa, sin las distracciones de un smartphone.\",\n      \"For Seniors\": \"Para Personas Mayores\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"Una línea de vida para padres o abuelos. Solo tienen que recordar un número para comunicarse con toda la familia.\",\n      \"For Special Needs\": \"Para Necesidades Especiales\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"Simplifica la comunicación para personas con dificultades cognitivas o físicas, dándoles acceso directo a apoyo.\",\n      \"Coverage\": \"Cobertura\",\n      \"Build the circle\": \"Arme el círculo\",\n      \"Questions\": \"Preguntas\",\n      \"For families & caregivers of loved ones with special abilities\": \"Para familias y cuidadores de seres queridos con habilidades especiales\",\n      \"One press.\": \"Un solo toque.\",\n      \"The right caregiver, every time.\": \"El cuidador indicado, siempre.\",\n      \"For a loved one who can't work through a contact list, a single number — or one speed-dial button — connects them to exactly the right person on your care team. You decide who answers and when. They just press call.\": \"Para un ser querido que no puede manejar una lista de contactos, un solo número — o un botón de marcación rápida — lo conecta exactamente con la persona indicada de su equipo de cuidado. Usted decide quién contesta y cuándo. Ellos solo presionan llamar.\",\n      \"No list to navigate. No decision to make.\": \"Sin listas que recorrer. Sin decisiones que tomar.\",\n      \"One press reaches a real person who knows them — and your whole care team is alerted the moment they call.\": \"Un solo toque los comunica con una persona real que los conoce — y todo su equipo de cuidado recibe un aviso en el momento en que llaman.\",\n      \"Daniel's iCanCall number\": \"Número iCanCall de Daniel\",\n      \"Incoming call\": \"Llamada entrante\",\n      \"One press finds the right caregiver, in order, until someone who knows him answers\": \"Un solo toque encuentra al cuidador indicado, en orden, hasta que contesta alguien que lo conoce\",\n      \"Mom · primary caregiver\": \"Mamá · cuidadora principal\",\n      \"Standing by\": \"En espera\",\n      \"Co-caregiver\": \"Cocuidador\",\n      \"Day program\": \"Programa de día\",\n      \"Nurse Dawn\": \"Enfermera Dawn\",\n      \"On-call\": \"De guardia\",\n      \"Independence for them, reassurance for you\": \"Independencia para ellos, tranquilidad para usted\",\n      \"press to reach help\": \"toque para pedir ayuda\",\n      \"lists to navigate\": \"listas que recorrer\",\n      \"caregiver coverage\": \"cobertura de cuidadores\",\n      \"Whole\": \"Todo\",\n      \"care team alerted\": \"el equipo de cuidado avisado\",\n      \"Around-the-clock coverage\": \"Cobertura las 24 horas\",\n      \"Someone is always responsible.\": \"Siempre hay alguien a cargo.\",\n      \"The number never changes — but who answers it does. iCanCall routes the same call to the right caregiver for the time of day, so coverage hands off cleanly and there's never a gap.\": \"El número nunca cambia — pero quién lo contesta, sí. iCanCall dirige la misma llamada al cuidador indicado según la hora del día, para que los relevos sean limpios y nunca quede un hueco en la cobertura.\",\n      \"Daniel's number — one number, all day\": \"El número de Daniel — un solo número, todo el día\",\n      \"Right now:\": \"Ahora mismo:\",\n      \"On-call · overnight\": \"De guardia · madrugada\",\n      \"Weekday day program\": \"Programa de día entre semana\",\n      \"Maria (Mom)\": \"Maria (Mamá)\",\n      \"Primary caregiver\": \"Cuidadora principal\",\n      \"Evening\": \"Noche\",\n      \"12a\": \"12 a.m.\",\n      \"6a\": \"6 a.m.\",\n      \"12p\": \"12 p.m.\",\n      \"6p\": \"6 p.m.\",\n      \"· primary, afternoons\": \"· principal, tardes\",\n      \"· evenings\": \"· noches\",\n      \"· weekdays\": \"· entre semana\",\n      \"· overnight on-call\": \"· de guardia en la madrugada\",\n      \"If the assigned caregiver can't pick up, the call cascades to the next person in the circle — so a call is never left unanswered, at any hour.\": \"Si el cuidador asignado no puede contestar, la llamada pasa en cascada a la siguiente persona del círculo — así ninguna llamada queda sin respuesta, a ninguna hora.\",\n      \"You build the care team.\": \"Usted arma el equipo de cuidado.\",\n      \"They press one button.\": \"Ellos presionan un botón.\",\n      \"All of the complexity lives with you, in the dashboard. For your loved one, it stays as simple as a single call.\": \"Toda la complejidad queda en sus manos, en el panel de control. Para su ser querido, sigue siendo tan simple como una sola llamada.\",\n      \"Claim one number\": \"Reserve un número\",\n      \"Pick a single iCanCall number and set it as a speed-dial or a one-touch button on whatever device they use — a phone, a tablet, or an adaptive caller. That one button is all they ever need.\": \"Elija un solo número iCanCall y configúrelo como marcación rápida o como botón de un solo toque en el dispositivo que usen — un teléfono, una tableta o un teléfono adaptado. Ese único botón es todo lo que van a necesitar.\",\n      \"Build the care team\": \"Arme el equipo de cuidado\",\n      \"Add up to six caregivers — family, co-caregivers, a day program, a group home, an on-call nurse — and set who should answer, and when, across the day.\": \"Agregue hasta seis cuidadores — familia, cocuidadores, un programa de día, un hogar grupal, una enfermera de guardia — y defina quién debe contestar, y cuándo, a lo largo del día.\",\n      \"They reach the right person\": \"Llegan a la persona indicada\",\n      \"When they press call, iCanCall routes to the right caregiver for that moment and\": \"Cuando presionan llamar, iCanCall dirige la llamada al cuidador indicado para ese momento y\",\n      \"cascades\": \"llama en cascada\",\n      \"on if needed — while every caregiver gets an instant text that the call came in.\": \"a los siguientes si hace falta — mientras cada cuidador recibe al instante un mensaje de texto avisando que entró la llamada.\",\n      \"Try it yourself\": \"Pruébelo usted mismo\",\n      \"Build the care team that answers.\": \"Arme el equipo de cuidado que contesta.\",\n      \"Add the caregivers you trust, set their order, then place a pretend call. Choose\": \"Agregue a los cuidadores de su confianza, defina el orden y haga una llamada de prueba. Elija\",\n      \"cascade\": \"cascada\",\n      \"— ring each caregiver in turn until someone picks up — or a simple\": \"— llama a cada cuidador por turno hasta que alguien contesta — o un sencillo\",\n      \"caller menu\": \"menú de llamadas\",\n      \". Your loved one only ever makes one call.\": \". Su ser querido solo hace una llamada.\",\n      \"Routing mode\": \"Modo de enrutamiento\",\n      \"Call cascade\": \"Llamada en cascada\",\n      \"Caller menu\": \"Menú de llamadas\",\n      \"You set this once in the dashboard\": \"Esto se configura una sola vez en el panel de control\",\n      \"The care team\": \"El equipo de cuidado\",\n      \"\/6 contacts\": \"\/6 contactos\",\n      \"Ready\": \"Listo\",\n      \"Press call to start routing\": \"Presione llamar para iniciar el enrutamiento\",\n      \"Place a call\": \"Hacer una llamada\",\n      \"Toggle a caregiver to \\\"Busy\\\" to see the cascade skip ahead.\": \"Marque a un cuidador como “Ocupado” para ver cómo la cascada pasa al siguiente.\",\n      \"Why caregivers choose iCanCall\": \"Por qué los cuidadores eligen iCanCall\",\n      \"Simple for them.\": \"Simple para ellos.\",\n      \"Complete for you.\": \"Completo para usted.\",\n      \"One press, one action\": \"Un toque, una acción\",\n      \"No contact list, no menus, no choosing. A single number or button is the entire interaction — designed for those a list would only overwhelm.\": \"Sin lista de contactos, sin menús, sin tener que elegir. Un solo número o botón es toda la interacción — pensado para quienes una lista solo lograría abrumar.\",\n      \"Always the right caregiver\": \"Siempre el cuidador indicado\",\n      \"Time-aware routing sends the call to whoever's on for that part of the day — primary caregiver, day program, evening, or overnight on-call.\": \"El enrutamiento según el horario envía la llamada a quien esté de turno en esa parte del día — cuidador principal, programa de día, noche o guardia de madrugada.\",\n      \"Whole team alerted\": \"Todo el equipo avisado\",\n      \"Every caregiver gets a text the instant a call comes in — vital when a loved one may not be able to explain where they are or what they need.\": \"Cada cuidador recibe un mensaje de texto en el instante en que entra una llamada — vital cuando un ser querido quizá no pueda explicar dónde está o qué necesita.\",\n      \"No gaps at handoff\": \"Sin huecos en los relevos\",\n      \"Coverage passes cleanly from one caregiver to the next. If the assigned person can't answer, the call cascades onward — never a dead end.\": \"La cobertura pasa limpiamente de un cuidador al siguiente. Si la persona asignada no puede contestar, la llamada sigue en cascada — nunca un callejón sin salida.\",\n      \"Works with their setup\": \"Funciona con lo que ya usan\",\n      \"Program it on a phone, a tablet, an adaptive caller, or a single speed-dial button. No app to install and nothing new to learn.\": \"Prográmelo en un teléfono, una tableta, un teléfono adaptado o un solo botón de marcación rápida. Sin app que instalar ni nada nuevo que aprender.\",\n      \"Private & protected\": \"Privado y protegido\",\n      \"Every caregiver's personal number stays hidden behind the single iCanCall line. All routing is encrypted, and your data is never sold.\": \"El número personal de cada cuidador queda oculto detrás de la única línea iCanCall. Todo el enrutamiento está cifrado y sus datos nunca se venden.\",\n      \"Simple, honest pricing\": \"Precios simples y honestos\",\n      \"Coverage that costs less\": \"Cobertura que cuesta menos\",\n      \"than a single co-pay.\": \"que un solo copago.\",\n      \"\/ month\": \"\/ mes\",\n      \"What caregivers ask us most.\": \"Lo que más nos preguntan los cuidadores.\",\n      \"My loved one is non-verbal or can't explain where they are. Does this still help?\": \"Mi ser querido no habla o no puede explicar dónde está. ¿Esto igual le sirve?\",\n      \"Yes — that's exactly who it's built for. They don't need to choose a contact or say anything in particular. One press connects them to a caregiver who knows them, and every caregiver in the circle gets an instant text that the call came in, so the right people are aware right away.\": \"Sí — está pensado precisamente para ellos. No necesitan elegir un contacto ni decir nada en particular. Un solo toque los conecta con un cuidador que los conoce, y cada cuidador del círculo recibe al instante un mensaje de texto avisando que entró la llamada, para que las personas indicadas se enteren de inmediato.\",\n      \"Can it work as a single speed-dial button or with an adaptive device?\": \"¿Puede funcionar como un solo botón de marcación rápida o con un dispositivo adaptado?\",\n      \"Absolutely. Because iCanCall is just one phone number, you can program it as a one-touch speed dial, a favorite, or a single button on whatever phone, tablet, or adaptive caller they already use. There's no app to install and nothing new for them to learn.\": \"Por supuesto. Como iCanCall es simplemente un número de teléfono, puede programarlo como marcación rápida de un solo toque, como favorito o como un único botón en el teléfono, la tableta o el teléfono adaptado que ya usen. No hay ninguna app que instalar ni nada nuevo que aprender.\",\n      \"How do multiple caregivers and shift changes work?\": \"¿Cómo funciona con varios cuidadores y cambios de turno?\",\n      \"From your dashboard, you set who should answer at different times of day — a day program on weekday mornings, a primary caregiver in the afternoon, an evening caregiver, an overnight on-call nurse. The same number routes to whoever's on for that window, so coverage hands off without a gap.\": \"Desde su panel de control, usted define quién debe contestar a distintas horas del día — un programa de día en las mañanas entre semana, un cuidador principal por la tarde, un cuidador por la noche, una enfermera de guardia en la madrugada. El mismo número dirige la llamada a quien esté de turno en ese horario, para que la cobertura se releve sin huecos.\",\n      \"What if the assigned caregiver can't pick up?\": \"¿Y si el cuidador asignado no puede contestar?\",\n      \"The call cascades to the next person in the circle until someone answers. If everyone is unreachable, it goes to voicemail that's transcribed and texted to the whole team — so a call is never simply lost.\": \"La llamada pasa en cascada a la siguiente persona del círculo hasta que alguien contesta. Si no se logra localizar a nadie, pasa a un buzón de voz que se transcribe y se envía por mensaje de texto a todo el equipo — así una llamada nunca se pierde sin más.\",\n      \"Can a group home or day program be part of the circle?\": \"¿Un hogar grupal o un programa de día puede formar parte del círculo?\",\n      \"Yes. Any phone number can be a contact — a group home line, a day program, a case manager, a nurse, or family. You decide the order and the times, and adjust anytime as the care plan changes.\": \"Sí. Cualquier número de teléfono puede ser un contacto — la línea de un hogar grupal, un programa de día, un administrador de casos, una enfermera o la familia. Usted decide el orden y los horarios, y los ajusta cuando quiera a medida que cambia el plan de cuidado.\",\n      \"Is iCanCall a medical alert or emergency service?\": \"¿iCanCall es un servicio de alerta médica o de emergencias?\",\n      \"No — iCanCall connects your loved one to the people on their care team quickly and simply. It complements, but does not replace, 911 or a medical-monitoring service. For life-threatening emergencies, always teach and rely on 911 where possible.\": \"No — iCanCall conecta a su ser querido con las personas de su equipo de cuidado de forma rápida y sencilla. Complementa, pero no reemplaza, al 911 ni a un servicio de monitoreo médico. Para emergencias que pongan en riesgo la vida, enseñe siempre a usar el 911 y recurra a él cuando sea posible.\",\n      \"One number. The right person. Every time.\": \"Un número. La persona indicada. Siempre.\",\n      \"Give your loved one the independence of reaching help on their own — and give your care team the certainty of always being there. Set up iCanCall in minutes.\": \"Dele a su ser querido la independencia de pedir ayuda por su cuenta — y dele a su equipo de cuidado la certeza de estar siempre presente. Configure iCanCall en minutos.\",\n      \"One memorable number — or one button — that always connects your loved one to the right caregiver, while keeping the whole team in the loop.\": \"Un número memorable — o un solo botón — que siempre conecta a su ser querido con el cuidador indicado, mientras mantiene informado a todo el equipo.\",\n      \"For every family\": \"Para cada familia\",\n      \"iCanCall, Inc. All rights reserved.\": \"iCanCall, Inc. Todos los derechos reservados.\"\n    },\n    \"attrs\": {\n      \"Name\": \"Nombre\",\n      \"Relationship\": \"Relación\",\n      \"Role\": \"Rol\"\n    }\n  },\n  \"fr\": {\n    \"text\": {\n      \"How it works\": \"Comment ça marche\",\n      \"Features\": \"Fonctionnalités\",\n      \"Who it's for\": \"Pour qui\",\n      \"Pricing\": \"Tarifs\",\n      \"FAQ\": \"FAQ\",\n      \"Login\": \"Connexion\",\n      \"See how it works\": \"Voir le fonctionnement\",\n      \"Select a Plan\": \"Choisir un forfait\",\n      \"See How We Compare\": \"Découvrez notre comparatif\",\n      \"Comparison Chart\": \"Tableau comparatif\",\n      \"Key:\": \"Légende :\",\n      \"Included\": \"Inclus\",\n      \"Not available\": \"Non disponible\",\n      \"Limited or conditional\": \"Limité ou conditionnel\",\n      \"Product\": \"Produit\",\n      \"Who\": \"Pour qui\",\n      \"Company\": \"Entreprise\",\n      \"Trust\": \"Confiance\",\n      \"Parents\": \"Parents\",\n      \"Caregivers\": \"Aidants\",\n      \"Seniors\": \"Séniors\",\n      \"About\": \"À propos\",\n      \"Careers\": \"Recrutement\",\n      \"Stories\": \"Histoires\",\n      \"Contact\": \"Contact\",\n      \"Privacy\": \"Confidentialité\",\n      \"Security\": \"Sécurité\",\n      \"Terms\": \"Conditions\",\n      \"Made for the moments that matter.\": \"Fait pour les moments qui comptent.\",\n      \"© 2026 iCanCall, Inc. All rights reserved.\": \"© 2026 iCanCall, Inc. Tous droits réservés.\",\n      \"One memorable number that always connects to the people who matter most. Safety on autopilot.\": \"Un numéro mémorable qui connecte toujours aux personnes qui comptent le plus. La sécurité en pilote automatique.\",\n      \"Ready to secure your family?\": \"Prêt à sécuriser votre famille ?\",\n      \"Give your loved ones the safety and simplicity of iCanCall today. Set up in under 5 minutes.\": \"Offrez dès aujourd'hui à vos proches la sécurité et la simplicité d'iCanCall. Configuration en moins de 5 minutes.\",\n      \"Get Started Now\": \"Démarrer maintenant\",\n      \"Back to Homepage\": \"Retour à l'accueil\",\n      \"Set up in minutes · No setup fees · Cancel anytime\": \"Configuration en minutes · Aucun frais d'activation · Sans engagement\",\n      \"One number your parent will never forget.\": \"Un seul numéro que votre parent n'oubliera jamais.\",\n      \"iCanCall connects seniors to their circle of support without smartphones, apps, or complicated tech. Starting at $12.99\/mo.\": \"iCanCall connecte les aînés à leur cercle d'aidants sans smartphone ni technologie complexe. À partir de 12,99 $\/mois.\",\n      \"See how it works for seniors\": \"Voir le fonctionnement pour les séniors\",\n      \"Set it up for them\": \"Configurer pour eux\",\n      \"Get started\": \"Démarrer\",\n      \"Select a plan for them\": \"Choisir un forfait pour eux\",\n      \"How it works for seniors\": \"Comment ça marche pour les séniors\",\n      \"Safe, screen-free call routing for elderly parents.\": \"Acheminement sécurisé et sans écran pour parents âgés.\",\n      \"One number your child will never forget.\": \"Un seul numéro que votre enfant n'oubliera jamais.\",\n      \"iCanCall connects your kids to their circle of care without screen time, apps, or complex devices. Starting at $12.99\/mo.\": \"iCanCall connecte vos enfants à leur cercle de confiance sans écran ni smartphone. À partir de 12,99 $\/mois.\",\n      \"See how it works for kids\": \"Voir le fonctionnement pour les enfants\",\n      \"How it works for parents\": \"Comment ça marche pour les parents\",\n      \"Safe, screen-free call routing for young children.\": \"Acheminement sécurisé et sans écran pour jeunes enfants.\",\n      \"One number your client will never forget.\": \"Un seul numéro que votre proche n'oubliera jamais.\",\n      \"iCanCall connects your clients or loved ones to their care network instantly, without complex devices. Starting at $12.99\/mo.\": \"iCanCall connecte vos proches à leur réseau d'aidants instantanément et sans appareil complexe. À partir de 12,99 $\/mois.\",\n      \"See how it works for caregivers\": \"Voir le fonctionnement pour les aidants\",\n      \"How it works for caregivers\": \"Comment ça marche pour les aidants\",\n      \"Safe, screen-free call routing for caregivers.\": \"Acheminement sécurisé et sans écran pour aidants.\",\n      \"Aging parent\": \"Parent âgé\",\n      \"Aging parents\": \"Parents âgés\",\n      \"Child calling home\": \"Enfant appelant la maison\",\n      \"Young children\": \"Jeunes enfants\",\n      \"Special-abilities care\": \"Besoins spécifiques\",\n      \"Special abilities & caregivers\": \"Besoins spécifiques & aidants\",\n      \"Essential\": \"Essentiel\",\n      \"Essential Plan\": \"Forfait Essentiel\",\n      \"Pro\": \"Pro\",\n      \"Pro Plan\": \"Forfait Pro\",\n      \"Select Essential\": \"Choisir Essentiel\",\n      \"Select Pro\": \"Choisir Pro\",\n      \"Most popular\": \"Le plus populaire\",\n      \"Monthly\": \"Mensuel\",\n      \"Annual\": \"Annuel\",\n      \"Save 17%\": \"Économisez 17%\",\n      \"Save 20%\": \"Économisez 20%\",\n      \"One number for one loved one.\": \"Un numéro pour un seul proche.\",\n      \"Full protection for the whole circle.\": \"Protection complète pour tout le cercle.\",\n      \"Billed monthly · cancel anytime\": \"Facturé mensuellement · sans engagement\",\n      \"Just $10.75\/mo, billed annually\": \"Seulement 10,75 $\/mois, facturé à l'année\",\n      \"Just $16.58\/mo, billed annually\": \"Seulement 16,58 $\/mois, facturé à l'année\",\n      \"Everything included in the plan:\": \"Tout ce qui est inclus dans le forfait :\",\n      \"1 number included\": \"1 numéro de sécurité dédié\",\n      \"3 routable trusted contacts\": \"Jusqu'à 3 contacts enregistrés\",\n      \"Cascade routing + Caller Menu\": \"Appel en cascade + Menu vocal\",\n      \"30 voice minutes\": \"30 minutes d'appel\",\n      \"Bilingual greeting options\": \"Options d'accueil bilingues\",\n      \"Works on any phone — no app needed\": \"Fonctionne sur tout téléphone — sans appli\",\n      \"2 dedicated phone numbers\": \"2 numéros de sécurité dédiés\",\n      \"6 routable trusted contacts\": \"Jusqu'à 6 contacts enregistrés\",\n      \"60 minutes included\": \"60 minutes d'appel incluses\",\n      \"Real-time call alerts\": \"Alertas de llamadas en tiempo real\",\n      \"Admin dashboard\": \"Tableau de bord administrateur\",\n      \"SMS & email notifications\": \"Alertes SMS & e-mail\",\n      \"Stories from families\": \"Témoignages de familles\",\n      \"The calls that got through.\": \"Les appels qui ont connecté.\",\n      \"Questions, answered\": \"Foire Aux Questions\",\n      \"Everything you might ask.\": \"Tout ce que vous pourriez vous demander.\",\n      \"Ringing…\": \"Sonnerie…\",\n      \"Connected ✓\": \"Connecté ✓\",\n      \"Care Team\": \"Équipe de soins\",\n      \"Select Plan\": \"Choisir ce forfait\",\n      \"One number for one parent.\": \"Un numéro pour un parent.\",\n      \"Full coverage for the whole care team.\": \"Couverture complète pour toute l'équipe de soins.\",\n      \"Built for shared caregiving across several loved ones, with room for a second caregiver.\": \"Conçu pour le soin partagé de plusieurs proches, avec une place pour un second aidant.\",\n      \"Just $12.42\/mo, billed annually\": \"Seulement 12,42 $\/mois, facturé à l'année\",\n      \"Just $20.75\/mo, billed annually\": \"Seulement 20,75 $\/mois, facturé à l'année\",\n      \"Just $41.58\/mo, billed annually\": \"Seulement 41,58 $\/mois, facturé à l'année\",\n      \"1 Dedicated Safety Number\": \"1 numéro de sécurité dédié\",\n      \"Up to 3 Roster Contacts\": \"Jusqu'à 3 contacts enregistrés\",\n      \"Call Cascade (Sequential)\": \"Appel en cascade (séquentiel)\",\n      \"Real-time Email Alerts\": \"Alertes e-mail en temps réel\",\n      \"Standard voicemail box\": \"Messagerie vocale standard\",\n      \"30-day money-back guarantee\": \"Satisfait ou remboursé sous 30 jours\",\n      \"2 Dedicated Safety Numbers\": \"2 numéros de sécurité dédiés\",\n      \"Up to 6 Roster Contacts\": \"Jusqu'à 6 contacts enregistrés\",\n      \"Cascade & Caller Menu (IVR)\": \"Cascade & menu vocal (SVI)\",\n      \"Time-of-day Scheduling\": \"Programmation par plages horaires\",\n      \"Bilingual Greeting Options\": \"Options d'accueil bilingues\",\n      \"Instant Voicemail Email Transcriptions\": \"Transcriptions instantanées des messages par e-mail\",\n      \"5 Dedicated Safety Numbers\": \"5 numéros de sécurité dédiés\",\n      \"Up to 15 Roster Contacts per Number\": \"Jusqu'à 15 contacts enregistrés par numéro\",\n      \"All Routing Modes + Scheduling\": \"Tous les modes d'acheminement + programmation\",\n      \"150 pooled voice minutes\": \"150 minutes d'appel mutualisées\",\n      \"2 Caregiver Logins\": \"2 accès aidants\",\n      \"All plans include cascade routing, the caller menu, and 24\/7 reliability. Set it up for your parent in minutes — cancel anytime.\": \"Tous les forfaits incluent l'appel en cascade, le menu vocal et une fiabilité 24h\/24 et 7j\/7. Configurez-le pour votre parent en quelques minutes — sans engagement.\",\n      \"All plans include cascade routing, the caller menu, and 24\/7 reliability. Set it up in minutes — cancel anytime.\": \"Tous les forfaits incluent l'appel en cascade, le menu vocal et une fiabilité 24h\/24 et 7j\/7. Configuration en quelques minutes — sans engagement.\",\n      \"All plans include cascade routing, the caller menu, time-aware coverage, and 24\/7 reliability. Cancel anytime.\": \"Tous les forfaits incluent l'appel en cascade, le menu vocal, une couverture selon les plages horaires et une fiabilité 24h\/24 et 7j\/7. Sans engagement.\",\n      \"Designed for the moments that matter\": \"Conçu pour les moments qui comptent\",\n      \"iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.\": \"iCanCall s'intègre parfaitement dans la vie des familles nécessitant une communication de sécurité simple et sans écran.\",\n      \"For Kids\": \"Pour les enfants\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"Permettez aux enfants de joindre leur famille depuis n'importe quel téléphone, sans les distractions d'un smartphone.\",\n      \"For Seniors\": \"Pour les aînés\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"Une bouée de sauvetage pour parents ou grands-parents. Un seul numéro à retenir pour joindre toute la famille.\",\n      \"For Special Needs\": \"Besoins Spécifiques\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"Simplifie la communication pour les personnes ayant des déficiences cognitives ou physiques, leur donnant un accès direct au soutien.\",\n      \"Coverage\": \"Couverture\",\n      \"Build the circle\": \"Composez le cercle\",\n      \"For families & caregivers of loved ones with special abilities\": \"Pour les familles et aidants de proches à besoins spécifiques\",\n      \"One press.\": \"Un seul appui.\",\n      \"The right caregiver, every time.\": \"Le bon aidant, à chaque fois.\",\n      \"For a loved one who can't work through a contact list, a single number — or one speed-dial button — connects them to exactly the right person on your care team. You decide who answers and when. They just press call.\": \"Pour un proche qui ne peut pas s'y retrouver dans une liste de contacts, un numéro unique — ou une seule touche de numérotation rapide — le met en relation avec exactement la bonne personne de votre équipe de soins. Vous décidez qui répond, et quand. Lui n'a qu'à appuyer sur Appeler.\",\n      \"No list to navigate. No decision to make.\": \"Aucune liste à parcourir. Aucune décision à prendre.\",\n      \"One press reaches a real person who knows them — and your whole care team is alerted the moment they call.\": \"Un seul appui joint une vraie personne qui le connaît — et toute votre équipe de soins est alertée dès qu'il appelle.\",\n      \"Daniel's iCanCall number\": \"Le numéro iCanCall de Daniel\",\n      \"Incoming call\": \"Appel entrant\",\n      \"One press finds the right caregiver, in order, until someone who knows him answers\": \"Un seul appui trouve le bon aidant, dans l'ordre, jusqu'à ce que quelqu'un qui le connaît réponde\",\n      \"Mom · primary caregiver\": \"Maman · aidante principale\",\n      \"Standing by\": \"En attente\",\n      \"Co-caregiver\": \"Co-aidant\",\n      \"Day program\": \"Accueil de jour\",\n      \"Nurse Dawn\": \"Infirmière Dawn\",\n      \"On-call\": \"D'astreinte\",\n      \"Independence for them, reassurance for you\": \"L'autonomie pour eux, la sérénité pour vous\",\n      \"press to reach help\": \"appui pour obtenir de l'aide\",\n      \"lists to navigate\": \"liste à parcourir\",\n      \"caregiver coverage\": \"couverture par les aidants\",\n      \"Whole\": \"Toute\",\n      \"care team alerted\": \"l'équipe de soins alertée\",\n      \"Around-the-clock coverage\": \"Couverture 24h\/24\",\n      \"Someone is always responsible.\": \"Il y a toujours un responsable.\",\n      \"The number never changes — but who answers it does. iCanCall routes the same call to the right caregiver for the time of day, so coverage hands off cleanly and there's never a gap.\": \"Le numéro ne change jamais — mais la personne qui répond, si. iCanCall achemine le même appel vers le bon aidant selon l'heure : les relais se passent en douceur, sans jamais de trou dans la couverture.\",\n      \"Daniel's number — one number, all day\": \"Le numéro de Daniel — un seul numéro, toute la journée\",\n      \"Right now:\": \"En ce moment :\",\n      \"On-call · overnight\": \"D'astreinte · nuit\",\n      \"Weekday day program\": \"Accueil de jour en semaine\",\n      \"Maria (Mom)\": \"Maria (Maman)\",\n      \"Primary caregiver\": \"Aidante principale\",\n      \"Evening\": \"Soirée\",\n      \"12a\": \"0 h\",\n      \"6a\": \"6 h\",\n      \"12p\": \"12 h\",\n      \"6p\": \"18 h\",\n      \"· primary, afternoons\": \"· principale, après-midi\",\n      \"· evenings\": \"· soirées\",\n      \"· weekdays\": \"· en semaine\",\n      \"· overnight on-call\": \"· astreinte de nuit\",\n      \"If the assigned caregiver can't pick up, the call cascades to the next person in the circle — so a call is never left unanswered, at any hour.\": \"Si l'aidant désigné ne peut pas décrocher, l'appel passe en cascade à la personne suivante du cercle — aucun appel ne reste sans réponse, à aucune heure.\",\n      \"You build the care team.\": \"Vous constituez l'équipe de soins.\",\n      \"They press one button.\": \"Eux appuient sur un seul bouton.\",\n      \"All of the complexity lives with you, in the dashboard. For your loved one, it stays as simple as a single call.\": \"Toute la complexité reste de votre côté, dans le tableau de bord. Pour votre proche, cela reste aussi simple qu'un appel.\",\n      \"Claim one number\": \"Réservez un numéro\",\n      \"Pick a single iCanCall number and set it as a speed-dial or a one-touch button on whatever device they use — a phone, a tablet, or an adaptive caller. That one button is all they ever need.\": \"Choisissez un numéro iCanCall unique et programmez-le en numérotation rapide ou sur une touche d'appel direct de l'appareil qu'il utilise — un téléphone, une tablette ou un téléphone adapté. Cette seule touche est tout ce dont il aura jamais besoin.\",\n      \"Build the care team\": \"Constituez l'équipe de soins\",\n      \"Add up to six caregivers — family, co-caregivers, a day program, a group home, an on-call nurse — and set who should answer, and when, across the day.\": \"Ajoutez jusqu'à six aidants — famille, co-aidants, accueil de jour, foyer de vie, infirmière d'astreinte — et définissez qui doit répondre, et quand, au fil de la journée.\",\n      \"They reach the right person\": \"Ils joignent la bonne personne\",\n      \"When they press call, iCanCall routes to the right caregiver for that moment and\": \"Quand votre proche appuie sur Appeler, iCanCall achemine l'appel vers le bon aidant du moment et\",\n      \"cascades\": \"appelle en cascade\",\n      \"on if needed — while every caregiver gets an instant text that the call came in.\": \"les suivants si nécessaire — tandis que chaque aidant reçoit aussitôt un SMS signalant l'appel.\",\n      \"Try it yourself\": \"Essayez vous-même\",\n      \"Build the care team that answers.\": \"Constituez l'équipe de soins qui répond.\",\n      \"Add the caregivers you trust, set their order, then place a pretend call. Choose\": \"Ajoutez les aidants de confiance, définissez leur ordre, puis passez un appel fictif. Choisissez la\",\n      \"— ring each caregiver in turn until someone picks up — or a simple\": \"— chaque aidant sonne à tour de rôle jusqu'à ce que quelqu'un décroche — ou un simple\",\n      \"caller menu\": \"menu vocal\",\n      \". Your loved one only ever makes one call.\": \". Votre proche, lui, ne passe jamais qu'un seul appel.\",\n      \"Routing mode\": \"Mode d'acheminement\",\n      \"Call cascade\": \"Appel en cascade\",\n      \"Caller menu\": \"Menu vocal\",\n      \"You set this once in the dashboard\": \"Vous le réglez une seule fois dans le tableau de bord\",\n      \"The care team\": \"L'équipe de soins\",\n      \"Ready\": \"Prêt\",\n      \"Press call to start routing\": \"Appuyez sur Appeler pour lancer l'acheminement\",\n      \"Place a call\": \"Passer un appel\",\n      \"Toggle a caregiver to \\\"Busy\\\" to see the cascade skip ahead.\": \"Passez un aidant en « Occupé » pour voir la cascade passer au suivant.\",\n      \"Why caregivers choose iCanCall\": \"Pourquoi les aidants choisissent iCanCall\",\n      \"Simple for them.\": \"Simple pour eux.\",\n      \"Complete for you.\": \"Complet pour vous.\",\n      \"One press, one action\": \"Un appui, un geste\",\n      \"No contact list, no menus, no choosing. A single number or button is the entire interaction — designed for those a list would only overwhelm.\": \"Pas de liste de contacts, pas de menus, pas de choix à faire. Un seul numéro ou une seule touche, et c'est tout — pensé pour ceux qu'une liste ne ferait que submerger.\",\n      \"Always the right caregiver\": \"Toujours le bon aidant\",\n      \"Time-aware routing sends the call to whoever's on for that part of the day — primary caregiver, day program, evening, or overnight on-call.\": \"L'acheminement selon l'heure envoie l'appel à la personne de service à ce moment de la journée — aidant principal, accueil de jour, soirée ou astreinte de nuit.\",\n      \"Whole team alerted\": \"Toute l'équipe alertée\",\n      \"Every caregiver gets a text the instant a call comes in — vital when a loved one may not be able to explain where they are or what they need.\": \"Chaque aidant reçoit un SMS à l'instant où un appel arrive — essentiel quand un proche ne peut pas forcément expliquer où il se trouve ni ce dont il a besoin.\",\n      \"No gaps at handoff\": \"Des relais sans faille\",\n      \"Coverage passes cleanly from one caregiver to the next. If the assigned person can't answer, the call cascades onward — never a dead end.\": \"La couverture passe en douceur d'un aidant au suivant. Si la personne désignée ne peut pas répondre, l'appel continue en cascade — jamais d'impasse.\",\n      \"Works with their setup\": \"S'adapte à leur équipement\",\n      \"Program it on a phone, a tablet, an adaptive caller, or a single speed-dial button. No app to install and nothing new to learn.\": \"Programmez-le sur un téléphone, une tablette, un téléphone adapté ou une simple touche de numérotation rapide. Aucune appli à installer, rien de nouveau à apprendre.\",\n      \"Private & protected\": \"Privé et protégé\",\n      \"Every caregiver's personal number stays hidden behind the single iCanCall line. All routing is encrypted, and your data is never sold.\": \"Le numéro personnel de chaque aidant reste masqué derrière la ligne iCanCall unique. Tout l'acheminement est chiffré, et vos données ne sont jamais vendues.\",\n      \"Simple, honest pricing\": \"Des tarifs simples et honnêtes\",\n      \"Coverage that costs less\": \"Une couverture qui coûte moins\",\n      \"than a single co-pay.\": \"qu'un seul reste à charge médical.\",\n      \"\/ month\": \"\/ mois\",\n      \"What caregivers ask us most.\": \"Les questions que les aidants nous posent le plus.\",\n      \"My loved one is non-verbal or can't explain where they are. Does this still help?\": \"Mon proche ne parle pas ou ne peut pas expliquer où il se trouve. Est-ce utile malgré tout ?\",\n      \"Yes — that's exactly who it's built for. They don't need to choose a contact or say anything in particular. One press connects them to a caregiver who knows them, and every caregiver in the circle gets an instant text that the call came in, so the right people are aware right away.\": \"Oui — c'est précisément pour lui que le service a été conçu. Il n'a pas à choisir un contact ni à dire quoi que ce soit de particulier. Un seul appui le met en relation avec un aidant qui le connaît, et chaque aidant du cercle reçoit aussitôt un SMS signalant l'appel : les bonnes personnes sont prévenues sans attendre.\",\n      \"Can it work as a single speed-dial button or with an adaptive device?\": \"Peut-il fonctionner avec une seule touche de numérotation rapide ou un appareil adapté ?\",\n      \"Absolutely. Because iCanCall is just one phone number, you can program it as a one-touch speed dial, a favorite, or a single button on whatever phone, tablet, or adaptive caller they already use. There's no app to install and nothing new for them to learn.\": \"Absolument. Comme iCanCall est un simple numéro de téléphone, vous pouvez le programmer en numérotation rapide sur une touche, en favori ou sur un bouton unique du téléphone, de la tablette ou du téléphone adapté qu'il utilise déjà. Aucune appli à installer, rien de nouveau à apprendre pour lui.\",\n      \"How do multiple caregivers and shift changes work?\": \"Comment gérer plusieurs aidants et les changements d'équipe ?\",\n      \"From your dashboard, you set who should answer at different times of day — a day program on weekday mornings, a primary caregiver in the afternoon, an evening caregiver, an overnight on-call nurse. The same number routes to whoever's on for that window, so coverage hands off without a gap.\": \"Depuis votre tableau de bord, vous définissez qui doit répondre selon les moments de la journée — un accueil de jour les matins de semaine, un aidant principal l'après-midi, un aidant du soir, une infirmière d'astreinte la nuit. Le même numéro est acheminé vers la personne de service sur ce créneau : les relais se font sans trou dans la couverture.\",\n      \"What if the assigned caregiver can't pick up?\": \"Et si l'aidant désigné ne peut pas décrocher ?\",\n      \"The call cascades to the next person in the circle until someone answers. If everyone is unreachable, it goes to voicemail that's transcribed and texted to the whole team — so a call is never simply lost.\": \"L'appel passe en cascade à la personne suivante du cercle jusqu'à ce que quelqu'un réponde. Si personne n'est joignable, il bascule sur une messagerie vocale, transcrite et envoyée par SMS à toute l'équipe — un appel n'est jamais simplement perdu.\",\n      \"Can a group home or day program be part of the circle?\": \"Un foyer de vie ou un accueil de jour peut-il faire partie du cercle ?\",\n      \"Yes. Any phone number can be a contact — a group home line, a day program, a case manager, a nurse, or family. You decide the order and the times, and adjust anytime as the care plan changes.\": \"Oui. N'importe quel numéro de téléphone peut être un contact — la ligne d'un foyer de vie, un accueil de jour, un référent de parcours, une infirmière ou la famille. Vous décidez de l'ordre et des horaires, et vous ajustez à tout moment selon l'évolution du plan d'accompagnement.\",\n      \"Is iCanCall a medical alert or emergency service?\": \"iCanCall est-il un service d'alerte médicale ou d'urgence ?\",\n      \"No — iCanCall connects your loved one to the people on their care team quickly and simply. It complements, but does not replace, 911 or a medical-monitoring service. For life-threatening emergencies, always teach and rely on 911 where possible.\": \"Non — iCanCall met votre proche en relation avec les membres de son équipe de soins, rapidement et simplement. Il complète le 911 ou un service de téléassistance médicale, mais ne les remplace pas. Pour les urgences vitales, apprenez-lui toujours à appeler le 911 et comptez dessus chaque fois que possible.\",\n      \"One number. The right person. Every time.\": \"Un seul numéro. La bonne personne. À chaque fois.\",\n      \"Give your loved one the independence of reaching help on their own — and give your care team the certainty of always being there. Set up iCanCall in minutes.\": \"Offrez à votre proche l'autonomie de demander de l'aide par lui-même — et à votre équipe de soins la certitude d'être toujours là. Configurez iCanCall en quelques minutes.\",\n      \"One memorable number — or one button — that always connects your loved one to the right caregiver, while keeping the whole team in the loop.\": \"Un numéro mémorable — ou une seule touche — qui relie toujours votre proche au bon aidant, tout en tenant toute l'équipe informée.\",\n      \"For every family\": \"Pour toutes les familles\",\n      \"iCanCall, Inc. All rights reserved.\": \"iCanCall, Inc. Tous droits réservés.\"\n    },\n    \"attrs\": {\n      \"Name\": \"Nom\",\n      \"Relationship\": \"Relation\",\n      \"Role\": \"Rôle\"\n    }\n  },\n  \"ja\": {\n    \"text\": {\n      \"How it works\": \"仕組み\",\n      \"Features\": \"機能\",\n      \"Who it's for\": \"対象者\",\n      \"Pricing\": \"料金\",\n      \
