の生涯、最長20年\", \"Everything in Annual, for one enrolled pet\": \"年払いプランの全機能を、登録したペット1匹に\", \"Covers your pet's life, up to 20 years\": \"ペットの生涯をカバー（最長20年）\", \"No yearly renewals\": \"毎年の更新は不要\", \"A yearly check-in email keeps the line active\": \"年1回の確認メールで回線を継続\", \"Lifetime, Small Bird Lifetime and Parrot plans cover one enrolled pet. Lifetime plans last for the life of the enrolled pet or 20 years from purchase, whichever comes first. Each year we email you to confirm the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line. Prices are in US dollars.\": \"生涯プラン、小型鳥 生涯プラン、インコ・オウムプランは、登録したペット1匹が対象です。生涯プラン各種の期間は、登録したペットの生涯または購入から20年のいずれか早いほうまでです。毎年、回線がまだ必要かどうかを確認するメールをお送りします。返信も着信もないまま2年が経過した場合は、最終通知をお送りしたうえで回線を終了します。価格は米ドル表示です。\", \"Pet plans open soon.\": \"ペット向けプランはまもなく受付開始。\", \"Join the launch list and we'll email you the day sign-up opens.\": \"リリース通知に登録いただくと、お申し込み受付開始日にメールでお知らせします。\", \"Parrots and other birds\": \"インコ・オウムなどの鳥\", \"Built for birds that live for decades.\": \"何十年も生きる鳥のために。\", \"A budgie might live ten years. A macaw can live eighty. iCanCall Pets has plans for every size of bird, and a way to pass the line on when a parrot changes homes.\": \"セキセイインコの寿命は10年ほど。コンゴウインコは80年生きることもあります。iCanCall Petsには、あらゆるサイズの鳥に合わせたプランがあり、インコやオウムが新しい家に移るときには回線を引き継ぐこともできます。\", \"Budgie, lovebird, parrotlet\": \"セキセイインコ、ボタンインコ、マメルリハ\", \"Typically 5 to 15 years.\": \"一般的に5〜15年。\", \"Small Bird Lifetime\": \"小型鳥 生涯プラン\", \"Cockatiel\": \"オカメインコ\", \"Typically 15 to 25 years.\": \"一般的に15〜25年。\", \"African grey, Amazon, cockatoo\": \"ヨウム、ボウシインコ、オウム\", \"Typically 40 to 70 years.\": \"一般的に40〜70年。\", \"Parrot 10-Year or 20-Year\": \"インコ・オウム10年／20年プラン\", \"Macaw\": \"コンゴウインコ\", \"Typically 50 to 80 years.\": \"一般的に50〜80年。\", \"Name a successor\": \"引き継ぎ先を指定\", \"When your parrot changes homes, the number goes too.\": \"あなたの鳥が新しい家に移るときは、番号も一緒に移ります。\", \"Parrots often outlive their owners or move to new homes. Name a backup person, like a family member or a bird rescue, who takes over the line if you can no longer care for your bird.\": \"インコやオウムは飼い主より長生きしたり、新しい家に移ったりすることがよくあります。ご家族や鳥の保護団体など、あなたが鳥の世話をできなくなったときに回線を引き継ぐ予備の方を指定しておきましょう。\", \"Not every bird has a microchip. Put the number on a cage tag, travel carrier and rescue paperwork too.\": \"マイクロチップが入っていない鳥もいます。ケージのタグ、キャリーケース、譲渡時の書類にも番号を記載しましょう。\", \"The line moves to the new owner for free\": \"回線は新しい飼い主へ無料で移行\", \"Any prepaid time moves with it\": \"前払い済みの期間もそのまま引き継ぎ\", \"The number on the chip and paperwork stays the same\": \"チップや書類の番号は変わりません\", \"As many moves as your bird needs\": \"引き継ぎは何度でも\", \"Budgies, lovebirds, parrotlets and cockatiels.\": \"セキセイインコ、ボタンインコ、マメルリハ、オカメインコ。\", \"For your bird's life, up to 20 years\": \"鳥の生涯、最長20年\", \"Everything in Annual, for one bird\": \"年払いプランの全機能を、鳥1羽に\", \"Named successor, free transfers\": \"引き継ぎ先の指定、無料の引き継ぎ\", \"Large parrots\": \"大型インコ・オウム\", \"Parrot 10-Year\": \"インコ・オウム10年プラン\", \"African greys, Amazons, cockatoos and macaws.\": \"ヨウム、ボウシインコ、オウム、コンゴウインコ。\", \"10 years of service, then renew\": \"10年間のサービス、その後は更新\", \"10 years prepaid\": \"10年分を前払い\", \"Renews at the price in effect at renewal\": \"更新時点の価格で更新\", \"Parrot 20-Year\": \"インコ・オウム20年プラン\", \"The longest cover for long-lived parrots.\": \"長生きするインコ・オウムのための最長プラン。\", \"20 years of service, then renew\": \"20年間のサービス、その後は更新\", \"20 years prepaid\": \"20年分を前払い\", \"Any bird can also use the $29 Annual plan.\": \"どの鳥も、$29の年払いプランをご利用いただくこともできます。\", \"What pet owners ask us most.\": \"飼い主の方からよくいただくご質問。\", \"Do I need a new microchip?\": \"新しいマイクロチップが必要ですか？\", \"No. Your pet keeps the chip it has. Log in to the registry where the chip is registered and change the phone number to your iCanCall number. After that, you never need to update the registry again.\": \"いいえ。今のチップはそのままお使いいただけます。チップが登録されている登録機関にログインし、電話番号をiCanCallの番号に変更してください。その後は、登録機関の情報を更新する必要は二度とありません。\", \"What happens when someone calls the number?\": \"誰かがこの番号に電話をかけると、どうなりますか？\", \"They hear your lost-pet greeting, then a caller menu with up to six contacts. They press a number to reach the person they want, and the call connects straight through.\": \"迷子ペット用の音声ガイダンスが流れ、続いて最大6名の連絡先が入った音声ダイヤルメニューが案内されます。発信者が番号を押すと、話したい相手にそのまま直接つながります。\", \"What if nobody picks up?\": \"誰も電話に出なかったら？\", \"The caller can leave a voicemail, and you get a text and an email straight away so you can call them back.\": \"発信者は留守番電話にメッセージを残せます。あなたにはすぐにSMSとメールが届くので、折り返し電話できます。\", \"Can one number cover all my pets?\": \"1つの番号で、すべてのペットをカバーできますか？\", \"Yes, on the Annual plan. Every chip in your home can carry the same number. Lifetime and Parrot plans cover one enrolled pet each.\": \"はい、年払いプランなら可能です。ご家庭のすべてのチップに同じ番号を登録できます。生涯プランとインコ・オウムプランは、それぞれ登録したペット1匹が対象です。\", \"Why 30 minutes a year, and incoming calls only?\": \"なぜ年間30分で、着信専用なのですか？\", \"A lost-pet line gets a few short calls a year, so 30 minutes is plenty. The line only takes incoming calls and always plays your lost-pet greeting, which keeps the price low. We email you if you get close to the limit.\": \"迷子ペット用の回線にかかってくるのは年に数回の短い電話なので、30分あれば十分です。この回線は着信専用で、常に迷子ペット用の音声ガイダンスを流すため、価格を低く抑えられています。上限に近づいたときはメールでお知らせします。\", \"What happens if my Annual plan lapses?\": \"年払いプランが切れたらどうなりますか？\", \"We hold your number for 6 months. During that time, callers hear a short message that the plan has lapsed, and the call still rings your main contact. We email you before the number is released so you can renew or update your microchip registry.\": \"番号は6ヶ月間保持されます。その間、発信者にはプランが切れている旨の短いメッセージが流れ、通話は引き続きメインの連絡先につながります。番号の保持が終了する前にメールでお知らせしますので、更新するか、マイクロチップ登録機関の情報を変更してください。\", \"How does the Lifetime plan work?\": \"生涯プランの仕組みは？\", \"You pay once and the line covers one enrolled pet for its life, or 20 years from purchase, whichever comes first. Once a year we email you to check the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line.\": \"1回お支払いいただくと、回線は登録したペット1匹を、その生涯または購入から20年のいずれか早いほうまでカバーします。年に1回、回線がまだ必要かどうかを確認するメールをお送りします。返信も着信もないまま2年が経過した場合は、最終通知をお送りしたうえで回線を終了します。\", \"What happens if my parrot outlives me?\": \"インコやオウムが私より長生きしたら、どうなりますか？\", \"Name a successor, like a family member or a bird rescue. If you can no longer care for your bird, the line moves to them for free, along with any prepaid time. The number on the chip and paperwork stays the same.\": \"ご家族や鳥の保護団体など、引き継ぎ先を指定しておきましょう。あなたが鳥の世話をできなくなった場合、回線は前払い済みの期間とともに無料でその方に移ります。チップや書類の番号は変わりません。\", \"Put a number on the chip that keeps up with you.\": \"あなたについていく番号を、チップに。\", \"Pet plans open soon. Join the launch list and we'll email you the day sign-up opens.\": \"ペット向けプランはまもなく受付開始。リリース通知に登録いただくと、お申し込み受付開始日にメールでお知らせします。\", \"Annual or lifetime · Works with any microchip registry · 14-day service guarantee\": \"年払いまたは生涯プラン · どのマイクロチップ登録機関にも対応 · 14日間サービス保証\", \"One lost-pet number on your pet's microchip that always reaches you, even after you move or change phones.\": \"ペットのマイクロチップに、迷子用の番号を1つ。引っ越しても電話を変えても、いつでもあなたにつながります。\", \"Annual\": \"年払いプラン\"}, \"attrs\": {\"Your email address\": \"メールアドレス\"}}, \"zh\": {\"text\": {\"Why chips fail\": \"芯片为何失灵\", \"Parrots\": \"鹦鹉\", \"Questions\": \"常见问题\", \"Join the launch list\": \"加入上线通知名单\", \"For dogs, cats and parrots\": \"适用于狗、猫和鹦鹉\", \"One number on the chip.\": \"芯片上只需一个号码。\", \"It never goes out of date.\": \"永远不会过时。\", \"Put your iCanCall number on your pet's microchip once. When you move or change phones, update your contacts in the dashboard. The chip keeps reaching you, and you never have to update the registry again.\": \"只需一次，把您的 iCanCall 号码登记到宠物芯片上。搬家或换手机时，在管理后台更新联系人即可。芯片始终能联系到您，您再也不必更新登记机构的信息。\", \"Works with any microchip registry.\": \"适用于任何芯片登记机构。\", \"Keep the registry you already use. Just put your iCanCall number on file.\": \"继续使用您现在的登记机构，只需把 iCanCall 号码登记在案即可。\", \"Max's microchip number\": \"麦克斯的芯片编号\", \"A shelter scans Max's chip and calls. The caller menu lets them pick who to reach\": \"收容所扫描了麦克斯的芯片并拨打电话。交互语音菜单让他们选择要联系的人\", \"Owner\": \"主人\", \"Partner\": \"伴侣\", \"Dog walker\": \"遛狗师\", \"Made for the day your pet goes missing\": \"为宠物走失的那一天而设计\", \"number on the chip\": \"芯片上的号码\", \"contacts in the caller menu\": \"交互语音菜单中的联系人\", \"registry updates when you move\": \"搬家时的登记更新\", \"microchip registry\": \"芯片登记机构\", \"The chip works. The phone number doesn't.\": \"芯片正常工作。电话号码却打不通。\", \"This is the most common reason microchips fail to reunite lost dogs with their owners: not a chip malfunction, but outdated contact details. iCanCall puts a number on the chip that keeps up with you.\": \"这是芯片未能帮走失狗狗与主人团聚的最常见原因：不是芯片故障，而是联系方式过时。iCanCall 在芯片上登记一个随您更新的号码。\", \"A number that goes stale\": \"会过时的号码\", \"You register the chip once, then life moves on. New phone, new house, and the registry still has the old details.\": \"芯片只登记一次，生活却在不断变化。换了新手机、搬了新家，登记机构里却还是旧信息。\", \"Registry phone\": \"登记电话\", \"Old cell\": \"旧手机号\", \"Home address\": \"家庭住址\", \"Moved\": \"已搬家\", \"Backup contact\": \"备用联系人\", \"None\": \"无\", \"Last updated\": \"最后更新\", \"Years ago\": \"多年前\", \"\\\"The number you have dialed is no longer in service.\\\"\": \"“您拨打的号码已停止使用。”\", \"A number that keeps up with you\": \"随您更新的号码\", \"The number on the chip never changes. You change who it reaches, any time, from your phone.\": \"芯片上的号码永远不变。转接给谁，由您随时在手机上更改。\", \"\\\"New phone, new house, same number on the chip.\\\"\": \"“新手机，新家，芯片上的号码不变。”\", \"Set it up once. Keep it current forever.\": \"只需设置一次。永远保持最新。\", \"A few minutes of setup means the number on your pet's chip always reaches someone who can help.\": \"几分钟的设置，就能让宠物芯片上的号码始终联系到能帮忙的人。\", \"Get your pet number\": \"获取宠物号码\", \"Pick an iCanCall number for your pet. One number can cover every pet in your home.\": \"为您的宠物选择一个 iCanCall 号码。一个号码即可覆盖家中所有宠物。\", \"Put it on the chip\": \"登记到芯片\", \"Log in to the registry where your pet's chip is registered and set your iCanCall number as the phone number. Add it to the collar tag too.\": \"登录宠物芯片所在的登记机构，将电话号码设为您的 iCanCall 号码。也别忘了写在项圈名牌上。\", \"Add up to six contacts\": \"添加最多六位联系人\", \"You, your partner, a neighbor, the dog walker. When someone calls, they hear your lost-pet greeting and use the caller menu to pick who to reach.\": \"您、您的伴侣、邻居、遛狗师。有人来电时，会先听到您的走失宠物语音引导，再通过交互语音菜单选择要联系的人。\", \"Wherever they turn up\": \"无论在哪里被找到\", \"The same number works wherever your pet is found.\": \"无论宠物在哪里被找到，都是同一个号码。\", \"Shelters, vets and neighbors all reach you the same way: one number, from any phone.\": \"收容所、宠物医院和邻居都能用同样的方式联系到您：一个号码，任何电话都能拨打。\", \"Scanned at a shelter\": \"在收容所被扫描\", \"Staff scan the chip, call the number, and hear your lost-pet greeting straight away.\": \"工作人员扫描芯片、拨打号码，立即就会听到您的走失宠物语音引导。\", \"Scanned at a vet\": \"在宠物医院被扫描\", \"A vet clinic checks the chip and calls you directly, without searching for old records.\": \"宠物医院查到芯片后直接给您打电话，无需翻找旧记录。\", \"Found by a neighbor\": \"被邻居发现\", \"They read the number on the collar tag and call. The caller menu gets them to whoever is free.\": \"他们看到项圈名牌上的号码就打过来。交互语音菜单会帮他们联系到当下有空的人。\", \"After you move\": \"搬家之后\", \"New phone or new city? Update your contacts in the dashboard. The chip never needs touching.\": \"换了新手机或搬到新城市？在管理后台更新联系人即可。芯片完全不用动。\", \"Try the caller menu a finder will hear.\": \"试试发现者会听到的交互语音菜单。\", \"Add the people who should hear about your pet, set their order, then place a pretend call. The finder hears your lost-pet greeting and presses a number to reach someone.\": \"添加需要得知宠物消息的人，设定顺序，然后拨打一通模拟电话。发现者会听到您的走失宠物语音引导，并按键联系到其中一位。\", \"Your pet's contacts\": \"宠物的联系人\", \"/6 contacts\": \"/6 位联系人\", \"Place a call to hear the options\": \"拨打电话，收听选项\", \"Callers pick who to reach. Flip a contact to “Busy” to send them to voicemail.\": \"来电者自行选择要联系的人。将联系人切换为“忙碌”，来电将转入语音信箱。\", \"Why pet owners choose iCanCall\": \"为什么宠物主人选择 iCanCall\", \"Built so a found pet always finds its way home.\": \"让被找到的宠物总能回家。\", \"A number that never goes stale\": \"永不过时的号码\", \"Change phones, move house, add a pet sitter. Update the dashboard and the chip keeps working.\": \"换手机、搬家、新增宠物保姆都没问题。更新管理后台，芯片照样有效。\", \"A greeting made for finders\": \"专为发现者准备的语音引导\", \"Every call starts with your lost-pet message, so shelters and neighbors know they have reached the right place.\": \"每通来电都以您的走失宠物留言开场，让收容所和邻居知道他们打对了地方。\", \"A caller menu for six contacts\": \"支持六位联系人的交互语音菜单\", \"Finders press a number to reach you, your partner, a neighbor or the dog walker, in the order you choose.\": \"发现者按键即可联系您、您的伴侣、邻居或遛狗师，顺序由您决定。\", \"You hear about it right away\": \"第一时间获得通知\", \"If nobody picks up, the caller leaves a voicemail and you get a text and an email straight away.\": \"如果无人接听，来电者可留下语音留言，您会立即收到短信和邮件。\", \"Held for 6 months if you lapse\": \"套餐过期后号码保留 6 个月\", \"Miss a renewal and we keep your number for 6 months, still ringing your main contact, so the chip keeps working.\": \"错过续费，我们会为您保留号码 6 个月，期间仍会转接到您的主要联系人，芯片照常有效。\", \"Your numbers stay private\": \"您的号码始终保密\", \"Finders only ever see your iCanCall number, never your personal phone numbers.\": \"发现者只会看到您的 iCanCall 号码，绝不会看到您的个人电话号码。\", \"Less than $2.50 a month, paid once a year.\": \"每月不到 $2.50，每年付款一次。\", \"Pay once a year, or once for your pet's whole life. There are no monthly plans and no setup fees.\": \"每年付款一次，或为宠物一生一次付清。没有月付套餐，也没有初装费。\", \"One lost-pet number for every pet in your home.\": \"一个走失宠物号码，覆盖家中所有宠物。\", \"/ year\": \"/ 年\", \"Billed once a year\": \"每年结算一次\", \"1 dedicated lost-pet number\": \"1 个专属走失宠物号码\", \"Caller menu with up to 6 contacts\": \"交互语音菜单，最多 6 位联系人\", \"Lost-pet greeting on every call\": \"每通来电播放走失宠物语音引导\", \"Voicemail with text and email alerts\": \"语音信箱，附短信和邮件提醒\", \"30 minutes of calls per year\": \"每年 30 分钟通话时长\", \"Incoming calls only\": \"仅限来电\", \"Works with any microchip registry\": \"适用于任何芯片登记机构\", \"Number held 6 months if your plan lapses\": \"套餐过期后号码保留 6 个月\", \"Pay once\": \"一次付清\", \"Lifetime\": \"终身套餐\", \"One payment for one pet's whole life.\": \"一次付款，覆盖一只宠物的一生。\", \"one time\": \"一次性\", \"For your pet's life, up to 20 years\": \"适用于宠物一生，最长 20 年\", \"Everything in Annual, for one enrolled pet\": \"包含按年付款套餐的全部功能，适用于一只登记宠物\", \"Covers your pet's life, up to 20 years\": \"覆盖宠物一生，最长 20 年\", \"No yearly renewals\": \"无需每年续费\", \"A yearly check-in email keeps the line active\": \"每年一封确认邮件，保持线路有效\", \"Lifetime, Small Bird Lifetime and Parrot plans cover one enrolled pet. Lifetime plans last for the life of the enrolled pet or 20 years from purchase, whichever comes first. Each year we email you to confirm the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line. Prices are in US dollars.\": \"终身套餐、小型鸟终身套餐和鹦鹉套餐均适用于一只登记宠物。终身类套餐的有效期为登记宠物的一生或自购买起 20 年，以先到者为准。我们每年会发邮件请您确认是否仍需要该线路。如果连续两年既无回复也无来电，我们会发送最终通知，然后关闭该线路。价格以美元计。\", \"Pet plans open soon.\": \"宠物套餐即将开放。\", \"Join the launch list and we'll email you the day sign-up opens.\": \"加入上线通知名单，开放注册当天我们会发邮件通知您。\", \"Parrots and other birds\": \"鹦鹉及其他鸟类\", \"Built for birds that live for decades.\": \"专为能活几十年的鸟儿打造。\", \"A budgie might live ten years. A macaw can live eighty. iCanCall Pets has plans for every size of bird, and a way to pass the line on when a parrot changes homes.\": \"虎皮鹦鹉大约能活十年，金刚鹦鹉可以活到八十岁。iCanCall Pets 为各种体型的鸟儿都准备了套餐，鹦鹉换新家时还能把线路转交出去。\", \"Budgie, lovebird, parrotlet\": \"虎皮鹦鹉、牡丹鹦鹉、太平洋鹦鹉\", \"Typically 5 to 15 years.\": \"通常 5 到 15 年。\", \"Small Bird Lifetime\": \"小型鸟终身套餐\", \"Cockatiel\": \"玄凤鹦鹉\", \"Typically 15 to 25 years.\": \"通常 15 到 25 年。\", \"African grey, Amazon, cockatoo\": \"非洲灰鹦鹉、亚马逊鹦鹉、凤头鹦鹉\", \"Typically 40 to 70 years.\": \"通常 40 到 70 年。\", \"Parrot 10-Year or 20-Year\": \"鹦鹉 10 年或 20 年套餐\", \"Macaw\": \"金刚鹦鹉\", \"Typically 50 to 80 years.\": \"通常 50 到 80 年。\", \"Name a successor\": \"指定继任者\", \"When your parrot changes homes, the number goes too.\": \"鹦鹉换新家时，号码也随之转移。\", \"Parrots often outlive their owners or move to new homes. Name a backup person, like a family member or a bird rescue, who takes over the line if you can no longer care for your bird.\": \"鹦鹉常常比主人活得更久，或会搬到新家。请指定一位后备人选，比如家人或鸟类救助组织，在您无法再照顾鸟儿时接管这条线路。\", \"Not every bird has a microchip. Put the number on a cage tag, travel carrier and rescue paperwork too.\": \"并非每只鸟都植入了芯片。也请把号码写在笼子名牌、外出提笼和救助领养文件上。\", \"The line moves to the new owner for free\": \"线路免费转给新主人\", \"Any prepaid time moves with it\": \"已预付的时长一并转移\", \"The number on the chip and paperwork stays the same\": \"芯片和文件上的号码保持不变\", \"As many moves as your bird needs\": \"鸟儿需要转移几次都可以\", \"Budgies, lovebirds, parrotlets and cockatiels.\": \"虎皮鹦鹉、牡丹鹦鹉、太平洋鹦鹉和玄凤鹦鹉。\", \"For your bird's life, up to 20 years\": \"适用于鸟儿一生，最长 20 年\", \"Everything in Annual, for one bird\": \"包含按年付款套餐的全部功能，适用于一只鸟\", \"Named successor, free transfers\": \"可指定继任者，免费转移\", \"Large parrots\": \"大型鹦鹉\", \"Parrot 10-Year\": \"鹦鹉 10 年套餐\", \"African greys, Amazons, cockatoos and macaws.\": \"非洲灰鹦鹉、亚马逊鹦鹉、凤头鹦鹉和金刚鹦鹉。\", \"10 years of service, then renew\": \"10 年服务，到期续费\", \"10 years prepaid\": \"预付 10 年\", \"Renews at the price in effect at renewal\": \"续费时按届时价格计费\", \"Parrot 20-Year\": \"鹦鹉 20 年套餐\", \"The longest cover for long-lived parrots.\": \"为长寿鹦鹉提供最长保障。\", \"20 years of service, then renew\": \"20 年服务，到期续费\", \"20 years prepaid\": \"预付 20 年\", \"Any bird can also use the $29 Annual plan.\": \"任何鸟类也可选择 $29 的按年付款套餐。\", \"What pet owners ask us most.\": \"宠物主人最常问的问题。\", \"Do I need a new microchip?\": \"需要换新芯片吗？\", \"No. Your pet keeps the chip it has. Log in to the registry where the chip is registered and change the phone number to your iCanCall number. After that, you never need to update the registry again.\": \"不需要。您的宠物继续使用现有芯片。登录芯片所在的登记机构，把电话号码改成您的 iCanCall 号码即可。之后您再也不必更新登记机构的信息。\", \"What happens when someone calls the number?\": \"有人拨打这个号码时会怎样？\", \"They hear your lost-pet greeting, then a caller menu with up to six contacts. They press a number to reach the person they want, and the call connects straight through.\": \"他们会先听到您的走失宠物语音引导，然后是最多包含六位联系人的交互语音菜单。按下对应数字，即可直接接通想联系的人。\", \"What if nobody picks up?\": \"如果无人接听怎么办？\", \"The caller can leave a voicemail, and you get a text and an email straight away so you can call them back.\": \"来电者可以留下语音留言，您会立即收到短信和邮件，方便回电。\", \"Can one number cover all my pets?\": \"一个号码能覆盖我所有的宠物吗？\", \"Yes, on the Annual plan. Every chip in your home can carry the same number. Lifetime and Parrot plans cover one enrolled pet each.\": \"可以，选择按年付款套餐即可。家中每只宠物的芯片都可以登记同一个号码。终身套餐和鹦鹉套餐每份仅适用于一只登记宠物。\", \"Why 30 minutes a year, and incoming calls only?\": \"为什么每年 30 分钟，而且仅限来电？\", \"A lost-pet line gets a few short calls a year, so 30 minutes is plenty. The line only takes incoming calls and always plays your lost-pet greeting, which keeps the price low. We email you if you get close to the limit.\": \"走失宠物线路每年只会接到几通简短来电，30 分钟绰绰有余。线路仅接听来电，并始终播放您的走失宠物语音引导，因此价格得以保持低廉。用量接近上限时，我们会发邮件提醒您。\", \"What happens if my Annual plan lapses?\": \"如果我的按年付款套餐过期了怎么办？\", \"We hold your number for 6 months. During that time, callers hear a short message that the plan has lapsed, and the call still rings your main contact. We email you before the number is released so you can renew or update your microchip registry.\": \"我们会为您保留号码 6 个月。在此期间，来电者会听到一段套餐已过期的简短提示，来电仍会转接到您的主要联系人。在号码释放之前，我们会发邮件通知您，以便您续费或更新芯片登记信息。\", \"How does the Lifetime plan work?\": \"终身套餐如何运作？\", \"You pay once and the line covers one enrolled pet for its life, or 20 years from purchase, whichever comes first. Once a year we email you to check the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line.\": \"您只需付款一次，线路即可覆盖一只登记宠物的一生，或自购买起 20 年，以先到者为准。我们每年会发邮件确认您是否仍需要该线路。如果连续两年既无回复也无来电，我们会发送最终通知，然后关闭该线路。\", \"What happens if my parrot outlives me?\": \"如果我的鹦鹉比我活得更久怎么办？\", \"Name a successor, like a family member or a bird rescue. If you can no longer care for your bird, the line moves to them for free, along with any prepaid time. The number on the chip and paperwork stays the same.\": \"指定一位继任者，比如家人或鸟类救助组织。如果您无法再照顾鸟儿，线路将免费转给他们，已预付的时长也一并转移。芯片和文件上的号码保持不变。\", \"Put a number on the chip that keeps up with you.\": \"在芯片上登记一个随您更新的号码。\", \"Pet plans open soon. Join the launch list and we'll email you the day sign-up opens.\": \"宠物套餐即将开放。加入上线通知名单，开放注册当天我们会发邮件通知您。\", \"Annual or lifetime · Works with any microchip registry · 14-day service guarantee\": \"按年付款或终身 · 适用于任何芯片登记机构 · 14天服务保障\", \"One lost-pet number on your pet's microchip that always reaches you, even after you move or change phones.\": \"宠物芯片上的一个走失宠物号码，即使您搬家或换手机，也总能联系到您。\", \"Annual\": \"按年付款套餐\"}, \"attrs\": {\"Your email address\": \"您的电子邮箱地址\"}}, \"ar\": {\"text\": {\"Why chips fail\": \"لماذا تفشل الشرائح\", \"Parrots\": \"الببغاوات\", \"Questions\": \"الأسئلة\", \"Join the launch list\": \"انضم إلى قائمة الإطلاق\", \"For dogs, cats and parrots\": \"للكلاب والقطط والببغاوات\", \"One number on the chip.\": \"رقم واحد على الشريحة.\", \"It never goes out of date.\": \"لا يصبح قديماً أبداً.\", \"Put your iCanCall number on your pet's microchip once. When you move or change phones, update your contacts in the dashboard. The chip keeps reaching you, and you never have to update the registry again.\": \"ضع رقم iCanCall الخاص بك على الشريحة الإلكترونية لحيوانك الأليف مرة واحدة. وعندما تنتقل أو تغيّر هاتفك، حدّث جهات اتصالك في لوحة التحكم. تظل الشريحة تصل إليك، ولن تحتاج إلى تحديث السجل مرة أخرى أبداً.\", \"Works with any microchip registry.\": \"يعمل مع أي سجل للشرائح الإلكترونية.\", \"Keep the registry you already use. Just put your iCanCall number on file.\": \"احتفظ بالسجل الذي تستخدمه بالفعل. فقط سجّل فيه رقم iCanCall الخاص بك.\", \"Max's microchip number\": \"رقم الشريحة الإلكترونية الخاص بـ Max\", \"A shelter scans Max's chip and calls. The caller menu lets them pick who to reach\": \"يمسح أحد الملاجئ شريحة Max ويتصل. وتتيح لهم قائمة المتصل اختيار من يريدون الوصول إليه\", \"Owner\": \"المالك\", \"Partner\": \"شريك الحياة\", \"Dog walker\": \"مُنزّه الكلب\", \"Made for the day your pet goes missing\": \"صُمّم لليوم الذي يضيع فيه حيوانك الأليف\", \"number on the chip\": \"رقم على الشريحة\", \"contacts in the caller menu\": \"جهات اتصال في قائمة المتصل\", \"registry updates when you move\": \"تحديثات للسجل عند الانتقال\", \"microchip registry\": \"سجل للشرائح الإلكترونية\", \"The chip works. The phone number doesn't.\": \"الشريحة تعمل. أما رقم الهاتف فلا.\", \"This is the most common reason microchips fail to reunite lost dogs with their owners: not a chip malfunction, but outdated contact details. iCanCall puts a number on the chip that keeps up with you.\": \"هذا هو السبب الأكثر شيوعاً لفشل الشرائح الإلكترونية في إعادة الكلاب الضائعة إلى أصحابها: ليس عطلاً في الشريحة، بل بيانات اتصال قديمة. يضع iCanCall على الشريحة رقماً يواكبك أينما ذهبت.\", \"A number that goes stale\": \"رقم يصبح قديماً\", \"You register the chip once, then life moves on. New phone, new house, and the registry still has the old details.\": \"تسجّل الشريحة مرة واحدة، ثم تمضي الحياة. هاتف جديد، ومنزل جديد، والسجل لا يزال يحتفظ بالبيانات القديمة.\", \"Registry phone\": \"هاتف السجل\", \"Old cell\": \"الجوال القديم\", \"Home address\": \"عنوان المنزل\", \"Moved\": \"انتقلت\", \"Backup contact\": \"جهة اتصال احتياطية\", \"None\": \"لا يوجد\", \"Last updated\": \"آخر تحديث\", \"Years ago\": \"منذ سنوات\", \"\\\"The number you have dialed is no longer in service.\\\"\": \"«الرقم الذي طلبته لم يعد في الخدمة.»\", \"A number that keeps up with you\": \"رقم يواكبك أينما ذهبت\", \"The number on the chip never changes. You change who it reaches, any time, from your phone.\": \"الرقم على الشريحة لا يتغير أبداً. وأنت من يغيّر من يصل إليه، في أي وقت، من هاتفك.\", \"\\\"New phone, new house, same number on the chip.\\\"\": \"«هاتف جديد، منزل جديد، والرقم نفسه على الشريحة.»\", \"Set it up once. Keep it current forever.\": \"أعدّه مرة واحدة. وابقَ محدّثاً إلى الأبد.\", \"A few minutes of setup means the number on your pet's chip always reaches someone who can help.\": \"دقائق قليلة من الإعداد تعني أن الرقم على شريحة حيوانك الأليف يصل دائماً إلى شخص يستطيع المساعدة.\", \"Get your pet number\": \"احصل على رقم حيوانك الأليف\", \"Pick an iCanCall number for your pet. One number can cover every pet in your home.\": \"اختر رقم iCanCall لحيوانك الأليف. يمكن لرقم واحد أن يغطي جميع الحيوانات الأليفة في منزلك.\", \"Put it on the chip\": \"ضعه على الشريحة\", \"Log in to the registry where your pet's chip is registered and set your iCanCall number as the phone number. Add it to the collar tag too.\": \"سجّل الدخول إلى السجل المسجّلة فيه شريحة حيوانك الأليف، واجعل رقم iCanCall الخاص بك هو رقم الهاتف. وأضفه أيضاً إلى بطاقة الطوق.\", \"Add up to six contacts\": \"أضف ما يصل إلى ست جهات اتصال\", \"You, your partner, a neighbor, the dog walker. When someone calls, they hear your lost-pet greeting and use the caller menu to pick who to reach.\": \"أنت، وشريك حياتك، وأحد الجيران، ومُنزّه الكلب. عندما يتصل أحدهم، يسمع تحية الحيوان المفقود الخاصة بك ويستخدم قائمة المتصل لاختيار من يريد الوصول إليه.\", \"Wherever they turn up\": \"أينما ظهر\", \"The same number works wherever your pet is found.\": \"الرقم نفسه يعمل أينما عُثر على حيوانك الأليف.\", \"Shelters, vets and neighbors all reach you the same way: one number, from any phone.\": \"تصل إليك الملاجئ والأطباء البيطريون والجيران بالطريقة نفسها: رقم واحد، من أي هاتف.\", \"Scanned at a shelter\": \"مُسح في ملجأ\", \"Staff scan the chip, call the number, and hear your lost-pet greeting straight away.\": \"يمسح الموظفون الشريحة، ويتصلون بالرقم، ويسمعون تحية الحيوان المفقود الخاصة بك على الفور.\", \"Scanned at a vet\": \"مُسح لدى طبيب بيطري\", \"A vet clinic checks the chip and calls you directly, without searching for old records.\": \"تفحص العيادة البيطرية الشريحة وتتصل بك مباشرة، دون البحث في السجلات القديمة.\", \"Found by a neighbor\": \"عثر عليه أحد الجيران\", \"They read the number on the collar tag and call. The caller menu gets them to whoever is free.\": \"يقرأ الرقم على بطاقة الطوق ويتصل. وتوصله قائمة المتصل إلى من هو متاح.\", \"After you move\": \"بعد الانتقال\", \"New phone or new city? Update your contacts in the dashboard. The chip never needs touching.\": \"هاتف جديد أو مدينة جديدة؟ حدّث جهات اتصالك في لوحة التحكم. لا حاجة للمس الشريحة أبداً.\", \"Try the caller menu a finder will hear.\": \"جرّب قائمة المتصل التي سيسمعها من يعثر على حيوانك.\", \"Add the people who should hear about your pet, set their order, then place a pretend call. The finder hears your lost-pet greeting and presses a number to reach someone.\": \"أضف الأشخاص الذين يجب أن يعرفوا عن حيوانك الأليف، ورتّبهم، ثم أجرِ مكالمة تجريبية. يسمع من يعثر عليه تحية الحيوان المفقود الخاصة بك ويضغط رقماً للوصول إلى أحدهم.\", \"Your pet's contacts\": \"جهات اتصال حيوانك الأليف\", \"/6 contacts\": \"/6 جهات اتصال\", \"Place a call to hear the options\": \"أجرِ مكالمة لسماع الخيارات\", \"Callers pick who to reach. Flip a contact to “Busy” to send them to voicemail.\": \"يختار المتصلون من يريدون الوصول إليه. بدّل حالة جهة الاتصال إلى «مشغول» لتحويلها إلى البريد الصوتي.\", \"Why pet owners choose iCanCall\": \"لماذا يختار أصحاب الحيوانات الأليفة iCanCall\", \"Built so a found pet always finds its way home.\": \"صُمّم ليجد الحيوان الذي يُعثر عليه طريقه إلى المنزل دائماً.\", \"A number that never goes stale\": \"رقم لا يصبح قديماً أبداً\", \"Change phones, move house, add a pet sitter. Update the dashboard and the chip keeps working.\": \"غيّر هاتفك، أو انتقل إلى منزل جديد، أو أضف جليساً للحيوانات الأليفة. حدّث لوحة التحكم وستظل الشريحة تعمل.\", \"A greeting made for finders\": \"تحية مخصصة لمن يعثر على حيوانك\", \"Every call starts with your lost-pet message, so shelters and neighbors know they have reached the right place.\": \"تبدأ كل مكالمة برسالة الحيوان المفقود الخاصة بك، ليعرف الملجأ والجيران أنهم وصلوا إلى المكان الصحيح.\", \"A caller menu for six contacts\": \"قائمة متصل لست جهات اتصال\", \"Finders press a number to reach you, your partner, a neighbor or the dog walker, in the order you choose.\": \"يضغط من يعثر على حيوانك رقماً للوصول إليك أو إلى شريك حياتك أو أحد الجيران أو مُنزّه الكلب، بالترتيب الذي تختاره.\", \"You hear about it right away\": \"تعلم بالأمر على الفور\", \"If nobody picks up, the caller leaves a voicemail and you get a text and an email straight away.\": \"إذا لم يُجب أحد، يترك المتصل رسالة في البريد الصوتي وتتلقى رسالة نصية وبريداً إلكترونياً على الفور.\", \"Held for 6 months if you lapse\": \"محجوز لمدة 6 أشهر إذا انتهت خطتك\", \"Miss a renewal and we keep your number for 6 months, still ringing your main contact, so the chip keeps working.\": \"إذا فاتك التجديد، نحتفظ برقمك لمدة 6 أشهر، ويظل يرنّ على جهة اتصالك الرئيسية، لتستمر الشريحة في العمل.\", \"Your numbers stay private\": \"أرقامك تبقى خاصة\", \"Finders only ever see your iCanCall number, never your personal phone numbers.\": \"لا يرى من يعثر على حيوانك سوى رقم iCanCall الخاص بك، ولا يرى أرقام هواتفك الشخصية أبداً.\", \"Less than $2.50 a month, paid once a year.\": \"أقل من $2.50 شهرياً، تُدفع مرة واحدة في السنة.\", \"Pay once a year, or once for your pet's whole life. There are no monthly plans and no setup fees.\": \"ادفع مرة واحدة في السنة، أو مرة واحدة طوال حياة حيوانك الأليف. لا توجد خطط شهرية ولا رسوم إعداد.\", \"One lost-pet number for every pet in your home.\": \"رقم واحد للحيوانات المفقودة لجميع الحيوانات الأليفة في منزلك.\", \"/ year\": \"/ سنوياً\", \"Billed once a year\": \"تُدفع مرة واحدة في السنة\", \"1 dedicated lost-pet number\": \"رقم مخصص واحد للحيوانات المفقودة\", \"Caller menu with up to 6 contacts\": \"قائمة المتصل مع ما يصل إلى 6 جهات اتصال\", \"Lost-pet greeting on every call\": \"تحية الحيوان المفقود في كل مكالمة\", \"Voicemail with text and email alerts\": \"بريد صوتي مع تنبيهات بالرسائل النصية والبريد الإلكتروني\", \"30 minutes of calls per year\": \"30 دقيقة من المكالمات سنوياً\", \"Incoming calls only\": \"المكالمات الواردة فقط\", \"Works with any microchip registry\": \"يعمل مع أي سجل للشرائح الإلكترونية\", \"Number held 6 months if your plan lapses\": \"الرقم محجوز لمدة 6 أشهر إذا انتهت خطتك\", \"Pay once\": \"ادفع مرة واحدة\", \"Lifetime\": \"خطة مدى الحياة\", \"One payment for one pet's whole life.\": \"دفعة واحدة طوال حياة حيوان أليف واحد.\", \"one time\": \"مرة واحدة\", \"For your pet's life, up to 20 years\": \"طوال حياة حيوانك الأليف، حتى 20 عاماً\", \"Everything in Annual, for one enrolled pet\": \"كل ما في الخطة السنوية، لحيوان أليف واحد مسجّل\", \"Covers your pet's life, up to 20 years\": \"تغطي حياة حيوانك الأليف، حتى 20 عاماً\", \"No yearly renewals\": \"بلا تجديدات سنوية\", \"A yearly check-in email keeps the line active\": \"رسالة بريد إلكتروني سنوية للتأكيد تُبقي الخط نشطاً\", \"Lifetime, Small Bird Lifetime and Parrot plans cover one enrolled pet. Lifetime plans last for the life of the enrolled pet or 20 years from purchase, whichever comes first. Each year we email you to confirm the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line. Prices are in US dollars.\": \"تغطي خطة مدى الحياة وخطة مدى الحياة للطيور الصغيرة وخطط الببغاء حيواناً أليفاً واحداً مسجّلاً. تستمر خطط مدى الحياة طوال حياة الحيوان المسجّل أو 20 عاماً من تاريخ الشراء، أيهما أقرب. نراسلك كل عام عبر البريد الإلكتروني لتأكيد أن الخط لا يزال مطلوباً. وإذا مرّ عامان دون رد ودون مكالمات، نرسل إشعاراً نهائياً ثم نغلق الخط. الأسعار بالدولار الأمريكي.\", \"Pet plans open soon.\": \"خطط الحيوانات الأليفة تُفتح قريباً.\", \"Join the launch list and we'll email you the day sign-up opens.\": \"انضم إلى قائمة الإطلاق وسنراسلك عبر البريد الإلكتروني في يوم فتح التسجيل.\", \"Parrots and other birds\": \"الببغاوات والطيور الأخرى\", \"Built for birds that live for decades.\": \"صُمّم لطيور تعيش عقوداً.\", \"A budgie might live ten years. A macaw can live eighty. iCanCall Pets has plans for every size of bird, and a way to pass the line on when a parrot changes homes.\": \"قد يعيش طائر البادجي عشر سنوات. ويمكن أن يعيش المكاو ثمانين عاماً. لدى iCanCall Pets خطط للطيور بجميع أحجامها، وطريقة لنقل الخط عندما ينتقل الببغاء إلى منزل جديد.\", \"Budgie, lovebird, parrotlet\": \"البادجي، طائر الحب، الببغاء القزم\", \"Typically 5 to 15 years.\": \"عادةً من 5 إلى 15 عاماً.\", \"Small Bird Lifetime\": \"خطة مدى الحياة للطيور الصغيرة\", \"Cockatiel\": \"الكوكتيل\", \"Typically 15 to 25 years.\": \"عادةً من 15 إلى 25 عاماً.\", \"African grey, Amazon, cockatoo\": \"الببغاء الرمادي الأفريقي، ببغاء الأمازون، الكوكاتو\", \"Typically 40 to 70 years.\": \"عادةً من 40 إلى 70 عاماً.\", \"Parrot 10-Year or 20-Year\": \"خطة الببغاء 10 سنوات أو 20 سنة\", \"Macaw\": \"المكاو\", \"Typically 50 to 80 years.\": \"عادةً من 50 إلى 80 عاماً.\", \"Name a successor\": \"عيّن خليفة\", \"When your parrot changes homes, the number goes too.\": \"عندما ينتقل ببغاؤك إلى منزل جديد، ينتقل الرقم معه.\", \"Parrots often outlive their owners or move to new homes. Name a backup person, like a family member or a bird rescue, who takes over the line if you can no longer care for your bird.\": \"كثيراً ما تعيش الببغاوات أطول من أصحابها أو تنتقل إلى منازل جديدة. عيّن شخصاً احتياطياً، مثل أحد أفراد العائلة أو جمعية لإنقاذ الطيور، يتولى الخط إذا لم تعد قادراً على رعاية طائرك.\", \"Not every bird has a microchip. Put the number on a cage tag, travel carrier and rescue paperwork too.\": \"ليس لكل طائر شريحة إلكترونية. ضع الرقم أيضاً على بطاقة القفص وحقيبة السفر وأوراق جمعية الإنقاذ.\", \"The line moves to the new owner for free\": \"ينتقل الخط إلى المالك الجديد مجاناً\", \"Any prepaid time moves with it\": \"ينتقل معه أي وقت مدفوع مسبقاً\", \"The number on the chip and paperwork stays the same\": \"يبقى الرقم على الشريحة والأوراق كما هو\", \"As many moves as your bird needs\": \"عدد غير محدود من الانتقالات حسب حاجة طائرك\", \"Budgies, lovebirds, parrotlets and cockatiels.\": \"البادجي وطيور الحب والببغاوات القزمة والكوكتيل.\", \"For your bird's life, up to 20 years\": \"طوال حياة طائرك، حتى 20 عاماً\", \"Everything in Annual, for one bird\": \"كل ما في الخطة السنوية، لطائر واحد\", \"Named successor, free transfers\": \"خليفة معيّن، ونقل مجاني\", \"Large parrots\": \"الببغاوات الكبيرة\", \"Parrot 10-Year\": \"خطة الببغاء 10 سنوات\", \"African greys, Amazons, cockatoos and macaws.\": \"الببغاوات الرمادية الأفريقية وببغاوات الأمازون والكوكاتو والمكاو.\", \"10 years of service, then renew\": \"10 سنوات من الخدمة، ثم التجديد\", \"10 years prepaid\": \"10 سنوات مدفوعة مسبقاً\", \"Renews at the price in effect at renewal\": \"يُجدَّد بالسعر المعمول به وقت التجديد\", \"Parrot 20-Year\": \"خطة الببغاء 20 سنة\", \"The longest cover for long-lived parrots.\": \"أطول تغطية للببغاوات المعمّرة.\", \"20 years of service, then renew\": \"20 عاماً من الخدمة، ثم التجديد\", \"20 years prepaid\": \"20 عاماً مدفوعة مسبقاً\", \"Any bird can also use the $29 Annual plan.\": \"يمكن لأي طائر أيضاً استخدام الخطة السنوية بسعر $29.\", \"What pet owners ask us most.\": \"أكثر ما يسألنا عنه أصحاب الحيوانات الأليفة.\", \"Do I need a new microchip?\": \"هل أحتاج إلى شريحة إلكترونية جديدة؟\", \"No. Your pet keeps the chip it has. Log in to the registry where the chip is registered and change the phone number to your iCanCall number. After that, you never need to update the registry again.\": \"لا. يحتفظ حيوانك الأليف بشريحته الحالية. سجّل الدخول إلى السجل المسجّلة فيه الشريحة وغيّر رقم الهاتف إلى رقم iCanCall الخاص بك. بعد ذلك، لن تحتاج إلى تحديث السجل مرة أخرى أبداً.\", \"What happens when someone calls the number?\": \"ماذا يحدث عندما يتصل أحدهم بالرقم؟\", \"They hear your lost-pet greeting, then a caller menu with up to six contacts. They press a number to reach the person they want, and the call connects straight through.\": \"يسمع تحية الحيوان المفقود الخاصة بك، ثم قائمة المتصل مع ما يصل إلى ست جهات اتصال. يضغط رقماً للوصول إلى الشخص الذي يريده، وتتصل المكالمة مباشرة.\", \"What if nobody picks up?\": \"ماذا لو لم يُجب أحد؟\", \"The caller can leave a voicemail, and you get a text and an email straight away so you can call them back.\": \"يمكن للمتصل ترك رسالة في البريد الصوتي، وتتلقى رسالة نصية وبريداً إلكترونياً على الفور لتتمكن من معاودة الاتصال به.\", \"Can one number cover all my pets?\": \"هل يمكن لرقم واحد أن يغطي جميع حيواناتي الأليفة؟\", \"Yes, on the Annual plan. Every chip in your home can carry the same number. Lifetime and Parrot plans cover one enrolled pet each.\": \"نعم، مع الخطة السنوية. يمكن لكل شريحة في منزلك أن تحمل الرقم نفسه. أما خطة مدى الحياة وخطط الببغاء فتغطي كل منها حيواناً أليفاً واحداً مسجّلاً.\", \"Why 30 minutes a year, and incoming calls only?\": \"لماذا 30 دقيقة سنوياً، والمكالمات الواردة فقط؟\", \"A lost-pet line gets a few short calls a year, so 30 minutes is plenty. The line only takes incoming calls and always plays your lost-pet greeting, which keeps the price low. We email you if you get close to the limit.\": \"يتلقى خط الحيوانات المفقودة بضع مكالمات قصيرة في السنة، لذا فإن 30 دقيقة أكثر من كافية. يستقبل الخط المكالمات الواردة فقط ويشغّل دائماً تحية الحيوان المفقود الخاصة بك، مما يبقي السعر منخفضاً. نراسلك عبر البريد الإلكتروني إذا اقتربت من الحد.\", \"What happens if my Annual plan lapses?\": \"ماذا يحدث إذا انتهت خطتي السنوية؟\", \"We hold your number for 6 months. During that time, callers hear a short message that the plan has lapsed, and the call still rings your main contact. We email you before the number is released so you can renew or update your microchip registry.\": \"نحتفظ برقمك لمدة 6 أشهر. وخلال هذه المدة، يسمع المتصلون رسالة قصيرة تفيد بانتهاء الخطة، وتظل المكالمة ترنّ على جهة اتصالك الرئيسية. نراسلك عبر البريد الإلكتروني قبل تحرير الرقم لتتمكن من التجديد أو تحديث سجل الشريحة الإلكترونية.\", \"How does the Lifetime plan work?\": \"كيف تعمل خطة مدى الحياة؟\", \"You pay once and the line covers one enrolled pet for its life, or 20 years from purchase, whichever comes first. Once a year we email you to check the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line.\": \"تدفع مرة واحدة ويغطي الخط حيواناً أليفاً واحداً مسجّلاً طوال حياته، أو 20 عاماً من تاريخ الشراء، أيهما أقرب. ومرة كل عام نراسلك عبر البريد الإلكتروني للتحقق من أن الخط لا يزال مطلوباً. وإذا مرّ عامان دون رد ودون مكالمات، نرسل إشعاراً نهائياً ثم نغلق الخط.\", \"What happens if my parrot outlives me?\": \"ماذا يحدث إذا عاش ببغائي بعدي؟\", \"Name a successor, like a family member or a bird rescue. If you can no longer care for your bird, the line moves to them for free, along with any prepaid time. The number on the chip and paperwork stays the same.\": \"عيّن خليفة، مثل أحد أفراد العائلة أو جمعية لإنقاذ الطيور. إذا لم تعد قادراً على رعاية طائرك، ينتقل الخط إليه مجاناً، مع أي وقت مدفوع مسبقاً. ويبقى الرقم على الشريحة والأوراق كما هو.\", \"Put a number on the chip that keeps up with you.\": \"ضع على الشريحة رقماً يواكبك أينما ذهبت.\", \"Pet plans open soon. Join the launch list and we'll email you the day sign-up opens.\": \"خطط الحيوانات الأليفة تُفتح قريباً. انضم إلى قائمة الإطلاق وسنراسلك عبر البريد الإلكتروني في يوم فتح التسجيل.\", \"Annual or lifetime · Works with any microchip registry · 14-day service guarantee\": \"سنوياً أو مدى الحياة · يعمل مع أي سجل للشرائح الإلكترونية · ضمان الخدمة لمدة 14 يومًا\", \"One lost-pet number on your pet's microchip that always reaches you, even after you move or change phones.\": \"رقم واحد للحيوانات المفقودة على الشريحة الإلكترونية لحيوانك الأليف يصل إليك دائماً، حتى بعد الانتقال أو تغيير الهاتف.\", \"Annual\": \"الخطة السنوية\"}, \"attrs\": {\"Your email address\": \"عنوان بريدك الإلكتروني\"}}, \"hi\": {\"text\": {\"Why chips fail\": \"चिप क्यों नाकाम होती हैं\", \"Parrots\": \"तोते\", \"Questions\": \"सवाल\", \"Join the launch list\": \"लॉन्च लिस्ट में शामिल हों\", \"For dogs, cats and parrots\": \"कुत्तों, बिल्लियों और तोतों के लिए\", \"One number on the chip.\": \"चिप पर एक नंबर।\", \"It never goes out of date.\": \"जो कभी पुराना नहीं होता।\", \"Put your iCanCall number on your pet's microchip once. When you move or change phones, update your contacts in the dashboard. The chip keeps reaching you, and you never have to update the registry again.\": \"अपने पालतू की माइक्रोचिप पर एक बार अपना iCanCall नंबर दर्ज करें। जब आप घर बदलें या फोन बदलें, तो डैशबोर्ड में अपने संपर्क अपडेट कर दें। चिप आप तक पहुंचती रहती है, और आपको रजिस्ट्री फिर कभी अपडेट नहीं करनी पड़ती।\", \"Works with any microchip registry.\": \"किसी भी माइक्रोचिप रजिस्ट्री के साथ काम करता है।\", \"Keep the registry you already use. Just put your iCanCall number on file.\": \"वही रजिस्ट्री रखें जो आप पहले से इस्तेमाल करते हैं। बस उसमें अपना iCanCall नंबर दर्ज करा दें।\", \"Max's microchip number\": \"Max का माइक्रोचिप नंबर\", \"A shelter scans Max's chip and calls. The caller menu lets them pick who to reach\": \"एक शेल्टर Max की चिप स्कैन करके कॉल करता है। कॉलर मेनू से वे चुनते हैं कि किससे बात करनी है\", \"Owner\": \"मालिक\", \"Partner\": \"जीवनसाथी\", \"Dog walker\": \"डॉग वॉकर\", \"Made for the day your pet goes missing\": \"उस दिन के लिए बना, जब आपका पालतू खो जाए\", \"number on the chip\": \"चिप पर नंबर\", \"contacts in the caller menu\": \"कॉलर मेनू में संपर्क\", \"registry updates when you move\": \"घर बदलने पर रजिस्ट्री अपडेट\", \"microchip registry\": \"माइक्रोचिप रजिस्ट्री\", \"The chip works. The phone number doesn't.\": \"चिप काम करती है। फोन नंबर नहीं।\", \"This is the most common reason microchips fail to reunite lost dogs with their owners: not a chip malfunction, but outdated contact details. iCanCall puts a number on the chip that keeps up with you.\": \"माइक्रोचिप होने के बावजूद खोए कुत्तों के अपने मालिकों तक न लौट पाने की सबसे आम वजह यही है: चिप की खराबी नहीं, बल्कि पुरानी संपर्क जानकारी। iCanCall चिप पर ऐसा नंबर डालता है जो आपके साथ-साथ अपडेट रहता है।\", \"A number that goes stale\": \"एक नंबर जो पुराना पड़ जाता है\", \"You register the chip once, then life moves on. New phone, new house, and the registry still has the old details.\": \"आप एक बार चिप रजिस्टर करते हैं, फिर ज़िंदगी आगे बढ़ जाती है। नया फोन, नया घर, और रजिस्ट्री में अब भी पुरानी जानकारी है।\", \"Registry phone\": \"रजिस्ट्री फोन\", \"Old cell\": \"पुराना मोबाइल\", \"Home address\": \"घर का पता\", \"Moved\": \"बदल गया\", \"Backup contact\": \"बैकअप संपर्क\", \"None\": \"कोई नहीं\", \"Last updated\": \"पिछला अपडेट\", \"Years ago\": \"बरसों पहले\", \"\\\"The number you have dialed is no longer in service.\\\"\": \"\\\"आपके द्वारा डायल किया गया नंबर अब सेवा में नहीं है।\\\"\", \"A number that keeps up with you\": \"एक नंबर जो आपके साथ चलता है\", \"The number on the chip never changes. You change who it reaches, any time, from your phone.\": \"चिप पर नंबर कभी नहीं बदलता। वह किस तक पहुंचे, यह आप कभी भी अपने फोन से बदल सकते हैं।\", \"\\\"New phone, new house, same number on the chip.\\\"\": \"\\\"नया फोन, नया घर, चिप पर वही नंबर।\\\"\", \"Set it up once. Keep it current forever.\": \"एक बार सेट करें। हमेशा अप-टू-डेट रखें।\", \"A few minutes of setup means the number on your pet's chip always reaches someone who can help.\": \"कुछ मिनटों के सेटअप से आपके पालतू की चिप पर दर्ज नंबर हमेशा किसी ऐसे व्यक्ति तक पहुंचता है जो मदद कर सके।\", \"Get your pet number\": \"अपने पालतू का नंबर लें\", \"Pick an iCanCall number for your pet. One number can cover every pet in your home.\": \"अपने पालतू के लिए एक iCanCall नंबर चुनें। एक नंबर आपके घर के सभी पालतुओं के लिए काफ़ी है।\", \"Put it on the chip\": \"इसे चिप पर दर्ज करें\", \"Log in to the registry where your pet's chip is registered and set your iCanCall number as the phone number. Add it to the collar tag too.\": \"जिस रजिस्ट्री में आपके पालतू की चिप रजिस्टर है, उसमें लॉग इन करें और फोन नंबर की जगह अपना iCanCall नंबर डालें। इसे कॉलर टैग पर भी लिखें।\", \"Add up to six contacts\": \"छह तक संपर्क जोड़ें\", \"You, your partner, a neighbor, the dog walker. When someone calls, they hear your lost-pet greeting and use the caller menu to pick who to reach.\": \"आप, आपका जीवनसाथी, कोई पड़ोसी, डॉग वॉकर। जब कोई कॉल करता है, तो उसे आपका खोए पालतू का अभिवादन संदेश सुनाई देता है और वह कॉलर मेनू से चुनता है कि किससे बात करनी है।\", \"Wherever they turn up\": \"वे जहां भी मिलें\", \"The same number works wherever your pet is found.\": \"आपका पालतू जहां भी मिले, वही नंबर काम करता है।\", \"Shelters, vets and neighbors all reach you the same way: one number, from any phone.\": \"शेल्टर, पशु चिकित्सक और पड़ोसी, सभी आप तक एक ही तरह पहुंचते हैं: एक नंबर, किसी भी फोन से।\", \"Scanned at a shelter\": \"शेल्टर में स्कैन\", \"Staff scan the chip, call the number, and hear your lost-pet greeting straight away.\": \"स्टाफ़ चिप स्कैन करता है, नंबर पर कॉल करता है, और तुरंत आपका खोए पालतू का अभिवादन संदेश सुनता है।\", \"Scanned at a vet\": \"पशु चिकित्सक के यहां स्कैन\", \"A vet clinic checks the chip and calls you directly, without searching for old records.\": \"पशु क्लिनिक चिप जांचकर सीधे आपको कॉल करता है, पुराने रिकॉर्ड खोजे बिना।\", \"Found by a neighbor\": \"पड़ोसी को मिला\", \"They read the number on the collar tag and call. The caller menu gets them to whoever is free.\": \"वे कॉलर टैग पर नंबर पढ़कर कॉल करते हैं। कॉलर मेनू उन्हें उस व्यक्ति तक पहुंचा देता है जो उस समय उपलब्ध हो।\", \"After you move\": \"घर बदलने के बाद\", \"New phone or new city? Update your contacts in the dashboard. The chip never needs touching.\": \"नया फोन या नया शहर? डैशबोर्ड में अपने संपर्क अपडेट करें। चिप को कभी छूने की ज़रूरत नहीं।\", \"Try the caller menu a finder will hear.\": \"वह कॉलर मेनू आज़माएं जो ढूंढने वाले को सुनाई देगा।\", \"Add the people who should hear about your pet, set their order, then place a pretend call. The finder hears your lost-pet greeting and presses a number to reach someone.\": \"उन लोगों को जोड़ें जिन्हें आपके पालतू के बारे में पता चलना चाहिए, उनका क्रम तय करें, फिर एक नकली कॉल करें। ढूंढने वाला आपका खोए पालतू का अभिवादन संदेश सुनता है और किसी तक पहुंचने के लिए एक नंबर दबाता है।\", \"Your pet's contacts\": \"आपके पालतू के संपर्क\", \"/6 contacts\": \"/6 संपर्क\", \"Place a call to hear the options\": \"विकल्प सुनने के लिए कॉल करें\", \"Callers pick who to reach. Flip a contact to “Busy” to send them to voicemail.\": \"कॉल करने वाले चुनते हैं कि किससे बात करनी है। किसी संपर्क को “व्यस्त” पर करें, ताकि कॉल वॉइसमेल पर चली जाए।\", \"Why pet owners choose iCanCall\": \"पालतू मालिक iCanCall क्यों चुनते हैं\", \"Built so a found pet always finds its way home.\": \"इस तरह बना कि मिला हुआ पालतू हमेशा घर लौट आए।\", \"A number that never goes stale\": \"एक नंबर जो कभी पुराना नहीं पड़ता\", \"Change phones, move house, add a pet sitter. Update the dashboard and the chip keeps working.\": \"फोन बदलें, घर बदलें, पेट सिटर जोड़ें। डैशबोर्ड अपडेट करें और चिप काम करती रहती है।\", \"A greeting made for finders\": \"ढूंढने वालों के लिए बना अभिवादन\", \"Every call starts with your lost-pet message, so shelters and neighbors know they have reached the right place.\": \"हर कॉल आपके खोए पालतू वाले संदेश से शुरू होती है, ताकि शेल्टर और पड़ोसी जान लें कि वे सही जगह पहुंचे हैं।\", \"A caller menu for six contacts\": \"छह संपर्कों के लिए कॉलर मेनू\", \"Finders press a number to reach you, your partner, a neighbor or the dog walker, in the order you choose.\": \"ढूंढने वाले एक नंबर दबाकर आप, आपके जीवनसाथी, किसी पड़ोसी या डॉग वॉकर तक पहुंचते हैं, उसी क्रम में जो आप चुनें।\", \"You hear about it right away\": \"आपको तुरंत पता चलता है\", \"If nobody picks up, the caller leaves a voicemail and you get a text and an email straight away.\": \"अगर कोई फोन नहीं उठाता, तो कॉल करने वाला वॉइसमेल छोड़ता है और आपको तुरंत एक मैसेज और एक ईमेल मिलता है।\", \"Held for 6 months if you lapse\": \"प्लान की अवधि समाप्त होने पर 6 महीने तक सुरक्षित\", \"Miss a renewal and we keep your number for 6 months, still ringing your main contact, so the chip keeps working.\": \"अगर आप रिन्यू करना भूल जाएं, तो हम आपका नंबर 6 महीने तक रखते हैं और कॉल आपके मुख्य संपर्क पर बजती रहती है, ताकि चिप काम करती रहे।\", \"Your numbers stay private\": \"आपके नंबर निजी रहते हैं\", \"Finders only ever see your iCanCall number, never your personal phone numbers.\": \"ढूंढने वालों को सिर्फ़ आपका iCanCall नंबर दिखता है, आपके निजी फोन नंबर कभी नहीं।\", \"Less than $2.50 a month, paid once a year.\": \"महीने के $2.50 से भी कम, साल में एक बार भुगतान।\", \"Pay once a year, or once for your pet's whole life. There are no monthly plans and no setup fees.\": \"साल में एक बार भुगतान करें, या अपने पालतू की पूरी ज़िंदगी के लिए एक बार। कोई मासिक प्लान नहीं और कोई सेटअप शुल्क नहीं।\", \"One lost-pet number for every pet in your home.\": \"आपके घर के सभी पालतुओं के लिए खोए पालतू का एक नंबर।\", \"/ year\": \"/ वर्ष\", \"Billed once a year\": \"साल में एक बार बिलिंग\", \"1 dedicated lost-pet number\": \"खोए पालतू के लिए 1 समर्पित नंबर\", \"Caller menu with up to 6 contacts\": \"अधिकतम 6 संपर्कों वाला कॉलर मेनू\", \"Lost-pet greeting on every call\": \"हर कॉल पर खोए पालतू का अभिवादन संदेश\", \"Voicemail with text and email alerts\": \"मैसेज और ईमेल अलर्ट के साथ वॉइसमेल\", \"30 minutes of calls per year\": \"प्रति वर्ष 30 मिनट की कॉल\", \"Incoming calls only\": \"सिर्फ़ इनकमिंग कॉल\", \"Works with any microchip registry\": \"किसी भी माइक्रोचिप रजिस्ट्री के साथ काम करता है\", \"Number held 6 months if your plan lapses\": \"प्लान की अवधि समाप्त होने पर नंबर 6 महीने तक सुरक्षित\", \"Pay once\": \"एक बार भुगतान\", \"Lifetime\": \"आजीवन\", \"One payment for one pet's whole life.\": \"एक पालतू की पूरी ज़िंदगी के लिए एक भुगतान।\", \"one time\": \"एक बार\", \"For your pet's life, up to 20 years\": \"आपके पालतू के जीवनभर, अधिकतम 20 वर्ष तक\", \"Everything in Annual, for one enrolled pet\": \"वार्षिक प्लान की सभी सुविधाएं, एक नामांकित पालतू के लिए\", \"Covers your pet's life, up to 20 years\": \"आपके पालतू के जीवनभर का कवर, अधिकतम 20 वर्ष तक\", \"No yearly renewals\": \"हर साल रिन्यू करने की ज़रूरत नहीं\", \"A yearly check-in email keeps the line active\": \"साल में एक बार आने वाला चेक-इन ईमेल लाइन को सक्रिय रखता है\", \"Lifetime, Small Bird Lifetime and Parrot plans cover one enrolled pet. Lifetime plans last for the life of the enrolled pet or 20 years from purchase, whichever comes first. Each year we email you to confirm the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line. Prices are in US dollars.\": \"आजीवन, छोटे पक्षी आजीवन और तोता प्लान एक नामांकित पालतू को कवर करते हैं। आजीवन प्लान नामांकित पालतू के जीवनकाल तक या खरीद से 20 वर्ष तक चलते हैं, जो भी पहले हो। हर साल हम आपको ईमेल करके पुष्टि करते हैं कि लाइन की अब भी ज़रूरत है। अगर दो साल तक न कोई जवाब आए और न कोई कॉल, तो हम एक अंतिम सूचना भेजते हैं और फिर लाइन बंद कर देते हैं। कीमतें अमेरिकी डॉलर में हैं।\", \"Pet plans open soon.\": \"पेट प्लान जल्द शुरू हो रहे हैं।\", \"Join the launch list and we'll email you the day sign-up opens.\": \"लॉन्च लिस्ट में शामिल हों, और जिस दिन साइन-अप शुरू होगा, हम आपको ईमेल करेंगे।\", \"Parrots and other birds\": \"तोते और दूसरे पक्षी\", \"Built for birds that live for decades.\": \"उन पक्षियों के लिए बना जो दशकों तक जीते हैं।\", \"A budgie might live ten years. A macaw can live eighty. iCanCall Pets has plans for every size of bird, and a way to pass the line on when a parrot changes homes.\": \"एक बजरीगर शायद दस साल जिए। एक मैकॉ अस्सी साल तक जी सकता है। iCanCall Pets में हर आकार के पक्षी के लिए प्लान हैं, और जब तोता नए घर जाए तो लाइन आगे सौंपने का तरीका भी।\", \"Budgie, lovebird, parrotlet\": \"बजरीगर, लवबर्ड, पैरटलेट\", \"Typically 5 to 15 years.\": \"आमतौर पर 5 से 15 वर्ष।\", \"Small Bird Lifetime\": \"छोटे पक्षी आजीवन\", \"Cockatiel\": \"कॉकटील\", \"Typically 15 to 25 years.\": \"आमतौर पर 15 से 25 वर्ष।\", \"African grey, Amazon, cockatoo\": \"अफ़्रीकी ग्रे, अमेज़न, काकातुआ\", \"Typically 40 to 70 years.\": \"आमतौर पर 40 से 70 वर्ष।\", \"Parrot 10-Year or 20-Year\": \"तोता 10-वर्षीय या 20-वर्षीय\", \"Macaw\": \"मैकॉ\", \"Typically 50 to 80 years.\": \"आमतौर पर 50 से 80 वर्ष।\", \"Name a successor\": \"उत्तराधिकारी चुनें\", \"When your parrot changes homes, the number goes too.\": \"जब आपका तोता नए घर जाता है, तो नंबर भी साथ जाता है।\", \"Parrots often outlive their owners or move to new homes. Name a backup person, like a family member or a bird rescue, who takes over the line if you can no longer care for your bird.\": \"तोते अक्सर अपने मालिकों से ज़्यादा जीते हैं या नए घरों में चले जाते हैं। किसी बैकअप व्यक्ति को चुनें, जैसे परिवार का कोई सदस्य या कोई बर्ड रेस्क्यू संस्था, जो लाइन संभाल ले अगर आप अपने पक्षी की देखभाल न कर सकें।\", \"Not every bird has a microchip. Put the number on a cage tag, travel carrier and rescue paperwork too.\": \"हर पक्षी में माइक्रोचिप नहीं होती। नंबर पिंजरे के टैग, ट्रैवल कैरियर और रेस्क्यू के कागज़ात पर भी लिखें।\", \"The line moves to the new owner for free\": \"लाइन नए मालिक को मुफ़्त में ट्रांसफ़र होती है\", \"Any prepaid time moves with it\": \"पहले से भुगतान किया गया समय भी साथ जाता है\", \"The number on the chip and paperwork stays the same\": \"चिप और कागज़ात पर नंबर वही रहता है\", \"As many moves as your bird needs\": \"आपके पक्षी को जितनी बार ज़रूरत हो, उतने ट्रांसफ़र\", \"Budgies, lovebirds, parrotlets and cockatiels.\": \"बजरीगर, लवबर्ड, पैरटलेट और कॉकटील।\", \"For your bird's life, up to 20 years\": \"आपके पक्षी के जीवनभर, अधिकतम 20 वर्ष तक\", \"Everything in Annual, for one bird\": \"वार्षिक प्लान की सभी सुविधाएं, एक पक्षी के लिए\", \"Named successor, free transfers\": \"नामित उत्तराधिकारी, मुफ़्त ट्रांसफ़र\", \"Large parrots\": \"बड़े तोते\", \"Parrot 10-Year\": \"तोता 10-वर्षीय\", \"African greys, Amazons, cockatoos and macaws.\": \"अफ़्रीकी ग्रे, अमेज़न, काकातुआ और मैकॉ।\", \"10 years of service, then renew\": \"10 वर्ष की सेवा, फिर रिन्यू करें\", \"10 years prepaid\": \"10 वर्ष का अग्रिम भुगतान\", \"Renews at the price in effect at renewal\": \"रिन्यू के समय लागू कीमत पर रिन्यू होता है\", \"Parrot 20-Year\": \"तोता 20-वर्षीय\", \"The longest cover for long-lived parrots.\": \"लंबी उम्र वाले तोतों के लिए सबसे लंबा कवर।\", \"20 years of service, then renew\": \"20 वर्ष की सेवा, फिर रिन्यू करें\", \"20 years prepaid\": \"20 वर्ष का अग्रिम भुगतान\", \"Any bird can also use the $29 Annual plan.\": \"कोई भी पक्षी $29 वाला वार्षिक प्लान भी ले सकता है।\", \"What pet owners ask us most.\": \"पालतू मालिक हमसे सबसे ज़्यादा यही पूछते हैं।\", \"Do I need a new microchip?\": \"क्या मुझे नई माइक्रोचिप चाहिए?\", \"No. Your pet keeps the chip it has. Log in to the registry where the chip is registered and change the phone number to your iCanCall number. After that, you never need to update the registry again.\": \"नहीं। आपके पालतू की मौजूदा चिप ही रहती है। जिस रजिस्ट्री में चिप रजिस्टर है, उसमें लॉग इन करें और फोन नंबर बदलकर अपना iCanCall नंबर डालें। उसके बाद आपको रजिस्ट्री फिर कभी अपडेट नहीं करनी पड़ती।\", \"What happens when someone calls the number?\": \"जब कोई इस नंबर पर कॉल करता है तो क्या होता है?\", \"They hear your lost-pet greeting, then a caller menu with up to six contacts. They press a number to reach the person they want, and the call connects straight through.\": \"उन्हें आपका खोए पालतू का अभिवादन संदेश सुनाई देता है, फिर अधिकतम छह संपर्कों वाला कॉलर मेनू। वे जिस व्यक्ति से बात करना चाहते हैं, उसके लिए एक नंबर दबाते हैं, और कॉल सीधे जुड़ जाती है।\", \"What if nobody picks up?\": \"अगर कोई फोन न उठाए तो?\", \"The caller can leave a voicemail, and you get a text and an email straight away so you can call them back.\": \"कॉल करने वाला वॉइसमेल छोड़ सकता है, और आपको तुरंत एक मैसेज और एक ईमेल मिलता है ताकि आप उन्हें वापस कॉल कर सकें।\", \"Can one number cover all my pets?\": \"क्या एक नंबर मेरे सभी पालतुओं को कवर कर सकता है?\", \"Yes, on the Annual plan. Every chip in your home can carry the same number. Lifetime and Parrot plans cover one enrolled pet each.\": \"हां, वार्षिक प्लान पर। आपके घर की हर चिप पर वही नंबर हो सकता है। आजीवन और तोता प्लान में हर प्लान एक नामांकित पालतू को कवर करता है।\", \"Why 30 minutes a year, and incoming calls only?\": \"साल में 30 मिनट और सिर्फ़ इनकमिंग कॉल ही क्यों?\", \"A lost-pet line gets a few short calls a year, so 30 minutes is plenty. The line only takes incoming calls and always plays your lost-pet greeting, which keeps the price low. We email you if you get close to the limit.\": \"खोए पालतू की लाइन पर साल में कुछ ही छोटी कॉल आती हैं, इसलिए 30 मिनट काफ़ी हैं। यह लाइन सिर्फ़ इनकमिंग कॉल लेती है और हमेशा आपका खोए पालतू का अभिवादन संदेश चलाती है, जिससे कीमत कम रहती है। सीमा के करीब पहुंचने पर हम आपको ईमेल करते हैं।\", \"What happens if my Annual plan lapses?\": \"अगर मेरे वार्षिक प्लान की अवधि समाप्त हो जाए तो क्या होता है?\", \"We hold your number for 6 months. During that time, callers hear a short message that the plan has lapsed, and the call still rings your main contact. We email you before the number is released so you can renew or update your microchip registry.\": \"हम आपका नंबर 6 महीने तक सुरक्षित रखते हैं। इस दौरान कॉल करने वालों को एक छोटा संदेश सुनाई देता है कि प्लान की अवधि समाप्त हो गई है, और कॉल फिर भी आपके मुख्य संपर्क पर बजती है। नंबर छोड़े जाने से पहले हम आपको ईमेल करते हैं ताकि आप रिन्यू कर सकें या अपनी माइक्रोचिप रजिस्ट्री अपडेट कर सकें।\", \"How does the Lifetime plan work?\": \"आजीवन प्लान कैसे काम करता है?\", \"You pay once and the line covers one enrolled pet for its life, or 20 years from purchase, whichever comes first. Once a year we email you to check the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line.\": \"आप एक बार भुगतान करते हैं और लाइन एक नामांकित पालतू को उसके जीवनभर, या खरीद से 20 वर्ष तक, जो भी पहले हो, कवर करती है। साल में एक बार हम आपको ईमेल करके पूछते हैं कि लाइन की अब भी ज़रूरत है या नहीं। अगर दो साल तक न कोई जवाब आए और न कोई कॉल, तो हम एक अंतिम सूचना भेजते हैं और फिर लाइन बंद कर देते हैं।\", \"What happens if my parrot outlives me?\": \"अगर मेरा तोता मुझसे ज़्यादा जिए तो क्या होगा?\", \"Name a successor, like a family member or a bird rescue. If you can no longer care for your bird, the line moves to them for free, along with any prepaid time. The number on the chip and paperwork stays the same.\": \"कोई उत्तराधिकारी चुनें, जैसे परिवार का कोई सदस्य या कोई बर्ड रेस्क्यू संस्था। अगर आप अपने पक्षी की देखभाल न कर सकें, तो लाइन पहले से भुगतान किए गए समय के साथ मुफ़्त में उन्हें ट्रांसफ़र हो जाती है। चिप और कागज़ात पर नंबर वही रहता है।\", \"Put a number on the chip that keeps up with you.\": \"चिप पर ऐसा नंबर डालें जो आपके साथ चलता रहे।\", \"Pet plans open soon. Join the launch list and we'll email you the day sign-up opens.\": \"पेट प्लान जल्द शुरू हो रहे हैं। लॉन्च लिस्ट में शामिल हों, और जिस दिन साइन-अप शुरू होगा, हम आपको ईमेल करेंगे।\", \"Annual or lifetime · Works with any microchip registry · 14-day service guarantee\": \"वार्षिक या आजीवन · किसी भी माइक्रोचिप रजिस्ट्री के साथ काम करता है · 14-दिन की सेवा गारंटी\", \"One lost-pet number on your pet's microchip that always reaches you, even after you move or change phones.\": \"आपके पालतू की माइक्रोचिप पर खोए पालतू का एक नंबर, जो हमेशा आप तक पहुंचता है, चाहे आप घर बदलें या फोन।\", \"Annual\": \"वार्षिक प्लान\"}, \"attrs\": {\"Your email address\": \"आपका ईमेल पता\"}}, \"pt\": {\"text\": {\"Why chips fail\": \"Por que os chips falham\", \"Parrots\": \"Papagaios\", \"Questions\": \"Perguntas\", \"Join the launch list\": \"Entre na lista de lançamento\", \"For dogs, cats and parrots\": \"Para cães, gatos e papagaios\", \"One number on the chip.\": \"Um número no chip.\", \"It never goes out of date.\": \"Ele nunca fica desatualizado.\", \"Put your iCanCall number on your pet's microchip once. When you move or change phones, update your contacts in the dashboard. The chip keeps reaching you, and you never have to update the registry again.\": \"Coloque seu número iCanCall no microchip do seu pet uma única vez. Quando você se mudar ou trocar de celular, atualize seus contatos no painel. O chip continua chegando até você, e você nunca mais precisa atualizar o cadastro.\", \"Works with any microchip registry.\": \"Funciona com qualquer cadastro de microchip.\", \"Keep the registry you already use. Just put your iCanCall number on file.\": \"Mantenha o cadastro que você já usa. Basta registrar nele o seu número iCanCall.\", \"Max's microchip number\": \"Número do microchip do Max\", \"A shelter scans Max's chip and calls. The caller menu lets them pick who to reach\": \"Um abrigo lê o chip do Max e liga. O menu vocal permite escolher com quem falar\", \"Owner\": \"Tutor(a)\", \"Partner\": \"Parceiro(a)\", \"Dog walker\": \"Passeador(a) de cães\", \"Made for the day your pet goes missing\": \"Feito para o dia em que seu pet se perder\", \"number on the chip\": \"número no chip\", \"contacts in the caller menu\": \"contatos no menu vocal\", \"registry updates when you move\": \"atualizações do cadastro ao se mudar\", \"microchip registry\": \"cadastro de microchip\", \"The chip works. The phone number doesn't.\": \"O chip funciona. O número de telefone, não.\", \"This is the most common reason microchips fail to reunite lost dogs with their owners: not a chip malfunction, but outdated contact details. iCanCall puts a number on the chip that keeps up with you.\": \"Este é o motivo mais comum para os microchips não reunirem cães perdidos com seus tutores: não é defeito no chip, e sim dados de contato desatualizados. O iCanCall coloca no chip um número que acompanha você.\", \"A number that goes stale\": \"Um número que fica desatualizado\", \"You register the chip once, then life moves on. New phone, new house, and the registry still has the old details.\": \"Você cadastra o chip uma vez e a vida segue. Celular novo, casa nova, e o cadastro continua com os dados antigos.\", \"Registry phone\": \"Telefone no cadastro\", \"Old cell\": \"Celular antigo\", \"Home address\": \"Endereço\", \"Moved\": \"Mudou-se\", \"Backup contact\": \"Contato reserva\", \"None\": \"Nenhum\", \"Last updated\": \"Última atualização\", \"Years ago\": \"Há anos\", \"\\\"The number you have dialed is no longer in service.\\\"\": \"“O número discado não está mais em uso.”\", \"A number that keeps up with you\": \"Um número que acompanha você\", \"The number on the chip never changes. You change who it reaches, any time, from your phone.\": \"O número no chip nunca muda. Você muda quem ele alcança, a qualquer momento, pelo seu celular.\", \"\\\"New phone, new house, same number on the chip.\\\"\": \"“Celular novo, casa nova, o mesmo número no chip.”\", \"Set it up once. Keep it current forever.\": \"Configure uma vez. Mantenha atualizado para sempre.\", \"A few minutes of setup means the number on your pet's chip always reaches someone who can help.\": \"Alguns minutos de configuração garantem que o número no chip do seu pet sempre chegue a alguém que pode ajudar.\", \"Get your pet number\": \"Garanta o número do seu pet\", \"Pick an iCanCall number for your pet. One number can cover every pet in your home.\": \"Escolha um número iCanCall para o seu pet. Um único número pode cobrir todos os pets da sua casa.\", \"Put it on the chip\": \"Coloque-o no chip\", \"Log in to the registry where your pet's chip is registered and set your iCanCall number as the phone number. Add it to the collar tag too.\": \"Entre no cadastro onde o chip do seu pet está registrado e defina seu número iCanCall como o telefone de contato. Coloque-o também na plaquinha da coleira.\", \"Add up to six contacts\": \"Adicione até seis contatos\", \"You, your partner, a neighbor, the dog walker. When someone calls, they hear your lost-pet greeting and use the caller menu to pick who to reach.\": \"Você, seu parceiro ou parceira, um vizinho, o passeador de cães. Quando alguém liga, ouve sua mensagem de pet perdido e usa o menu vocal para escolher com quem falar.\", \"Wherever they turn up\": \"Onde quer que apareçam\", \"The same number works wherever your pet is found.\": \"O mesmo número funciona onde quer que seu pet seja encontrado.\", \"Shelters, vets and neighbors all reach you the same way: one number, from any phone.\": \"Abrigos, veterinários e vizinhos falam com você do mesmo jeito: um número, de qualquer telefone.\", \"Scanned at a shelter\": \"Lido em um abrigo\", \"Staff scan the chip, call the number, and hear your lost-pet greeting straight away.\": \"A equipe lê o chip, liga para o número e ouve na hora sua mensagem de pet perdido.\", \"Scanned at a vet\": \"Lido no veterinário\", \"A vet clinic checks the chip and calls you directly, without searching for old records.\": \"A clínica veterinária verifica o chip e liga direto para você, sem procurar registros antigos.\", \"Found by a neighbor\": \"Encontrado por um vizinho\", \"They read the number on the collar tag and call. The caller menu gets them to whoever is free.\": \"Ele lê o número na plaquinha da coleira e liga. O menu vocal leva até quem estiver disponível.\", \"After you move\": \"Depois da mudança\", \"New phone or new city? Update your contacts in the dashboard. The chip never needs touching.\": \"Celular novo ou cidade nova? Atualize seus contatos no painel. O chip nunca precisa ser alterado.\", \"Try the caller menu a finder will hear.\": \"Experimente o menu vocal que quem encontrar seu pet vai ouvir.\", \"Add the people who should hear about your pet, set their order, then place a pretend call. The finder hears your lost-pet greeting and presses a number to reach someone.\": \"Adicione as pessoas que devem ser avisadas sobre seu pet, defina a ordem e faça uma ligação simulada. Quem encontrou ouve sua mensagem de pet perdido e aperta um número para falar com alguém.\", \"Your pet's contacts\": \"Contatos do seu pet\", \"/6 contacts\": \"/6 contatos\", \"Place a call to hear the options\": \"Faça uma ligação para ouvir as opções\", \"Callers pick who to reach. Flip a contact to “Busy” to send them to voicemail.\": \"Quem liga escolhe com quem falar. Marque um contato como “Ocupado” para enviar a ligação à caixa postal.\", \"Why pet owners choose iCanCall\": \"Por que tutores de pets escolhem o iCanCall\", \"Built so a found pet always finds its way home.\": \"Feito para que um pet encontrado sempre volte para casa.\", \"A number that never goes stale\": \"Um número que nunca fica desatualizado\", \"Change phones, move house, add a pet sitter. Update the dashboard and the chip keeps working.\": \"Troque de celular, mude de casa, inclua um pet sitter. Atualize o painel e o chip continua funcionando.\", \"A greeting made for finders\": \"Uma mensagem feita para quem encontra\", \"Every call starts with your lost-pet message, so shelters and neighbors know they have reached the right place.\": \"Toda ligação começa com sua mensagem de pet perdido, para que abrigos e vizinhos saibam que ligaram para o lugar certo.\", \"A caller menu for six contacts\": \"Um menu vocal para seis contatos\", \"Finders press a number to reach you, your partner, a neighbor or the dog walker, in the order you choose.\": \"Quem encontra aperta um número para falar com você, seu parceiro ou parceira, um vizinho ou o passeador de cães, na ordem que você escolher.\", \"You hear about it right away\": \"Você fica sabendo na hora\", \"If nobody picks up, the caller leaves a voicemail and you get a text and an email straight away.\": \"Se ninguém atender, a pessoa deixa um recado na caixa postal e você recebe um SMS e um e-mail na hora.\", \"Held for 6 months if you lapse\": \"Reservado por 6 meses se o plano vencer\", \"Miss a renewal and we keep your number for 6 months, still ringing your main contact, so the chip keeps working.\": \"Se você não renovar, reservamos seu número por 6 meses, ainda chamando seu contato principal, para que o chip continue funcionando.\", \"Your numbers stay private\": \"Seus números ficam privados\", \"Finders only ever see your iCanCall number, never your personal phone numbers.\": \"Quem encontra só vê seu número iCanCall, nunca seus números de telefone pessoais.\", \"Less than $2.50 a month, paid once a year.\": \"Menos de $2.50 por mês, pago uma vez por ano.\", \"Pay once a year, or once for your pet's whole life. There are no monthly plans and no setup fees.\": \"Pague uma vez por ano, ou uma única vez para a vida toda do seu pet. Não há planos mensais nem taxa de adesão.\", \"One lost-pet number for every pet in your home.\": \"Um número para pet perdido para todos os pets da sua casa.\", \"/ year\": \"/ ano\", \"Billed once a year\": \"Cobrança uma vez por ano\", \"1 dedicated lost-pet number\": \"1 número dedicado para pet perdido\", \"Caller menu with up to 6 contacts\": \"Menu vocal com até 6 contatos\", \"Lost-pet greeting on every call\": \"Mensagem de pet perdido em toda ligação\", \"Voicemail with text and email alerts\": \"Caixa postal com alertas por SMS e e-mail\", \"30 minutes of calls per year\": \"30 minutos de ligações por ano\", \"Incoming calls only\": \"Somente chamadas recebidas\", \"Works with any microchip registry\": \"Funciona com qualquer cadastro de microchip\", \"Number held 6 months if your plan lapses\": \"Número reservado por 6 meses se o plano vencer\", \"Pay once\": \"Pague uma vez\", \"Lifetime\": \"Vitalício\", \"One payment for one pet's whole life.\": \"Um pagamento para a vida toda de um pet.\", \"one time\": \"pagamento único\", \"For your pet's life, up to 20 years\": \"Pela vida do seu pet, até 20 anos\", \"Everything in Annual, for one enrolled pet\": \"Tudo do Anual, para um pet inscrito\", \"Covers your pet's life, up to 20 years\": \"Cobre a vida do seu pet, até 20 anos\", \"No yearly renewals\": \"Sem renovações anuais\", \"A yearly check-in email keeps the line active\": \"Um e-mail anual de confirmação mantém a linha ativa\", \"Lifetime, Small Bird Lifetime and Parrot plans cover one enrolled pet. Lifetime plans last for the life of the enrolled pet or 20 years from purchase, whichever comes first. Each year we email you to confirm the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line. Prices are in US dollars.\": \"Os planos Vitalício, Vitalício Aves Pequenas e Papagaio cobrem um pet inscrito. Os planos vitalícios duram pela vida do pet inscrito ou por 20 anos a partir da compra, o que ocorrer primeiro. Todo ano enviamos um e-mail para confirmar que a linha ainda é necessária. Se passarem dois anos sem resposta e sem ligações, enviamos um aviso final e então encerramos a linha. Os preços estão em dólares americanos.\", \"Pet plans open soon.\": \"Os planos para pets abrem em breve.\", \"Join the launch list and we'll email you the day sign-up opens.\": \"Entre na lista de lançamento e enviaremos um e-mail no dia em que as inscrições abrirem.\", \"Parrots and other birds\": \"Papagaios e outras aves\", \"Built for birds that live for decades.\": \"Feito para aves que vivem por décadas.\", \"A budgie might live ten years. A macaw can live eighty. iCanCall Pets has plans for every size of bird, and a way to pass the line on when a parrot changes homes.\": \"Um periquito-australiano pode viver dez anos. Uma arara pode viver oitenta. O iCanCall Pets tem planos para aves de todos os tamanhos e uma forma de transferir a linha quando um papagaio muda de lar.\", \"Budgie, lovebird, parrotlet\": \"Periquito-australiano, agapórnis, forpus\", \"Typically 5 to 15 years.\": \"Geralmente de 5 a 15 anos.\", \"Small Bird Lifetime\": \"Vitalício Aves Pequenas\", \"Cockatiel\": \"Calopsita\", \"Typically 15 to 25 years.\": \"Geralmente de 15 a 25 anos.\", \"African grey, Amazon, cockatoo\": \"Papagaio-cinzento, amazona, cacatua\", \"Typically 40 to 70 years.\": \"Geralmente de 40 a 70 anos.\", \"Parrot 10-Year or 20-Year\": \"Papagaio 10 Anos ou 20 Anos\", \"Macaw\": \"Arara\", \"Typically 50 to 80 years.\": \"Geralmente de 50 a 80 anos.\", \"Name a successor\": \"Indique um sucessor\", \"When your parrot changes homes, the number goes too.\": \"Quando seu papagaio muda de lar, o número vai junto.\", \"Parrots often outlive their owners or move to new homes. Name a backup person, like a family member or a bird rescue, who takes over the line if you can no longer care for your bird.\": \"Papagaios muitas vezes vivem mais que seus tutores ou vão para novos lares. Indique uma pessoa reserva, como um familiar ou um abrigo de aves, que assume a linha se você não puder mais cuidar da sua ave.\", \"Not every bird has a microchip. Put the number on a cage tag, travel carrier and rescue paperwork too.\": \"Nem toda ave tem microchip. Coloque o número também na etiqueta da gaiola, na caixa de transporte e nos documentos do resgate.\", \"The line moves to the new owner for free\": \"A linha passa para o novo tutor sem custo\", \"Any prepaid time moves with it\": \"Todo tempo pré-pago vai junto\", \"The number on the chip and paperwork stays the same\": \"O número no chip e nos documentos continua o mesmo\", \"As many moves as your bird needs\": \"Quantas mudanças sua ave precisar\", \"Budgies, lovebirds, parrotlets and cockatiels.\": \"Periquitos-australianos, agapórnis, forpus e calopsitas.\", \"For your bird's life, up to 20 years\": \"Pela vida da sua ave, até 20 anos\", \"Everything in Annual, for one bird\": \"Tudo do Anual, para uma ave\", \"Named successor, free transfers\": \"Sucessor indicado, transferências sem custo\", \"Large parrots\": \"Papagaios grandes\", \"Parrot 10-Year\": \"Papagaio 10 Anos\", \"African greys, Amazons, cockatoos and macaws.\": \"Papagaios-cinzentos, amazonas, cacatuas e araras.\", \"10 years of service, then renew\": \"10 anos de serviço, depois renove\", \"10 years prepaid\": \"10 anos pré-pagos\", \"Renews at the price in effect at renewal\": \"Renova pelo preço vigente na renovação\", \"Parrot 20-Year\": \"Papagaio 20 Anos\", \"The longest cover for long-lived parrots.\": \"A cobertura mais longa para papagaios que vivem muito.\", \"20 years of service, then renew\": \"20 anos de serviço, depois renove\", \"20 years prepaid\": \"20 anos pré-pagos\", \"Any bird can also use the $29 Annual plan.\": \"Qualquer ave também pode usar o plano Anual de $29.\", \"What pet owners ask us most.\": \"O que os tutores de pets mais nos perguntam.\", \"Do I need a new microchip?\": \"Preciso de um microchip novo?\", \"No. Your pet keeps the chip it has. Log in to the registry where the chip is registered and change the phone number to your iCanCall number. After that, you never need to update the registry again.\": \"Não. Seu pet continua com o chip que já tem. Entre no cadastro onde o chip está registrado e troque o telefone pelo seu número iCanCall. Depois disso, você nunca mais precisa atualizar o cadastro.\", \"What happens when someone calls the number?\": \"O que acontece quando alguém liga para o número?\", \"They hear your lost-pet greeting, then a caller menu with up to six contacts. They press a number to reach the person they want, and the call connects straight through.\": \"A pessoa ouve sua mensagem de pet perdido e depois um menu vocal com até seis contatos. Ela aperta um número para falar com quem quiser, e a ligação é conectada na hora.\", \"What if nobody picks up?\": \"E se ninguém atender?\", \"The caller can leave a voicemail, and you get a text and an email straight away so you can call them back.\": \"Quem ligou pode deixar um recado na caixa postal, e você recebe na hora um SMS e um e-mail para poder retornar a ligação.\", \"Can one number cover all my pets?\": \"Um número pode cobrir todos os meus pets?\", \"Yes, on the Annual plan. Every chip in your home can carry the same number. Lifetime and Parrot plans cover one enrolled pet each.\": \"Sim, no plano Anual. Todos os chips da sua casa podem ter o mesmo número. Os planos Vitalício e Papagaio cobrem um pet inscrito cada.\", \"Why 30 minutes a year, and incoming calls only?\": \"Por que 30 minutos por ano e somente chamadas recebidas?\", \"A lost-pet line gets a few short calls a year, so 30 minutes is plenty. The line only takes incoming calls and always plays your lost-pet greeting, which keeps the price low. We email you if you get close to the limit.\": \"Uma linha para pet perdido recebe poucas ligações curtas por ano, então 30 minutos são mais que suficientes. A linha só recebe chamadas e sempre toca sua mensagem de pet perdido, o que mantém o preço baixo. Enviamos um e-mail se você estiver chegando perto do limite.\", \"What happens if my Annual plan lapses?\": \"O que acontece se meu plano Anual vencer?\", \"We hold your number for 6 months. During that time, callers hear a short message that the plan has lapsed, and the call still rings your main contact. We email you before the number is released so you can renew or update your microchip registry.\": \"Reservamos seu número por 6 meses. Durante esse período, quem liga ouve uma mensagem curta informando que o plano venceu, e a ligação continua chamando seu contato principal. Enviamos um e-mail antes de liberar o número para que você possa renovar ou atualizar o cadastro do microchip.\", \"How does the Lifetime plan work?\": \"Como funciona o plano Vitalício?\", \"You pay once and the line covers one enrolled pet for its life, or 20 years from purchase, whichever comes first. Once a year we email you to check the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line.\": \"Você paga uma única vez e a linha cobre um pet inscrito pela vida dele, ou por 20 anos a partir da compra, o que ocorrer primeiro. Uma vez por ano enviamos um e-mail para confirmar que a linha ainda é necessária. Se passarem dois anos sem resposta e sem ligações, enviamos um aviso final e então encerramos a linha.\", \"What happens if my parrot outlives me?\": \"O que acontece se meu papagaio viver mais do que eu?\", \"Name a successor, like a family member or a bird rescue. If you can no longer care for your bird, the line moves to them for free, along with any prepaid time. The number on the chip and paperwork stays the same.\": \"Indique um sucessor, como um familiar ou um abrigo de aves. Se você não puder mais cuidar da sua ave, a linha passa para essa pessoa sem custo, junto com todo o tempo pré-pago. O número no chip e nos documentos continua o mesmo.\", \"Put a number on the chip that keeps up with you.\": \"Coloque no chip um número que acompanha você.\", \"Pet plans open soon. Join the launch list and we'll email you the day sign-up opens.\": \"Os planos para pets abrem em breve. Entre na lista de lançamento e enviaremos um e-mail no dia em que as inscrições abrirem.\", \"Annual or lifetime · Works with any microchip registry · 14-day service guarantee\": \"Anual ou vitalício · Funciona com qualquer cadastro de microchip · Garantia de serviço de 14 dias\", \"One lost-pet number on your pet's microchip that always reaches you, even after you move or change phones.\": \"Um número para pet perdido no microchip do seu pet que sempre chega até você, mesmo depois de uma mudança ou troca de celular.\", \"Annual\": \"Anual\"}, \"attrs\": {\"Your email address\": \"Seu endereço de e-mail\"}}, \"de\": {\"text\": {\"Why chips fail\": \"Warum Chips versagen\", \"Parrots\": \"Papageien\", \"Questions\": \"Fragen\", \"Join the launch list\": \"Auf die Startliste\", \"For dogs, cats and parrots\": \"Für Hunde, Katzen und Papageien\", \"One number on the chip.\": \"Eine Nummer auf dem Chip.\", \"It never goes out of date.\": \"Sie veraltet nie.\", \"Put your iCanCall number on your pet's microchip once. When you move or change phones, update your contacts in the dashboard. The chip keeps reaching you, and you never have to update the registry again.\": \"Hinterlegen Sie Ihre iCanCall-Nummer einmal auf dem Mikrochip Ihres Tieres. Wenn Sie umziehen oder das Handy wechseln, aktualisieren Sie Ihre Kontakte im Dashboard. Der Chip erreicht Sie weiterhin, und Sie müssen das Register nie wieder aktualisieren.\", \"Works with any microchip registry.\": \"Funktioniert mit jedem Mikrochip-Register.\", \"Keep the registry you already use. Just put your iCanCall number on file.\": \"Behalten Sie das Register, das Sie bereits nutzen. Hinterlegen Sie dort einfach Ihre iCanCall-Nummer.\", \"Max's microchip number\": \"Max' Mikrochipnummer\", \"A shelter scans Max's chip and calls. The caller menu lets them pick who to reach\": \"Ein Tierheim scannt Max' Chip und ruft an. Üb
