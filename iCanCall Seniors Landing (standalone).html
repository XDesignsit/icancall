ackground .2s; flex: none; }\n.avail .track::after { content: \"\"; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform .2s; }\n.avail.on .track { background: var(--green); }\n.avail.on .track::after { transform: translateX(16px); }\n.avail .lbl { font-size: 0.74rem; font-weight: 600; color: var(--ink-faint); width: 56px; text-align: left; }\n.avail.on .lbl { color: oklch(0.45 0.13 158); }\n.avail:disabled { opacity: 0.4; cursor: not-allowed; }\n\n.circle-empty { text-align: center; padding: 22px; color: var(--ink-faint); font-size: 0.9rem; border: 1px dashed var(--line); border-radius: var(--r-md); }\n\n.add-form { display: grid; grid-template-columns: 1.2fr 1fr auto; gap: 8px; margin-top: 16px; padding-top: 18px; border-top: 1px solid var(--line); }\n.add-form input { font-family: var(--font); font-size: 0.92rem; padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }\n.add-form input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px oklch(0.58 0.115 232 / 0.12); }\n.add-form input::placeholder { color: var(--ink-faint); }\n.add-form .add-btn { width: 44px; padding: 0; }\n.add-form .add-btn svg { width: 18px; height: 18px; }\n@media (max-width: 520px) { .add-form { grid-template-columns: 1fr 1fr; } .add-form .add-btn { grid-column: 1 / -1; width: 100%; } }\n\n/* sim phone */\n.sim-panel { padding: 26px 24px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; position: sticky; top: 92px; }\n.sim-screen {\n  width: 100%; border-radius: var(--r-lg); padding: 30px 22px 26px;\n  background: linear-gradient(165deg, var(--blue-ink), var(--blue-deep));\n  color: #fff; position: relative; overflow: hidden; min-height: 280px;\n  display: flex; flex-direction: column; align-items: center; justify-conten ckground-image: repeating-linear-gradient(135deg, oklch(0.90 0.03 220 / 0.6) 0 12px, transparent 12px 24px);\n  display: grid; place-items: center;\n}\n.usecase .ph span { font-family: var(--mono); font-size: 0.74rem; color: var(--ink-faint); background: oklch(1 0 0 / 0.7); padding: 5px 10px; border-radius: 6px; }\n.usecase .body { padding: 24px 24px 28px; }\n.usecase h3 { font-size: 1.22rem; margin-bottom: 9px; }\n.usecase p { color: var(--ink-soft); font-size: 0.96rem; }\n@media (max-width: 820px) { .usecases { grid-template-columns: 1fr; } }\n\n/* ---------- Pricing ---------- */\n.tint-band { background: linear-gradient(180deg, var(--tint), var(--bg)); }\n.pricing { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; margin: 56px auto 0; max-width: 800px; align-items: stretch; }\n.plan { display: flex; flex-direction: column; padding: 34px 30px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); position: relative; }\n.plan.featured { border-color: var(--blue); box-shadow: var(--shadow-lg); transform: scale(1.03); }\n.plan .tag { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); background: var(--blue); color: #fff; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.03em; padding: 6px 14px; border-radius: 999px; text-transform: uppercase; }\n.plan h3 { font-size: 1.3rem; margin-bottom: 4px; }\n.plan .desc { font-size: 0.9rem; color: var(--ink-faint); min-height: 40px; }\n.plan .price { display: flex; align-items: baseline; gap: 5px; margin: 18px 0 2px; }\n.plan .price b { font-size: 2.8rem; font-weight: 700; letter-spacing: -0.03em; }\n.plan .price span { color: var(--ink-faint); font-size: 0.95rem; }\n.plan .price-yr { font-size: 0.9rem; color: var(--ink-soft); margin-bottom: 4px; }\n.plan .price-yr b { color: var(--blue-deep); font-weight: 700; }\n\n.bill-toggle { display: flex; width: fit-content; gap: 4px; padding: 5px; margin: 30px auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow-sm); }\n.bill-btn { border: none; background: none; font-family: var(--font); font-size: 0.95rem; font-weight: 600; color: var(--ink-soft); padding: 10px 22px; border-radius: 999px; cursor: pointer; transition: background .2s, color .2s; display: inline-flex; align-items: center; gap: 8px; }\n.bill-btn:hover:not(.active) { color: var(--ink); }\n.bill-btn.active { background: var(--blue); color: #fff; box-shadow: 0 4px 12px oklch(0.58 0.115 232 / 0.3); }\n.bill-btn em { font-style: normal; font-size: 0.74rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: oklch(0.70 0.13 158 / 0.18); color: oklch(0.42 0.13 158); letter-spacing: 0.01em; }\n.bill-btn.active em { background: oklch(1 0 0 / 0.22); color: #fff; }\n.plan ul { list-style: none; margin: 22px 0 26px; display: flex; flex-direction: column; gap: 12px; flex: 1; }\n.plan li { display: flex; gap: 10px; font-size: 0.95rem; color: var(--ink-soft); align-items: flex-start; }\n.plan li svg { width: 19px; height: 19px; flex: none; margin-top: 1px; color: var(--teal-deep); }\n.plan .btn { width: 100%; }\n@media (max-width: 820px) { .pricing { grid-template-columns: 1fr; } .plan.featured { transform: none; } }\n\n/* ---------- Testimonials ---------- */\n.quotes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 56px; }\n.quote { padding: 28px 26px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; }\n.quote .stars { color: var(--teal-deep); letter-spacing: 3px; margin-bottom: 14px; font-size: 0.95rem; }\n.quote p { font-size: 1.04rem; color: var(--ink); line-height: 1.5; flex: 1; }\n.quote .by { display: flex; align-items: center; gap: 12px; margin-top: 22px; }\n.quote .by .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 0.85rem; }\n.quote .by b { font-size: 0.92rem; display: block; }\n.quote .by span { font-size: 0.82rem; color: var(--ink-faint); }\n@media (max-width: 820px) { .quotes { grid-template-columns: 1fr; } }\n\n/* ---------- FAQ ---------- */\n.faq { max-width: 800px; margin: 48px auto 0; }\n.faq-item { border-bottom: 1px solid var(--line); }\n.faq-q { width: 100%; text-align: left; background: none; border: none; cursor: pointer; font-family: var(--font); padding: 24px 4px; display: flex; align-items: center; justify-content: space-between; gap: 20px; font-size: 1.1rem; font-weight: 600; color: var(--ink); }\n.faq-q .pm { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--tint); display: grid; place-items: center; transition: transform .25s, background .25s; color: var(--blue-deep); font-size: 1.2rem; line-height: 1; }\n.faq-item.open .faq-q .pm { transform: rotate(45deg); background: var(--blue); color: #fff; }\n.faq-a { max-height: 0; overflow: hidden; transition: max-height .32s ease; }\n.faq-a p { padding: 0 4px 24px; color: var(--ink-soft); font-size: 1rem; max-width: 68ch; }\n\n/* ---------- Final CTA ---------- */\n.cta-band { position: relative; overflow: hidden; }\n.cta-card {\n  position: relative; border-radius: var(--r-xl); padding: clamp(48px, 7vw, 88px) clamp(28px, 5vw, 72px);\n  background: linear-gradient(150deg, var(--blue-deep), var(--blue) 55%, var(--teal-deep));\n  color: #fff; text-align: center; overflow: hidden;\n  box-shadow: var(--shadow-lg);\n}\n.cta-card::before { content: \"\"; position: absolute; inset: 0; background: radial-gradient(50% 80% at 80% 0%, oklch(1 0 0 / 0.18), transparent 60%); pointer-events: none; }\n.cta-card h2 { color: #fff; position: relative; }\n.cta-card p { color: oklch(0.95 0.02 220); font-size: 1.18rem; margin: 18px auto 32px; max-width: 50ch; position: relative; }\n.cta-card .btn-primary { background: #fff; color: var(--blue-deep); box-shadow: 0 8px 24px oklch(0.2 0.05 240 / 0.3); }\n.cta-card .btn-primary:hover { background: oklch(0.96 0.02 220); }\n.cta-card .actions { position: relative; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }\n.cta-card .fine { margin-top: 20px; font-size: 0.86rem; color: oklch(0.9 0.02 220); position: relative; }\n\n/* ---------- Footer ---------- */\n.footer { padding-block: 60px 40px; border-top: 1px solid var(--line); background: var(--surface); }\n.footer-grid { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 40px; }\n.footer .brand { margin-bottom: 16px; }\n.footer .blurb { color: var(--ink-soft); font-size: 0.92rem; max-width: 30ch; }\n.footer h5 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); margin-bottom: 16px; font-weight: 700; }\n.footer ul { list-style: none; display: flex; flex-direction: column; gap: 11px; }\n.footer a { color: var(--ink-soft); font-size: 0.94rem; transition: color .15s; }\n.footer a:hover { color: var(--blue-deep); }\n.footer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--line); font-size: 0.86rem; color: var(--ink-faint); }\n@media (max-width: 820px) { .footer-grid { grid-template-columns: 1fr 1fr; } }\n\n/* ---------- Reveal on scroll ---------- */\n.reveal { opacity: 0; transform: translateY(22px); transition: opacity .6s ease, transform .6s ease; }\n.reveal.in { opacity: 1; transform: none; }\n\n@media (prefers-reduced-motion: reduce) {\n  * { animation: none !important; transition: none !important; }\n  .reveal { opacity: 1; transform: none; }\n}\n<\u002Fstyle>\n<style>/* ===========================================================\n   iCanCall — shared audience-page components\n   Loaded by every tailored audience landing page (seniors,\n   parents, caregivers) on top of styles.css. Per-audience\n   files add their own signature sections.\n   =========================================================== */\n\n/* ---------- Hero audience badge ---------- */\n.aud-badge {\n  display: inline-flex; align-items: center; gap: 9px;\n  background: var(--surface); border: 1px solid var(--line);\n  padding: 8px 15px 8px 11px; border-radius: 999px;\n  font-size: 0.92rem; font-weight: 600; color: var(--blue-deep);\n  box-shadow: var(--shadow-sm); margin-bottom: 22px;\n}\n.aud-badge .hh {\n  width: 26px; height: 26px; border-radius: 50%; flex: none;\n  background: linear-gradient(150deg, var(--blue), var(--teal-deep));\n  display: grid; place-items: center;\n}\n.aud-badge .hh svg { width: 14px; height: 14px; }\n\n/* ---------- Reassurance callout under hero actions ---------- */\n.hero-reassure {\n  margin-top: 26px; display: flex; gap: 14px; align-items: flex-start;\n  max-width: 42ch; padding: 14px 16px; border-radius: var(--r-md);\n  background: oklch(0.70 0.13 158 / 0.10); border: 1px solid oklch(0.70 0.13 158 / 0.28);\n}\n.hero-reassure svg { width: 22px; height: 22px; flex: none; margin-top: 1px; color: oklch(0.45 0.13 158); }\n.hero-reassure p { font-size: 0.98rem; color: var(--ink-soft); }\n.hero-reassure b { color: var(--ink); }\n\n/* ---------- Single-story spotlight (replaces 3-up quotes) ---------- */\n.spotlight-card {\n  display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 0;\n  border-radius: var(--r-xl); overflow: hidden;\n  border: 1px solid var(--line); box-shadow: var(--shadow-lg); background: var(--surface);\n}\n.spotlight-quote { padding: clamp(34px, 4vw, 56px); display: flex; flex-direction: column; }\n.spotlight-quote .stars { color: var(--teal-deep); letter-spacing: 4px; font-size: 1.05rem; margin-bottom: 18px; }\n.spotlight-quote blockquote {\n  font-size: clamp(1.3rem, 2.1vw, 1.7rem); line-height: 1.4; font-weight: 600;\n  letter-spacing: -0.02em; color: var(--ink); flex: 1;\n}\n.spotlight-quote .by { display: flex; align-items: center; gap: 13px; margin-top: 28px; }\n.spotlight-quote .by .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 0.95rem; }\n.spotlight-quote .by b { font-size: 1rem; display: block; }\n.spotlight-quote .by span { font-size: 0.9rem; color: var(--ink-faint); }\n.spotlight-aside {\n  background: linear-gradient(160deg, var(--blue-deep), var(--blue) 55%, var(--teal-deep));\n  color: #fff; padding: clamp(34px, 4vw, 52px); display: flex; flex-direction: column; justify-content: center; gap: 26px;\n}\n.spotlight-aside .stat-xl b { display: block; font-size: clamp(2.4rem, 4vw, 3.4rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1; }\n.spotlight-aside .stat-xl span { font-size: 1rem; color: oklch(0.92 0.02 220); margin-top: 8px; display: block; }\n.spotlight-aside .divider { height: 1px; background: oklch(1 0 0 / 0.22); }\n@media (max-width: 820px) { .spotlight-card { grid-template-columns: 1fr; } }\n<\u002Fstyle>\n<style>/* ===========================================================\n   iCanCall — Seniors landing page\n   Layers on top of styles.css. Two jobs:\n   1) Light-touch accessibility (slightly larger type & targets)\n   2) Bespoke sections unique to this audience\n   =========================================================== */\n\n/* ---------- Light-touch accessibility ---------- */\nbody { font-size: 18.5px; }\n.lead { font-size: clamp(1.18rem, 1.7vw, 1.46rem); line-height: 1.55; }\n.nav a { font-size: 1.02rem; }\n.btn { font-size: 1.06rem; padding: 15px 28px; }\n.btn-lg { padding: 18px 38px; font-size: 1.18rem; }\n.faq-q { font-size: 1.2rem; padding-block: 26px; }\n.faq-a p { font-size: 1.08rem; }\n.feature p, .step p, .usecase p { font-size: 1.05rem; }\n.feature h3 { font-size: 1.24rem; }\n\n/* a touch more breathing room in the eyebrow for older eyes */\n.eyebrow { font-size: 0.9rem; letter-spacing: 0.05em; }\n\n/* Larger senior buttons need the header to collapse sooner than the\n   base 880px breakpoint, or the CTA row overflows the viewport. */\n@media (max-width: 1000px) {\n  .nav { display: none; }\n  .header-cta .btn-ghost { display: none; }\n}\n\n/* ---------- \"Nothing new to learn\" any-phone band ---------- */\n.noapp { padding-block: clamp(64px, 9vw, 110px); }\n.noapp-grid {\n  display: grid; grid-template-columns: 0.92fr 1.08fr;\n  gap: clamp(36px, 5vw, 72px); align-items: center;\n}\n.noapp-copy .checks { list-style: none; margin-top: 26px; display: flex; flex-direction: column; gap: 14px; }\n.noapp-copy .checks li { display: flex; gap: 13px; align-items: flex-start; font-size: 1.08rem; color: var(--ink-soft); }\n.noapp-copy .checks li b { color: var(--ink); font-weight: 600; }\n.noapp-copy .checks .ck {\n  width: 28px; height: 28px; border-radius: 50%; flex: none; margin-top: 1px;\n  background: oklch(0.70 0.13 158 / 0.16); display: grid; place-items: center;\n}\n.noapp-copy .checks .ck svg { width: 16px; height: 16px; color: oklch(0.45 0.13 158); }\n\n/* the three devices, all converging on one number */\n.devices {\n  position: relative;\n  background: var(--surface); border: 1px solid var(--line);\n  border-radius: var(--r-xl); box-shadow: var(--shadow-lg);\n  padding: clamp(24px, 3vw, 36px);\n}\n.devices-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }\n.device {\n  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px;\n  padding: 22px 12px 18px; border-radius: var(--r-lg);\n  border: 1px solid var(--line); background: var(--bg);\n}\n.device .glyph {\n  width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center;\n  background: var(--tint); color: var(--blue-deep);\n}\n.device .glyph svg { width: 30px; height: 30px; }\n.device .dname { font-weight: 600; font-size: 1.0rem; }\n.device .dtag {\n  display: inline-flex; align-items: center; gap: 6px;\n  font-size: 0.82rem; font-weight: 600; color: oklch(0.45 0.13 158);\n}\n.device .dtag svg { width: 14px; height: 14px; }\n\n.devices-link {\n  display: flex; align-items: center; justify-content: center; gap: 12px;\n  margin: 20px 0 4px; color: var(--ink-faint); font-size: 0.86rem; font-weight: 600;\n  text-transform: uppercase; letter-spacing: 0.06em;\n}\n.devices-link::before, .devices-link::after {\n  content: \"\"; height: 1px; flex: 1; background: var(--line);\n}\n.devices-one {\n  display: flex; align-items: center; gap: 14px; justify-content: center;\n  padding: 16px 20px; border-radius: var(--r-md);\n  background: linear-gradient(150deg, var(--blue-ink), var(--blue-deep)); color: #fff;\n}\n.devices-one .ring {\n  width: 44px; height: 44px; border-radius: 13px; flex: none;\n  background: oklch(1 0 0 / 0.16); display: grid; place-items: center;\n}\n.devices-one .ring svg { width: 22px; height: 22px; }\n.devices-one .num { font-weight: 700; font-size: 1.18rem; letter-spacing: -0.02em; }\n.devices-one .num small { display: block; font-size: 0.76rem; font-weight: 500; color: oklch(0.9 0.03 220); letter-spacing: 0.01em; }\n\n@media (max-width: 900px) {\n  .noapp-grid { grid-template-columns: 1fr; }\n}\n@media (max-width: 480px) {\n  .devices-row { grid-template-columns: 1fr; }\n}\n\n/* ---------- Single-story spotlight (replaces 3-up quotes) ---------- */\n/* shared component — see audience.css */\n\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- ============== HEADER ============== -->\n<header class=\"header\">\n  <div class=\"wrap header-inner\">\n    <a class=\"brand\" href=\"/\" aria-label=\"iCanCall home\">\n      <span class=\"mark\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>\n      <span>i<b>Can<\u002Fb>Call<\u002Fspan>\n    <\u002Fa>\n    <nav class=\"nav\">\n      <a href=\"#noapp\">Nothing to Learn<\u002Fa>\n      <a href=\"#how\">How it works<\u002Fa>\n      <a href=\"#build\">Build the circle<\u002Fa>\n      <a href=\"#pricing\">Pricing<\u002Fa>\n      <a href=\"#faq\">Questions<\u002Fa>\n    <\u002Fnav>\n    <div class=\"header-cta\">\n      <a class=\"btn btn-ghost\" href=\"#how\">See how it works<\u002Fa>\n      <a class=\"btn btn-primary\" href=\"#pricing\">Get started<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"top\">\n\n<!-- ============== HERO ============== -->\n<section class=\"hero\">\n  <div class=\"wrap hero-grid\">\n    <div class=\"hero-copy\">\n      <span class=\"aud-badge\">\n        <span class=\"hh\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 18a4 4 0 0 0-8 0\"><\u002Fpath><circle cx=\"12\" cy=\"9\" r=\"3.5\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n        For families with aging parents\n      <\u002Fspan>\n      <h1>Mom can always reach you.<br><span class=\"accent\">On the phone she already uses.<\u002Fspan><\u002Fh1>\n      <p class=\"lead\">Give your parent one easy number that finds the whole family for them so help is always just one call away. No apps, <strong>no new technology</strong>, nothing to figure out. You handle the setup in minutes; they simply make the call, the way they always have.<\u002Fp>\n      <div class=\"hero-actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"#pricing\">Get started<\u002Fa>\n        <a class=\"btn btn-ghost btn-lg\" href=\"#how\">How it works<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"hero-reassure\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n        <p><b>You do the setup. They do nothing new.<\u002Fb> Works on a landline, a flip phone, or a smartphone — no app, no new device.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Animated routing demo -->\n    <div class=\"demo\" id=\"demo\" aria-label=\"Live call-routing demonstration\">\n      <div class=\"demo-head\">\n        <div class=\"demo-number\">\n          <span class=\"ring\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <span class=\"num\">(415) 200-CARE<small>Mom's iCanCall number<\u002Fsmall><\u002Fspan>\n        <\u002Fdiv>\n        <span class=\"demo-status\"><span class=\"live\"><\u002Fspan><span class=\"txt\">Incoming call<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"demo-caption\">She dials one number — it finds the family in order, until someone answers<\u002Fp>\n      <div class=\"chain\">\n        <div class=\"contact\">\n          <span class=\"order\">1<\u002Fspan>\n          <span class=\"avatar\" style=\"background:oklch(0.58 0.115 232)\">SR<\u002Fspan>\n          <span class=\"who\"><b>Sarah R.<\u002Fb><span>Daughter<\u002Fspan><\u002Fspan>\n          <span class=\"state\">Standing by<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"contact\">\n          <span class=\"order\">2<\u002Fspan>\n          <span class=\"avatar\" style=\"background:oklch(0.62 0.10 198)\">DM<\u002Fspan>\n          <span class=\"who\"><b>David M.<\u002Fb><span>Son<\u002Fspan><\u002Fspan>\n          <span class=\"state\">Standing by<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"contact\">\n          <span class=\"order\">3<\u002Fspan>\n          <span class=\"avatar\" style=\"background:oklch(0.55 0.11 280)\">LN<\u002Fspan>\n          <span class=\"who\"><b>Lena N.<\u002Fb><span>Neighbor<\u002Fspan><\u002Fspan>\n          <span class=\"state\">Standing by<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"contact\">\n          <span class=\"order\">4<\u002Fspan>\n          <span class=\"avatar\" style=\"background:oklch(0.6 0.12 30)\">DR<\u002Fspan>\n          <span class=\"who\"><b>Dr. Patel<\u002Fb><span>Care team<\u002Fspan><\u002Fspan>\n          <span class=\"state\">Standing by<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== NOTHING TO LEARN (any phone) ============== -->\n<section class=\"section noapp tint-band\" id=\"noapp\">\n  <div class=\"wrap noapp-grid\">\n    <div class=\"noapp-copy reveal\">\n      <span class=\"eyebrow\">No app · No new device<\u002Fspan>\n      <h2>Nothing new for them to learn.<\u002Fh2>\n      <p class=\"lead\">The hardest part of most \"safety\" gadgets is getting an older parent to use them. iCanCall asks nothing of them. It lives on the phone that's already by their chair — so making a call feels exactly like it always has.<\u002Fp>\n      <ul class=\"checks\">\n        <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span><b>No app to download<\u002Fb> and no account for them to manage.<\u002Fspan><\u002Fli>\n        <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span><b>No new gadget<\u002Fb> to charge, wear, or learn to operate.<\u002Fspan><\u002Fli>\n        <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan><span><b>One number to remember<\u002Fb> — write it once on the fridge.<\u002Fspan><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div class=\"devices reveal\">\n      <div class=\"devices-row\">\n        <div class=\"device\">\n          <span class=\"glyph\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M7 11V8a5 5 0 0 1 10 0v3\"><\u002Fpath><path d=\"M7 16h.01M12 16h.01M17 16h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span class=\"dname\">Landline<\u002Fspan>\n          <span class=\"dtag\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg> Works<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"device\">\n          <span class=\"glyph\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"2\" width=\"12\" height=\"20\" rx=\"2\"><\u002Frect><rect x=\"8.5\" y=\"4.5\" width=\"7\" height=\"5\" rx=\"1\"><\u002Frect><path d=\"M9 13h.01M12 13h.01M15 13h.01M9 16h.01M12 16h.01M15 16h.01M9 19h.01M12 19h.01M15 19h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span class=\"dname\">Flip phone<\u002Fspan>\n          <span class=\"dtag\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg> Works<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"device\">\n          <span class=\"glyph\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"2\" width=\"12\" height=\"20\" rx=\"3\"><\u002Frect><path d=\"M11 18.5h2\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span class=\"dname\">Smartphone<\u002Fspan>\n          <span class=\"dtag\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg> Works<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"devices-link\">all dial the same number<\u002Fdiv>\n      <div class=\"devices-one\">\n        <span class=\"ring\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"num\">(415) 200-CARE<small>One number · always answered<\u002Fsmall><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== HOW IT WORKS ============== -->\n<section class=\"section\" id=\"how\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">How it works<\u002Fspan>\n      <h2>You set it up. They just answer.<\u002Fh2>\n      <p class=\"lead\">Three quiet steps, all on your side. Your parent never has to do a thing differently.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"steps\">\n      <div class=\"step reveal\">\n        <div class=\"idx\">1<\u002Fdiv>\n        <h3>Claim their number<\u002Fh3>\n        <p>Pick one easy-to-remember iCanCall number for Mom or Dad. Write it on the fridge, program it as a speed-dial, or save it as \"Family.\" That's the only number they'll ever need.<\u002Fp>\n        <svg class=\"step-arrow\" width=\"60\" height=\"24\" viewBox=\"0 0 60 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M0 12h54m0 0-7-7m7 7-7 7\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"step reveal\">\n        <div class=\"idx\">2<\u002Fdiv>\n        <h3>Add the family circle<\u002Fh3>\n        <p>Put yourself, your siblings, a trusted neighbor, and the care team in order — up to six people. You manage it all from your phone; nothing is installed on theirs.<\u002Fp>\n        <svg class=\"step-arrow\" width=\"60\" height=\"24\" viewBox=\"0 0 60 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M0 12h54m0 0-7-7m7 7-7 7\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"step reveal\">\n        <div class=\"idx\">3<\u002Fdiv>\n        <h3>They dial like always<\u002Fh3>\n        <p>When they call that one number, iCanCall <b>cascades<\u002Fb> through the circle until someone answers — and everyone gets a text that the call came in. No menus to navigate unless you want them.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== INTERACTIVE BUILDER ============== -->\n<section class=\"section tint-band\" id=\"build\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Try it yourself<\u002Fspan>\n      <h2>Build the circle that answers for Mom.<\u002Fh2>\n      <p class=\"lead\">Add the people you trust, set their order, then place a pretend call. Choose <b>cascade<\u002Fb> — ring everyone in turn until someone picks up — or a simple <b>caller menu<\u002Fb>. You control all of this; your parent only ever dials one number.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"mode-toggle reveal\">\n      <span class=\"mode-label\">Routing mode<\u002Fspan>\n      <div class=\"seg\" role=\"tablist\" aria-label=\"Routing mode\">\n        <button class=\"seg-btn active\" type=\"button\" data-mode=\"cascade\" role=\"tab\">Call cascade<\u002Fbutton>\n        <button class=\"seg-btn\" type=\"button\" data-mode=\"menu\" role=\"tab\">Caller menu<\u002Fbutton>\n      <\u002Fdiv>\n      <span class=\"mode-note\">\n        <svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg>\n        You set this once in the dashboard\n      <\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"builder reveal\">\n      <!-- editor -->\n      <div class=\"builder-panel\">\n        <div class=\"builder-head\">\n          <h3>Mom's circle<\u002Fh3>\n          <span class=\"count\"><span id=\"ccount\">0<\u002Fspan>/6 contacts<\u002Fspan>\n        <\u002Fdiv>\n        <div id=\"circle-list\" class=\"circle-list\"><\u002Fdiv>\n        <form id=\"add-form\" class=\"add-form\" autocomplete=\"off\">\n          <input id=\"add-name\" type=\"text\" placeholder=\"Name\" maxlength=\"22\" required=\"\">\n          <input id=\"add-rel\" type=\"text\" placeholder=\"Relationship\" maxlength=\"22\">\n          <button class=\"btn btn-primary add-btn\" type=\"submit\" aria-label=\"Add contact\" title=\"Add contact\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fform>\n      <\u002Fdiv>\n      <!-- simulator -->\n      <div class=\"sim-panel\">\n        <div class=\"sim-screen\" id=\"sim-screen\">\n          <span class=\"num-line\">(415) 200-CARE<\u002Fspan>\n          <div class=\"sim-avatar\" id=\"sim-avatar\">—<\u002Fdiv>\n          <div class=\"sim-name\" id=\"sim-name\">Ready<\u002Fdiv>\n          <div class=\"sim-state\" id=\"sim-state\">Press call to start routing<\u002Fdiv>\n          <div class=\"sim-dots\" id=\"sim-dots\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button class=\"btn btn-primary\" id=\"place-call\">\n          <svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\u002Fpath><\u002Fsvg>\n          Place a call\n        <\u002Fbutton>\n        <p class=\"sim-hint\">Toggle contacts to \"Busy\" to see the cascade skip ahead.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== FEATURES ============== -->\n<section class=\"section\" id=\"features\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Why families choose iCanCall<\u002Fspan>\n      <h2>Made for the call that<br>can't go unanswered.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"features\">\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v4a2 2 0 0 1-2.2 2A16 16 0 0 1 3 6.2 2 2 0 0 1 5 4Z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Works on any phone<\u002Fh3>\n        <p>Landline, flip phone, or smartphone — it all works. No app to install and no new device to learn. The phone they have today is all they need.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 18a4 4 0 0 0-8 0\"><\u002Fpath><circle cx=\"12\" cy=\"9\" r=\"3.5\"><\u002Fcircle><path d=\"M5 20a7 7 0 0 1 14 0\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>The whole family, in order<\u002Fh3>\n        <p>One call reaches up to six people — you, your siblings, a neighbor, the doctor — in the order you choose, until someone picks up.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16v11H7l-3 3V5Z\"><\u002Fpath><path d=\"M8 9h8M8 12h5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Everyone gets a text<\u002Fh3>\n        <p>The moment Mom or Dad calls, every contact gets a message. So even if you're in a meeting, you know the second they reached out.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Different rules by time of day<\u002Fh3>\n        <p>Reach the night caregiver after hours and the family during the day — automatically. Help is always the right person for the moment.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Never a dead end<\u002Fh3>\n        <p>If the whole circle is unreachable, the call goes to voicemail that's transcribed and texted to everyone — so no cry for help is ever missed.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"11\" rx=\"2\"><\u002Frect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Private &amp; protected<\u002Fh3>\n        <p>Everyone's personal numbers stay hidden behind the single iCanCall line. All routing is encrypted, and your family's data is never sold.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ====== lass=\"faq-a\"><p>Not at all. iCanCall works on whatever phone they already use — a landline, a basic flip phone, or a smartphone. There's no app to install and no new device to buy or charge. They simply dial one number, exactly the way they make any other call.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Will it work with their landline?<span class=\"pm\">+<\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><p>Yes. The single iCanCall number can be dialed from any phone, landline included. Many families program it as a one-touch speed dial or write it on a card by the phone, so reaching the whole family is as easy as it gets.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Do they have to learn anything new?<span class=\"pm\">+<\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><p>No. That's the point. Everything — adding contacts, setting the order, choosing how calls route — is managed by you from your own phone. Your parent never installs anything or changes how they make a call. To them, it's just one easy number that always reaches someone.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">What happens if nobody answers?<span class=\"pm\">+<\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><p>iCanCall rings each contact in your chosen order until someone picks up. If the whole circle is unreachable, the call goes to voicemail that's instantly transcribed and texted to every contact — so no message, and no moment that matters, is ever lost.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Can I set it up and manage it for them?<span class=\"pm\">+<\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><p>Absolutely — most families do. You claim the number, add the circle, and adjust the order anytime from your dashboard. Changes take effect on the very next call, and your parent doesn't have to lift a finger.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Is my family's information private?<span class=\"pm\">+<\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><p>Always. Everyone's personal numbers stay hidden behind your single iCanCall line, all routing is encrypted, and we never sell your data.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== FINAL CTA ============== -->\n<section class=\"section cta-band\" id=\"cta\">\n  <div class=\"wrap\">\n    <div class=\"cta-card reveal\">\n      <h2>Set it up today. Rest easier tonight.<\u002Fh2>\n      <p>In a few minutes, your parent will have one number that always finds the family — on the phone they already know how to use. No app, no new device, nothing for them to learn.<\u002Fp>\n      <div class=\"actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"#pricing\">Get started<\u002Fa>\n        <a class=\"btn btn-ghost btn-lg\" href=\"#how\" style=\"color:#fff;border-color:oklch(1 0 0 / 0.5)\">See how it works<\u002Fa>\n      <\u002Fdiv>\n      <p class=\"fine\">Set up in minutes · No setup fees · Cancel anytime<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<!-- ============== FOOTER ============== -->\n<footer class=\"footer\">\n  <div class=\"wrap\">\n    <div class=\"footer-grid\">\n      <div>\n        <a class=\"brand\" href=\"/\">\n          <span class=\"mark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span>i<b>Can<\u002Fb>Call<\u002Fspan>\n        <\u002Fa>\n        <p class=\"blurb\">One memorable number that always
