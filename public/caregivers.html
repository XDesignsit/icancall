\": \"순차 통화 라우팅 (캐스케이드)\",\n      \"Real-time Email Alerts\": \"실시간 이메일 알림\",\n      \"Standard voicemail box\": \"기본 음성사서함\",\n      \"30-day money-back guarantee\": \"30일 환불 보장\",\n      \"2 Dedicated Safety Numbers\": \"전용 가상 안심 번호 2개\",\n      \"Up to 6 Roster Contacts\": \"연결 연락처 최대 6명\",\n      \"Cascade & Caller Menu (IVR)\": \"순차 통화 및 선택 다이얼 메뉴 (IVR)\",\n      \"Time-of-day Scheduling\": \"시간대별 스케줄 설정\",\n      \"Bilingual Greeting Options\": \"다국어 인사 안내 멘트 기능\",\n      \"Instant Voicemail Email Transcriptions\": \"음성사서함 즉시 텍스트 변환 메일 발송\",\n      \"5 Dedicated Safety Numbers\": \"전용 가상 안심 번호 5개\",\n      \"Up to 15 Roster Contacts per Number\": \"번호당 연결 연락처 최대 15명\",\n      \"All Routing Modes + Scheduling\": \"모든 라우팅 방식 + 스케줄 설정\",\n      \"150 pooled voice minutes\": \"공용 통화 150분 제공\",\n      \"2 Caregiver Logins\": \"보호자 로그인 계정 2개\",\n      \"All plans include cascade routing, the caller menu, and 24\/7 reliability. Set it up for your parent in minutes — cancel anytime.\": \"모든 플랜에 순차 통화 라우팅, 선택 다이얼 메뉴, 24시간 안정 서비스가 포함됩니다. 부모님을 위한 설정은 몇 분이면 끝나고, 언제든 해지할 수 있습니다.\",\n      \"All plans include cascade routing, the caller menu, and 24\/7 reliability. Set it up in minutes — cancel anytime.\": \"모든 플랜에 순차 통화 라우팅, 선택 다이얼 메뉴, 24시간 안정 서비스가 포함됩니다. 설정은 몇 분이면 끝나고, 언제든 해지할 수 있습니다.\",\n      \"All plans include cascade routing, the caller menu, time-aware coverage, and 24\/7 reliability. Cancel anytime.\": \"모든 플랜에 순차 통화 라우팅, 선택 다이얼 메뉴, 시간대별 커버리지, 24시간 안정 서비스가 포함됩니다. 언제든 해지할 수 있습니다.\",\n      \"Designed for the moments that matter\": \"안심 통화가 필요한 소중한 일상들\",\n      \"iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.\": \"iCanCall은 스마트폰 중독과 복잡한 기기 조작을 원치 않으면서 긴급 안심망이 필요한 가정을 위한 맞춤형 서비스입니다.\",\n      \"For Kids\": \"아이들을 위한 안심 통화\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"스마트폰의 유해성이나 눈부심 노출 없이, 집전화나 구형 폴더폰으로 가족들과 즉시 안전하게 통화할 수 있습니다.\",\n      \"For Seniors\": \"부모님을 위한 효도 연락망\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"복잡한 기기나 연락처 검색이 어려운 고령의 부모님용 서비스. 한 번의 다이얼로 온 가족 연결망을 가동시킵니다.\",\n      \"For Special Needs\": \"돌봄 및 특별 케어 대상자\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"인지장애나 신체적 제약이 있으신 분들이 복잡한 번호를 외우지 않고도 즉각적이고 정확하게 지원 그룹의 도움을 받도록 돕습니다.\",\n      \"Coverage\": \"커버리지\",\n      \"Build the circle\": \"서클 만들기\",\n      \"Questions\": \"자주 묻는 질문\",\n      \"For families & caregivers of loved ones with special abilities\": \"특별한 돌봄이 필요한 가족과 그 보호자를 위해\",\n      \"One press.\": \"한 번만 누르면.\",\n      \"The right caregiver, every time.\": \"언제나 꼭 맞는 보호자에게.\",\n      \"For a loved one who can't work through a contact list, a single number — or one speed-dial button — connects them to exactly the right person on your care team. You decide who answers and when. They just press call.\": \"연락처 목록을 다루기 어려운 사랑하는 가족도 번호 하나 — 또는 단축 버튼 하나 — 로 케어 팀의 꼭 맞는 사람과 연결됩니다. 누가, 언제 받을지는 여러분이 정합니다. 그분은 통화 버튼만 누르면 됩니다.\",\n      \"No list to navigate. No decision to make.\": \"찾아볼 목록도, 내려야 할 결정도 없습니다.\",\n      \"One press reaches a real person who knows them — and your whole care team is alerted the moment they call.\": \"한 번만 누르면 자신을 잘 아는 실제 사람과 연결되고 — 전화를 거는 순간 케어 팀 전체에 알림이 갑니다.\",\n      \"Daniel's iCanCall number\": \"Daniel의 iCanCall 번호\",\n      \"Incoming call\": \"수신 전화\",\n      \"One press finds the right caregiver, in order, until someone who knows him answers\": \"한 번만 누르면 — 그를 아는 누군가가 받을 때까지 알맞은 보호자를 순서대로 찾아 줍니다\",\n      \"Mom · primary caregiver\": \"엄마 · 주 보호자\",\n      \"Standing by\": \"대기 중\",\n      \"Co-caregiver\": \"공동 보호자\",\n      \"Day program\": \"주간 프로그램\",\n      \"Nurse Dawn\": \"Dawn 간호사\",\n      \"On-call\": \"당직\",\n      \"Independence for them, reassurance for you\": \"그분에게는 자립을, 여러분에게는 안심을\",\n      \"press to reach help\": \"번 누르면 도움 연결\",\n      \"lists to navigate\": \"찾아볼 연락처 목록\",\n      \"caregiver coverage\": \"보호자 커버리지\",\n      \"Whole\": \"전체\",\n      \"care team alerted\": \"케어 팀에 알림\",\n      \"Around-the-clock coverage\": \"24시간 빈틈없는 커버리지\",\n      \"Someone is always responsible.\": \"언제나 누군가 책임지고 있습니다.\",\n      \"The number never changes — but who answers it does. iCanCall routes the same call to the right caregiver for the time of day, so coverage hands off cleanly and there's never a gap.\": \"번호는 절대 바뀌지 않습니다 — 바뀌는 것은 전화를 받는 사람입니다. iCanCall은 같은 전화를 시간대에 맞는 보호자에게 연결해, 돌봄이 매끄럽게 인계되고 공백이 생기지 않습니다.\",\n      \"Daniel's number — one number, all day\": \"Daniel의 번호 — 하나의 번호로 하루 종일\",\n      \"Right now:\": \"지금:\",\n      \"On-call · overnight\": \"당직 · 야간\",\n      \"Weekday day program\": \"평일 주간 프로그램\",\n      \"Maria (Mom)\": \"Maria (엄마)\",\n      \"Primary caregiver\": \"주 보호자\",\n      \"Evening\": \"저녁\",\n      \"12a\": \"0시\",\n      \"6a\": \"6시\",\n      \"12p\": \"12시\",\n      \"6p\": \"18시\",\n      \"· primary, afternoons\": \"· 주 보호자, 오후\",\n      \"· evenings\": \"· 저녁\",\n      \"· weekdays\": \"· 평일\",\n      \"· overnight on-call\": \"· 야간 당직\",\n      \"If the assigned caregiver can't pick up, the call cascades to the next person in the circle — so a call is never left unanswered, at any hour.\": \"담당 보호자가 받지 못하면 전화는 서클의 다음 사람에게 순차 연결됩니다 — 어느 시간에도 전화가 받지 않은 채 남는 일은 없습니다.\",\n      \"You build the care team.\": \"케어 팀은 여러분이 구성하세요.\",\n      \"They press one button.\": \"사랑하는 가족은 버튼 하나만 누르면 됩니다.\",\n      \"All of the complexity lives with you, in the dashboard. For your loved one, it stays as simple as a single call.\": \"복잡한 것은 모두 대시보드 안에서 여러분이 맡습니다. 사랑하는 가족에게는 전화 한 통처럼 단순하게 유지됩니다.\",\n      \"Claim one number\": \"번호 하나 확보하기\",\n      \"Pick a single iCanCall number and set it as a speed-dial or a one-touch button on whatever device they use — a phone, a tablet, or an adaptive caller. That one button is all they ever need.\": \"iCanCall 번호를 하나 골라 휴대폰, 태블릿, 보조 통화 기기 등 그분이 쓰는 기기에 단축번호나 원터치 버튼으로 설정하세요. 필요한 것은 그 버튼 하나뿐입니다.\",\n      \"Build the care team\": \"케어 팀 구성하기\",\n      \"Add up to six caregivers — family, co-caregivers, a day program, a group home, an on-call nurse — and set who should answer, and when, across the day.\": \"가족, 공동 보호자, 주간 프로그램, 그룹홈, 당직 간호사 등 최대 6명의 보호자를 추가하고 — 하루 중 누가, 언제 받을지 정하세요.\",\n      \"They reach the right person\": \"꼭 맞는 사람에게 연결\",\n      \"When they press call, iCanCall routes to the right caregiver for that moment and\": \"통화 버튼을 누르면 iCanCall이 그 시간대에 맞는 보호자에게 연결하고, 필요하면\",\n      \"cascades\": \"순차 통화로\",\n      \"on if needed — while every caregiver gets an instant text that the call came in.\": \"다음 사람에게 넘깁니다 — 동시에 모든 보호자에게 전화가 왔다는 문자가 즉시 전송됩니다.\",\n      \"Try it yourself\": \"직접 체험해 보세요\",\n      \"Build the care team that answers.\": \"전화를 받아 줄 케어 팀을 만들어 보세요.\",\n      \"Add the caregivers you trust, set their order, then place a pretend call. Choose\": \"믿을 수 있는 보호자들을 추가하고 순서를 정한 다음, 가상 통화를 걸어 보세요. 라우팅 방식은\",\n      \"cascade\": \"순차 통화\",\n      \"— ring each caregiver in turn until someone picks up — or a simple\": \"— 누군가 받을 때까지 보호자에게 차례로 전화를 거는 방식 — 또는 간단한\",\n      \"caller menu\": \"선택 다이얼 메뉴\",\n      \". Your loved one only ever makes one call.\": \"중에서 고르면 됩니다. 사랑하는 가족은 언제나 전화 한 통만 걸면 됩니다.\",\n      \"Routing mode\": \"라우팅 방식\",\n      \"Call cascade\": \"순차 통화\",\n      \"Caller menu\": \"선택 다이얼 메뉴\",\n      \"You set this once in the dashboard\": \"대시보드에서 한 번만 설정하면 됩니다\",\n      \"The care team\": \"케어 팀\",\n      \"\/6 contacts\": \"\/6 연락처\",\n      \"Ready\": \"준비 완료\",\n      \"Press call to start routing\": \"통화 버튼을 눌러 라우팅을 시작하세요\",\n      \"Place a call\": \"전화 걸기\",\n      \"Toggle a caregiver to \\\"Busy\\\" to see the cascade skip ahead.\": \"보호자를 \\\"통화 중\\\"으로 바꿔서 순차 통화가 다음 사람으로 넘어가는 모습을 확인해 보세요.\",\n      \"Why caregivers choose iCanCall\": \"보호자들이 iCanCall을 선택하는 이유\",\n      \"Simple for them.\": \"그분에게는 단순하게.\",\n      \"Complete for you.\": \"여러분에게는 빈틈없이.\",\n      \"One press, one action\": \"한 번 누르면, 그걸로 끝\",\n      \"No contact list, no menus, no choosing. A single number or button is the entire interaction — designed for those a list would only overwhelm.\": \"연락처 목록도, 메뉴도, 선택도 없습니다. 번호 하나 또는 버튼 하나가 조작의 전부입니다 — 목록이 오히려 부담이 되는 분들을 위해 설계했습니다.\",\n      \"Always the right caregiver\": \"언제나 꼭 맞는 보호자\",\n      \"Time-aware routing sends the call to whoever's on for that part of the day — primary caregiver, day program, evening, or overnight on-call.\": \"시간대 인식 라우팅이 그 시간의 담당자에게 전화를 보냅니다 — 주 보호자, 주간 프로그램, 저녁 담당, 야간 당직까지.\",\n      \"Whole team alerted\": \"팀 전체에 알림\",\n      \"Every caregiver gets a text the instant a call comes in — vital when a loved one may not be able to explain where they are or what they need.\": \"전화가 오는 즉시 모든 보호자에게 문자가 전송됩니다 — 사랑하는 가족이 자신이 어디 있는지, 무엇이 필요한지 설명하기 어려울 때 특히 중요합니다.\",\n      \"No gaps at handoff\": \"인계 시에도 공백 없이\",\n      \"Coverage passes cleanly from one caregiver to the next. If the assigned person can't answer, the call cascades onward — never a dead end.\": \"돌봄은 한 보호자에서 다음 보호자로 매끄럽게 넘어갑니다. 담당자가 받지 못하면 전화는 다음 사람에게 순차 연결됩니다 — 막다른 길은 없습니다.\",\n      \"Works with their setup\": \"지금 쓰는 기기 그대로\",\n      \"Program it on a phone, a tablet, an adaptive caller, or a single speed-dial button. No app to install and nothing new to learn.\": \"휴대폰, 태블릿, 보조 통화 기기, 또는 단축 버튼 하나에 등록하세요. 설치할 앱도, 새로 배울 것도 없습니다.\",\n      \"Private & protected\": \"안전한 개인정보 보호\",\n      \"Every caregiver's personal number stays hidden behind the single iCanCall line. All routing is encrypted, and your data is never sold.\": \"모든 보호자의 개인 번호는 하나의 iCanCall 번호 뒤에 숨겨집니다. 모든 라우팅은 암호화되며, 데이터는 절대 판매되지 않습니다.\",\n      \"Simple, honest pricing\": \"단순하고 정직한 요금\",\n      \"Coverage that costs less\": \"병원 본인부담금 한 번보다\",\n      \"than a single co-pay.\": \"저렴한 돌봄 커버리지.\",\n      \"\/ month\": \"\/ 월\",\n      \"What caregivers ask us most.\": \"보호자들이 가장 많이 묻는 질문.\",\n      \"My loved one is non-verbal or can't explain where they are. Does this still help?\": \"저희 가족은 말을 하지 못하거나 자신이 어디 있는지 설명하지 못합니다. 그래도 도움이 되나요?\",\n      \"Yes — that's exactly who it's built for. They don't need to choose a contact or say anything in particular. One press connects them to a caregiver who knows them, and every caregiver in the circle gets an instant text that the call came in, so the right people are aware right away.\": \"네 — 바로 그런 분들을 위해 만들었습니다. 연락처를 고르거나 특별히 무언가를 말할 필요가 없습니다. 한 번 누르면 자신을 아는 보호자와 연결되고, 서클의 모든 보호자에게 전화가 왔다는 문자가 즉시 전송되어 필요한 사람들이 바로 상황을 알게 됩니다.\",\n      \"Can it work as a single speed-dial button or with an adaptive device?\": \"단축 버튼 하나로, 또는 보조 기기와 함께 쓸 수 있나요?\",\n      \"Absolutely. Because iCanCall is just one phone number, you can program it as a one-touch speed dial, a favorite, or a single button on whatever phone, tablet, or adaptive caller they already use. There's no app to install and nothing new for them to learn.\": \"물론입니다. iCanCall은 그저 전화번호 하나이므로, 이미 쓰고 있는 휴대폰, 태블릿, 보조 통화 기기에 원터치 단축번호, 즐겨찾기, 또는 버튼 하나로 등록할 수 있습니다. 설치할 앱도, 새로 배울 것도 없습니다.\",\n      \"How do multiple caregivers and shift changes work?\": \"보호자가 여러 명이고 교대가 있을 때는 어떻게 되나요?\",\n      \"From your dashboard, you set who should answer at different times of day — a day program on weekday mornings, a primary caregiver in the afternoon, an evening caregiver, an overnight on-call nurse. The same number routes to whoever's on for that window, so coverage hands off without a gap.\": \"대시보드에서 시간대별로 누가 받을지 정합니다 — 평일 오전에는 주간 프로그램, 오후에는 주 보호자, 저녁 담당 보호자, 야간 당직 간호사처럼요. 같은 번호가 그 시간대의 담당자에게 연결되므로 돌봄이 공백 없이 인계됩니다.\",\n      \"What if the assigned caregiver can't pick up?\": \"담당 보호자가 전화를 못 받으면 어떻게 되나요?\",\n      \"The call cascades to the next person in the circle until someone answers. If everyone is unreachable, it goes to voicemail that's transcribed and texted to the whole team — so a call is never simply lost.\": \"누군가 받을 때까지 전화는 서클의 다음 사람에게 순차 연결됩니다. 아무와도 연결되지 않으면 음성사서함으로 넘어가고, 그 내용은 텍스트로 변환되어 팀 전체에 문자로 전송됩니다 — 전화가 그냥 사라지는 일은 없습니다.\",\n      \"Can a group home or day program be part of the circle?\": \"그룹홈이나 주간 프로그램도 서클에 넣을 수 있나요?\",\n      \"Yes. Any phone number can be a contact — a group home line, a day program, a case manager, a nurse, or family. You decide the order and the times, and adjust anytime as the care plan changes.\": \"네. 어떤 전화번호든 연락처가 될 수 있습니다 — 그룹홈 대표번호, 주간 프로그램, 사례 관리자, 간호사, 가족 모두요. 순서와 시간은 여러분이 정하고, 돌봄 계획이 바뀌면 언제든 조정할 수 있습니다.\",\n      \"Is iCanCall a medical alert or emergency service?\": \"iCanCall은 의료 경보 또는 응급 서비스인가요?\",\n      \"No — iCanCall connects your loved one to the people on their care team quickly and simply. It complements, but does not replace, 911 or a medical-monitoring service. For life-threatening emergencies, always teach and rely on 911 where possible.\": \"아니요 — iCanCall은 사랑하는 가족을 케어 팀 사람들과 빠르고 간단하게 연결해 줍니다. 911이나 의료 모니터링 서비스를 보완할 뿐, 대체하지는 않습니다. 생명이 위급한 응급 상황에는 가능한 한 911에 전화하도록 늘 가르치고, 911을 이용하세요.\",\n      \"One number. The right person. Every time.\": \"하나의 번호. 꼭 맞는 사람. 언제나.\",\n      \"Give your loved one the independence of reaching help on their own — and give your care team the certainty of always being there. Set up iCanCall in minutes.\": \"사랑하는 가족에게는 스스로 도움을 청할 수 있는 자립을, 케어 팀에게는 언제나 곁에 있다는 확신을 선물하세요. iCanCall 설정은 몇 분이면 끝납니다.\",\n      \"One memorable number — or one button — that always connects your loved one to the right caregiver, while keeping the whole team in the loop.\": \"사랑하는 가족을 꼭 맞는 보호자와 언제든 연결하고 팀 전체에 상황을 공유해 주는 기억하기 쉬운 하나의 번호 — 또는 버튼 하나.\",\n      \"For every family\": \"모든 가족을 위해\"\n    },\n    \"attrs\": {\n      \"Name\": \"이름\",\n      \"Relationship\": \"관계\",\n      \"Role\": \"역할\"\n    }\n  }\n};\n\n     function translateDOM(node, dict, keepSpace) {\n       if (node.nodeType === Node.TEXT_NODE) {\n         const text = node.nodeValue.trim();\n         if (dict[text]) {\n           \/\/ Keep the spaces around inline fragments (bold words, links) so the\n           \/\/ pieces of a sentence don't run together. Chinese and Japanese don't\n           \/\/ put spaces between words.\n           const lead = keepSpace ? node.nodeValue.match(\/^\\s*\/)[0] : '';\n           const trail = keepSpace ? node.nodeValue.match(\/\\s*$\/)[0] : '';\n           node.nodeValue = lead + dict[text] + trail;\n         }\n       } else if (node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {\n         node.childNodes.forEach(child => translateDOM(child, dict, keepSpace));\n       }\n     }\n\n     function translatePage(lang) {\n       \/\/ Support RTL for Arabic\n       document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';\n\n       const dict = DICT_MAP[lang];\n       if (dict) {\n         translateDOM(document.body, dict.text, lang !== 'ja' && lang !== 'zh');\n         \n         document.querySelectorAll('[placeholder]').forEach(el => {\n           const p = el.getAttribute('placeholder').trim();\n           if (dict.attrs[p]) el.setAttribute('placeholder', dict.attrs[p]);\n         });\n         \n         document.querySelectorAll('.avail .lbl').forEach(el => {\n           const availMap = {\n             'es': { 'Available': 'Disponible', 'Busy': 'Ocupado' },\n             'fr': { 'Available': 'Disponible', 'Busy': 'Occupé' },\n             'ja': { 'Available': '対応可能', 'Busy': '忙しい' },\n             'zh': { 'Available': '在线可用', 'Busy': '忙碌' },\n             'ar': { 'Available': 'متاح', 'Busy': 'مشغول' },\n             'hi': { 'Available': 'उपलब्ध', 'Busy': 'व्यस्त' },\n             'pt': { 'Available': 'Disponível', 'Busy': 'Ocupado' },\n             'de': { 'Available': 'Verfügbar', 'Busy': 'Besetzt' },\n             'it': { 'Available': 'Disponibile', 'Busy': 'Occupato' },\n             'ko': { 'Available': '통화 가능', 'Busy': '바쁨' }\n           };\n           const m = availMap[lang];\n           if (m) {\n             if (el.textContent.trim() === 'Available') el.textContent = m['Available'];\n             if (el.textContent.trim() === 'Busy') el.textContent = m['Busy'];\n           }\n         });\n         \n         document.querySelectorAll('.sim-hint').forEach(el => {\n           const hintMap = {\n             'es': 'Desactive contactos a «Ocupado» para ver cómo salta la cascada.',\n             'fr': \"Désactivez des contacts sur « Occupé » pour voir l'appel sauter au suivant.\",\n             'ja': '連絡先を「忙しい」に切り替えて、カスケード転送が次へ進む様子を確認できます。',\n             'zh': '将联系人切换为“忙碌”状态，查看顺次呼叫如何自动跳过并呼叫下一位。',\n             'ar': 'قم بتحويل جهات الاتصال إلى ' + \"'مشغول'\" + ' لرؤية الرنين المتتالي يتجاوزهم إلى التالي.',\n             'hi': 'कैस्केड को आगे बढ़ते देखने के लिए सदस्यों को “व्यस्त” पर टॉगल करें।',\n             'pt': 'Mude contatos para “Ocupado” para ver a chamada saltar para o próximo.',\n             'de': 'Schalten Sie Kontakte auf „Besetzt“, um zu sehen wie der Anruf zum nächsten springt.',\n             'it': 'Imposta i contati su “Occupato” per vedere la chiamata passare al successivo.',\n             'ko': '연락처를 “통화 중”으로 토글하여 순차 통화가 다음 보호자로 넘어가는 것을 확인하세요.'\n           };\n           if (hintMap[lang] && el.textContent.includes('Toggle contacts')) {\n             el.textContent = hintMap[lang];\n           }\n         });\n       } else {\n         window.location.reload();\n       }\n     }\n\n     \/\/ The dictionaries are keyed by the English text, so a page that is already\n     \/\/ translated has to reload before it can switch to another language.\n     function switchLanguage(prev, next) {\n       if (prev !== 'en') window.location.reload();\n       else translatePage(next);\n     }\n\n     function initLangSelect() {\n       const select = document.getElementById('langSelect');\n       if (select) {\n         const saved = localStorage.getItem('lang') || 'en';\n         select.value = saved;\n         if (saved !== 'en') translatePage(saved);\n         \n         select.addEventListener('change', (e) => {\n           const prev = localStorage.getItem('lang') || 'en';\n           localStorage.setItem('lang', e.target.value);\n           window.dispatchEvent(new Event('storage'));\n           switchLanguage(prev, e.target.value);\n         });\n       }\n     }\n\n     \/\/ This script runs after the bundle unpacks, when DOMContentLoaded has\n     \/\/ usually already fired.\n     if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initLangSelect);\n     else initLangSelect();\n\n     window.addEventListener('storage', () => {\n       const select = document.getElementById('langSelect');\n       if (select) {\n         const active = localStorage.getItem('lang') || 'en';\n         if (select.value !== active) {\n           const prev = select.value;\n           select.value = active;\n           switchLanguage(prev, active);\n         }\n       }\n     });\n   <\/script>\n <\/body>\n <\/html>\n<\/html>"</script>
