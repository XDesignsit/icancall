  <script type="__bundler/template">"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>iCanCall for Seniors — One number Mom or Dad already knows how to use.<\/title>\n<style>\/* ===========================================================\n   iCanCall — landing page styles\n   Warm & reassuring · soft blue\/teal · clean neutral sans\n   =========================================================== *\/\n\n:root {\n  \/* Surfaces — subtly cool whites *\/\n  --bg:        oklch(0.992 0.005 220);\n  --surface:   oklch(1 0 0);\n  --tint:      oklch(0.965 0.018 218);   \/* soft blue wash *\/\n  --tint-2:    oklch(0.945 0.028 210);\n  --line:      oklch(0.90 0.012 225);\n\n  \/* Ink — cool near-blacks *\/\n  --ink:       oklch(0.26 0.028 248);\n  --ink-soft:  oklch(0.45 0.022 245);\n  --ink-faint: oklch(0.60 0.018 242);\n\n  \/* Brand — calm blues + teal *\/\n  --blue:      oklch(0.58 0.115 232);\n  --blue-deep: oklch(0.44 0.105 240);\n  --blue-ink:  oklch(0.34 0.085 244);\n  --teal:      oklch(0.72 0.095 196);\n  --teal-deep: oklch(0.62 0.10 198);\n  --green:     oklch(0.70 0.13 158);\n\n  --shadow-sm: 0 1px 2px oklch(0.4 0.05 240 \/ 0.06), 0 2px 6px oklch(0.4 0.05 240 \/ 0.05);\n  --shadow-md: 0 4px 14px oklch(0.4 0.05 240 \/ 0.08), 0 10px 30px oklch(0.4 0.05 240 \/ 0.07);\n  --shadow-lg: 0 12px 28px oklch(0.4 0.06 240 \/ 0.10), 0 30px 60px oklch(0.4 0.06 240 \/ 0.10);\n\n  --r-sm: 10px;\n  --r-md: 16px;\n  --r-lg: 24px;\n  --r-xl: 32px;\n\n  --maxw: 1180px;\n  --pad: clamp(20px, 5vw, 56px);\n\n  --font: \"Helvetica Neue\", Helvetica, Arial, \"Segoe UI\", sans-serif;\n  --mono: ui-monospace, \"SF Mono\", \"Roboto Mono\", Menlo, monospace;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }\n\nbody {\n  font-family: var(--font);\n  background: var(--bg);\n  color: var(--ink);\n  line-height: 1.55;\n  font-size: 17px;\n  letter-spacing: -0.01em;\n}\n\na { color: inherit; text-decoration: none; }\nimg { display: block; max-width: 100%; }\n\n.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad); }\n\n\/* ---------- Typography ---------- *\/\nh1, h2, h3, h4 { letter-spacing: -0.025em; line-height: 1.06; font-weight: 700; color: var(--ink); }\nh1 { font-size: clamp(2.6rem, 6vw, 4.6rem); }\nh2 { font-size: clamp(2rem, 4vw, 3.1rem); }\nh3 { font-size: clamp(1.25rem, 2vw, 1.6rem); }\n.lead { font-size: clamp(1.1rem, 1.6vw, 1.32rem); color: var(--ink-soft); line-height: 1.5; }\n\n.eyebrow {\n  display: inline-flex; align-items: center; gap: 8px;\n  font-size: 0.82rem; font-weight: 600; letter-spacing: 0.04em;\n  text-transform: uppercase; color: var(--blue-deep);\n}\n.eyebrow::before {\n  content: \"\"; width: 22px; height: 2px; border-radius: 2px;\n  background: var(--teal-deep);\n}\n\n.section { padding-block: clamp(72px, 10vw, 130px); }\n.section-head { max-width: 680px; }\n.section-head .eyebrow { margin-bottom: 18px; }\n.section-head .lead { margin-top: 18px; }\n.center { margin-inline: auto; text-align: center; }\n.center .eyebrow { justify-content: center; }\n\n\/* ---------- Buttons ---------- *\/\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 9px;\n  font-family: var(--font); font-size: 1rem; font-weight: 600;\n  padding: 14px 26px; border-radius: 999px; border: 1px solid transparent;\n  cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, background .18s ease;\n  white-space: nowrap;\n}\n.btn-primary {\n  background: var(--blue); color: #fff;\n  box-shadow: 0 6px 18px oklch(0.58 0.115 232 \/ 0.32);\n}\n.btn-primary:hover { background: var(--blue-deep); transform: translateY(-2px); box-shadow: 0 10px 24px oklch(0.58 0.115 232 \/ 0.38); }\n.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }\n.btn-ghost:hover { background: var(--tint); border-color: var(--blue); transform: translateY(-2px); }\n.btn-lg { padding: 17px 34px; font-size: 1.06rem; }\n\n\/* ---------- Header ---------- *\/\n.header {\n  position: sticky; top: 0; z-index: 60;\n  backdrop-filter: blur(12px);\n  background: oklch(0.992 0.005 220 \/ 0.78);\n  border-bottom: 1px solid transparent;\n  transition: border-color .25s ease, background .25s ease;\n}\n.header.scrolled { border-color: var(--line); background: oklch(0.992 0.005 220 \/ 0.92); }\n.header-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }\n.brand { display: flex; align-items: center; gap: 11px; font-weight: 700; font-size: 1.22rem; letter-spacing: -0.03em; }\n.brand .mark {\n  width: 34px; height: 34px; border-radius: 10px; flex: none;\n  background: linear-gradient(150deg, var(--blue), var(--teal-deep));\n  display: grid; place-items: center; box-shadow: var(--shadow-sm);\n}\n.brand .mark svg { width: 18px; height: 18px; }\n.brand b { color: var(--blue-deep); }\n.nav { display: flex; align-items: center; gap: 20px; }\n.nav a { font-size: 0.94rem; color: var(--ink-soft); font-weight: 500; transition: color .15s; white-space: nowrap; }\n.nav a:hover { color: var(--ink); }\n.header-cta { display: flex; align-items: center; gap: 14px; }\n.nav-toggle { display: none; }\n@media (max-width: 880px) {\n  .nav { display: none; }\n  .header-cta .btn-ghost { display: none; }\n}\n\n\/* ---------- Hero ---------- *\/\n.hero { position: relative; overflow: hidden; padding-top: clamp(48px, 7vw, 86px); padding-bottom: clamp(60px, 8vw, 110px); }\n.hero::before {\n  content: \"\"; position: absolute; inset: -20% -10% auto -10%; height: 760px;\n  background:\n    radial-gradient(60% 60% at 78% 12%, oklch(0.72 0.095 196 \/ 0.18), transparent 70%),\n    radial-gradient(55% 55% at 18% 0%, oklch(0.58 0.115 232 \/ 0.16), transparent 70%);\n  pointer-events: none; z-index: 0;\n}\n.hero-grid {\n  position: relative; z-index: 1;\n  display: grid; grid-template-columns: 1.02fr 0.98fr; gap: clamp(36px, 5vw, 72px);\n  align-items: center;\n}\n.hero-copy .eyebrow { margin-bottom: 22px; }\n.hero-copy h1 { margin-bottom: 22px; }\n.hero-copy h1 .accent { color: var(--blue-deep); }\n.hero-copy .lead { max-width: 30ch; margin-bottom: 34px; }\n.hero-actions { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }\n.hero-note { margin-top: 22px; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--ink-faint); }\n.hero-note .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px oklch(0.70 0.13 158 \/ 0.18); }\n\n@media (max-width: 900px) {\n  .hero-grid { grid-template-columns: 1fr; }\n  .hero-copy .lead { max-width: 46ch; }\n}\n\n\/* ---------- Routing demo ---------- *\/\n.demo {\n  position: relative;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--r-xl);\n  box-shadow: var(--shadow-lg);\n  padding: 26px 24px 22px;\n}\n.demo-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }\n.demo-number { display: flex; align-items: center; gap: 12px; }\n.demo-number .ring {\n  width: 44px; height: 44px; border-radius: 13px; flex: none;\n  background: linear-gradient(150deg, var(--blue), var(--teal-deep));\n  display: grid; place-items: center; position: relative;\n}\n.demo-number .ring svg { width: 21px; height: 21px; }\n.demo-number .ring::after {\n  content: \"\"; position: absolute; inset: 0; border-radius: 13px;\n  box-shadow: 0 0 0 0 oklch(0.58 0.115 232 \/ 0.45);\n  animation: pulse 2.4s ease-out infinite;\n}\n@keyframes pulse {\n  0% { box-shadow: 0 0 0 0 oklch(0.58 0.115 232 \/ 0.40); }\n  70% { box-shadow: 0 0 0 16px oklch(0.58 0.115 232 \/ 0); }\n  100% { box-shadow: 0 0 0 0 oklch(0.58 0.115 232 \/ 0); }\n}\n.demo-number .num { font-weight: 700; font-size: 1.12rem; letter-spacing: -0.02em; }\n.demo-number .num small { display: block; font-s ; margin-top: 22px; }\n.quote .by .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 0.85rem; }\n.quote .by b { font-size: 0.92rem; display: block; }\n.quote .by span { font-size: 0.82rem; color: var(--ink-faint); }\n@media (max-width: 820px) { .quotes { grid-template-columns: 1fr; } }\n\n\/* ---------- FAQ ---------- *\/\n.faq { max-width: 800px; margin: 48px auto 0; }\n.faq-item { border-bottom: 1px solid var(--line); }\n.faq-q { width: 100%; text-align: left; background: none; border: none; cursor: pointer; font-family: var(--font); padding: 24px 4px; display: flex; align-items: center; justify-content: space-between; gap: 20px; font-size: 1.1rem; font-weight: 600; color: var(--ink); }\n.faq-q .pm { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--tint); display: grid; place-items: center; transition: transform .25s, background .25s; color: var(--blue-deep); font-size: 1.2rem; line-height: 1; }\n.faq-item.open .faq-q .pm { transform: rotate(45deg); background: var(--blue); color: #fff; }\n.faq-a { max-height: 0; overflow: hidden; transition: max-height .32s ease; }\n.faq-a p { padding: 0 4px 24px; color: var(--ink-soft); font-size: 1rem; max-width: 68ch; }\n\n\/* ---------- Final CTA ---------- *\/\n.cta-band { position: relative; overflow: hidden; }\n.cta-card {\n  position: relative; border-radius: var(--r-xl); padding: clamp(48px, 7vw, 88px) clamp(28px, 5vw, 72px);\n  background: linear-gradient(150deg, var(--blue-deep), var(--blue) 55%, var(--teal-deep));\n  color: #fff; text-align: center; overflow: hidden;\n  box-shadow: var(--shadow-lg);\n}\n.cta-card::before { content: \"\"; position: absolute; inset: 0; background: radial-gradient(50% 80% at 80% 0%, oklch(1 0 0 \/ 0.18), transparent 60%); pointer-events: none; }\n.cta-card h2 { color: #fff; position: relative; }\n.cta-card p { color: oklch(0.95 0.02 220); font-size: 1.18rem; margin: 18px auto 32px; max-width: 50ch; position: relative; }\n.cta-card .btn-primary { background: #fff; color: var(--blue-deep); box-shadow: 0 8px 24px oklch(0.2 0.05 240 \/ 0.3); }\n.cta-card .btn-primary:hover { background: oklch(0.96 0.02 220); }\n.cta-card .actions { position: relative; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }\n.cta-card .fine { margin-top: 20px; font-size: 0.86rem; color: oklch(0.9 0.02 220); position: relative; }\n\n\/* ---------- Footer ---------- *\/\n.footer { padding-block: 60px 40px; border-top: 1px solid var(--line); background: var(--surface); }\n.footer-grid { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 40px; }\n.footer .brand { margin-bottom: 16px; }\n.footer .blurb { color: var(--ink-soft); font-size: 0.92rem; max-width: 30ch; }\n.footer h5 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); margin-bottom: 16px; font-weight: 700; }\n.footer ul { list-style: none; display: flex; flex-direction: column; gap: 11px; }\n.footer a { color: var(--ink-soft); font-size: 0.94rem; transition: color .15s; }\n.footer a:hover { color: var(--blue-deep); }\n.footer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--line); font-size: 0.86rem; color: var(--ink-faint); }\n@media (max-width: 820px) { .footer-grid { grid-template-columns: 1fr 1fr; } }\n\n\/* ---------- Reveal on scroll ---------- *\/\n.reveal { opacity: 0; transform: translateY(22px); transition: opacity .6s ease, transform .6s ease; }\n.reveal.in { opacity: 1; transform: none; }\n\n@media (prefers-reduced-motion: reduce) {\n  * { animation: none !important; transition: none !important; }\n  .reveal { opacity: 1; transform: none; }\n}\n<\/style>\n<style>\/* ===========================================================\n   iCanCall — shared audience-page components\n   Loaded by every tailored audience landing page (seniors,\n   parents, caregivers) on top of styles.css. Per-audience\n   files add their own signature sections.\n   =========================================================== *\/\n\n\/* ---------- Hero audience badge ---------- *\/\n.aud-badge {\n  display: inline-flex; align-items: center; gap: 9px;\n  background: var(--surface); border: 1px solid var(--line);\n  padding: 8px 15px 8px 11px; border-radius: 999px;\n  font-size: 0.92rem; font-weight: 600; color: var(--blue-deep);\n  box-shadow: var(--shadow-sm); margin-bottom: 22px;\n}\n.aud-badge .hh {\n  width: 26px; height: 26px; border-radius: 50%; flex: none;\n  background: linear-gradient(150deg, var(--blue), var(--teal-deep));\n  display: grid; place-items: center;\n}\n.aud-badge .hh svg { width: 14px; height: 14px; }\n\n\/* ---------- Reassurance callout under hero actions ---------- *\/\n.hero-reassure {\n  margin-top: 26px; display: flex; gap: 14px; align-items: flex-start;\n  max-width: 42ch; padding: 14px 16px; border-radius: var(--r-md);\n  background: oklch(0.70 0.13 158 \/ 0.10); border: 1px solid oklch(0.70 0.13 158 \/ 0.28);\n}\n.hero-reassure svg { width: 22px; height: 22px; flex: none; margin-top: 1px; color: oklch(0.45 0.13 158); }\n.hero-reassure p { font-size: 0.98rem; color: var(--ink-soft); }\n.hero-reassure b { color: var(--ink); }\n\n\/* ---------- Single-story spotlight (replaces 3-up quotes) ---------- *\/\n.spotlight-card {\n  display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 0;\n  border-radius: var(--r-xl); overflow: hidden;\n  border: 1px solid var(--line); box-shadow: var(--shadow-lg); background: var(--surface);\n}\n.spotlight-quote { padding: clamp(34px, 4vw, 56px); display: flex; flex-direction: column; }\n.spotlight-quote .stars { color: var(--teal-deep); letter-spacing: 4px; font-size: 1.05rem; margin-bottom: 18px; }\n.spotlight-quote blockquote {\n  font-size: clamp(1.3rem, 2.1vw, 1.7rem); line-height: 1.4; font-weight: 600;\n  letter-spacing: -0.02em; color: var(--ink); flex: 1;\n}\n.spotlight-quote .by { display: flex; align-items: center; gap: 13px; margin-top: 28px; }\n.spotlight-quote .by .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 0.95rem; }\n.spotlight-quote .by b { font-size: 1rem; display: block; }\n.spotlight-quote .by span { font-size: 0.9rem; color: var(--ink-faint); }\n.spotlight-aside {\n  background: linear-gradient(160deg, var(--blue-deep), var(--blue) 55%, var(--teal-deep));\n  color: #fff; padding: clamp(34px, 4vw, 52px); display: flex; flex-direction: column; justify-content: center; gap: 26px;\n}\n.spotlight-aside .stat-xl b { display: block; font-size: clamp(2.4rem, 4vw, 3.4rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1; }\n.spotlight-aside .stat-xl span { font-size: 1rem; color: oklch(0.92 0.02 220); margin-top: 8px; display: block; }\n.spotlight-aside .divider { height: 1px; background: oklch(1 0 0 \/ 0.22); }\n@media (max-width: 820px) { .spotlight-card { grid-template-columns: 1fr; } }\n<\/style>\n<style>\/* ===========================================================\n   iCanCall — Seniors landing page\n   Layers on top of styles.css. Two jobs:\n   1) Light-touch accessibility (slightly larger type & targets)\n   2) Bespoke sections unique to this audience\n   =========================================================== *\/\n\n\/* ---------- Light-touch accessibility ---------- *\/\nbody { font-size: 18.5px; }\n.lead { font-size: clamp(1.18rem, 1.7vw, 1.46rem); line-height: 1.55; }\n.nav a { font-size: 1.02rem; }\n.btn { font-size: 1.06rem; padding: 15px 28px; }\n.btn-lg { padding: 18px 38px; font-size: 1.18rem; }\n.faq-q { font-size: 1.2rem; padding-block: 26px; }\n.faq-a p { font-size: 1.08rem; }\n.feature p, .step p, .usecase p { font-size: 1.05rem; }\n.feature h3 { font-size: 1.24rem; }\n\n\/* a touch more breathing room in the eyebrow for older eyes *\/\n.eyebrow { font-size: 0.9rem; letter-spacing: 0.05em; }\n\n\/* Larger senior buttons need the header to collapse sooner than the\n   base 880px breakpoint, or the CTA row overflows the viewport. *\/\n@media (max-width: 1000px) {\n  .nav { display: none; }\n  .header-cta .btn-ghost { display: none; }\n}\n\n\/* ---------- \"Nothing new to learn\" any-phone band ---------- *\/\n.noapp { padding-block: clamp(64px, 9vw, 110px); }\n.noapp-grid {\n  display: grid; grid-template-columns: 0.92fr 1.08fr;\n  gap: clamp(36px, 5vw, 72px); align-items: center;\n}\n.noapp-copy .checks { list-style: none; margin-top: 26px; display: flex; flex-direction: column; gap: 14px; }\n.noapp-copy .checks li { display: flex; gap: 13px; align-items: flex-start; font-size: 1.08rem; color: var(--ink-soft); }\n.noapp-copy .checks li b { color: var(--ink); font-weight: 600; }\n.noapp-copy .checks .ck {\n  width: 28px; height: 28px; border-radius: 50%; flex: none; margin-top: 1px;\n  background: oklch(0.70 0.13 158 \/ 0.16); display: grid; place-items: center;\n}\n.noapp-copy .checks .ck svg { width: 16px; height: 16px; color: oklch(0.45 0.13 158); }\n\n\/* the three devices, all converging on one number *\/\n.devices {\n  position: relative;\n  background: var(--surface); border: 1px solid var(--line);\n  border-radius: var(--r-xl); box-shadow: var(--shadow-lg);\n  padding: clamp(24px, 3vw, 36px);\n}\n.devices-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }\n.device {\n  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px;\n  padding: 22px 12px 18px; border-radius: var(--r-lg);\n  border: 1px solid var(--line); background: var(--bg);\n}\n.device .glyph {\n  width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center;\n  background: var(--tint); color: var(--blue-deep);\n}\n.device .glyph svg { width: 30px; height: 30px; }\n.device .dname { font-weight: 600; font-size: 1.0rem; }\n.device .dtag {\n  display: inline-flex; align-items: center; gap: 6px;\n  font-size: 0.82rem; font-weight: 600; color: oklch(0.45 0.13 158);\n}\n.device .dtag svg { width: 14px; height: 14px; }\n\n.devices-link {\n  display: flex; align-items: center; justify-content: center; gap: 12px;\n  margin: 20px 0 4px; color: var(--ink-faint); font-size: 0.86rem; font-weight: 600;\n  text-transform: uppercase; letter-spacing: 0.06em;\n}\n.devices-link::before, .devices-link::after {\n  content: \"\"; height: 1px; flex: 1; background: var(--line);\n}\n.devices-one {\n  display: flex; align-items: center; gap: 14px; justify-content: center;\n  padding: 16px 20px; border-radius: var(--r-md);\n  background: linear-gradient(150deg, var(--blue-ink), var(--blue-deep)); color: #fff;\n}\n.devices-one .ring {\n  width: 44px; height: 44px; border-radius: 13px; flex: none;\n  background: oklch(1 0 0 \/ 0.16); display: grid; place-items: center;\n}\n.devices-one .ring svg { width: 22px; height: 22px; }\n.devices-one .num { font-weight: 700; font-size: 1.18rem; letter-spacing: -0.02em; }\n.devices-one .num small { display: block; font-size: 0.76rem; font-weight: 500; color: oklch(0.9 0.03 220); letter-spacing: 0.01em; }\n\n@media (max-width: 900px) {\n  .noapp-grid { grid-template-columns: 1fr; }\n}\n@media (max-width: 480px) {\n  .devices-row { grid-template-columns: 1fr; }\n}\n\n\/* ---------- Single-story spotlight (replaces 3-up quotes) ---------- *\/\n\/* shared component — see audience.css *\/\n\n<\/style>\n<\/head>\n<body>\n\n\n\n<!-- ============== HEADER ============== -->\n<header class=\"header\">\n  <div class=\"wrap header-inner\">\n    <a class=\"brand\" href=\"#top\" aria-label=\"iCanCall home\">\n      <span class=\"mark\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n      <\/span>\n      <span>i<b>Can<\/b>Call<\/span>\n    <\/a>\n    <nav class=\"nav\">\n      <a href=\"#noapp\">Nothing to learn<\/a>\n      <a href=\"#how\">How it works<\/a>\n      <a href=\"#build\">Build the circle<\/a>\n      <a href=\"#pricing\">Pricing<\/a>\n      <a href=\"#faq\">Questions<\/a>\n    <\/nav>\n    <div class=\"header-cta\" style=\"display: flex; align-items: center; gap: 12px;\">\n      <a class=\"btn btn-ghost\" href=\"#how\">See how it works<\/a>\n      <a class=\"btn btn-primary\" href=\"#pricing\">Set it up for them<\/a>\n      <select id=\"langSelect\" class=\"lang-select\" style=\"background: transparent; border: 1px solid var(--line); color: var(--ink-soft); padding: 6px 10px; border-radius: 20px; font-size: 0.86rem; font-weight: 600; cursor: pointer; outline: none; font-family: var(--font); margin-left: 4px;\">\n        <option value=\"en\">🇺🇸 EN<\/option>\n        <option value=\"es\">🇪🇸 ES<\/option>\n        <option value=\"fr\">🇫🇷 FR<\/option>\n        <option value=\"ja\">🇯🇵 JA<\/option>\n        <option value=\"zh\">🇨🇳 ZH<\/option>\n        <option value=\"ar\">🇸🇦 AR<\/option>\n        <option value=\"hi\">🇮🇳 HI<\/option>\n        <option value=\"pt\">🇵🇹 PT<\/option>\n        <option value=\"de\">🇩🇪 DE<\/option>\n        <option value=\"it\">🇮🇹 IT<\/option>\n        <option value=\"ko\">🇰🇷 KO<\/option>\n      <\/select>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main id=\"top\">\n\n<!-- ============== HERO ============== -->\n<section class=\"hero\">\n  <div class=\"wrap hero-grid\">\n    <div class=\"hero-copy\">\n      <span class=\"aud-badge\">\n        <span class=\"hh\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 18a4 4 0 0 0-8 0\"><\/path><circle cx=\"12\" cy=\"9\" r=\"3.5\"><\/circle><\/svg><\/span>\n        For families with aging parents\n      <\/span>\n      <h1>Mom can always reach you.<br><span class=\"accent\">On the phone she already uses.<\/span><\/h1>\n      <p class=\"lead\">Give your parent one easy number that quietly finds the whole family — until someone picks up. There's no app to install and nothing new for them to learn. You set it up in minutes; they just answer their phone, the way they always have.<\/p>\n      <div class=\"hero-actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"#pricing\">Set it up for them<\/a>\n        <a class=\"btn btn-ghost btn-lg\" href=\"#how\">How it works<\/a>\n      <\/div>\n      <div class=\"hero-reassure\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z\"><\/path><path d=\"m9 12 2 2 4-4\"><\/path><\/svg>\n        <p><b>You do the setup. They do nothing new.<\/b> Works on a landline, a flip phone, or a smartphone — no app, no new device.<\/p>\n      <\/div>\n    <\/div>\n\n    <!-- Animated routing demo -->\n    <div class=\"demo\" id=\"demo\" aria-label=\"Live call-routing demonstration\">\n      <div class=\"demo-head\">\n        <div class=\"demo-number\">\n          <span class=\"ring\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n          <\/span>\n          <span class=\"num\">(415) 200-CARE<small>Mom's iCanCall number<\/small><\/span>\n        <\/div>\n        <span class=\"demo-status\"><span class=\"live\"><\/span><span class=\"txt\">Incoming call<\/span><\/span>\n      <\/div>\n      <p class=\"demo-caption\">She dials one number — it finds the family in order, until someone answers<\/p>\n      <div class=\"chain\">\n        <div class=\"contact\">\n          <span class=\"order\">1<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.58 0.115 232)\">SR<\/span>\n          <span class=\"who\"><b>Sarah R.<\/b><span>Daughter<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">2<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.62 0.10 198)\">DM<\/span>\n          <span class=\"who\"><b>David M.<\/b><span>Son<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">3<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.55 0.11 280)\">LN<\/span>\n          <span class=\"who\"><b>Lena N.<\/b><span>Neighbor<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">4<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.6 0.12 30)\">DR<\/span>\n          <span class=\"who\"><b>Dr. Patel<\/b><span>Care team<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== NOTHING TO LEARN (any phone) ============== -->\n<section class=\"section noapp tint-band\" id=\"noapp\">\n  <div class=\"wrap noapp-grid\">\n    <div class=\"noapp-copy reveal\">\n      <span class=\"eyebrow\">No app · No new device<\/span>\n      <h2>Nothing new for them to learn.<\/h2>\n      <p class=\"lead\">The hardest part of most \"safety\" gadgets is getting an older parent to use them. iCanCall asks nothing of them. It lives on the phone that's already by their chair — so making a call feels exactly like it always has.<\/p>\n      <ul class=\"checks\">\n        <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg><\/span><span><b>No app to download<\/b> and no account for them to manage.<\/span><\/li>\n        <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg><\/span><span><b>No new gadget<\/b> to charge, wear, or learn to operate.<\/span><\/li>\n        <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg><\/span><span><b>One number to remember<\/b> — write it once on the fridge.<\/span><\/li>\n      <\/ul>\n    <\/div>\n\n    <div class=\"devices reveal\">\n      <div class=\"devices-row\">\n        <div class=\"device\">\n          <span class=\"glyph\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"10\" rx=\"2\"><\/rect><path d=\"M7 11V8a5 5 0 0 1 10 0v3\"><\/path><path d=\"M7 16h.01M12 16h.01M17 16h.01\"><\/path><\/svg><\/span>\n          <span class=\"dname\">Landline<\/span>\n          <span class=\"dtag\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Works<\/span>\n        <\/div>\n        <div class=\"device\">\n          <span class=\"glyph\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"2\" width=\"12\" height=\"20\" rx=\"2\"><\/rect><rect x=\"8.5\" y=\"4.5\" width=\"7\" height=\"5\" rx=\"1\"><\/rect><path d=\"M9 13h.01M12 13h.01M15 13h.01M9 16h.01M12 16h.01M15 16h.01M9 19h.01M12 19h.01M15 19h.01\"><\/path><\/svg><\/span>\n          <span class=\"dname\">Flip phone<\/span>\n          <span class=\"dtag\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Works<\/span>\n        <\/div>\n        <div class=\"device\">\n          <span class=\"glyph\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"6\" y=\"2\" width=\"12\" height=\"20\" rx=\"3\"><\/rect><path d=\"M11 18.5h2\"><\/path><\/svg><\/span>\n          <span class=\"dname\">Smartphone<\/span>\n          <span class=\"dtag\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Works<\/span>\n        <\/div>\n      <\/div>\n      <div class=\"devices-link\">all dial the same number<\/div>\n      <div class=\"devices-one\">\n        <span class=\"ring\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg><\/span>\n        <span class=\"num\">(415) 200-CARE<small>One number · always answered<\/small><\/span>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== HOW IT WORKS ============== -->\n<section class=\"section\" id=\"how\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">How it works<\/span>\n      <h2>You set it up. They just answer.<\/h2>\n      <p class=\"lead\">Three quiet steps, all on your side. Your parent never has to do a thing differently.<\/p>\n    <\/div>\n    <div class=\"steps\">\n      <div class=\"step reveal\">\n        <div class=\"idx\">1<\/div>\n        <h3>Claim their number<\/h3>\n        <p>Pick one easy-to-remember iCanCall number for Mom or Dad. Write it on the fridge, program it as a speed-dial, or save it as \"Family.\" That's the only number they'll ever need.<\/p>\n        <svg class=\"step-arrow\" width=\"60\" height=\"24\" viewBox=\"0 0 60 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M0 12h54m0 0-7-7m7 7-7 7\"><\/path><\/svg>\n      <\/div>\n      <div class=\"step reveal\">\n        <div class=\"idx\">2<\/div>\n        <h3>Add the family circle<\/h3>\n        <p>Put yourself, your siblings, a trusted neighbor, and the care team in order — up to six people. You manage it all from your phone; nothing is installed on theirs.<\/p>\n        <svg class=\"step-arrow\" width=\"60\" height=\"24\" viewBox=\"0 0 60 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M0 12h54m0 0-7-7m7 7-7 7\"><\/path><\/svg>\n      <\/div>\n      <div class=\"step reveal\">\n        <div class=\"idx\">3<\/div>\n        <h3>They dial like always<\/h3>\n        <p>When they call that one number, iCanCall <b>cascades<\/b> through the circle until someone answers — and everyone gets a text that the call came in. No menus to navigate unless you want them.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== INTERACTIVE BUILDER ============== -->\n<section class=\"section tint-band\" id=\"build\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Try it yourself<\/span>\n      <h2>Build the circle that answers for Mom.<\/h2>\n      <p class=\"lead\">Add the people you trust, set their order, then place a pretend call. Choose <b>cascade<\/b> — ring everyone in turn until someone picks up — or a simple <b>caller menu<\/b>. You control all of this; your parent only ever dials one number.<\/p>\n    <\/div>\n    <div class=\"mode-toggle reveal\">\n      <span class=\"mode-label\">Routing mode<\/span>\n      <div class=\"seg\" role=\"tablist\" aria-label=\"Routing mode\">\n        <button class=\"seg-btn active\" type=\"button\" data-mode=\"cascade\" role=\"tab\">Call cascade<\/button>\n        <button class=\"seg-btn\" type=\"button\" data-mode=\"menu\" role=\"tab\">Caller menu<\/button>\n        <button class=\"seg-btn\" type=\"button\" data-mode=\"schedule\" role=\"tab\">Around-the-clock<\/button>\n      <\/div>\n      <span class=\"mode-note\">\n        <svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"10\" rx=\"2\"><\/rect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\/path><\/svg>\n        You set this once in the dashboard\n      <\/span>\n    <\/div>\n    <div class=\"builder reveal\">\n      <!-- editor -->\n      <div class=\"builder-panel\">\n        <div class=\"builder-head\">\n          <h3>Mom's circle<\/h3>\n          <span class=\"count\"><span id=\"ccount\">0<\/span>\/6 contacts<\/span>\n        <\/div>\n        <div id=\"circle-list\" class=\"circle-list\"><\/div>\n        <form id=\"add-form\" class=\"add-form\" autocomplete=\"off\">\n          <input id=\"add-name\" type=\"text\" placeholder=\"Name\" maxlength=\"22\" required=\"\">\n          <input id=\"add-rel\" type=\"text\" placeholder=\"Relationship\" maxlength=\"22\">\n          <button class=\"btn btn-primary add-btn\" type=\"submit\" aria-label=\"Add contact\" title=\"Add contact\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg>\n          <\/button>\n        <\/form>\n      <\/div>\n      <!-- simulator -->\n      <div class=\"sim-panel\">\n        <div id=\"schedule-time-selector\" style=\"margin-bottom: 15px; display: none; align-items: center; gap: 8px; justify-content: center;\">\n          <span style=\"font-size: 0.82rem; font-weight: 600; color: var(--ink-soft);\">Simulated Time:<\/span>\n          <input type=\"time\" id=\"sim-time-input\" value=\"09:00\" style=\"background: var(--bg); border: 1px solid var(--line); color: var(--ink); padding: 8px 12px; border-radius: 999px; font-size: 0.88rem; font-weight: 600; cursor: pointer; outline: none; font-family: var(--font); box-shadow: var(--shadow-sm);\">\n        <\/div>\n        <div class=\"sim-screen\" id=\"sim-screen\">\n          <span class=\"num-line\">(415) 200-CARE<\/span>\n          <div class=\"sim-avatar\" id=\"sim-avatar\">—<\/div>\n          <div class=\"sim-name\" id=\"sim-name\">Ready<\/div>\n          <div class=\"sim-state\" id=\"sim-state\">Press call to start routing<\/div>\n          <div class=\"sim-dots\" id=\"sim-dots\"><\/div>\n        <\/div>\n        <button class=\"btn btn-primary\" id=\"place-call\">\n          <svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n          Place a call\n        <\/button>\n        <p class=\"sim-hint\">Toggle contacts to \"Busy\" to see the cascade skip ahead.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== FEATURES ============== -->\n<section class=\"section\" id=\"features\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Why families choose iCanCall<\/span>\n      <h2>Made for the call that<br>can't go unanswered.<\/h2>\n    <\/div>\n    <div class=\"features\">\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v4a2 2 0 0 1-2.2 2A16 16 0 0 1 3 6.2 2 2 0 0 1 5 4Z\"><\/path><\/svg><\/div>\n        <h3>Works on any phone<\/h3>\n        <p>Landline, flip phone, or smartphone — it all works. No app to install and no new device to learn. The phone they have today is all they need.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 18a4 4 0 0 0-8 0\"><\/path><circle cx=\"12\" cy=\"9\" r=\"3.5\"><\/circle><path d=\"M5 20a7 7 0 0 1 14 0\"><\/path><\/svg><\/div>\n        <h3>The whole family, in order<\/h3>\n        <p>One call reaches up to six people — you, your siblings, a neighbor, the doctor — in the order you choose, until someone picks up.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16v11H7l-3 3V5Z\"><\/path><path d=\"M8 9h8M8 12h5\"><\/path><\/svg><\/div>\n        <h3>Everyone gets a text<\/h3>\n        <p>The moment Mom or Dad calls, every contact gets a message. So even if you're in a meeting, you know the second they reached out.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 7v5l3 2\"><\/path><\/svg><\/div>\n        <h3>Different rules by time of day<\/h3>\n        <p>Reach the night caregiver after hours and the family during the day — automatically. Help is always the right person for the moment.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z\"><\/path><path d=\"m9 12 2 2 4-4\"><\/path><\/svg><\/div>\n        <h3>Never a dead end<\/h3>\n        <p>If the whole circle is unreachable, the call goes to voicemail that's transcribed and texted to everyone — so no cry for help is ever missed.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"11\" rx=\"2\"><\/rect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\/path><\/svg><\/div>\n        <h3>Private &amp; protected<\/h3>\n        <p>Everyone's personal numbers stay hidden behind the single iCanCall line. All routing is encrypted, and your family's data is never sold.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== SPOTLIGHT STORY ============== -->\n\n\n<!-- ============== PRICING ============== -->\n<section class=\"section\" id=\"pricing\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Simple, honest pricing<\/span>\n      <h2>Peace of mind, less than a phone bill.<\/h2>\n      <p class=\"lead\">Both plans include cascade routing, the caller menu, and 24\/7 reliability. Set it up for your parent in minutes — cancel anytime.<\/p>\n    <\/div>\n\n    <div class=\"bill-toggle reveal\" id=\"bill-toggle\">\n      <button class=\"bill-btn active\" type=\"button\" data-cycle=\"monthly\">Monthly<\/button>\n      <button class=\"bill-btn\" type=\"button\" data-cycle=\"annual\">Annual <em>Save 17%<\/em><\/button>\n    <\/div>\n\n    <div class=\"pricing\">\n      <div class=\"plan reveal\" data-m-amt=\"$12.99\" data-m-per=\"\/ month\" data-m-note=\"Billed monthly · cancel anytime\" data-a-amt=\"$129\" data-a-per=\"\/ year\" data-a-note=\"Just $10.75\/mo, billed annually\">\n        <h3>Essential<\/h3>\n        <p class=\"desc\">One number for one parent.<\/p>\n        <div class=\"price\"><b class=\"amt\">$12.99<\/b><span class=\"per\">\/ month<\/span><\/div>\n        <p class=\"price-yr\">Bil rrentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> SMS &amp; email notifications<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Works on any phone — no app needed<\/li>\n        <\/ul>\n        <a class=\"btn btn-primary plan-select\" href=\"iCanCall Onboarding.html?plan=pro&amp;billing=monthly\">Select Pro<\/a>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== FAQ ============== -->\n<section class=\"section tint-band\" id=\"faq\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Questions, answered<\/span>\n      <h2>What families ask us most.<\/h2>\n    <\/div>\n    <div class=\"faq reveal\">\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Does my parent need a smartphone?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Not at all. iCanCall works on whatever phone they already use — a landline, a basic flip phone, or a smartphone. There's no app to install and no new device to buy or charge. They simply dial one number, exactly the way they make any other call.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Will it work with their landline?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Yes. The single iCanCall number can be dialed from any phone, landline included. Many families program it as a one-touch speed dial or write it on a card by the phone, so reaching the whole family is as easy as it gets.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Do they have to learn anything new?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>No. That's the point. Everything — adding contacts, setting the order, choosing how calls route — is managed by you from your own phone. Your parent never installs anything or changes how they make a call. To them, it's just one easy number that always reaches someone.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">What happens if nobody answers?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>iCanCall rings each contact in your chosen order until someone picks up. If the whole circle is unreachable, the call goes to voicemail that's instantly transcribed and texted to every contact — so no message, and no moment that matters, is ever lost.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Can I set it up and manage it for them?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Absolutely — most families do. You claim the number, add the circle, and adjust the order anytime from your dashboard. Changes take effect on the very next call, and your parent doesn't have to lift a finger.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Is my family's information private?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Always. Everyone's personal numbers stay hidden behind your single iCanCall line, all routing is encrypted, and we never sell your data.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== FINAL CTA ============== -->\n<section class=\"section cta-band\" id=\"cta\">\n  <div class=\"wrap\">\n    <div class=\"cta-card reveal\">\n      <h2>Set it up today. Rest easier tonight.<\/h2>\n      <p>In a few minutes, your parent will have one number that always finds the family — on the phone they already know how to use. No app, no new device, nothing for them to learn.<\/p>\n      <div class=\"actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"#pricing\">Set it up for them<\/a>\n  \"Just $16.58\/mo, billed annually\": \"연간 결제 시 실질 월 $16.58\",\n      \"Everything included in the plan:\": \"플랜에 포함된 핵심 서비스 혜택:\",\n      \"1 number included\": \"전용 가상 안심 번호 1개 제공\",\n      \"3 routable trusted contacts\": \"연결 연락처 최대 3명 등록 가능\",\n      \"Cascade routing + Caller Menu\": \"순차 통화 라우팅 및 선택 다이얼 메뉴\",\n      \"30 voice minutes\": \"제공 통화 30분\",\n      \"Bilingual greeting options\": \"다국어 인사 안내 멘트 기능\",\n      \"Works on any phone — no app needed\": \"모든 전화기 지원 — 별도 앱 불필요\",\n      \"2 dedicated phone numbers\": \"전용 가상 안심 번호 2개 제공\",\n      \"6 routable trusted contacts\": \"연결 연락처 최대 6명 등록 가능\",\n      \"60 minutes included\": \"제공 통화 60분 포함\",\n      \"Real-time call alerts\": \"실시간 통화 시작 상황 알림\",\n      \"Admin dashboard\": \"원격 보호자 대시보드\",\n      \"SMS & email notifications\": \"SMS 및 이메일 상황 노티\",\n      \"Stories from families\": \"실제 이용 가족 후기\",\n      \"The calls that got through.\": \"마음을 이어준 따뜻한 통화들.\",\n      \"Questions, answered\": \"자주 묻는 질문\",\n      \"Everything you might ask.\": \"자주 묻는 질문 모음.\",\n      \"Ringing…\": \"신호 가는 중…\",\n      \"Connected ✓\": \"연결됨 ✓\"\n    },\n    \"attrs\": {\n      \"Name\": \"이름\",\n      \"Relationship\": \"관계\"\n    }\n  }\n};\n\n     function translateDOM(node, dict) {\n       if (node.nodeType === Node.TEXT_NODE) {\n         const text = node.nodeValue.trim();\n         if (dict[text]) {\n           node.nodeValue = dict[text];\n         }\n       } else if (node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {\n         node.childNodes.forEach(child => translateDOM(child, dict));\n       }\n     }\n\n     function translatePage(lang) {\n       \/\/ Support RTL for Arabic\n       document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';\n\n       const dict = DICT_MAP[lang];\n       if (dict) {\n         translateDOM(document.body, dict.text);\n         \n         document.querySelectorAll('[placeholder]').forEach(el => {\n           const p = el.getAttribute('placeholder').trim();\n           if (dict.attrs[p]) el.setAttribute('placeholder', dict.attrs[p]);\n         });\n         \n         document.querySelectorAll('.avail .lbl').forEach(el => {\n           const availMap = {\n             'es': { 'Available': 'Disponible', 'Busy': 'Ocupado' },\n             'fr': { 'Available': 'Disponible', 'Busy': 'Occupé' },\n             'ja': { 'Available': '対応可能', 'Busy': '忙しい' },\n             'zh': { 'Available': '在线可用', 'Busy': '忙碌' },\n             'ar': { 'Available': 'متاح', 'Busy': 'مشغول' },\n             'hi': { 'Available': 'उपलब्ध', 'Busy': 'व्यस्त' },\n             'pt': { 'Available': 'Disponível', 'Busy': 'Ocupado' },\n             'de': { 'Available': 'Verfügbar', 'Busy': 'Besetzt' },\n             'it': { 'Available': 'Disponibile', 'Busy': 'Occupato' },\n             'ko': { 'Available': '통화 가능', 'Busy': '바쁨' }\n           };\n           const m = availMap[lang];\n           if (m) {\n             if (el.textContent.trim() === 'Available') el.textContent = m['Available'];\n             if (el.textContent.trim() === 'Busy') el.textContent = m['Busy'];\n           }\n         });\n         \n         document.querySelectorAll('.sim-hint').forEach(el => {\n           const hintMap = {\n             'es': 'Desactive contactos a «Ocupado» para ver cómo salta la cascada.',\n             'fr': \"Désactivez des contacts sur « Occupé » pour voir l'appel sauter au suivant.\",\n             'ja': '連絡先を「忙しい」に切り替えて、カスケード転送が次へ進む様子を確認できます。',\n             'zh': '将联系人切换为“忙碌”状态，查看顺次呼叫如何自动跳过并呼叫下一位。',\n             'ar': 'قم بتحويل جهات الاتصال إلى ' + \"'مشغول'\" + ' لرؤية الرنين المتتالي يتجاوزهم إلى التالي.',\n             'hi': 'कैस्केड को आगे बढ़ते देखने के लिए सदस्यों को “व्यस्त” पर टॉगल करें।',\n             'pt': 'Mude contatos para “Ocupado” para ver a chamada saltar para o próximo.',\n             'de': 'Schalten Sie Kontakte auf „Besetzt“, um zu sehen wie der Anruf zum nächsten springt.',\n             'it': 'Imposta i contati su “Occupato” per vedere la chiamata passare al successivo.',\n             'ko': '연락처를 “통화 중”으로 토글하여 순차 통화가 다음 보호자로 넘어가는 것을 확인하세요.'\n           };\n           if (hintMap[lang] && el.textContent.includes('Toggle contacts')) {\n             el.textContent = hintMap[lang];\n           }\n         });\n       } else {\n         window.location.reload();\n       }\n     }\n\n     document.addEventListener('DOMContentLoaded', () => {\n       const select = document.getElementById('langSelect');\n       if (select) {\n         const saved = localStorage.getItem('lang') || 'en';\n         select.value = saved;\n         if (saved !== 'en') translatePage(saved);\n         \n         select.addEventListener('change', (e) => {\n           localStorage.setItem('lang', e.target.value);\n           window.dispatchEvent(new Event('storage'));\n           translatePage(e.target.value);\n         });\n       }\n     });\n\n     window.addEventListener('storage', () => {\n       const select = document.getElementById('langSelect');\n       if (select) {\n         const active = localStorage.getItem('lang') || 'en';\n         if (select.value !== active) {\n           select.value = active;\n           translatePage(active);\n         }\n       }\n     });\n   <\/script>\n <\/body>\n <\/html>\n<\/html>"</script>
