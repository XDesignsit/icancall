<\/h4><p>A full refund, no questions asked, and no hardware to return.<\/p><\/div><\/div><p class=\"hp-more rv\"><span class=\"ic\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-plus\"><\/use><\/svg><\/span><span>Need more? Extra numbers <span class=\"mono\">$6.99<\/span>/mo each · Extra minutes <span class=\"mono\">$4.99<\/span> per 30.<\/span><\/p><div class=\"hp-price-links\"><a class=\"hp-link\" href=\"/contact\">Organizations &amp; teams: talk to us<svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-arrow-r\"><\/use><\/svg><\/a><a class=\"hp-link\" href=\"ICanCall_Comparison_Chart.html\">See how we compare<svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-arrow-r\"><\/use><\/svg><\/a><\/div><\/div><\/section><section class=\"section hp-faq\" id=\"faq\" aria-labelledby=\"faq-title\"><div class=\"hp-faq-bg\" aria-hidden=\"true\"><\/div><div class=\"wrap hp-faq-grid\"><div class=\"hp-faq-side\"><div class=\"section-head rv\"><span class=\"eyebrow\">Before you sign up<\/span><h2 class=\"hp-h2\" id=\"faq-title\">Questions, <span class=\"accent\">answered.<\/span><\/h2><p class=\"lead\">Straight answers to the questions families ask us most.<\/p><\/div><aside class=\"hp-faq-help rv\" aria-labelledby=\"faq-help-title\"><span class=\"av\" aria-hidden=\"true\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-headset\"><\/use><\/svg><\/span><h3 id=\"faq-help-title\">Still have a question?<\/h3><p>Real people reply within one business day.<\/p><a class=\"btn\" href=\"/contact\">Contact us<svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-arrow-r\"><\/use><\/svg><\/a><\/aside><\/div><div class=\"faq hp-qa-list\"><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:0\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">01<\/span><span class=\"t\">Do I need any special hardware?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>No. iCanCall is a phone number, not a device. Your loved one dials it from the phone they already have.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:1\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">02<\/span><span class=\"t\">How does the Call Cascade work?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Calls ring your contacts one at a time, in the order you choose. If someone doesn&#x27;t answer, the call moves to the next person. If no one answers, the caller can leave a voicemail. On Pro and Care Team, you&#x27;ll get the transcript by email.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:2\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">03<\/span><span class=\"t\">Can I have more than one number?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Yes. Pro includes 2 numbers and Care Team includes 5. Extra numbers are $6.99/month each.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:3\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">04<\/span><span class=\"t\">Is there a setup fee or contract?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>No setup fees, no activation costs, no contracts.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:4\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">05<\/span><span class=\"t\">What&#x27;s your refund policy?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Every plan has a 30-day money-back guarantee. After that you can cancel anytime from your dashboard, and service runs to the end of your billing period.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:5\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">06<\/span><span class=\"t\">Does the guarantee cover annual plans?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Yes, for the first 30 days. After that, annual plans are non-refundable for unused months.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:6\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">07<\/span><span class=\"t\">Is my family&#x27;s information private?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Yes. Personal numbers stay hidden behind your iCanCall line, and we never sell your data.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:7\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">08<\/span><span class=\"t\">How quickly can I get set up?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Most families are live in under five minutes: claim a number, add your contacts, done.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:8\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">09<\/span><span class=\"t\">Is iCanCall an emergency service?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>No. It helps your family reach each other quickly and complements, but doesn&#x27;t replace, 911 or a medical alert service.<\/p><\/div><\/details><\/div><\/div><\/section><section class=\"hp-final hp-dark\" id=\"start\" aria-labelledby=\"final-title\"><div class=\"hp-final-glow\" aria-hidden=\"true\"><\/div><div class=\"wrap hp-final-grid\"><div class=\"hp-final-copy\"><h2 class=\"hp-h2\" id=\"final-title\">Give them one number. Give yourself peace of mind.<\/h2><p class=\"lead\">Set up in under five minutes. Your family can start calling today.<\/p><div
