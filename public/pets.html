Fino a 15 contatti in lista per numero\",\n      \"All Routing Modes + Scheduling\": \"Tutte le modalità di inoltro + programmazione\",\n      \"150 pooled voice minutes\": \"150 minuti di conversazione condivisi\",\n      \"2 Caregiver Logins\": \"2 accessi per caregiver\",\n      \"All plans include cascade routing, the caller menu, and 24/7 reliability. Set it up for your parent in minutes — cancel anytime.\": \"Tutti i piani includono l'inoltro in cascata, il menu vocale e affidabilità 24/7. Configuralo per i tuoi genitori in pochi minuti — disdici quando vuoi.\",\n      \"All plans include cascade routing, the caller menu, and 24/7 reliability. Set it up in minutes — cancel anytime.\": \"Tutti i piani includono l'inoltro in cascata, il menu vocale e affidabilità 24/7. Configuralo in pochi minuti — disdici quando vuoi.\",\n      \"All plans include cascade routing, the caller menu, time-aware coverage, and 24/7 reliability. Cancel anytime.\": \"Tutti i piani includono l'inoltro in cascata, il menu vocale, la copertura per fasce orarie e affidabilità 24/7. Disdici quando vuoi.\",\n      \"Designed for the moments that matter\": \"Ideato per i momenti che contano\",\n      \"iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.\": \"iCanCall si adatta in modo unico alla vita delle famiglie che cercano una comunicazione di sicurezza semplice e senza schermi.\",\n      \"For Kids\": \"Per i bambini\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"Consente ai bambini di chiamare la famiglia da qualsiasi telefono fisso o classico di casa, senza distrazioni tecnologiche.\",\n      \"For Seniors\": \"Per gli anziani\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"Un'ancora di salvezza per genitori o nonni anziani. Devono solo ricordare un numero per contattare tutta la famiglia.\",\n      \"For Special Needs\": \"Bisogni speciali\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"Semplifica il processo di telefonata per persone con limitazioni cognitive o motorie, garantendo accesso rapido all'aiuto.\",\n      \"One number\": \"Un solo numero\",\n      \"Build the circle\": \"Crea la cerchia\",\n      \"Questions\": \"Domande\",\n      \"For parents of young children\": \"Per i genitori di bambini piccoli\",\n      \"they'll never forget.\": \"che non dimenticheranno mai.\",\n      \"Little ones can't memorize a whole contact list — but they can learn one number. iCanCall turns that single number into the entire family: it rings you, then your partner, then Grandma, then a trusted neighbor, until someone who loves them picks up.\": \"I più piccoli non possono imparare a memoria un'intera rubrica — ma un numero sì. iCanCall trasforma quell'unico numero in tutta la famiglia: fa squillare te, poi il tuo partner, poi la nonna, poi un vicino di fiducia, finché risponde qualcuno che vuole loro bene.\",\n      \"No phone of their own required.\": \"Non serve un telefono tutto loro.\",\n      \"They can call from a friend's house, the school office, or any phone — and still reach family in seconds.\": \"Possono chiamare da casa di un amico, dalla segreteria della scuola o da qualsiasi telefono — e raggiungere comunque la famiglia in pochi secondi.\",\n      \"Emma's iCanCall number\": \"Il numero iCanCall di Emma\",\n      \"Incoming call\": \"Chiamata in arrivo\",\n      \"She dials one number — it finds a grown-up she knows, in order, until someone answers\": \"Compone un solo numero — che cerca un adulto che conosce, in ordine, finché qualcuno risponde\",\n      \"Mom\": \"Mamma\",\n      \"Mobile\": \"Cellulare\",\n      \"Standing by\": \"In attesa\",\n      \"Dad\": \"Papà\",\n      \"Grandma Rose\": \"Nonna Rose\",\n      \"Grandparent\": \"Nonno/a\",\n      \"Neighbor\": \"Vicino/a\",\n      \"Made for little hands and big worries\": \"Pensato per mani piccole e grandi preoccupazioni\",\n      \"number to memorize\": \"numero da memorizzare\",\n      \"grown-ups it can reach\": \"adulti raggiungibili\",\n      \"apps or phones needed\": \"app o telefoni necessari\",\n      \"Any\": \"Qualsiasi\",\n      \"phone, anywhere\": \"telefono, ovunque\",\n      \"The whole lesson\": \"Tutta la lezione\",\n      \"One number is all they have to learn.\": \"Un solo numero: è tutto ciò che devono imparare.\",\n      \"Ask a five-year-old to remember Mom's cell, Dad's cell, Grandma's house, and the neighbor next door, and you'll lose them at \\\"cell.\\\" iCanCall replaces the whole list with a single number — and quietly does the rest.\": \"Chiedi a un bambino di cinque anni di ricordare il cellulare della mamma, quello del papà, il fisso della nonna e il vicino della porta accanto: lo avrai perso già a «cellulare». iCanCall sostituisce l'intero elenco con un solo numero — e al resto pensa lui, con discrezione.\",\n      \"The old way\": \"Il vecchio metodo\",\n      \"A list no child can hold\": \"Un elenco che nessun bambino può ricordare\",\n      \"Too many numbers, scribbled on the fridge — and never the right one in the moment that counts.\": \"Troppi numeri, scarabocchiati sul frigo — e mai quello giusto nel momento che conta.\",\n      \"Mom — cell\": \"Mamma — cellulare\",\n      \"Dad — work\": \"Papà — lavoro\",\n      \"\\\"Which one do I call if you don't answer?\\\"\": \"«Quale chiamo se non rispondi?»\",\n      \"With iCanCall\": \"Con iCanCall\",\n      \"One number, every grown-up\": \"Un solo numero, tutti gli adulti\",\n      \"They learn it like a nursery rhyme. It finds whoever's available — you don't have to be the one who picks up.\": \"Lo imparano come una filastrocca. Trova chi è disponibile — non devi essere per forza tu a rispondere.\",\n      \"Our family number\": \"Il numero della nostra famiglia\",\n      \"\\\"If you ever need us, call this. Someone will always answer.\\\"\": \"«Se hai bisogno di noi, chiama questo. Qualcuno risponderà sempre.»\",\n      \"Set it up once. Teach it once.\": \"Lo configuri una volta. Lo insegni una volta.\",\n      \"A few minutes of setup buys years of \\\"I can always reach a grown-up.\\\"\": \"Pochi minuti di configurazione valgono anni di «posso sempre raggiungere un adulto».\",\n      \"Claim your family number\": \"Riserva il numero di famiglia\",\n      \"Pick one easy-to-remember iCanCall number. Put it on a backpack tag, a lunchbox card, and the classroom contact card — the only number your child needs anywhere they go.\": \"Scegli un numero iCanCall facile da ricordare. Mettilo su un'etichetta dello zaino, su un cartoncino nel portapranzo e nella scheda contatti della classe — l'unico numero che serve a tuo figlio, ovunque vada.\",\n      \"Add the grown-ups\": \"Aggiungi gli adulti\",\n      \"You, your partner, grandparents, a babysitter, a trusted neighbor — up to six people, in the order you want them reached. Adjust anytime from your phone.\": \"Tu, il tuo partner, i nonni, una babysitter, un vicino di fiducia — fino a sei persone, nell'ordine in cui vuoi che vengano chiamate. Modifichi quando vuoi dal tuo telefono.\",\n      \"Teach them the number\": \"Insegna loro il numero\",\n      \"That's the whole job for them. When they call, iCanCall\": \"Per loro è tutto qui. Quando chiamano, iCanCall\",\n      \"cascades\": \"procede a cascata\",\n      \"through the circle until someone answers — and every grown-up gets a text that the call came in.\": \"lungo la cerchia finché qualcuno non risponde — e ogni adulto riceve un SMS che segnala la chiamata.\",\n      \"Wherever they are\": \"Ovunque si trovino\",\n      \"The same number works\": \"Lo stesso numero funziona\",\n      \"everywhere life happens.\": \"ovunque li porti la vita.\",\n      \"No phone of their own? No problem. One number reaches family from any phone they can get to.\": \"Non hanno un telefono tutto loro? Nessun problema. Un solo numero raggiunge la famiglia da qualsiasi telefono a portata di mano.\",\n      \"Home after school\": \"A casa dopo la scuola\",\n      \"Beat you home? One call lets them check in and reach whoever's free — you, Grandma, or the neighbor.\": \"Sono arrivati a casa prima di te? Con una chiamata si fanno sentire e raggiungono chi è libero — tu, la nonna o il vicino.\",\n      \"At a friend's house\": \"A casa di un amico\",\n      \"From a friend's landline or a parent's phone, the one number still finds your family — no contacts to look up.\": \"Dal fisso di un amico o dal telefono di un genitore, quell'unico numero trova comunque la tua famiglia — nessun contatto da cercare.\",\n      \"Lost at the store\": \"Persi al supermercato\",\n      \"A clerk or another grown-up can dial the number with them, and a familiar voice answers right away.\": \"Un commesso o un altro adulto può comporre il numero insieme a loro, e una voce familiare risponde subito.\",\n      \"When plans change\": \"Quando i piani cambiano\",\n      \"Practice ran late or pickup got moved? One call routes to whoever can come — no scramble, no guessing.\": \"L'allenamento è finito tardi o è cambiato chi li va a prendere? Una chiamata arriva a chi può andare — niente corse, niente incertezze.\",\n      \"Try it yourself\": \"Provalo tu\",\n      \"Build the circle that answers for your child.\": \"Crea la cerchia che risponde a tuo figlio.\",\n      \"Add the grown-ups you trust, set their order, then place a pretend call. Choose\": \"Aggiungi gli adulti di cui ti fidi, stabilisci l'ordine e poi fai una chiamata di prova. Scegli la\",\n      \"cascade\": \"cascata\",\n      \"— ring everyone in turn until someone picks up — or a simple\": \"— squillano tutti a turno finché qualcuno non risponde — oppure un semplice\",\n      \"caller menu\": \"menu vocale\",\n      \". Your child only ever dials one number.\": \". Tuo figlio compone sempre e solo un numero.\",\n      \"Routing mode\": \"Modalità di inoltro\",\n      \"Call cascade\": \"Inoltro in cascata\",\n      \"Caller menu\": \"Menu vocale\",\n      \"You set this once in the dashboard\": \"Lo imposti una sola volta nella dashboard\",\n      \"Your child's circle\": \"La cerchia di tuo figlio\",\n      \"/6 contacts\": \"/6 contatti\",\n      \"Ready\": \"Pronto\",\n      \"Press call to start routing\": \"Premi «chiama» per avviare l'inoltro\",\n      \"Place a call\": \"Fai una chiamata\",\n      \"Toggle contacts to \\\"Busy\\\" to see the cascade skip ahead.\": \"Imposta i contatti su «Occupato» per vedere la cascata passare oltre.\",\n      \"Why parents choose iCanCall\": \"Perché i genitori scelgono iCanCall\",\n      \"Built so they always reach\": \"Pensato perché raggiungano sempre\",\n      \"someone who loves them.\": \"qualcuno che vuole loro bene.\",\n      \"One number to memorize\": \"Un solo numero da memorizzare\",\n      \"Children learn a single number instead of a fragile list. It's the only one they'll ever need to reach the whole family.\": \"I bambini imparano un unico numero invece di un elenco fragile. È il solo di cui avranno mai bisogno per raggiungere tutta la famiglia.\",\n      \"No phone of their own\": \"Nessun telefono tutto loro\",\n      \"Works from any phone — a friend's, a teacher's, a landline. Your child doesn't need a device to reach you.\": \"Funziona da qualsiasi telefono — quello di un amico, di un insegnante, un fisso. Tuo figlio non ha bisogno di un dispositivo per raggiungerti.\",\n      \"Someone always answers\": \"Qualcuno risponde sempre\",\n      \"If you're busy, the call rolls to your partner, then a grandparent, then a trusted neighbor — until a familiar voice picks up.\": \"Se non puoi rispondere, la chiamata passa al tuo partner, poi a un nonno, poi a un vicino di fiducia — finché risponde una voce familiare.\",\n      \"You always know\": \"Lo sai sempre\",\n      \"Every grown-up in the circle gets a text the moment your child calls — so you're never the last to find out.\": \"Ogni adulto della cerchia riceve un SMS nel momento in cui tuo figlio chiama — così non sei mai l'ultimo a saperlo.\",\n      \"Different by time of day\": \"Diverso in base all'orario\",\n      \"Route to the babysitter after school and to you in the evening — automatically, so the right grown-up always answers.\": \"Dopo la scuola la chiamata va alla babysitter, la sera a te — in automatico, così risponde sempre l'adulto giusto.\",\n      \"Private & protected\": \"Privato e protetto\",\n      \"Everyone's real numbers stay hidden behind your single iCanCall line. All routing is encrypted, and your data is never sold.\": \"I numeri reali di tutti restano nascosti dietro la tua unica linea iCanCall. Tutto l'inoltro è crittografato e i tuoi dati non vengono mai venduti.\",\n      \"Simple, honest pricing\": \"Prezzi semplici e trasparenti\",\n      \"Peace of mind, less than a phone bill.\": \"Serenità, a meno di una bolletta del telefono.\",\n      \"/ month\": \"/ mese\",\n      \"What parents ask us most.\": \"Le domande più frequenti dei genitori.\",\n      \"Does my child need their own phone?\": \"Mio figlio ha bisogno di un telefono suo?\",\n      \"No. That's the whole idea. iCanCall is one number that works from\": \"No. È proprio questa l'idea. iCanCall è un solo numero che funziona da\",\n      \"any\": \"qualsiasi\",\n      \"phone — a friend's house, the school office, a neighbor's landline. Your child just needs to know the number, and a familiar grown-up answers.\": \"telefono — da casa di un amico, dalla segreteria della scuola, dal fisso di un vicino. A tuo figlio basta conoscere il numero, e risponde un adulto che conosce.\",\n      \"Isn't one number too simple for something urgent?\": \"Un solo numero non è troppo semplice per una situazione urgente?\",\n      \"Simple is exactly what works under stress. One number rings each grown-up in your circle in order until someone picks up — so a child who's scared or hurt never has to decide\": \"La semplicità è proprio ciò che funziona sotto stress. Un solo numero fa squillare in ordine ogni adulto della tua cerchia finché qualcuno risponde — così un bambino spaventato o che si è fatto male non deve mai decidere\",\n      \"who\": \"chi\",\n      \"to call. (iCanCall is for reaching family quickly; for life-threatening emergencies, always teach your child to call 911 too.)\": \"chiamare. (iCanCall serve a raggiungere la famiglia in fretta; per le emergenze in cui c'è pericolo di vita, insegna sempre a tuo figlio a chiamare anche il 911.)\",\n      \"What if I'm busy and can't pick up?\": \"E se sono occupato e non posso rispondere?\",\n      \"The call simply rolls to the next grown-up — your partner, then a grandparent, then a trusted neighbor — until someone answers. Everyone in the circle also gets a text that your child called, so you'll know the moment you're free.\": \"La chiamata passa semplicemente all'adulto successivo — il tuo partner, poi un nonno, poi un vicino di fiducia — finché qualcuno risponde. Tutti nella cerchia ricevono anche un SMS che segnala la chiamata di tuo figlio, così lo saprai non appena sarai libero.\",\n      \"Can I change who's in the circle, or the order?\": \"Posso cambiare chi fa parte della cerchia, o l'ordine?\",\n      \"Anytime, in seconds, from your dashboard. Add the new babysitter, drop a contact, or reorder who's reached first. Changes take effect on the very next call.\": \"Quando vuoi, in pochi secondi, dalla tua dashboard. Aggiungi la nuova babysitter, togli un contatto o cambia chi viene chiamato per primo. Le modifiche valgono già dalla chiamata successiva.\",\n      \"Will strangers see our family's phone numbers?\": \"Gli estranei vedranno i numeri di telefono della nostra famiglia?\",\n      \"Never. Everyone's personal numbers stay hidden behind your single iCanCall line. All routing is encrypted, and we never sell your data.\": \"Mai. I numeri personali di tutti restano nascosti dietro la tua unica linea iCanCall. Tutto l'inoltro è crittografato e non vendiamo mai i tuoi dati.\",\n      \"How do I help my child remember the number?\": \"Come aiuto mio figlio a ricordare il numero?\",\n      \"Most families turn it into a little rhyme or song and practice a \\\"pretend call\\\" together. Put it on a backpack tag and the school contact form, and within a week it sticks — because it's the only number they have to know.\": \"Quasi tutte le famiglie lo trasformano in una piccola filastrocca o canzoncina e provano insieme una «chiamata per finta». Mettilo su un'etichetta dello zaino e nel modulo contatti della scuola: nel giro di una settimana resta in mente — perché è l'unico numero che devono sapere.\",\n      \"Give them one number. Give yourself peace of mind.\": \"A loro dai un numero. A te, la serenità.\",\n      \"In a few minutes, your child will have a single number that always reaches a grown-up who loves them — from any phone, anywhere. No device, no contact list, no guessing.\": \"In pochi minuti tuo figlio avrà un solo numero che raggiunge sempre un adulto che gli vuole bene — da qualsiasi telefono, ovunque. Nessun dispositivo, nessuna rubrica, nessuna incertezza.\",\n      \"One memorable number that always connects your child to a grown-up who loves them — from any phone, anywhere.\": \"Un numero facile da ricordare che collega sempre tuo figlio a un adulto che gli vuole bene — da qualsiasi telefono, ovunque.\",\n      \"For every family\": \"Per ogni famiglia\",\n      \"iCanCall, Inc. All rights reserved.\": \"iCanCall, Inc. Tutti i diritti riservati.\"\n    },\n    \"attrs\": {\n      \"Name\": \"Nome\",\n      \"Relationship\": \"Relazione\"\n    }\n  },\n  \"ko\": {\n    \"text\": {\n      \"How it works\": \"이용 방법\",\n      \"Features\": \"기능 안내\",\n      \"Who it's for\": \"이용 대상\",\n      \"Pricing\": \"요금제\",\n 유해성이나 눈부심 노출 없이, 집전화나 구형 폴더폰으로 가족들과 즉시 안전하게 통화할 수 있습니다.\",\n      \"For Seniors\": \"부모님을 위한 효도 연락망\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"복잡한 기기나 연락처 검색이 어려운 고령의 부모님용 서비스. 한 번의 다이얼로 온 가족 연결망을 가동시킵니다.\",\n      \"For Special Needs\": \"돌봄 및 특별 케어 대상자\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"인지장애나 신체적 제약이 있으신 분들이 복잡한 번호를 외우지 않고도 즉각적이고 정확하게 지원 그룹의 도움을 받도록 돕습니다.\",\n      \"One number\": \"단 하나의 번호\",\n      \"Build the circle\": \"서클 만들기\",\n      \"Questions\": \"자주 묻는 질문\",\n      \"For parents of young children\": \"어린 자녀를 둔 부모를 위해\",\n      \"they'll never forget.\": \"아이가 절대 잊지 않을 번호.\",\n      \"Little ones can't memorize a whole contact list — but they can learn one number. iCanCall turns that single number into the entire family: it rings you, then your partner, then Grandma, then a trusted neighbor, until someone who loves them picks up.\": \"어린아이는 연락처 목록 전체를 외울 수 없지만, 번호 하나는 배울 수 있습니다. iCanCall은 그 번호 하나를 온 가족으로 바꿔 줍니다. 먼저 여러분에게, 다음은 배우자에게, 그다음 할머니에게, 그다음 믿을 수 있는 이웃에게 — 아이를 사랑하는 누군가가 받을 때까지 전화가 이어집니다.\",\n      \"No phone of their own required.\": \"아이 전용 휴대폰은 필요 없습니다.\",\n      \"They can call from a friend's house, the school office, or any phone — and still reach family in seconds.\": \"친구 집, 학교 교무실, 어떤 전화기에서든 걸 수 있고 — 몇 초 만에 가족과 연결됩니다.\",\n      \"Emma's iCanCall number\": \"Emma의 iCanCall 번호\",\n      \"Incoming call\": \"수신 전화\",\n      \"She dials one number — it finds a grown-up she knows, in order, until someone answers\": \"번호 하나만 누르면 — 누군가 받을 때까지 아이가 아는 어른을 순서대로 찾아 줍니다\",\n      \"Mom\": \"엄마\",\n      \"Mobile\": \"휴대폰\",\n      \"Standing by\": \"대기 중\",\n      \"Dad\": \"아빠\",\n      \"Grandma Rose\": \"Rose 할머니\",\n      \"Grandparent\": \"조부모\",\n      \"Neighbor\": \"이웃\",\n      \"Made for little hands and big worries\": \"작은 손과 큰 걱정을 위해 만들었습니다\",\n      \"number to memorize\": \"외워야 할 번호\",\n      \"grown-ups it can reach\": \"연결 가능한 어른\",\n      \"apps or phones needed\": \"필요한 앱이나 휴대폰\",\n      \"Any\": \"모든\",\n      \"phone, anywhere\": \"전화기, 어디서나\",\n      \"The whole lesson\": \"배울 것은 이게 전부\",\n      \"One number is all they have to learn.\": \"아이가 배울 것은 번호 하나뿐입니다.\",\n      \"Ask a five-year-old to remember Mom's cell, Dad's cell, Grandma's house, and the neighbor next door, and you'll lose them at \\\"cell.\\\" iCanCall replaces the whole list with a single number — and quietly does the rest.\": \"다섯 살 아이에게 엄마 휴대폰, 아빠 휴대폰, 할머니 댁, 옆집 이웃 번호를 외우라고 하면 \\\"휴대폰\\\"에서 이미 포기합니다. iCanCall은 그 목록 전체를 번호 하나로 바꾸고 — 나머지는 조용히 알아서 처리합니다.\",\n      \"The old way\": \"예전 방식\",\n      \"A list no child can hold\": \"아이가 감당할 수 없는 목록\",\n      \"Too many numbers, scribbled on the fridge — and never the right one in the moment that counts.\": \"냉장고에 휘갈겨 적은 너무 많은 번호들 — 정작 중요한 순간에 맞는 번호는 없습니다.\",\n      \"Mom — cell\": \"엄마 — 휴대폰\",\n      \"Dad — work\": \"아빠 — 회사\",\n      \"\\\"Which one do I call if you don't answer?\\\"\": \"\\\"엄마 아빠가 안 받으면 어디로 걸어야 해요?\\\"\",\n      \"With iCanCall\": \"iCanCall과 함께라면\",\n      \"One number, every grown-up\": \"번호 하나로, 모든 어른에게\",\n      \"They learn it like a nursery rhyme. It finds whoever's available — you don't have to be the one who picks up.\": \"동요처럼 외우면 됩니다. 받을 수 있는 사람을 알아서 찾아 주니 — 꼭 여러분이 받지 않아도 됩니다.\",\n      \"Our family number\": \"우리 가족 번호\",\n      \"\\\"If you ever need us, call this. Someone will always answer.\\\"\": \"\\\"우리가 필요하면 언제든 여기로 전화해. 누군가는 꼭 받을 거야.\\\"\",\n      \"Set it up once. Teach it once.\": \"한 번 설정하고, 한 번 가르치세요.\",\n      \"A few minutes of setup buys years of \\\"I can always reach a grown-up.\\\"\": \"몇 분의 설정으로 \\\"언제든 어른에게 연락할 수 있어\\\"라는 안심을 몇 년간 누립니다.\",\n      \"Claim your family number\": \"가족 번호 확보하기\",\n      \"Pick one easy-to-remember iCanCall number. Put it on a backpack tag, a lunchbox card, and the classroom contact card — the only number your child needs anywhere they go.\": \"기억하기 쉬운 iCanCall 번호를 하나 고르세요. 책가방 이름표, 도시락 가방 카드, 학급 비상연락 카드에 적어 두세요 — 아이가 어디를 가든 필요한 번호는 이것 하나뿐입니다.\",\n      \"Add the grown-ups\": \"어른들 추가하기\",\n      \"You, your partner, grandparents, a babysitter, a trusted neighbor — up to six people, in the order you want them reached. Adjust anytime from your phone.\": \"본인, 배우자, 조부모, 베이비시터, 믿을 수 있는 이웃 — 최대 6명까지, 원하는 연결 순서대로 등록하세요. 휴대폰에서 언제든 조정할 수 있습니다.\",\n      \"Teach them the number\": \"아이에게 번호 가르치기\",\n      \"That's the whole job for them. When they call, iCanCall\": \"아이가 할 일은 그게 전부입니다. 아이가 전화를 걸면 iCanCall이 서클을 따라\",\n      \"cascades\": \"순차 통화로\",\n      \"through the circle until someone answers — and every grown-up gets a text that the call came in.\": \"누군가 받을 때까지 연결하고, 전화가 왔다는 문자를 모든 어른에게 보냅니다.\",\n      \"Wherever they are\": \"아이가 어디에 있든\",\n      \"The same number works\": \"같은 번호 하나로,\",\n      \"everywhere life happens.\": \"일상의 모든 곳에서.\",\n      \"No phone of their own? No problem. One number reaches family from any phone they can get to.\": \"아이 전용 휴대폰이 없어도 괜찮습니다. 아이가 쓸 수 있는 어떤 전화기에서든 번호 하나로 가족과 연결됩니다.\",\n      \"Home after school\": \"방과 후 집에서\",\n      \"Beat you home? One call lets them check in and reach whoever's free — you, Grandma, or the neighbor.\": \"아이가 먼저 집에 도착했나요? 전화 한 통으로 안부를 전하고, 시간이 되는 사람 — 여러분, 할머니, 또는 이웃 — 과 연결됩니다.\",\n      \"At a friend's house\": \"친구 집에서\",\n      \"From a friend's landline or a parent's phone, the one number still finds your family — no contacts to look up.\": \"친구네 집전화든 친구 부모님의 휴대폰이든, 그 번호 하나면 가족을 찾아 줍니다 — 연락처를 찾아볼 필요가 없습니다.\",\n      \"Lost at the store\": \"가게에서 길을 잃었을 때\",\n      \"A clerk or another grown-up can dial the number with them, and a familiar voice answers right away.\": \"점원이나 다른 어른이 아이와 함께 번호를 눌러 주면, 익숙한 목소리가 바로 전화를 받습니다.\",\n      \"When plans change\": \"계획이 바뀌었을 때\",\n      \"Practice ran late or pickup got moved? One call routes to whoever can come — no scramble, no guessing.\": \"연습이 늦게 끝났거나 데리러 갈 사람이 바뀌었나요? 전화 한 통이 올 수 있는 사람에게 연결됩니다 — 허둥댈 일도, 짐작할 일도 없습니다.\",\n      \"Try it yourself\": \"직접 체험해 보세요\",\n      \"Build the circle that answers for your child.\": \"우리 아이의 전화를 받아 줄 서클을 만들어 보세요.\",\n      \"Add the grown-ups you trust, set their order, then place a pretend call. Choose\": \"믿을 수 있는 어른들을 추가하고 순서를 정한 다음, 가상 통화를 걸어 보세요. 라우팅 방식은\",\n      \"cascade\": \"순차 통화\",\n      \"— ring everyone in turn until someone picks up — or a simple\": \"— 누군가 받을 때까지 모두에게 차례로 전화를 거는 방식 — 또는 간단한\",\n      \"caller menu\": \"선택 다이얼 메뉴\",\n      \". Your child only ever dials one number.\": \"중에서 고르면 됩니다. 아이는 언제나 번호 하나만 누르면 됩니다.\",\n      \"Routing mode\": \"라우팅 방식\",\n      \"Call cascade\": \"순차 통화\",\n      \"Caller menu\": \"선택 다이얼 메뉴\",\n      \"You set this once in the dashboard\": \"대시보드에서 한 번만 설정하면 됩니다\",\n      \"Your child's circle\": \"우리 아이의 서클\",\n      \"/6 contacts\": \"/6 연락처\",\n      \"Ready\": \"준비 완료\",\n      \"Press call to start routing\": \"통화 버튼을 눌러 라우팅을 시작하세요\",\n      \"Place a call\": \"전화 걸기\",\n      \"Toggle contacts to \\\"Busy\\\" to see the cascade skip ahead.\": \"연락처를 \\\"통화 중\\\"으로 바꿔서 순차 통화가 다음 사람으로 넘어가는 모습을 확인해 보세요.\",\n      \"Why parents choose iCanCall\": \"부모들이 iCanCall을 선택하는 이유\",\n      \"Built so they always reach\": \"아이가 언제나\",\n      \"someone who loves them.\": \"사랑해 주는 누군가에게 닿도록.\",\n      \"One number to memorize\": \"외울 번호는 단 하나\",\n      \"Children learn a single number instead of a fragile list. It's the only one they'll ever need to reach the whole family.\": \"아이는 잊어버리기 쉬운 목록 대신 번호 하나만 배웁니다. 온 가족에게 연락하는 데 필요한 번호는 이것 하나뿐입니다.\",\n      \"No phone of their own\": \"아이 전용 휴대폰 불필요\",\n      \"Works from any phone — a friend's, a teacher's, a landline. Your child doesn't need a device to reach you.\": \"친구의 전화, 선생님의 전화, 집전화 등 어떤 전화기에서든 됩니다. 아이가 여러분에게 연락하는 데 기기는 필요 없습니다.\",\n      \"Someone always answers\": \"언제나 누군가 받습니다\",\n      \"If you're busy, the call rolls to your partner, then a grandparent, then a trusted neighbor — until a familiar voice picks up.\": \"여러분이 바쁘면 전화는 배우자에게, 그다음 조부모에게, 그다음 믿을 수 있는 이웃에게 넘어갑니다 — 익숙한 목소리가 받을 때까지.\",\n      \"You always know\": \"언제나 바로 알 수 있습니다\",\n      \"Every grown-up in the circle gets a text the moment your child calls — so you're never the last to find out.\": \"아이가 전화를 거는 순간 서클의 모든 어른에게 문자가 전송됩니다 — 여러분이 가장 늦게 알게 되는 일은 없습니다.\",\n      \"Different by time of day\": \"시간대별로 다르게\",\n      \"Route to the babysitter after school and to you in the evening — automatically, so the right grown-up always answers.\": \"방과 후에는 베이비시터에게, 저녁에는 여러분에게 — 자동으로 연결되어 언제나 알맞은 어른이 전화를 받습니다.\",\n      \"Private & protected\": \"안전한 개인정보 보호\",\n      \"Everyone's real numbers stay hidden behind your single iCanCall line. All routing is encrypted, and your data is never sold.\": \"모든 사람의 실제 번호는 하나의 iCanCall 번호 뒤에 숨겨집니다. 모든 라우팅은 암호화되며, 데이터는 절대 판매되지 않습니다.\",\n      \"Simple, honest pricing\": \"단순하고 정직한 요금\",\n      \"Peace of mind, less than a phone bill.\": \"전화 요금보다 저렴한 마음의 평화.\",\n      \"/ month\": \"/ 월\",\n      \"What parents ask us most.\": \"부모들이 가장 많이 묻는 질문.\",\n      \"Does my child need their own phone?\": \"아이에게 전용 휴대폰이 필요한가요?\",\n      \"No. That's the whole idea. iCanCall is one number that works from\": \"아니요. 바로 그게 핵심입니다. iCanCall은\",\n      \"any\": \"어떤\",\n      \"phone — a friend's house, the school office, a neighbor's landline. Your child just needs to know the number, and a familiar grown-up answers.\": \"전화기에서든 쓸 수 있는 하나의 번호입니다 — 친구 집, 학교 교무실, 이웃집 집전화까지. 아이는 번호만 알면 되고, 익숙한 어른이 전화를 받습니다.\",\n      \"Isn't one number too simple for something urgent?\": \"위급한 상황에 번호 하나는 너무 단순하지 않나요?\",\n      \"Simple is exactly what works under stress. One number rings each grown-up in your circle in order until someone picks up — so a child who's scared or hurt never has to decide\": \"단순함이야말로 다급한 순간에 힘을 발휘합니다. 하나의 번호가 서클의 어른들에게 순서대로 전화를 걸어 누군가 받을 때까지 이어집니다. 그래서 겁먹거나 다친 아이가\",\n      \"who\": \"누구에게\",\n      \"to call. (iCanCall is for reaching family quickly; for life-threatening emergencies, always teach your child to call 911 too.)\": \"전화할지 고민할 필요가 없습니다. (iCanCall은 가족에게 빠르게 연락하기 위한 서비스입니다. 생명이 위급한 응급 상황에는 911에도 전화하도록 꼭 가르쳐 주세요.)\",\n      \"What if I'm busy and can't pick up?\": \"제가 바빠서 전화를 못 받으면 어떻게 되나요?\",\n      \"The call simply rolls to the next grown-up — your partner, then a grandparent, then a trusted neighbor — until someone answers. Everyone in the circle also gets a text that your child called, so you'll know the moment you're free.\": \"전화는 그대로 다음 어른에게 넘어갑니다 — 배우자, 그다음 조부모, 그다음 믿을 수 있는 이웃 — 누군가 받을 때까지요. 서클의 모든 사람에게 아이가 전화했다는 문자도 전송되므로, 여유가 생기는 즉시 알 수 있습니다.\",\n      \"Can I change who's in the circle, or the order?\": \"서클의 구성원이나 순서를 바꿀 수 있나요?\",\n      \"Anytime, in seconds, from your dashboard. Add the new babysitter, drop a contact, or reorder who's reached first. Changes take effect on the very next call.\": \"대시보드에서 언제든, 몇 초 만에 가능합니다. 새 베이비시터를 추가하거나, 연락처를 빼거나, 먼저 연결될 사람의 순서를 바꾸세요. 변경 사항은 바로 다음 통화부터 적용됩니다.\",\n      \"Will strangers see our family's phone numbers?\": \"낯선 사람이 우리 가족의 전화번호를 볼 수 있나요?\",\n      \"Never. Everyone's personal numbers stay hidden behind your single iCanCall line. All routing is encrypted, and we never sell your data.\": \"절대 없습니다. 모든 사람의 개인 번호는 하나의 iCanCall 번호 뒤에 숨겨집니다. 모든 라우팅은 암호화되며, 데이터는 절대 판매하지 않습니다.\",\n      \"How do I help my child remember the number?\": \"아이가 번호를 기억하도록 어떻게 도와줄 수 있나요?\",\n      \"Most families turn it into a little rhyme or song and practice a \\\"pretend call\\\" together. Put it on a backpack tag and the school contact form, and within a week it sticks — because it's the only number they have to know.\": \"대부분의 가족은 짧은 노랫말이나 노래로 만들어 함께 \\\"가상 통화\\\" 연습을 합니다. 책가방 이름표와 학교 비상연락처 서류에 적어 두면 일주일 안에 입에 붙습니다 — 아이가 알아야 할 번호는 이것 하나뿐이니까요.\",\n      \"Give them one number. Give yourself peace of mind.\": \"아이에게는 번호 하나를, 여러분에게는 마음의 평화를.\",\n      \"In a few minutes, your child will have a single number that always reaches a grown-up who loves them — from any phone, anywhere. No device, no contact list, no guessing.\": \"몇 분이면 아이에게 사랑해 주는 어른과 언제나 연결되는 번호 하나가 생깁니다 — 어떤 전화기에서든, 어디서든. 기기도, 연락처 목록도, 망설임도 필요 없습니다.\",\n      \"One memorable number that always connects your child to a grown-up who loves them — from any phone, anywhere.\": \"아이를 사랑해 주는 어른과 언제든 연결해 주는 기억하기 쉬운 하나의 번호 — 어떤 전화기에서든, 어디서든.\",\n      \"For every family\": \"모든 가족을 위해\"\n    },\n    \"attrs\": {\n      \"Name\": \"이름\",\n      \"Relationship\": \"관계\"\n    }\n  }\n};\n\n     const PETS_DICT = {\"es\": {\"text\": {\"Why chips fail\": \"Por qué fallan los chips\", \"Parrots\": \"Loros\", \"Questions\": \"Preguntas\", \"Join the launch list\": \"Únase a la lista de lanzamiento\", \"For dogs, cats and parrots\": \"Para perros, gatos y loros\", \"One number on the chip.\": \"Un número en el chip.\", \"It never goes out of date.\": \"Nunca queda desactualizado.\", \"Put your iCanCall number on your pet's microchip once. When you move or change phones, update your contacts in the dashboard. The chip keeps reaching you, and you never have to update the registry again.\": \"Ponga su número iCanCall en el microchip de su mascota una sola vez. Cuando se mude o cambie de teléfono, actualice sus contactos en el panel de control. El chip sigue comunicándose con usted, y nunca más tendrá que actualizar el registro.\", \"Works with any microchip registry.\": \"Funciona con cualquier registro de microchips.\", \"Keep the registry you already use. Just put your iCanCall number on file.\": \"Conserve el registro que ya usa. Solo registre allí su número iCanCall.\", \"Max's microchip number\": \"Número de microchip de Max\", \"A shelter scans Max's chip and calls. The caller menu lets them pick who to reach\": \"Un refugio escanea el chip de Max y llama. El menú de llamadas les permite elegir con quién comunicarse\", \"Owner\": \"Dueño\", \"Partner\": \"Pareja\", \"Dog walker\": \"Paseador de perros\", \"Made for the day your pet goes missing\": \"Hecho para el día en que su mascota se pierda\", \"number on the chip\": \"número en el chip\", \"contacts in the caller menu\": \"contactos en el menú de llamadas\", \"registry updates when you move\": \"actualizaciones del registro al mudarse\", \"microchip registry\": \"registro de microchips\", \"The chip works. The phone number doesn't.\": \"El chip funciona. El número de teléfono, no.\", \"This is the most common reason microchips fail to reunite lost dogs with their owners: not a chip malfunction, but outdated contact details. iCanCall puts a number on the chip that keeps up with you.\": \"Esta es la razón más común por la que los microchips no logran reunir a los perros perdidos con sus dueños: no es una falla del chip, sino datos de contacto desactualizados. iCanCall pone en el chip un número que se mantiene al día con usted.\", \"A number that goes stale\": \"Un número que se queda viejo\", \"You register the chip once, then life moves on. New phone, new house, and the registry still has the old details.\": \"Usted registra el chip una vez y la vida sigue. Teléfono nuevo, casa nueva, y el registro aún tiene los datos viejos.\", \"Registry phone\": \"Teléfono registrado\", \"Old cell\": \"Celular antiguo\", \"Home address\": \"Dirección\", \"Moved\": \"Se mudó\", \"Backup contact\": \"Contacto de respaldo\", \"None\": \"Ninguno\", \"Last updated\": \"Última actualización\", \"Years ago\": \"Hace años\", \"\\\"The number you have dialed is no longer in service.\\\"\": \"“El número que usted marcó ya no está en servicio.”\", \"A number that keeps up with you\": \"Un número que se mantiene al día con usted\", \"The number on the chip never changes. You change who it reaches, any time, from your phone.\": \"El número del chip nunca cambia. Usted decide a quién llega, en cualquier momento, desde su teléfono.\", \"\\\"New phone, new house, same number on the chip.\\\"\": \"“Teléfono nuevo, casa nueva, el mismo número en el chip.”\", \"Set it up once. Keep it current forever.\": \"Configúrelo una vez. Manténgalo al día para siempre.\", \"A few minutes of setup means the number on your pet's chip always reaches someone who can help.\": \"Unos minutos de configuración bastan para que el número del chip de su mascota siempre llegue a alguien que pueda ayudar.\", \"Get your pet number\": \"Obtenga el número de su mascota\", \"Pick an iCanCall number for your pet. One number can cover every pet in your home.\": \"Elija un número iCanCall para su mascota. Un solo número puede cubrir a todas las mascotas de su hogar.\", \"Put it on the chip\": \"Póngalo en el chip\", \"Log in to the registry where your pet's chip is registered and set your iCanCall number as the phone number. Add it to the collar tag too.\": \"Inicie sesión en el registro donde está registrado el chip de su mascota y ponga su número iCanCall como número de teléfono. Agréguelo también a la placa del collar.\", \"Add up to six contacts\": \"Agregue hasta seis contactos\", \"You, your partner, a neighbor, the dog walker. When someone calls, they hear your lost-pet greeting and use the caller menu to pick who to reach.\": \"Usted, su pareja, un vecino, el paseador de perros. Cuando alguien llama, escucha su saludo de mascota perdida y usa el menú de llamadas para elegir con quién comunicarse.\", \"Wherever they turn up\": \"Dondequiera que aparezca\", \"The same number works wherever your pet is found.\": \"El mismo número funciona dondequiera que encuentren a su mascota.\", \"Shelters, vets and neighbors all reach you the same way: one number, from any phone.\": \"Refugios, veterinarios y vecinos se comunican con usted de la misma forma: un solo número, desde cualquier teléfono.\", \"Scanned at a shelter\": \"Escaneado en un refugio\", \"Staff scan the chip, call the number, and hear your lost-pet greeting straight away.\": \"El personal escanea el chip, llama al número y escucha de inmediato su saludo de mascota perdida.\", \"Scanned at a vet\": \"Escaneado en el veterinario\", \"A vet clinic checks the chip and calls you directly, without searching for old records.\": \"Una clínica veterinaria revisa el chip y lo llama directamente, sin buscar registros antiguos.\", \"Found by a neighbor\": \"Encontrado por un vecino\", \"They read the number on the collar tag and call. The caller menu gets them to whoever is free.\": \"Leen el número en la placa del collar y llaman. El menú de llamadas los comunica con quien esté disponible.\", \"After you move\": \"Después de mudarse\", \"New phone or new city? Update your contacts in the dashboard. The chip never needs touching.\": \"¿Teléfono nuevo o ciudad nueva? Actualice sus contactos en el panel de control. El chip nunca necesita cambios.\", \"Try the caller menu a finder will hear.\": \"Pruebe el menú de llamadas que escuchará quien encuentre a su mascota.\", \"Add the people who should hear about your pet, set their order, then place a pretend call. The finder hears your lost-pet greeting and presses a number to reach someone.\": \"Agregue a las personas que deben enterarse de lo que pase con su mascota, defina su orden y luego haga una llamada de prueba. Quien la encuentre escucha su saludo de mascota perdida y presiona un número para comunicarse con alguien.\", \"Your pet's contacts\": \"Los contactos de su mascota\", \"/6 contacts\": \"/6 contactos\", \"Place a call to hear the options\": \"Haga una llamada para escuchar las opciones\", \"Callers pick who to reach. Flip a contact to “Busy” to send them to voicemail.\": \"Quien llama elige con quién comunicarse. Marque un contacto como “Ocupado” para enviar la llamada al buzón de voz.\", \"Why pet owners choose iCanCall\": \"Por qué los dueños de mascotas eligen iCanCall\", \"Built so a found pet always finds its way home.\": \"Creado para que una mascota encontrada siempre vuelva a casa.\", \"A number that never goes stale\": \"Un número que nunca se queda viejo\", \"Change phones, move house, add a pet sitter. Update the dashboard and the chip keeps working.\": \"Cambie de teléfono, múdese, agregue a un cuidador de mascotas. Actualice el panel de control y el chip sigue funcionando.\", \"A greeting made for finders\": \"Un saludo pensado para quien la encuentre\", \"Every call starts with your lost-pet message, so shelters and neighbors know they have reached the right place.\": \"Cada llamada empieza con su mensaje de mascota perdida, para que refugios y vecinos sepan que llamaron al lugar correcto.\", \"A caller menu for six contacts\": \"Un menú de llamadas para seis contactos\", \"Finders press a number to reach you, your partner, a neighbor or the dog walker, in the order you choose.\": \"Quien encuentre a su mascota presiona un número para comunicarse con usted, su pareja, un vecino o el paseador de perros, en el orden que usted elija.\", \"You hear about it right away\": \"Usted se entera de inmediato\", \"If nobody picks up, the caller leaves a voicemail and you get a text and an email straight away.\": \"Si nadie contesta, quien llama deja un mensaje de voz y usted recibe de inmediato un mensaje de texto y un correo electrónico.\", \"Held for 6 months if you lapse\": \"Reservado 6 meses si su plan vence\", \"Miss a renewal and we keep your number for 6 months, still ringing your main contact, so the chip keeps working.\": \"Si no renueva a tiempo, guardamos su número durante 6 meses y sigue llamando a su contacto principal, para que el chip siga funcionando.\", \"Your numbers stay private\": \"Sus números siguen siendo privados\", \"Finders only ever see your iCanCall number, never your personal phone numbers.\": \"Quien encuentre a su mascota solo ve su número iCanCall, nunca sus números de teléfono personales.\", \"Less than $2.50 a month, paid once a year.\": \"Menos de $2.50 al mes, pagado una vez al año.\", \"Pay once a year, or once for your pet's whole life. There are no monthly plans and no setup fees.\": \"Pague una vez al año, o una sola vez por toda la vida de su mascota. No hay planes mensuales ni tarifas de configuración.\", \"One lost-pet number for every pet in your home.\": \"Un número para mascotas perdidas para todas las mascotas de su hogar.\", \"/ year\": \"/ año\", \"Billed once a year\": \"Facturado una vez al año\", \"1 dedicated lost-pet number\": \"1 número exclusivo para mascotas perdidas\", \"Caller menu with up to 6 contacts\": \"Menú de llamadas con hasta 6 contactos\", \"Lost-pet greeting on every call\": \"Saludo de mascota perdida en cada llamada\", \"Voicemail with text and email alerts\": \"Buzón de voz con alertas por mensaje de texto y correo\", \"30 minutes of calls per year\": \"30 minutos de llamadas al año\", \"Incoming calls only\": \"Solo llamadas entrantes\", \"Works with any microchip registry\": \"Funciona con cualquier registro de microchips\", \"Number held 6 months if your plan lapses\": \"Número reservado 6 meses si su plan vence\", \"Pay once\": \"Pago único\", \"Lifetime\": \"Vitalicio\", \"One payment for one pet's whole life.\": \"Un solo pago por toda la vida de una mascota.\", \"one time\": \"pago único\", \"For your pet's life, up to 20 years\": \"Durante la vida de su mascota, hasta 20 años\", \"Everything in Annual, for one enrolled pet\": \"Todo lo del plan Anual, para una mascota inscrita\", \"Covers your pet's life, up to 20 years\": \"Cubre la vida de su mascota, hasta 20 años\", \"No yearly renewals\": \"Sin renovaciones anuales\", \"A yearly check-in email keeps the line active\": \"Un correo de verificación anual mantiene la línea activa\", \"Lifetime, Small Bird Lifetime and Parrot plans cover one enrolled pet. Lifetime plans last for the life of the enrolled pet or 20 years from purchase, whichever comes first. Each year we email you to confirm the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line. Prices are in US dollars.\": \"Los planes Vitalicio, Vitalicio Aves Pequeñas y Loro cubren una mascota inscrita. Los planes vitalicios duran la vida de la mascota inscrita o 20 años desde la compra, lo que ocurra primero. Cada año le enviamos un correo para confirmar que la línea todavía se necesita. Si pasan dos años sin respuesta y sin llamadas, enviamos un aviso final y luego cerramos la línea. Los precios están en dólares estadounidenses.\", \"Pet plans open soon.\": \"Los planes para mascotas abren pronto.\", \"Join the launch list and we'll email you the day sign-up opens.\": \"Únase a la lista de lanzamiento y le enviaremos un correo el día en que abran las inscripciones.\", \"Parrots and other birds\": \"Loros y otras aves\", \"Built for birds that live for decades.\": \"Creado para aves que viven décadas.\", \"A budgie might live ten years. A macaw can live eighty. iCanCall Pets has plans for every size of bird, and a way to pass the line on when a parrot changes homes.\": \"Un periquito puede vivir diez años. Un guacamayo puede vivir ochenta. iCanCall Pets tiene planes para aves de todos los tamaños, y una forma de traspasar la línea cuando un loro cambia de hogar.\", \"Budgie, lovebird, parrotlet\": \"Periquito, inseparable, cotorrita\", \"Typically 5 to 15 years.\": \"Normalmente de 5 a 15 años.\", \"Small Bird Lifetime\": \"Vitalicio Aves Pequeñas\", \"Cockatiel\": \"Cacatúa ninfa\", \"Typically 15 to 25 years.\": \"Normalmente de 15 a 25 años.\", \"African grey, Amazon, cockatoo\": \"Loro gris africano, amazona, cacatúa\", \"Typically 40 to 70 years.\": \"Normalmente de 40 a 70 años.\", \"Parrot 10-Year or 20-Year\": \"Loro 10 Años o 20 Años\", \"Macaw\": \"Guacamayo\", \"Typically 50 to 80 years.\": \"Normalmente de 50 a 80 años.\", \"Name a successor\": \"Designe un sucesor\", \"When your parrot changes homes, the number goes too.\": \"Cuando su loro cambia de hogar, el número se va con él.\", \"Parrots often outlive their owners or move to new homes. Name a backup person, like a family member or a bird rescue, who takes over the line if you can no longer care for your bird.\": \"Los loros a menudo sobreviven a sus dueños o se mudan a nuevos hogares. Designe a una persona de respaldo, como un familiar o un refugio de aves, que se haga cargo de la línea si usted ya no puede cuidar de su ave.\", \"Not every bird has a microchip. Put the number on a cage tag, travel carrier and rescue paperwork too.\": \"No todas las aves tienen microchip. Ponga el número también en una etiqueta de la jaula, en el transportín y en los documentos del refugio.\", \"The line moves to the new owner for free\": \"La línea pasa al nuevo dueño sin costo\", \"Any prepaid time moves with it\": \"Cualquier tiempo prepagado pasa con ella\", \"The number on the chip and paperwork stays the same\": \"El número del chip y de los documentos sigue siendo el mismo\", \"As many moves as your bird needs\": \"Tantos cambios de hogar como su ave necesite\", \"Budgies, lovebirds, parrotlets and cockatiels.\": \"Periquitos, inseparables, cotorritas y cacatúas ninfa.\", \"For your bird's life, up to 20 years\": \"Durante la vida de su ave, hasta 20 años\", \"Everything in Annual, for one bird\": \"Todo lo del plan Anual, para un ave\", \"Named successor, free transfers\": \"Sucesor designado, traspasos gratuitos\", \"Large parrots\": \"Loros grandes\", \"Parrot 10-Year\": \"Loro 10 Años\", \"African greys, Amazons, cockatoos and macaws.\": \"Loros grises africanos, amazonas, cacatúas y guacamayos.\", \"10 years of service, then renew\": \"10 años de servicio, luego se renueva\", \"10 years prepaid\": \"10 años prepagados\", \"Renews at the price in effect at renewal\": \"Se renueva al precio vigente en el momento de la renovación\", \"Parrot 20-Year\": \"Loro 20 Años\", \"The longest cover for long-lived parrots.\": \"La cobertura más larga para loros longevos.\", \"20 years of service, then renew\": \"20 años de servicio, luego se renueva\", \"20 years prepaid\": \"20 años prepagados\", \"Any bird can also use the $29 Annual plan.\": \"Cualquier ave también puede usar el plan Anual de $29.\", \"What pet owners ask us most.\": \"Lo que más nos preguntan los dueños de mascotas.\", \"Do I need a new microchip?\": \"¿Necesito un microchip nuevo?\", \"No. Your pet keeps the chip it has. Log in to the registry where the chip is registered and change the phone number to your iCanCall number. After that, you never need to update the registry again.\": \"No. Su mascota conserva el chip que ya tiene. Inicie sesión en el registro donde está registrado el chip y cambie el número de teléfono por su número iCanCall. Después de eso, nunca más tendrá que actualizar el registro.\", \"What happens when someone calls the number?\": \"¿Qué pasa cuando alguien llama al número?\", \"They hear your lost-pet greeting, then a caller menu with up to six contacts. They press a number to reach the person they want, and the call connects straight through.\": \"Escucha su saludo de mascota perdida y luego un menú de llamadas con hasta seis contactos. Presiona un número para comunicarse con la persona que quiere, y la llamada se conecta directamente.\", \"What if nobody picks up?\": \"¿Y si nadie contesta?\", \"The caller can leave a voicemail, and you get a text and an email straight away so you can call them back.\": \"Quien llama puede dejar un mensaje de voz, y usted recibe de inmediato un mensaje de texto y un correo electrónico para que pueda devolverle la llamada.\", \"Can one number cover all my pets?\": \"¿Un solo número puede cubrir a todas mis mascotas?\", \"Yes, on the Annual plan. Every chip in your home can carry the same number. Lifetime and Parrot plans cover one enrolled pet each.\": \"Sí, con el plan Anual. Todos los chips de su hogar pueden llevar el mismo número. Los planes Vitalicio y Loro cubren una mascota inscrita cada uno.\", \"Why 30 minutes a year, and incoming calls only?\": \"¿Por qué 30 minutos al año y solo llamadas entrantes?\", \"A lost-pet line gets a few short calls a year, so 30 minutes is plenty. The line only takes incoming calls and always plays your lost-pet greeting, which keeps the price low. We email you if you get close to the limit.\": \"Una línea para mascotas perdidas recibe unas pocas llamadas cortas al año, así que 30 minutos son de sobra. La línea solo recibe llamadas entrantes y siempre reproduce su saludo de mascota perdida, lo que mantiene el precio bajo. Le enviamos un correo si se acerca al límite.\", \"What happens if my Annual plan lapses?\": \"¿Qué pasa si mi plan Anual vence?\", \"We hold your number for 6 months. During that time, callers hear a short message that the plan has lapsed, and the call still rings your main contact. We email you before the number is released so you can renew or update your microchip registry.\": \"Reservamos su número durante 6 meses. Durante ese tiempo, quienes llaman escuchan un breve mensaje de que el plan ha vencido, y la llamada sigue sonando en su contacto principal. Le enviamos un correo antes de liberar el número para que pueda renovar o actualizar el registro de su microchip.\", \"How does the Lifetime plan work?\": \"¿Cómo funciona el plan Vitalicio?\", \"You pay once and the line covers one enrolled pet for its life, or 20 years from purchase, whichever comes first. Once a year we email you to check the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line.\": \"Usted paga una sola vez y la línea cubre a una mascota inscrita durante su vida, o 20 años desde la compra, lo que ocurra primero. Una vez al año le enviamos un correo para verificar que la línea todavía se necesita. Si pasan dos años sin respuesta y sin llamadas, enviamos un aviso final y luego cerramos la línea.\", \"What happens if my parrot outlives me?\": \"¿Qué pasa si mi loro me sobrevive?\", \"Name a successor, like a family member or a bird rescue. If you can no longer care for your bird, the line moves to them for free, along with any prepaid time. The number on the chip and paperwork stays the same.\": \"Designe un sucesor, como un familiar o un refugio de aves. Si usted ya no puede cuidar de su ave, la línea pasa a esa persona sin costo, junto con cualquier tiempo prepagado. El número del chip y de los documentos sigue siendo el mismo.\", \"Put a number on the chip that keeps up with you.\": \"Ponga en el chip un número que se mantenga al día con usted.\", \"Pet plans open soon. Join the launch list and we'll email you the day sign-up opens.\": \"Los planes para mascotas abren pronto. Únase a la lista de lanzamiento y le enviaremos un correo el día en que abran las inscripciones.\", \"Annual or lifetime · Works with any microchip registry · 14-day service guarantee\": \"Anual o vitalicio · Funciona con cualquier registro de microchips · Garantía de servicio de 14 días\", \"One lost-pet number on your pet's microchip that always reaches you, even after you move or change phones.\": \"Un número para mascotas perdidas en el microchip de su mascota que siempre lo encuentra a usted, incluso después de mudarse o cambiar de teléfono.\", \"Annual\": \"Anual\"}, \"attrs\": {\"Your email address\": \"Su correo electrónico\"}}, \"fr\": {\"text\": {\"Why chips fail\": \"Pourquoi les puces échouent\", \"Parrots\": \"Perroquets\", \"Questions\": \"Questions\", \"Join the launch list\": \"Rejoindre la liste de lancement\", \"For dogs, cats and parrots\": \"Pour les chiens, les chats et les perroquets\", \"One number on the chip.\": \"Un seul numéro sur la puce.\", \"It never goes out of date.\": \"Il ne devient jamais obsolète.\", \"Put your iCanCall number on your pet's microchip once. When you move or change phones, update your contacts in the dashboard. The chip keeps reaching you, and you never have to update the registry again.\": \"Inscrivez une seule fois votre numéro iCanCall sur la puce électronique de votre animal. Quand vous déménagez ou changez de téléphone, mettez à jour vos contacts dans le tableau de bord. La puce continue de vous joindre, et vous n'avez plus jamais à mettre à jour le registre.\", \"Works with any microchip registry.\": \"Fonctionne avec tous les registres de puces.\", \"Keep the registry you already use. Just put your iCanCall number on file.\": \"Gardez le registre que vous utilisez déjà. Il suffit d'y enregistrer votre numéro iCanCall.\", \"Max's microchip number\": \"Numéro de puce de Max\", \"A shelter scans Max's chip and calls. The caller menu lets them pick who to reach\": \"Un refuge scanne la puce de Max et appelle. Le menu vocal lui permet de choisir qui joindre\", \"Owner\": \"Propriétaire\", \"Partner\": \"Conjoint\", \"Dog walker\": \"Promeneur de chiens\", \"Made for the day your pet goes missing\": \"Pensé pour le jour où votre animal disparaît\", \"number on the chip\": \"numéro sur la puce\", \"contacts in the caller menu\": \"contacts dans le menu vocal\", \"registry updates when you move\": \"mise à jour du registre en cas de déménagement\", \"microchip registry\": \"registre de puces\", \"The chip works. The phone number doesn't.\": \"La puce fonctionne. Le numéro de téléphone, non.\", \"This is the most common reason microchips fail to reunite lost dogs with their owners: not a chip malfunction, but outdated contact details. iCanCall puts a number on the chip that keeps up with you.\": \"C'est la raison la plus fréquente pour laquelle les puces ne permettent pas de réunir les chiens perdus avec leurs propriétaires : non pas une panne de la puce, mais des coordonnées obsolètes. iCanCall inscrit sur la puce un numéro qui vous suit.\", \"A number that goes stale\": \"Un numéro qui devient obsolète\", \"You register the chip once, then life moves on. New phone, new house, and the registry still has the old details.\": \"Vous enregistrez la puce une fois, puis la vie suit son cours. Nouveau téléphone, nouvelle maison, et le registre conserve les anciennes coordonnées.\", \"Registry phone\": \"Téléphone enregistré\", \"Old cell\": \"Ancien portable\", \"Home address\": \"Adresse\", \"Moved\": \"Déménagé\", \"Backup contact\": \"Contact de secours\", \"None\": \"Aucun\", \"Last updated\": \"Dernière mise à jour\", \"Years ago\": \"Il y a des années\", \"\\\"The number you have dialed is no longer in service.\\\"\": \"« Le numéro que vous avez composé n'est plus attribué. »\", \"A number that keeps up with you\": \"Un numéro qui vous suit\", \"The number on the chip never changes. You change who it reaches, any time, from your phone.\": \"Le numéro sur la puce ne change jamais. C'est vous qui choisissez qui il joint, à tout moment, depuis votre téléphone.\", \"\\\"New phone, new house, same number on the chip.\\\"\": \"« Nouveau téléphone, nouvelle maison, même numéro sur la puce. »\", \"Set it up once. Keep it current forever.\": \"Configurez-le une fois. Gardez-le à jour pour toujours.\", \"A few minutes of setup means the number on your pet's chip always reaches someone who can help.\": \"Quelques minutes de configuration, et le numéro sur la puce de votre animal joint toujours quelqu'un qui peut aider.\", \"Get your pet number\": \"Obtenez le numéro de votre animal\", \"Pick an iCanCall number for your pet. One number can cover every pet in your home.\": \"Choisissez un numéro iCanCall pour votre animal. Un seul numéro peut couvrir tous les animaux de votre foyer.\", \"Put it on the chip\": \"Inscrivez-le sur la puce\", \"Log in to the registry where your pet's chip is registered and set your iCanCall number as the phone number. Add it to the collar tag too.\": \"Connectez-vous au registre où la puce de votre animal est enregistrée et indiquez votre numéro iCanCall comme numéro de téléphone. Ajoutez-le aussi sur la médaille du collier.\", \"Add up to six contacts\": \"Ajoutez jusqu'à six contacts\", \"You, your partner, a neighbor, the dog walker. When someone calls, they hear your lost-pet greeting and use the caller menu to pick who to reach.\": \"Vous, votre conjoint, un voisin, le promeneur de chiens. Quand quelqu'un appelle, il entend votre message d'accueil pour animal perdu et utilise le menu vocal pour choisir qui joindre.\", \"Wherever they turn up\": \"Où qu'il soit retrouvé\", \"The same number works wherever your pet is found.\": \"Le même numéro fonctionne partout où votre animal est retrouvé.\", \"Shelters, vets and neighbors all reach you the same way: one number, from any phone.\": \"Refuges, vétérinaires et voisins vous joignent tous de la même façon : un seul numéro, depuis n'importe quel téléphone.\", \"Scanned at a shelter\": \"Scanné dans un refuge\", \"Staff scan the chip, call the number, and hear your lost-pet greeting straight away.\": \"Le personnel scanne la puce, appelle le numéro et entend immédiatement votre message d'accueil pour animal perdu.\", \"Scanned at a vet\": \"Scanné chez un vétérinaire\", \"A vet clinic checks the chip and calls you directly, without searching for old records.\": \"Une clinique vétérinaire vérifie la puce et vous appelle directement, sans chercher d'anciens dossiers.\", \"Found by a neighbor\": \"Trouvé par un voisin\", \"They read the number on the collar tag and call. The caller menu gets them to whoever is free.\": \"Il lit le numéro sur la médaille du collier et appelle. Le menu vocal le met en relation avec la personne disponible.\", \"After you move\": \"Après un déménagement\", \"New phone or new city? Update your contacts in the dashboard. The chip never needs touching.\": \"Nouveau téléphone ou nouvelle ville ? Mettez à jour vos contacts dans le tableau de bord. Il n'y a jamais besoin de toucher à la puce.\", \"Try the caller menu a finder will hear.\": \"Essayez le menu vocal qu'entendra la personne qui trouve votre animal.\", \"Add the people who should hear about your pet, set their order, then place a pretend call. The finder hears your lost-pet greeting and presses a number to reach someone.\": \"Ajoutez les personnes qui doivent être prévenues pour votre animal, définissez leur ordre, puis passez un appel fictif. La personne qui le trouve entend votre message d'accueil pour animal perdu et appuie sur un chiffre pour joindre quelqu'un.\", \"Your pet's contacts\": \"Les contacts de votre animal\", \"/6 contacts\": \"/6 contacts\", \"Place a call to hear the options\": \"Passez un appel pour entendre les options\", \"Callers pick who to reach. Flip a contact to “Busy” to send them to voicemail.\": \"L'appelant choisit qui joindre. Passez un contact en « Occupé » pour renvoyer l'appel vers la messagerie vocale.\", \"Why pet owners choose iCanCall\": \"Pourquoi les propriétaires d'animaux choisissent iCanCall\", \"Built so a found pet always finds its way home.\": \"Conçu pour qu'un animal retrouvé rentre toujours à la maison.\", \"A number that never goes stale\": \"Un numéro qui ne devient jamais obsolète\", \"Change phones, move house, add a pet sitter. Update the dashboard and the chip keeps working.\": \"Changez de téléphone, déménagez, ajoutez un pet-sitter. Mettez à jour le tableau de bord et la puce continue de fonctionner.\", \"A greeting made for finders\": \"Un message d'accueil pensé pour ceux qui le trouvent\", \"Every call starts with your lost-pet message, so shelters and neighbors know they have reached the right place.\": \"Chaque appel commence par votre message pour animal perdu, pour que refuges et voisins sachent qu'ils sont au bon endroit.\", \"A caller menu for six contacts\": \"Un menu vocal pour six contacts\", \"Finders press a number to reach you, your partner, a neighbor or the dog walker, in the order you choose.\": \"La personne qui trouve votre animal appuie sur un chiffre pour vous joindre, ou joindre votre conjoint, un voisin ou le promeneur de chiens, dans l'ordre que vous choisissez.\", \"You hear about it right away\": \"Vous êtes prévenu immédiatement\", \"If nobody picks up, the caller leaves a voicemail and you get a text and an email straight away.\": \"Si personne ne décroche, l'appelant laisse un message vocal et vous recevez immédiatement un SMS et un e-mail.\", \"Held for 6 months if you lapse\": \"Conservé 6 mois en cas de non-renouvellement\", \"Miss a renewal and we keep your number for 6 months, still ringing your main contact, so the chip keeps working.\": \"Si vous oubliez un renouvellement, nous conservons votre numéro pendant 6 mois, et il sonne toujours chez votre contact principal, pour que la puce continue de fonctionner.\", \"Your numbers stay private\": \"Vos numéros restent privés\", \"Finders only ever see your iCanCall number, never your personal phone numbers.\": \"Les personnes qui trouvent votre animal ne voient que votre numéro iCanCall, jamais vos numéros personnels.\", \"Less than $2.50 a month, paid once a year.\": \"Moins de $2.50 par mois, payé une fois par an.\", \"Pay once a year, or once for your pet's whole life. There are no monthly plans and no setup fees.\": \"Payez une fois par an, ou une seule fois pour toute la vie de votre animal. Aucun forfait mensuel et aucun frais d'activation.\", \"One lost-pet number for every pet in your home.\": \"Un seul numéro pour animal perdu pour tous les animaux de votre foyer.\", \"/ year\": \"/ an\", \"Billed once a year\": \"Facturé une fois par an\", \"1 dedicated lost-pet number\": \"1 numéro dédié aux animaux perdus\", \"Caller menu with up to 6 contacts\": \"Menu vocal avec jusqu'à 6 contacts\", \"Lost-pet greeting on every call\": \"Message d'accueil pour animal perdu à chaque appel\", \"Voicemail with text and email alerts\": \"Messagerie vocale avec alertes SMS et e-mail\", \"30 minutes of calls per year\": \"30 minutes d'appel par an\", \"Incoming calls only\": \"Appels entrants uniquement\", \"Works with any microchip registry\": \"Fonctionne avec tous les registres de puces\", \"Number held 6 months if your plan lapses\": \"Numéro conservé 6 mois si votre forfait expire\", \"Pay once\": \"Paiement unique\", \"Lifetime\": \"À vie\", \"One payment for one pet's whole life.\": \"Un seul paiement pour toute la vie d'un animal.\", \"one time\": \"une fois\", \"For your pet's life, up to 20 years\": \"Pour la vie de votre animal, jusqu'à 20 ans\", \"Everything in Annual, for one enrolled pet\": \"Tout le forfait Annuel, pour un animal inscrit\", \"Covers your pet's life, up to 20 years\": \"Couvre la vie de votre animal, jusqu'à 20 ans\", \"No yearly renewals\": \"Aucun renouvellement annuel\", \"A yearly check-in email keeps the line active\": \"Un e-mail de vérification annuel maintient la ligne active\", \"Lifetime, Small Bird Lifetime and Parrot plans cover one enrolled pet. Lifetime plans last for the life of the enrolled pet or 20 years from purchase, whichever comes first. Each year we email you to confirm the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line. Prices are in US dollars.\": \"Les forfaits À vie, À vie Petits oiseaux et Perroquet couvrent un animal inscrit. Les forfaits à vie durent toute la vie de l'animal inscrit ou 20 ans à compter de l'achat, selon la première échéance. Chaque année, nous vous envoyons un e-mail pour confirmer que la ligne est toujours nécessaire. Si deux ans passent sans réponse ni appel, nous envoyons un dernier avis, puis nous fermons la ligne. Les prix sont en dollars américains.\", \"Pet plans open soon.\": \"Les forfaits pour animaux ouvrent bientôt.\", \"Join the launch list and we'll email you the day sign-up opens.\": \"Inscrivez-vous à la liste de lancement et nous vous enverrons un e-mail le jour de l'ouverture des inscriptions.\", \"Parrots and other birds\": \"Perroquets et autres oiseaux\", \"Built for birds that live for decades.\": \"Conçu pour des oiseaux qui vivent des décennies.\", \"A budgie might live ten years. A macaw can live eighty. iCanCall Pets has plans for every size of bird, and a way to pass the line on when a parrot changes homes.\": \"Une perruche ondulée peut vivre dix ans. Un ara peut vivre quatre-vingts ans. iCanCall Pets propose des forfaits pour les oiseaux de toutes tailles, et un moyen de transmettre la ligne quand un perroquet change de foyer.\", \"Budgie, lovebird, parrotlet\": \"Perruche ondulée, inséparable, toui\", \"Typically 5 to 15 years.\": \"Généralement de 5 à 15 ans.\", \"Small Bird Lifetime\": \"À vie Petits oiseaux\", \"Cockatiel\": \"Calopsitte\", \"Typically 15 to 25 years.\": \"Généralement de 15 à 25 ans.\", \"African grey, Amazon, cockatoo\": \"Gris du Gabon, amazone, cacatoès\", \"Typically 40 to 70 years.\": \"Généralement de 40 à 70 ans.\", \"Parrot 10-Year or 20-Year\": \"Perroquet 10 ans ou 20 ans\", \"Macaw\": \"Ara\", \"Typically 50 to 80 years.\": \"Généralement de 50 à 80 ans.\", \"Name a successor\": \"Désignez un successeur\", \"When your parrot changes homes, the number goes too.\": \"Quand votre perroquet change de foyer, le numéro le suit.\", \"Parrots often outlive their owners or move to new homes. Name a backup person, like a family member or a bird rescue, who takes over the line if you can no longer care for your bird.\": \"Les perroquets survivent souvent à leurs propriétaires ou changent de foyer. Désignez une personne de relais, comme un membre de la famille ou un refuge pour oiseaux, qui reprendra la ligne si vous ne pouvez plus vous occuper de votre oiseau.\", \"Not every bird has a microchip. Put the number on a cage tag, travel carrier and rescue paperwork too.\": \"Tous les oiseaux n'ont pas de puce. Inscrivez aussi le numéro sur une étiquette de cage, la caisse de transport et les documents du refuge.\", \"The line moves to the new owner for free\": \"La ligne est transférée gratuitement au nouveau propriétaire\", \"Any prepaid time moves with it\": \"Tout temps prépayé est transféré avec elle\", \"The number on the chip and paperwork stays the same\": \"Le numéro sur la puce et les documents reste le même\", \"As many moves as your bird needs\": \"Autant de changements de foyer que nécessaire\", \"Budgies, lovebirds, parrotlets and cockatiels.\": \"Perruches ondulées, inséparables, touis et calopsittes.\", \"For your bird's life, up to 20 years\": \"Pour la vie de votre oiseau, jusqu'à 20 ans\", \"Everything in Annual, for one bird\": \"Tout le forfait Annuel, pour un oiseau\", \"Named successor, free transfers\": \"Successeur désigné, transferts gratuits\", \"Large parrots\": \"Grands perroquets\", \"Parrot 10-Year\": \"Perroquet 10 ans\", \"African greys, Amazons, cockatoos and macaws.\": \"Gris du Gabon, amazones, cacatoès et aras.\", \"10 years of service, then renew\": \"10 ans de service, puis renouvellement\", \"10 years prepaid\": \"10 ans prépayés\", \"Renews at the price in effect at renewal\": \"Renouvellement au tarif en vigueur à la date du renouvellement\", \"Parrot 20-Year\": \"Perroquet 20 ans\", \"The longest cover for long-lived parrots.\": \"La couverture la plus longue pour les perroquets qui vivent longtemps.\", \"20 years of service, then renew\": \"20 ans de service, puis renouvellement\", \"20 years prepaid\": \"20 ans prépayés\", \"Any bird can also use the $29 Annual plan.\": \"Tous les oiseaux peuvent aussi utiliser le forfait Annuel à $29.\", \"What pet owners ask us most.\": \"Ce que les propriétaires d'animaux nous demandent le plus.\", \"Do I need a new microchip?\": \"Faut-il une nouvelle puce ?\", \"No. Your pet keeps the chip it has. Log in to the registry where the chip is registered and change the phone number to your iCanCall number. After that, you never need to update the registry again.\": \"Non. Votre animal garde sa puce actuelle. Connectez-vous au registre où la puce est enregistrée et remplacez le numéro de téléphone par votre numéro iCanCall. Ensuite, vous n'aurez plus jamais à mettre à jour le registre.\", \"What happens when someone calls the number?\": \"Que se passe-t-il quand quelqu'un appelle le numéro ?\", \"They hear your lost-pet greeting, then a caller menu with up to six contacts. They press a number to reach the person they want, and the call connects straight through.\": \"Il entend votre message d'accueil pour animal perdu, puis un menu vocal avec jusqu'à six contacts. Il appuie sur un chiffre pour joindre la personne de son choix, et l'appel est transféré directement.\", \"What if nobody picks up?\": \"Et si personne ne décroche ?\", \"The caller can leave a voicemail, and you get a text and an email straight away so you can call them back.\": \"L'appelant peut laisser un message vocal, et vous recevez immédiatement un SMS et un e-mail pour pouvoir le rappeler.\", \"Can one number cover all my pets?\": \"Un seul numéro peut-il couvrir tous mes animaux ?\", \"Yes, on the Annual plan. Every chip in your home can carry the same number. Lifetime and Parrot plans cover one enrolled pet each.\": \"Oui, avec le forfait Annuel. Toutes les puces de votre foyer peuvent porter le même numéro. Les forfaits À vie et Perroquet couvrent chacun un animal inscrit.\", \"Why 30 minutes a year, and incoming calls only?\": \"Pourquoi 30 minutes par an, et uniquement des appels entrants ?\", \"A lost-pet line gets a few short calls a year, so 30 minutes is plenty. The line only takes incoming calls and always plays your lost-pet greeting, which keeps the price low. We email you if you get close to the limit.\": \"Une ligne pour animal perdu reçoit quelques appels courts par an, donc 30 minutes suffisent largement. La ligne ne reçoit que des appels entrants et diffuse toujours votre message d'accueil pour animal perdu, ce qui permet de garder un prix bas. Nous vous envoyons un e-mail si vous approchez de la limite.\", \"What happens if my Annual plan lapses?\": \"Que se passe-t-il si mon forfait Annuel expire ?\", \"We hold your number for 6 months. During that time, callers hear a short message that the plan has lapsed, and the call still rings your main contact. We email you before the number is released so you can renew or update your microchip registry.\": \"Nous conservons votre numéro pendant 6 mois. Pendant cette période, les appelants entendent un court message indiquant que le forfait a expiré, et l'appel sonne toujours chez votre contact principal. Nous vous envoyons un e-mail avant la libération du numéro pour que vous puissiez renouveler ou mettre à jour le registre de votre puce.\", \"How does the Lifetime plan work?\": \"Comment fonctionne le forfait À vie ?\", \"You pay once and the line covers one enrolled pet for its life, or 20 years from purchase, whichever comes first. Once a year we email you to check the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line.\": \"Vous payez une seule fois et la ligne couvre un animal inscrit pendant toute sa vie, ou 20 ans à compter de l'achat, selon la première échéance. Une fois par an, nous vous envoyons un e-mail pour vérifier que la ligne est toujours nécessaire. Si deux ans passent sans réponse ni appel, nous envoyons un dernier avis, puis nous fermons la ligne.\", \"What happens if my parrot outlives me?\": \"Que se passe-t-il si mon perroquet me survit ?\", \"Name a successor, like a family member or a bird rescue. If you can no longer care for your bird, the line moves to them for free, along with any prepaid time. The number on the chip and paperwork stays the same.\": \"Désignez un successeur, comme un membre de la famille ou un refuge pour oiseaux. Si vous ne pouvez plus vous occuper de votre oiseau, la ligne lui est transférée gratuitement, avec tout temps prépayé. Le numéro sur la puce et les documents reste le même.\", \"Put a number on the chip that keeps up with you.\": \"Inscrivez sur la puce un numéro qui vous suit.\", \"Pet plans open soon. Join the launch list and we'll email you the day sign-up opens.\": \"Les forfaits pour animaux ouvrent bientôt. Inscrivez-vous à la liste de lancement et nous vous enverrons un e-mail le jour de l'ouverture des inscriptions.\", \"Annual or lifetime · Works with any microchip registry · 14-day service guarantee\": \"Annuel ou à vie · Fonctionne avec tous les registres de puces · Garantie de service de 14 jours\", \"One lost-pet number on your pet's microchip that always reaches you, even after you move or change phones.\": \"Un seul numéro pour animal perdu sur la puce de votre animal, qui vous joint toujours, même après un déménagement ou un changement de téléphone.\", \"Annual\": \"Annuel\"}, \"attrs\": {\"Your email address\": \"Votre adresse e-mail\"}}, \"ja\": {\"text\": {\"Why chips fail\": \"マイクロチップが役立たない理由\", \"Parrots\": \"インコ・オウム\", \"Questions\": \"よくある質問\", \"Join the launch list\": \"リリース通知に登録\", \"For dogs, cats and parrots\": \"犬・猫・インコ・オウムのために\", \"One number on the chip.\": \"チップには、番号を1つだけ。\", \"It never goes out of date.\": \"その番号は、ずっと古くなりません。\", \"Put your iCanCall number on your pet's microchip once. When you move or change phones, update your contacts in the dashboard. The chip keeps reaching you, and you never have to update the registry again.\": \"ペットのマイクロチップにiCanCallの番号を一度登録するだけ。引っ越しや電話の買い替えのときは、ダッシュボードで連絡先を更新しましょう。チップはいつでもあなたにつながり、登録機関の情報を更新し直す必要は二度とありません。\", \"Works with any microchip registry.\": \"どのマイクロチップ登録機関でも使えます。\", \"Keep the registry you already use. Just put your iCanCall number on file.\": \"今お使いの登録機関はそのままで大丈夫。iCanCallの番号を登録するだけです。\", \"Max's microchip number\": \"マックスのマイクロチップ番号\", \"A shelter scans Max's chip and calls. The caller menu lets them pick who to reach\": \"保護施設がマックスのチップを読み取って電話をかけます。音声ダイヤルメニューで、つなぐ相手を選べます\", \"Owner\": \"飼い主\", \"Partner\": \"パートナー\", \"Dog walker\": \"ドッグウォーカー\", \"Made for the day your pet goes missing\": \"ペットが迷子になったその日のために\", \"number on the chip\": \"チップに登録する番号\", \"contacts in the caller menu\": \"音声ダイヤルメニューの連絡先\", \"registry updates when you move\": \"引っ越し時の登録情報の更新\", \"microchip registry\": \"マイクロチップ登録機関\", \"The chip works. The phone number doesn't.\": \"チップは機能しています。つながらないのは電話番号です。\", \"This is the most common reason microchips fail to reunite lost dogs with their owners: not a chip malfunction, but outdated contact details. iCanCall puts a number on the chip that keeps up with you.\": \"マイクロチップがあっても迷子の犬が飼い主のもとへ戻れない最も多い理由は、チップの故障ではなく、連絡先情報が古いままになっていることです。iCanCallなら、あなたの暮らしの変化についていく番号をチップに登録できます。\", \"A number that goes stale\": \"古くなっていく番号\", \"You register the chip once, then life moves on. New phone, new house, and the registry still has the old details.\": \"チップの登録は一度きり。でも暮らしは変わっていきます。新しい電話、新しい家。それなのに登録機関には古い情報が残ったままです。\", \"Registry phone\": \"登録電話番号\", \"Old cell\": \"古い携帯番号\", \"Home address\": \"自宅住所\", \"Moved\": \"転居済み\", \"Backup contact\": \"予備の連絡先\", \"None\": \"なし\", \"Last updated\": \"最終更新\", \"Years ago\": \"数年前\", \"\\\"The number you have dialed is no longer in service.\\\"\": \"「おかけになった電話番号は、現在使われておりません。」\", \"A number that keeps up with you\": \"あなたについていく番号\", \"The number on the chip never changes. You change who it reaches, any time, from your phone.\": \"チップの番号は変わりません。誰につなぐかは、いつでもあなたの電話から変更できます。\", \"\\\"New phone, new house, same number on the chip.\\\"\": \"「新しい電話、新しい家。チップの番号はそのまま。」\", \"Set it up once. Keep it current forever.\": \"設定は一度だけ。情報はずっと最新に。\", \"A few minutes of setup means the number on your pet's chip always reaches someone who can help.\": \"数分の設定で、ペットのチップの番号が、助けになれる誰かにいつでもつながります。\", \"Get your pet number\": \"ペット用の番号を取得\", \"Pick an iCanCall number for your pet. One number can cover every pet in your home.\": \"ペット用のiCanCall番号を選びます。1つの番号で、ご家庭のすべてのペットをカバーできます。\", \"Put it on the chip\": \"チップに登録\", \"Log in to the registry where your pet's chip is registered and set your iCanCall number as the phone number. Add it to the collar tag too.\": \"ペットのチップが登録されている登録機関にログインし、電話番号をiCanCallの番号に設定します。首輪の迷子札にも書いておきましょう。\", \"Add up to six contacts\": \"連絡先を最大6名まで追加\", \"You, your partner, a neighbor, the dog walker. When someone calls, they hear your lost-pet greeting and use the caller menu to pick who to reach.\": \"あなた、パートナー、ご近所の方、ドッグウォーカー。電話をかけた人には迷子ペット用の音声ガイダンスが流れ、音声ダイヤルメニューでつなぐ相手を選べます。\", \"Wherever they turn up\": \"どこで見つかっても\", \"The same number works wherever your pet is found.\": \"ペットがどこで見つかっても、同じ番号が使えます。\", \"Shelters, vets and neighbors all reach you the same way: one number, from any phone.\": \"保護施設も、動物病院も、ご近所の方も、みんな同じ方法であなたに連絡できます。どの電話からでも、番号は1つです。\", \"Scanned at a shelter\": \"保護施設で読み取り\", \"Staff scan the chip, call the number, and hear your lost-pet greeting straight away.\": \"スタッフがチップを読み取って番号に電話をかけると、すぐに迷子ペット用の音声ガイダンスが流れます。\", \"Scanned at a vet\": \"動物病院で読み取り\", \"A vet clinic checks the chip and calls you directly, without searching for old records.\": \"動物病院がチップを確認し、古い記録を探すことなく、直接あなたに電話できます。\", \"Found by a neighbor\": \"ご近所の方が発見\", \"They read the number on the collar tag and call. The caller menu gets them to whoever is free.\": \"首輪の迷子札の番号を見て電話をかけます。音声ダイヤルメニューで、手の空いている人につながります。\", \"After you move\": \"引っ越したあと\", \"New phone or new city? Update your contacts in the dashboard. The chip never needs touching.\": \"電話を変えた、または別の街に引っ越した？　ダッシュボードで連絡先を更新するだけ。チップに手を加える必要はありません。\", \"Try the caller menu a finder will hear.\": \"発見者が聞く音声ダイヤルメニューを試してみましょう。\", \"Add the people who should hear about your pet, set their order, then place a pretend call. The finder hears your lost-pet greeting and presses a number to reach someone.\": \"ペットのことを知らせたい人を追加して順番を決め、試しに電話をかけてみてください。発見者には迷子ペット用の音声ガイダンスが流れ、番号を押して誰かにつながります。\", \"Your pet's contacts\": \"ペットの連絡先\", \"/6 contacts\": \"/6名の連絡先\", \"Place a call to hear the options\": \"電話をかけて選択肢を聞いてみましょう\", \"Callers pick who to reach. Flip a contact to “Busy” to send them to voicemail.\": \"発信者がつなぐ相手を選びます。連絡先を「話し中」に切り替えると、その人への電話は留守番電話につながります。\", \"Why pet owners choose iCanCall\": \"飼い主の方がiCanCallを選ぶ理由\", \"Built so a found pet always finds its way home.\": \"見つかったペットが、必ずおうちに帰れるように。\", \"A number that never goes stale\": \"いつまでも古くならない番号\", \"Change phones, move house, add a pet sitter. Update the dashboard and the chip keeps working.\": \"電話を変えても、引っ越しても、ペットシッターを追加しても。ダッシュボードを更新すれば、チップは機能し続けます。\", \"A greeting made for finders\": \"発見者のための音声ガイダンス\", \"Every call starts with your lost-pet message, so shelters and neighbors know they have reached the right place.\": \"すべての通話は迷子ペット用のメッセージから始まるので、保護施設やご近所の方は正しい連絡先につながったとすぐにわかります。\", \"A caller menu for six contacts\": \"6名の連絡先に対応する音声ダイヤルメニュー\", \"Finders press a number to reach you, your partner, a neighbor or the dog walker, in the order you choose.\": \"発見者が番号を押すと、あなた、パートナー、ご近所の方、ドッグウォーカーに、あなたが決めた順番でつながります。\", \"You hear about it right away\": \"すぐにお知らせが届きます\", \"If nobody picks up, the caller leaves a voicemail and you get a text and an email straight away.\": \"誰も出ないときは発信者が留守番電話にメッセージを残し、あなたにはすぐにSMSとメールが届きます。\", \"Held for 6 months if you lapse\": \"契約が切れても6ヶ月間保持\", \"Miss a renewal and we keep your number for 6 months, still ringing your main contact, so the chip keeps working.\": \"更新を忘れても番号は6ヶ月間保持され、メインの連絡先に引き続きつながるので、チップは機能し続けます。\", \"Your numbers stay private\": \"あなたの電話番号は非公開のまま\", \"Finders only ever see your iCanCall number, never your personal phone numbers.\": \"発見者に見えるのはiCanCallの番号だけ。あなたの個人の電話番号が知られることはありません。\", \"Less than $2.50 a month, paid once a year.\": \"月額$2.50未満、お支払いは年1回。\", \"Pay once a year, or once for your pet's whole life. There are no monthly plans and no setup fees.\": \"お支払いは年に1回、またはペットの生涯分を1回だけ。月額プランも初期費用もありません。\", \"One lost-pet number for every pet in your home.\": \"ご家庭のすべてのペットに、迷子用の番号を1つ。\", \"/ year\": \"/ 年\", \"Billed once a year\": \"年1回のお支払い\", \"1 dedicated lost-pet number\": \"迷子ペット専用番号 1つ\", \"Caller menu with up to 6 contacts\": \"最大6名の連絡先に対応する音声ダイヤルメニュー\", \"Lost-pet greeting on every call\": \"すべての通話で迷子ペット用の音声ガイダンス\", \"Voicemail with text and email alerts\": \"留守番電話（SMS・メール通知付き）\", \"30 minutes of calls per year\": \"年間30分の通話\", \"Incoming calls only\": \"着信専用\", \"Works with any microchip registry\": \"どのマイクロチップ登録機関にも対応\", \"Number held 6 months if your plan lapses\": \"プランが切れても番号を6ヶ月間保持\", \"Pay once\": \"1回払い\", \"Lifetime\": \"生涯プラン\", \"One payment for one pet's whole life.\": \"1回のお支払いで、1匹のペットの生涯をカバー。\", \"one time\": \"1回のみ\", \"For your pet's life, up to 20 years\": \"ペット
