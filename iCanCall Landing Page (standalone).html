rs<\/li><li><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-check\"><\/use><\/svg>Up to 15 Roster Contacts per Number<\/li><li><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-check\"><\/use><\/svg>All Routing Modes + Scheduling<\/li><li><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-check\"><\/use><\/svg>150 minutes included<\/li><li><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-check\"><\/use><\/svg>2 Caregiver Logins<\/li><li><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-check\"><\/use><\/svg>Works on any phone — no app needed<\/li><li><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-check\"><\/use><\/svg>30-day money-back guarantee<\/li><\/ul><\/article><\/div><div class=\"pricing-guarantee hp-guar\"><span class=\"pricing-guarantee-icon\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-shield\"><\/use><\/svg><\/span><div><h4>30-day money-back guarantee<\/h4><p>A full refund, no questions asked, and no hardware to return.<\/p><\/div><\/div><p class=\"hp-more\">Need more? Extra numbers <span class=\"mono\">$6.99<\/span>/mo each · Extra minutes <span class=\"mono\">$4.99<\/span> per 30.<\/p><div class=\"hp-price-links\"><a class=\"hp-link\" href=\"/contact\">Organizations &amp; teams: talk to us<svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-arrow-r\"><\/use><\/svg><\/a><a class=\"hp-link\" href=\"ICanCall_Comparison_Chart.html\">See how we compare<svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-arrow-r\"><\/use><\/svg><\/a><\/div><\/div><\/section><section class=\"section hp-faq\" id=\"faq\" aria-labelledby=\"faq-title\"><div class=\"wrap\"><div class=\"section-head\"><h2 class=\"hp-h2\" id=\"faq-title\">Questions, answered.<\/h2><\/div><div class=\"faq\"><details class=\"faq-item\" name=\"faq\"><summary class=\"faq-q\">Do I need any special hardware?<span class=\"pm\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-plus\"><\/use><\/svg><\/span><\/summary><div class=\"faq-a\"><p>No. iCanCall is a phone number, not a device. Your loved one dials it from the phone they already have.<\/p><\/div><\/details><details class=\"faq-item\" name=\"faq\"><summary class=\"faq-q\">How does the Call Cascade work?<span class=\"pm\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-plus\"><\/use><\/svg><\/span><\/summary><div class=\"faq-a\"><p>Calls ring your contacts one at a time, in the order you choose. If someone doesn&#x27;t answer, the call moves to the next person. If no one answers, the caller can leave a voicemail. On Pro and Care Team, you&#x27;ll get the transcript by email.<\/p><\/div><\/details><details class=\"faq-item\" name=\"faq\"><summary class=\"faq-q\">Can I have more than one number?<span class=\"pm\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-plus\"><\/use><\/svg><\/span><\/summary><div class=\"faq-a\"><p>Yes. Pro includes 2 numbers and Care Team includes 5. Extra numbers are $6.99/month each.<\/p><\/div><\/details><details class=\"faq-item\" name=\"faq\"><summary class=\"faq-q\">Is there a setup fee or contract?<span class=\"pm\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-plus\"><\/use><\/svg><\/span><\/summary><div class=\"faq-a\"><p>No setup fees, no activation costs, no contracts.<\/p><\/div><\/details><details class=\"faq-item\" name=\"faq\"><summary class=\"faq-q\">What&#x27;s your refund policy?<span class=\"pm\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-plus\"><\/use><\/svg><\/span><\/summary><div class=\"faq-a\"><p>Every plan has a 30-day money-back guarantee. After that you can cancel anytime from your dashboard, and service runs to the end of your billing period.<\/p><\/div><\/details><details class=\"faq-item\" name=\"faq\"><summary class=\"faq-q\">Does the guarantee cover annual plans?<span class=\"pm\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-plus\"><\/use><\/svg><\/span><\/summary><div class=\"faq-a\"><p>Yes, for the first 30 days. After that, annual plans are non-refundable for unused months.<\/p><\/div><\/details><details class=\"faq-item\" name=\"faq\"><summary class=\"faq-q\">Is my family&#x27;s information private?<span class=\"pm\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-plus\"><\/use><\/svg><\/span><\/summary><div class=\"faq-a\"><p>Yes. Personal numbers stay hidden behind your iCanCall line, and we never sell your data.<\/p><\/div><\/details><details class=\"faq-item\" name=\"faq\"><summary class=\"faq-q\">How quickly can I get set up?<span class=\"pm\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-plus\"><\/use><\/svg><\/span><\/summary><div class=\"faq-a\"><p>Most families are live in under five minutes: claim a number, add your contacts, done.<\/p><\/div><\/details><details class=\"faq-item\" name=\"faq\"><summary class=\"faq-q\">Is iCanCall an emergency service?<span class=\"pm\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-plus\"><\/use><\/svg><\/span><\/summary><div class=\"faq-a\"><p>No. It helps your family reach each other quickly and complements, but doesn&#x27;t replace, 911 or a medical alert service.<\/p><\/div><\/details><\/div><\/div><\/section><section class=\"hp-final hp-dark\" id=\"start\" aria-labelledby=\"final-title\"><div class=\"hp-final-glow\" aria-hidden=\"true\"><\/div><div class=\"wrap hp-final-grid\"><div class=\"hp-final-copy\"><h2 class=\"hp-h2\" id=\"final-title\">Give them one number. Give yourself peace of mind.<\/h2><p class=\"lead\">Set up in under five minutes. Your family can start calling today.<\/p><div class=\"hp-ctas\"><a class=\"btn btn-primary btn-lg\" href=\"#pricing\">Get started<\/a><a class=\"btn btn-ghost btn-lg hp-on-dark\" href=\"/contact\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-headset\"><\/use><\/svg>Talk to a real person<\/a><\/div><p class=\"hp-fine\"><span>No setup fees<\/span><span class=\"sep\" aria-hidden=\"true\">·<\/span><span>Cancel anytime<\/span><span class=\"sep\" aria-hidden=\"true\">·<\/span><span>30-day money-back guarantee<\/span><\/p><\/div><div class
