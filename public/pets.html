er das Sprachmenü wählt es, wen es erreichen möchte\", \"Owner\": \"Besitzer\", \"Partner\": \"Partner\", \"Dog walker\": \"Gassigeher\", \"Made for the day your pet goes missing\": \"Gemacht für den Tag, an dem Ihr Tier verschwindet\", \"number on the chip\": \"Nummer auf dem Chip\", \"contacts in the caller menu\": \"Kontakte im Sprachmenü\", \"registry updates when you move\": \"Register-Änderungen bei einem Umzug\", \"microchip registry\": \"Mikrochip-Register\", \"The chip works. The phone number doesn't.\": \"Der Chip funktioniert. Die Telefonnummer nicht.\", \"This is the most common reason microchips fail to reunite lost dogs with their owners: not a chip malfunction, but outdated contact details. iCanCall puts a number on the chip that keeps up with you.\": \"Das ist der häufigste Grund, warum Mikrochips verlorene Hunde nicht zu ihren Besitzern zurückbringen: kein defekter Chip, sondern veraltete Kontaktdaten. iCanCall hinterlegt auf dem Chip eine Nummer, die mit Ihnen Schritt hält.\", \"A number that goes stale\": \"Eine Nummer, die veraltet\", \"You register the chip once, then life moves on. New phone, new house, and the registry still has the old details.\": \"Sie registrieren den Chip einmal, dann geht das Leben weiter. Neues Handy, neues Zuhause, und im Register stehen noch die alten Daten.\", \"Registry phone\": \"Telefon im Register\", \"Old cell\": \"Altes Handy\", \"Home address\": \"Wohnadresse\", \"Moved\": \"Umgezogen\", \"Backup contact\": \"Notfallkontakt\", \"None\": \"Keiner\", \"Last updated\": \"Zuletzt aktualisiert\", \"Years ago\": \"Vor Jahren\", \"\\\"The number you have dialed is no longer in service.\\\"\": \"„Kein Anschluss unter dieser Nummer.“\", \"A number that keeps up with you\": \"Eine Nummer, die mit Ihnen Schritt hält\", \"The number on the chip never changes. You change who it reaches, any time, from your phone.\": \"Die Nummer auf dem Chip ändert sich nie. Wen sie erreicht, ändern Sie jederzeit vom Handy aus.\", \"\\\"New phone, new house, same number on the chip.\\\"\": \"„Neues Handy, neues Zuhause, dieselbe Nummer auf dem Chip.“\", \"Set it up once. Keep it current forever.\": \"Einmal einrichten. Für immer aktuell.\", \"A few minutes of setup means the number on your pet's chip always reaches someone who can help.\": \"Ein paar Minuten Einrichtung, und die Nummer auf dem Chip Ihres Tieres erreicht immer jemanden, der helfen kann.\", \"Get your pet number\": \"Haustiernummer sichern\", \"Pick an iCanCall number for your pet. One number can cover every pet in your home.\": \"Wählen Sie eine iCanCall-Nummer für Ihr Tier. Eine Nummer kann alle Tiere in Ihrem Haushalt abdecken.\", \"Put it on the chip\": \"Auf dem Chip hinterlegen\", \"Log in to the registry where your pet's chip is registered and set your iCanCall number as the phone number. Add it to the collar tag too.\": \"Melden Sie sich bei dem Register an, bei dem der Chip Ihres Tieres registriert ist, und tragen Sie Ihre iCanCall-Nummer als Telefonnummer ein. Bringen Sie sie auch auf der Halsbandmarke an.\", \"Add up to six contacts\": \"Bis zu sechs Kontakte hinzufügen\", \"You, your partner, a neighbor, the dog walker. When someone calls, they hear your lost-pet greeting and use the caller menu to pick who to reach.\": \"Sie, Ihr Partner, ein Nachbar, der Gassigeher. Wenn jemand anruft, hört er Ihre Ansage für vermisste Tiere und wählt über das Sprachmenü, wen er erreichen möchte.\", \"Wherever they turn up\": \"Wo immer es auftaucht\", \"The same number works wherever your pet is found.\": \"Dieselbe Nummer funktioniert überall, wo Ihr Tier gefunden wird.\", \"Shelters, vets and neighbors all reach you the same way: one number, from any phone.\": \"Tierheime, Tierärzte und Nachbarn erreichen Sie alle auf dieselbe Weise: eine Nummer, von jedem Telefon aus.\", \"Scanned at a shelter\": \"Im Tierheim gescannt\", \"Staff scan the chip, call the number, and hear your lost-pet greeting straight away.\": \"Die Mitarbeiter scannen den Chip, rufen die Nummer an und hören sofort Ihre Ansage für vermisste Tiere.\", \"Scanned at a vet\": \"Beim Tierarzt gescannt\", \"A vet clinic checks the chip and calls you directly, without searching for old records.\": \"Eine Tierarztpraxis prüft den Chip und ruft Sie direkt an, ohne nach alten Daten suchen zu müssen.\", \"Found by a neighbor\": \"Von einem Nachbarn gefunden\", \"They read the number on the collar tag and call. The caller menu gets them to whoever is free.\": \"Er liest die Nummer auf der Halsbandmarke und ruft an. Das Sprachmenü verbindet ihn mit dem, der gerade Zeit hat.\", \"After you move\": \"Nach einem Umzug\", \"New phone or new city? Update your contacts in the dashboard. The chip never needs touching.\": \"Neues Handy oder neue Stadt? Aktualisieren Sie Ihre Kontakte im Dashboard. Am Chip müssen Sie nichts ändern.\", \"Try the caller menu a finder will hear.\": \"Probieren Sie das Sprachmenü aus, das ein Finder hört.\", \"Add the people who should hear about your pet, set their order, then place a pretend call. The finder hears your lost-pet greeting and presses a number to reach someone.\": \"Fügen Sie die Personen hinzu, die von Ihrem Tier erfahren sollen, legen Sie die Reihenfolge fest und starten Sie dann einen Probeanruf. Der Finder hört Ihre Ansage für vermisste Tiere und drückt eine Taste, um jemanden zu erreichen.\", \"Your pet's contacts\": \"Kontakte Ihres Tieres\", \"/6 contacts\": \"/6 Kontakte\", \"Place a call to hear the options\": \"Starten Sie einen Anruf, um die Optionen zu hören\", \"Callers pick who to reach. Flip a contact to “Busy” to send them to voicemail.\": \"Anrufer wählen, wen sie erreichen möchten. Schalten Sie einen Kontakt auf „Besetzt“, um ihn zur Mailbox weiterzuleiten.\", \"Why pet owners choose iCanCall\": \"Warum Tierbesitzer iCanCall wählen\", \"Built so a found pet always finds its way home.\": \"Damit ein gefundenes Tier immer den Weg nach Hause findet.\", \"A number that never goes stale\": \"Eine Nummer, die nie veraltet\", \"Change phones, move house, add a pet sitter. Update the dashboard and the chip keeps working.\": \"Neues Handy, Umzug, ein neuer Tiersitter: Aktualisieren Sie das Dashboard, und der Chip funktioniert weiter.\", \"A greeting made for finders\": \"Eine Ansage für Finder\", \"Every call starts with your lost-pet message, so shelters and neighbors know they have reached the right place.\": \"Jeder Anruf beginnt mit Ihrer Nachricht für vermisste Tiere, damit Tierheime und Nachbarn wissen, dass sie richtig sind.\", \"A caller menu for six contacts\": \"Ein Sprachmenü für sechs Kontakte\", \"Finders press a number to reach you, your partner, a neighbor or the dog walker, in the order you choose.\": \"Finder drücken eine Taste, um Sie, Ihren Partner, einen Nachbarn oder den Gassigeher zu erreichen, in der Reihenfolge, die Sie festlegen.\", \"You hear about it right away\": \"Sie erfahren es sofort\", \"If nobody picks up, the caller leaves a voicemail and you get a text and an email straight away.\": \"Wenn niemand abnimmt, hinterlässt der Anrufer eine Mailbox-Nachricht, und Sie erhalten sofort eine SMS und eine E-Mail.\", \"Held for 6 months if you lapse\": \"6 Monate reserviert, falls Ihr Tarif ausläuft\", \"Miss a renewal and we keep your number for 6 months, still ringing your main contact, so the chip keeps working.\": \"Verpassen Sie eine Verlängerung, halten wir Ihre Nummer 6 Monate lang für Sie bereit. Sie klingelt weiterhin bei Ihrem Hauptkontakt, damit der Chip funktioniert.\", \"Your numbers stay private\": \"Ihre Nummern bleiben privat\", \"Finders only ever see your iCanCall number, never your personal phone numbers.\": \"Finder sehen immer nur Ihre iCanCall-Nummer, niemals Ihre privaten Telefonnummern.\", \"Less than $2.50 a month, paid once a year.\": \"Weniger als $2.50 im Monat, einmal jährlich bezahlt.\", \"Pay once a year, or once for your pet's whole life. There are no monthly plans and no setup fees.\": \"Zahlen Sie einmal im Jahr oder einmal für das ganze Leben Ihres Tieres. Es gibt keine Monatstarife und keine Einrichtungsgebühren.\", \"One lost-pet number for every pet in your home.\": \"Eine Nummer für vermisste Tiere für alle Tiere in Ihrem Haushalt.\", \"/ year\": \"/ Jahr\", \"Billed once a year\": \"Einmal jährlich abgerechnet\", \"1 dedicated lost-pet number\": \"1 eigene Nummer für vermisste Tiere\", \"Caller menu with up to 6 contacts\": \"Sprachmenü mit bis zu 6 Kontakten\", \"Lost-pet greeting on every call\": \"Ansage für vermisste Tiere bei jedem Anruf\", \"Voicemail with text and email alerts\": \"Mailbox mit SMS- und E-Mail-Benachrichtigung\", \"30 minutes of calls per year\": \"30 Anrufminuten pro Jahr\", \"Incoming calls only\": \"Nur eingehende Anrufe\", \"Works with any microchip registry\": \"Funktioniert mit jedem Mikrochip-Register\", \"Number held 6 months if your plan lapses\": \"Nummer 6 Monate reserviert, falls Ihr Tarif ausläuft\", \"Pay once\": \"Einmal zahlen\", \"Lifetime\": \"Lebenszeit-Tarif\", \"One payment for one pet's whole life.\": \"Eine Zahlung für das ganze Leben eines Tieres.\", \"one time\": \"einmalig\", \"For your pet's life, up to 20 years\": \"Für das Leben Ihres Tieres, bis zu 20 Jahre\", \"Everything in Annual, for one enrolled pet\": \"Alles aus dem Jahrestarif, für ein angemeldetes Tier\", \"Covers your pet's life, up to 20 years\": \"Deckt das Leben Ihres Tieres ab, bis zu 20 Jahre\", \"No yearly renewals\": \"Keine jährlichen Verlängerungen\", \"A yearly check-in email keeps the line active\": \"Eine jährliche Bestätigungs-E-Mail hält die Nummer aktiv\", \"Lifetime, Small Bird Lifetime and Parrot plans cover one enrolled pet. Lifetime plans last for the life of the enrolled pet or 20 years from purchase, whichever comes first. Each year we email you to confirm the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line. Prices are in US dollars.\": \"Der Lebenszeit-Tarif, der Kleinvogel-Lebenszeit-Tarif und die Papageien-Tarife gelten jeweils für ein angemeldetes Tier. Lebenszeit-Tarife gelten für die Lebensdauer des angemeldeten Tieres oder 20 Jahre ab Kauf, je nachdem, was zuerst eintritt. Wir senden Ihnen jedes Jahr eine E-Mail, um zu bestätigen, dass die Nummer noch benötigt wird. Vergehen zwei Jahre ohne Antwort und ohne Anrufe, senden wir eine letzte Benachrichtigung und schließen die Nummer dann. Die Preise verstehen sich in US-Dollar.\", \"Pet plans open soon.\": \"Haustiertarife starten bald.\", \"Join the launch list and we'll email you the day sign-up opens.\": \"Tragen Sie sich in die Startliste ein, und wir schicken Ihnen eine E-Mail, sobald die Anmeldung öffnet.\", \"Parrots and other birds\": \"Papageien und andere Vögel\", \"Built for birds that live for decades.\": \"Gemacht für Vögel, die Jahrzehnte leben.\", \"A budgie might live ten years. A macaw can live eighty. iCanCall Pets has plans for every size of bird, and a way to pass the line on when a parrot changes homes.\": \"Ein Wellensittich lebt vielleicht zehn Jahre. Ein Ara kann achtzig werden. iCanCall Pets hat Tarife für Vögel jeder Größe und eine Möglichkeit, die Nummer weiterzugeben, wenn ein Papagei ein neues Zuhause bekommt.\", \"Budgie, lovebird, parrotlet\": \"Wellensittich, Unzertrennlicher, Sperlingspapagei\", \"Typically 5 to 15 years.\": \"In der Regel 5 bis 15 Jahre.\", \"Small Bird Lifetime\": \"Kleinvogel-Lebenszeit-Tarif\", \"Cockatiel\": \"Nymphensittich\", \"Typically 15 to 25 years.\": \"In der Regel 15 bis 25 Jahre.\", \"African grey, Amazon, cockatoo\": \"Graupapagei, Amazone, Kakadu\", \"Typically 40 to 70 years.\": \"In der Regel 40 bis 70 Jahre.\", \"Parrot 10-Year or 20-Year\": \"Papageien-Tarif 10 oder 20 Jahre\", \"Macaw\": \"Ara\", \"Typically 50 to 80 years.\": \"In der Regel 50 bis 80 Jahre.\", \"Name a successor\": \"Einen Nachfolger benennen\", \"When your parrot changes homes, the number goes too.\": \"Wenn Ihr Papagei ein neues Zuhause bekommt, geht die Nummer mit.\", \"Parrots often outlive their owners or move to new homes. Name a backup person, like a family member or a bird rescue, who takes over the line if you can no longer care for your bird.\": \"Papageien überleben oft ihre Besitzer oder ziehen in ein neues Zuhause. Benennen Sie eine Ersatzperson, etwa ein Familienmitglied oder eine Vogelauffangstation, die die Nummer übernimmt, falls Sie sich nicht mehr um Ihren Vogel kümmern können.\", \"Not every bird has a microchip. Put the number on a cage tag, travel carrier and rescue paperwork too.\": \"Nicht jeder Vogel hat einen Mikrochip. Bringen Sie die Nummer auch an einem Käfigschild, an der Transportbox und in den Unterlagen der Auffangstation an.\", \"The line moves to the new owner for free\": \"Die Nummer geht kostenlos auf den neuen Besitzer über\", \"Any prepaid time moves with it\": \"Bereits bezahlte Zeit geht mit über\", \"The number on the chip and paperwork stays the same\": \"Die Nummer auf dem Chip und in den Unterlagen bleibt gleich\", \"As many moves as your bird needs\": \"So viele Umzüge, wie Ihr Vogel braucht\", \"Budgies, lovebirds, parrotlets and cockatiels.\": \"Wellensittiche, Unzertrennliche, Sperlingspapageien und Nymphensittiche.\", \"For your bird's life, up to 20 years\": \"Für das Leben Ihres Vogels, bis zu 20 Jahre\", \"Everything in Annual, for one bird\": \"Alles aus dem Jahrestarif, für einen Vogel\", \"Named successor, free transfers\": \"Benannter Nachfolger, kostenlose Übertragungen\", \"Large parrots\": \"Große Papageien\", \"Parrot 10-Year\": \"Papageien-Tarif 10 Jahre\", \"African greys, Amazons, cockatoos and macaws.\": \"Graupapageien, Amazonen, Kakadus und Aras.\", \"10 years of service, then renew\": \"10 Jahre Service, dann verlängern\", \"10 years prepaid\": \"10 Jahre im Voraus bezahlt\", \"Renews at the price in effect at renewal\": \"Verlängerung zum dann gültigen Preis\", \"Parrot 20-Year\": \"Papageien-Tarif 20 Jahre\", \"The longest cover for long-lived parrots.\": \"Der längste Schutz für langlebige Papageien.\", \"20 years of service, then renew\": \"20 Jahre Service, dann verlängern\", \"20 years prepaid\": \"20 Jahre im Voraus bezahlt\", \"Any bird can also use the $29 Annual plan.\": \"Jeder Vogel kann auch den Jahrestarif für $29 nutzen.\", \"What pet owners ask us most.\": \"Was Tierbesitzer uns am häufigsten fragen.\", \"Do I need a new microchip?\": \"Brauche ich einen neuen Mikrochip?\", \"No. Your pet keeps the chip it has. Log in to the registry where the chip is registered and change the phone number to your iCanCall number. After that, you never need to update the registry again.\": \"Nein. Ihr Tier behält seinen Chip. Melden Sie sich bei dem Register an, bei dem der Chip registriert ist, und ändern Sie die Telefonnummer in Ihre iCanCall-Nummer. Danach müssen Sie das Register nie wieder aktualisieren.\", \"What happens when someone calls the number?\": \"Was passiert, wenn jemand die Nummer anruft?\", \"They hear your lost-pet greeting, then a caller menu with up to six contacts. They press a number to reach the person they want, and the call connects straight through.\": \"Er hört Ihre Ansage für vermisste Tiere und dann ein Sprachmenü mit bis zu sechs Kontakten. Er drückt eine Taste, um die gewünschte Person zu erreichen, und der Anruf wird direkt durchgestellt.\", \"What if nobody picks up?\": \"Was, wenn niemand abnimmt?\", \"The caller can leave a voicemail, and you get a text and an email straight away so you can call them back.\": \"Der Anrufer kann eine Mailbox-Nachricht hinterlassen, und Sie erhalten sofort eine SMS und eine E-Mail, damit Sie zurückrufen können.\", \"Can one number cover all my pets?\": \"Kann eine Nummer alle meine Tiere abdecken?\", \"Yes, on the Annual plan. Every chip in your home can carry the same number. Lifetime and Parrot plans cover one enrolled pet each.\": \"Ja, im Jahrestarif. Jeder Chip in Ihrem Haushalt kann dieselbe Nummer tragen. Der Lebenszeit-Tarif und die Papageien-Tarife gelten jeweils für ein angemeldetes Tier.\", \"Why 30 minutes a year, and incoming calls only?\": \"Warum 30 Minuten im Jahr und nur eingehende Anrufe?\", \"A lost-pet line gets a few short calls a year, so 30 minutes is plenty. The line only takes incoming calls and always plays your lost-pet greeting, which keeps the price low. We email you if you get close to the limit.\": \"Eine Nummer für vermisste Tiere erhält im Jahr nur wenige kurze Anrufe, daher sind 30 Minuten mehr als genug. Die Nummer nimmt nur eingehende Anrufe an und spielt immer Ihre Ansage für vermisste Tiere ab, das hält den Preis niedrig. Wir schicken Ihnen eine E-Mail, wenn Sie sich dem Limit nähern.\", \"What happens if my Annual plan lapses?\": \"Was passiert, wenn mein Jahrestarif ausläuft?\", \"We hold your number for 6 months. During that time, callers hear a short message that the plan has lapsed, and the call still rings your main contact. We email you before the number is released so you can renew or update your microchip registry.\": \"Wir halten Ihre Nummer 6 Monate lang für Sie bereit. In dieser Zeit hören Anrufer eine kurze Nachricht, dass der Tarif ausgelaufen ist, und der Anruf klingelt weiterhin bei Ihrem Hauptkontakt. Bevor die Nummer freigegeben wird, schicken wir Ihnen eine E-Mail, damit Sie verlängern oder Ihr Mikrochip-Register aktualisieren können.\", \"How does the Lifetime plan work?\": \"Wie funktioniert der Lebenszeit-Tarif?\", \"You pay once and the line covers one enrolled pet for its life, or 20 years from purchase, whichever comes first. Once a year we email you to check the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line.\": \"Sie zahlen einmal, und die Nummer gilt für ein angemeldetes Tier für dessen ganzes Leben oder 20 Jahre ab Kauf, je nachdem, was zuerst eintritt. Einmal im Jahr schicken wir Ihnen eine E-Mail, um zu prüfen, ob die Nummer noch benötigt wird. Vergehen zwei Jahre ohne Antwort und ohne Anrufe, senden wir eine letzte Benachrichtigung und schließen die Nummer dann.\", \"What happens if my parrot outlives me?\": \"Was passiert, wenn mein Papagei mich überlebt?\", \"Name a successor, like a family member or a bird rescue. If you can no longer care for your bird, the line moves to them for free, along with any prepaid time. The number on the chip and paperwork stays the same.\": \"Benennen Sie einen Nachfolger, etwa ein Familienmitglied oder eine Vogelauffangstation. Wenn Sie sich nicht mehr um Ihren Vogel kümmern können, geht die Nummer kostenlos auf diese Person über, zusammen mit bereits bezahlter Zeit. Die Nummer auf dem Chip und in den Unterlagen bleibt gleich.\", \"Put a number on the chip that keeps up with you.\": \"Hinterlegen Sie eine Nummer auf dem Chip, die mit Ihnen Schritt hält.\", \"Pet plans open soon. Join the launch list and we'll email you the day sign-up opens.\": \"Haustiertarife starten bald. Tragen Sie sich in die Startliste ein, und wir schicken Ihnen eine E-Mail, sobald die Anmeldung öffnet.\", \"Annual or lifetime · Works with any microchip registry · 14-day service guarantee\": \"Jährlich oder lebenslang · Funktioniert mit jedem Mikrochip-Register · 14 Tage Service-Garantie\", \"One lost-pet number on your pet's microchip that always reaches you, even after you move or change phones.\": \"Eine Nummer für vermisste Tiere auf dem Mikrochip Ihres Tieres, die Sie immer erreicht, auch nach einem Umzug oder Handywechsel.\", \"Annual\": \"Jahrestarif\"}, \"attrs\": {\"Your email address\": \"Ihre E-Mail-Adresse\"}}, \"it\": {\"text\": {\"Why chips fail\": \"Perché i chip falliscono\", \"Parrots\": \"Pappagalli\", \"Questions\": \"Domande\", \"Join the launch list\": \"Iscriviti alla lista di lancio\", \"For dogs, cats and parrots\": \"Per cani, gatti e pappagalli\", \"One number on the chip.\": \"Un solo numero sul chip.\", \"It never goes out of date.\": \"Non diventa mai obsoleto.\", \"Put your iCanCall number on your pet's microchip once. When you move or change phones, update your contacts in the dashboard. The chip keeps reaching you, and you never have to update the registry again.\": \"Associa il tuo numero iCanCall al microchip del tuo animale una volta sola. Quando traslochi o cambi telefono, aggiorna i tuoi contatti nella dashboard. Il chip continua a raggiungerti e non dovrai mai più aggiornare il registro.\", \"Works with any microchip registry.\": \"Funziona con qualsiasi registro di microchip.\", \"Keep the registry you already use. Just put your iCanCall number on file.\": \"Mantieni il registro che usi già. Basta registrare lì il tuo numero iCanCall.\", \"Max's microchip number\": \"Il numero di microchip di Max\", \"A shelter scans Max's chip and calls. The caller menu lets them pick who to reach\": \"Un rifugio legge il chip di Max e chiama. Il menu vocale permette di scegliere chi contattare\", \"Owner\": \"Proprietario/a\", \"Partner\": \"Partner\", \"Dog walker\": \"Dog sitter\", \"Made for the day your pet goes missing\": \"Pensato per il giorno in cui il tuo animale si smarrisce\", \"number on the chip\": \"numero sul chip\", \"contacts in the caller menu\": \"contatti nel menu vocale\", \"registry updates when you move\": \"aggiornamenti del registro quando traslochi\", \"microchip registry\": \"registro di microchip\", \"The chip works. The phone number doesn't.\": \"Il chip funziona. Il numero di telefono no.\", \"This is the most common reason microchips fail to reunite lost dogs with their owners: not a chip malfunction, but outdated contact details. iCanCall puts a number on the chip that keeps up with you.\": \"È il motivo più comune per cui i microchip non riescono a riportare i cani smarriti ai loro proprietari: non un guasto del chip, ma dati di contatto non aggiornati. iCanCall mette sul chip un numero che ti segue sempre.\", \"A number that goes stale\": \"Un numero che diventa obsoleto\", \"You register the chip once, then life moves on. New phone, new house, and the registry still has the old details.\": \"Registri il chip una volta, poi la vita va avanti. Nuovo telefono, nuova casa, e il registro ha ancora i vecchi dati.\", \"Registry phone\": \"Telefono nel registro\", \"Old cell\": \"Vecchio cellulare\", \"Home address\": \"Indirizzo di casa\", \"Moved\": \"Trasferito\", \"Backup contact\": \"Contatto di riserva\", \"None\": \"Nessuno\", \"Last updated\": \"Ultimo aggiornamento\", \"Years ago\": \"Anni fa\", \"\\\"The number you have dialed is no longer in service.\\\"\": \"«Il numero selezionato non è più attivo.»\", \"A number that keeps up with you\": \"Un numero che ti segue sempre\", \"The number on the chip never changes. You change who it reaches, any time, from your phone.\": \"Il numero sul chip non cambia mai. Sei tu a cambiare chi raggiunge, quando vuoi, dal tuo telefono.\", \"\\\"New phone, new house, same number on the chip.\\\"\": \"«Nuovo telefono, nuova casa, stesso numero sul chip.»\", \"Set it up once. Keep it current forever.\": \"Lo configuri una volta. Resta aggiornato per sempre.\", \"A few minutes of setup means the number on your pet's chip always reaches someone who can help.\": \"Pochi minuti di configurazione e il numero sul chip del tuo animale raggiunge sempre qualcuno che può aiutare.\", \"Get your pet number\": \"Scegli il numero per il tuo animale\", \"Pick an iCanCall number for your pet. One number can cover every pet in your home.\": \"Scegli un numero iCanCall per il tuo animale. Un solo numero può coprire tutti gli animali di casa.\", \"Put it on the chip\": \"Mettilo sul chip\", \"Log in to the registry where your pet's chip is registered and set your iCanCall number as the phone number. Add it to the collar tag too.\": \"Accedi al registro in cui è registrato il chip del tuo animale e imposta il tuo numero iCanCall come numero di telefono. Aggiungilo anche alla medaglietta del collare.\", \"Add up to six contacts\": \"Aggiungi fino a sei contatti\", \"You, your partner, a neighbor, the dog walker. When someone calls, they hear your lost-pet greeting and use the caller menu to pick who to reach.\": \"Tu, il tuo partner, un vicino, il dog sitter. Quando qualcuno chiama, sente il tuo messaggio per animale smarrito e usa il menu vocale per scegliere chi contattare.\", \"Wherever they turn up\": \"Ovunque vengano ritrovati\", \"The same number works wherever your pet is found.\": \"Lo stesso numero funziona ovunque venga ritrovato il tuo animale.\", \"Shelters, vets and neighbors all reach you the same way: one number, from any phone.\": \"Rifugi, veterinari e vicini ti raggiungono tutti allo stesso modo: un solo numero, da qualsiasi telefono.\", \"Scanned at a shelter\": \"Letto in un rifugio\", \"Staff scan the chip, call the number, and hear your lost-pet greeting straight away.\": \"Il personale legge il chip, chiama il numero e sente subito il tuo messaggio per animale smarrito.\", \"Scanned at a vet\": \"Letto dal veterinario\", \"A vet clinic checks the chip and calls you directly, without searching for old records.\": \"Una clinica veterinaria controlla il chip e ti chiama direttamente, senza cercare vecchi dati.\", \"Found by a neighbor\": \"Trovato da un vicino\", \"They read the number on the collar tag and call. The caller menu gets them to whoever is free.\": \"Legge il numero sulla medaglietta del collare e chiama. Il menu vocale lo mette in contatto con chi è libero.\", \"After you move\": \"Dopo un trasloco\", \"New phone or new city? Update your contacts in the dashboard. The chip never needs touching.\": \"Nuovo telefono o nuova città? Aggiorna i tuoi contatti nella dashboard. Il chip non va mai toccato.\", \"Try the caller menu a finder will hear.\": \"Prova il menu vocale che sentirà chi trova il tuo animale.\", \"Add the people who should hear about your pet, set their order, then place a pretend call. The finder hears your lost-pet greeting and presses a number to reach someone.\": \"Aggiungi le persone che devono essere avvisate del tuo animale, stabilisci l'ordine e poi fai una chiamata di prova. Chi lo trova sente il tuo messaggio per animale smarrito e preme un numero per raggiungere qualcuno.\", \"Your pet's contacts\": \"I contatti del tuo animale\", \"/6 contacts\": \"/6 contatti\", \"Place a call to hear the options\": \"Fai una chiamata per sentire le opzioni\", \"Callers pick who to reach. Flip a contact to “Busy” to send them to voicemail.\": \"Chi chiama sceglie chi contattare. Imposta un contatto su «Occupato» per inoltrare la chiamata alla segreteria.\", \"Why pet owners choose iCanCall\": \"Perché i proprietari di animali scelgono iCanCall\", \"Built so a found pet always finds its way home.\": \"Pensato perché un animale ritrovato torni sempre a casa.\", \"A number that never goes stale\": \"Un numero che non diventa mai obsoleto\", \"Change phones, move house, add a pet sitter. Update the dashboard and the chip keeps working.\": \"Cambia telefono, trasloca, aggiungi un pet sitter. Aggiorna la dashboard e il chip continua a funzionare.\", \"A greeting made for finders\": \"Un messaggio pensato per chi trova\", \"Every call starts with your lost-pet message, so shelters and neighbors know they have reached the right place.\": \"Ogni chiamata inizia con il tuo messaggio per animale smarrito, così rifugi e vicini sanno di aver chiamato il posto giusto.\", \"A caller menu for six contacts\": \"Un menu vocale per sei contatti\", \"Finders press a number to reach you, your partner, a neighbor or the dog walker, in the order you choose.\": \"Chi trova il tuo animale preme un numero per raggiungere te, il tuo partner, un vicino o il dog sitter, nell'ordine che scegli tu.\", \"You hear about it right away\": \"Lo sai subito\", \"If nobody picks up, the caller leaves a voicemail and you get a text and an email straight away.\": \"Se nessuno risponde, chi chiama lascia un messaggio in segreteria e tu ricevi subito un SMS e un'e-mail.\", \"Held for 6 months if you lapse\": \"Conservato per 6 mesi se il piano scade\", \"Miss a renewal and we keep your number for 6 months, still ringing your main contact, so the chip keeps working.\": \"Se salti un rinnovo, conserviamo il tuo numero per 6 mesi, continuando a far squillare il tuo contatto principale, così il chip continua a funzionare.\", \"Your numbers stay private\": \"I tuoi numeri restano privati\", \"Finders only ever see your iCanCall number, never your personal phone numbers.\": \"Chi trova il tuo animale vede solo il tuo numero iCanCall, mai i tuoi numeri personali.\", \"Less than $2.50 a month, paid once a year.\": \"Meno di $2.50 al mese, pagati una volta all'anno.\", \"Pay once a year, or once for your pet's whole life. There are no monthly plans and no setup fees.\": \"Paghi una volta all'anno, oppure una sola volta per tutta la vita del tuo animale. Nessun piano mensile e nessun costo di attivazione.\", \"One lost-pet number for every pet in your home.\": \"Un solo numero per animali smarriti per tutti gli animali di casa.\", \"/ year\": \"/ anno\", \"Billed once a year\": \"Fatturato una volta all'anno\", \"1 dedicated lost-pet number\": \"1 numero dedicato per animali smarriti\", \"Caller menu with up to 6 contacts\": \"Menu vocale con fino a 6 contatti\", \"Lost-pet greeting on every call\": \"Messaggio per animale smarrito a ogni chiamata\", \"Voicemail with text and email alerts\": \"Segreteria con avvisi via SMS ed e-mail\", \"30 minutes of calls per year\": \"30 minuti di chiamate all'anno\", \"Incoming calls only\": \"Solo chiamate in entrata\", \"Works with any microchip registry\": \"Funziona con qualsiasi registro di microchip\", \"Number held 6 months if your plan lapses\": \"Numero conservato per 6 mesi se il piano scade\", \"Pay once\": \"Paghi una volta\", \"Lifetime\": \"A vita\", \"One payment for one pet's whole life.\": \"Un solo pagamento per tutta la vita di un animale.\", \"one time\": \"una tantum\", \"For your pet's life, up to 20 years\": \"Per la vita del tuo animale, fino a 20 anni\", \"Everything in Annual, for one enrolled pet\": \"Tutto quello che c'è in Annuale, per un animale iscritto\", \"Covers your pet's life, up to 20 years\": \"Copre la vita del tuo animale, fino a 20 anni\", \"No yearly renewals\": \"Nessun rinnovo annuale\", \"A yearly check-in email keeps the line active\": \"Un'e-mail di verifica annuale mantiene attiva la linea\", \"Lifetime, Small Bird Lifetime and Parrot plans cover one enrolled pet. Lifetime plans last for the life of the enrolled pet or 20 years from purchase, whichever comes first. Each year we email you to confirm the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line. Prices are in US dollars.\": \"I piani A vita, A vita Uccelli piccoli e Pappagallo coprono un animale iscritto. I piani a vita durano per tutta la vita dell'animale iscritto o per 20 anni dall'acquisto, a seconda di quale termine scada per primo. Ogni anno ti inviamo un'e-mail per confermare che la linea serve ancora. Se passano due anni senza risposta e senza chiamate, inviamo un ultimo avviso e poi chiudiamo la linea. I prezzi sono in dollari USA.\", \"Pet plans open soon.\": \"I piani per animali apriranno presto.\", \"Join the launch list and we'll email you the day sign-up opens.\": \"Iscriviti alla lista di lancio e ti invieremo un'e-mail il giorno in cui si apriranno le iscrizioni.\", \"Parrots and other birds\": \"Pappagalli e altri uccelli\", \"Built for birds that live for decades.\": \"Pensato per uccelli che vivono per decenni.\", \"A budgie might live ten years. A macaw can live eighty. iCanCall Pets has plans for every size of bird, and a way to pass the line on when a parrot changes homes.\": \"Un pappagallino ondulato può vivere dieci anni. Un ara può viverne ottanta. iCanCall Pets ha piani per uccelli di ogni taglia e un modo per trasferire la linea quando un pappagallo cambia casa.\", \"Budgie, lovebird, parrotlet\": \"Pappagallino ondulato, inseparabile, forpus\", \"Typically 5 to 15 years.\": \"In genere da 5 a 15 anni.\", \"Small Bird Lifetime\": \"A vita Uccelli piccoli\", \"Cockatiel\": \"Calopsite\", \"Typically 15 to 25 years.\": \"In genere da 15 a 25 anni.\", \"African grey, Amazon, cockatoo\": \"Cenerino, amazzone, cacatua\", \"Typically 40 to 70 years.\": \"In genere da 40 a 70 anni.\", \"Parrot 10-Year or 20-Year\": \"Pappagallo 10 anni o 20 anni\", \"Macaw\": \"Ara\", \"Typically 50 to 80 years.\": \"In genere da 50 a 80 anni.\", \"Name a successor\": \"Indica un successore\", \"When your parrot changes homes, the number goes too.\": \"Quando il tuo pappagallo cambia casa, il numero lo segue.\", \"Parrots often outlive their owners or move to new homes. Name a backup person, like a family member or a bird rescue, who takes over the line if you can no longer care for your bird.\": \"I pappagalli spesso sopravvivono ai loro proprietari o si trasferiscono in nuove case. Indica una persona di riserva, come un familiare o un centro di recupero per uccelli, che subentri nella linea se non potrai più prenderti cura del tuo uccello.\", \"Not every bird has a microchip. Put the number on a cage tag, travel carrier and rescue paperwork too.\": \"Non tutti gli uccelli hanno un microchip. Metti il numero anche su una targhetta della gabbia, sul trasportino e sui documenti del rifugio.\", \"The line moves to the new owner for free\": \"La linea passa gratuitamente al nuovo proprietario\", \"Any prepaid time moves with it\": \"L'eventuale tempo prepagato passa con essa\", \"The number on the chip and paperwork stays the same\": \"Il numero sul chip e sui documenti resta lo stesso\", \"As many moves as your bird needs\": \"Tutti i passaggi di cui il tuo uccello ha bisogno\", \"Budgies, lovebirds, parrotlets and cockatiels.\": \"Pappagallini ondulati, inseparabili, forpus e calopsiti.\", \"For your bird's life, up to 20 years\": \"Per la vita del tuo uccello, fino a 20 anni\", \"Everything in Annual, for one bird\": \"Tutto quello che c'è in Annuale, per un uccello\", \"Named successor, free transfers\": \"Successore designato, trasferimenti gratuiti\", \"Large parrots\": \"Grandi pappagalli\", \"Parrot 10-Year\": \"Pappagallo 10 anni\", \"African greys, Amazons, cockatoos and macaws.\": \"Cenerini, amazzoni, cacatua e ara.\", \"10 years of service, then renew\": \"10 anni di servizio, poi rinnovi\", \"10 years prepaid\": \"10 anni prepagati\", \"Renews at the price in effect at renewal\": \"Si rinnova al prezzo in vigore al momento del rinnovo\", \"Parrot 20-Year\": \"Pappagallo 20 anni\", \"The longest cover for long-lived parrots.\": \"La copertura più lunga per pappagalli longevi.\", \"20 years of service, then renew\": \"20 anni di servizio, poi rinnovi\", \"20 years prepaid\": \"20 anni prepagati\", \"Any bird can also use the $29 Annual plan.\": \"Qualsiasi uccello può usare anche il piano Annuale da $29.\", \"What pet owners ask us most.\": \"Le domande più frequenti dei proprietari di animali.\", \"Do I need a new microchip?\": \"Mi serve un nuovo microchip?\", \"No. Your pet keeps the chip it has. Log in to the registry where the chip is registered and change the phone number to your iCanCall number. After that, you never need to update the registry again.\": \"No. Il tuo animale tiene il chip che ha già. Accedi al registro in cui è registrato il chip e sostituisci il numero di telefono con il tuo numero iCanCall. Da quel momento non dovrai mai più aggiornare il registro.\", \"What happens when someone calls the number?\": \"Cosa succede quando qualcuno chiama il numero?\", \"They hear your lost-pet greeting, then a caller menu with up to six contacts. They press a number to reach the person they want, and the call connects straight through.\": \"Sente il tuo messaggio per animale smarrito, poi un menu vocale con fino a sei contatti. Preme un numero per raggiungere la persona che vuole e la chiamata viene collegata direttamente.\", \"What if nobody picks up?\": \"E se nessuno risponde?\", \"The caller can leave a voicemail, and you get a text and an email straight away so you can call them back.\": \"Chi chiama può lasciare un messaggio in segreteria e tu ricevi subito un SMS e un'e-mail, così puoi richiamarlo.\", \"Can one number cover all my pets?\": \"Un solo numero può coprire tutti i miei animali?\", \"Yes, on the Annual plan. Every chip in your home can carry the same number. Lifetime and Parrot plans cover one enrolled pet each.\": \"Sì, con il piano Annuale. Ogni chip in casa tua può avere lo stesso numero. I piani A vita e Pappagallo coprono un animale iscritto ciascuno.\", \"Why 30 minutes a year, and incoming calls only?\": \"Perché 30 minuti all'anno e solo chiamate in entrata?\", \"A lost-pet line gets a few short calls a year, so 30 minutes is plenty. The line only takes incoming calls and always plays your lost-pet greeting, which keeps the price low. We email you if you get close to the limit.\": \"Una linea per animali smarriti riceve poche chiamate brevi all'anno, quindi 30 minuti bastano e avanzano. La linea riceve solo chiamate in entrata e riproduce sempre il tuo messaggio per animale smarrito, e questo mantiene basso il prezzo. Ti inviamo un'e-mail se ti avvicini al limite.\", \"What happens if my Annual plan lapses?\": \"Cosa succede se il mio piano Annuale scade?\", \"We hold your number for 6 months. During that time, callers hear a short message that the plan has lapsed, and the call still rings your main contact. We email you before the number is released so you can renew or update your microchip registry.\": \"Conserviamo il tuo numero per 6 mesi. In quel periodo, chi chiama sente un breve messaggio che informa che il piano è scaduto, e la chiamata fa comunque squillare il tuo contatto principale. Ti inviamo un'e-mail prima che il numero venga rilasciato, così puoi rinnovare o aggiornare il registro del microchip.\", \"How does the Lifetime plan work?\": \"Come funziona il piano A vita?\", \"You pay once and the line covers one enrolled pet for its life, or 20 years from purchase, whichever comes first. Once a year we email you to check the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line.\": \"Paghi una volta sola e la linea copre un animale iscritto per tutta la sua vita, o per 20 anni dall'acquisto, a seconda di quale termine scada per primo. Una volta all'anno ti inviamo un'e-mail per verificare che la linea serva ancora. Se passano due anni senza risposta e senza chiamate, inviamo un ultimo avviso e poi chiudiamo la linea.\", \"What happens if my parrot outlives me?\": \"Cosa succede se il mio pappagallo mi sopravvive?\", \"Name a successor, like a family member or a bird rescue. If you can no longer care for your bird, the line moves to them for free, along with any prepaid time. The number on the chip and paperwork stays the same.\": \"Indica un successore, come un familiare o un centro di recupero per uccelli. Se non potrai più prenderti cura del tuo uccello, la linea passa gratuitamente a lui, insieme all'eventuale tempo prepagato. Il numero sul chip e sui documenti resta lo stesso.\", \"Put a number on the chip that keeps up with you.\": \"Metti sul chip un numero che ti segue sempre.\", \"Pet plans open soon. Join the launch list and we'll email you the day sign-up opens.\": \"I piani per animali apriranno presto. Iscriviti alla lista di lancio e ti invieremo un'e-mail il giorno in cui si apriranno le iscrizioni.\", \"Annual or lifetime · Works with any microchip registry · 14-day service guarantee\": \"Annuale o a vita · Funziona con qualsiasi registro di microchip · Garanzia di servizio di 14 giorni\", \"One lost-pet number on your pet's microchip that always reaches you, even after you move or change phones.\": \"Un solo numero per animali smarriti sul microchip del tuo animale, che ti raggiunge sempre, anche dopo un trasloco o un cambio di telefono.\", \"Annual\": \"Annuale\"}, \"attrs\": {\"Your email address\": \"Il tuo indirizzo e-mail\"}}, \"ko\": {\"text\": {\"Why chips fail\": \"칩이 제 역할을 못 하는 이유\", \"Parrots\": \"앵무새\", \"Questions\": \"자주 묻는 질문\", \"Join the launch list\": \"출시 알림 신청하기\", \"For dogs, cats and parrots\": \"강아지, 고양이, 앵무새를 위한 서비스\", \"One number on the chip.\": \"칩에 등록하는 번호 하나.\", \"It never goes out of date.\": \"언제나 최신 상태로 유지됩니다.\", \"Put your iCanCall number on your pet's microchip once. When you move or change phones, update your contacts in the dashboard. The chip keeps reaching you, and you never have to update the registry again.\": \"반려동물의 마이크로칩에 iCanCall 번호를 한 번만 등록하세요. 이사하거나 휴대폰을 바꾸면 대시보드에서 연락처만 업데이트하면 됩니다. 칩은 계속 여러분에게 연결되고, 등록 기관 정보를 다시 수정할 필요가 없습니다.\", \"Works with any microchip registry.\": \"어떤 마이크로칩 등록 기관과도 함께 사용할 수 있습니다.\", \"Keep the registry you already use. Just put your iCanCall number on file.\": \"지금 이용 중인 등록 기관을 그대로 쓰세요. iCanCall 번호만 등록해 두면 됩니다.\", \"Max's microchip number\": \"Max의 마이크로칩 번호\", \"A shelter scans Max's chip and calls. The caller menu lets them pick who to reach\": \"보호소에서 Max의 칩을 스캔하고 전화를 겁니다. 선택 다이얼 메뉴에서 연결할 사람을 고를 수 있습니다\", \"Owner\": \"보호자\", \"Partner\": \"배우자\", \"Dog walker\": \"산책 도우미\", \"Made for the day your pet goes missing\": \"반려동물을 잃어버린 그날을 위해 만들었습니다\", \"number on the chip\": \"칩에 등록된 번호\", \"contacts in the caller menu\": \"선택 다이얼 메뉴 연락처\", \"registry updates when you move\": \"이사 시 등록 정보 변경\", \"microchip registry\": \"마이크로칩 등록 기관\", \"The chip works. The phone number doesn't.\": \"칩은 작동합니다. 문제는 전화번호입니다.\", \"This is the most common reason microchips fail to reunite lost dogs with their owners: not a chip malfunction, but outdated contact details. iCanCall puts a number on the chip that keeps up with you.\": \"마이크로칩이 있어도 잃어버린 강아지가 주인에게 돌아가지 못하는 가장 흔한 이유입니다. 칩 고장이 아니라 오래된 연락처 정보 때문입니다. iCanCall은 여러분의 변화에 맞춰 늘 최신으로 유지되는 번호를 칩에 등록합니다.\", \"A number that goes stale\": \"낡아 버리는 번호\", \"You register the chip once, then life moves on. New phone, new house, and the registry still has the old details.\": \"칩은 한 번 등록하고 끝나지만, 삶은 계속 바뀝니다. 새 휴대폰, 새 집, 그런데 등록 기관에는 여전히 예전 정보가 남아 있습니다.\", \"Registry phone\": \"등록 전화번호\", \"Old cell\": \"예전 휴대폰\", \"Home address\": \"집 주소\", \"Moved\": \"이사함\", \"Backup contact\": \"비상 연락처\", \"None\": \"없음\", \"Last updated\": \"마지막 업데이트\", \"Years ago\": \"몇 년 전\", \"\\\"The number you have dialed is no longer in service.\\\"\": \"\\\"지금 거신 번호는 더 이상 사용되지 않는 번호입니다.\\\"\", \"A number that keeps up with you\": \"늘 최신으로 유지되는 번호\", \"The number on the chip never changes. You change who it reaches, any time, from your phone.\": \"칩에 등록된 번호는 절대 바뀌지 않습니다. 연결될 사람은 언제든 휴대폰에서 바꿀 수 있습니다.\", \"\\\"New phone, new house, same number on the chip.\\\"\": \"\\\"새 휴대폰, 새 집, 칩에는 같은 번호.\\\"\", \"Set it up once. Keep it current forever.\": \"한 번 설정하면, 언제나 최신 상태로.\", \"A few minutes of setup means the number on your pet's chip always reaches someone who can help.\": \"몇 분만 설정하면 반려동물 칩에 등록된 번호가 언제나 도움을 줄 수 있는 사람에게 연결됩니다.\", \"Get your pet number\": \"반려동물 번호 받기\", \"Pick an iCanCall number for your pet. One number can cover every pet in your home.\": \"반려동물을 위한 iCanCall 번호를 고르세요. 번호 하나로 집에 있는 모든 반려동물을 등록할 수 있습니다.\", \"Put it on the chip\": \"칩에 번호 등록하기\", \"Log in to the registry where your pet's chip is registered and set your iCanCall number as the phone number. Add it to the collar tag too.\": \"반려동물 칩이 등록된 등록 기관에 로그인하고 전화번호를 iCanCall 번호로 설정하세요. 목걸이 이름표에도 적어 두세요.\", \"Add up to six contacts\": \"연락처 최대 6명 추가하기\", \"You, your partner, a neighbor, the dog walker. When someone calls, they hear your lost-pet greeting and use the caller menu to pick who to reach.\": \"여러분, 배우자, 이웃, 산책 도우미. 누군가 전화하면 실종 안내 멘트를 듣고, 선택 다이얼 메뉴에서 연결할 사람을 고릅니다.\", \"Wherever they turn up\": \"어디에서 발견되든\", \"The same number works wherever your pet is found.\": \"반려동물이 어디에서 발견되든 같은 번호로 연결됩니다.\", \"Shelters, vets and neighbors all reach you the same way: one number, from any phone.\": \"보호소, 동물병원, 이웃 모두 같은 방법으로 연락합니다. 어떤 전화기에서든 번호 하나로.\", \"Scanned at a shelter\": \"보호소에서 스캔\", \"Staff scan the chip, call the number, and hear your lost-pet greeting straight away.\": \"직원이 칩을 스캔해 번호로 전화하면 바로 실종 안내 멘트가 나옵니다.\", \"Scanned at a vet\": \"동물병원에서 스캔\", \"A vet clinic checks the chip and calls you directly, without searching for old records.\": \"동물병원이 칩을 확인하고, 예전 기록을 찾을 필요 없이 바로 여러분에게 전화합니다.\", \"Found by a neighbor\": \"이웃이 발견\", \"They read the number on the collar tag and call. The caller menu gets them to whoever is free.\": \"목걸이 이름표의 번호를 보고 전화합니다. 선택 다이얼 메뉴가 지금 받을 수 있는 사람에게 연결해 줍니다.\", \"After you move\": \"이사한 후에도\", \"New phone or new city? Update your contacts in the dashboard. The chip never needs touching.\": \"휴대폰을 바꾸셨나요, 다른 도시로 이사하셨나요? 대시보드에서 연락처를 업데이트하세요. 칩은 건드릴 필요가 없습니다.\", \"Try the caller menu a finder will hear.\": \"발견한 사람이 듣게 될 선택 다이얼 메뉴를 체험해 보세요.\", \"Add the people who should hear about your pet, set their order, then place a pretend call. The finder hears your lost-pet greeting and presses a number to reach someone.\": \"반려동물 소식을 들어야 할 사람들을 추가하고 순서를 정한 다음, 모의 통화를 걸어 보세요. 발견한 사람은 실종 안내 멘트를 듣고 번호를 눌러 원하는 사람에게 연결됩니다.\", \"Your pet's contacts\": \"반려동물 연락처\", \"/6 contacts\": \"/6 연락처\", \"Place a call to hear the options\": \"전화를 걸어 선택지를 들어 보세요\", \"Callers pick who to reach. Flip a contact to “Busy” to send them to voicemail.\": \"전화한 사람이 연결할 사람을 고릅니다. 연락처를 “통화 중”으로 바꾸면 음성사서함으로 연결됩니다.\", \"Why pet owners choose iCanCall\": \"반려인들이 iCanCall을 선택하는 이유\", \"Built so a found pet always finds its way home.\": \"발견된 반려동물이 언제나 집으로 돌아올 수 있도록 만들었습니다.\", \"A number that never goes stale\": \"절대 낡지 않는 번호\", \"Change phones, move house, add a pet sitter. Update the dashboard and the chip keeps working.\": \"휴대폰을 바꾸고, 이사하고, 펫시터를 추가하세요. 대시보드만 업데이트하면 칩은 계속 작동합니다.\", \"A greeting made for finders\": \"발견한 사람을 위한 안내 멘트\", \"Every call starts with your lost-pet message, so shelters and neighbors know they have reached the right place.\": \"모든 통화는 실종 안내 메시지로 시작되므로, 보호소와 이웃은 제대로 연락했다는 것을 바로 알 수 있습니다.\", \"A caller menu for six contacts\": \"연락처 6명을 위한 선택 다이얼 메뉴\", \"Finders press a number to reach you, your partner, a neighbor or the dog walker, in the order you choose.\": \"발견한 사람은 번호를 눌러 여러분, 배우자, 이웃, 산책 도우미에게 여러분이 정한 순서대로 연결됩니다.\", \"You hear about it right away\": \"바로 알려 드립니다\", \"If nobody picks up, the caller leaves a voicemail and you get a text and an email straight away.\": \"아무도 받지 않으면 전화한 사람이 음성 메시지를 남기고, 여러분은 즉시 문자와 이메일을 받습니다.\", \"Held for 6 months if you lapse\": \"요금제가 만료되어도 6개월간 번호 유지\", \"Miss a renewal and we keep your number for 6 months, still ringing your main contact, so the chip keeps working.\": \"갱신을 놓쳐도 6개월 동안 번호를 유지하고 대표 연락처로 계속 전화가 연결되므로, 칩은 계속 작동합니다.\", \"Your numbers stay private\": \"개인 번호는 비공개로 유지됩니다\", \"Finders only ever see your iCanCall number, never your personal phone numbers.\": \"발견한 사람에게는 iCanCall 번호만 보이고, 개인 전화번호는 절대 보이지 않습니다.\", \"Less than $2.50 a month, paid once a year.\": \"월 $2.50 미만, 1년에 한 번 결제.\", \"Pay once a year, or once for your pet's whole life. There are no monthly plans and no setup fees.\": \"1년에 한 번, 또는 반려동물의 평생에 한 번만 결제하세요. 월간 요금제와 가입비는 없습니다.\", \"One lost-pet number for every pet in your home.\": \"집에 있는 모든 반려동물을 위한 실종 대비 번호 하나.\", \"/ year\": \"/ 년\", \"Billed once a year\": \"1년에 한 번 청구\", \"1 dedicated lost-pet number\": \"전용 실종 대비 번호 1개\", \"Caller menu with up to 6 contacts\": \"연락처 최대 6명 선택 다이얼 메뉴\", \"Lost-pet greeting on every call\": \"모든 통화에 실종 안내 멘트\", \"Voicemail with text and email alerts\": \"문자 및 이메일 알림이 포함된 음성사서함\", \"30 minutes of calls per year\": \"연간 통화 30분\", \"Incoming calls only\": \"수신 전화 전용\", \"Works with any microchip registry\": \"어떤 마이크로칩 등록 기관과도 호환\", \"Number held 6 months if your plan lapses\": \"요금제 만료 시 6개월간 번호 유지\", \"Pay once\": \"한 번 결제\", \"Lifetime\": \"평생\", \"One payment for one pet's whole life.\": \"반려동물 한 마리의 평생을 위한 한 번의 결제.\", \"one time\": \"1회\", \"For your pet's life, up to 20 years\": \"반려동물의 평생, 최대 20년\", \"Everything in Annual, for one enrolled pet\": \"연간 요금제의 모든 혜택, 등록된 반려동물 한 마리 대상\", \"Covers your pet's life, up to 20 years\": \"반려동물의 평생 보장, 최대 20년\", \"No yearly renewals\": \"매년 갱신할 필요 없음\", \"A yearly check-in email keeps the line active\": \"연 1회 확인 이메일로 회선 유지\", \"Lifetime, Small Bird Lifetime and Parrot plans cover one enrolled pet. Lifetime plans last for the life of the enrolled pet or 20 years from purchase, whichever comes first. Each year we email you to confirm the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line. Prices are in US dollars.\": \"평생, 소형 조류 평생, 앵무새 요금제는 등록된 반려동물 한 마리에게 적용됩니다. 평생 요금제는 등록된 반려동물의 평생 또는 구매일로부터 20년 중 먼저 도래하는 시점까지 유지됩니다. 매년 회선이 계속 필요한지 확인하는 이메일을 보내 드립니다. 응답과 통화가 모두 없는 상태로 2년이 지나면 최종 안내를 보낸 후 회선을 해지합니다. 가격은 미국 달러 기준입니다.\", \"Pet plans open soon.\": \"반려동물 요금제가 곧 출시됩니다.\", \"Join the launch list and we'll email you the day sign-up opens.\": \"출시 알림을 신청하시면 가입이 시작되는 날 이메일로 알려 드립니다.\", \"Parrots and other birds\": \"앵무새와 다른 새들\", \"Built for birds that live for decades.\": \"수십 년을 사는 새들을 위해 만들었습니다.\", \"A budgie might live ten years. A macaw can live eighty. iCanCall Pets has plans for every size of bird, and a way to pass the line on when a parrot changes homes.\": \"사랑앵무는 10년 정도 살지만, 금강앵무는 80년까지 살 수 있습니다. iCanCall Pets에는 모든 크기의 새를 위한 요금제와, 앵무새가 새 가정으로 갈 때 회선을 넘겨줄 방법이 있습니다.\", \"Budgie, lovebird, parrotlet\": \"사랑앵무, 모란앵무, 패럿렛\", \"Typically 5 to 15 years.\": \"보통 5년에서 15년.\", \"Small Bird Lifetime\": \"소형 조류 평생\", \"Cockatiel\": \"왕관앵무\", \"Typically 15 to 25 years.\": \"보통 15년에서 25년.\", \"African grey, Amazon, cockatoo\": \"회색앵무, 아마존앵무, 코카투\", \"Typically 40 to 70 years.\": \"보통 40년에서 70년.\", \"Parrot 10-Year or 20-Year\": \"앵무새 10년 또는 20년\", \"Macaw\": \"금강앵무\", \"Typically 50 to 80 years.\": \"보통 50년에서 80년.\", \"Name a successor\": \"승계인 지정\", \"When your parrot changes homes, the number goes too.\": \"앵무새가 새 가정으로 가면 번호도 함께 갑니다.\", \"Parrots often outlive their owners or move to new homes. Name a backup person, like a family member or a bird rescue, who takes over the line if you can no longer care for your bird.\": \"앵무새는 주인보다 오래 살거나 새 가정으로 가는 경우가 많습니다. 더 이상 새를 돌볼 수 없게 될 때 회선을 이어받을 가족이나 조류 구조 단체 같은 대리인을 지정해 두세요.\", \"Not every bird has a microchip. Put the number on a cage tag, travel carrier and rescue paperwork too.\": \"모든 새에게 마이크로칩이 있는 것은 아닙니다. 새장 이름표, 이동장, 구조 서류에도 번호를 적어 두세요.\", \"The line moves to the new owner for free\": \"새 보호자에게 회선이 무료로 이전됩니다\", \"Any prepaid time moves with it\": \"선결제한 기간도 함께 이전됩니다\", \"The number on the chip and paperwork stays the same\": \"칩과 서류의 번호는 그대로 유지됩니다\", \"As many moves as your bird needs\": \"필요한 만큼 몇 번이든 이전 가능\", \"Budgies, lovebirds, parrotlets and cockatiels.\": \"사랑앵무, 모란앵무, 패럿렛, 왕관앵무.\", \"For your bird's life, up to 20 years\": \"새의 평생, 최대 20년\", \"Everything in Annual, for one bird\": \"연간 요금제의 모든 혜택, 새 한 마리 대상\", \"Named successor, free transfers\": \"승계인 지정, 무료 이전\", \"Large parrots\": \"대형 앵무새\", \"Parrot 10-Year\": \"앵무새 10년\", \"African greys, Amazons, cockatoos and macaws.\": \"회색앵무, 아마존앵무, 코카투, 금강앵무.\", \"10 years of service, then renew\": \"10년 서비스 후 갱신\", \"10 years prepaid\": \"10년 선결제\", \"Renews at the price in effect at renewal\": \"갱신 시점의 요금으로 갱신\", \"Parrot 20-Year\": \"앵무새 20년\", \"The longest cover for long-lived parrots.\": \"오래 사는 앵무새를 위한 가장 긴 보장.\", \"20 years of service, then renew\": \"20년 서비스 후 갱신\", \"20 years prepaid\": \"20년 선결제\", \"Any bird can also use the $29 Annual plan.\": \"모든 새는 $29 연간 요금제도 이용할 수 있습니다.\", \"What pet owners ask us most.\": \"반려인들이 가장 많이 묻는 질문.\", \"Do I need a new microchip?\": \"새 마이크로칩이 필요한가요?\", \"No. Your pet keeps the chip it has. Log in to the registry where the chip is registered and change the phone number to your iCanCall number. After that, you never need to update the registry again.\": \"아니요. 반려동물은 지금 있는 칩을 그대로 사용합니다. 칩이 등록된 등록 기관에 로그인해 전화번호를 iCanCall 번호로 바꾸세요. 그 후에는 등록 기관 정보를 다시 수정할 필요가 없습니다.\", \"What happens when someone calls the number?\": \"누군가 이 번호로 전화하면 어떻게 되나요?\", \"They hear your lost-pet greeting, then a caller menu with up to six contacts. They press a number to reach the person they want, and the call connects straight through.\": \"실종 안내 멘트가 나온 뒤, 연락처 최대 6명의 선택 다이얼 메뉴가 이어집니다. 연결하고 싶은 사람의 번호를 누르면 바로 통화가 연결됩니다.\", \"What if nobody picks up?\": \"아무도 받지 않으면 어떻게 되나요?\", \"The caller can leave a voicemail, and you get a text and an email straight away so you can call them back.\": \"전화한 사람이 음성 메시지를 남길 수 있고, 여러분은 즉시 문자와 이메일을 받아 다시 전화할 수 있습니다.\", \"Can one number cover all my pets?\": \"번호 하나로 모든 반려동물을 등록할 수 있나요?\", \"Yes, on the Annual plan. Every chip in your home can carry the same number. Lifetime and Parrot plans cover one enrolled pet each.\": \"네, 연간 요금제라면 가능합니다. 집에 있는 모든 칩에 같은 번호를 등록할 수 있습니다. 평생 요금제와 앵무새 요금제는 각각 등록된 반려동물 한 마리에게 적용됩니다.\", \"Why 30 minutes a year, and incoming calls only?\": \"왜 연간 30분이고, 수신 전화만 되나요?\", \"A lost-pet line gets a few short calls a year, so 30 minutes is plenty. The line only takes incoming calls and always plays your lost-pet greeting, which keeps the price low. We email you if you get close to the limit.\": \"실종 대비 회선에는 1년에 짧은 통화가 몇 건 정도 걸려 오므로 30분이면 충분합니다. 회선은 수신 전화만 받고 항상 실종 안내 멘트를 재생하기 때문에 가격을 낮게 유지할 수 있습니다. 한도에 가까워지면 이메일로 알려 드립니다.\", \"What happens if my Annual plan lapses?\": \"연간 요금제가 만료되면 어떻게 되나요?\", \"We hold your number for 6 months. During that time, callers hear a short message that the plan has lapsed, and the call still rings your main contact. We email you before the number is released so you can renew or update your microchip registry.\": \"6개월 동안 번호를 유지합니다. 그 기간에는 전화한 사람에게 요금제가 만료되었다는 짧은 안내가 나오고, 통화는 계속 대표 연락처로 연결됩니다. 번호가 해제되기 전에 이메일을 보내 드리므로 갱신하거나 마이크로칩 등록 정보를 업데이트할 수 있습니다.\", \"How does the Lifetime plan work?\": \"평생 요금제는 어떻게 운영되나요?\", \"You pay once and the line covers one enrolled pet for its life, or 20 years from purchase, whichever comes first. Once a year we email you to check the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line.\": \"한 번 결제하면 등록된 반려동물 한 마리의 평생 또는 구매일로부터 20년 중 먼저 도래하는 시점까지 회선이 유지됩니다. 1년에 한 번 회선이 계속 필요한지 확인하는 이메일을 보내 드립니다. 응답과 통화가 모두 없는 상태로 2년이 지나면 최종 안내를 보낸 후 회선을 해지합니다.\", \"What happens if my parrot outlives me?\": \"앵무새가 저보다 오래 살면 어떻게 되나요?\", \"Name a successor, like a family member or a bird rescue. If you can no longer care for your bird, the line moves to them for free, along with any prepaid time. The number on the chip and paperwork stays the same.\": \"가족이나 조류 구조 단체 같은 승계인을 지정하세요. 더 이상 새를 돌볼 수 없게 되면 회선은 선결제한 기간과 함께 무료로 승계인에게 이전됩니다. 칩과 서류의 번호는 그대로 유지됩니다.\", \"Put a number on the chip that keeps up with you.\": \"여러분의 변화에 맞춰 늘 최신으로 유지되는 번호를 칩에 등록하세요.\", \"Pet plans open soon. Join the launch list and we'll email you the day sign-up opens.\": \"반려동물 요금제가 곧 출시됩니다. 출시 알림을 신청하시면 가입이 시작되는 날 이메일로 알려 드립니다.\", \"Annual or lifetime · Works with any microchip registry · 14-day service guarantee\": \"연간 또는 평생 · 어떤 마이크로칩 등록 기관과도 호환 · 14일 서비스 보장\", \"One lost-pet number on your pet's microchip that always reaches you, even after you move or change phones.\": \"이사하거나 휴대폰을 바꿔도 언제나 여러분에게 연결되는, 반려동물 마이크로칩에 등록하는 실종 대비 번호 하나.\", \"Annual\": \"연간 요금제\"}, \"attrs\": {\"Your email address\": \"이메일 주소\"}}};\n     for (const [l, d] of Object.entries(PETS_DICT)) {\n       const t = DICT_MAP[l]; if (!t) continue;\n       Object.assign(t.text, d.text);\n       Object.assign(t.attrs, d.attrs);\n     }\n\n     function translateDOM(node, dict, keepSpace) {\n       if (node.nodeType === Node.TEXT_NODE) {\n         const text = node.nodeValue.trim();\n         if (dict[text]) {\n           // Keep the spaces around inline fragments (bold words, links) so the\n           // pieces of a sentence don't run together. Chinese and Japanese don't\n           // put spaces between words.\n           const lead = keepSpace ? node.nodeValue.match(/^\\s*/)[0] : '';\n           const trail = keepSpace ? node.nodeValue.match(/\\s*$/)[0] : '';\n           node.nodeValue = lead + dict[text] + trail;\n         }\n       } else if (node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {\n         node.childNodes.forEach(child => translateDOM(child, dict, keepSpace));\n       }\n     }\n\n     function translatePage(lang) {\n       // Support RTL for Arabic\n       document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';\n\n       const dict = DICT_MAP[lang];\n       if (dict) {\n         translateDOM(document.body, dict.text, lang !== 'ja' && lang !== 'zh');\n         \n         document.querySelectorAll('[placeholder]').forEach(el => {\n           const p = el.getAttribute('placeholder').trim();\n           if (dict.attrs[p]) el.setAttribute('placeholder', dict.attrs[p]);\n         });\n         \n         document.querySelectorAll('.avail .lbl').forEach(el => {\n           const availMap = {\n             'es': { 'Available': 'Disponible', 'Busy': 'Ocupado' },\n             'fr': { 'Available': 'Disponible', 'Busy': 'Occupé' },\n             'ja': { 'Available': '対応可能', 'Busy': '忙しい' },\n             'zh': { 'Available': '在线可用', 'Busy': '忙碌' },\n             'ar': { 'Available': 'متاح', 'Busy': 'مشغول' },\n             'hi': { 'Available': 'उपलब्ध', 'Busy': 'व्यस्त' },\n             'pt': { 'Available': 'Disponível', 'Busy': 'Ocupado' },\n             'de': { 'Available': 'Verfügbar', 'Busy': 'Besetzt' },\n             'it': { 'Available': 'Disponibile', 'Busy': 'Occupato' },\n             'ko': { 'Available': '통화 가능', 'Busy': '바쁨' }\n           };\n           const m = availMap[lang];\n           if (m) {\n             if (el.textContent.trim() === 'Available') el.textContent = m['Available'];\n             if (el.textContent.trim() === 'Busy') el.textContent = m['Busy'];\n           }\n         });\n         \n         document.querySelectorAll('.sim-hint').forEach(el => {\n           const hintMap = {\n             'es': 'Desactive contactos a «Ocupado» para ver cómo salta la cascada.',\n             'fr': \"Désactivez des contacts sur « Occupé » pour voir l'appel sauter au suivant.\",\n             'ja': '連絡先を「忙しい」に切り替えて、カスケード転送が次へ進む様子を確認できます。',\n             'zh': '将联系人切换为“忙碌”状态，查看顺次呼叫如何自动跳过并呼叫下一位。',\n             'ar': 'قم بتحويل جهات الاتصال إلى ' + \"'مشغول'\" + ' لرؤية الرنين المتتالي يتجاوزهم إلى التالي.',\n             'hi': 'कैस्केड को आगे बढ़ते देखने के लिए सदस्यों को “व्यस्त” पर टॉगल करें।',\n             'pt': 'Mude contatos para “Ocupado” para ver a chamada saltar para o próximo.',\n             'de': 'Schalten Sie Kontakte auf „Besetzt“, um zu sehen wie der Anruf zum nächsten springt.',\n             'it': 'Imposta i contati su “Occupato” per vedere la chiamata passare al successivo.',\n             'ko': '연락처를 “통화 중”으로 토글하여 순차 통화가 다음 보호자로 넘어가는 것을 확인하세요.'\n           };\n           if (hintMap[lang] && el.textContent.includes('Toggle contacts')) {\n             el.textContent = hintMap[lang];\n           }\n         });\n       } else {\n         window.location.reload();\n       }\n     }\n\n     // The dictionaries are keyed by the English text, so a page that is already\n     // translated has to reload before it can switch to another language.\n     function switchLanguage(prev, next) {\n       if (prev !== 'en') window.location.reload();\n       else translatePage(next);\n     }\n\n     function initLangSelect() {\n       const select = document.getElementById('langSelect');\n       if (select) {\n         const saved = localStorage.getItem('lang') || 'en';\n         select.value = saved;\n         if (saved !== 'en') translatePage(saved);\n         \n         select.addEventListener('change', (e) => {\n           const prev = localStorage.getItem('lang') || 'en';\n           localStorage.setItem('lang', e.target.value);\n           window.dispatchEvent(new Event('storage'));\n           switchLanguage(prev, e.target.value);\n         });\n       }\n     }\n\n     // This script runs after the bundle unpacks, when DOMContentLoaded has\n     // usually already fired.\n     if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initLangSelect);\n     else initLangSelect();\n\n     window.addEventListener('storage', () => {\n       const select = document.getElementById('langSelect');\n       if (select) {\n         const active = localStorage.getItem('lang') || 'en';\n         if (select.value !== active) {\n           const prev = select.value;\n           select.value = active;\n           switchLanguage(prev, active);\n         }\n       }\n     });\n   <\/script>\n <\/body>\n <\/html>\n<\/html>"</script>
</body>
