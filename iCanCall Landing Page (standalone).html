  <script type="__bundler/template">"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>iCanCall — One number. Always answered.<\/title>\n<meta name=\"description\" content=\"Give your family a dedicated phone number that intelligently cascades calls to trusted contacts until someone answers.\">\n<link rel=\"alternate\" type=\"text\/markdown\" href=\"https:\/\/icancall.co\/index.md\">\n<link rel=\"describedby\" type=\"text\/plain\" href=\"https:\/\/icancall.co\/llms.txt\">\n<style>\/* ===========================================================\n   iCanCall — landing page styles\n   Warm & reassuring · soft blue\/teal · clean neutral sans\n   =========================================================== *\/\n\n:root {\n  \/* Surfaces — subtly cool whites *\/\n  --bg:        oklch(0.992 0.005 220);\n  --surface:   oklch(1 0 0);\n  --tint:      oklch(0.965 0.018 218);   \/* soft blue wash *\/\n  --tint-2:    oklch(0.945 0.028 210);\n  --line:      oklch(0.90 0.012 225);\n\n  \/* Ink — cool near-blacks *\/\n  --ink:       oklch(0.26 0.028 248);\n  --ink-soft:  oklch(0.45 0.022 245);\n  --ink-faint: oklch(0.60 0.018 242);\n\n  \/* Brand — calm blues + teal *\/\n  --blue:      oklch(0.58 0.115 232);\n  --blue-deep: oklch(0.44 0.105 240);\n  --blue-ink:  oklch(0.34 0.085 244);\n  --teal:      oklch(0.72 0.095 196);\n  --teal-deep: oklch(0.62 0.10 198);\n  --green:     oklch(0.70 0.13 158);\n\n  --shadow-sm: 0 1px 2px oklch(0.4 0.05 240 \/ 0.06), 0 2px 6px oklch(0.4 0.05 240 \/ 0.05);\n  --shadow-md: 0 4px 14px oklch(0.4 0.05 240 \/ 0.08), 0 10px 30px oklch(0.4 0.05 240 \/ 0.07);\n  --shadow-lg: 0 12px 28px oklch(0.4 0.06 240 \/ 0.10), 0 30px 60px oklch(0.4 0.06 240 \/ 0.10);\n\n  --r-sm: 10px;\n  --r-md: 16px;\n  --r-lg: 24px;\n  --r-xl: 32px;\n\n  --maxw: 1180px;\n  --pad: clamp(20px, 5vw, 56px);\n\n  --font: \"Helvetica Neue\", Helvetica, Arial, \"Segoe UI\", sans-serif;\n  --mono: ui-monospace, \"SF Mono\", \"Roboto Mono\", Menlo, monospace;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }\n\nbody {\n  font-family: var(--font);\n  background: var(--bg);\n  color: var(--ink);\n  line-height: 1.55;\n  font-size: 17px;\n  letter-spacing: -0.01em;\n}\n\na { color: inherit; text-decoration: none; }\nimg { display: block; max-width: 100%; }\n\n.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad); }\n\n\/* ---------- Typography ---------- *\/\nh1, h2, h3, h4 { letter-spacing: -0.025em; line-height: 1.06; font-weight: 700; color: var(--ink); }\nh1 { font-size: clamp(2.6rem, 6vw, 4.6rem); }\nh2 { font-size: clamp(2rem, 4vw, 3.1rem); }\nh3 { font-size: clamp(1.25rem, 2vw, 1.6rem); }\n.lead { font-size: clamp(1.1rem, 1.6vw, 1.32rem); color: var(--ink-soft); line-height: 1.5; }\n\n.eyebrow {\n  display: inline-flex; align-items: center; gap: 8px;\n  font-size: 0.82rem; font-weight: 600; letter-spacing: 0.04em;\n  text-transform: uppercase; color: var(--blue-deep);\n}\n.eyebrow::before {\n  content: \"\"; width: 22px; height: 2px; border-radius: 2px;\n  background: var(--teal-deep);\n}\n\n.section { padding-block: clamp(72px, 10vw, 130px); }\n.section-head { max-width: 680px; }\n.section-head .eyebrow { margin-bottom: 18px; }\n.section-head .lead { margin-top: 18px; }\n.center { margin-inline: auto; text-align: center; }\n.center .eyebrow { justify-content: center; }\n\n\/* ---------- Buttons ---------- *\/\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 9px;\n  font-family: var(--font); font-size: 1rem; font-weight: 600;\n  padding: 14px 26px; border-radius: 999px; border: 1px solid transparent;\n  cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, background .18s ease;\n  white-space: nowrap;\n}\n.btn-primary {\n  background: var(--blue); color: #fff;\n  box-shadow: 0 6px 18px oklch(0.58 0.115 232 \/ 0.32);\n}\n.btn-primary:hover { background: var(--blue-deep); transform: translateY(-2px); box-shadow: 0 10px 24px oklch(0.58 0.115 232 \/ 0.38); }\n.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }\n.btn-ghost:hover { background: var(--tint); border-color: var(--blue); transform: translateY(-2px); }\n.btn-lg { padding: 17px 34px; font-size: 1.06rem; }\n\n\/* ---------- Header ---------- *\/\n.header {\n  position: sticky; top: 0; z-index: 60;\n  backdrop-filter: blur(12px);\n  background: oklch(0.992 0.005 220 \/ 0.78);\n  border-bottom: 1px solid transparent;\n  transition: border-color .25s ease, background .25s ease;\n}\n.header.scrolled { border-color: var(--line); background: oklch(0.992 0.005 220 \/ 0.92); }\n.header-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }\n.brand { display: flex; align-items: center; gap: 11px; font-weight: 700; font-size: 1.22rem; letter-spacing: -0.03em; }\n.brand .mark {\n  width: 34px; height: 34px; border-radius: 10px; flex: none;\n  background: linear-gradient(150deg, var(--blue), var(--teal-deep));\n  display: grid; place-items: center; box-shadow: var(--shadow-sm);\n}\n.brand .mark svg { width: 18px; height: 18px; }\n.brand b { color: var(--blue-deep); }\n.nav { display: flex; align-items: center; gap: 32px; }\n.nav a { font-size: 0.96rem; color: var(--ink-soft); font-weight: 500; transition: color .15s; }\n.nav a:hover { color: var(--ink); }\n.header-cta { display: flex; align-items: center; gap: 14px; }\n.nav-toggle { display: none; }\n@media (max-width: 880px) {\n  .nav { display: none; }\n  .header-cta .btn-ghost { display: none; }\n}\n\n\/* ---------- Hero ---------- *\/\n.hero { position: relative; overflow: hidden; padding-top: clamp(48px, 7vw, 86px); padding-bottom: clamp(60px, 8vw, 110px); }\n.hero::before {\n  content: \"\"; position: absolute; inset: -20% -10% auto -10%; height: 760px;\n  background:\n    radial-gradient(60% 60% at 78% 12%, oklch(0.72 0.095 196 \/ 0.18), transparent 70%),\n    radial-gradient(55% 55% at 18% 0%, oklch(0.58 0.115 232 \/ 0.16), transparent 70%);\n  pointer-events: none; z-index: 0;\n}\n.hero-grid {\n  position: relative; z-index: 1;\n  display: grid; grid-template-columns: 1.02fr 0.98fr; gap: clamp(36px, 5vw, 72px);\n  align-items: center;\n}\n.hero-copy .eyebrow { margin-bottom: 22px; }\n.hero-copy h1 { margin-bottom: 22px; }\n.hero-copy h1 .accent { color: var(--blue-deep); }\n.hero-copy .lead { max-width: 30ch; margin-bottom: 34px; }\n.hero-actions { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }\n.hero-note { margin-top: 22px; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--ink-faint); }\n.hero-note .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px oklch(0.70 0.13 158 \/ 0.18); }\n\n@media (max-width: 900px) {\n  .hero-grid { grid-template-columns: 1fr; }\n  .hero-copy .lead { max-width: 46ch; }\n}\n\n\/* ---------- Routing demo ---------- *\/\n.demo {\n  position: relative;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--r-xl);\n  box-shadow: var(--shadow-lg);\n  padding: 26px 24px 22px;\n}\n.demo-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }\n.demo-number { display: flex; align-items: center; gap: 12px; }\n.demo-number .ring {\n  width: 44px; height: 44px; border-radius: 13px; flex: none;\n  background: linear-gradient(150deg, var(--blue), var(--teal-deep));\n  display: grid; place-items: center; position: relative;\n}\n.demo-number .ring svg { width: 21px; height: 21px; }\n.demo-number .ring::after {\n  content: \"\"; position: absolute; inset: 0; border-radius: 13px;\n  box-shadow: 0 0 0 0 oklch(0.58 0.115 232 \/ 0.45);\n  animation: pulse 2.4s ease-out infinite;\n}\n@keyframes pulse {\n  0% { box-shadow: 0 0 0 0 oklch(0.58 0.115 232 \/ 0.40); }\n  70% { box-shadow: 0 0 0 16px oklch(0.58 0.115 232 \/ 0); }\n  100% { box-shadow: 0 0 0 0 oklch(0.58 0.115 232 \/ 0); }\n}\n.demo-number .num { font-weight: 700; font-size: 1.12rem; letter-spacing: -0.02em; }\n.demo-number .num small { display: block; font-size: 0.72rem; font-weight: 500; color: var(--ink-faint); letter-spacing: 0.02em; }\n.demo-status {\n  font-size: 0.78rem; font-weight: 600; color: var(--blue-deep);\n  background: var(--tint); border: 1px solid var(--line);\n  padding: 6px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px;\n  transition: color .3s, background .3s, border-color .3s;\n}\n.demo-status .live { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }\n.demo.is-connected .demo-status { color: oklch(0.42 0.13 158); background: oklch(0.94 0.05 158); border-color: oklch(0.84 0.07 158); }\n.demo.is-connected .demo-status .live { background: var(--green); }\n\n.demo-caption { font-size: 0.78rem; color: var(--ink-faint); margin-bottom: 14px; padding-left: 2px; }\n\n.chain { display: flex; flex-direction: column; gap: 9px; }\n.contact {\n  position: relative; display: flex; align-items: center; gap: 13px;\n  padding: 11px 14px; border-radius: var(--r-md);\n  border: 1px solid var(--line); background: var(--surface);\n  transition: border-color .3s, background .3s, box-shadow .3s, opacity .3s, transform .3s;\n}\n.contact .avatar {\n  width: 38px; height: 38px; border-radius: 50%; flex: none;\n  display: grid; place-items: center; font-weight: 700; font-size: 0.9rem; color: #fff;\n}\n.contact .who { flex: 1; min-width: 0; }\n.contact .who b { font-size: 0.97rem; font-weight: 600; }\n.contact .who span { display: block; font-size: 0.8rem; color: var(--ink-faint); }\n.contact .state { font-size: 0.78rem; font-weight: 600; color: var(--ink-faint); white-space: nowrap; }\n.contact .order {\n  position: absolute; left: -1px; top: -1px;\n  width: 20px; height: 20px; border-ra , 72px);\n  background: linear-gradient(150deg, var(--blue-deep), var(--blue) 55%, var(--teal-deep));\n  color: #fff; text-align: center; overflow: hidden;\n  box-shadow: var(--shadow-lg);\n}\n.cta-card::before { content: \"\"; position: absolute; inset: 0; background: radial-gradient(50% 80% at 80% 0%, oklch(1 0 0 \/ 0.18), transparent 60%); pointer-events: none; }\n.cta-card h2 { color: #fff; position: relative; }\n.cta-card p { color: oklch(0.95 0.02 220); font-size: 1.18rem; margin: 18px auto 32px; max-width: 50ch; position: relative; }\n.cta-card .btn-primary { background: #fff; color: var(--blue-deep); box-shadow: 0 8px 24px oklch(0.2 0.05 240 \/ 0.3); }\n.cta-card .btn-primary:hover { background: oklch(0.96 0.02 220); }\n.cta-card .actions { position: relative; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }\n.cta-card .fine { margin-top: 20px; font-size: 0.86rem; color: oklch(0.9 0.02 220); position: relative; }\n\n\/* ---------- Footer ---------- *\/\n.footer { padding-block: 60px 40px; border-top: 1px solid var(--line); background: var(--surface); }\n.footer-grid { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 40px; }\n.footer .brand { margin-bottom: 16px; }\n.footer .blurb { color: var(--ink-soft); font-size: 0.92rem; max-width: 30ch; }\n.footer h5 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); margin-bottom: 16px; font-weight: 700; }\n.footer ul { list-style: none; display: flex; flex-direction: column; gap: 11px; }\n.footer a { color: var(--ink-soft); font-size: 0.94rem; transition: color .15s; }\n.footer a:hover { color: var(--blue-deep); }\n.footer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--line); font-size: 0.86rem; color: var(--ink-faint); }\n@media (max-width: 820px) { .footer-grid { grid-template-columns: 1fr 1fr; } }\n\n\/* ---------- Reveal on scroll ---------- *\/\n.reveal { opacity: 0; transform: translateY(22px); transition: opacity .6s ease, transform .6s ease; }\n.reveal.in { opacity: 1; transform: none; }\n\n@media (prefers-reduced-motion: reduce) {\n  * { animation: none !important; transition: none !important; }\n  .reveal { opacity: 1; transform: none; }\n}\n<\/style>\n<\/head>\n<body>\n\n\n\n<!-- ============== HEADER ============== -->\n<header class=\"header\">\n  <div class=\"wrap header-inner\">\n    <a class=\"brand\" href=\"#top\" aria-label=\"iCanCall home\">\n      <span class=\"mark\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n      <\/span>\n      <span>i<b>Can<\/b>Call<\/span>\n    <\/a>\n    <nav class=\"nav\">\n      <a href=\"#how\">How it works<\/a>\n      <a href=\"#features\">Features<\/a>\n      <a href=\"#usecases\">Who it's for<\/a>\n      <a href=\"#pricing\">Pricing<\/a>\n      <a href=\"#faq\">FAQ<\/a>\n    <\/nav>\n    <div class=\"header-cta\">\n      <a class=\"btn btn-ghost\" href=\"#how\">See how it works<\/a>\n      <a class=\"btn btn-primary\" href=\"#pricing\">Select a Plan<\/a>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main id=\"top\">\n\n<!-- ============== HERO ============== -->\n<section class=\"hero\">\n  <div class=\"wrap hero-grid\">\n    <div class=\"hero-copy\">\n      <span class=\"eyebrow\">Safety on autopilot<\/span>\n      <h1>One number.<br><span class=\"accent\">Always answered.<\/span><\/h1>\n      <p class=\"lead\">When it matters most, the people you love should never reach a dead end. iCanCall routes a single, memorable number to up to six trusted contacts — until someone picks up.<\/p>\n      <div class=\"hero-actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"#pricing\">Select a Plan<\/a>\n        <a class=\"btn btn-ghost btn-lg\" href=\"#how\">How it works<\/a>\n      <\/div>\n      <div class=\"hero-note\"><span class=\"dot\"><\/span> No new hardware · Works with any phone · Set up in minutes<\/div>\n    <\/div>\n\n    <!-- Animated routing demo -->\n    <div class=\"demo\" id=\"demo\" aria-label=\"Live call-routing demonstration\">\n      <div class=\"demo-head\">\n        <div class=\"demo-number\">\n          <span class=\"ring\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n          <\/span>\n          <span class=\"num\">(415) 200-CARE<small>Mom's iCanCall number<\/small><\/span>\n        <\/div>\n        <span class=\"demo-status\"><span class=\"live\"><\/span><span class=\"txt\">Incoming call<\/span><\/span>\n      <\/div>\n      <p class=\"demo-caption\">Routing through trusted contacts, in order, until answered<\/p>\n      <div class=\"chain\">\n        <div class=\"contact\">\n          <span class=\"order\">1<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.58 0.115 232)\">SR<\/span>\n          <span class=\"who\"><b>Sarah R.<\/b><span>Daughter<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">2<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.62 0.10 198)\">DM<\/span>\n          <span class=\"who\"><b>David M.<\/b><span>Son<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">3<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.55 0.11 280)\">LN<\/span>\n          <span class=\"who\"><b>Lena N.<\/b><span>Neighbor<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">4<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.6 0.12 30)\">DR<\/span>\n          <span class=\"who\"><b>Dr. Patel<\/b><span>Care team<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== TRUST STRIP ============== -->\n<section class=\"trust\">\n  <div class=\"wrap trust-inner\">\n    <span class=\"trust-label\">Built for the moments that matter<\/span>\n    <div class=\"trust-stats\">\n      <div class=\"stat\"><b>1<\/b><span>number to remember<\/span><\/div>\n      <div class=\"stat\"><b>6<\/b><span>contacts per number<\/span><\/div>\n      <div class=\"stat\"><b>&lt;3s<\/b><span>to start routing<\/span><\/div>\n      <div class=\"stat\"><b>99.99%<\/b><span>uptime, always on<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== HOW IT WORKS ============== -->\n<section class=\"section\" id=\"how\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">How it works<\/span>\n      <h2>Set it once. Trust it forever.<\/h2>\n      <p class=\"lead\">Three simple steps stand between you and complete peace of mind.<\/p>\n    <\/div>\n    <div class=\"steps\">\n      <div class=\"step reveal\">\n        <div class=\"idx\">1<\/div>\n        <h3>Claim your number<\/h3>\n        <p>Pick a single, easy-to-remember iCanCall number. Share it once — on a bracelet, a fridge, a school form — and never juggle a list of numbers again.<\/p>\n        <svg class=\"step-arrow\" width=\"60\" height=\"24\" viewBox=\"0 0 60 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M0 12h54m0 0-7-7m7 7-7 7\"><\/path><\/svg>\n      <\/div>\n      <div class=\"step reveal\">\n        <div class=\"idx\">2<\/div>\n        <h3>Add your circle<\/h3>\n        <p>Designate up to six trusted contacts and set the order they should be reached. Family, neighbors, caregivers, doctors — your circle, your priority.<\/p>\n        <svg class=\"step-arrow\" width=\"60\" height=\"24\" viewBox=\"0 0 60 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M0 12h54m0 0-7-7m7 7-7 7\"><\/path><\/svg>\n      <\/div>\n      <div class=\"step reveal\">\n        <div class=\"idx\">3<\/div>\n        <h3>Choose how to connect<\/h3>\n        <p>Pick your routing in the dashboard: let iCanCall <b>cascade<\/b> through the circle until someone answers, or greet callers with a simple <b>menu<\/b> to reach the right person directly.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== TRY IT (interactive) ============== -->\n<section class=\"section tint-band\" id=\"try\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Interactive demo<\/span>\n      <h2>Build your circle. Place a call.<\/h2>\n      <p class=\"lead\">Add the people you trust, then choose how callers reach them: let iCanCall <b>cascade<\/b> through the circle until someone answers, or hand callers a <b>menu<\/b> to pick exactly who to dial. Try both below.<\/p>\n    <\/div>\n    <div class=\"mode-toggle reveal\">\n      <span class=\"mode-label\">Routing mode<\/span>\n      <div class=\"seg\" role=\"tablist\" aria-label=\"Routing mode\">\n        <button class=\"seg-btn active\" type=\"button\" data-mode=\"cascade\" role=\"tab\">Call cascade<\/button>\n        <button class=\"seg-btn\" type=\"button\" data-mode=\"menu\" role=\"tab\">Caller menu<\/button>\n      <\/div>\n      <span class=\"mode-note\">\n        <svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"10\" rx=\"2\"><\/rect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\/path><\/svg>\n        Set by the account owner in the dashboard\n      <\/span>\n    <\/div>\n    <div class=\"builder reveal\">\n      <!-- editor -->\n      <div class=\"builder-panel\">\n        <div class=\"builder-head\">\n          <h3>Your circle<\/h3>\n          <span class=\"count\"><span id=\"ccount\">0<\/span>\/6 contacts<\/span>\n        <\/div>\n        <div id=\"circle-list\" class=\"circle-list\"><\/div>\n        <form id=\"add-form\" class=\"add-form\" autocomplete=\"off\">\n          <input id=\"add-name\" type=\"text\" placeholder=\"Name\" maxlength=\"22\" required=\"\">\n          <input id=\"add-rel\" type=\"text\" placeholder=\"Relationship\" maxlength=\"22\">\n          <button class=\"btn btn-primary add-btn\" type=\"submit\" aria-label=\"Add contact\" title=\"Add contact\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg>\n          <\/button>\n        <\/form>\n      <\/div>\n      <!-- simulator -->\n      <div class=\"sim-panel\">\n        <div class=\"sim-screen\" id=\"sim-screen\">\n          <span class=\"num-line\">(415) 200-CARE<\/span>\n          <div class=\"sim-avatar\" id=\"sim-avatar\">—<\/div>\n          <div class=\"sim-name\" id=\"sim-name\">Ready<\/div>\n          <div class=\"sim-state\" id=\"sim-state\">Press call to start routing<\/div>\n          <div class=\"sim-dots\" id=\"sim-dots\"><\/div>\n        <\/div>\n        <button class=\"btn btn-primary\" id=\"place-call\">\n          <svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n          Place a call\n        <\/button>\n        <p class=\"sim-hint\">Toggle contacts to \"Busy\" to see the cascade skip ahead.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== FEATURES ============== -->\n<section class=\"section tint-band\" id=\"features\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Why families choose iCanCall<\/span>\n      <h2>Thoughtful by design.<br>Dependable by default.<\/h2>\n    <\/div>\n    <div class=\"features\">\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z\"><\/path><path d=\"m9 12 2 2 4-4\"><\/path><\/svg><\/div>\n        <h3>Two ways to connect<\/h3>\n        <p>Cascade through your circle until someone answers, or hand callers a menu to pick exactly who to reach. Your choice, switchable anytime in the dashboard.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v4a2 2 0 0 1-2.2 2A16 16 0 0 1 3 6.2 2 2 0 0 1 5 4Z\"><\/path><\/svg><\/div>\n        <h3>One number, any phone<\/h3>\n        <p>No app required for callers. Works from any landline or mobile, anywhere — exactly as a phone number should.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 18a4 4 0 0 0-8 0\"><\/path><circle cx=\"12\" cy=\"9\" r=\"3.5\"><\/circle><path d=\"M5 20a7 7 0 0 1 14 0\"><\/path><\/svg><\/div>\n        <h3>Up to six contacts<\/h3>\n        <p>Build a circle of family, neighbors, caregivers and doctors. Reorder anyone, anytime, in seconds.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 7v5l3 2\"><\/path><\/svg><\/div>\n        <h3>Time-aware rules<\/h3>\n        <p>Route differently by time of day. Reach the night caregiver after hours, the family doctor during the week — automatically.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16v11H7l-3 3V5Z\"><\/path><path d=\"M8 9h8M8 12h5\"><\/path><\/svg><\/div>\n        <h3>Instant alerts<\/h3>\n        <p>Every contact gets a text the moment a call comes through — so your whole circle knows the second something happens.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"11\" rx=\"2\"><\/rect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\/path><\/svg><\/div>\n        <h3>Private &amp; protected<\/h3>\n        <p>Personal numbers stay hidden behind your single iCanCall line. Encrypted end to end, and never sold.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== USE CASES ============== -->\n<section class=\"section\" id=\"usecases\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Who it's for<\/span>\n      <h2>Peace of mind for every family.<\/h2>\n      <p class=\"lead\">Whoever you're protecting, iCanCall makes sure they're only ever one call from help.<\/p>\n    <\/div>\n    <div class=\"usecases\">\n      <article class=\"usecase reveal\">\n        <a class=\"ph\" href=\"iCanCall Parents Landing (standalone).html\" aria-label=\"For Kids\"><img sr <\/span><\/span><\/figcaption>\n      <\/figure>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== FAQ ============== -->\n<section class=\"section tint-band\" id=\"faq\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Questions, answered<\/span>\n      <h2>Everything you might ask.<\/h2>\n    <\/div>\n    <div class=\"faq reveal\">\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Do my contacts need to install an app?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>No. iCanCall works with any phone — landline or mobile. Callers simply dial your one number, and your contacts answer on whatever phone they already use. No apps, no new hardware.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">What happens if nobody answers?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>iCanCall rings each contact in your chosen order until someone picks up. If the full circle is unreachable, the caller can leave a voicemail that's instantly transcribed and texted to every contact, so no message is ever lost.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Cascade or caller menu — what's the difference?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>You choose how callers connect, right from your dashboard. <b>Call cascade<\/b> rings your contacts one after another until someone answers — ideal for emergencies, when reaching <i>anyone<\/i> is what matters. <b>Caller menu<\/b> greets callers and lets them choose who to reach (\"press 1 for Mom, press 2 for the nurse\") — ideal when the right person depends on the situation. Switch modes anytime.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Can I change the contacts or their order?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Anytime, in seconds. Add, remove, or reorder up to six contacts from your dashboard. Changes take effect on the very next call.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Is my family's information private?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Always. Personal numbers stay hidden behind your single iCanCall line, all routing is encrypted, and we never sell your data.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">How quickly can I get set up?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Most families are protected in under five minutes: claim a number, add your contacts, and you're live. No technician visit and no equipment required.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== FINAL CTA ============== -->\n<section class=\"section cta-band\" id=\"cta\">\n  <div class=\"wrap\">\n    <div class=\"cta-card reveal\">\n      <h2>The people you love are one number away.<\/h2>\n      <p>Give your family the certainty of always getting through. Set up iCanCall today and put safety on autopilot.<\/p>\n      <div class=\"actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"#pricing\">Select a Plan<\/a>\n        <a class=\"btn btn-ghost btn-lg\" href=\"#how\" style=\"color:#fff;border-color:oklch(1 0 0 \/ 0.5)\">See how it works<\/a>\n      <\/div>\n      <p class=\"fine\">14-day free trial · No credit card required · Cancel anytime<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\/main>\n\n<!-- ============== FOOTER ============== -->\n<footer class=\"footer\">\n  <div class=\"wrap\">\n    <div class=\"footer-grid\">\n      <div>\n        <a class=\"brand\" href=\"#top\">\n          <span class=\"mark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5
