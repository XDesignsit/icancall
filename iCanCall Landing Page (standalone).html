ved one dials it from the phone they already have.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:1\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">02<\/span><span class=\"t\">How does the Call Cascade work?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Calls ring your contacts one at a time, in the order you choose. If someone doesn&#x27;t answer, the call moves to the next person. If no one answers, the caller can leave a voicemail. On Pro and Care Team, you&#x27;ll get the transcript by email.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:2\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">03<\/span><span class=\"t\">Can I have more than one number?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Yes. Pro includes 2 numbers and Care Team includes 5. Extra numbers are $6.99/month each.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:3\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">04<\/span><span class=\"t\">Is there a setup fee or contract?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>No setup fees, no activation costs, no contracts.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:4\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">05<\/span><span class=\"t\">What&#x27;s your refund policy?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Every plan has a 30-day money-back guarantee. After that you can cancel anytime from your dashboard, and service runs to the end of your billing period.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:5\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">06<\/span><span class=\"t\">Does the guarantee cover annual plans?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Yes, for the first 30 days. After that, annual plans are non-refundable for unused months.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:6\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">07<\/span><span class=\"t\">Is my family&#x27;s information private?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Yes. Personal numbers stay hidden behind your iCanCall line, and we never sell your data.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:7\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">08<\/span><span class=\"t\">How quickly can I get set up?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Most families are live in under five minutes: claim a number, add your contacts, done.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:8\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">09<\/span><span class=\"t\">Is iCanCall an emergency service?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>No. It helps your family reach each other quickly and complements, but doesn&#x27;t replace, 911 or a medical alert service.<\/p><\/div><\/details><\/div><\/div><\/section><section class=\"hp-final\" id=\"start\" aria-labelledby=\"final-title\"><div class=\"hp-final-panel hp-dark\"><div class=\"hp-final-bg\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div><div class=\"wrap hp-final-grid\"><div class=\"hp-final-copy\"><span class=\"hp-final-kicker rv\"><span class=\"ic\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-phone\"><\/use><\/svg><\/span
