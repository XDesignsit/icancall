      \"Real-time call alerts\": \"تنبيهات المكالمات في الوقت الفعلي\",\n      \"Admin dashboard\": \"لوحة تحكم المشرف\",\n      \"SMS & email notifications\": \"إشعارات الرسائل النصية والبريد\",\n      \"Stories from families\": \"قصص من عائلاتنا\",\n      \"The calls that got through.\": \"المكالمات التي تم توصيلها بنجاح.\",\n      \"Questions, answered\": \"الأسئلة الشائعة\",\n      \"Everything you might ask.\": \"كل ما قد تود الاستفسار عنه.\",\n      \"Ringing…\": \"يرن…\",\n      \"Connected ✓\": \"تم الاتصال ✓\",\n      \"Care Team\": \"فريق الرعاية\",\n      \"Select Plan\": \"اختر الخطة\",\n      \"One number for one parent.\": \"رقم واحد لأحد الوالدين.\",\n      \"Full coverage for the whole care team.\": \"تغطية كاملة لفريق الرعاية بأكمله.\",\n      \"Built for shared caregiving across several loved ones, with room for a second caregiver.\": \"مصمم للرعاية المشتركة لعدة أحباء، مع مساحة لمقدم رعاية ثانٍ.\",\n      \"Just $12.42/mo, billed annually\": \"فقط 12.42 دولاراً شهرياً، تُدفع سنوياً\",\n      \"Just $20.75/mo, billed annually\": \"فقط 20.75 دولاراً شهرياً، تُدفع سنوياً\",\n      \"Just $41.58/mo, billed annually\": \"فقط 41.58 دولاراً شهرياً، تُدفع سنوياً\",\n      \"1 Dedicated Safety Number\": \"رقم أمان مخصص واحد\",\n      \"Up to 3 Roster Contacts\": \"ما يصل إلى 3 جهات اتصال\",\n      \"Call Cascade (Sequential)\": \"رنين متتالي (تسلسلي)\",\n      \"Real-time Email Alerts\": \"تنبيهات بريدية في الوقت الفعلي\",\n      \"Standard voicemail box\": \"بريد صوتي قياسي\",\n      \"14-day service guarantee\": \"ضمان الخدمة لمدة 14 يومًا\",\n      \"2 Dedicated Safety Numbers\": \"رقما أمان مخصصان\",\n      \"Up to 6 Roster Contacts\": \"ما يصل إلى 6 جهات اتصال\",\n      \"Cascade & Caller Menu (IVR)\": \"رنين متتالي وقائمة المتصل (IVR)\",\n      \"Time-of-day Scheduling\": \"جدولة حسب الوقت من اليوم\",\n      \"Bilingual Greeting Options\": \"خيارات تحية ثنائية اللغة\",\n      \"Instant Voicemail Email Transcriptions\": \"تفريغ نصي فوري للبريد الصوتي عبر البريد\",\n      \"5 Dedicated Safety Numbers\": \"5 أرقام أمان مخصصة\",\n      \"Up to 15 Roster Contacts per Number\": \"ما يصل إلى 15 جهة اتصال لكل رقم\",\n      \"All Routing Modes + Scheduling\": \"جميع أوضاع التوجيه + الجدولة\",\n      \"150 pooled voice minutes\": \"150 دقيقة صوتية مشتركة\",\n      \"2 Caregiver Logins\": \"حسابا دخول لمقدمي الرعاية\",\n      \"All plans include cascade routing, the caller menu, and 24/7 reliability. Set it up for your parent in minutes — cancel anytime.\": \"تشمل جميع الخطط الرنين المتتالي وقائمة المتصل وموثوقية على مدار الساعة طوال أيام الأسبوع. أعدّه لوالديك في دقائق — وألغِ في أي وقت.\",\n      \"All plans include cascade routing, the caller menu, and 24/7 reliability. Set it up in minutes — cancel anytime.\": \"تشمل جميع الخطط الرنين المتتالي وقائمة المتصل وموثوقية على مدار الساعة طوال أيام الأسبوع. الإعداد يتم في دقائق — وألغِ في أي وقت.\",\n      \"All plans include cascade routing, the caller menu, time-aware coverage, and 24/7 reliability. Cancel anytime.\": \"تشمل جميع الخطط الرنين المتتالي وقائمة المتصل والتغطية حسب الوقت وموثوقية على مدار الساعة طوال أيام الأسبوع. ألغِ في أي وقت.\",\n      \"Designed for the moments that matter\": \"مصمم للحظات الهامة التي تهم عائلتك\",\n      \"iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.\": \"يعد iCanCall الحل المثالي للعائلات التي تتطلع لاتصال بسيط وآمن دون قيود الشاشات والتطبيقات الذكية.\",\n      \"For Kids\": \"للأطفال\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"مكّن أطفالك من الوصول للعائلة من أي هاتف منزلي أو هاتف تقليدي، دون الحاجة للوقوع في تشتيت الهواتف الذكية.\",\n      \"For Seniors\": \"لكبار السن\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"شريان حياة مثالي للوالدين والأجداد. لا يتعين عليهم سوى حفظ رقم واحد للاتصال بجميع أفراد العائلة.\",\n      \"For Special Needs\": \"لذوي الاحتياجات الخاصة\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"يسهل الاتصال للأفراد الذين يواجهون صعوبات إدراكية أو حركية، ليوصلهم مباشرة بالدعم الموثوق.\",\n      \"One number\": \"رقم واحد\",\n      \"Build the circle\": \"ابنِ الدائرة\",\n      \"Questions\": \"الأسئلة\",\n      \"For parents of young children\": \"لآباء وأمهات الأطفال الصغار\",\n      \"they'll never forget.\": \"لن ينسوه أبداً.\",\n      \"Little ones can't memorize a whole contact list — but they can learn one number. iCanCall turns that single number into the entire family: it rings you, then your partner, then Grandma, then a trusted neighbor, until someone who loves them picks up.\": \"لا يستطيع الصغار حفظ قائمة جهات اتصال كاملة — لكنهم يستطيعون تعلّم رقم واحد. يحوّل iCanCall هذا الرقم الوحيد إلى العائلة بأكملها: يرنّ عليك، ثم على شريك حياتك، ثم على الجدة، ثم على جار موثوق، حتى يجيب شخص يحبهم.\",\n      \"No phone of their own required.\": \"لا يلزمهم هاتف خاص بهم.\",\n      \"They can call from a friend's house, the school office, or any phone — and still reach family in seconds.\": \"يمكنهم الاتصال من بيت صديق أو مكتب المدرسة أو أي هاتف — والوصول إلى العائلة في ثوانٍ.\",\n      \"Emma's iCanCall number\": \"رقم iCanCall الخاص بـ Emma\",\n      \"Incoming call\": \"مكالمة واردة\",\n      \"She dials one number — it finds a grown-up she knows, in order, until someone answers\": \"تتصل برقم واحد — فيبحث بالترتيب عن شخص بالغ تعرفه حتى يجيب أحدهم\",\n      \"Mom\": \"الأم\",\n      \"Mobile\": \"الجوال\",\n      \"Standing by\": \"في وضع الاستعداد\",\n      \"Dad\": \"الأب\",\n      \"Grandma Rose\": \"الجدة Rose\",\n      \"Grandparent\": \"أحد الأجداد\",\n      \"Neighbor\": \"الجار\",\n      \"Made for little hands and big worries\": \"صُمّم للأيدي الصغيرة والهموم الكبيرة\",\n      \"number to memorize\": \"رقم يحفظونه\",\n      \"grown-ups it can reach\": \"بالغين يصل إليهم\",\n      \"apps or phones needed\": \"تطبيقات أو هواتف مطلوبة\",\n      \"Any\": \"أي\",\n      \"phone, anywhere\": \"هاتف، في أي مكان\",\n      \"The whole lesson\": \"الدرس كله\",\n      \"One number is all they have to learn.\": \"رقم واحد هو كل ما عليهم تعلّمه.\",\n      \"Ask a five-year-old to remember Mom's cell, Dad's cell, Grandma's house, and the neighbor next door, and you'll lose them at \\\"cell.\\\" iCanCall replaces the whole list with a single number — and quietly does the rest.\": \"اطلب من طفل في الخامسة أن يتذكر جوال أمه، وجوال أبيه، ومنزل جدته، وبيت الجار المجاور، وستفقد انتباهه عند كلمة «جوال». يستبدل iCanCall القائمة كلها برقم واحد — ويتولى الباقي بهدوء.\",\n      \"The old way\": \"الطريقة القديمة\",\n      \"A list no child can hold\": \"قائمة لا يقدر طفل على حفظها\",\n      \"Too many numbers, scribbled on the fridge — and never the right one in the moment that counts.\": \"أرقام كثيرة جداً، مخربشة على الثلاجة — ولا يحضر الرقم الصحيح أبداً في اللحظة الحاسمة.\",\n      \"Mom — cell\": \"الأم — الجوال\",\n      \"Dad — work\": \"الأب — العمل\",\n      \"\\\"Which one do I call if you don't answer?\\\"\": \"«بأيّ رقم أتصل إذا لم تُجِب؟»\",\n      \"With iCanCall\": \"مع iCanCall\",\n      \"One number, every grown-up\": \"رقم واحد، لكل البالغين\",\n      \"They learn it like a nursery rhyme. It finds whoever's available — you don't have to be the one who picks up.\": \"يحفظونه كأنشودة أطفال. ويجد من هو متاح — فلا يلزم أن تكون أنت من يجيب.\",\n      \"Our family number\": \"رقم عائلتنا\",\n      \"\\\"If you ever need us, call this. Someone will always answer.\\\"\": \"«إذا احتجت إلينا يوماً، فاتصل بهذا الرقم. سيجيبك أحدنا دائماً.»\",\n      \"Set it up once. Teach it once.\": \"أعدّه مرة. وعلّمه مرة.\",\n      \"A few minutes of setup buys years of \\\"I can always reach a grown-up.\\\"\": \"دقائق قليلة من الإعداد تمنحهم سنوات من «أستطيع دائماً الوصول إلى شخص بالغ».\",\n      \"Claim your family number\": \"احجز رقم عائلتك\",\n      \"Pick one easy-to-remember iCanCall number. Put it on a backpack tag, a lunchbox card, and the classroom contact card — the only number your child needs anywhere they go.\": \"اختر رقم iCanCall واحداً سهل التذكر. ضعه على بطاقة حقيبة الظهر، وبطاقة علبة الغداء، وبطاقة جهات الاتصال في الصف — إنه الرقم الوحيد الذي يحتاجه طفلك أينما ذهب.\",\n      \"Add the grown-ups\": \"أضف البالغين\",\n      \"You, your partner, grandparents, a babysitter, a trusted neighbor — up to six people, in the order you want them reached. Adjust anytime from your phone.\": \"أنت وشريك حياتك والأجداد وجليسة الأطفال وجار موثوق — حتى ستة أشخاص، بالترتيب الذي تريد الوصول إليهم به. عدّل في أي وقت من هاتفك.\",\n      \"Teach them the number\": \"علّمهم الرقم\",\n      \"That's the whole job for them. When they call, iCanCall\": \"هذه كل مهمتهم. عندما يتصلون، فإن iCanCall\",\n      \"cascades\": \"ينتقل بالرنين المتتالي\",\n      \"through the circle until someone answers — and every grown-up gets a text that the call came in.\": \"عبر الدائرة حتى يجيب أحدهم — ويتلقى كل بالغ رسالة نصية بورود المكالمة.\",\n      \"Wherever they are\": \"أينما كانوا\",\n      \"The same number works\": \"الرقم نفسه يعمل\",\n      \"everywhere life happens.\": \"أينما أخذتهم الحياة.\",\n      \"No phone of their own? No problem. One number reaches family from any phone they can get to.\": \"ليس لديهم هاتف خاص؟ لا مشكلة. رقم واحد يصلهم بالعائلة من أي هاتف يجدونه.\",\n      \"Home after school\": \"في البيت بعد المدرسة\",\n      \"Beat you home? One call lets them check in and reach whoever's free — you, Grandma, or the neighbor.\": \"وصلوا إلى البيت قبلك؟ مكالمة واحدة تتيح لهم طمأنتك والوصول إلى من هو متفرغ — أنت أو الجدة أو الجار.\",\n      \"At a friend's house\": \"في بيت صديق\",\n      \"From a friend's landline or a parent's phone, the one number still finds your family — no contacts to look up.\": \"من الهاتف الأرضي في بيت صديق أو من هاتف أحد والديه، يظل الرقم الواحد يصل إلى عائلتك — دون البحث عن جهات اتصال.\",\n      \"Lost at the store\": \"تائه في المتجر\",\n      \"A clerk or another grown-up can dial the number with them, and a familiar voice answers right away.\": \"يمكن لموظف المتجر أو أي شخص بالغ آخر أن يتصل بالرقم معهم، فيجيب صوت مألوف على الفور.\",\n      \"When plans change\": \"عندما تتغير الخطط\",\n      \"Practice ran late or pickup got moved? One call routes to whoever can come — no scramble, no guessing.\": \"تأخر التدريب أو تغيّر موعد الاصطحاب؟ مكالمة واحدة تتجه إلى من يستطيع الحضور — بلا ارتباك ولا تخمين.\",\n      \"Try it yourself\": \"جرّبه بنفسك\",\n      \"Build the circle that answers for your child.\": \"ابنِ الدائرة التي تجيب طفلك.\",\n      \"Add the grown-ups you trust, set their order, then place a pretend call. Choose\": \"أضف البالغين الذين تثق بهم، ورتّبهم، ثم أجرِ مكالمة تجريبية. اختر\",\n      \"cascade\": \"الرنين المتتالي\",\n      \"— ring everyone in turn until someone picks up — or a simple\": \"— يرنّ على الجميع بالدور حتى يجيب أحدهم — أو خياراً بسيطاً هو\",\n      \"caller menu\": \"قائمة المتصل\",\n      \". Your child only ever dials one number.\": \". أما طفلك فلا يتصل إلا برقم واحد.\",\n      \"Routing mode\": \"وضع التوجيه\",\n      \"Call cascade\": \"رنين متتالي\",\n      \"Caller menu\": \"قائمة المتصل\",\n      \"You set this once in the dashboard\": \"تضبط هذا مرة واحدة في لوحة التحكم\",\n      \"Your child's circle\": \"دائرة طفلك\",\n      \"/6 contacts\": \"/6 جهات اتصال\",\n      \"Ready\": \"جاهز\",\n      \"Press call to start routing\": \"اضغط «اتصال» لبدء التوجيه\",\n      \"Place a call\": \"أجرِ مكالمة\",\n      \"Toggle contacts to \\\"Busy\\\" to see the cascade skip ahead.\": \"بدّل حالة جهات الاتصال إلى «مشغول» لترى الرنين المتتالي يتخطاها.\",\n      \"Why parents choose iCanCall\": \"لماذا يختار الآباء والأمهات iCanCall\",\n      \"Built so they always reach\": \"صُمّم ليصلوا دائماً إلى\",\n      \"someone who loves them.\": \"شخص يحبهم.\",\n      \"One number to memorize\": \"رقم واحد للحفظ\",\n      \"Children learn a single number instead of a fragile list. It's the only one they'll ever need to reach the whole family.\": \"يتعلم الأطفال رقماً واحداً بدلاً من قائمة يسهل نسيانها. إنه الرقم الوحيد الذي سيحتاجون إليه للوصول إلى العائلة كلها.\",\n      \"No phone of their own\": \"بلا هاتف خاص بهم\",\n      \"Works from any phone — a friend's, a teacher's, a landline. Your child doesn't need a device to reach you.\": \"يعمل من أي هاتف — هاتف صديق أو معلّم أو هاتف أرضي. لا يحتاج طفلك إلى جهاز ليصل إليك.\",\n      \"Someone always answers\": \"هناك دائماً من يجيب\",\n      \"If you're busy, the call rolls to your partner, then a grandparent, then a trusted neighbor — until a familiar voice picks up.\": \"إذا كنت مشغولاً، تنتقل المكالمة إلى شريك حياتك، ثم إلى أحد الأجداد، ثم إلى جار موثوق — حتى يجيب صوت مألوف.\",\n      \"You always know\": \"أنت على علم دائماً\",\n      \"Every grown-up in the circle gets a text the moment your child calls — so you're never the last to find out.\": \"يتلقى كل بالغ في الدائرة رسالة نصية لحظة اتصال طفلك — فلا تكون أبداً آخر من يعلم.\",\n      \"Different by time of day\": \"مختلف حسب وقت اليوم\",\n      \"Route to the babysitter after school and to you in the evening — automatically, so the right grown-up always answers.\": \"وجّه المكالمات إلى جليسة الأطفال بعد المدرسة وإليك في المساء — تلقائياً، ليجيب البالغ المناسب دائماً.\",\n      \"Private & protected\": \"خاص ومحمي\",\n      \"Everyone's real numbers stay hidden behind your single iCanCall line. All routing is encrypted, and your data is never sold.\": \"تبقى الأرقام الحقيقية للجميع مخفية خلف خط iCanCall الواحد الخاص بك. كل التوجيه مشفّر، وبياناتك لا تُباع أبداً.\",\n      \"Simple, honest pricing\": \"أسعار بسيطة وصادقة\",\n      \"Peace of mind, less than a phone bill.\": \"راحة البال، بأقل من فاتورة الهاتف.\",\n      \"/ month\": \"/ شهرياً\",\n      \"What parents ask us most.\": \"أكثر ما يسألنا عنه الآباء والأمهات.\",\n      \"Does my child need their own phone?\": \"هل يحتاج طفلي إلى هاتف خاص به؟\",\n      \"No. That's the whole idea. iCanCall is one number that works from\": \"لا. وهذه هي الفكرة كلها. iCanCall رقم واحد يعمل من\",\n      \"any\": \"أي\",\n      \"phone — a friend's house, the school office, a neighbor's landline. Your child just needs to know the number, and a familiar grown-up answers.\": \"هاتف — في بيت صديق، أو مكتب المدرسة، أو هاتف الجيران الأرضي. كل ما يحتاجه طفلك هو معرفة الرقم، وسيجيبه شخص بالغ يعرفه.\",\n      \"Isn't one number too simple for something urgent?\": \"أليس الرقم الواحد أبسط من اللازم للأمور العاجلة؟\",\n      \"Simple is exactly what works under stress. One number rings each grown-up in your circle in order until someone picks up — so a child who's scared or hurt never has to decide\": \"البساطة هي بالضبط ما ينجح تحت الضغط. رقم واحد يرنّ على كل بالغ في دائرتك بالترتيب حتى يجيب أحدهم — فلا يضطر طفل خائف أو مصاب إلى أن يقرر\",\n      \"who\": \"بمن\",\n      \"to call. (iCanCall is for reaching family quickly; for life-threatening emergencies, always teach your child to call 911 too.)\": \"يتصل. (iCanCall مخصص للوصول إلى العائلة بسرعة؛ أما في حالات الطوارئ المهددة للحياة، فعلّم طفلك دائماً الاتصال بالرقم 911 أيضاً.)\",\n      \"What if I'm busy and can't pick up?\": \"ماذا لو كنت مشغولاً ولم أستطع الرد؟\",\n      \"The call simply rolls to the next grown-up — your partner, then a grandparent, then a trusted neighbor — until someone answers. Everyone in the circle also gets a text that your child called, so you'll know the moment you're free.\": \"تنتقل المكالمة ببساطة إلى البالغ التالي — شريك حياتك، ثم أحد الأجداد، ثم جار موثوق — حتى يجيب أحدهم. ويتلقى كل من في الدائرة أيضاً رسالة نصية بأن طفلك اتصل، فتعرف ذلك لحظة تفرّغك.\",\n      \"Can I change who's in the circle, or the order?\": \"هل يمكنني تغيير أفراد الدائرة أو ترتيبهم؟\",\n      \"Anytime, in seconds, from your dashboard. Add the new babysitter, drop a contact, or reorder who's reached first. Changes take effect on the very next call.\": \"في أي وقت، وفي ثوانٍ، من لوحة التحكم. أضف جليسة الأطفال الجديدة، أو احذف جهة اتصال، أو أعد ترتيب من يُتصل به أولاً. وتسري التغييرات من المكالمة التالية مباشرة.\",\n      \"Will strangers see our family's phone numbers?\": \"هل سيرى الغرباء أرقام هواتف عائلتنا؟\",\n      \"Never. Everyone's personal numbers stay hidden behind your single iCanCall line. All routing is encrypted, and we never sell your data.\": \"أبداً. تبقى الأرقام الشخصية للجميع مخفية خلف خط iCanCall الواحد الخاص بك. كل التوجيه مشفّر، ولا نبيع بياناتك أبداً.\",\n      \"How do I help my child remember the number?\": \"كيف أساعد طفلي على تذكّر الرقم؟\",\n      \"Most families turn it into a little rhyme or song and practice a \\\"pretend call\\\" together. Put it on a backpack tag and the school contact form, and within a week it sticks — because it's the only number they have to know.\": \"تحوّله معظم العائلات إلى أنشودة أو أغنية صغيرة وتتدرب معاً على «مكالمة تجريبية». ضعه على بطاقة حقيبة الظهر وفي استمارة جهات الاتصال المدرسية، وخلال أسبوع سيرسخ في ذهنه — لأنه الرقم الوحيد الذي عليه معرفته.\",\n      \"Give them one number. Give yourself peace of mind.\": \"امنحهم رقماً واحداً. وامنح نفسك راحة البال.\",\n      \"In a few minutes, your child will have a single number that always reaches a grown-up who loves them — from any phone, anywhere. No device, no contact list, no guessing.\": \"خلال دقائق قليلة، سيكون لدى طفلك رقم واحد يصله دائماً بشخص بالغ يحبه — من أي هاتف، وفي أي مكان. بلا جهاز، ولا قائمة جهات اتصال، ولا تخمين.\",\n      \"One memorable number that always connects your child to a grown-up who loves them — from any phone, anywhere.\": \"رقم واحد سهل التذكر يربط طفلك دائماً بشخص بالغ يحبه — من أي هاتف، وفي أي مكان.\",\n      \"For every family\": \"لكل عائلة\",\n      \"iCanCall, Inc. All rights reserved.\": \"iCanCall, Inc. جميع الحقوق محفوظة.\"\n    },\n    \"attrs\": {\n      \"Name\": \"الاسم\",\n      \"Relationship\": \"العلاقة\"\n    }\n  },\n  \"hi\": {\n    \"text\": {\n      \ ,\n      \"5 Dedicated Safety Numbers\": \"5 समर्पित सुरक्षा नंबर\",\n      \"Up to 15 Roster Contacts per Number\": \"प्रति नंबर अधिकतम 15 संपर्क सदस्य\",\n      \"All Routing Modes + Scheduling\": \"सभी रूटिंग मोड + शेड्यूलिंग\",\n      \"150 pooled voice minutes\": \"150 साझा कॉल मिनट\",\n      \"2 Caregiver Logins\": \"2 केयरगिवर लॉगिन\",\n      \"All plans include cascade routing, the caller menu, and 24/7 reliability. Set it up for your parent in minutes — cancel anytime.\": \"सभी प्लान में कैस्केड कॉल, कॉलर मेनू और 24/7 विश्वसनीयता शामिल है। अपने माता-पिता के लिए इसे मिनटों में सेट करें — किसी भी समय रद्द करें।\",\n      \"All plans include cascade routing, the caller menu, and 24/7 reliability. Set it up in minutes — cancel anytime.\": \"सभी प्लान में कैस्केड कॉल, कॉलर मेनू और 24/7 विश्वसनीयता शामिल है। इसे मिनटों में सेट करें — किसी भी समय रद्द करें।\",\n      \"All plans include cascade routing, the caller menu, time-aware coverage, and 24/7 reliability. Cancel anytime.\": \"सभी प्लान में कैस्केड कॉल, कॉलर मेनू, समय-आधारित कवरेज और 24/7 विश्वसनीयता शामिल है। किसी भी समय रद्द करें।\",\n      \"Designed for the moments that matter\": \"उन पलों के लिए डिज़ाइन किया गया जो आपके परिवार के लिए मायने रखते हैं\",\n      \"iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.\": \"iCanCall उन परिवारों के लिए सटीक बैठता है जिन्हें बिना किसी स्क्रीन की उलझन के साधारण और सुरक्षित संचार साधन चाहिए।\",\n      \"For Kids\": \"बच्चों के लिए\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"बच्चों को किसी भी बुनियादी या लैंडलाइन फोन से परिवार तक पहुंचने की सुविधा दें, बिना स्मार्टफोन के भटकाव के।\",\n      \"For Seniors\": \"बुजुर्गों के लिए\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"बुजुर्ग माता-पिता या दादा-दादी के लिए एक जीवन रेखा। पूरे परिवार तक पहुँचने के लिए उन्हें केवल एक नंबर याद रखना होगा।\",\n      \"For Special Needs\": \"विशेष आवश्यकताओं के लिए\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"संज्ञानात्मक या शारीरिक रूप से कमजोर व्यक्तियों के लिए कॉल मिलाना आसान बनाता है, जिससे उन्हें सीधे सहायता मिलती है।\",\n      \"One number\": \"एक नंबर\",\n      \"Build the circle\": \"सर्कल बनाएं\",\n      \"Questions\": \"सवाल\",\n      \"For parents of young children\": \"छोटे बच्चों के माता-पिता के लिए\",\n      \"they'll never forget.\": \"जो वे कभी नहीं भूलेंगे।\",\n      \"Little ones can't memorize a whole contact list — but they can learn one number. iCanCall turns that single number into the entire family: it rings you, then your partner, then Grandma, then a trusted neighbor, until someone who loves them picks up.\": \"नन्हे बच्चे पूरी कॉन्टैक्ट लिस्ट याद नहीं रख सकते — पर एक नंबर ज़रूर सीख सकते हैं। iCanCall उस एक नंबर को पूरा परिवार बना देता है: वह पहले आपको रिंग करता है, फिर आपके जीवनसाथी को, फिर दादी को, फिर एक भरोसेमंद पड़ोसी को, जब तक उनसे प्यार करने वाला कोई फोन न उठा ले।\",\n      \"No phone of their own required.\": \"उनका अपना फोन होना ज़रूरी नहीं।\",\n      \"They can call from a friend's house, the school office, or any phone — and still reach family in seconds.\": \"वे दोस्त के घर से, स्कूल के ऑफिस से, या किसी भी फोन से कॉल कर सकते हैं — और फिर भी सेकंडों में परिवार तक पहुंच जाते हैं।\",\n      \"Emma's iCanCall number\": \"Emma का iCanCall नंबर\",\n      \"Incoming call\": \"इनकमिंग कॉल\",\n      \"She dials one number — it finds a grown-up she knows, in order, until someone answers\": \"वह एक नंबर डायल करती है — वह क्रम से किसी जाने-पहचाने बड़े को ढूंढता है, जब तक कोई जवाब न दे\",\n      \"Mom\": \"माँ\",\n      \"Mobile\": \"मोबाइल\",\n      \"Standing by\": \"स्टैंडबाय पर\",\n      \"Dad\": \"पापा\",\n      \"Grandma Rose\": \"दादी Rose\",\n      \"Grandparent\": \"दादा-दादी\",\n      \"Neighbor\": \"पड़ोसी\",\n      \"Made for little hands and big worries\": \"नन्हे हाथों और बड़ी चिंताओं के लिए बना\",\n      \"number to memorize\": \"नंबर याद रखना है\",\n      \"grown-ups it can reach\": \"बड़ों तक पहुंच सकता है\",\n      \"apps or phones needed\": \"ऐप या फोन की ज़रूरत\",\n      \"Any\": \"किसी भी\",\n      \"phone, anywhere\": \"फोन से, कहीं से भी\",\n      \"The whole lesson\": \"पूरा सबक\",\n      \"One number is all they have to learn.\": \"उन्हें बस एक नंबर सीखना है।\",\n      \"Ask a five-year-old to remember Mom's cell, Dad's cell, Grandma's house, and the neighbor next door, and you'll lose them at \\\"cell.\\\" iCanCall replaces the whole list with a single number — and quietly does the rest.\": \"किसी पांच साल के बच्चे से कहिए कि वह माँ का मोबाइल, पापा का मोबाइल, दादी के घर का और बगल वाले पड़ोसी का नंबर याद रखे — वह \\\"मोबाइल\\\" पर ही अटक जाएगा। iCanCall पूरी लिस्ट की जगह एक ही नंबर दे देता है — और बाकी काम चुपचाप खुद कर लेता है।\",\n      \"The old way\": \"पुराना तरीका\",\n      \"A list no child can hold\": \"ऐसी लिस्ट जो कोई बच्चा याद नहीं रख सकता\",\n      \"Too many numbers, scribbled on the fridge — and never the right one in the moment that counts.\": \"फ्रिज पर लिखे ढेर सारे नंबर — और ज़रूरत के पल में सही नंबर कभी नहीं मिलता।\",\n      \"Mom — cell\": \"माँ — मोबाइल\",\n      \"Dad — work\": \"पापा — ऑफिस\",\n      \"\\\"Which one do I call if you don't answer?\\\"\": \"\\\"अगर आप जवाब न दें तो मैं किसे कॉल करूँ?\\\"\",\n      \"With iCanCall\": \"iCanCall के साथ\",\n      \"One number, every grown-up\": \"एक नंबर, सारे बड़े\",\n      \"They learn it like a nursery rhyme. It finds whoever's available — you don't have to be the one who picks up.\": \"वे इसे किसी बाल-कविता की तरह सीख लेते हैं। जो भी उपलब्ध हो, यह उसे ढूंढ लेता है — ज़रूरी नहीं कि फोन आप ही उठाएं।\",\n      \"Our family number\": \"हमारा फैमिली नंबर\",\n      \"\\\"If you ever need us, call this. Someone will always answer.\\\"\": \"\\\"जब भी हमारी ज़रूरत पड़े, इस पर कॉल करना। कोई न कोई हमेशा जवाब देगा।\\\"\",\n      \"Set it up once. Teach it once.\": \"एक बार सेटअप करें। एक बार सिखाएं।\",\n      \"A few minutes of setup buys years of \\\"I can always reach a grown-up.\\\"\": \"कुछ मिनटों का सेटअप, और बरसों का भरोसा: \\\"मैं हमेशा किसी बड़े तक पहुंच सकता हूँ।\\\"\",\n      \"Claim your family number\": \"अपना फैमिली नंबर चुनें\",\n      \"Pick one easy-to-remember iCanCall number. Put it on a backpack tag, a lunchbox card, and the classroom contact card — the only number your child needs anywhere they go.\": \"एक आसानी से याद रहने वाला iCanCall नंबर चुनें। उसे बैग के टैग, लंचबॉक्स के कार्ड और क्लास के कॉन्टैक्ट कार्ड पर लिख दें — आपका बच्चा जहां भी जाए, उसे बस इसी एक नंबर की ज़रूरत है।\",\n      \"Add the grown-ups\": \"बड़ों को जोड़ें\",\n      \"You, your partner, grandparents, a babysitter, a trusted neighbor — up to six people, in the order you want them reached. Adjust anytime from your phone.\": \"आप, आपके जीवनसाथी, दादा-दादी, बेबीसिटर, एक भरोसेमंद पड़ोसी — अधिकतम छह लोग, उसी क्रम में जिसमें आप उन तक कॉल पहुंचाना चाहें। अपने फोन से कभी भी बदलें।\",\n      \"Teach them the number\": \"उन्हें नंबर सिखाएं\",\n      \"That's the whole job for them. When they call, iCanCall\": \"उनका काम बस इतना ही है। जब वे कॉल करते हैं, तो iCanCall कॉल को सर्कल में\",\n      \"cascades\": \"कैस्केड करता है\",\n      \"through the circle until someone answers — and every grown-up gets a text that the call came in.\": \"जब तक कोई जवाब न दे — और हर बड़े को टेक्स्ट मिल जाता है कि कॉल आई है।\",\n      \"Wherever they are\": \"वे जहां भी हों\",\n      \"The same number works\": \"वही नंबर काम करता है\",\n      \"everywhere life happens.\": \"जहां-जहां ज़िंदगी ले जाए।\",\n      \"No phone of their own? No problem. One number reaches family from any phone they can get to.\": \"अपना फोन नहीं है? कोई बात नहीं। जो भी फोन उनके हाथ लगे, उससे एक नंबर परिवार तक पहुंचा देता है।\",\n      \"Home after school\": \"स्कूल के बाद घर पर\",\n      \"Beat you home? One call lets them check in and reach whoever's free — you, Grandma, or the neighbor.\": \"आपसे पहले घर पहुंच गए? एक कॉल से वे अपनी खबर दे सकते हैं और जो भी खाली हो उस तक पहुंच सकते हैं — आप, दादी, या पड़ोसी।\",\n      \"At a friend's house\": \"दोस्त के घर पर\",\n      \"From a friend's landline or a parent's phone, the one number still finds your family — no contacts to look up.\": \"दोस्त के लैंडलाइन से हो या उसके माता-पिता के फोन से, वही एक नंबर आपके परिवार को ढूंढ लेता है — कोई कॉन्टैक्ट खोजने की ज़रूरत नहीं।\",\n      \"Lost at the store\": \"दुकान में खो जाएं तो\",\n      \"A clerk or another grown-up can dial the number with them, and a familiar voice answers right away.\": \"कोई दुकानदार या कोई और बड़ा उनके साथ नंबर डायल कर सकता है, और तुरंत एक जानी-पहचानी आवाज़ जवाब देती है।\",\n      \"When plans change\": \"जब प्लान बदल जाए\",\n      \"Practice ran late or pickup got moved? One call routes to whoever can come — no scramble, no guessing.\": \"प्रैक्टिस देर तक चली या पिकअप का समय बदल गया? एक कॉल उस तक पहुंच जाती है जो आ सकता है — न भागदौड़, न अंदाज़े।\",\n      \"Try it yourself\": \"खुद आज़माकर देखें\",\n      \"Build the circle that answers for your child.\": \"वह सर्कल बनाएं जो आपके बच्चे की कॉल का जवाब दे।\",\n      \"Add the grown-ups you trust, set their order, then place a pretend call. Choose\": \"अपने भरोसेमंद बड़ों को जोड़ें, उनका क्रम तय करें, फिर एक नकली कॉल करके देखें। चुनें\",\n      \"cascade\": \"कैस्केड\",\n      \"— ring everyone in turn until someone picks up — or a simple\": \"— जब तक कोई फोन न उठा ले, सबको बारी-बारी से रिंग करें — या एक सरल\",\n      \"caller menu\": \"कॉलर मेनू\",\n      \". Your child only ever dials one number.\": \"। आपका बच्चा बस एक ही नंबर डायल करता है।\",\n      \"Routing mode\": \"रूटिंग मोड\",\n      \"Call cascade\": \"कैस्केड कॉल\",\n      \"Caller menu\": \"कॉलर मेनू\",\n      \"You set this once in the dashboard\": \"यह आप डैशबोर्ड में एक बार सेट करते हैं\",\n      \"Your child's circle\": \"आपके बच्चे का सर्कल\",\n      \"/6 contacts\": \"/6 संपर्क\",\n      \"Ready\": \"तैयार\",\n      \"Press call to start routing\": \"रूटिंग शुरू करने के लिए कॉल दबाएं\",\n      \"Place a call\": \"कॉल करें\",\n      \"Toggle contacts to \\\"Busy\\\" to see the cascade skip ahead.\": \"कैस्केड को आगे बढ़ते देखने के लिए संपर्कों को \\\"व्यस्त\\\" पर टॉगल करें।\",\n      \"Why parents choose iCanCall\": \"माता-पिता iCanCall क्यों चुनते हैं\",\n      \"Built so they always reach\": \"इसलिए बना कि वे हमेशा पहुंचें\",\n      \"someone who loves them.\": \"किसी ऐसे तक जो उनसे प्यार करता है।\",\n      \"One number to memorize\": \"याद रखने को एक नंबर\",\n      \"Children learn a single number instead of a fragile list. It's the only one they'll ever need to reach the whole family.\": \"बच्चे एक कमज़ोर-सी लिस्ट की जगह बस एक नंबर सीखते हैं। पूरे परिवार तक पहुंचने के लिए उन्हें बस इसी की ज़रूरत है।\",\n      \"No phone of their own\": \"अपना फोन ज़रूरी नहीं\",\n      \"Works from any phone — a friend's, a teacher's, a landline. Your child doesn't need a device to reach you.\": \"किसी भी फोन से चलता है — दोस्त का, टीचर का, या लैंडलाइन। आप तक पहुंचने के लिए आपके बच्चे को किसी डिवाइस की ज़रूरत नहीं।\",\n      \"Someone always answers\": \"कोई न कोई हमेशा जवाब देता है\",\n      \"If you're busy, the call rolls to your partner, then a grandparent, then a trusted neighbor — until a familiar voice picks up.\": \"अगर आप व्यस्त हैं, तो कॉल आपके जीवनसाथी के पास जाती है, फिर दादा-दादी के पास, फिर एक भरोसेमंद पड़ोसी के पास — जब तक कोई जानी-पहचानी आवाज़ जवाब न दे।\",\n      \"You always know\": \"आपको हमेशा पता रहता है\",\n      \"Every grown-up in the circle gets a text the moment your child calls — so you're never the last to find out.\": \"जैसे ही आपका बच्चा कॉल करता है, सर्कल के हर बड़े को टेक्स्ट मिल जाता है — ताकि आपको सबसे आखिर में पता न चले।\",\n      \"Different by time of day\": \"दिन के समय के हिसाब से अलग\",\n      \"Route to the babysitter after school and to you in the evening — automatically, so the right grown-up always answers.\": \"स्कूल के बाद कॉल बेबीसिटर के पास और शाम को आपके पास जाए — अपने आप, ताकि हमेशा सही बड़ा जवाब दे।\",\n      \"Private & protected\": \"निजी और सुरक्षित\",\n      \"Everyone's real numbers stay hidden behind your single iCanCall line. All routing is encrypted, and your data is never sold.\": \"सभी के असली नंबर आपकी एक iCanCall लाइन के पीछे छिपे रहते हैं। पूरी रूटिंग एन्क्रिप्टेड है, और आपका डेटा कभी बेचा नहीं जाता।\",\n      \"Simple, honest pricing\": \"सरल, ईमानदार कीमतें\",\n      \"Peace of mind, less than a phone bill.\": \"मन की शांति, फोन के बिल से भी कम में।\",\n      \"/ month\": \"/ माह\",\n      \"What parents ask us most.\": \"माता-पिता हमसे सबसे ज़्यादा क्या पूछते हैं।\",\n      \"Does my child need their own phone?\": \"क्या मेरे बच्चे को अपना फोन चाहिए?\",\n      \"No. That's the whole idea. iCanCall is one number that works from\": \"नहीं। यही तो पूरी सोच है। iCanCall एक ऐसा नंबर है जो\",\n      \"any\": \"किसी भी\",\n      \"phone — a friend's house, the school office, a neighbor's landline. Your child just needs to know the number, and a familiar grown-up answers.\": \"फोन से काम करता है — दोस्त का घर, स्कूल का ऑफिस, पड़ोसी का लैंडलाइन। आपके बच्चे को बस नंबर पता होना चाहिए, और कोई जाना-पहचाना बड़ा जवाब देता है।\",\n      \"Isn't one number too simple for something urgent?\": \"क्या किसी ज़रूरी स्थिति के लिए एक नंबर कुछ ज़्यादा ही सरल नहीं है?\",\n      \"Simple is exactly what works under stress. One number rings each grown-up in your circle in order until someone picks up — so a child who's scared or hurt never has to decide\": \"तनाव में सरल चीज़ ही काम आती है। एक नंबर आपके सर्कल के हर बड़े को क्रम से रिंग करता है, जब तक कोई फोन न उठा ले — इसलिए डरे हुए या चोट खाए बच्चे को कभी यह तय नहीं करना पड़ता कि कॉल\",\n      \"who\": \"किसे\",\n      \"to call. (iCanCall is for reaching family quickly; for life-threatening emergencies, always teach your child to call 911 too.)\": \"करनी है। (iCanCall परिवार तक जल्दी पहुंचने के लिए है; जान को खतरे वाली इमरजेंसी के लिए अपने बच्चे को 911 पर कॉल करना भी हमेशा सिखाएं।)\",\n      \"What if I'm busy and can't pick up?\": \"अगर मैं व्यस्त हूँ और फोन न उठा पाऊँ तो?\",\n      \"The call simply rolls to the next grown-up — your partner, then a grandparent, then a trusted neighbor — until someone answers. Everyone in the circle also gets a text that your child called, so you'll know the moment you're free.\": \"कॉल बस अगले बड़े के पास चली जाती है — आपके जीवनसाथी, फिर दादा-दादी, फिर एक भरोसेमंद पड़ोसी — जब तक कोई जवाब न दे। सर्कल में सबको यह टेक्स्ट भी मिलता है कि आपके बच्चे ने कॉल की थी, इसलिए खाली होते ही आपको पता चल जाएगा।\",\n      \"Can I change who's in the circle, or the order?\": \"क्या मैं सर्कल के लोग या उनका क्रम बदल सकता हूँ?\",\n      \"Anytime, in seconds, from your dashboard. Add the new babysitter, drop a contact, or reorder who's reached first. Changes take effect on the very next call.\": \"कभी भी, कुछ ही सेकंड में, अपने डैशबोर्ड से। नई बेबीसिटर को जोड़ें, कोई संपर्क हटाएं, या यह क्रम बदलें कि कॉल पहले किसके पास जाए। बदलाव अगली ही कॉल से लागू हो जाते हैं।\",\n      \"Will strangers see our family's phone numbers?\": \"क्या अजनबी हमारे परिवार के फोन नंबर देख पाएंगे?\",\n      \"Never. Everyone's personal numbers stay hidden behind your single iCanCall line. All routing is encrypted, and we never sell your data.\": \"कभी नहीं। सभी के निजी नंबर आपकी एक iCanCall लाइन के पीछे छिपे रहते हैं। पूरी रूटिंग एन्क्रिप्टेड है, और हम आपका डेटा कभी नहीं बेचते।\",\n      \"How do I help my child remember the number?\": \"मैं अपने बच्चे को नंबर याद रखने में कैसे मदद करूँ?\",\n      \"Most families turn it into a little rhyme or song and practice a \\\"pretend call\\\" together. Put it on a backpack tag and the school contact form, and within a week it sticks — because it's the only number they have to know.\": \"ज़्यादातर परिवार इसे एक छोटी-सी कविता या गाना बना लेते हैं और साथ मिलकर \\\"नकली कॉल\\\" की प्रैक्टिस करते हैं। इसे बैग के टैग और स्कूल के कॉन्टैक्ट फॉर्म पर लिख दें, और एक हफ्ते में यह याद हो जाता है — क्योंकि उन्हें बस यही एक नंबर जानना है।\",\n      \"Give them one number. Give yourself peace of mind.\": \"उन्हें एक नंबर दें। खुद को मन की शांति दें।\",\n      \"In a few minutes, your child will have a single number that always reaches a grown-up who loves them — from any phone, anywhere. No device, no contact list, no guessing.\": \"कुछ ही मिनटों में आपके बच्चे के पास एक ऐसा नंबर होगा जो हमेशा उससे प्यार करने वाले किसी बड़े तक पहुंचता है — किसी भी फोन से, कहीं से भी। न डिवाइस, न कॉन्टैक्ट लिस्ट, न अंदाज़े।\",\n      \"One memorable number that always connects your child to a grown-up who loves them — from any phone, anywhere.\": \"एक याद रखने योग्य नंबर जो आपके बच्चे को हमेशा उससे प्यार करने वाले किसी बड़े से जोड़ता है — किसी भी फोन से, कहीं से भी।\",\n      \"For every family\": \"हर परिवार के लिए\",\n      \"iCanCall, Inc. All rights reserved.\": \"iCanCall, Inc. सर्वाधिकार सुरक्षित।\"\n    },\n    \"attrs\": {\n      \"Name\": \"नाम\",\n      \"Relationship\": \"संबंध\"\n    }\n  },\n  \"pt\": {\n    \"text\": {\n      \"How it works\": \"Como funciona\",\n      \"Features\": \"Recursos\",\n      \"Who it's for\": \"Para quem\",\n      \"Pricing\": \"Preços\",\n      \"FAQ\": \"Perguntas frequentes\",\n      \"Login\": \"Entrar\",\n      \"See how it works\": \"Ver funcionamento\",\n      \"Select a Plan\": \"Escolher plano\",\n      \"See How We Compare\": \"Veja como nos comparamos\",\n      \"Comparison Chart\": \"Tabela de Comparação\",\n      \"Key:\": \"Legenda:\",\n      \"Included\": \"Incluso\",\n      \"Not available\": \"Não disponível\",\n      \"Limited or conditional\": \"Parcial Limitado ou condicional\",\n      \"Product\": \"Produto\",\n      \"Who\": \"Para quem\",\n      \"Company\": \"Empresa\",\n      \"Trust\": \"Suporte e Segurança\",\n      \"Parents\": \"Pais\",\n      \"Caregivers\": \"Cuidadores\",\n      \"Seniors\": \"Idosos\",\n      \"About\": \"Sobre nós\",\n \"they'll never forget.\": \"que eles nunca vão esquecer.\",\n      \"Little ones can't memorize a whole contact list — but they can learn one number. iCanCall turns that single number into the entire family: it rings you, then your partner, then Grandma, then a trusted neighbor, until someone who loves them picks up.\": \"Os pequenos não conseguem decorar uma lista inteira de contatos — mas conseguem aprender um número. O iCanCall transforma esse único número na família inteira: ele chama você, depois seu parceiro ou parceira, depois a vovó, depois um vizinho de confiança, até que alguém que os ama atenda.\",\n      \"No phone of their own required.\": \"Não precisam ter telefone próprio.\",\n      \"They can call from a friend's house, the school office, or any phone — and still reach family in seconds.\": \"Eles podem ligar da casa de um amigo, da secretaria da escola ou de qualquer telefone — e falar com a família em segundos.\",\n      \"Emma's iCanCall number\": \"Número iCanCall da Emma\",\n      \"Incoming call\": \"Chamada recebida\",\n      \"She dials one number — it finds a grown-up she knows, in order, until someone answers\": \"Ela disca um só número — ele procura um adulto que ela conhece, na ordem, até alguém atender\",\n      \"Mom\": \"Mãe\",\n      \"Mobile\": \"Celular\",\n      \"Standing by\": \"De prontidão\",\n      \"Dad\": \"Pai\",\n      \"Grandma Rose\": \"Vovó Rose\",\n      \"Grandparent\": \"Avó\",\n      \"Neighbor\": \"Vizinho(a)\",\n      \"Made for little hands and big worries\": \"Feito para mãos pequenas e grandes preocupações\",\n      \"number to memorize\": \"número para memorizar\",\n      \"grown-ups it can reach\": \"adultos ao alcance\",\n      \"apps or phones needed\": \"aplicativos ou celulares necessários\",\n      \"Any\": \"Qualquer\",\n      \"phone, anywhere\": \"telefone, em qualquer lugar\",\n      \"The whole lesson\": \"A lição inteira\",\n      \"One number is all they have to learn.\": \"Um número é tudo o que eles precisam aprender.\",\n      \"Ask a five-year-old to remember Mom's cell, Dad's cell, Grandma's house, and the neighbor next door, and you'll lose them at \\\"cell.\\\" iCanCall replaces the whole list with a single number — and quietly does the rest.\": \"Peça a uma criança de cinco anos para lembrar o celular da mamãe, o celular do papai, a casa da vovó e o vizinho ao lado, e ela se perde já no “celular”. O iCanCall troca a lista inteira por um único número — e cuida do resto discretamente.\",\n      \"The old way\": \"O jeito antigo\",\n      \"A list no child can hold\": \"Uma lista que nenhuma criança guarda\",\n      \"Too many numbers, scribbled on the fridge — and never the right one in the moment that counts.\": \"Números demais, rabiscados na geladeira — e nunca o certo na hora que importa.\",\n      \"Mom — cell\": \"Mamãe — celular\",\n      \"Dad — work\": \"Papai — trabalho\",\n      \"\\\"Which one do I call if you don't answer?\\\"\": \"“Para qual eu ligo se você não atender?”\",\n      \"With iCanCall\": \"Com o iCanCall\",\n      \"One number, every grown-up\": \"Um número, todos os adultos\",\n      \"They learn it like a nursery rhyme. It finds whoever's available — you don't have to be the one who picks up.\": \"Eles aprendem como uma cantiga de criança. O número encontra quem estiver disponível — não precisa ser você a atender.\",\n      \"Our family number\": \"O número da nossa família\",\n      \"\\\"If you ever need us, call this. Someone will always answer.\\\"\": \"“Se um dia precisar de nós, ligue para este número. Alguém sempre vai atender.”\",\n      \"Set it up once. Teach it once.\": \"Configure uma vez. Ensine uma vez.\",\n      \"A few minutes of setup buys years of \\\"I can always reach a grown-up.\\\"\": \"Alguns minutos de configuração garantem anos de “eu sempre consigo falar com um adulto”.\",\n      \"Claim your family number\": \"Garanta o número da sua família\",\n      \"Pick one easy-to-remember iCanCall number. he one number still finds your family — no contacts to look up.\": \"Do telefone fixo de um amigo ou do celular de outro pai, o mesmo número encontra sua família — sem precisar procurar contatos.\",\n      \"Lost at the store\": \"Perdido na loja\",\n      \"A clerk or another grown-up can dial the number with them, and a familiar voice answers right away.\": \"Um atendente ou outro adulto pode discar o número com a criança, e uma voz conhecida atende na hora.\",\n      \"When plans change\": \"Quando os planos mudam\",\n      \"Practice ran late or pickup got moved? One call routes to whoever can come — no scramble, no guessing.\": \"O treino atrasou ou a hora de buscar mudou? Uma ligação vai para quem puder ir — sem correria, sem adivinhação.\",\n      \"Try it yourself\": \"Experimente você mesmo\",\n      \"Build the circle that answers for your child.\": \"Monte o círculo que atende quando seu filho liga.\",\n      \"Add the grown-ups you trust, set their order, then place a pretend call. Choose\": \"Adicione os adultos em quem você confia, defina a ordem e faça uma ligação simulada. Escolha a\",\n      \"cascade\": \"cascata\",\n      \"— ring everyone in turn until someone picks up — or a simple\": \"— que chama todos, um de cada vez, até alguém atender — ou um simples\",\n      \"caller menu\": \"menu vocal\",\n      \". Your child only ever dials one number.\": \". Seu filho só disca um único número.\",\n      \"Routing mode\": \"Modo de encaminhamento\",\n      \"Call cascade\": \"Cascata de chamadas\",\n      \"Caller menu\": \"Menu vocal\",\n      \"You set this once in the dashboard\": \"Você define isso uma única vez no painel\",\n      \"Your child's circle\": \"Círculo do seu filho\",\n      \"/6 contacts\": \"/6 contatos\",\n      \"Ready\": \"Pronto\",\n      \"Press call to start routing\": \"Toque em ligar para iniciar o encaminhamento\",\n      \"Place a call\": \"Fazer uma ligação\",\n      \"Toggle contacts to \\\"Busy\\\" to see the cascade skip ahead.\": \"Marque contatos como “Ocupado” para ver a cascata passar adiante.\",\n      \"Why parents choose iCanCall\": \"Por que os pais escolhem o iCanCall\",\n      \"Built so they always reach\": \"Feito para que sempre encontrem\",\n      \"someone who loves them.\": \"alguém que os ama.\",\n      \"One number to memorize\": \"Um número para memorizar\",\n      \"Children learn a single number instead of a fragile list. It's the only one they'll ever need to reach the whole family.\": \"As crianças aprendem um único número em vez de uma lista frágil. É o único de que vão precisar para falar com a família inteira.\",\n      \"No phone of their own\": \"Sem telefone próprio\",\n      \"Works from any phone — a friend's, a teacher's, a landline. Your child doesn't need a device to reach you.\": \"Funciona de qualquer telefone — de um amigo, de um professor, de um fixo. Seu filho não precisa de um aparelho para falar com você.\",\n      \"Someone always answers\": \"Alguém sempre atende\",\n      \"If you're busy, the call rolls to your partner, then a grandparent, then a trusted neighbor — until a familiar voice picks up.\": \"Se você estiver ocupado, a ligação passa para seu parceiro ou parceira, depois para um dos avós, depois para um vizinho de confiança — até uma voz conhecida atender.\",\n      \"You always know\": \"Você sempre fica sabendo\",\n      \"Every grown-up in the circle gets a text the moment your child calls — so you're never the last to find out.\": \"Cada adulto do círculo recebe um SMS no momento em que seu filho liga — assim você nunca é o último a saber.\",\n      \"Different by time of day\": \"Diferente conforme o horário\",\n      \"Route to the babysitter after school and to you in the evening — automatically, so the right grown-up always answers.\": \"Encaminhe para a babá depois da escola e para você à noite — automaticamente, para que o adulto certo sempre atenda.\",\n      \"Private & protected\": \"Privado e protegido\",\n      \"Everyone's real numbers stay hidden behind your single iCanCall line. All routing is encrypted, and your data is never sold.\": \"Os números reais de todos ficam ocultos atrás da sua linha única do iCanCall. Todo o encaminhamento é criptografado, e seus dados nunca são vendidos.\",\n      \"Simple, honest pricing\": \"Preços simples e honestos\",\n      \"Peace of mind, less than a phone bill.\": \"Tranquilidade por menos que uma conta de telefone.\",\n      \"/ month\": \"/ mês\",\n      \"What parents ask us most.\": \"O que os pais mais nos perguntam.\",\n      \"Does my child need their own phone?\": \"Meu filho precisa ter um telefone próprio?\",\n      \"No. That's the whole idea. iCanCall is one number that works from\": \"Não. Essa é justamente a ideia. O iCanCall é um número que funciona de\",\n      \"any\": \"qualquer\",\n      \"phone — a friend's house, the school office, a neighbor's landline. Your child just needs to know the number, and a familiar grown-up answers.\": \"telefone — a casa de um amigo, a secretaria da escola, o fixo de um vizinho. Seu filho só precisa saber o número, e um adulto conhecido atende.\",\n      \"Isn't one number too simple for something urgent?\": \"Um só número não é simples demais para algo urgente?\",\n      \"Simple is exactly what works under stress. One number rings each grown-up in your circle in order until someone picks up — so a child who's scared or hurt never has to decide\": \"O simples é exatamente o que funciona sob estresse. Um número chama cada adulto do seu círculo, na ordem, até alguém atender — assim, uma criança assustada ou machucada nunca precisa decidir\",\n      \"who\": \"para quem\",\n      \"to call. (iCanCall is for reaching family quickly; for life-threatening emergencies, always teach your child to call 911 too.)\": \"ligar. (O iCanCall serve para falar rápido com a família; em emergências com risco de vida, ensine sempre seu filho a ligar também para o 911.)\",\n      \"What if I'm busy and can't pick up?\": \"E se eu estiver ocupado e não puder atender?\",\n      \"The call simply rolls to the next grown-up — your partner, then a grandparent, then a trusted neighbor — until someone answers. Everyone in the circle also gets a text that your child called, so you'll know the moment you're free.\": \"A ligação simplesmente passa para o próximo adulto — seu parceiro ou parceira, depois um dos avós, depois um vizinho de confiança — até alguém atender. Todos no círculo também recebem um SMS avisando que seu filho ligou, então você fica sabendo assim que estiver livre.\",\n      \"Can I change who's in the circle, or the order?\": \"Posso mudar quem está no círculo ou a ordem?\",\n      \"Anytime, in seconds, from your dashboard. Add the new babysitter, drop a contact, or reorder who's reached first. Changes take effect on the very next call.\": \"Quando quiser, em segundos, pelo painel. Adicione a nova babá, remova um contato ou mude quem é chamado primeiro. As mudanças valem já na próxima ligação.\",\n      \"Will strangers see our family's phone numbers?\": \"Estranhos vão ver os números de telefone da nossa família?\",\n      \"Never. Everyone's personal numbers stay hidden behind your single iCanCall line. All routing is encrypted, and we never sell your data.\": \"Nunca. Os números pessoais de todos ficam ocultos atrás da sua linha única do iCanCall. Todo o encaminhamento é criptografado, e nunca vendemos seus dados.\",\n      \"How do I help my child remember the number?\": \"Como ajudo meu filho a lembrar o número?\",\n      \"Most families turn it into a little rhyme or song and practice a \\\"pretend call\\\" together. Put it on a backpack tag and the school contact form, and within a week it sticks — because it's the only number they have to know.\": \"A maioria das famílias transforma o número numa rima ou musiquinha e treina junto uma “ligação de faz de conta”. Coloque-o na etiqueta da mochila e na ficha de contatos da escola, e em uma semana ele está decorado — porque é o único número que eles precisam saber.\",\n      \"Give them one number. Give yourself peace of mind.\": \"Dê a eles um número. Dê a você tranquilidade.\",\n      \"In a few minutes, your child will have a single number that always reaches a grown-up who loves them — from any phone, anywhere. No device, no contact list, no guessing.\": \"Em poucos minutos, seu filho terá um único número que sempre encontra um adulto que o ama — de qualquer telefone, em qualquer lugar. Sem aparelho, sem lista de contatos, sem adivinhação.\",\n      \"One memorable number that always connects your child to a grown-up who loves them — from any phone, anywhere.\": \"Um número memorável que sempre conecta seu filho a um adulto que o ama — de qualquer telefone, em qualquer lugar.\",\n      \"For every family\": \"Para todas as famílias\",\n      \"iCanCall, Inc. All rights reserved.\": \"iCanCall, Inc. Todos os direitos reservados.\"\n    },\n    \"attrs\": {\n      \"Name\": \"Nome\",\n      \"Relationship\": \"Parentesco\"\n    }\n  },\n  \"de\": {\n    \"text\": {\n      \"How it works\": \"Funktionsweise\",\n      \"Features\": \"Funktionen\",\n      \"Who it's for\": \"Für wen\",\n      \"Pricing\": \"Preise\",\n      \"FAQ\": \"FAQ\",\n      \"Login\": \"Anmelden\",\n      \"See how it works\": \"Wie es funktioniert\",\n      \"Select a Plan\": \"Tarif wählen\",\n      \"See How We Compare\": \"Sehen Sie, wie wir uns vergleichen\",\n      \"Comparison Chart\": \"Vergleichstabelle\",\n      \"Key:\": \"Legende:\",\n      \"Included\": \"Inklusive\",\n      \"Not available\": \"Nicht verfügbar\",\n      \"Limited or conditional\": \"Teilweise Eingeschränkt oder optional\",\n      \"Product\": \"Produkt\",\n      \"Who\": \"Für wen\",\n      \"Company\": \"Unternehmen\",\n      \"Trust\": \"Vertrauen\",\n      \"Parents\": \"Eltern\",\n      \"Caregivers\": \"Betreuer\",\n      \"Seniors\": \"Senioren\",\n      \"About\": \"Über uns\",\n      \"Careers\": ed one.\": \"Eine Nummer für eine pflegebedürftige Person.\",\n      \"Full protection for the whole circle.\": \"Kompletter Schutz für den gesamten Rufkreis.\",\n      \"Billed monthly · cancel anytime\": \"Monatlich abgerechnet · jederzeit kündbar\",\n      \"Just $10.75/mo, billed annually\": \"Nur $10.75/Monat bei jährlicher Abrechnung\",\n      \"Just $16.58/mo, billed annually\": \"Nur $16.58/Monat bei jährlicher Abrechnung\",\n      \"Everything included in the plan:\": \"Alles im Tarif enthalten:\",\n      \"1 number included\": \"1 eigene Sicherheitsnummer\",\n      \"3 routable trusted contacts\": \"Bis zu 3 Kontakte im Rufkreis\",\n      \"Cascade routing + Caller Menu\": \"Kaskadenweiterleitung + Sprachmenü\",\n      \"30 voice minutes\": \"30 Sprachminuten\",\n      \"Bilingual greeting options\": \"Zweisprachige Ansagen möglich\",\n      \"Works on any phone — no app needed\": \"Funktioniert auf jedem Telefon — ohne App\",\n      \"2 dedicated phone numbers\": \"2 eigene Sicherheitsnummern\",\n      \"6 routable trusted contacts\": \"Bis zu 6 Kontakte im Rufkreis\",\n      \"60 minutes included\": \"60 Minuten inklusive\",\n      \"Real-time call alerts\": \"Anrufsignale in Echtzeit\",\n      \"Admin dashboard\": \"Betreuer-Dashboard\",\n      \"SMS & email notifications\": \"SMS- & E-Mail-Benachrichtigungen\",\n      \"Stories from families\": \"Kundengeschichten\",\n      \"The calls that got through.\": \"Die Anrufe, die zustande kamen.\",\n      \"Questions, answered\": \"Häufig gestellte Fragen\",\n      \"Everything you might ask.\": \"Alles, was Sie fragen möchten.\",\n      \"Ringing…\": \"Es klingelt…\",\n      \"Connected ✓\": \"Verbunden ✓\",\n      \"Care Team\": \"Care Team\",\n      \"Select Plan\": \"Tarif wählen\",\n      \"One number for one parent.\": \"Eine Nummer für ein Elternteil.\",\n      \"Full coverage for the whole care team.\": \"Volle Abdeckung für das gesamte Pflegeteam.\",\n      \"Built for shared caregiving across several loved ones, with room for a second caregiver.\": \"Für die gemeinsame Betreuung mehrerer Angehöriger — mit Platz für eine zweite Pflegeperson.\",\n      \"Just $12.42/mo, billed annually\": \"Nur $12.42/Monat bei jährlicher Abrechnung\",\n      \"Just $20.75/mo, billed annually\": \"Nur $20.75/Monat bei jährlicher Abrechnung\",\n      \"Just $41.58/mo, billed annually\": \"Nur $41.58/Monat bei jährlicher Abrechnung\",\n      \"1 Dedicated Safety Number\": \"1 eigene Sicherheitsnummer\",\n      \"Up to 3 Roster Contacts\": \"Bis zu 3 Kontakte im Rufkreis\",\n      \"Call Cascade (Sequential)\": \"Kaskadenweiterleitung (nacheinander)\",\n      \"Real-time Email Alerts\": \"E-Mail-Benachrichtigungen in Echtzeit\",\n      \"Standard voicemail box\": \"Standard-Mailbox\",\n      \"14-day service guarantee\": \"14 Tage Service-Garantie\",\n      \"2 Dedicated Safety Numbers\": \"2 eigene Sicherheitsnummern\",\n      \"Up to 6 Roster Contacts\": \"Bis zu 6 Kontakte im Rufkreis\",\n      \"Cascade & Caller Menu (IVR)\": \"Kaskade & Sprachmenü (IVR)\",\n      \"Time-of-day Scheduling\": \"Zeitgesteuerte Weiterleitung\",\n      \"Bilingual Greeting Options\": \"Zweisprachige Ansagen möglich\",\n      \"Instant Voicemail Email Transcriptions\": \"Sofortige Mailbox-Transkripte per E-Mail\",\n      \"5 Dedicated Safety Numbers\": \"5 eigene Sicherheitsnummern\",\n      \"Up to 15 Roster Contacts per Number\": \"Bis zu 15 Kontakte im Rufkreis pro Nummer\",\n      \"All Routing Modes + Scheduling\": \"Alle Weiterleitungsarten + Zeitsteuerung\",\n      \"150 pooled voice minutes\": \"150 Sprachminuten zur gemeinsamen Nutzung\",\n      \"2 Caregiver Logins\": \"2 Zugänge für Pflegepersonen\",\n      \"All plans include cascade routing, the caller menu, and 24/7 reliability. Set it up for your parent in minutes — cancel anytime.\": \"Alle Tarife enthalten Kaskadenweiterleitung, Sprachmenü und rund um die Uhr zuverlässigen Betrieb. In wenigen Minuten für Ihre Eltern eingerichtet — jederzeit kündbar.\",\n      \"All plans include cascade routing, the caller menu, and 24/7 reliability. Set it up in minutes — cancel anytime.\": \"Alle Tarife enthalten Kaskadenweiterleitung, Sprachmenü und rund um die Uhr zuverlässigen Betrieb. In wenigen Minuten eingerichtet — jederzeit kündbar.\",\n      \"All plans include cascade routing, the caller menu, time-aware coverage, and 24/7 reliability. Cancel anytime.\": \"Alle Tarife enthalten Kaskadenweiterleitung, Sprachmenü, zeitgesteuerte Abdeckung und rund um die Uhr zuverlässigen Betrieb. Jederzeit kündbar.\",\n      \"Designed for the moments that matter\": \"Entwickelt für die wichtigsten Momente\",\n      \"iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.\": \"iCanCall passt perfekt in das Leben von Familien, die eine einfache und bildschirmfreie Sicherheitsverbindung wünschen.\",\n      \"For Kids\": \"Für Kinder\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"Ermöglicht es Kindern, die Familie von jedem Festnetz- oder Standardtelefon zu erreichen, ohne Ablenkungen durch Smartphones.\",\n      \"For Seniors\": \"Für Senioren\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"Eine Lebenslinie für Eltern und Großeltern. Sie müssen sich nur eine einzige Nummer merken, um die Familie zu erreichen.\",\n      \"For Special Needs\": \"Besondere Bedürfnisse\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"Vereinfacht das Telefonieren für Menschen mit kognitiven oder körperlichen Einschränkungen und bietet direkten Support.\",\n      \"One number\": \"Eine Nummer\",\n      \"Build the circle\": \"Rufkreis aufbauen\",\n      \"Questions\": \"Fragen\",\n      \"For parents of young children\": \"Für Eltern junger Kinder\",\n      \"they'll never forget.\": \"die sie nie vergessen.\",\n      \"Little ones can't memorize a whole contact list — but they can learn one number. iCanCall turns that single number into the entire family: it rings you, then your partner, then Grandma, then a trusted neighbor, until someone who loves them picks up.\": \"Die Kleinen können sich keine ganze Kontaktliste merken – aber eine Nummer schon. iCanCall macht aus dieser einen Nummer die ganze Familie: Es klingelt bei Ihnen, dann bei Ihrem Partner, dann bei Oma, dann bei einem vertrauten Nachbarn – bis jemand abnimmt, der sie lieb hat.\",\n      \"No phone of their own required.\": \"Kein eigenes Telefon nötig.\",\n      \"They can call from a friend's house, the school office, or any phone — and still reach family in seconds.\": \"Ihr Kind kann von Freunden aus, aus dem Schulsekretariat oder von jedem anderen Telefon anrufen – und erreicht die Familie trotzdem in Sekunden.\",\n      \"Emma's iCanCall number\": \"Emmas iCanCall-Nummer\",\n      \"Incoming call\": \"Eingehender Anruf\",\n      \"She dials one number — it finds a grown-up she knows, in order, until someone answers\": \"Sie wählt eine Nummer – die erreicht der Reihe nach einen vertrauten Erwachsenen, bis jemand abnimmt\",\n      \"Mom\": \"Mama\",\n      \"Mobile\": \"Mobil\",\n      \"Standing by\": \"In Bereitschaft\",\n      \"Dad\": \"Papa\",\n      \"Grandma Rose\": \"Oma Rose\",\n      \"Grandparent\": \"Großeltern\",\n      \"Neighbor\": \"Nachbarschaft\",\n      \"Made for little hands and big worries\": \"Gemacht für kleine Hände und große Sorgen\",\n      \"number to memorize\": \"Nummer zum Merken\",\n      \"grown-ups it can reach\": \"erreichbare Erwachsene\",\n      \"apps or phones needed\": \"Apps oder Handys nötig\",\n      \"Any\": \"Jedes\",\n      \"phone, anywhere\": \"Telefon, überall\",\n      \"The whole lesson\": \"Die ganze Lektion\",\n      \"One number is all they have to learn.\": \"Eine Nummer – mehr müssen Kinder nicht lernen.\",\n      \"Ask a five-year-old to remember Mom's cell, Dad's cell, Grandma's house, and the neighbor next door, and you'll lose them at \\\"cell.\\\" iCanCall replaces the whole list with a single number — and quietly does the rest.\": \"Bitten Sie ein fünfjähriges Kind, sich Mamas Handy, Papas Handy, Omas Festnetz und den Nachbarn von nebenan zu merken – und schon bei „Handy“ haben Sie es verloren. iCanCall ersetzt die ganze Liste durch eine einzige Nummer – und erledigt den Rest ganz unauffällig.\",\n      \"The old way\": \"Früher\",\n      \"A list no child can hold\": \"Eine Liste, die sich kein Kind merken kann\",\n      \"Too many numbers, scribbled on the fridge — and never the right one in the moment that counts.\": \"Zu viele Nummern, an den Kühlschrank gekritzelt – und im entscheidenden Moment nie die richtige.\",\n      \"Mom — cell\": \"Mama – Handy\",\n      \"Dad — work\": \"Papa – Arbeit\",\n      \"\\\"Which one do I call if you don't answer?\\\"\": \"„Wen rufe ich an, wenn du nicht rangehst?“\",\n      \"With iCanCall\": \"Mit iCanCall\",\n      \"One number, every grown-up\": \"Eine Nummer, alle Erwachsenen\",\n      \"They learn it like a nursery rhyme. It finds whoever's available — you don't have to be the one who picks up.\": \"Kinder lernen sie wie einen Kinderreim. Sie findet, wer gerade erreichbar ist – Sie müssen nicht selbst derjenige sein, der abnimmt.\",\n      \"Our family number\": \"Unsere Familiennummer\",\n      \"\\\"If you ever need us, call this. Someone will always answer.\\\"\": \"„Wenn du uns jemals brauchst, ruf hier an. Es geht immer jemand ran.“\",\n      \"Set it up once. Teach it once.\": \"Einmal einrichten. Einmal beibringen.\",\n      \"A few minutes of setup buys years of \\\"I can always reach a grown-up.\\\"\": \"Ein paar Minuten Einrichtung – und jahrelang gilt: „Ich kann immer einen Erwachsenen erreichen.“\",\n      \"Claim your family number\": \"Familiennummer sichern\",\n      \"Pick one easy-to-remember iCanCall number. Put it on a backpack tag, a lunchbox card, and the classroom contact card — the only number your child needs anywhere they go.\": \"Wählen Sie eine leicht zu merkende iCanCall-Nummer. Bringen Sie sie am Rucksackanhänger, auf einer Karte in der Brotdose und auf dem Kontaktbogen der Klasse an – die einzige Nummer, die Ihr Kind braucht, egal wo es ist.\",\n      \"Add the grown-ups\": \"Die Erwachsenen hinzufügen\",\n      \"You, your partner, grandparents, a babysitter, a trusted neighbor — up to six people, in the order you want them reached. Adjust anytime from your phone.\": \"Sie, Ihr Partner, die Großeltern, ein Babysitter, ein vertrauter Nachbar – bis zu sechs Personen, in der Reihenfolge, in der sie erreicht werden sollen. Jederzeit vom Handy aus anpassbar.\",\n      \"Teach them the number\": \"Die Nummer beibringen\",\n      \"That's the whole job for them. When they call, iCanCall\": \"Mehr muss Ihr Kind nicht tun. Wenn es anruft, leitet iCanCall den Anruf\",\n      \"cascades\": \"kaskadenartig\",\n      \"through the circle until someone answers — and every grown-up gets a text that the call came in.\": \"durch den Rufkreis, bis jemand abnimmt – und jeder Erwachsene erhält eine SMS, dass der Anruf eingegangen ist.\",\n      \"Wherever they are\": \"Wo immer sie sind\",\n      \"The same number works\": \"Dieselbe Nummer funktioniert\",\n      \"everywhere life happens.\": \"überall, wo das Leben spielt.\",\n      \"No phone of their own? No problem. One number reaches family from any phone they can get to.\": \"Kein eigenes Telefon? Kein Problem. Eine Nummer erreicht die Familie von jedem Telefon aus, an das Ihr Kind herankommt.\",\n      \"Home after school\": \"Nach der Schule zu Hause\",\n      \"Beat you home? One call lets them check in and reach whoever's free — you, Grandma, or the neighbor.\": \"Vor Ihnen zu Hause? Mit einem Anruf kann sich Ihr Kind melden und erreicht, wer gerade Zeit hat – Sie, Oma oder den Nachbarn.\",\n      \"At a friend's house\": \"Bei Freunden zu Hause\",\n      \"From a friend's landline or a parent's phone, the one number still finds your family — no contacts to look up.\": \"Vom Festnetz der Freunde oder vom Handy anderer Eltern: Die eine Nummer findet Ihre Familie – ganz ohne Kontakte nachzuschlagen.\",\n      \"Lost at the store\": \"Im Laden verlaufen\",\n      \"A clerk or another grown-up can dial the number with them, and a familiar voice answers right away.\": \"Eine Verkäuferin oder ein anderer Erwachsener kann die Nummer gemeinsam mit Ihrem Kind wählen, und sofort meldet sich eine vertraute Stimme.\",\n      \"When plans change\": \"Wenn sich Pläne ändern\",\n      \"Practice ran late or pickup got moved? One call routes to whoever can come — no scramble, no guessing.\": \"Das Training dauert länger oder die Abholung wurde verschoben? Ein Anruf geht an den, der kommen kann – ohne Hektik, ohne Rätselraten.\",\n      \"Try it yourself\": \"Probieren Sie es selbst aus\",\n      \"Build the circle that answers for your child.\": \"Bauen Sie den Rufkreis, der für Ihr Kind abnimmt.\",\n      \"Add the grown-ups you trust, set their order, then place a pretend call. Choose\": \"Fügen Sie die Erwachsenen hinzu, denen Sie vertrauen, legen Sie die Reihenfolge fest und starten Sie dann einen Probeanruf. Wählen Sie die\",\n      \"cascade\": \"Kaskade\",\n      \"— ring everyone in turn until someone picks up — or a simple\": \"– alle werden nacheinander angerufen, bis jemand abnimmt – oder ein einfaches\",\n      \"caller menu\": \"Sprachmenü\",\n      \". Your child only ever dials one number.\": \". Ihr Kind wählt immer nur eine Nummer.\",\n      \"Routing mode\": \"Weiterleitungsart\",\n      \"Call cascade\": \"Anrufkaskade\",\n      \"Caller menu\": \"Sprachmenü\",\n      \"You set this once in the dashboard\": \"Das legen Sie einmal im Dashboard fest\",\n      \"Your child's circle\": \"Der Rufkreis Ihres Kindes\",\n      \"/6 contacts\": \"/6 Kontakte\",\n      \"Ready\": \"Bereit\",\n      \"Press call to start routing\": \"Starten Sie einen Anruf, um die Weiterleitung zu beginnen\",\n      \"Place a call\": \"Anruf starten\",\n      \"Toggle contacts to \\\"Busy\\\" to see the cascade skip ahead.\": \"Schalten Sie Kontakte auf „Besetzt“, um zu sehen, wie die Kaskade sie überspringt.\",\n      \"Why parents choose iCanCall\": \"Warum Eltern iCanCall wählen\",\n      \"Built so they always reach\": \"Damit sie immer jemanden erreichen,\",\n      \"someone who loves them.\": \"der sie lieb hat.\",\n      \"One number to memorize\": \"Eine Nummer zum Merken\",\n      \"Children learn a single number instead of a fragile list. It's the only one they'll ever need to reach the whole family.\": \"Kinder lernen eine einzige Nummer statt einer fehleranfälligen Liste. Es ist die einzige, die sie je brauchen, um die ganze Familie zu erreichen.\",\n      \"No phone of their own\": \"Kein eigenes Telefon\",\n      \"Works from any phone — a friend's, a teacher's, a landline. Your child doesn't need a device to reach you.\": \"Funktioniert von jedem Telefon aus – dem eines Freundes, einer Lehrerin, vom Festnetz. Ihr Kind braucht kein eigenes Gerät, um Sie zu erreichen.\",\n      \"Someone always answers\": \"Es nimmt immer jemand ab\",\n      \"If you're busy, the call rolls to your partner, then a grandparent, then a trusted neighbor — until a familiar voice picks up.\": \"Wenn Sie beschäftigt sind, geht der Anruf weiter an Ihren Partner, dann an die Großeltern, dann an einen vertrauten Nachbarn – bis eine vertraute Stimme abnimmt.\",\n      \"You always know\": \"Sie wissen immer Bescheid\",\n      \"Every grown-up in the circle gets a text the moment your child calls — so you're never the last to find out.\": \"Jeder Erwachsene im Rufkreis erhält eine SMS, sobald Ihr Kind anruft – so erfahren Sie es nie als Letzte.\",\n      \"Different by time of day\": \"Je nach Tageszeit anders\",\n      \"Route to the babysitter after school and to you in the evening — automatically, so the right grown-up always answers.\": \"Nach der Schule zum Babysitter, abends zu Ihnen – ganz automatisch, damit immer der richtige Erwachsene abnimmt.\",\n      \"Private & protected\": \"Privat & geschützt\",\n      \"Everyone's real numbers stay hidden behind your single iCanCall line. All routing is encrypted, and your data is never sold.\": \"Die echten Nummern aller Beteiligten bleiben hinter Ihrer einen iCanCall-Nummer verborgen. Die gesamte Weiterleitung ist verschlüsselt, und Ihre Daten werden niemals verkauft.\",\n      \"Simple, honest pricing\": \"Einfache, ehrliche Preise\",\n      \"Peace of mind, less than a phone bill.\": \"Ein beruhigendes Gefühl – günstiger als eine Telefonrechnung.\",\n      \"/ month\": \"/ Monat\",\n      \"What parents ask us most.\": \"Was Eltern uns am häufigsten fragen.\",\n      \"Does my child need their own phone?\": \"Braucht mein Kind ein eigenes Telefon?\",\n      \"No. That's the whole idea. iCanCall is one number that works from\": \"Nein. Genau das ist die Idee. iCanCall ist eine Nummer, die von\",\n      \"any\": \"jedem\",\n      \"phone — a friend's house, the school office, a neighbor's landline. Your child just needs to know the number, and a familiar grown-up answers.\": \"Telefon aus funktioniert – bei Freunden zu Hause, im Schulsekretariat, vom Festnetz der Nachbarn. Ihr Kind muss nur die Nummer kennen, und ein vertrauter Erwachsener nimmt ab.\",\n      \"Isn't one number too simple for something urgent?\": \"Ist eine einzige Nummer nicht zu simpel für den Ernstfall?\",\n      \"Simple is exactly what works under stress. One number rings each grown-up in your circle in order until someone picks up — so a child who's scared or hurt never has to decide\": \"Einfach ist genau das, was unter Stress funktioniert. Eine Nummer ruft jeden Erwachsenen in Ihrem Rufkreis der Reihe nach an, bis jemand abnimmt – so muss ein Kind, das Angst hat oder verletzt ist, nie entscheiden,\",\n      \"who\": \"wen\",\n      \"to call. (iCanCall is for reaching family quickly; for life-threatening emergencies, always teach your child to call 911 too.)\": \"es anrufen soll. (iCanCall ist dafür da, die Familie schnell zu erreichen; bringen Sie Ihrem Kind für lebensbedrohliche Notfälle immer auch den Notruf 911 bei.)\",\n      \"What if I'm busy and can't pick up?\": \"Was, wenn ich beschäftigt bin und nicht abnehmen kann?\",\n      \"The call simply rolls to the next grown-up — your partner, then a grandparent, then a trusted neighbor — until someone answers. Everyone in the circle also gets a text that your child called, so you'll know the moment you're free.\": \"Der Anruf geht einfach an den nächsten Erwachsenen weiter – Ihren Partner, dann die Großeltern, dann einen vertrauten Nachbarn – bis jemand abnimmt. Außerdem erhalten alle im Rufkreis eine SMS, dass Ihr Kind angerufen hat; Sie wissen also Bescheid, sobald Sie wieder Zeit haben.\",\n      \"Can I change who's in the circle, or the order?\": \"Kann ich ändern, wer im Rufkreis ist, oder die Reihenfolge?\",\n      \"Anytime, in seconds, from your dashboard. Add the new babysitter, drop a contact, or reorder who's reached first. Changes take effect on the very next call.\": \"Jederzeit, in Sekunden, in Ihrem Dashboard. Fügen Sie den neuen Babysitter hinzu, entfernen Sie einen Kontakt oder ändern Sie, wer zuerst erreicht wird. Änderungen gelten schon beim nächsten Anruf.\",\n      \"Will strangers see our family's phone numbers?\": \"Sehen Fremde die Telefonnummern unserer Familie?\",\n      \"Never. Everyone's personal numbers stay hidden behind your single iCanCall line. All routing is encrypted, and we never sell your data.\": \"Niemals. Die privaten Nummern aller Beteiligten bleiben hinter Ihrer einen iCanCall-Nummer verborgen. Die gesamte Weiterleitung ist verschlüsselt, und wir verkaufen Ihre Daten niemals.\",\n      \"How do I help my child remember the number?\": \"Wie helfe ich meinem Kind, sich die Nummer zu merken?\",\n      \"Most families turn it into a little rhyme or song and practice a \\\"pretend call\\\" together. Put it on a backpack tag and the school contact form, and within a week it sticks — because it's the only number they have to know.\": \"Die meisten Familien machen daraus einen kleinen Reim oder ein Lied und üben gemeinsam einen „Probeanruf“. Bringen Sie die Nummer am Rucksackanhänger an und tragen Sie sie ins Kontaktformular der Schule ein – innerhalb einer Woche sitzt sie, denn es ist die einzige Nummer, die Ihr Kind kennen muss.\",\n      \"Give them one number. Give yourself peace of mind.\": \"Geben Sie Ihrem Kind eine Nummer. Und sich selbst ein ruhiges Gefühl.\",\n      \"In a few minutes, your child will have a single number that always reaches a grown-up who loves them — from any phone, anywhere. No device, no contact list, no guessing.\": \"In wenigen Minuten hat Ihr Kind eine einzige Nummer, die immer einen Erwachsenen erreicht, der es lieb hat – von jedem Telefon aus, überall. Kein Gerät, keine Kontaktliste, kein Rätselraten.\",\n      \"One memorable number that always connects your child to a grown-up who loves them — from any phone, anywhere.\": \"Eine einprägsame Nummer, die Ihr Kind immer mit einem Erwachsenen verbindet, der es lieb hat – von jedem Telefon aus, überall.\",\n      \"For every family\": \"Für jede Familie\",\n      \"iCanCall, Inc. All rights reserved.\": \"iCanCall, Inc. Alle Rechte vorbehalten.\"\n    },\n    \"attrs\": {\n      \"Name\": \"Name\",\n      \"Relationship\": \"Beziehung\"\n    }\n  },\n  \"it\": {\n    \"text\": {\n      \"How it works\": \"Come funziona\",\n      \"Features\": \"Funionalità\",\n      \"Who it's for\": \"Per chi è\",\n      \"Pricing\": \"Prezzi\",\n      \"FAQ\": \"FAQ\",\n      \"Login\": \"Accedi\",\n      \"See how it works\": \"Come funziona\",\n      \"Select a Plan\": \"Scegli un piano\",\n      \"See How We Compare\": \"Scopri Come C
