================================== */\n\n:root {\n  /* Surfaces — subtly cool whites */\n  --bg:        oklch(0.992 0.005 220);\n  --surface:   oklch(1 0 0);\n  --tint:      oklch(0.965 0.018 218);   /* soft blue wash */\n  --tint-2:    oklch(0.945 0.028 210);\n  --line:      oklch(0.90 0.012 225);\n\n  /* Ink — cool near-blacks */\n  --ink:       oklch(0.26 0.028 248);\n  --ink-soft:  oklch(0.45 0.022 245);\n  --ink-faint: oklch(0.60 0.018 242);\n\n  /* Brand — calm blues + teal */\n  --blue:      oklch(0.58 0.115 232);\n  --blue-deep: oklch(0.44 0.105 240);\n  --blue-ink:  oklch(0.34 0.085 244);\n  --teal:      oklch(0.72 0.095 196);\n  --teal-deep: oklch(0.62 0.10 198);\n  --green:     oklch(0.70 0.13 158);\n\n  --shadow-sm: 0 1px 2px oklch(0.4 0.05 240 / 0.06), 0 2px 6px oklch(0.4 0.05 240 / 0.05);\n  --shadow-md: 0 4px 14px oklch(0.4 0.05 240 / 0.08), 0 10px 30px oklch(0.4 0.05 240 / 0.07);\n  --shadow-lg: 0 12px 28px oklch(0.4 0.06 240 / 0.10), 0 30px 60px oklch(0.4 0.06 240 / 0.10);\n\n  --r-sm: 10px;\n  --r-md: 16px;\n  --r-lg: 24px;\n  --r-xl: 32px;\n\n  --maxw: 1180px;\n  --pad: clamp(20px, 5vw, 56px);\n\n  --font: \"Atkinson Hyperlegible Next\", \"Helvetica Neue\", Helvetica, Arial, \"Segoe UI\", sans-serif;\n  --mono: var(--font);\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }\n\nbody {\n  font-family: var(--font);\n  background: var(--bg);\n  color: var(--ink);\n  line-height: 1.55;\n  font-size: 17px;\n  letter-spacing: -0.01em;\n}\n\na { color: inherit; text-decoration: none; }\nimg { display: block; max-width: 100%; }\n\n.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad); }\n\n/* ---------- Typography ---------- */\nh1, h2, h3, h4 { letter-spacing: -0.025em; line-height: 1.06; font-weight: 700; color: var(--ink); }\nh1 { font-size: clamp(2.6rem, 6vw, 4.6rem); }\nh2 { font-size: clamp(2rem, 4vw, 3.1rem); }\nh3 { font-size: clamp(1.25rem, 2vw, 1.6rem); }\n.lead { font-size: clamp(1.1rem, 1.6vw, 1.32rem); color: var(--ink-soft); line-height: 1.5; }\n\n.eyebrow {\n  display: inline-flex; align-items: center; gap: 8px;\n  font-size: 0.82rem; font-weight: 600; letter-spacing: 0.04em;\n  text-transform: uppercase; color: var(--blue-deep);\n}\n.eyebrow::before {\n  content: \"\"; width: 22px; height: 2px; border-radius: 2px;\n  background: var(--teal-deep);\n}\n\n.section { padding-block: clamp(72px, 10vw, 130px); }\n.section-head { max-width: 680px; }\n.section-head .eyebrow { margin-bottom: 18px; }\n.section-head .lead { margin-top: 18px; }\n.center { margin-inline: auto; text-align: center; }\n.center .eyebrow { justify-content: center; }\n\n/* ---------- Buttons ---------- */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 9px;\n  font-family: var(--font); font-size: 1rem; font-weight: 600;\n  padding: 14px 26px; border-radius: 999px; border: 1px solid transparent;\n  cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, background .18s ease;\n  white-space: nowrap;\n}\n.btn-primary {\n  background: var(--blue); color: #fff;\n  box-shadow: 0 6px 18px oklch(0.58 0.115 232 / 0.32);\n}\n.btn-primary:hover { background: var(--blue-deep); transform: translateY(-2px); box-shadow: 0 10px 24px oklch(0.58 0.115 232 / 0.38); }\n.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }\n.btn-ghost:hover { background: var(--tint); border-color: var(--blue); transform: translateY(-2px); }\n.btn-lg { padding: 17px 34px; font-size: 1.06rem; }\n\n/* ---------- Header ---------- */\n.header {\n  position: sticky; top: 0; z-index: 60;\n  backdrop-filter: blur(12px);\n  background: oklch(0.992 0.005 220 / 0.78);\n  border-bottom: 1px solid transparent;\n  transition: border-color .25s ease, background .25s ease;\n}\n.header.scrolled { border-color: var(--line); background: oklch(0.992 0.005 220 / 0.92); }\n.header-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }\n.brand { display: flex; align-items: center; gap: 11px; font-weight: 700; font-size: 1.22rem; letter-spacing: -0.03em; }\n.brand .mark {\n  width: 34px; height: 34px; border-radius: 10px; flex: none;\n  background: linear-gradient(150deg, var(--blue), var(--teal-deep));\n  display: grid; place-items: center; box-shadow: var(--shadow-sm);\n}\n.brand .mark svg { width: 18px; height: 18px; }\n.brand b { color: var(--blue-deep); }\n.nav { display: flex; align-items: center; gap: 32px; }\n.nav a { font-size: 0.96rem; color: var(--ink-soft); font-weight: 500; transition: color .15s; }\n.nav a:hover { color: var(--ink); }\n.header-cta { display: flex; align-items: center; gap: 14px; }\n.nav-toggle { display: none; }\n@media (max-width: 880px) {\n  .nav { display: none; }\n  .header-cta .btn-ghost { display: none; }\n}\n\n/* ---------- Hero ---------- */\n.hero { position: relative; overflow: hidden; padding-top: clamp(48px, 7vw, 86px); padding-bottom: clamp(60px, 8vw, 110px); }\n.hero::before {\n  content: \"\"; position: absolute; inset: -20% -10% auto -10%; height: 760px;\n  background:\n    radial-gradient(60% 60% at 78% 12%, oklch(0.72 0.095 196 / 0.18), transparent 70%),\n    radial-gradient(55% 55% at 18% 0%, oklch(0.58 0.115 232 / 0.16), transparent 70%);\n  pointer-events: none; z-index: 0;\n}\n.hero-grid {\n  position: relative; z-index: 1;\n  display: grid; grid-template-columns: 1.02fr 0.98fr; gap: clamp(36px, 5vw, 72px);\n  align-items: center;\n}\n.hero-copy .eyebrow { margin-bottom: 22px; }\n.hero-copy h1 { margin-bottom: 22px; }\n.hero-copy h1 .accent { color: var(--blue-deep); }\n.hero-copy .lead { max-width: 30ch; margin-bottom: 34px; }\n.hero-actions { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }\n.hero-note { margin-top: 22px; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--ink-faint); }\n.hero-note .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px oklch(0.70 0.13 158 / 0.18); }\n\n@media (max-width: 900px) {\n  .hero-grid { grid-template-columns: 1fr; }\n  .hero-copy .lead { max-width: 46ch; }\n}\n\n/* ---------- Routing demo ---------- */\n.demo {\n  position: relative;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--r-xl);\n  box-shadow: var(--shadow-lg);\n  padding: 26px 24px 22px;\n}\n.demo-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }\n.demo-number { display: flex; align-items: center; gap: 12px; }\n.demo-number .ring {\n  width: 44px; height: 44px; border-radius: 13px; flex: none;\n  background: linear-gradient(150deg, var(--blue), var(--teal-deep));\n  display: grid; place-items: center; position: relative;\n}\n.demo-number .ring svg { width: 21px; height: 21px; }\n.demo-number .ring::after {\n  content: \"\"; position: absolute; inset: 0; border-radius: 13px;\n  box-shadow: 0 0 0 0 oklch(0.58 0.115 232 / 0.45);\n  animation: pulse 2.4s ease-out infinite;\n}\n@keyframes pulse {\n  0% { box-shadow: 0 0 0 0 oklch(0.58 0.115 232 / 0.40); }\n  70% { box-shadow: 0 0 0 16px oklch(0.58 0.115 232 / 0); }\n  100% { box-shadow: 0 0 0 0 oklch(0.58 0.115 232 / 0); }\n}\n.demo-number .num { font-weight: 700; font-size: 1.12rem; letter-spacing: -0.02em; }\n.demo-number .num small { display: block; font-size: 0.72rem; font-weight: 500; color: var(--ink-faint); letter-spacing: 0.02em; }\n.demo-status {\n  font-size: 0.78rem; font-weight: 600; color: var(--blue-deep);\n  background: var(--tint); border: 1px solid var(--line);\n  padding: 6px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px;\n  transition: color .3s, background .3s, border-color .3s;\n}\n.demo-status .live { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }\n.demo.is-connected .demo-status { color: oklch(0.42 0.13 158); background: oklch(0.94 0.05 158); border-color: oklch(0.84 0.07 158); }\n.demo.is-connected .demo-status .live { background: var(--green); }\n\n.demo-caption { font-size: 0.78rem; color: var(--ink-faint); margin-bottom: 14px; padding-left: 2px; }\n\n.chain { display: flex; flex-direction: column; gap: 9px; }\n.contact {\n  position: relative; display: flex; align-items: center; gap: 13px;\n  padding: 11px 14px; border-radius: var(--r-md);\n  border: 1px solid var(--line); background: var(--surface);\n  transition: border-color .3s, background .3s, box-shadow .3s, opacity .3s, transform .3s;\n}\n.contact .avatar {\n  width: 38px; height: 38px; border-radius: 50%; flex: none;\n  display: grid; place-items: center; font-weight: 700; font-size: 0.9rem; color: #fff;\n}\n.contact .who { flex: 1; min-width: 0; }\n.contact .who b { font-size: 0.97rem; font-weight: 600; }\n.contact .who span { display: block; font-size: 0.8rem; color: var(--ink-faint); }\n.contact .state { font-size: 0.78rem; font-weight: 600; color: var(--ink-faint); white-space: nowrap; }\n.contact .order {\n  position: absolute; left: -1px; top: -1px;\n  width: 20px; height: 20px; border-radius: 0 0 10px 0;\n  background: var(--tint); color: var(--ink-faint);\n  font-size: 0.66rem; font-weight: 700; display: grid; place-items: center;\n}\n\n/* states */\n.contact.is-ringing {\n  border-color: var(--blue); background: var(--tint);\n  box-shadow: 0 0 0 3px oklch(0.58 0.115 232 / 0.12), var(--shadow-sm);\n}\n.contact.is-ringing .state { color: var(--blue-deep); }\n.contact.is-ringing .avatar { animation: wiggle .6s ease-in-out infinite; }\n@keyframes wiggle { 0%,100%{ transform: rotate(0); } 25%{ transform: rotate(-8deg);} 75%{ transform: rotate(8deg);} }\n.contact.is-missed { opacity: 0.5; }\n.contact.is-missed .state { color: var(--ink-faint); }\n.contact.is-connected {\n  border-color: oklch(0.80 0.09 158); background: oklch(0.96 0.04 158);\n  box-shadow: 0 0 0 3px oklch(0.70 0.13 158 / 0.16), var(--shadow-md);\n  transform: translateX(2px);\n}\n.contact.is-connected .state { color: oklch(0.42 0.13 158); }\n\n/* ---------- Logos / trust strip ---------- */\n.trust { padding-block: 40px; border-block: 1px solid var(--line); background: var(--surface); }\n.trust-inner { display: flex; align-items: center; justify-content: space-between; gap: 30px; flex-wrap: wrap; }\n.trust-label { font-size: 0.82rem; font-weight: 600; color: var(--ink-faint); letter-spacing: 0.03em; text-transform: uppercase; }\n.trust-stats { display: flex; gap: clamp(28px, 5vw, 64px); flex-wrap: wrap; }\n.stat b { display: block; font-size: clamp(1.5rem, 2.4vw, 2.1rem); font-weight: 700; letter-spacing: -0.03em; color: var(--blue-deep); }\n.stat span { font-size: 0.85rem; color: var(--ink-soft); }\n\n/* ---------- Steps ---------- */\n.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 56px; }\n.step { position: relative; padding: 30px 26px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }\n.step .idx {\n  width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;\n  font-weight: 700; font-size: 1.05rem; color: #fff; margin-bottom: 20px;\n  background: linear-gradient(150deg, var(--blue), var(--teal-deep));\n}\n.step h3 { margin-bottom: 8px; }\n.step p { color: var(--ink-soft); font-size: 0.98rem; }\n.step-arrow { position: absolute; right: -30px; top: 48px; color: var(--line); z-index: 2; }\n@media (max-width: 820px) { .steps { grid-template-columns: 1fr; } .step-arrow { display: none; } }\n\n/* ---------- Interactive builder ---------- */\n.mode-toggle { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 48px; }\n.mode-toggle .mode-label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); }\n.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px; gap: 4px; box-shadow: var(--shadow-sm); }\n.seg-btn { border: none; background: none; font-family: var(--font); font-size: 0.95rem; font-weight: 600; color: var(--ink-soft); padding: 10px 24px; border-radius: 999px; cursor: pointer; transition: background .2s, color .2s; }\n.seg-btn:hover:not(.active) { color: var(--ink); }\n.seg-btn.active { background: var(--blue); color: #fff; box-shadow: 0 4px 12px oklch(0.58 0.115 232 / 0.3); }\n.seg-btn:disabled { opacity: 0.5; cursor: not-allowed; }\n.mode-note { font-size: 0.82rem; color: var(--ink-faint); display: inline-flex; align-items: center; gap: 7px; }\n\n.builder { display: grid; grid-template-columns: 1fr 0.9fr; gap: 24px; margin-top: 28px; align-items: start; }\n@media (max-width: 880px) { .builder { grid-template-columns: 1fr; } }\n\n.builder-panel, .sim-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }\n.builder-panel { padding: 24px 24px 26px; }\n.builder-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }\n.builder-head h3 { font-size: 1.15rem; }\n.builder-head .count { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.82rem; color: var(--ink-faint); background: var(--tint); padding: 4px 10px; border-radius: 999px; }\n\n.circle-list { display: flex; flex-direction: column; gap: 9px; min-height: 60px; }\n.circle-row {\n  display: flex; align-items: center; gap: 12px; padding: 10px 12px;\n  border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface);\n  transition: border-color .25s, background .25s, box-shadow .25s, opacity .25s, transform .25s;\n}\n.circle-row .avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; color: #fff; }\n.circle-row .who { flex: 1; min-width: 0; }\n.circle-row .who b { font-size: 0.94rem; font-weight: 600; display: block; line-height: 1.2; }\n.circle-row .who span { font-size: 0.78rem; color: var(--ink-faint); }\n.circle-row.is-ringing { border-color: var(--blue); background: var(--tint); box-shadow: 0 0 0 3px oklch(0.58 0.115 232 / 0.12); }\n.circle-row.is-ringing .avatar { animation: wiggle .6s ease-in-out infinite; }\n.circle-row.is-missed { opacity: 0.45; }\n.circle-row.is-connected { border-color: oklch(0.80 0.09 158); background: oklch(0.96 0.04 158); box-shadow: 0 0 0 3px oklch(0.70 0.13 158 / 0.16); }\n\n.row-tools { display: flex; align-items: center; gap: 4px; }\n.icon-btn {\n  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line);\n  background: var(--surface); color: var(--ink-soft); cursor: pointer; display: grid; place-items: center;\n  transition: background .15s, color .15s, border-color .15s, opacity .15s;\n}\n.icon-btn:hover:not(:disabled) { background: var(--tint); color: var(--blue-deep); border-color: var(--blue); }\n.icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }\n.icon-btn svg { width: 15px; height: 15px; }\n.icon-btn.danger:hover:not(:disabled) { color: oklch(0.55 0.18 25); border-color: oklch(0.55 0.18 25); background: oklch(0.96 0.04 25); }\n\n/* availability switch (button-driven) */\n.avail { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; flex: none; background: none; border: none; padding: 0; font-family: var(--font); }\n.avail .track { width: 38px; height: 22px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; flex: none; }\n.avail .track::after { content: \"\"; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform .2s; }\n.avail.on .track { background: var(--green); }\n.avail.on .track::after { transform: translateX(16px); }\n.avail .lbl { font-size: 0.74rem; font-weight: 600; color: var(--ink-faint); width: 56px; text-align: left; }\n.avail.on .lbl { color: oklch(0.45 0.13 158); }\n.avail:disabled { opacity: 0.4; cursor: not-allowed; }\n\n.circle-empty { text-align: center; padding: 22px; color: var(--ink-faint); font-size: 0.9rem; border: 1px dashed var(--line); border-radius: var(--r-md); }\n\n.add-form { display: grid; grid-template-columns: 1.2fr 1fr auto; gap: 8px; margin-top: 16px; padding-top: 18px; border-top: 1px solid var(--line); }\n.add-form input { font-family: var(--font); font-size: 0.92rem; padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }\n.add-form input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px oklch(0.58 0.115 232 / 0.12); }\n.add-form input::placeholder { color: var(--ink-faint); }\n.add-form .add-btn { width: 44px; padding: 0; }\n.add-form .add-btn svg { width: 18px; height: 18px; }\n@media (max-width: 520px) { .add-form { grid-template-columns: 1fr 1fr; } .add-form .add-btn { grid-column: 1 / -1; width: 100%; } }\n\n/* sim phone */\n.sim-panel { padding: 26px 24px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; position: sticky; top: 92px; }\n.sim-screen {\n  width: 100%; border-radius: var(--r-lg); padding: 30px 22px 26px;\n  background: linear-gradient(165deg, var(--blue-ink), var(--blue-deep));\n  color: #fff; position: relative; overflow: hidden; min-height: 280px;\n  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;\n}\n.sim-screen .num-line { font-size: 0.8rem; color: oklch(0.9 0.03 220); letter-spacing: 0.02em; }\n.sim-avatar { width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 1.7rem; color: #fff; background: oklch(1 0 0 / 0.16); position: relative; transition: background .3s; }\n.sim-avatar.ringing::after { content: \"\"; position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 0 oklch(1 0 0 / 0.4); animation: simpulse 1.4s ease-out infinite; }\n@keyframes simpulse { 0% { box-shadow: 0 0 0 0 oklch(1 0 0 / 0.35); } 70% { box-shadow: 0 0 0 22px oklch(1 0 0 / 0); } 100% { box-shadow: 0 0 0 0 oklch(1 0 0 / 0); } }\n.sim-name { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; min-height: 1.3em; }\n.sim-state { font-size: 0.92rem; color: oklch(0.92 0.02 220); min-height: 1.3em; }\n.sim-screen.connected { background: linear-gradient(165deg, oklch(0.42 0.12 158), oklch(0.52 0.13 158)); }\n.sim-screen.voicemail { background: linear-gradient(165deg, oklch(0.4 0.06 250), oklch(0.5 0.06 255)); }\n.sim-dots { display: flex; gap: 6px; }\n.sim-dots i { width: 7px; height: 7px; border-radius: 50%; background: oklch(1 0 0 / 0.28); transition: background .25s, transform .25s; }\n.sim-dots i.active { background: #fff; transform: scale(1.3); }\n.sim-dots i.done { background: oklch(1 0 0 / 0.55); }\n.sim-panel .btn { width: 100%; margin-top: 18px; }\n.sim-hint { font-size: 0.8rem; color: var(--ink-faint); margin-top: 10px; }\n\n/* caller-menu mode */\n.sim-screen.menu-mode { justify-content: flex-start; align-items: stretch; text-align: left; }\n.sim-menu { display: flex; flex-direction: column; gap: 8px; width: 100%; }\n.sim-menu .menu-title { font-size: 0.85rem; color: oklch(0.92 0.02 220); margin-bottom: 4px; font-weight: 600; }\n.sim-opt { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: oklch(1 0 0 / 0.12); border: 1px solid oklch(1 0 0 / 0.18); color: #fff; padding: 10px 12px; border-radius: 12px; cursor: pointer; font-family: var(--font); transition: background .15s, transform .15s, border-color .15s; }\n.sim-opt:hover { background: oklch(1 0 0 / 0.24); transform: translateY(-1px); border-color: oklch(1 0 0 / 0.4); }\n.sim-opt .digit { width: 30px; height: 30px; border-radius: 9px; background: oklch(1 0 0 / 0.22); display: grid; place-items: center; font-weight: 700; font-size: 1rem; flex: none; }\n.sim-opt .opt-who { min-width: 0; }\n.sim-opt .opt-who b { font-size: 0.95rem; display: block; line-height: 1.2; }\n.sim-opt .opt-who small { font-size: 0.76rem; color: oklch(0.9 0.02 220); }\n\n/* ---------- Features ---------- */\n.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 56px; }\n.feature { padding: 28px 26px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); transition: transform .2s, box-shadow .2s, border-color .2s; }\n.feature:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--blue); }\n.feature .ic { width: 46px; height: 46px; border-radius: 13px; background: var(--tint); display: grid; place-items: center; margin-bottom: 18px; color: var(--blue-deep); }\n.feature .ic svg { width: 23px; height: 23px; }\n.feature h3 { font-size: 1.18rem; margin-bottom: 8px; }\n.feature p { color: var(--ink-soft); font-size: 0.96rem; }\n@media (max-width: 820px) { .features { grid-template-columns: 1fr; } }\n\n/* ---------- Use cases ---------- */\n.usecases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 56px; }\n.usecase { border-radius: var(--r-lg); overflow: hidden; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); transition: transform .2s, box-shadow .2s; }\n.usecase:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }\n.usecase .ph {\n  height: 184px; position: relative;\n  background-color: var(--tint);\n  background-image: repeating-linear-gradient(135deg, oklch(0.90 0.03 220 / 0.6) 0 12px, transparent 12px 24px);\n  display: grid; place-items: center;\n}\n.usecase .ph span { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.74rem; color: var(--ink-faint); background: oklch(1 0 0 / 0.7); padding: 5px 10px; border-radius: 6px; }\n.usecase .body { padding: 24px 24px 28px; }\n.usecase h3 { font-size: 1.22rem; margin-bottom: 9px; }\n.usecase p { color: var(--ink-soft); font-size: 0.96rem; }\n@media (max-width: 820px) { .usecases { grid-template-columns: 1fr; } }\n\n/* ---------- Pricing ---------- */\n.tint-band { background: linear-gradient(180deg, var(--tint), var(--bg)); }\n.pricing { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; margin: 56px auto 0; max-width: 800px; align-items: stretch; }\n.plan { display: flex; flex-direction: column; padding: 34px 30px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); position: relative; }\n.plan.featured { border-color: var(--blue); box-shadow: var(--shadow-lg); transform: scale(1.03); }\n.plan .tag { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); background: var(--blue); color: #fff; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.03em; padding: 6px 14px; border-radius: 999px; text-transform: uppercase; }\n.plan h3 { font-size: 1.3rem; margin-bottom: 4px; }\n.plan .desc { font-size: 0.9rem; color: var(--ink-faint); min-height: 40px; }\n.plan .price { display: flex; align-items: baseline; gap: 5px; margin: 18px 0 2px; }\n.plan .price b { font-size: 2.8rem; font-weight: 700; letter-spacing: -0.03em; }\n.plan .price span { color: var(--ink-faint); font-size: 0.95rem; }\n.plan .price-yr { font-size: 0.9rem; color: var(--ink-soft); margin-bottom: 4px; }\n.plan .price-yr b { color: var(--blue-deep); font-weight: 700; }\n\n.bill-toggle { display: flex; width: fit-content; gap: 4px; padding: 5px; margin: 30px auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow-sm); }\n.bill-btn { border: none; background: none; font-family: var(--font); font-size: 0.95rem; font-weight: 600; color: var(--ink-soft); padding: 10px 22px; border-radius: 999px; cursor: pointer; transition: background .2s, color .2s; display: inline-flex; align-items: center; gap: 8px; }\n.bill-btn:hover:not(.active) { color: var(--ink); }\n.bill-btn.active { background: var(--blue); color: #fff; box-shadow: 0 4px 12px oklch(0.58 0.115 232 / 0.3); }\n.bill-btn em { font-style: normal; font-size: 0.74rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: oklch(0.70 0.13 158 / 0.18); color: oklch(0.42 0.13 158); letter-spacing: 0.01em; }\n.bill-btn.active em { background: oklch(1 0 0 / 0.22); color: #fff; }\n.plan ul { list-style: none; margin: 22px 0 26px; display: flex; flex-direction: column; gap: 12px; flex: 1; }\n.plan li { display: flex; gap: 10px; font-size: 0.95rem; color: var(--ink-soft); align-items: flex-start; }\n.plan li svg { width: 19px; height: 19px; flex: none; margin-top: 1px; color: var(--teal-deep); }\n.plan .btn { width: 100%; }\n@media (max-width: 820px) { .pricing { grid-template-columns: 1fr; } .plan.featured { transform: none; } }\n\n/* ---------- Testimonials ---------- */\n.quotes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 56px; }\n.quote { padding: 28px 26px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; }\n.quote .stars { color: var(--teal-deep); letter-spacing: 3px; margin-bottom: 14px; font-size: 0.95rem; }\n.quote p { font-size: 1.04rem; color: var(--ink); line-height: 1.5; flex: 1; }\n.quote .by { display: flex; align-items: center; gap: 12px; margin-top: 22px; }\n.quote .by .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 0.85rem; }\n.quote .by b { font-size: 0.92rem; display: block; }\n.quote .by span { font-size: 0.82rem; color: var(--ink-faint); }\n@media (max-width: 820px) { .quotes { grid-template-columns: 1fr; } }\n\n/* ---------- FAQ ---------- */\n.faq { max-width: 800px; margin: 48px auto 0; }\n.faq-item { border-bottom: 1px solid var(--line); }\n.faq-q  height: 8px; border-radius: 50%; flex: none;\n  background: var(--green);\n  box-shadow: 0 0 0 4px oklch(0.70 0.13 158 / 0.18);\n}\n\n/* ---- Header: simple \"launching soon\" state ---- */\n.header.soon .header-inner { justify-content: space-between; }\n.header .soon-note {\n  font-size: 0.86rem; color: var(--ink-faint); font-weight: 500;\n  display: inline-flex; align-items: center; gap: 8px;\n}\n.header .soon-note .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px oklch(0.70 0.13 158 / 0.18); }\n@media (max-width: 620px) { .header .soon-note span.txt { display: none; } }\n\n/* ---- Hero tweaks for this page ---- */\n.soon-hero { padding-bottom: clamp(64px, 8vw, 104px); }\n.soon-hero .lead { max-width: 34ch; }\n\n/* ---- Waitlist form ---- */\n.waitlist {\n  margin-top: 32px;\n  max-width: 440px;\n}\n.wl-fields { display: flex; flex-direction: column; gap: 11px; }\n.wl-field { position: relative; }\n.wl-field label {\n  display: block; font-size: 0.8rem; font-weight: 600;\n  color: var(--ink-soft); margin-bottom: 6px; letter-spacing: 0.01em;\n}\n.wl-field input {\n  width: 100%; font-family: var(--font); font-size: 1rem;\n  padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-md);\n  background: var(--surface); color: var(--ink); outline: none;\n  transition: border-color .16s, box-shadow .16s;\n}\n.wl-field input::placeholder { color: var(--ink-faint); }\n.wl-field input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px oklch(0.58 0.115 232 / 0.13); }\n.wl-field input.invalid { border-color: oklch(0.6 0.18 25); box-shadow: 0 0 0 3px oklch(0.6 0.18 25 / 0.12); }\n.wl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }\n@media (max-width: 480px) { .wl-row { grid-template-columns: 1fr; } }\n\n/* consent checkbox */\n.wl-consent {\n  display: flex; gap: 11px; align-items: flex-start;\n  margin-top: 16px; cursor: pointer; user-select: none;\n}\n.wl-consent input { position: absolute; opacity: 0; width: 0; height: 0; }\n.wl-consent .box {\n  flex: none; width: 22px; height: 22px; border-radius: 7px; margin-top: 1px;\n  border: 1.5px solid var(--line); background: var(--surface);\n  display: grid; place-items: center;\n  transition: background .16s, border-color .16s;\n}\n.wl-consent .box svg { width: 14px; height: 14px; stroke: #fff; opacity: 0; transform: scale(0.6); transition: opacity .16s, transform .16s; }\n.wl-consent input:checked + .box { background: var(--blue); border-color: var(--blue); }\n.wl-consent input:checked + .box svg { opacity: 1; transform: scale(1); }\n.wl-consent input:focus-visible + .box { box-shadow: 0 0 0 3px oklch(0.58 0.115 232 / 0.2); }\n.wl-consent.invalid .box { border-color: oklch(0.6 0.18 25); box-shadow: 0 0 0 3px oklch(0.6 0.18 25 / 0.12); }\n.wl-consent .ctxt { font-size: 0.86rem; color: var(--ink-soft); line-height: 1.45; }\n.wl-consent .ctxt b { color: var(--ink); font-weight: 600; }\n\n.waitlist .btn-submit { width: 100%; margin-top: 18px; }\n.wl-fine { margin-top: 14px; font-size: 0.82rem; color: var(--ink-faint); line-height: 1.5; }\n.wl-error {\n  margin-top: 12px; font-size: 0.86rem; font-weight: 500;\n  color: oklch(0.52 0.18 25); display: none; align-items: center; gap: 7px;\n}\n.wl-error.show { display: flex; }\n\n/* ---- Success state ---- */\n.wl-success {\n  display: none; flex-direction: column; gap: 6px;\n  margin-top: 32px; max-width: 460px;\n  padding: 28px 28px 30px; border-radius: var(--r-lg);\n  background: var(--surface); border: 1px solid oklch(0.84 0.07 158);\n  box-shadow: var(--shadow-md);\n}\n.waitlist.done { display: none; }\n.wl-success.show { display: flex; }\n.wl-success .tick {\n  width: 50px; height: 50px; border-radius: 14px; margin-bottom: 8px;\n  background: linear-gradient(150deg, var(--green), oklch(0.62 0.12 175));\n  display: grid; place-items: center; box-shadow: 0 8px 20px oklch(0.70 0.13 158 / 0.32);\n}\n.wl-success .tick svg { width: 26px; height: 26px; stroke: #fff; }\n.wl-success h3 { font-size: 1.35rem; }\n.wl-success p { color: var(--ink-soft); font-size: 0.98rem; }\n.wl-success .em { color: var(--blue-deep); font-weight: 600; }\n\n/* ---- Reserve card (static hero visual) ---- */\n.reserve { padding-bottom: 24px; }\n.reserve .demo-caption { margin-top: 4px; }\n.reserve .save-row {\n  display: flex; align-items: center; gap: 12px; margin-top: 16px;\n  padding: 13px 15px; border-radius: var(--r-md);\n  border: 1px dashed var(--line); background: var(--bg);\n}\n.reserve .save-row .badge {\n  width: 38px; height: 38px; border-radius: 11px; flex: none;\n  background: var(--tint); color: var(--blue-deep);\n  display: grid; place-items: center;\n}\n.reserve .save-row .badge svg { width: 19px; height: 19px; }\n.reserve .save-row .txt b { display: block; font-size: 0.95rem; font-weight: 600; }\n.reserve .save-row .txt span { font-size: 0.82rem; color: var(--ink-faint); }\n\n/* ---- What to expect ---- */\n.expect { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 52px; }\n.expect-card {\n  padding: 28px 26px; border-radius: var(--r-lg);\n  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm);\n}\n.expect-card .ic {\n  width: 46px; height: 46px; border-radius: 13px; margin-bottom: 18px;\n  background: var(--tint); color: var(--blue-deep); display: grid; place-items: center;\n}\n.expect-card .ic svg { width: 23px; height: 23px; }\n.expect-card h3 { font-size: 1.14rem; margin-bottom: 8px; }\n.expect-card p { color: var(--ink-soft); font-size: 0.96rem; }\n@media (max-width: 820px) { .expect { grid-template-columns: 1fr; } }\n<\/style>\n<\/head>\n<body>\n\n\n\n<\u0021-- ============== HEADER ============== -->\n<header class=\"header soon\">\n  <div class=\"wrap header-inner\">\n    <a class=\"brand\" href=\"#top\" aria-label=\"iCanCall home\">\n      <span class=\"mark\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n      <\/span>\n      <span>i<b>Can<\/b>Call<\/span>\n    <\/a>\n    <span class=\"soon-note\"><span class=\"dot\"><\/span><span class=\"txt\">Launching soon<\/span><\/span>\n  <\/div>\n<\/header>\n\n<main id=\"top\">\n\n<\u0021-- ============== HERO / WAITLIST ============== -->\n<section class=\"hero soon-hero\">\n  <div class=\"wrap hero-grid\">\n    <div class=\"hero-copy\">\n      <span class=\"soon-badge\"><span class=\"pip\"><\/span>Launching soon · Private early access<\/span>\n      <h1>Be first<br><span class=\"accent\">in line.<\/span><\/h1>\n      <p class=\"lead\">iCanCall gives the people you love one memorable number that's always answered — routing to up to six trusted contacts until someone picks up. We're putting the finishing touches on it. Join the waitlist and you'll be first through the door.<\/p>\n\n      <\u0021-- Waitlist form -->\n      <form class=\"waitlist\" id=\"waitlist\" novalidate=\"\">\n        <div class=\"wl-fields\">\n          <div class=\"wl-row\">\n            <div class=\"wl-field\">\n              <label for=\"wl-email\">Email<\/label>\n              <input id=\"wl-email\" name=\"email\" type=\"email\" placeholder=\"you@email.com\" autocomplete=\"email\" required=\"\">\n            <\/div>\n            <div class=\"wl-field\">\n              <label for=\"wl-phone\">Mobile number<\/label>\n              <input id=\"wl-phone\" name=\"phone\" type=\"tel\" placeholder=\"(555) 123-4567\" autocomplete=\"tel\" required=\"\">\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <label class=\"wl-consent\" id=\"wl-consent\">\n          <input type=\"checkbox\" id=\"wl-sms\" name=\"sms\">\n          <span class=\"box\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg><\/span>\n          <span class=\"ctxt\"><b>Text me launch updates.<\/b> I agree to receive occasional SMS messages from iCanCall about early access and launch. If you do not consent to receiving SMS messages, you will only receive email notifications. Msg &amp; data rates may apply; reply STOP to opt out anytime.<\/span>\n        <\/label>\n\n        <button class=\"btn btn-primary btn-lg btn-submit\" type=\"submit\">Join the waitlist<\/button>\n\n        <p class=\"wl-error\" id=\"wl-error\">\n          <svg viewBox=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 8v5M12 16h.01\"><\/path><\/svg>\n          <span class=\"msg\">Please fix the highlighted fields.<\/span>\n        <\/p>\n        <p class=\"wl-fine\">No spam, ever. We'll only reach out about your early-access invite — and you can unsubscribe in one tap. If you do not consent to receiving SMS messages, you will only receive email notifications. Reply STOP to opt out anytime. If you don't consent to SMS opt-in, you will only receive email notifications.<\/p>\n      <\/form>\n\n      <\u0021-- Success state -->\n      <div class=\"wl-success\" id=\"wl-success\" role=\"status\" aria-live=\"polite\">\n        <span class=\"tick\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg><\/span>\n        <h3>You're on the list.<\/h3>\n        <p>We saved your spot under <span class=\"em\" id=\"wl-shown-email\">your email<\/span>. The moment iCanCall goes live, you'll get your early-access invite and first pick of a memorable number.<\/p>\n      <\/div>\n    <\/div>\n\n    <\u0021-- Reserve card (animated routing motif) -->\n    <div class=\"demo reserve\" id=\"demo\" aria-label=\"iCanCall routing preview\">\n      <div class=\"demo-head\">\n        <div class=\"demo-number\">\n          <span class=\"ring\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n          <\/span>\n          <span class=\"num\">(415) 200-CARE<small>One number, always answered<\/small><\/span>\n        <\/div>\n        <span class=\"demo-status\"><span class=\"live\"><\/span><span class=\"txt\">Incoming call<\/span><\/span>\n      <\/div>\n      <p class=\"demo-caption\">A preview of what's coming — one number that finds a person, in order, until someone answers<\/p>\n      <div class=\"chain\">\n        <div class=\"contact\">\n          <span class=\"order\">1<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.58 0.115 232)\">YO<\/span>\n          <span class=\"who\"><b>You<\/b><span>Mobile<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">2<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.62 0.10 198)\">PA<\/span>\n          <span class=\"who\"><b>Your partner<\/b><span>Mobile<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">3<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.55 0.11 280)\">GP<\/span>\n          <span class=\"who\"><b>A grandparent<\/b><span>Family<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">4<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.6 0.12 30)\">NB<\/span>\n          <span class=\"who\"><b>A trusted neighbor<\/b><span>Backup<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n      <\/div>\n      <div class=\"save-row\">\n        <span class=\"badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h11l3 3v13H5z\"><\/path><path d=\"M9 4v5h6\"><\/path><circle cx=\"12\" cy=\"14\" r=\"2.5\"><\/circle><\/svg><\/span>\n        <span class=\"txt\"><b>Reserve early, choose first<\/b><span>Waitlist members get first pick of memorable numbers at launch<\/span><\/span>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\u0021-- ============== WHAT TO EXPECT ============== -->\n<section class=\"section tint-band\" id=\"expect\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">What to expect<\/span>\n      <h2>A spot on the list comes<br>with a few good things.<\/h2>\n      <p class=\"lead\">No commitment today — just the perks of being early when iCanCall opens its doors.<\/p>\n    <\/div>\n    <div class=\"expect\">\n      <div class=\"expect-card reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v4a2 2 0 0 1-2.2 2A16 16 0 0 1 3 6.2 2 2 0 0 1 5 4Z\"><\/path><\/svg><\/div>\n        <h3>First pick of numbers<\/h3>\n        <p>Memorable numbers go fast. Waitlist members choose theirs before doors open to everyone else.<\/p>\n      <\/div>\n      <div class=\"expect-card reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\/circle><path d=\"M5 21a7 7 0 0 1 14 0\"><\/path><path d=\"m17.5 4.5 1.2 1.2 2.3-2.3\"><\/path><\/svg><\/div>\n        <h3>Founding-member rate<\/h3>\n        <p>Lock in launch pricing that stays yours for good — our thank-you for believing in this early.<\/p>\n      <\/div>\n      <div class=\"expect-card reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16v11H7l-3 3V5Z\"><\/path><path d=\"M8 10h8M8 13h5\"><\/path><\/svg><\/div>\n        <h3>A say in what we build<\/h3>\n        <p>Early members shape the roadmap. We'll ask what matters most to your family — and listen.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\/main>\n\n<\u0021-- ============== FOOTER ============== -->\n<footer class=\"footer\">\n  <div class=\"wrap\">\n    <div class=\"footer-grid\">\n      <div>\n        <a class=\"brand\" href=\"#top\">\n          <span class=\"mark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg><\/span>\n          <span>i<b>Can<\/b>Call<\/span>\n        <\/a>\n        <p class=\"blurb\">One memorable number that's always answered — routed to the people you trust most, from any phone, anywhere.<\/p>\n      <\/div>\n      <div>\n        <h5>iCanCall<\/h5>\n        <ul>\n          <li><a href=\"#expect\">What to expect<\/a><\/li>\n          <li><a href=\"#top\">Join the waitlist<\/a><\/li>\n          <li><a href=\"iCanCall Landing Page (standalone).html\">Preview the product<\/a><\/li>\n        <\/ul>\n      <\/div>\n      <div>\n        <h5>Company<\/h5>\n        <ul>\n          <li><a href=\"#\">About<\/a><\/li>\n          <li><a href=\"#\">Contact<\/a><\/li>\n        <\/ul>\n      <\/div>\n      <div>\n        <h5>Trust<\/h5>\n        <ul>\n          <li><a href=\"#\">Privacy<\/a><\/li>\n          <li><a href=\"#\">SMS terms<\/a><\/li>\n          <li><a href=\"#\">Terms<\/a><\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n    <div class=\"footer-bottom\">\n      <span>© <span id=\"year\">2026<\/span> iCanCall, Inc. All rights reserved.<\/span>\n      <span>Made for the moments that matter.<\/span>\n    <\/div>\n  <\/div>\n<\/footer>\n\n<script src=\"b42fb5e0-e66d-40d1-8928-842ccd3fb2dd\"><\/script>\n<script>\n/* ---- Waitlist form handling ---- */\n(function waitlist() {\n  const form = document.getElementById('waitlist');\n  if (!form) return;\n  const email = document.getElementById('wl-email');\n  const phone = document.getElementById('wl-phone');\n  const sms = document.getElementById('wl-sms');\n  const consent = document.getElementById('wl-consent');\n  const errBox = document.getElementById('wl-error');\n  const errMsg = errBox.querySelector('.msg');\n  const success = document.getElementById('wl-success');\n  const shownEmail = document.getElementById('wl-shown-email');\n\n  const emailOk = (v) => /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(v.trim());\n  const phoneOk = (v) => (v.replace(/\\D/g, '').length >= 10);\n\n  function clearState() {\n    [email, phone].forEach((el) => el.classList.remove('invalid'));\n    consent.classList.remove('invalid');\n    errBox.classList.remove('show');\n  }\n\n  // live-clear an error once the user fixes a field\n  [email, phone].forEach((el) => el.addEventListener('input', () => el.classList.remove('invalid')));\n  sms.addEventListener('change', () => consent.classList.remove('invalid'));\n\n  form.addEventListener('submit', (e) => {\n    e.preventDefault();\n    clearState();\n\n    const problems = [];\n    if (!emailOk(email.value)) { email.classList.add('invalid'); problems.push('a valid email'); }\n    if (!phoneOk(phone.value)) { phone.classList.add('invalid'); problems.push('a valid mobile number'); }\n    \n\n    if (problems.length) {\n      errMsg.textContent = 'Please add ' + problems.join(', ') + ' to continue.';\n      errBox.classList.add('show');\n      const first = form.querySelector('.invalid input, input.invalid');\n      if (first && first.focus) first.focus();\n      return;\n    }\n\n    // persist locally (no backend in this prototype)\n    try {\n      const entry = { email: email.value.trim(), phone: phone.value.trim(), sms: sms.checked, at: new Date().toISOString() };\n      const list = JSON.parse(localStorage.getItem('ic_waitlist') || '[]');\n      list.push(entry);\n      localStorage.setItem('ic_waitlist', JSON.stringify(list));\n    } catch (_) { /* storage unavailable — still show success */ }\n\n    shownEmail.textContent = email.value.trim();\n    form.classList.add('done');\n    success.classList.add('show');\n    success.scrollTo ? null : null; // no scrollIntoView per guidelines\n  });\n})();\n<\/script>\n\n\n<\/body><\/html>"</script>
