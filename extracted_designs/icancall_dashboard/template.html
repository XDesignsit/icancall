<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iCanCall — Dashboard</title>
<style>/* ===========================================================
   iCanCall — Dashboard styles
   Reuses the landing-page system: warm blue/teal, Helvetica
   =========================================================== */

:root {
  --bg:        oklch(0.975 0.008 220);
  --surface:   oklch(1 0 0);
  --surface-2: oklch(0.985 0.006 220);
  --tint:      oklch(0.965 0.018 218);
  --tint-2:    oklch(0.945 0.028 210);
  --line:      oklch(0.905 0.012 225);
  --line-soft: oklch(0.935 0.01 225);

  --ink:       oklch(0.26 0.028 248);
  --ink-soft:  oklch(0.46 0.022 245);
  --ink-faint: oklch(0.60 0.018 242);

  --blue:      oklch(0.58 0.115 232);
  --blue-deep: oklch(0.44 0.105 240);
  --blue-ink:  oklch(0.30 0.07 244);
  --teal:      oklch(0.72 0.095 196);
  --teal-deep: oklch(0.62 0.10 198);
  --green:     oklch(0.66 0.14 158);
  --amber:     oklch(0.74 0.13 70);
  --rose:      oklch(0.62 0.18 22);
  --violet:    oklch(0.55 0.13 285);

  --shadow-sm: 0 1px 2px oklch(0.4 0.05 240 / 0.06), 0 2px 6px oklch(0.4 0.05 240 / 0.05);
  --shadow-md: 0 4px 14px oklch(0.4 0.05 240 / 0.08), 0 10px 26px oklch(0.4 0.05 240 / 0.07);
  --shadow-lg: 0 12px 28px oklch(0.4 0.06 240 / 0.10), 0 26px 56px oklch(0.4 0.06 240 / 0.10);

  --r-sm: 9px; --r-md: 13px; --r-lg: 18px; --r-xl: 26px;
  --sidebar-w: 264px;
  --font: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font); background: var(--bg); color: var(--ink);
  font-size: 15px; line-height: 1.5; letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-thumb { background: oklch(0.85 0.01 230); border-radius: 99px; border: 3px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: oklch(0.78 0.02 230); }

#root { height: 100%; }

/* ---------- Shell ---------- */
.dash { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100%; }

/* ---------- Sidebar ---------- */
.sidebar {
  background: var(--blue-ink); color: oklch(0.92 0.02 225);
  display: flex; flex-direction: column; padding: 22px 16px;
  position: relative; z-index: 10;
}
.sidebar .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; font-size: 1.18rem; letter-spacing: -0.03em; color: #fff; padding: 4px 8px 0; margin-bottom: 26px; }
.sidebar .brand .mark { width: 34px; height: 34px; border-radius: 10px; flex: none; background: linear-gradient(150deg, var(--blue), var(--teal-deep)); display: grid; place-items: center; box-shadow: var(--shadow-sm); }
.sidebar .brand .mark svg { width: 18px; height: 18px; }
.sidebar .brand b { color: oklch(0.85 0.07 200); }

.nav-group-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: oklch(0.66 0.03 230); padding: 0 12px; margin: 18px 0 8px; font-weight: 600; }
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 10px 12px; border-radius: var(--r-md); border: none; background: none;
  color: oklch(0.86 0.02 225); font-size: 0.94rem; font-weight: 500; cursor: pointer;
  text-align: left; transition: background .15s, color .15s;
}
.nav-item svg { width: 19px; height: 19px; flex: none; opacity: 0.85; }
.nav-item:hover { background: oklch(1 0 0 / 0.07); color: #fff; }
.nav-item.active { background: oklch(1 0 0 / 0.12); color: #fff; font-weight: 600; }
.nav-item.active svg { opacity: 1; color: oklch(0.82 0.09 200); }
.nav-item .badge-dot { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--rose); color: #fff; font-size: 0.72rem; font-weight: 700; display: grid; place-items: center; }

.sidebar-foot { margin-top: auto; padding-top: 18px; }
.plan-card { background: oklch(1 0 0 / 0.08); border: 1px solid oklch(1 0 0 / 0.12); border-radius: var(--r-md); padding: 14px; }
.signout-row { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; margin-top: 10px; padding: 11px 14px; border-radius: var(--r-md); border: 1px solid oklch(1 0 0 / 0.12); background: oklch(1 0 0 / 0.04); color: oklch(0.86 0.02 225); font-family: var(--font); font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
.signout-row:hover { background: oklch(1 0 0 / 0.10); color: #fff; border-color: oklch(1 0 0 / 0.2); }
.signout-row svg { flex: none; }
.signout-btn { color: var(--ink-soft); }
.signout-btn:hover { color: var(--rose); background: oklch(0.96 0.04 22); }
.plan-card .row { display: flex; align-items: center; justify-content: space-between; }
.plan-card .pill { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; background: linear-gradient(120deg, var(--blue), var(--teal-deep)); color: #fff; padding: 3px 9px; border-radius: 99px; }
.plan-card .mins { font-size: 0.78rem; color: oklch(0.82 0.02 225); margin-top: 10px; }
.plan-card .bar { height: 6px; border-radius: 99px; background: oklch(1 0 0 / 0.15); margin-top: 7px; overflow: hidden; }
.plan-card .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--teal), var(--blue)); }
.plan-card .upgrade { margin-top: 12px; width: 100%; font-size: 0.82rem; font-weight: 600; color: #fff; background: oklch(1 0 0 / 0.12); border: none; border-radius: var(--r-sm); padding: 9px; cursor: pointer; transition: background .15s; }
.plan-card .upgrade:hover { background: oklch(1 0 0 / 0.2); }

/* ---------- Main + topbar ---------- */
.main { display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; }
.topbar {
  display: flex; align-items: center; gap: 18px; padding: 16px 30px;
  background: oklch(1 0 0 / 0.7); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); flex: none;
  position: relative; z-index: 50;
}
.page-title { min-width: 0; }
.page-title h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.025em; white-space: nowrap; }
.page-title p { font-size: 0.85rem; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-spacer { flex: 1; }

/* number switcher */
.numswitch { position: relative; }
.numswitch-btn {
  display: flex; align-items: center; gap: 11px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px 12px; cursor: pointer;
  transition: border-color .15s, box-shadow .15s; min-width: 230px;
}
.numswitch-btn:hover { border-color: var(--blue); box-shadow: var(--shadow-sm); }
.numswitch-btn .ava { width: 34px; height: 34px; border-radius: 9px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 0.85rem; }
.numswitch-btn .meta { text-align: left; min-width: 0; flex: 1; }
.numswitch-btn .meta b { font-size: 0.9rem; font-weight: 600; display: block; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.numswitch-btn .meta span { font-size: 0.78rem; color: var(--ink-faint); font-family: var(--mono); white-space: nowrap; }
.numswitch-btn .chev { color: var(--ink-faint); transition: transform .2s; }
.numswitch.open .numswitch-btn .chev { transform: rotate(180deg); }
.numswitch-menu {
  position: absolute; top: calc(100% + 8px); right: 0; width: 300px; z-index: 40;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  box-shadow: var(--shadow-lg); padding: 6px; animation: pop .14s ease;
}
@keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.numswitch-opt { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: var(--r-sm); cursor: pointer; transition: background .12s; }
.numswitch-opt:hover { background: var(--tint); }
.numswitch-opt.sel { background: var(--tint); }
.numswitch-opt .ava { width: 32px; height: 32px; border-radius: 9px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 0.8rem; }
.numswitch-opt .meta b { font-size: 0.88rem; font-weight: 600; display: block; }
.numswitch-opt .meta span { font-size: 0.76rem; color: var(--ink-faint); font-family: var(--mono); }
.numswitch-opt .tick { margin-left: auto; color: var(--blue); }
.numswitch-menu .add-num { display: flex; align-items: center; gap: 9px; width: 100%; padding: 10px; border: none; background: none; border-top: 1px solid var(--line); margin-top: 4px; color: var(--blue-deep); font-weight: 600; font-size: 0.85rem; cursor: pointer; border-radius: 0 0 var(--r-sm) var(--r-sm); }
.numswitch-menu .add-num:hover { background: var(--tint); }

.iconbtn { width: 40px; height: 40px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); display: grid; place-items: center; cursor: pointer; position: relative; transition: background .15s, color .15s, border-color .15s; }
.iconbtn:hover { background: var(--tint); color: var(--blue-deep); border-color: var(--blue); }
.iconbtn svg { width: 19px; height: 19px; }
.iconbtn .dot { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--rose); border: 2px solid var(--surface); }
.user-chip { display: flex; align-items: center; gap: 10px; padding-left: 6px; }
.user-chip .ava { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 0.85rem; background: linear-gradient(150deg, var(--violet), var(--blue)); }
.user-chip .who b { font-size: 0.85rem; font-weight: 600; display: block; line-height: 1.1; }
.user-chip .who span { font-size: 0.76rem; color: var(--ink-faint); }

/* ---------- Content scroll area ---------- */
.content { flex: 1; overflow-y: auto; padding: 28px 30px 60px; }
.content-inner { max-width: 1080px; margin: 0 auto; }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }
.card-pad { padding: 22px 24px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
.card-head h2 { font-size: 1.08rem; font-weight: 700; letter-spacing: -0.02em; }
.card-head p { font-size: 0.84rem; color: var(--ink-faint); margin-top: 2px; }
.section-gap { margin-bottom: 22px; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; font-weight: 600; padding: 10px 18px; border-radius: var(--r-md); border: 1px solid transparent; cursor: pointer; white-space: nowrap; transition: background .15s, box-shadow .15s, border-color .15s, transform .12s; }
.btn:active { transform: translateY(1px); }
.btn svg { width: 17px; height: 17px; }
.btn-primary { background: var(--blue); color: #fff; box-shadow: 0 3px 10px oklch(0.58 0.115 232 / 0.28); }
.btn-primary:hover { background: var(--blue-deep); }
.btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { background: var(--tint); border-color: var(--blue); color: var(--blue-deep); }
.btn-soft { background: var(--tint); color: var(--blue-deep); }
.btn-soft:hover { background: var(--tint-2); }
.btn-sm { padding: 7px 13px; font-size: 0.83rem; }
.btn-danger-ghost { background: var(--surface); border-color: var(--line); color: var(--ink-soft); }
.btn-danger-ghost:hover { color: var(--rose); border-color: var(--rose); background: oklch(0.97 0.03 22); }

/* ---------- Badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; font-weight: 600; padding: 3px 9px; border-radius: 99px; }
.badge .d { width: 6px; height: 6px; border-radius: 50%; }
.badge-green { background: oklch(0.95 0.05 158); color: oklch(0.42 0.13 158); }
.badge-green .d { background: var(--green); }
.badge-rose { background: oklch(0.96 0.05 22); color: oklch(0.5 0.18 22); }
.badge-rose .d { background: var(--rose); }
.badge-amber { background: oklch(0.96 0.06 75); color: oklch(0.5 0.13 60); }
.badge-amber .d { background: var(--amber); }
.badge-blue { background: var(--tint); color: var(--blue-deep); }
.badge-blue .d { background: var(--blue); }
.badge-gray { background: oklch(0.95 0.005 230); color: var(--ink-faint); }
.badge-gray .d { background: var(--ink-faint); }

/* ---------- Stat cards ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow-sm); }
.stat .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; margin-bottom: 14px; }
.stat .ic svg { width: 19px; height: 19px; }
.stat .val { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
.stat .lbl { font-size: 0.82rem; color: var(--ink-faint); margin-top: 5px; }
.stat .trend { font-size: 0.76rem; font-weight: 600; margin-top: 8px; display: inline-flex; align-items: center; gap: 4px; }
.trend-up { color: oklch(0.5 0.13 158); }
.trend-down { color: oklch(0.55 0.18 22); }
@media (max-width: 1000px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }

/* ---------- Contact list ---------- */
.contacts-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.contacts-head .hint { font-size: 0.86rem; color: var(--ink-faint); }
.cap-pill { font-family: var(--mono); font-size: 0.8rem; color: var(--ink-soft); background: var(--surface); border: 1px solid var(--line); padding: 5px 11px; border-radius: 99px; }

.clist { display: flex; flex-direction: column; gap: 10px; }
.crow { display: flex; align-items: center; gap: 15px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; box-shadow: var(--shadow-sm); transition: border-color .18s, box-shadow .18s, transform .18s; }
.crow:hover { border-color: var(--blue); box-shadow: var(--shadow-md); }
.crow.dim { opacity: 0.62; }
.crow .pos { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.crow .pos .num { width: 26px; height: 26px; border-radius: 8px; background: var(--tint); color: var(--blue-deep); font-weight: 700; font-size: 0.82rem; display: grid; place-items: center; }
.crow .reorder { display: flex; flex-direction: column; gap: 2px; }
.crow .reorder button { width: 24px; height: 18px; border: none; background: none; color: var(--ink-faint); cursor: pointer; border-radius: 5px; display: grid; place-items: center; }
.crow .reorder button:hover:not(:disabled) { background: var(--tint); color: var(--blue-deep); }
.crow .reorder button:disabled { opacity: 0.25; cursor: not-allowed; }
.crow .reorder svg { width: 14px; height: 14px; }
.crow .ava { width: 46px; height: 46px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 1rem; }
.crow .info { flex: 1; min-width: 0; }
.crow .info b { font-size: 0.98rem; font-weight: 600; }
.crow .info .rel { font-size: 0.82rem; color: var(--ink-soft); }
.crow .info .tel { font-family: var(--mono); font-size: 0.82rem; color: var(--ink-faint); margin-top: 1px; }
.crow .acts { display: flex; align-items: center; gap: 8px; }
.crow .mini { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); display: grid; place-items: center; cursor: pointer; transition: all .15s; }
.crow .mini:hover { background: var(--tint); color: var(--blue-deep); border-color: var(--blue); }
.crow .mini.del:hover { color: var(--rose); border-color: var(--rose); background: oklch(0.97 0.03 22); }
.crow .mini svg { width: 16px; height: 16px; }

.add-slot { display: flex; align-items: center; justify-content: center; gap: 9px; padding: 16px; border: 1.5px dashed var(--line); border-radius: var(--r-lg); color: var(--blue-deep); font-weight: 600; font-size: 0.92rem; cursor: pointer; background: var(--surface-2); transition: all .15s; }
.add-slot:hover { border-color: var(--blue); background: var(--tint); }
.add-slot svg { width: 18px; height: 18px; }
.add-slot.full { color: var(--ink-faint); cursor: not-allowed; border-style: solid; }
.add-slot.full:hover { border-color: var(--line); background: var(--surface-2); }

/* availability toggle */
.toggle { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; background: none; border: none; padding: 0; }
.toggle .track { width: 40px; height: 23px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.toggle .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform .2s; }
.toggle.on .track { background: var(--green); }
.toggle.on .track::after { transform: translateX(17px); }
.toggle .lbl { font-size: 0.8rem; font-weight: 600; color: var(--ink-faint); min-width: 58px; text-align: left; }
.toggle.on .lbl { color: oklch(0.45 0.13 158); }

/* ---------- Modal ---------- */
.overlay { position: fixed; inset: 0; background: oklch(0.3 0.04 245 / 0.42); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 100; animation: fade .15s ease; padding: 20px; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal { width: 100%; max-width: 460px; background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-lg); animation: rise .2s ease; overflow: hidden; }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(0.98); } to { opacity: 1; transform: none; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--line); }
.modal-head h3 { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; }
.modal-head .x { width: 32px; height: 32px; border-radius: 8px; border: none; background: var(--tint); color: var(--ink-soft); cursor: pointer; display: grid; place-items: center; }
.modal-head .x:hover { background: var(--tint-2); color: var(--ink); }
.modal-body { padding: 22px 24px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--line); background: var(--surface-2); }

/* ---------- Forms ---------- */
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 7px; }
.field input, .field select, .field textarea { width: 100%; font-family: var(--font); font-size: 0.94rem; padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px oklch(0.58 0.115 232 / 0.13); }
.field .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.swatch-row { display: flex; gap: 9px; margin-top: 4px; }
.swatch { width: 34px; height: 34px; border-radius: 9px; cursor: pointer; border: 2px solid transparent; transition: transform .12s; position: relative; }
.swatch:hover { transform: scale(1.08); }
.swatch.sel { border-color: var(--ink); }
.swatch.sel::after { content: "\2713"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 0.9rem; font-weight: 700; }

/* ---------- Segmented (routing mode) ---------- */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 4px; gap: 3px; }
.seg button { border: none; background: none; font-family: var(--font); font-size: 0.88rem; font-weight: 600; color: var(--ink-soft); padding: 8px 18px; border-radius: 99px; cursor: pointer; transition: background .18s, color .18s; }
.seg button:hover:not(.active) { color: var(--ink); }
.seg button.active { background: var(--blue); color: #fff; box-shadow: 0 3px 9px oklch(0.58 0.115 232 / 0.28); }

.mode-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 4px; }
.mode-card { border: 1.5px solid var(--line); border-radius: var(--r-lg); padding: 20px; cursor: pointer; background: var(--surface); transition: border-color .18s, box-shadow .18s, background .18s; position: relative; }
.mode-card:hover { border-color: var(--blue); }
.mode-card.sel { border-color: var(--blue); background: var(--tint); box-shadow: 0 0 0 3px oklch(0.58 0.115 232 / 0.1); }
.mode-card .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--blue-deep); margin-bottom: 14px; }
.mode-card.sel .ic { background: var(--blue); color: #fff; border-color: var(--blue); }
.mode-card h4 { font-size: 1rem; font-weight: 700; margin-bottom: 5px; }
.mode-card p { font-size: 0.85rem; color: var(--ink-soft); }
.mode-card .check { position: absolute; top: 16px; right: 16px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.mode-card.sel .check { background: var(--blue); border-color: var(--blue); color: #fff; }
.mode-card .check svg { width: 13px; height: 13px; opacity: 0; }
.mode-card.sel .check svg { opacity: 1; }
@media (max-width: 700px) { .mode-cards { grid-template-columns: 1fr; } }

/* ---------- Test-call simulator ---------- */
.simwrap { display: grid; grid-template-columns: 1fr 320px; gap: 22px; }
@media (max-width: 880px) { .simwrap { grid-template-columns: 1fr; } }
.sim-phone { background: linear-gradient(165deg, var(--blue-ink), var(--blue-deep)); border-radius: var(--r-xl); padding: 26px 22px; color: #fff; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 13px; min-height: 320px; justify-content: center; position: relative; overflow: hidden; }
.sim-phone.menu { justify-content: flex-start; align-items: stretch; text-align: left; }
.sim-phone .numline { font-size: 0.78rem; color: oklch(0.88 0.03 220); font-family: var(--mono); }
.sim-ava { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 1.6rem; color: #fff; background: oklch(1 0 0 / 0.16); position: relative; }
.sim-ava.ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%; animation: simpulse 1.4s ease-out infinite; }
@keyframes simpulse { 0% { box-shadow: 0 0 0 0 oklch(1 0 0 / 0.35); } 70% { box-shadow: 0 0 0 22px oklch(1 0 0 / 0); } 100% { box-shadow: 0 0 0 0 oklch(1 0 0 / 0); } }
.sim-name { font-size: 1.2rem; font-weight: 700; min-height: 1.3em; }
.sim-state { font-size: 0.88rem; color: oklch(0.9 0.02 220); min-height: 1.3em; }
.sim-phone.connected { background: linear-gradient(165deg, oklch(0.42 0.12 158), oklch(0.52 0.13 158)); }
.sim-phone.voicemail { background: linear-gradient(165deg, oklch(0.4 0.06 250), oklch(0.5 0.06 255)); }
.sim-dots { display: flex; gap: 6px; }
.sim-dots i { width: 7px; height: 7px; border-radius: 50%; background: oklch(1 0 0 / 0.28); transition: all .25s; }
.sim-dots i.active { background: #fff; transform: scale(1.3); }
.sim-dots i.done { background: oklch(1 0 0 / 0.55); }
.sim-menu { display: flex; flex-direction: column; gap: 8px; }
.sim-menu .t { font-size: 0.82rem; color: oklch(0.9 0.02 220); font-weight: 600; margin-bottom: 2px; }
.sim-opt { display: flex; align-items: center; gap: 11px; background: oklch(1 0 0 / 0.12); border: 1px solid oklch(1 0 0 / 0.18); color: #fff; padding: 10px 12px; border-radius: 12px; cursor: pointer; font-family: var(--font); transition: background .15s, transform .15s; text-align: left; }
.sim-opt:hover { background: oklch(1 0 0 / 0.24); transform: translateY(-1px); }
.sim-opt .digit { width: 30px; height: 30px; border-radius: 9px; background: oklch(1 0 0 / 0.22); display: grid; place-items: center; font-weight: 700; flex: none; }
.sim-opt b { font-size: 0.92rem; display: block; }
.sim-opt small { font-size: 0.74rem; color: oklch(0.88 0.02 220); }
.sim-side .preview-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.sim-side .preview-row:last-child { border-bottom: none; }
.sim-side .preview-row .dg { width: 24px; height: 24px; border-radius: 7px; background: var(--tint); color: var(--blue-deep); font-weight: 700; font-size: 0.78rem; display: grid; place-items: center; flex: none; }

/* ---------- Call log table ---------- */
.logtools { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-pills { display: flex; gap: 6px; }
.fpill { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); font-size: 0.83rem; font-weight: 600; padding: 7px 14px; border-radius: 99px; cursor: pointer; transition: all .15s; }
.fpill:hover { border-color: var(--blue); color: var(--blue-deep); }
.fpill.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.log { display: flex; flex-direction: column; }
.logrow { display: grid; grid-template-columns: 40px 1fr 150px 110px 120px; align-items: center; gap: 14px; padding: 14px 8px; border-bottom: 1px solid var(--line-soft); }
.logrow:last-child { border-bottom: none; }
.logrow .dir { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
.logrow .dir svg { width: 17px; height: 17px; }
.dir-in { background: var(--tint); color: var(--blue-deep); }
.dir-miss { background: oklch(0.96 0.05 22); color: var(--rose); }
.dir-vm { background: oklch(0.95 0.02 255); color: var(--blue-deep); }
.logrow .who b { font-size: 0.92rem; font-weight: 600; }
.logrow .who span { font-size: 0.8rem; color: var(--ink-faint); display: block; }
.logrow .routed { font-size: 0.85rem; color: var(--ink-soft); }
.logrow .routed b { font-weight: 600; color: var(--ink); display: block; font-size: 0.85rem; }
.logrow .dur { font-family: var(--mono); font-size: 0.84rem; color: var(--ink-soft); }
.logrow .when { font-size: 0.82rem; color: var(--ink-faint); text-align: right; }
@media (max-width: 820px) { .logrow { grid-template-columns: 40px 1fr auto; } .logrow .routed, .logrow .dur { display: none; } }

/* ---------- Settings ---------- */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 0; border-bottom: 1px solid var(--line-soft); }
.set-row:last-child { border-bottom: none; }
.set-row .txt b { font-size: 0.94rem; font-weight: 600; display: block; }
.set-row .txt p { font-size: 0.84rem; color: var(--ink-faint); margin-top: 2px; max-width: 52ch; }

/* ---------- Usage ---------- */
.usage-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 820px) { .usage-grid { grid-template-columns: 1fr; } }
.usage-bar { height: 12px; border-radius: 99px; background: var(--tint); overflow: hidden; margin: 14px 0 8px; }
.usage-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--teal), var(--blue)); transition: width .5s ease; }
.usage-bar i.warn { background: linear-gradient(90deg, var(--amber), var(--rose)); }
.bigbar { height: 16px; }
.plan-feat { display: flex; gap: 9px; align-items: flex-start; font-size: 0.9rem; color: var(--ink-soft); padding: 7px 0; }
.plan-feat svg { width: 18px; height: 18px; color: var(--teal-deep); flex: none; margin-top: 1px; }
@media (max-width: 700px) { .feat-grid { grid-template-columns: 1fr !important; } }

.invoice { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--line-soft); }
.invoice:last-child { border-bottom: none; }
.invoice .l b { font-size: 0.9rem; font-weight: 600; display: block; }
.invoice .l span { font-size: 0.8rem; color: var(--ink-faint); }
.invoice .amt { font-weight: 600; font-size: 0.9rem; }

/* ---------- toast ---------- */
.toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: var(--blue-ink); color: #fff; padding: 12px 20px; border-radius: 99px; box-shadow: var(--shadow-lg); font-size: 0.88rem; font-weight: 500; z-index: 200; display: flex; align-items: center; gap: 9px; animation: toastin .25s ease; }
.toast svg { width: 17px; height: 17px; color: oklch(0.82 0.12 160); }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ---------- Account page ---------- */
.acct-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 24px; overflow-x: auto; }
.acct-tab { border: none; background: none; font-family: var(--font); font-size: 0.92rem; font-weight: 600; color: var(--ink-faint); padding: 12px 16px; cursor: pointer; position: relative; white-space: nowrap; transition: color .15s; }
.acct-tab:hover { color: var(--ink); }
.acct-tab.active { color: var(--blue-deep); }
.acct-tab.active::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2.5px; border-radius: 2px; background: var(--blue); }

.acct-photo { display: flex; align-items: center; gap: 18px; padding-bottom: 22px; border-bottom: 1px solid var(--line-soft); margin-bottom: 22px; }
.acct-photo .big-ava { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 1.7rem; background: linear-gradient(150deg, var(--violet), var(--blue)); flex: none; }
.acct-photo .pmeta b { font-size: 1.05rem; font-weight: 700; display: block; }
.acct-photo .pmeta span { font-size: 0.85rem; color: var(--ink-faint); }
.acct-photo .pacts { display: flex; gap: 8px; margin-top: 10px; }

.session { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
.session:last-child { border-bottom: none; }
.session .sic { width: 40px; height: 40px; border-radius: 11px; background: var(--tint); color: var(--blue-deep); display: grid; place-items: center; flex: none; }
.session .sic svg { width: 19px; height: 19px; }
.session .sinfo { flex: 1; min-width: 0; }
.session .sinfo b { font-size: 0.92rem; font-weight: 600; }
.session .sinfo span { font-size: 0.8rem; color: var(--ink-faint); display: block; }

.card-on-file { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface-2); }
.card-brand { width: 50px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, var(--blue-ink), var(--blue)); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 0.72rem; letter-spacing: 0.04em; flex: none; }
.card-on-file .cnum { font-family: var(--mono); font-size: 0.95rem; font-weight: 600; }
.card-on-file .cexp { font-size: 0.8rem; color: var(--ink-faint); }

/* ---------- Billing add-ons ---------- */
.addon { display: flex; align-items: flex-start; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--line-soft); }
.addon:last-of-type { border-bottom: none; }
.addon .aic { width: 44px; height: 44px; border-radius: 12px; background: var(--tint); color: var(--blue-deep); display: grid; place-items: center; flex: none; }
.addon .aic svg { width: 21px; height: 21px; }
.addon .abody { flex: 1; min-width: 0; }
.addon .abody .atop { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.addon .abody b { font-size: 0.98rem; font-weight: 600; }
.addon .abody .price { font-size: 0.86rem; color: var(--blue-deep); font-weight: 600; }
.addon .abody p { font-size: 0.84rem; color: var(--ink-faint); margin-top: 3px; max-width: 46ch; }
.addon .actl { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 130px; }
.addon .sub { font-size: 0.82rem; font-weight: 600; color: var(--ink); }

.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
.stepper button { width: 36px; height: 36px; border: none; background: var(--surface); color: var(--ink-soft); font-size: 1.1rem; cursor: pointer; display: grid; place-items: center; transition: background .15s, color .15s; }
.stepper button:hover:not(:disabled) { background: var(--tint); color: var(--blue-deep); }
.stepper button:disabled { opacity: 0.35; cursor: not-allowed; }
.stepper .v { min-width: 40px; text-align: center; font-weight: 700; font-size: 0.95rem; border-left: 1px solid var(--line); border-right: 1px solid var(--line); height: 36px; display: grid; place-items: center; }

.rangewrap { width: 200px; }
input[type="range"].rng { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 99px; background: linear-gradient(90deg, var(--blue) var(--pct, 0%), var(--tint) var(--pct, 0%)); outline: none; cursor: pointer; }
input[type="range"].rng::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid var(--blue); box-shadow: var(--shadow-sm); cursor: pointer; }
input[type="range"].rng::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--blue); box-shadow: var(--shadow-sm); cursor: pointer; }

.addon-total { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; background: var(--tint); border-radius: var(--r-lg); margin-top: 18px; }
.addon-total .lbl { font-size: 0.9rem; color: var(--ink-soft); }
.addon-total .lbl b { color: var(--ink); }
.addon-total .big { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
.addon-total .big span { font-size: 0.9rem; font-weight: 500; color: var(--ink-faint); }
@media (max-width: 620px) { .addon { flex-wrap: wrap; } .addon .actl { align-items: flex-start; width: 100%; flex-direction: row; justify-content: space-between; } .rangewrap { width: 140px; } }

.danger-zone { border: 1px solid oklch(0.86 0.07 22); border-radius: var(--r-lg); background: oklch(0.985 0.02 22); }
.danger-zone .card-head { border-color: oklch(0.9 0.05 22); }
.danger-zone h2 { color: oklch(0.5 0.18 22); }

/* ---------- Add-on minute balance ---------- */
.mb-top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.mb-top .big { font-size: 2.4rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
.mb-top .big span { font-size: 0.95rem; font-weight: 500; color: var(--ink-faint); letter-spacing: 0; }
.mb-top .mb-meta { font-size: 0.85rem; color: var(--ink-faint); }
.mb-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
.mb-stat { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 13px 15px; }
.mb-stat .mb-ic { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; background: var(--tint); color: var(--blue-deep); }
.mb-stat .mb-ic svg { width: 17px; height: 17px; }
.mb-stat b { font-size: 1.12rem; font-weight: 700; letter-spacing: -0.02em; display: block; line-height: 1.1; }
.mb-stat span { font-size: 0.76rem; color: var(--ink-faint); }
.mb-note { display: flex; align-items: flex-start; gap: 8px; font-size: 0.82rem; color: var(--ink-faint); margin-top: 16px; }
.mb-note svg { width: 16px; height: 16px; color: var(--teal-deep); flex: none; margin-top: 1px; }
.mb-empty { display: flex; align-items: center; gap: 14px; }
.mb-empty .ic { width: 46px; height: 46px; border-radius: 13px; background: var(--tint); color: var(--blue-deep); display: grid; place-items: center; flex: none; }
.mb-empty .ic svg { width: 22px; height: 22px; }
.mb-empty b { font-size: 0.98rem; font-weight: 600; display: block; }
.mb-empty p { font-size: 0.86rem; color: var(--ink-faint); margin-top: 2px; max-width: 56ch; }
@media (max-width: 600px) { .mb-stats { grid-template-columns: 1fr; } }

/* clickable user chip */
.user-chip.clickable { cursor: pointer; border-radius: var(--r-md); padding: 4px 8px 4px 6px; transition: background .15s; }
.user-chip.clickable:hover { background: var(--tint); }

/* ---------- Empty state ---------- */
.empty { text-align: center; padding: 56px 24px; background: var(--surface); border: 1.5px dashed var(--line); border-radius: var(--r-xl); }
.empty .ic { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 18px; display: grid; place-items: center; background: var(--tint); color: var(--blue-deep); }
.empty .ic svg { width: 30px; height: 30px; }
.empty h3 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
.empty p { color: var(--ink-soft); margin: 8px auto 22px; max-width: 42ch; }

/* ---------- responsive sidebar ---------- */
@media (max-width: 860px) {
  .dash { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-w); transform: translateX(-100%); transition: transform .25s ease; box-shadow: var(--shadow-lg); }
  .sidebar.open { transform: none; }
  .topbar .menu-btn { display: grid; }
  .numswitch-btn { min-width: 0; }
  .user-chip .who { display: none; }
}
.menu-btn { display: none; }
.scrim { display: none; }
@media (max-width: 860px) { .scrim.show { display: block; position: fixed; inset: 0; background: oklch(0.3 0.04 245 / 0.4); z-index: 9; } }
