still reaches you. Plans for dogs, cats and parrots from $29 a year.\">\n<title>iCanCall for Pets — A microchip number that never goes out of date.<\/title>\n<style>/* ===========================================================\n   iCanCall — landing page styles\n   Warm & reassuring · soft blue/teal · clean neutral sans\n   =========================================================== */\n\n:root {\n  /* Surfaces — subtly cool whites */\n  --bg:        oklch(0.992 0.005 220);\n  --surface:   oklch(1 0 0);\n  --tint:      oklch(0.965 0.018 218);   /* soft blue wash */\n  --tint-2:    oklch(0.945 0.028 210);\n  --line:      oklch(0.90 0.012 225);\n\n  /* Ink — cool near-blacks */\n  --ink:       oklch(0.26 0.028 248);\n  --ink-soft:  oklch(0.45 0.022 245);\n  --ink-faint: oklch(0.60 0.018 242);\n\n  /* Brand — calm blues + teal */\n  --blue:      oklch(0.58 0.115 232);\n  --blue-deep: oklch(0.44 0.105 240);\n  --blue-ink:  oklch(0.34 0.085 244);\n  --teal:      oklch(0.72 0.095 196);\n  --teal-deep: oklch(0.62 0.10 198);\n  --green:     oklch(0.70 0.13 158);\n\n  --shadow-sm: 0 1px 2px oklch(0.4 0.05 240 / 0.06), 0 2px 6px oklch(0.4 0.05 240 / 0.05);\n  --shadow-md: 0 4px 14px oklch(0.4 0.05 240 / 0.08), 0 10px 30px oklch(0.4 0.05 240 / 0.07);\n  --shadow-lg: 0 12px 28px oklch(0.4 0.06 240 / 0.10), 0 30px 60px oklch(0.4 0.06 240 / 0.10);\n\n  --r-sm: 10px;\n  --r-md: 16px;\n  --r-lg: 24px;\n  --r-xl: 32px;\n\n  --maxw: 1180px;\n  --pad: clamp(20px, 5vw, 56px);\n\n  --font: \"Atkinson Hyperlegible Next\", \"Helvetica Neue\", Helvetica, Arial, \"Segoe UI\", sans-serif;\n  --mono: var(--font);\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }\n\nbody {\n  font-family: var(--font);\n  background: var(--bg);\n  color: var(--ink);\n  line-height: 1.55;\n  font-size: 17px;\n  letter-spacing: -0.01em;\n}\n\na { color: inherit; text-decoration: none; }\nimg { display: block; max-width: 100%; }\n\n.wrap { max-width: var(--maxw); margin: 0 auto; padding-inline: var(--pad); }\n\n/* ---------- Typography ---------- */\nh1, h2, h3, h4 { letter-spacing: -0.025em; line-height: 1.06; font-weight: 700; color: var(--ink); }\nh1 { font-size: clamp(2.6rem, 6vw, 4.6rem); }\nh2 { font-size: clamp(2rem, 4vw, 3.1rem); }\nh3 { font-size: clamp(1.25rem, 2vw, 1.6rem); }\n.lead { font-size: clamp(1.1rem, 1.6vw, 1.32rem); color: var(--ink-soft); line-height: 1.5; }\n\n.eyebrow {\n  display: inline-flex; align-items: center; gap: 8px;\n  font-size: 0.82rem; font-weight: 600; letter-spacing: 0.04em;\n  text-transform: uppercase; color: var(--blue-deep);\n}\n.eyebrow::before {\n  content: \"\"; width: 22px; height: 2px; border-radius: 2px;\n  background: var(--teal-deep);\n}\n\n.section { padding-block: clamp(72px, 10vw, 130px); }\n.section-head { max-width: 680px; }\n.section-head .eyebrow { margin-bottom: 18px; }\n.section-head .lead { margin-top: 18px; }\n.center { margin-inline: auto; text-align: center; }\n.center .eyebrow { justify-content: center; }\n\n/* ---------- Buttons ---------- */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 9px;\n  font-family: var(--font); font-size: 1rem; font-weight: 600;\n  padding: 14px 26px; border-radius: 999px; border: 1px solid transparent;\n  cursor: pointer; transition: transform .18s ease, box-shadow .18s ease, background .18s ease;\n  white-space: nowrap;\n}\n.btn-primary {\n  background: var(--blue); color: #fff;\n  box-shadow: 0 6px 18px oklch(0.58 0.115 232 / 0.32);\n}\n.btn-primary:hover { background: var(--blue-deep); transform: translateY(-2px); box-shadow: 0 10px 24px oklch(0.58 0.115 232 / 0.38); }\n.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }\n.btn-ghost:hover { background: var(--tint); border-color: var(--blue); transform: translateY(-2px); }\n.btn-lg { padding: 17px 34px; font-size: 1.06rem; }\n\n/* ---------- Header ---------- */\n.header {\n  position: sticky; top: 0; z-index: 60;\n  backdrop-filter: blur(12px);\n  background: oklch(0.992 0.005 220 / 0.78);\n  border-bottom: 1px solid transparent;\n  transition: border-color .25s ease, background .25s ease;\n}\n.header.scrolled { border-color: var(--line); background: oklch(0.992 0.005 220 / 0.92); }\n.header-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; }\n.header .btn { padding: 9px 18px; font-size: 0.9rem; }\n.brand { display: flex; align-items: center; gap: 11px; font-weight: 700; font-size: 1.22rem; letter-spacing: -0.03em; }\n.brand .mark {\n  width: 34px; height: 34px; border-radius: 10px; flex: none;\n  background: linear-gradient(150deg, var(--blue), var(--teal-deep));\n  display: grid; place-items: center; box-shadow: var(--shadow-sm);\n}\n.brand .mark svg { width: 18px; height: 18px; }\n.brand b { color: var(--blue-deep); }\n.nav { display: flex; align-items: center; gap: 20px; }\n.nav a { font-size: 0.94rem; color: var(--ink-soft); font-weight: 500; transition: color .15s; white-space: nowrap; }\n.nav a:hover { color: var(--ink); }\n.header-cta { display: flex; align-items: center; gap: 14px; }\n.nav-toggle { display: none; }\n@media (max-width: 880px) {\n  .nav { display: none; }\n  .header-cta .btn-ghost { display: none; }\n}\n\n/* ---------- Hero ---------- */\n.hero { position: relative; overflow: hidden; padding-top: clamp(48px, 7vw, 86px); padding-bottom: clamp(60px, 8vw, 110px); }\n.hero::before {\n  content: \"\"; position: absolute; inset: -20% -10% auto -10%; height: 760px;\n  background:\n    radial-gradient(60% 60% at 78% 12%, oklch(0.72 0.095 196 / 0.18), transparent 70%),\n    radial-gradient(55% 55% at 18% 0%, oklch(0.58 0.115 232 / 0.16), transparent 70%);\n  pointer-events: none; z-index: 0;\n}\n.hero-grid {\n  position: relative; z-index: 1;\n  display: grid; grid-template-columns: 1.02fr 0.98fr; gap: clamp(36px, 5vw, 72px);\n  align-items: center;\n}\n.hero-copy .eyebrow { margin-bottom: 22px; }\n.hero-copy h1 { margin-bottom: 22px; }\n.hero-copy h1 .accent { color: var(--blue-deep); }\n.hero-copy .lead { max-width: 30ch; margin-bottom: 34px; }\n.hero-actions { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }\n.hero-note { margin-top: 22px; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--ink-faint); }\n.hero-note .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px oklch(0.70 0.13 158 / 0.18); }\n\n@media (max-width: 900px) {\n  .hero-grid { grid-template-columns: 1fr; }\n  .hero-copy .lead { max-width: 46ch; }\n}\n\n/* ---------- Routing demo ---------- */\n.demo {\n  position: relative;\n  background: var(--surface);\n  border: 1px solid var(--line);\n  border-radius: var(--r-xl);\n  box-shadow: var(--shadow-lg);\n  padding: 26px 24px 22px;\n}\n.demo-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }\n.demo-number { display: flex; align-items: center; gap: 12px; }\n.demo-number .ring {\n  width: 44px; height: 44px; border-radius: 13px; flex: none;\n  background: linear-gradient(150deg, var(--blue), var(--teal-deep));\n  display: grid; place-items: center; position: relative;\n}\n.demo-number .ring svg { width: 21px; height: 21px; }\n.demo-number .ring::after {\n  content: \"\"; position: absolute; inset: 0; border-radius: 13px;\n  box-shadow: 0 0 0 0 oklch(0.58 0.115 232 / 0.45);\n  animation: pulse 2.4s ease-out infinite;\n}\n@keyframes pulse {\n  0% { box-shadow: 0 0 0 0 oklch(0.58 0.115 232 / 0.40); }\n  70% { box-shadow: 0 0 0 16px oklch(0.58 0.115 232 / 0); }\n  100% { box-shadow: 0 0 0 0 oklch(0.58 0.115 232 / 0); }\n}\n.demo-number .num { font-weight: 700; font-size: 1.12rem; letter-spacing: -0.02em; }\n.demo-number .num small { display: block; font-size: 0.72rem; font-weight: 500; color: var(--ink-faint); letter-spacing: 0.02em; }\n.demo-status {\n  font-size: 0.78rem; font-weight: 600; color: var(--blue-deep);\n  background: var(--tint); border: 1px solid var(--line);\n  padding: 6px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px;\n  transition: color .3s, background .3s, border-color .3s;\n}\n.demo-status .live { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }\n.demo.is-connected .demo-status { color: oklch(0.42 0.13 158); background: oklch(0.94 0.05 158); border-color: oklch(0.84 0.07 158); }\n.demo.is-connected .demo-status .live { background: var(--green); }\n\n.demo-caption { font-size: 0.78rem; color: var(--ink-faint); margin-bottom: 14px; padding-left: 2px; }\n\n.chain { display: flex; flex-direction: column; gap: 9px; }\n.contact {\n  position: relative; display: flex; align-items: center; gap: 13px;\n  padding: 11px 14px; border-radius: var(--r-md);\n  border: 1px solid var(--line); background: var(--surface);\n  transition: border-color .3s, background .3s, box-shadow .3s, opacity .3s, transform .3s;\n}\n.contact .avatar {\n  width: 38px; height: 38px; border-radius: 50%; flex: none;\n  display: grid; place-items: center; font-weight: 700; font-size: 0.9rem; color: #fff;\n}\n.contact .who { flex: 1; min-width: 0; }\n.contact .who b { font-size: 0.97rem; font-weight: 600; }\n.contact .who span { display: block; font-size: 0.8rem; color: var(--ink-faint); }\n.contact .state { font-size: 0.78rem; font-weight: 600; color: var(--ink-faint); white-space: nowrap; }\n.contact .order {\n  position: absolute; left: -1px; top: -1px;\n  width: 20px; height: 20px; border-radius: 0 0 10px 0;\n  background: var(--tint); color: var(--ink-faint);\n  font-size: 0.66rem; font-weight: 700; display: grid; place-items: center;\n}\n\n/* states */\n.contact.is-ringing {\n  border-color: var(--blue); background: var(--tint);\n  box-shadow: 0 0 0 3px oklch(0.58 0.115 232 / 0.12), var(--shadow-sm);\n}\n.contact.is-ringing .state { color: var(--blue-deep); }\n.contact.is-ringing .avatar { animation: wiggle .6s ease-in-out infinite; }\n@keyframes wiggle { 0%,100%{ transform: rotate(0); } 25%{ transform: rotate(-8deg);} 75%{ transform: rotate(8deg);} }\n.contact.is-missed { opacity: 0.5; }\n.contact.is-missed .state { color: var(--ink-faint); }\n.contact.is-connected {\n  border-color: oklch(0.80 0.09 158); background: oklch(0.96 0.04 158);\n  box-shadow: 0 0 0 3px oklch(0.70 0.13 158 / 0.16), var(--shadow-md);\n  transform: translateX(2px);\n}\n.contact.is-connected .state { color: oklch(0.42 0.13 158); }\n\n/* ---------- Logos / trust strip ---------- */\n.trust { padding-block: 40px; border-block: 1px solid var(--line); background: var(--surface); }\n.trust-inner { display: flex; align-items: center; justify-content: space-between; gap: 30px; flex-wrap: wrap; }\n.trust-label { font-size: 0.82rem; font-weight: 600; color: var(--ink-faint); letter-spacing: 0.03em; text-transform: uppercase; }\n.trust-stats { display: flex; gap: clamp(28px, 5vw, 64px); flex-wrap: wrap; }\n.stat b { display: block; font-size: clamp(1.5rem, 2.4vw, 2.1rem); font-weight: 700; letter-spacing: -0.03em; color: var(--blue-deep); }\n.stat span { font-size: 0.85rem; color: var(--ink-soft); }\n\n/* ---------- Steps ---------- */\n.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 56px; }\n.step { position: relative; padding: 30px 26px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }\n.step .idx {\n  width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;\n  font-weight: 700; font-size: 1.05rem; color: #fff; margin-bottom: 20px;\n  background: linear-gradient(150deg, var(--blue), var(--teal-deep));\n}\n.step h3 { margin-bottom: 8px; }\n.step p { color: var(--ink-soft); font-size: 0.98rem; }\n.step-arrow { position: absolute; right: -30px; top: 48px; color: var(--line); z-index: 2; }\n@media (max-width: 820px) { .steps { grid-template-columns: 1fr; } .step-arrow { display: none; } }\n\n/* ---------- Interactive builder ---------- */\n.mode-toggle { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 48px; }\n.mode-toggle .mode-label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); }\n.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px; gap: 4px; box-shadow: var(--shadow-sm); }\n.seg-btn { border: none; background: none; font-family: var(--font); font-size: 0.95rem; font-weight: 600; color: var(--ink-soft); padding: 10px 24px; border-radius: 999px; cursor: pointer; transition: background .2s, color .2s; }\n.seg-btn:hover:not(.active) { color: var(--ink); }\n.seg-btn.active { background: var(--blue); color: #fff; box-shadow: 0 4px 12px oklch(0.58 0.115 232 / 0.3); }\n.seg-btn:disabled { opacity: 0.5; cursor: not-allowed; }\n.mode-note { font-size: 0.82rem; color: var(--ink-faint); display: inline-flex; align-items: center; gap: 7px; }\n\n.builder { display: grid; grid-template-columns: 1fr 0.9fr; gap: 24px; margin-top: 28px; align-items: start; }\n@media (max-width: 880px) { .builder { grid-template-columns: 1fr; } }\n\n.builder-panel, .sim-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }\n.builder-panel { padding: 24px 24px 26px; }\n.builder-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }\n.builder-head h3 { font-size: 1.15rem; }\n.builder-head .count { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.82rem; color: var(--ink-faint); background: var(--tint); padding: 4px 10px; border-radius: 999px; }\n\n.circle-list { display: flex; flex-direction: column; gap: 9px; min-height: 60px; }\n.circle-row {\n  display: flex; align-items: center; gap: 12px; padding: 10px 12px;\n  border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface);\n  transition: border-color .25s, background .25s, box-shadow .25s, opacity .25s, transform .25s;\n}\n.circle-row .avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; color: #fff; }\n.circle-row .who { flex: 1; min-width: 0; }\n.circle-row .who b { font-size: 0.94rem; font-weight: 600; display: block; line-height: 1.2; }\n.circle-row .who span { font-size: 0.78rem; color: var(--ink-faint); }\n.circle-row.is-ringing { border-color: var(--blue); background: var(--tint); box-shadow: 0 0 0 3px oklch(0.58 0.115 232 / 0.12); }\n.circle-row.is-ringing .avatar { animation: wiggle .6s ease-in-out infinite; }\n.circle-row.is-missed { opacity: 0.45; }\n.circle-row.is-connected { border-color: oklch(0.80 0.09 158); background: oklch(0.96 0.04 158); box-shadow: 0 0 0 3px oklch(0.70 0.13 158 / 0.16); }\n\n.row-tools { display: flex; align-items: center; gap: 4px; }\n.icon-btn {\n  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line);\n  background: var(--surface); color: var(--ink-soft); cursor: pointer; display: grid; place-items: center;\n  transition: background .15s, color .15s, border-color .15s, opacity .15s;\n}\n.icon-btn:hover:not(:disabled) { background: var(--tint); color: var(--blue-deep); border-color: var(--blue); }\n.icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }\n.icon-btn svg { width: 15px; height: 15px; }\n.icon-btn.danger:hover:not(:disabled) { color: oklch(0.55 0.18 25); border-color: oklch(0.55 0.18 25); background: oklch(0.96 0.04 25); }\n\n/* availability switch (button-driven) */\n.avail { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; flex: none; background: none; border: none; padding: 0; font-family: var(--font); }\n.avail .track { width: 38px; height: 22px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; flex: none; }\n.avail .track::after { content: \"\"; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform .2s; }\n.avail.on .track { background: var(--green); }\n.avail.on .track::after { transform: translateX(16px); }\n.avail .lbl { font-size: 0.74rem; font-weight: 600; color: var(--ink-faint); width: 56px; text-align: left; }\n.avail.on .lbl { color: oklch(0.45 0.13 158); }\n.avail:disabled { opacity: 0.4; cursor: not-allowed; }\n\n.circle-empty { text-align: center; padding: 22px; color: var(--ink-faint); font-size: 0.9rem; border: 1px dashed var(--line); border-radius: var(--r-md); }\n\n.add-form { display: grid; grid-template-columns: 1.2fr 1fr auto; gap: 8px; margin-top: 16px; padding-top: 18px; border-top: 1px solid var(--line); }\n.add-form input { font-family: var(--font); font-size: 0.92rem; padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }\n.add-form input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px oklch(0.58 0.115 232 / 0.12); }\n.add-form input::placeholder { color: var(--ink-faint); }\n.add-form .add-btn { width: 44px; padding: 0; }\n.add-form .add-btn svg { width: 18px; height: 18px; }\n@media (max-width: 520px) { .add-form { grid-template-columns: 1fr 1fr; } .add-form .add-btn { grid-column: 1 / -1; width: 100%; } }\n\n/* sim phone */\n.sim-panel { padding: 26px 24px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; position: sticky; top: 92px; }\n.sim-screen {\n  width: 100%; border-radius: var(--r-lg); padding: 30px 22px 26px;\n  background: linear-gradient(165deg, var(--blue-ink), var(--blue-deep));\n  color: #fff; position: relative; overflow: hidden; min-height: 280px;\n  display: flex; flex-direction: column; align-items: center sform: none; }\n}\n<\/style>\n<style>/* ===========================================================\n   iCanCall — shared audience-page components\n   Loaded by every tailored audience landing page (seniors,\n   parents, caregivers) on top of styles.css. Per-audience\n   files add their own signature sections.\n   =========================================================== */\n\n/* ---------- Hero audience badge ---------- */\n.aud-badge {\n  display: inline-flex; align-items: center; gap: 9px;\n  background: var(--surface); border: 1px solid var(--line);\n  padding: 8px 15px 8px 11px; border-radius: 999px;\n  font-size: 0.92rem; font-weight: 600; color: var(--blue-deep);\n  box-shadow: var(--shadow-sm); margin-bottom: 22px;\n}\n.aud-badge .hh {\n  width: 26px; height: 26px; border-radius: 50%; flex: none;\n  background: linear-gradient(150deg, var(--blue), var(--teal-deep));\n  display: grid; place-items: center;\n}\n.aud-badge .hh svg { width: 14px; height: 14px; }\n\n/* ---------- Reassurance callout under hero actions ---------- */\n.hero-reassure {\n  margin-top: 26px; display: flex; gap: 14px; align-items: flex-start;\n  max-width: 42ch; padding: 14px 16px; border-radius: var(--r-md);\n  background: oklch(0.70 0.13 158 / 0.10); border: 1px solid oklch(0.70 0.13 158 / 0.28);\n}\n.hero-reassure svg { width: 22px; height: 22px; flex: none; margin-top: 1px; color: oklch(0.45 0.13 158); }\n.hero-reassure p { font-size: 0.98rem; color: var(--ink-soft); }\n.hero-reassure b { color: var(--ink); }\n\n/* ---------- Single-story spotlight (replaces 3-up quotes) ---------- */\n.spotlight-card {\n  display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 0;\n  border-radius: var(--r-xl); overflow: hidden;\n  border: 1px solid var(--line); box-shadow: var(--shadow-lg); background: var(--surface);\n}\n.spotlight-quote { padding: clamp(34px, 4vw, 56px); display: flex; flex-direction: column; }\n.spotlight-quote .stars { color: var(--teal-deep); letter-spacing: 4px; font-size: 1.05rem; margin-bottom: 18px; }\n.spotlight-quote blockquote {\n  font-size: clamp(1.3rem, 2.1vw, 1.7rem); line-height: 1.4; font-weight: 600;\n  letter-spacing: -0.02em; color: var(--ink); flex: 1;\n}\n.spotlight-quote .by { display: flex; align-items: center; gap: 13px; margin-top: 28px; }\n.spotlight-quote .by .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 0.95rem; }\n.spotlight-quote .by b { font-size: 1rem; display: block; }\n.spotlight-quote .by span { font-size: 0.9rem; color: var(--ink-faint); }\n.spotlight-aside {\n  background: linear-gradient(160deg, var(--blue-deep), var(--blue) 55%, var(--teal-deep));\n  color: #fff; padding: clamp(34px, 4vw, 52px); display: flex; flex-direction: column; justify-content: center; gap: 26px;\n}\n.spotlight-aside .stat-xl b { display: block; font-size: clamp(2.4rem, 4vw, 3.4rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1; }\n.spotlight-aside .stat-xl span { font-size: 1rem; color: oklch(0.92 0.02 220); margin-top: 8px; display: block; }\n.spotlight-aside .divider { height: 1px; background: oklch(1 0 0 / 0.22); }\n@media (max-width: 820px) { .spotlight-card { grid-template-columns: 1fr; } }\n<\/style>\n<style>/* ===========================================================\n   iCanCall — Parents of young children\n   Layers on styles.css + audience.css. Signature sections:\n   1) \"One number is the whole lesson\" before/after\n   2) \"Works wherever they are\" scenarios strip\n   A single warm accent differentiates this audience on-brand.\n   =========================================================== */\n\n:root {\n  --warm:      oklch(0.70 0.145 52);    /* warm amber — used sparingly */\n  --warm-deep: oklch(0.55 0.13 48);\n  --warm-tint: oklch(0.95 0.035 60);\n}\n\n/* ---------- \"One number is the whole lesson\" ---------- */\n.lesson { padding-block: clamp(64px, 9vw, 110px); }\n.lesson-grid {\n  display: grid; grid-template-columns: 1fr 1fr; gap: clamp(18px, 3vw, 30px);\n  margin-top: 52px; align-items: stretch;\n}\n.lesson-card {\n  position: relative; border-radius: var(--r-xl); padding: clamp(26px, 3vw, 38px);\n  border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-sm);\n  display: flex; flex-direction: column;\n}\n.lesson-card .tab {\n  display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;\n  font-size: 0.82rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;\n  padding: 6px 13px; border-radius: 999px; margin-bottom: 22px;\n}\n.lesson-card.before .tab { background: var(--tint); color: var(--ink-faint); }\n.lesson-card.after  .tab { background: var(--warm-tint); color: var(--warm-deep); }\n.lesson-card h3 { font-size: 1.3rem; margin-bottom: 6px; }\n.lesson-card .sub { font-size: 0.98rem; color: var(--ink-soft); margin-bottom: 22px; }\n\n/* the messy \"old way\" number list */\n.scribbles { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }\n.scribbles .line {\n  display: flex; align-items: center; justify-content: space-between; gap: 12px;\n  padding: 11px 14px; border-radius: var(--r-md);\n  background: var(--bg); border: 1px dashed var(--line); color: var(--ink-faint);\n}\n.scribbles .line .lbl { font-size: 0.96rem; font-weight: 600; color: var(--ink-soft); }\n.scribbles .line .no { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.92rem; }\n.scribbles .line.crossed { opacity: 0.6; text-decoration: line-through; text-decoration-color: oklch(0.6 0.16 25 / 0.6); }\n.scribbles .note { font-size: 0.86rem; color: var(--ink-faint); margin-top: 6px; font-style: italic; }\n\n/* the clean \"new way\" flashcard */\n.flashcard {\n  margin-top: auto; border-radius: var(--r-lg); padding: 34px 26px;\n  background: linear-gradient(160deg, var(--warm-tint), var(--surface));\n  border: 1px solid var(--warm-tint); text-align: center;\n}\n.flashcard .ribbon { font-size: 0.84rem; font-weight: 600; color: var(--warm-deep); letter-spacing: 0.04em; }\n.flashcard .big {\n  font-size: clamp(2.1rem, 4.5vw, 3rem); font-weight: 700; letter-spacing: -0.02em;\n  color: var(--ink); margin: 10px 0 4px; line-height: 1;\n}\n.flashcard .whisper { font-size: 0.92rem; color: var(--ink-soft); }\n.flashcard .hearts { margin-top: 18px; display: flex; gap: 7px; justify-content: center; color: var(--warm); }\n.flashcard .hearts svg { width: 18px; height: 18px; }\n\n@media (max-width: 760px) { .lesson-grid { grid-template-columns: 1fr; } }\n\n/* ---------- \"Works wherever they are\" scenarios ---------- */\n.scenes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 52px; }\n.scene {\n  padding: 26px 22px 24px; border-radius: var(--r-lg);\n  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm);\n  transition: transform .2s, box-shadow .2s, border-color .2s;\n}\n.scene:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--teal-deep); }\n.scene .ic { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; margin-bottom: 16px; background: var(--tint); color: var(--blue-deep); }\n.scene .ic svg { width: 24px; height: 24px; }\n.scene h3 { font-size: 1.1rem; margin-bottom: 7px; }\n.scene p { font-size: 0.96rem; color: var(--ink-soft); }\n@media (max-width: 920px) { .scenes { grid-template-columns: repeat(2, 1fr); } }\n@media (max-width: 520px) { .scenes { grid-template-columns: 1fr; } }\n\n/* warm-tinted hero reassurance for this audience */\n.hero-reassure.warm {\n  background: var(--warm-tint); border-color: oklch(0.70 0.145 52 / 0.32);\n}\n.hero-reassure.warm svg { color: var(--warm-deep); }\n\n/* ---------- Pets page additions ---------- */\n@media (min-width: 821px) { .pricing.two { grid-template-columns: repeat(2, 1fr); max-width: 780px; } }\n#parrots .pricing { margin-top: 40px; }\n.terms-note { max-width: 760px; margin: 28px auto 0; font-size: 0.9rem; color: var(--ink-faint); text-align: center; }\n\n.fit { display: inline-block; margin-top: 14px; font-size: 0.78rem; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: var(--tint); color: var(--blue-deep); }\n.fit.long { background: var(--warm-tint); color: var(--warm-deep); }\n\n.successor {\n  display: grid; grid-template-columns: 1.1fr 1fr; gap: 36px; align-items: center; margin-top: 40px;\n  padding: 36px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm);\n}\n.successor h3 { font-size: 1.4rem; margin: 14px 0 10px; }\n.successor p { color: var(--ink-soft); }\n.successor .aside { margin-top: 14px; font-size: 0.92rem; color: var(--ink-faint); }\n.successor ul { list-style: none; display: flex; flex-direction: column; gap: 14px; }\n.successor li { display: flex; gap: 10px; color: var(--ink-soft); align-items: flex-start; }\n.successor li svg { width: 19px; height: 19px; flex: none; margin-top: 2px; color: var(--teal-deep); }\n@media (max-width: 760px) { .successor { grid-template-columns: 1fr; padding: 28px 22px; } }\n\n.join {\n  max-width: 640px; margin: 48px auto 0; padding: 34px 30px; text-align: center;\n  border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm);\n}\n.join h3 { font-size: 1.35rem; margin-bottom: 6px; }\n.join p { color: var(--ink-soft); }\n.join-form { display: flex; gap: 10px; margin-top: 22px; }\n.join-form input {\n  flex: 1; min-width: 0; font: inherit; font-size: 1rem; padding: 14px 20px;\n  border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);\n}\n.join-form input:focus { outline: 2px solid var(--blue); outline-offset: 2px; }\n.join-form .btn:disabled { opacity: 0.6; cursor: wait; }\n.join .join-msg { margin-top: 12px; min-height: 1.4em; font-size: 0.92rem; }\n.join .join-msg.ok { color: oklch(0.42 0.13 158); }\n.join .join-msg.err { color: oklch(0.50 0.18 25); }\n@media (max-width: 520px) { .join-form { flex-direction: column; } }\n<\/style>\n<\/head>\n<body>\n\n\n\n<!-- ============== HEADER ============== -->\n<header class=\"header\">\n  <div class=\"wrap header-inner\">\n    <a class=\"brand\" href=\"/\" aria-label=\"iCanCall home\">\n      <svg class=\"logo-main\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 553.0305\" style=\"height: 40px; width: auto; display: block;\">\n        <style>\n          .logo-main .cls-1 { fill: #1c2530; }\n          .logo-main .cls-2 { fill: #4083ae; }\n          .logo-main .cls-3 { fill: #fff; }\n        <\/style>\n        <g>\n          <path class=\"cls-1\" d=\"M707.4397,239.6996l-.4398-.6591c-31.0327-46.2476-71.4038-97.0542-117.1563-115.2897-5.2177-2.4717-6.9757-4.9985-2.5277-9.777,4.9441-5.1081,11.2601-11.0948,14.6112-17.796,20.8722-36.6356-8.074-84.4763-50.1482-82.2791-44.1058.769-68.9324,53.1134-43.0062,88.0463,4.1744,6.7561,14.6648,13.4569,16.3129,17.4664.8783,2.3621-.2749,3.9548-2.6913,5.8225-22.9037,11.9189-41.9093,33.4498-63.4398,49.1585-24.9366,18.51-48.3902.5495-73.1069-12.9625-9.777-4.6686-13.7865-8.4035-5.9311-18.8946,20.4873-28.2321-1.3195-70.5248-36.9651-68.438-25.7064.5495-45.2603,25.0466-40.866,50.0929.7147,4.449,2.0879,8.788,4.1744,12.7975,3.7896,8.0743,12.0285,14.226,11.8649,18.8946-.3299,6.0421-9.5584,9.1179-16.8077,15.2146-26.2548,20.4323-47.7867,57.5624-82.9938,31.088-4.7779-3.0758-9.9969-6.5362-14.8847-9.5571-4.6679-3.2404-8.6238-4.8335-9.2272-9.7767-.1649-4.6689,6.9757-11.3697,9.0623-19.7186,8.019-24.7167-16.1479-50.477-41.4694-43.5013-19.1142,4.1195-30.9227,25.7603-24.6617,44.2704,1.868,8.074,10.8752,16.4228,12.5233,20.4873,1.5931,3.6253-2.4714,6.3716-5.5476,8.3489-58.7156,40.4255-120.2325,184.3318-124.0771,280.7269-.6048,22.6295,5.2177,72.887,37.185,64.3185,28.6163-14.0611,45.0941-46.5225,70.4142-67.0098,19.7189-18.3454,45.369-26.3644,67.6693-7.1403,19.9925,14.7201,39.5465,46.2476,68.0528,35.8665,22.8501-8.6781,39.2729-36.4 =\"top\">\n\n<!-- ============== HERO ============== -->\n<section class=\"hero\">\n  <div class=\"wrap hero-grid\">\n    <div class=\"hero-copy\">\n      <span class=\"aud-badge\">\n        <span class=\"hh\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z\"><\/path><\/svg><\/span>\n        For dogs, cats and parrots\n      <\/span>\n      <h1>One number on the chip.<br><span class=\"accent\">It never goes out of date.<\/span><\/h1>\n      <p class=\"lead\">Put your iCanCall number on your pet's microchip once. When you move or change phones, update your contacts in the dashboard. The chip keeps reaching you, and you never have to update the registry again.<\/p>\n      <div class=\"hero-actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"#join\">Join the launch list<\/a>\n        <a class=\"btn btn-ghost btn-lg\" href=\"#how\">How it works<\/a>\n      <\/div>\n      <div class=\"hero-reassure warm\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v4a2 2 0 0 1-2.2 2A16 16 0 0 1 3 6.2 2 2 0 0 1 5 4Z\"><\/path><\/svg>\n        <p><b>Works with any microchip registry.<\/b> Keep the registry you already use. Just put your iCanCall number on file.<\/p>\n      <\/div>\n    <\/div>\n\n    <!-- Animated caller-menu demo -->\n    <div class=\"demo\" id=\"demo\" aria-label=\"Caller menu demonstration\">\n      <div class=\"demo-head\">\n        <div class=\"demo-number\">\n          <span class=\"ring\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n          <\/span>\n          <span class=\"num\">(415) 200-PAWS<small>Max's microchip number<\/small><\/span>\n        <\/div>\n        <span class=\"demo-status\"><span class=\"live\"><\/span><span class=\"txt\">Incoming call<\/span><\/span>\n      <\/div>\n      <p class=\"demo-caption\">A shelter scans Max's chip and calls. The caller menu lets them pick who to reach<\/p>\n      <div class=\"chain\">\n        <div class=\"contact\">\n          <span class=\"order\">1<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.58 0.115 232)\">JA<\/span>\n          <span class=\"who\"><b>Jamie<\/b><span>Owner<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">2<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.62 0.10 198)\">AL<\/span>\n          <span class=\"who\"><b>Alex<\/b><span>Partner<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">3<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.55 0.11 280)\">MC<\/span>\n          <span class=\"who\"><b>Mrs. Chen<\/b><span>Neighbor<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">4<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.6 0.12 30)\">SA<\/span>\n          <span class=\"who\"><b>Sam<\/b><span>Dog walker<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== TRUST STRIP ============== -->\n<section class=\"trust\">\n  <div class=\"wrap trust-inner\">\n    <span class=\"trust-label\">Made for the day your pet goes missing<\/span>\n    <div class=\"trust-stats\">\n      <div class=\"stat\"><b>1<\/b><span>number on the chip<\/span><\/div>\n      <div class=\"stat\"><b>6<\/b><span>contacts in the caller menu<\/span><\/div>\n      <div class=\"stat\"><b>0<\/b><span>registry updates when you move<\/span><\/div>\n      <div class=\"stat\"><b>Any<\/b><span>microchip registry<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== WHY CHIPS FAIL (before/after) ============== -->\n<section class=\"section lesson\" id=\"lesson\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Why chips fail<\/span>\n      <h2>The chip works. The phone number doesn't.<\/h2>\n      <p class=\"lead\">This is the most common reason microchips fail to reunite lost dogs with their owners: not a chip malfunction, but outdated contact details. iCanCall puts a number on the chip that keeps up with you.<\/p>\n    <\/div>\n    <div class=\"lesson-grid\">\n      <div class=\"lesson-card before reveal\">\n        <span class=\"tab\">The old way<\/span>\n        <h3>A number that goes stale<\/h3>\n        <p class=\"sub\">You register the chip once, then life moves on. New phone, new house, and the registry still has the old details.<\/p>\n        <div class=\"scribbles\">\n          <div class=\"line crossed\"><span class=\"lbl\">Registry phone<\/span><span class=\"no\">Old cell<\/span><\/div>\n          <div class=\"line crossed\"><span class=\"lbl\">Home address<\/span><span class=\"no\">Moved<\/span><\/div>\n          <div class=\"line crossed\"><span class=\"lbl\">Backup contact<\/span><span class=\"no\">None<\/span><\/div>\n          <div class=\"line crossed\"><span class=\"lbl\">Last updated<\/span><span class=\"no\">Years ago<\/span><\/div>\n          <p class=\"note\">\"The number you have dialed is no longer in service.\"<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"lesson-card after reveal\">\n        <span class=\"tab\">With iCanCall<\/span>\n        <h3>A number that keeps up with you<\/h3>\n        <p class=\"sub\">The number on the chip never changes. You change who it reaches, any time, from your phone.<\/p>\n        <div class=\"flashcard\">\n          <span class=\"ribbon\">Max's microchip number<\/span>\n          <div class=\"big\">(415) 200-PAWS<\/div>\n          <span class=\"whisper\">\"New phone, new house, same number on the chip.\"<\/span>\n          <div class=\"hearts\">\n            <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9Z\"><\/path><\/svg>\n            <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9Z\"><\/path><\/svg>\n            <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9Z\"><\/path><\/svg>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== HOW IT WORKS ============== -->\n<section class=\"section tint-band\" id=\"how\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">How it works<\/span>\n      <h2>Set it up once. Keep it current forever.<\/h2>\n      <p class=\"lead\">A few minutes of setup means the number on your pet's chip always reaches someone who can help.<\/p>\n    <\/div>\n    <div class=\"steps\">\n      <div class=\"step reveal\">\n        <div class=\"idx\">1<\/div>\n        <h3>Get your pet number<\/h3>\n        <p>Pick an iCanCall number for your pet. One number can cover every pet in your home.<\/p>\n        <svg class=\"step-arrow\" width=\"60\" height=\"24\" viewBox=\"0 0 60 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M0 12h54m0 0-7-7m7 7-7 7\"><\/path><\/svg>\n      <\/div>\n      <div class=\"step reveal\">\n        <div class=\"idx\">2<\/div>\n        <h3>Put it on the chip<\/h3>\n        <p>Log in to the registry where your pet's chip is registered and set your iCanCall number as the phone number. Add it to the collar tag too.<\/p>\n        <svg class=\"step-arrow\" width=\"60\" height=\"24\" viewBox=\"0 0 60 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M0 12h54m0 0-7-7m7 7-7 7\"><\/path><\/svg>\n      <\/div>\n      <div class=\"step reveal\">\n        <div class=\"idx\">3<\/div>\n        <h3>Add up to six contacts<\/h3>\n        <p>You, your partner, a neighbor, the dog walker. When someone calls, they hear your lost-pet greeting and use the caller menu to pick who to reach.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== SCENARIOS ============== -->\n<section class=\"section\" id=\"scenes\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Wherever they turn up<\/span>\n      <h2>The same number works wherever your pet is found.<\/h2>\n      <p class=\"lead\">Shelters, vets and neighbors all reach you the same way: one number, from any phone.<\/p>\n    <\/div>\n    <div class=\"scenes\">\n      <div class=\"scene reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m3 10 9-6 9 6\"><\/path><path d=\"M5 9v11h14V9\"><\/path><path d=\"M9 20v-6h6v6\"><\/path><\/svg><\/div>\n        <h3>Scanned at a shelter<\/h3>\n        <p>Staff scan the chip, call the number, and hear your lost-pet greeting straight away.<\/p>\n      <\/div>\n      <div class=\"scene reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"><\/path><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"4\"><\/rect><\/svg><\/div>\n        <h3>Scanned at a vet<\/h3>\n        <p>A vet clinic checks the chip and calls you directly, without searching for old records.<\/p>\n      <\/div>\n      <div class=\"scene reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"8\" r=\"3\"><\/circle><path d=\"M3 20a6 6 0 0 1 12 0\"><\/path><circle cx=\"17\" cy=\"9\" r=\"2.4\"><\/circle><path d=\"M16 14.5a5 5 0 0 1 5 5\"><\/path><\/svg><\/div>\n        <h3>Found by a neighbor<\/h3>\n        <p>They read the number on the collar tag and call. The caller menu gets them to whoever is free.<\/p>\n      <\/div>\n      <div class=\"scene reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0Z\"><\/path><circle cx=\"12\" cy=\"10\" r=\"3\"><\/circle><\/svg><\/div>\n        <h3>After you move<\/h3>\n        <p>New phone or new city? Update your contacts in the dashboard. The chip never needs touching.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== INTERACTIVE CALLER MENU ============== -->\n<section class=\"section tint-band\" id=\"build\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Try it yourself<\/span>\n      <h2>Try the caller menu a finder will hear.<\/h2>\n      <p class=\"lead\">Add the people who should hear about your pet, set their order, then place a pretend call. The finder hears your lost-pet greeting and presses a number to reach someone.<\/p>\n    <\/div>\n    <div class=\"builder reveal\">\n      <!-- editor -->\n      <div class=\"builder-panel\">\n        <div class=\"builder-head\">\n          <h3>Your pet's contacts<\/h3>\n          <span class=\"count\"><span id=\"ccount\">0<\/span>/6 contacts<\/span>\n        <\/div>\n        <div id=\"circle-list\" class=\"circle-list\"><\/div>\n        <form id=\"add-form\" class=\"add-form\" autocomplete=\"off\">\n          <input id=\"add-name\" type=\"text\" placeholder=\"Name\" maxlength=\"22\" required=\"\">\n          <input id=\"add-rel\" type=\"text\" placeholder=\"Relationship\" maxlength=\"22\">\n          <button class=\"btn btn-primary add-btn\" type=\"submit\" aria-label=\"Add contact\" title=\"Add contact\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg>\n          <\/button>\n        <\/form>\n      <\/div>\n      <!-- simulator -->\n      <div class=\"sim-panel\">\n        <div class=\"sim-screen\" id=\"sim-screen\">\n          <span class=\"num-line\">(415) 200-PAWS<\/span>\n          <div class=\"sim-avatar\" id=\"sim-avatar\">—<\/div>\n          <div class=\"sim-name\" id=\"sim-name\">Caller menu<\/div>\n          <div class=\"sim-state\" id=\"sim-state\">Place a call to hear the options<\/div>\n          <div class=\"sim-dots\" id=\"sim-dots\"><\/div>\n        <\/div>\n        <button class=\"btn btn-primary\" id=\"place-call\">\n          <svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n          Place a call\n        <\/button>\n        <p class=\"sim-hint\">Callers pick who to reach. Flip a contact to “Busy” to send them to voicemail.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== FEATURES ============== -->\n<section class=\"section\" id=\"features\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Why pet owners choose iCanCall<\/span>\n      <h2>Built so a found pet always finds its way home.<\/h2>\n    <\/div>\n    <div class=\"features\">\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 8v4M12 16h.01\"><\/path><\/svg><\/div>\n        <h3>A number that never goes stale<\/h3>\n        <p>Change phones, move house, add a pet sitter. Update the dashboard and the chip keeps working.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v4a2 2 0 0 1-2.2 2A16 16 0 0 1 3 6.2 2 2 0 0 1 5 4Z\"><\/path><\/svg><\/div>\n        <h3>A greeting made for finders<\/h3>\n        <p>Every call starts with your lost-pet message, so shelters and neighbors know they have reached the right place.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 18a4 4 0 0 0-8 0\"><\/path><circle cx=\"12\" cy=\"9\" r=\"3.5\"><\/circle><path d=\"M5 20a7 7 0 0 1 14 0\"><\/path><\/svg><\/div>\n        <h3>A caller menu for six contacts<\/h3>\n        <p>Finders press a number to reach you, your partner, a neighbor or the dog walker, in the order you choose.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16v11H7l-3 3V5Z\"><\/path><path d=\"M8 9h8M8 12h5\"><\/path><\/svg><\/div>\n        <h3>You hear about it right away<\/h3>\n        <p>If nobody picks up, the caller leaves a voicemail and you get a text and an email straight away.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 7v5l3 2\"><\/path><\/svg><\/div>\n        <h3>Held for 6 months if you lapse<\/h3>\n        <p>Miss a renewal and we keep your number for 6 months, still ringing your main contact, so the chip keeps working.<\/p>\n      <\/div>\n      <div class=\"feature reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"11\" rx=\"2\"><\/rect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\/path><\/svg><\/div>\n        <h3>Your numbers stay private<\/h3>\n        <p>Finders only ever see your iCanCall number, never your personal phone numbers.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== PRICING ============== -->\n<section class=\"section tint-band\" id=\"pricing\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Simple, honest pricing<\/span>\n      <h2>Less than $2.50 a month, paid once a year.<\/h2>\n      <p class=\"lead\">Pay once a year, or once for your pet's whole life. There are no monthly plans and no setup fees.<\/p>\n    <\/div>\n\n    <div class=\"pricing two\">\n      <div class=\"plan reveal\">\n        <h3>Annual<\/h3>\n        <p class=\"desc\">One lost-pet number for every pet in your home.<\/p>\n        <div class=\"price\"><b class=\"amt\">$29<\/b><span class=\"per\">/ year<\/span><\/div>\n        <p class=\"price-yr\">Billed once a year<\/p>\n        <ul>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> 1 dedicated lost-pet number<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Caller menu with up to 6 contacts<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Lost-pet greeting on every call<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Voicemail with text and email alerts<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> 30 minutes of calls per year<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Incoming calls only<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Works with any microchip registry<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Number held 6 months if your plan lapses<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> 14-day service guarantee<\/li>\n        <\/ul>\n        <a class=\"btn btn-ghost plan-select\" href=\"#join\">Join the launch list<\/a>\n      <\/div>\n      <div class=\"plan featured reveal\">\n        <span class=\"tag\">Pay once<\/span>\n        <h3>Lifetime<\/h3>\n        <p class=\"desc\">One payment for one pet's whole life.<\/p>\n        <div class=\"price\"><b class=\"amt\">$249<\/b><span class=\"per\">one time<\/span><\/div>\n        <p class=\"price-yr\">For your pet's life, up to 20 years<\/p>\n        <ul>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Everything in Annual, for one enrolled pet<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Covers your pet's life, up to 20 years<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> No yearly renewals<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> A yearly check-in email keeps the line active<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> 14-day service guarantee<\/li>\n        <\/ul>\n        <a class=\"btn btn-primary plan-select\" href=\"#join\">Join the launch list<\/a>\n      <\/div>\n    <\/div>\n    <p class=\"terms-note\">Lifetime, Small Bird Lifetime and Parrot plans cover one enrolled pet. Lifetime plans last for the life of the enrolled pet or 20 years from purchase, whichever comes first. Each year we email you to confirm the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line. Prices are in US dollars.<\/p>\n\n    <div class=\"join reveal\" id=\"join\">\n      <h3>Pet plans open soon.<\/h3>\n      <p>Join the launch list and we'll email you the day sign-up opens.<\/p>\n      <form class=\"join-form\" id=\"join-form\" novalidate>\n        <input type=\"email\" name=\"email\" placeholder=\"Your email address\" aria-label=\"Email address\" autocomplete=\"email\" required>\n        <button class=\"btn btn-primary\" type=\"submit\">Join the launch list<\/button>\n      <\/form>\n      <p class=\"join-msg\" id=\"join-msg\" role=\"status\" aria-live=\"polite\"><\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== PARROTS ============== -->\n<section class=\"section\" id=\"parrots\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">Parrots and other birds<\/span>\n      <h2>Built for birds that live for decades.<\/h2>\n      <p class=\"lead\">A budgie might live ten years. A macaw can live eighty. iCanCall Pets has plans for every size of bird, and a way to pass the line on when a parrot changes homes.<\/p>\n    <\/div>\n    <div class=\"scenes\">\n      <div class=\"scene reveal\">\n        <h3>Budgie, lovebird, parrotlet<\/h3>\n        <p>Typically 5 to 15 years.<\/p>\n        <span class=\"fit\">Small Bird Lifetime<\/span>\n      <\/div>\n      <div class=\"scene reveal\">\n        <h3>Cockatiel<\/h3>\n        <p>Typically 15 to 25 years.<\/p>\n        <span class=\"fit\">Small Bird Lifetime<\/span>\n      <\/div>\n      <div class=\"scene reveal\">\n        <h3>African grey, Amazon, cockatoo<\/h3>\n        <p>Typically 40 to 70 years.<\/p>\n        <span class=\"fit long\">Parrot 10-Year or 20-Year<\/span>\n      <\/div>\n      <div class=\"scene reveal\">\n        <h3>Macaw<\/h3>\n        <p>Typically 50 to 80 years.<\/p>\n        <span class=\"fit long\">Parrot 10-Year or 20-Year<\/span>\n      <\/div>\n    <\/div>\n\n    <div class=\"successor reveal\">\n      <div>\n        <span class=\"eyebrow\">Name a successor<\/span>\n        <h3>When your parrot changes homes, the number goes too.<\/h3>\n        <p>Parrots often outlive their owners or move to new homes. Name a backup person, like a family member or a bird rescue, who takes over the line if you can no longer care for your bird.<\/p>\n        <p class=\"aside\">Not every bird has a microchip. Put the number on a cage tag, travel carrier and rescue paperwork too.<\/p>\n      <\/div>\n      <ul>\n        <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> The line moves to the new owner for free<\/li>\n        <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Any prepaid time moves with it<\/li>\n        <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> The number on the chip and paperwork stays the same<\/li>\n        <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> As many moves as your bird needs<\/li>\n      <\/ul>\n    <\/div>\n\n    <div class=\"pricing\">\n      <div class=\"plan reveal\">\n        <h3>Small Bird Lifetime<\/h3>\n        <p class=\"desc\">Budgies, lovebirds, parrotlets and cockatiels.<\/p>\n        <div class=\"price\"><b class=\"amt\">$249<\/b><span class=\"per\">one time<\/span><\/div>\n        <p class=\"price-yr\">For your bird's life, up to 20 years<\/p>\n        <ul>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Everything in Annual, for one bird<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> No yearly renewals<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Named successor, free transfers<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> 14-day service guarantee<\/li>\n        <\/ul>\n        <a class=\"btn btn-ghost plan-select\" href=\"#join\">Join the launch list<\/a>\n      <\/div>\n      <div class=\"plan featured reveal\">\n        <span class=\"tag\">Large parrots<\/span>\n        <h3>Parrot 10-Year<\/h3>\n        <p class=\"desc\">African greys, Amazons, cockatoos and macaws.<\/p>\n        <div class=\"price\"><b class=\"amt\">$179<\/b><span class=\"per\">one time<\/span><\/div>\n        <p class=\"price-yr\">10 years of service, then renew<\/p>\n        <ul>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Everything in Annual, for one bird<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> 10 years prepaid<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Renews at the price in effect at renewal<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Named successor, free transfers<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> 14-day service guarantee<\/li>\n        <\/ul>\n        <a class=\"btn btn-primary plan-select\" href=\"#join\">Join the launch list<\/a>\n      <\/div>\n      <div class=\"plan reveal\">\n        <h3>Parrot 20-Year<\/h3>\n        <p class=\"desc\">The longest cover for long-lived parrots.<\/p>\n        <div class=\"price\"><b class=\"amt\">$349<\/b><span class=\"per\">one time<\/span><\/div>\n        <p class=\"price-yr\">20 years of service, then renew<\/p>\n        <ul>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Everything in Annual, for one bird<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> 20 years prepaid<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Renews at the price in effect at renewal<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> Named successor, free transfers<\/li>\n          <li><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\/path><\/svg> 14-day service guarantee<\/li>\n        <\/ul>\n        <a class=\"btn btn-ghost plan-select\" href=\"#join\">Join the launch list<\/a>\n      <\/div>\n    <\/div>\n    <p class=\"terms-note\">Any bird can also use the $29 Annual plan.<\/p>\n  <\/div>\n<\/section>\n\n<!-- ============== FAQ ============== -->\n<section class=\"section tint-band\" id=\"faq\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Questions, answered<\/span>\n      <h2>What pet owners ask us most.<\/h2>\n    <\/div>\n    <div class=\"faq reveal\">\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Do I need a new microchip?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>No. Your pet keeps the chip it has. Log in to the registry where the chip is registered and change the phone number to your iCanCall number. After that, you never need to update the registry again.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">What happens when someone calls the number?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>They hear your lost-pet greeting, then a caller menu with up to six contacts. They press a number to reach the person they want, and the call connects straight through.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">What if nobody picks up?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>The caller can leave a voicemail, and you get a text and an email straight away so you can call them back.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Can one number cover all my pets?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Yes, on the Annual plan. Every chip in your home can carry the same number. Lifetime and Parrot plans cover one enrolled pet each.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Why 30 minutes a year, and incoming calls only?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>A lost-pet line gets a few short calls a year, so 30 minutes is plenty. The line only takes incoming calls and always plays your lost-pet greeting, which keeps the price low. We email you if you get close to the limit.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">What happens if my Annual plan lapses?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>We hold your number for 6 months. During that time, callers hear a short message that the plan has lapsed, and the call still rings your main contact. We email you before the number is released so you can renew or update your microchip registry.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">How does the Lifetime plan work?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>You pay once and the line covers one enrolled pet for its life, or 20 years from purchase, whichever comes first. Once a year we email you to check the line is still needed. If two years pass with no reply and no calls, we send a final notice and then close the line.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">What happens if my parrot outlives me?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Name a successor, like a family member or a bird rescue. If you can no longer care for your bird, the line moves to them for free, along with any prepaid time. The number on the chip and paperwork stays the same.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== FINAL CTA ============== -->\n<section class=\"section cta-band\" id=\"cta\">\n  <div class=\"wrap\">\n    <div class=\"cta-card reveal\">\n      <h2>Put a number on the chip that keeps up with you.<\/h2>\n      <p>Pet plans open soon. Join the launch list and we'll email you the day sign-up opens.<\/p>\n      <div class=\"actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"#join\">Join the launch list<\/a>\n        <a class=\"btn btn-ghost btn-lg\" href=\"#how\" style=\"color:#fff;border-color:oklch(1 0 0 / 0.5)\">See how it works<\/a>\n      <\/div>\n      <p class=\"fine\">Annual or lifetime · Works with any microchip registry · 14-day service guarantee<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\/main>\n\n<!-- ============== FOOTER ============== -->\n<footer class=\"footer\">\n  <div class=\"wrap\">\n    <div class=\"footer-grid\">\n      <div>\n        <a class=\"brand\" href=\"/\">\n      <svg class=\"logo-main\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 553.0305\" style=\"height: 40px; width: auto; display: block;\">\n        <style>\n          .logo-main .cls-1 { fill: #1c2530; }\n          .logo-main .cls-2 { fill: #4083ae; }\n          .logo-main .cls-3 { fill: #fff; }\n        <\/style>\n        <g>\n          <path class=\"cls-1\" d=\"M707.4397,239.6996l-.4398-.6591c-31.0327-46.2476-71.4038-97.0542-117.1563-115.2897-5.2177-2.4717-6.9757-4.9985-2.5277-9.777,4.9441-5.1081,11.2601-11.0948,14.6112-17.796,20.8722-36.6356-8.074-84.4763-50.1482-82.2791-44.1058.769-68.9324,53.1134-43.0062,88.0463,4.1744,6.7561,14.6648,13.4569,16.3129,17.4664.8783,2.3621-.2749,3.9548-2.6913,5.8225-22.9037,11.9189-41.9093,33.4498-63.4398,49.1585-24.9366,18.51-48.3902.5495-73.1069-12.9625-9.777-4.6686-13.7865-8.4035-5.9311-18.8946,20.4873-28.2321-1.3195-70.5248-36.9651-68.438-25.7064.5495-45.2603,25.0466-40.866,50.0929.7147,4.449,2.0879,8.788,4.1744,12.7975,3.7896,8.0743,12.0285,14.226,11.8649,18.8946-.3299,6.0421-9.5584,9.1179-16.8077,15.2146-26.2548,20.4323-47.7867,57.5624-82.9938,31.088-4.7779-3.0758-9.9969-6.5362-14.8847-9.5571-4.6679-3.2404-8.6238-4.8335-9.2272-9.7767-.1649-4.6689,6.9757-11.3697,9.0623-19.7186,8.019-24.7167-16.1479-50.477-41.4694-43.5013-19.1142,4.1195-30.9227,25.7603-24.6617,44.2704,1.868,8.074,10.8752,16.4228,12.5
