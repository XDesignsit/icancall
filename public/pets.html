ido de varios seres queridos, con espacio para un segundo cuidador.\",\n      \"Just $12.42/mo, billed annually\": \"Solo $12.42/mes, facturado anualmente\",\n      \"Just $20.75/mo, billed annually\": \"Solo $20.75/mes, facturado anualmente\",\n      \"Just $41.58/mo, billed annually\": \"Solo $41.58/mes, facturado anualmente\",\n      \"1 Dedicated Safety Number\": \"1 número de seguridad exclusivo\",\n      \"Up to 3 Roster Contacts\": \"Hasta 3 contactos de confianza\",\n      \"Call Cascade (Sequential)\": \"Llamada en cascada (secuencial)\",\n      \"Real-time Email Alerts\": \"Alertas por correo en tiempo real\",\n      \"Standard voicemail box\": \"Buzón de voz estándar\",\n      \"14-day service guarantee\": \"Garantía de servicio de 14 días\",\n      \"2 Dedicated Safety Numbers\": \"2 números de seguridad exclusivos\",\n      \"Up to 6 Roster Contacts\": \"Hasta 6 contactos de confianza\",\n      \"Cascade & Caller Menu (IVR)\": \"Cascada y menú de llamadas (IVR)\",\n      \"Time-of-day Scheduling\": \"Programación por horarios\",\n      \"Bilingual Greeting Options\": \"Saludos en dos idiomas\",\n      \"Instant Voicemail Email Transcriptions\": \"Transcripciones instantáneas del buzón por correo\",\n      \"5 Dedicated Safety Numbers\": \"5 números de seguridad exclusivos\",\n      \"Up to 15 Roster Contacts per Number\": \"Hasta 15 contactos de confianza por número\",\n      \"All Routing Modes + Scheduling\": \"Todos los modos de enrutamiento + horarios\",\n      \"150 pooled voice minutes\": \"150 minutos de voz compartidos\",\n      \"2 Caregiver Logins\": \"2 accesos para cuidadores\",\n      \"All plans include cascade routing, the caller menu, and 24/7 reliability. Set it up for your parent in minutes — cancel anytime.\": \"Todos los planes incluyen llamada en cascada, el menú de llamadas y fiabilidad 24/7. Configúrelo para su padre o madre en minutos — cancele cuando quiera.\",\n      \"All plans include cascade routing, the caller menu, and 24/7 reliability. Set it up in minutes — cancel anytime.\": \"Todos los planes incluyen llamada en cascada, el menú de llamadas y fiabilidad 24/7. Configúrelo en minutos — cancele cuando quiera.\",\n      \"All plans include cascade routing, the caller menu, time-aware coverage, and 24/7 reliability. Cancel anytime.\": \"Todos los planes incluyen llamada en cascada, el menú de llamadas, cobertura según el horario y fiabilidad 24/7. Cancele cuando quiera.\",\n      \"Designed for the moments that matter\": \"Diseñado para los momentos importantes\",\n      \"iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.\": \"iCanCall se adapta de manera única a las familias que necesitan una comunicación de seguridad simple y libre de pantallas.\",\n      \"For Kids\": \"Para Niños\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"Permite a los niños comunicarse con la familia desde cualquier teléfono de casa, sin las distracciones de un smartphone.\",\n      \"For Seniors\": \"Para Personas Mayores\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"Una línea de vida para padres o abuelos. Solo tienen que recordar un número para comunicarse con toda la familia.\",\n      \"For Special Needs\": \"Para Necesidades Especiales\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"Simplifica la comunicación para personas con dificultades cognitivas o físicas, dándoles acceso directo a apoyo.\",\n      \"One number\": \"Un solo número\",\n      \"Build the circle\": \"Arme el círculo\",\n      \"Questions\": \"Preguntas\",\n      \"For parents of young children\": \"Para padres de niños pequeños\",\n      \"they'll never forget.\": \"que nunca olvidarán.\",\n      \"Little ones can't memorize a whole contact list — but they can learn one number. iCanCall turns that single number into the entire family: it rings you, then your partner, then Grandma, then a trusted neighbor, until someone who loves them picks up.\": \"Los más pequeños no pueden memorizar toda una lista de contactos — pero sí pueden aprenderse un número. iCanCall convierte ese único número en toda la familia: lo llama a usted, luego a su pareja, luego a la abuela, luego a un vecino de confianza, hasta que contesta alguien que los quiere.\",\n      \"No phone of their own required.\": \"No necesitan teléfono propio.\",\n      \"They can call from a friend's house, the school office, or any phone — and still reach family in seconds.\": \"Pueden llamar desde la casa de un amigo, la oficina de la escuela o cualquier teléfono — y aun así comunicarse con la familia en segundos.\",\n      \"Emma's iCanCall number\": \"Número iCanCall de Emma\",\n      \"Incoming call\": \"Llamada entrante\",\n      \"She dials one number — it finds a grown-up she knows, in order, until someone answers\": \"Ella marca un solo número — y este busca a un adulto que conoce, en orden, hasta que alguien contesta\",\n      \"Mom\": \"Mamá\",\n      \"Mobile\": \"Celular\",\n      \"Standing by\": \"En espera\",\n      \"Dad\": \"Papá\",\n      \"Grandma Rose\": \"Abuela Rose\",\n      \"Grandparent\": \"Abuela\",\n      \"Neighbor\": \"Vecino\",\n      \"Made for little hands and big worries\": \"Hecho para manos pequeñas y preocupaciones grandes\",\n      \"number to memorize\": \"número que memorizar\",\n      \"grown-ups it can reach\": \"adultos a los que puede llegar\",\n      \"apps or phones needed\": \"apps o teléfonos necesarios\",\n      \"Any\": \"Cualquier\",\n      \"phone, anywhere\": \"teléfono, en cualquier lugar\",\n      \"The whole lesson\": \"Toda la lección\",\n      \"One number is all they have to learn.\": \"Un número es todo lo que tienen que aprender.\",\n      \"Ask a five-year-old to remember Mom's cell, Dad's cell, Grandma's house, and the neighbor next door, and you'll lose them at \\\"cell.\\\" iCanCall replaces the whole list with a single number — and quietly does the rest.\": \"Pídale a un niño de cinco años que recuerde el celular de mamá, el celular de papá, la casa de la abuela y al vecino de al lado, y lo habrá perdido en “celular”. iCanCall reemplaza toda la lista con un solo número — y discretamente se encarga del resto.\",\n      \"The old way\": \"La forma de antes\",\n      \"A list no child can hold\": \"Una lista que ningún niño puede retener\",\n      \"Too many numbers, scribbled on the fridge — and never the right one in the moment that counts.\": \"Demasiados números, garabateados en el refrigerador — y nunca el correcto en el momento que cuenta.\",\n      \"Mom — cell\": \"Mamá — celular\",\n      \"Dad — work\": \"Papá — trabajo\",\n      \"\\\"Which one do I call if you don't answer?\\\"\": \"“¿A cuál llamo si no contestas?”\",\n      \"With iCanCall\": \"Con iCanCall\",\n      \"One number, every grown-up\": \"Un número, todos los adultos\",\n      \"They learn it like a nursery rhyme. It finds whoever's available — you don't have to be the one who picks up.\": \"Se lo aprenden como una canción infantil. Encuentra a quien esté disponible — no tiene que ser usted quien conteste.\",\n      \"Our family number\": \"Nuestro número familiar\",\n      \"\\\"If you ever need us, call this. Someone will always answer.\\\"\": \"“Si alguna vez nos necesitas, llama a este número. Siempre habrá alguien que conteste.”\",\n      \"Set it up once. Teach it once.\": \"Configúrelo una vez. Enséñelo una vez.\",\n      \"A few minutes of setup buys years of \\\"I can always reach a grown-up.\\\"\": \"Unos minutos de configuración valen años de “siempre puedo comunicarme con un adulto”.\",\n      \"Claim your family number\": \"Reserve su número familiar\",\n      \"Pick one easy-to-remember iCanCall number. Put it on a backpack tag, a lunchbox card, and the classroom contact card — the only number your child needs anywhere they go.\": \"Elija un número iCanCall fácil de recordar. Póngalo en una etiqueta de la mochila, en una tarjeta de la lonchera y en la ficha de contacto del salón de clases — el único número que su hijo necesita dondequiera que vaya.\",\n      \"Add the grown-ups\": \"Agregue a los adultos\",\n      \"You, your partner, grandparents, a babysitter, a trusted neighbor — up to six people, in the order you want them reached. Adjust anytime from your phone.\": \"Usted, su pareja, los abuelos, una niñera, un vecino de confianza — hasta seis personas, en el orden en que quiere que se les llame. Ajústelo cuando quiera desde su teléfono.\",\n      \"Teach them the number\": \"Enséñeles el número\",\n      \"That's the whole job for them. When they call, iCanCall\": \"Esa es toda su tarea. Cuando llaman, iCanCall\",\n      \"cascades\": \"llama en cascada\",\n      \"through the circle until someone answers — and every grown-up gets a text that the call came in.\": \"a todo el círculo hasta que alguien contesta — y cada adulto recibe un mensaje de texto avisando que entró la llamada.\",\n      \"Wherever they are\": \"Dondequiera que estén\",\n      \"The same number works\": \"El mismo número funciona\",\n      \"everywhere life happens.\": \"dondequiera que transcurra la vida.\",\n      \"No phone of their own? No problem. One number reaches family from any phone they can get to.\": \"¿No tienen teléfono propio? No hay problema. Un solo número los comunica con la familia desde cualquier teléfono que tengan a mano.\",\n      \"Home after school\": \"En casa después de la escuela\",\n      \"Beat you home? One call lets them check in and reach whoever's free — you, Grandma, or the neighbor.\": \"¿Llegaron a casa antes que usted? Con una llamada avisan que llegaron y se comunican con quien esté libre — usted, la abuela o el vecino.\",\n      \"At a friend's house\": \"En casa de un amigo\",\n      \"From a friend's landline or a parent's phone, the one number still finds your family — no contacts to look up.\": \"Desde el teléfono fijo de un amigo o el celular de otro papá o mamá, el mismo número encuentra a su familia — sin contactos que buscar.\",\n      \"Lost at the store\": \"Perdidos en la tienda\",\n      \"A clerk or another grown-up can dial the number with them, and a familiar voice answers right away.\": \"Un empleado u otro adulto puede marcar el número con ellos, y una voz conocida contesta de inmediato.\",\n      \"When plans change\": \"Cuando cambian los planes\",\n      \"Practice ran late or pickup got moved? One call routes to whoever can come — no scramble, no guessing.\": \"¿El entrenamiento se alargó o cambió la hora de recogida? Una llamada llega a quien pueda ir — sin carreras ni adivinanzas.\",\n      \"Try it yourself\": \"Pruébelo usted mismo\",\n      \"Build the circle that answers for your child.\": \"Arme el círculo que le contesta a su hijo.\",\n      \"Add the grown-ups you trust, set their order, then place a pretend call. Choose\": \"Agregue a los adultos de su confianza, defina el orden y haga una llamada de prueba. Elija\",\n      \"cascade\": \"cascada\",\n      \"— ring everyone in turn until someone picks up — or a simple\": \"— llama a todos por turno hasta que alguien contesta — o un sencillo\",\n      \"caller menu\": \"menú de llamadas\",\n      \". Your child only ever dials one number.\": \". Su hijo solo marca un número.\",\n      \"Routing mode\": \"Modo de enrutamiento\",\n      \"Call cascade\": \"Llamada en cascada\",\n      \"Caller menu\": \"Menú de llamadas\",\n      \"You set this once in the dashboard\": \"Esto se configura una sola vez en el panel de control\",\n      \"Your child's circle\": \"El círculo de su hijo\",\n      \"/6 contacts\": \"/6 contactos\",\n      \"Ready\": \"Listo\",\n      \"Press call to start routing\": \"Presione llamar para iniciar el enrutamiento\",\n      \"Place a call\": \"Hacer una llamada\",\n      \"Toggle contacts to \\\"Busy\\\" to see the cascade skip ahead.\": \"Marque contactos como “Ocupado” para ver cómo la cascada pasa al siguiente.\",\n      \"Why parents choose iCanCall\": \"Por qué los padres eligen iCanCall\",\n      \"Built so they always reach\": \"Creado para que siempre encuentren\",\n      \"someone who loves them.\": \"a alguien que los quiere.\",\n      \"One number to memorize\": \"Un solo número que memorizar\",\n      \"Children learn a single number instead of a fragile list. It's the only one they'll ever need to reach the whole family.\": \"Los niños se aprenden un solo número en lugar de una lista frágil. Es el único que van a necesitar para comunicarse con toda la familia.\",\n      \"No phone of their own\": \"Sin teléfono propio\",\n      \"Works from any phone — a friend's, a teacher's, a landline. Your child doesn't need a device to reach you.\": \"Funciona desde cualquier teléfono — el de un amigo, el de una maestra, un teléfono fijo. Su hijo no necesita un dispositivo para comunicarse con usted.\",\n      \"Someone always answers\": \"Siempre contesta alguien\",\n      \"If you're busy, the call rolls to your partner, then a grandparent, then a trusted neighbor — until a familiar voice picks up.\": \"Si usted está ocupado, la llamada pasa a su pareja, luego a un abuelo, luego a un vecino de confianza — hasta que contesta una voz conocida.\",\n      \"You always know\": \"Usted siempre lo sabe\",\n      \"Every grown-up in the circle gets a text the moment your child calls — so you're never the last to find out.\": \"Cada adulto del círculo recibe un mensaje de texto en cuanto su hijo llama — así usted nunca es el último en enterarse.\",\n      \"Different by time of day\": \"Distinto según la hora del día\",\n      \"Route to the babysitter after school and to you in the evening — automatically, so the right grown-up always answers.\": \"Dirija las llamadas a la niñera después de la escuela y a usted por la noche — automáticamente, para que siempre conteste el adulto indicado.\",\n      \"Private & protected\": \"Privado y protegido\",\n      \"Everyone's real numbers stay hidden behind your single iCanCall line. All routing is encrypted, and your data is never sold.\": \"Los números reales de todos quedan ocultos detrás de su única línea iCanCall. Todo el enrutamiento está cifrado y sus datos nunca se venden.\",\n      \"Simple, honest pricing\": \"Precios simples y honestos\",\n      \"Peace of mind, less than a phone bill.\": \"Tranquilidad por menos que una factura de teléfono.\",\n      \"/ month\": \"/ mes\",\n      \"What parents ask us most.\": \"Lo que más nos preguntan los padres.\",\n      \"Does my child need their own phone?\": \"¿Mi hijo necesita su propio teléfono?\",\n      \"No. That's the whole idea. iCanCall is one number that works from\": \"No. Esa es justamente la idea. iCanCall es un solo número que funciona desde\",\n      \"any\": \"cualquier\",\n      \"phone — a friend's house, the school office, a neighbor's landline. Your child just needs to know the number, and a familiar grown-up answers.\": \"teléfono — la casa de un amigo, la oficina de la escuela, el teléfono fijo de un vecino. Su hijo solo necesita saberse el número, y un adulto conocido contesta.\",\n      \"Isn't one number too simple for something urgent?\": \"¿Un solo número no es demasiado simple para algo urgente?\",\n      \"Simple is exactly what works under stress. One number rings each grown-up in your circle in order until someone picks up — so a child who's scared or hurt never has to decide\": \"Lo simple es justo lo que funciona bajo estrés. Un solo número llama a cada adulto de su círculo, en orden, hasta que alguien contesta — para que un niño asustado o lastimado nunca tenga que decidir\",\n      \"who\": \"a quién\",\n      \"to call. (iCanCall is for reaching family quickly; for life-threatening emergencies, always teach your child to call 911 too.)\": \"llamar. (iCanCall es para comunicarse rápido con la familia; para emergencias que pongan en riesgo la vida, enséñele siempre a su hijo a llamar también al 911.)\",\n      \"What if I'm busy and can't pick up?\": \"¿Y si estoy ocupado y no puedo contestar?\",\n      \"The call simply rolls to the next grown-up — your partner, then a grandparent, then a trusted neighbor — until someone answers. Everyone in the circle also gets a text that your child called, so you'll know the moment you're free.\": \"La llamada simplemente pasa al siguiente adulto — su pareja, luego un abuelo, luego un vecino de confianza — hasta que alguien contesta. Todos en el círculo reciben además un mensaje de texto avisando que su hijo llamó, así que usted lo sabrá en cuanto esté libre.\",\n      \"Can I change who's in the circle, or the order?\": \"¿Puedo cambiar quién está en el círculo, o el orden?\",\n      \"Anytime, in seconds, from your dashboard. Add the new babysitter, drop a contact, or reorder who's reached first. Changes take effect on the very next call.\": \"Cuando quiera, en segundos, desde su panel de control. Agregue a la nueva niñera, quite un contacto o reordene a quién se llama primero. Los cambios se aplican desde la siguiente llamada.\",\n      \"Will strangers see our family's phone numbers?\": \"¿Verán personas desconocidas los números de teléfono de nuestra familia?\",\n      \"Never. Everyone's personal numbers stay hidden behind your single iCanCall line. All routing is encrypted, and we never sell your data.\": \"Nunca. Los números personales de todos quedan ocultos detrás de su única línea iCanCall. Todo el enrutamiento está cifrado y nunca vendemos sus datos.\",\n      \"How do I help my child remember the number?\": \"¿Cómo ayudo a mi hijo a recordar el número?\",\n      \"Most families turn it into a little rhyme or song and practice a \\\"pretend call\\\" together. Put it on a backpack tag and the school contact form, and within a week it sticks — because it's the only number they have to know.\": \"La mayoría de las familias lo convierten en una rima o cancioncita y practican juntos una “llamada de mentiritas”. Póngalo en una etiqueta de la mochila y en el formulario de contacto de la escuela, y en una semana se les queda grabado — porque es el único número que tienen que saber.\",\n      \"Give them one number. Give yourself peace of mind.\": \"Deles un solo número. Dese tranquilidad a usted.\",\n      \"In a few minutes, your child will have a single number that always reaches a grown-up who loves them — from any phone, anywhere. No device, no contact list, no guessing.\": \"En pocos minutos, su hijo tendrá un solo número que siempre lo comunica con un adulto que lo quiere — desde cualquier teléfono, en cualquier lugar. Sin dispositivo, sin lista de contactos, sin adivinanzas.\",\n      \"One memorable number that always connects your child to a grown-up who loves them — from any phone, anywhere.\": \"Un número memorable que siempre conecta a su hijo con un adulto que lo quiere — desde cualquier teléfono, en cualquier lugar.\",\n      \"For every family\": \"Para cada familia\",\n      \"iCanCall, Inc. All rights reserved.\": \"iCanCall, Inc. Todos los derechos reservados.\"\n    },\n    \"attrs\": {\n      \"Name\": \"Nombre\",\n      \"Relationship\": \"Relación\"\n    }\n  },\n  \"fr\": {\n    \"text\": {\n      \"How it works\": \"Comment ça marche\",\n      \"Features\": \"Fonctionnalités\",\n      \"Who it's for\": \"Pour qui\",\n      \"Pricing\": \"Tarifs\",\n      \"FAQ\": \"FAQ\",\n      \"Login\": \"Connexion\",\n      \"See how it works\": \"Voir le fonctionnement\",\n      \"Select a Plan\": \"Choisir un forfait\",\n      \"See How We Compare\": \"Découvrez notre comparatif\",\n      \"Comparison Chart\": \"Tableau comparatif\",\n      \"Key:\": \"Légende :\",\n      \"Included\": \"Inclus\",\n      \"Not available\": \"Non disponible\",\n      \"Limited or conditional\": \"Limité ou conditionnel\",\n      \"Pro s d'appel mutualisées\",\n      \"2 Caregiver Logins\": \"2 accès aidants\",\n      \"All plans include cascade routing, the caller menu, and 24/7 reliability. Set it up for your parent in minutes — cancel anytime.\": \"Tous les forfaits incluent l'appel en cascade, le menu vocal et une fiabilité 24h/24 et 7j/7. Configurez-le pour votre parent en quelques minutes — sans engagement.\",\n      \"All plans include cascade routing, the caller menu, and 24/7 reliability. Set it up in minutes — cancel anytime.\": \"Tous les forfaits incluent l'appel en cascade, le menu vocal et une fiabilité 24h/24 et 7j/7. Configuration en quelques minutes — sans engagement.\",\n      \"All plans include cascade routing, the caller menu, time-aware coverage, and 24/7 reliability. Cancel anytime.\": \"Tous les forfaits incluent l'appel en cascade, le menu vocal, une couverture selon les plages horaires et une fiabilité 24h/24 et 7j/7. Sans engagement.\",\n      \"Designed for the moments that matter\": \"Conçu pour les moments qui comptent\",\n      \"iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.\": \"iCanCall s'intègre parfaitement dans la vie des familles nécessitant une communication de sécurité simple et sans écran.\",\n      \"For Kids\": \"Pour les enfants\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"Permettez aux enfants de joindre leur famille depuis n'importe quel téléphone, sans les distractions d'un smartphone.\",\n      \"For Seniors\": \"Pour les aînés\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"Une bouée de sauvetage pour parents ou grands-parents. Un seul numéro à retenir pour joindre toute la famille.\",\n      \"For Special Needs\": \"Besoins Spécifiques\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"Simplifie la communication pour les personnes ayant des déficiences cognitives ou physiques, leur donnant un accès direct au soutien.\",\n      \"One number\": \"Un seul numéro\",\n      \"Build the circle\": \"Composez le cercle\",\n      \"For parents of young children\": \"Pour les parents de jeunes enfants\",\n      \"they'll never forget.\": \"qu'ils n'oublieront jamais.\",\n      \"Little ones can't memorize a whole contact list — but they can learn one number. iCanCall turns that single number into the entire family: it rings you, then your partner, then Grandma, then a trusted neighbor, until someone who loves them picks up.\": \"Les tout-petits ne peuvent pas mémoriser tout un répertoire — mais ils peuvent apprendre un numéro. iCanCall fait de ce numéro unique toute la famille : il vous appelle, puis votre conjoint, puis Mamie, puis un voisin de confiance, jusqu'à ce que quelqu'un qui les aime décroche.\",\n      \"No phone of their own required.\": \"Pas besoin d'avoir leur propre téléphone.\",\n      \"They can call from a friend's house, the school office, or any phone — and still reach family in seconds.\": \"Ils peuvent appeler de chez un ami, du secrétariat de l'école ou de n'importe quel téléphone — et joindre la famille en quelques secondes.\",\n      \"Emma's iCanCall number\": \"Le numéro iCanCall d'Emma\",\n      \"Incoming call\": \"Appel entrant\",\n      \"She dials one number — it finds a grown-up she knows, in order, until someone answers\": \"Elle compose un seul numéro — il cherche un adulte qu'elle connaît, dans l'ordre, jusqu'à ce que quelqu'un réponde\",\n      \"Mom\": \"Maman\",\n      \"Mobile\": \"Portable\",\n      \"Standing by\": \"En attente\",\n      \"Dad\": \"Papa\",\n      \"Grandma Rose\": \"Mamie Rose\",\n      \"Grandparent\": \"Grand-parent\",\n      \"Neighbor\": \"Voisin\",\n      \"Made for little hands and big worries\": \"Pensé pour les petites mains et les grandes inquiétudes\",\n      \"number to memorize\": \"numéro à retenir\",\n      \"grown-ups it can reach\": \"adultes joignables\",\n      \"apps or phones needed\": \"appli ou téléphone requis\",\n      \"Any\": \"Tout\",\n      \"phone, anywhere\": \"téléphone, partout\",\n      \"The whole lesson\": \"Toute la leçon\",\n      \"One number is all they have to learn.\": \"Un seul numéro, c'est tout ce qu'ils ont à apprendre.\",\n      \"Ask a five-year-old to remember Mom's cell, Dad's cell, Grandma's house, and the neighbor next door, and you'll lose them at \\\"cell.\\\" iCanCall replaces the whole list with a single number — and quietly does the rest.\": \"Demandez à un enfant de cinq ans de retenir le portable de Maman, le portable de Papa, le fixe de Mamie et le numéro du voisin d'à côté : vous l'aurez perdu dès « portable ». iCanCall remplace toute la liste par un seul numéro — et s'occupe discrètement du reste.\",\n      \"The old way\": \"Avant\",\n      \"A list no child can hold\": \"Une liste qu'aucun enfant ne peut retenir\",\n      \"Too many numbers, scribbled on the fridge — and never the right one in the moment that counts.\": \"Trop de numéros, griffonnés sur le frigo — et jamais le bon au moment qui compte.\",\n      \"Mom — cell\": \"Maman — portable\",\n      \"Dad — work\": \"Papa — travail\",\n      \"\\\"Which one do I call if you don't answer?\\\"\": \"« J'appelle lequel si tu ne réponds pas ? »\",\n      \"With iCanCall\": \"Avec iCanCall\",\n      \"One number, every grown-up\": \"Un seul numéro, tous les adultes\",\n      \"They learn it like a nursery rhyme. It finds whoever's available — you don't have to be the one who picks up.\": \"Ils l'apprennent comme une comptine. Il trouve la personne disponible — ce n'est pas forcément à vous de décrocher.\",\n      \"Our family number\": \"Le numéro de notre famille\",\n      \"\\\"If you ever need us, call this. Someone will always answer.\\\"\": \"« Si tu as besoin de nous, appelle ce numéro. Quelqu'un répondra toujours. »\",\n      \"Set it up once. Teach it once.\": \"Configurez-le une fois. Apprenez-le-leur une fois.\",\n      \"A few minutes of setup buys years of \\\"I can always reach a grown-up.\\\"\": \"Quelques minutes de configuration pour des années de « je peux toujours joindre un adulte ».\",\n      \"Claim your family number\": \"Réservez votre numéro familial\",\n      \"Pick one easy-to-remember iCanCall number. Put it on a backpack tag, a lunchbox card, and the classroom contact card — the only number your child needs anywhere they go.\": \"Choisissez un numéro iCanCall facile à retenir. Inscrivez-le sur une étiquette de cartable, une carte dans la boîte à goûter et la fiche de contacts de la classe — le seul numéro dont votre enfant a besoin, où qu'il aille.\",\n      \"Add the grown-ups\": \"Ajoutez les adultes\",\n      \"You, your partner, grandparents, a babysitter, a trusted neighbor — up to six people, in the order you want them reached. Adjust anytime from your phone.\": \"Vous, votre conjoint, les grands-parents, une baby-sitter, un voisin de confiance — jusqu'à six personnes, dans l'ordre où vous voulez qu'elles soient jointes. Modifiez à tout moment depuis votre téléphone.\",\n      \"Teach them the number\": \"Apprenez-leur le numéro\",\n      \"That's the whole job for them. When they call, iCanCall\": \"C'est tout ce qu'il a à faire. Quand votre enfant appelle, iCanCall\",\n      \"cascades\": \"appelle en cascade\",\n      \"through the circle until someone answers — and every grown-up gets a text that the call came in.\": \"tout le cercle jusqu'à ce que quelqu'un réponde — et chaque adulte reçoit un SMS signalant l'appel.\",\n      \"Wherever they are\": \"Où qu'ils soient\",\n      \"The same number works\": \"Le même numéro fonctionne\",\n      \"everywhere life happens.\": \"partout où la vie se passe.\",\n      \"No phone of their own? No problem. One number reaches family from any phone they can get to.\": \"Pas de téléphone à eux ? Aucun problème. Un seul numéro joint la famille depuis n'importe quel téléphone à leur portée.\",\n      \"Home after school\": \"À la maison après l'école\",\n      \"Beat you home? One call lets them check in and reach whoever's free — you, Grandma, or the neighbor.\": \"Rentré avant vous ? Un appel lui permet de donner des nouvelles et de joindre la personne disponible — vous, Mamie ou le voisin.\",\n      \"At a friend's house\": \"Chez un ami\",\n      \"From a friend's landline or a parent's phone, the one number still finds your family — no contacts to look up.\": \"Depuis le fixe d'un ami ou le téléphone d'un parent, le numéro unique trouve toujours votre famille — aucun contact à chercher.\",\n      \"Lost at the store\": \"Perdu dans un magasin\",\n      \"A clerk or another grown-up can dial the number with them, and a familiar voice answers right away.\": \"Un vendeur ou un autre adulte peut composer le numéro avec lui, et une voix familière répond aussitôt.\",\n      \"When plans change\": \"Quand le programme change\",\n      \"Practice ran late or pickup got moved? One call routes to whoever can come — no scramble, no guessing.\": \"L'entraînement a duré plus longtemps ou la sortie a été décalée ? Un appel est acheminé vers la personne qui peut venir — sans panique, sans devinettes.\",\n      \"Try it yourself\": \"Essayez vous-même\",\n      \"Build the circle that answers for your child.\": \"Composez le cercle qui répond à votre enfant.\",\n      \"Add the grown-ups you trust, set their order, then place a pretend call. Choose\": \"Ajoutez les adultes de confiance, définissez leur ordre, puis passez un appel fictif. Choisissez la\",\n      \"— ring everyone in turn until someone picks up — or a simple\": \"— chaque contact sonne à tour de rôle jusqu'à ce que quelqu'un décroche — ou un simple\",\n      \"caller menu\": \"menu vocal\",\n      \". Your child only ever dials one number.\": \". Votre enfant, lui, ne compose jamais qu'un seul numéro.\",\n      \"Routing mode\": \"Mode d'acheminement\",\n      \"Call cascade\": \"Appel en cascade\",\n      \"Caller menu\": \"Menu vocal\",\n      \"You set this once in the dashboard\": \"Vous le réglez une seule fois dans le tableau de bord\",\n      \"Your child's circle\": \"Le cercle de votre enfant\",\n      \"Ready\": \"Prêt\",\n      \"Press call to start routing\": \"Appuyez sur Appeler pour lancer l'acheminement\",\n      \"Place a call\": \"Passer un appel\",\n      \"Toggle contacts to \\\"Busy\\\" to see the cascade skip ahead.\": \"Passez des contacts en « Occupé » pour voir la cascade passer au suivant.\",\n      \"Why parents choose iCanCall\": \"Pourquoi les parents choisissent iCanCall\",\n      \"Built so they always reach\": \"Conçu pour qu'ils joignent toujours\",\n      \"someone who loves them.\": \"quelqu'un qui les aime.\",\n      \"One number to memorize\": \"Un seul numéro à mémoriser\",\n      \"Children learn a single number instead of a fragile list. It's the only one they'll ever need to reach the whole family.\": \"Les enfants apprennent un seul numéro au lieu d'une liste fragile. C'est le seul dont ils auront jamais besoin pour joindre toute la famille.\",\n      \"No phone of their own\": \"Pas de téléphone à eux\",\n      \"Works from any phone — a friend's, a teacher's, a landline. Your child doesn't need a device to reach you.\": \"Fonctionne depuis n'importe quel téléphone — celui d'un ami, d'un enseignant, un fixe. Votre enfant n'a besoin d'aucun appareil pour vous joindre.\",\n      \"Someone always answers\": \"Quelqu'un répond toujours\",\n      \"If you're busy, the call rolls to your partner, then a grandparent, then a trusted neighbor — until a familiar voice picks up.\": \"Si vous êtes occupé, l'appel passe à votre conjoint, puis à un grand-parent, puis à un voisin de confiance — jusqu'à ce qu'une voix familière décroche.\",\n      \"You always know\": \"Vous êtes toujours au courant\",\n      \"Every grown-up in the circle gets a text the moment your child calls — so you're never the last to find out.\": \"Chaque adulte du cercle reçoit un SMS dès que votre enfant appelle — vous n'êtes jamais le dernier informé.\",\n      \"Different by time of day\": \"Différent selon l'heure\",\n      \"Route to the babysitter after school and to you in the evening — automatically, so the right grown-up always answers.\": \"Acheminez vers la baby-sitter après l'école et vers vous le soir — automatiquement, pour que le bon adulte réponde toujours.\",\n      \"Private & protected\": \"Privé et protégé\",\n      \"Everyone's real numbers stay hidden behind your single iCanCall line. All routing is encrypted, and your data is never sold.\": \"Les vrais numéros de chacun restent masqués derrière votre ligne iCanCall unique. Tout l'acheminement est chiffré, et vos données ne sont jamais vendues.\",\n      \"Simple, honest pricing\": \"Des tarifs simples et honnêtes\",\n      \"Peace of mind, less than a phone bill.\": \"La tranquillité d'esprit, pour moins qu'une facture de téléphone.\",\n      \"/ month\": \"/ mois\",\n      \"What parents ask us most.\": \"Les questions que les parents nous posent le plus.\",\n      \"Does my child need their own phone?\": \"Mon enfant a-t-il besoin de son propre téléphone ?\",\n      \"No. That's the whole idea. iCanCall is one number that works from\": \"Non. C'est tout le principe. iCanCall est un numéro unique qui fonctionne depuis\",\n      \"any\": \"n'importe quel\",\n      \"phone — a friend's house, the school office, a neighbor's landline. Your child just needs to know the number, and a familiar grown-up answers.\": \"téléphone — chez un ami, au secrétariat de l'école, sur le fixe d'un voisin. Votre enfant n'a qu'à connaître le numéro, et un adulte familier répond.\",\n      \"Isn't one number too simple for something urgent?\": \"Un seul numéro, n'est-ce pas trop simple en cas d'urgence ?\",\n      \"Simple is exactly what works under stress. One number rings each grown-up in your circle in order until someone picks up — so a child who's scared or hurt never has to decide\": \"La simplicité, c'est justement ce qui fonctionne sous le coup du stress. Un seul numéro fait sonner chaque adulte de votre cercle, dans l'ordre, jusqu'à ce que quelqu'un décroche — ainsi, un enfant effrayé ou blessé n'a jamais à décider\",\n      \"who\": \"qui\",\n      \"to call. (iCanCall is for reaching family quickly; for life-threatening emergencies, always teach your child to call 911 too.)\": \"appeler. (iCanCall sert à joindre rapidement la famille ; pour les urgences vitales, apprenez aussi toujours à votre enfant à composer le 911.)\",\n      \"What if I'm busy and can't pick up?\": \"Et si je suis occupé et ne peux pas décrocher ?\",\n      \"The call simply rolls to the next grown-up — your partner, then a grandparent, then a trusted neighbor — until someone answers. Everyone in the circle also gets a text that your child called, so you'll know the moment you're free.\": \"L'appel passe simplement à l'adulte suivant — votre conjoint, puis un grand-parent, puis un voisin de confiance — jusqu'à ce que quelqu'un réponde. Tout le cercle reçoit aussi un SMS indiquant que votre enfant a appelé : vous le saurez dès que vous serez disponible.\",\n      \"Can I change who's in the circle, or the order?\": \"Puis-je changer les membres du cercle ou leur ordre ?\",\n      \"Anytime, in seconds, from your dashboard. Add the new babysitter, drop a contact, or reorder who's reached first. Changes take effect on the very next call.\": \"À tout moment, en quelques secondes, depuis votre tableau de bord. Ajoutez la nouvelle baby-sitter, retirez un contact ou changez l'ordre d'appel. Les changements s'appliquent dès l'appel suivant.\",\n      \"Will strangers see our family's phone numbers?\": \"Des inconnus verront-ils les numéros de notre famille ?\",\n      \"Never. Everyone's personal numbers stay hidden behind your single iCanCall line. All routing is encrypted, and we never sell your data.\": \"Jamais. Les numéros personnels de chacun restent masqués derrière votre ligne iCanCall unique. Tout l'acheminement est chiffré, et nous ne vendons jamais vos données.\",\n      \"How do I help my child remember the number?\": \"Comment aider mon enfant à retenir le numéro ?\",\n      \"Most families turn it into a little rhyme or song and practice a \\\"pretend call\\\" together. Put it on a backpack tag and the school contact form, and within a week it sticks — because it's the only number they have to know.\": \"La plupart des familles en font une petite comptine ou une chanson et s'entraînent ensemble avec un « appel pour de faux ». Inscrivez-le sur une étiquette de cartable et sur la fiche de contacts de l'école : en une semaine, il est retenu — parce que c'est le seul numéro qu'il a à connaître.\",\n      \"Give them one number. Give yourself peace of mind.\": \"Offrez-leur un numéro. Offrez-vous la tranquillité d'esprit.\",\n      \"In a few minutes, your child will have a single number that always reaches a grown-up who loves them — from any phone, anywhere. No device, no contact list, no guessing.\": \"En quelques minutes, votre enfant aura un numéro unique qui joint toujours un adulte qui l'aime — depuis n'importe quel téléphone, partout. Sans appareil, sans répertoire, sans devinettes.\",\n      \"One memorable number that always connects your child to a grown-up who loves them — from any phone, anywhere.\": \"Un numéro mémorable qui relie toujours votre enfant à un adulte qui l'aime — depuis n'importe quel téléphone, partout.\",\n      \"For every family\": \"Pour toutes les familles\",\n      \"iCanCall, Inc. All rights reserved.\": \"iCanCall, Inc. Tous droits réservés.\"\n    },\n    \"attrs\": {\n      \"Name\": \"Nom\",\n      \"Relationship\": \"Relation\"\n    }\n  },\n  \"ja\": {\n    \"text\": {\n      \"How it works\": \"仕組み\",\n      \"Features\": \"機能\",\n      \"Who it's for\": \"対象者 : \"14日間サービス保証\",\n      \"2 Dedicated Safety Numbers\": \"専用の安全番号 2つ\",\n      \"Up to 6 Roster Contacts\": \"登録連絡先 最大6名\",\n      \"Cascade & Caller Menu (IVR)\": \"順次呼び出し＋音声ダイヤルメニュー（IVR）\",\n      \"Time-of-day Scheduling\": \"時間帯別のスケジュール設定\",\n      \"Bilingual Greeting Options\": \"2ヶ国語音声ガイダンス設定\",\n      \"Instant Voicemail Email Transcriptions\": \"留守電の文字起こしを即メール送信\",\n      \"5 Dedicated Safety Numbers\": \"専用の安全番号 5つ\",\n      \"Up to 15 Roster Contacts per Number\": \"1番号あたり登録連絡先 最大15名\",\n      \"All Routing Modes + Scheduling\": \"全ルーティング方式＋スケジュール設定\",\n      \"150 pooled voice minutes\": \"共有の無料通話 150分\",\n      \"2 Caregiver Logins\": \"介護者ログイン 2アカウント\",\n      \"All plans include cascade routing, the caller menu, and 24/7 reliability. Set it up for your parent in minutes — cancel anytime.\": \"すべてのプランに順次呼び出し、音声ダイヤルメニュー、24時間365日の安定稼働が含まれます。ご両親のための設定は数分で完了、いつでも解約可能です。\",\n      \"All plans include cascade routing, the caller menu, and 24/7 reliability. Set it up in minutes — cancel anytime.\": \"すべてのプランに順次呼び出し、音声ダイヤルメニュー、24時間365日の安定稼働が含まれます。設定は数分で完了、いつでも解約可能です。\",\n      \"All plans include cascade routing, the caller menu, time-aware coverage, and 24/7 reliability. Cancel anytime.\": \"すべてのプランに順次呼び出し、音声ダイヤルメニュー、時間帯に応じたカバー、24時間365日の安定稼働が含まれます。いつでも解約可能です。\",\n      \"Designed for the moments that matter\": \"大切な瞬間のために設計\",\n      \"iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.\": \"iCanCallは、シンプルで余計な画面操作を必要としない家族間コミュニケーションを提供します。\",\n      \"For Kids\": \"お子様の見守りに\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"スマートフォンを持たせていないお子様でも、自宅の固定電話やシンプルな電話から簡単に家族全員に連絡が取れます。\",\n      \"For Seniors\": \"高齢のご家族に\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"スマートフォン操作が苦手な親御様に最適です。1つの番号だけをダイヤルするだけで、家族のだれかに繋がります。\",\n      \"For Special Needs\": \"特別なケアが必要な方に\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"認知障害や身体的な制限がある方でも、複数の相手の番号を覚える必要がなく、すぐに必要なサポートへ繋がります。\",\n      \"One number\": \"たった1つの番号\",\n      \"Build the circle\": \"サークルをつくる\",\n      \"Questions\": \"よくある質問\",\n      \"For parents of young children\": \"小さなお子様の保護者の方へ\",\n      \"they'll never forget.\": \"だから、忘れない。\",\n      \"Little ones can't memorize a whole contact list — but they can learn one number. iCanCall turns that single number into the entire family: it rings you, then your partner, then Grandma, then a trusted neighbor, until someone who loves them picks up.\": \"小さなお子様に、連絡先リストを丸ごと覚えることはできません。でも、番号1つなら覚えられます。iCanCallは、その1つの番号を家族全員につなげます。まずあなた、次にパートナー、おばあちゃん、信頼できるご近所の方へ——お子様を大切に思う誰かが出るまで、順番に呼び出します。\",\n      \"No phone of their own required.\": \"お子様専用の電話は必要ありません。\",\n      \"They can call from a friend's house, the school office, or any phone — and still reach family in seconds.\": \"お友達の家からでも、学校の事務室からでも、どんな電話からでも、数秒でご家族につながります。\",\n      \"Emma's iCanCall number\": \"EmmaのiCanCall番号\",\n      \"Incoming call\": \"着信\",\n      \"She dials one number — it finds a grown-up she knows, in order, until someone answers\": \"1つの番号にかけるだけ——誰かが出るまで、よく知っている大人を順番に呼び出します\",\n      \"Mom\": \"ママ\",\n      \"Mobile\": \"携帯\",\n      \"Standing by\": \"待機中\",\n      \"Dad\": \"パパ\",\n      \"Grandma Rose\": \"Roseおばあちゃん\",\n      \"Grandparent\": \"祖父母\",\n      \"Neighbor\": \"ご近所の方\",\n      \"Made for little hands and big worries\": \"小さな手と、大きな心配のために\",\n      \"number to memorize\": \"覚える番号\",\n      \"grown-ups it can reach\": \"つながる大人の人数\",\n      \"apps or phones needed\": \"必要なアプリ・専用電話\",\n      \"Any\": \"どんな\",\n      \"phone, anywhere\": \"電話でも、どこでも\",\n      \"The whole lesson\": \"教えるのは、これだけ\",\n      \"One number is all they have to learn.\": \"覚えるのは、番号1つだけ。\",\n      \"Ask a five-year-old to remember Mom's cell, Dad's cell, Grandma's house, and the neighbor next door, and you'll lose them at \\\"cell.\\\" iCanCall replaces the whole list with a single number — and quietly does the rest.\": \"5歳の子に、ママの携帯、パパの携帯、おばあちゃんの家、お隣さんの番号を全部覚えてと言っても、「携帯」のあたりでもうお手上げです。iCanCallなら、そのリストが丸ごと1つの番号に。あとのことは、静かに引き受けます。\",\n      \"The old way\": \"これまでの方法\",\n      \"A list no child can hold\": \"子どもには覚えきれないリスト\",\n      \"Too many numbers, scribbled on the fridge — and never the right one in the moment that counts.\": \"冷蔵庫に走り書きした、たくさんの番号。いざというときに限って、必要な番号が出てきません。\",\n      \"Mom — cell\": \"ママ — 携帯\",\n      \"Dad — work\": \"パパ — 職場\",\n      \"\\\"Which one do I call if you don't answer?\\\"\": \"「出なかったら、どれにかければいいの？」\",\n      \"With iCanCall\": \"iCanCallなら\",\n      \"One number, every grown-up\": \"番号は1つ、大人はみんな\",\n      \"They learn it like a nursery rhyme. It finds whoever's available — you don't have to be the one who picks up.\": \"童謡のように覚えられます。その番号が、手の空いている人を見つけてくれます。電話に出るのが、あなたでなくてもいいのです。\",\n      \"Our family number\": \"わが家の番号\",\n      \"\\\"If you ever need us, call this. Someone will always answer.\\\"\": \"「困ったときは、ここにかけてね。必ず誰かが出るから。」\",\n      \"Set it up once. Teach it once.\": \"設定は一度。教えるのも一度。\",\n      \"A few minutes of setup buys years of \\\"I can always reach a grown-up.\\\"\": \"数分の設定で、「いつでも大人につながる」安心が何年も続きます。\",\n      \"Claim your family number\": \"家族の番号を取得する\",\n      \"Pick one easy-to-remember iCanCall number. Put it on a backpack tag, a lunchbox card, and the classroom contact card — the only number your child needs anywhere they go.\": \"覚えやすいiCanCall番号を1つ選びます。かばんのタグ、お弁当箱のカード、学校の緊急連絡カードに書いておきましょう。どこへ行くときも、お子様に必要な番号はこれ1つです。\",\n      \"Add the grown-ups\": \"大人を登録する\",\n      \"You, your partner, grandparents, a babysitter, a trusted neighbor — up to six people, in the order you want them reached. Adjust anytime from your phone.\": \"あなた、パートナー、祖父母、ベビーシッター、信頼できるご近所の方——最大6名を、つなぎたい順番で登録します。変更はいつでもあなたの電話から。\",\n      \"Teach them the number\": \"お子様に番号を教える\",\n      \"That's the whole job for them. When they call, iCanCall\": \"お子様の役目は、それだけです。電話をかけると、iCanCallが\",\n      \"cascades\": \"順次呼び出し\",\n      \"through the circle until someone answers — and every grown-up gets a text that the call came in.\": \"を行い、誰かが出るまでサークルのメンバーに順番につなぎます。同時に、着信があったことが大人全員にSMSで届きます。\",\n      \"Wherever they are\": \"どこにいても\",\n      \"The same number works\": \"同じ番号が、\",\n      \"everywhere life happens.\": \"毎日のどんな場面でも使えます。\",\n      \"No phone of their own? No problem. One number reaches family from any phone they can get to.\": \"自分の電話がなくても大丈夫。手の届くどんな電話からでも、1つの番号でご家族につながります。\",\n      \"Home after school\": \"放課後の帰宅時\",\n      \"Beat you home? One call lets them check in and reach whoever's free — you, Grandma, or the neighbor.\": \"お子様のほうが先に帰宅したら？　電話1本で帰宅を知らせ、あなた、おばあちゃん、ご近所の方のうち、手の空いている人につながります。\",\n      \"At a friend's house\": \"お友達の家で\",\n      \"From a friend's landline or a parent's phone, the one number still finds your family — no contacts to look up.\": \"お友達の家の固定電話や、その親御さんの電話からでも、1つの番号でご家族につながります。連絡先を調べる必要はありません。\",\n      \"Lost at the store\": \"お店で迷子になったとき\",\n      \"A clerk or another grown-up can dial the number with them, and a familiar voice answers right away.\": \"店員さんや近くの大人が一緒に番号を押してくれれば、聞き慣れた声がすぐに応えます。\",\n      \"When plans change\": \"予定が変わったとき\",\n      \"Practice ran late or pickup got moved? One call routes to whoever can come — no scramble, no guessing.\": \"練習が長引いた、お迎えの予定が変わった——そんなときも、電話1本で迎えに行ける人につながります。慌てることも、あてずっぽうで探すこともありません。\",\n      \"Try it yourself\": \"実際に試してみましょう\",\n      \"Build the circle that answers for your child.\": \"お子様の電話に応えるサークルをつくりましょう。\",\n      \"Add the grown-ups you trust, set their order, then place a pretend call. Choose\": \"信頼できる大人を追加し、順番を決めて、模擬通話をかけてみましょう。方式は、\",\n      \"cascade\": \"順次呼び出し\",\n      \"— ring everyone in turn until someone picks up — or a simple\": \"（誰かが出るまで全員を順番に呼び出します）か、シンプルな\",\n      \"caller menu\": \"音声ダイヤルメニュー\",\n      \". Your child only ever dials one number.\": \"から選べます。お子様がかけるのは、いつも1つの番号だけです。\",\n      \"Routing mode\": \"ルーティング方式\",\n      \"Call cascade\": \"順次呼び出し\",\n      \"Caller menu\": \"音声ダイヤルメニュー\",\n      \"You set this once in the dashboard\": \"この設定は、ダッシュボードで一度行うだけです\",\n      \"Your child's circle\": \"お子様のサークル\",\n      \"/6 contacts\": \"/6名の連絡先\",\n      \"Ready\": \"準備完了\",\n      \"Press call to start routing\": \"通話ボタンを押すとルーティングが始まります\",\n      \"Place a call\": \"電話をかける\",\n      \"Toggle contacts to \\\"Busy\\\" to see the cascade skip ahead.\": \"連絡先を「話し中」に切り替えると、順次呼び出しが次の人へ進む様子を確認できます。\",\n      \"Why parents choose iCanCall\": \"保護者の方がiCanCallを選ぶ理由\",\n      \"Built so they always reach\": \"いつでも必ず、\",\n      \"someone who loves them.\": \"大切に思ってくれる誰かにつながる。\",\n      \"One number to memorize\": \"覚える番号は1つだけ\",\n      \"Children learn a single number instead of a fragile list. It's the only one they'll ever need to reach the whole family.\": \"忘れやすいリストの代わりに、お子様が覚えるのは1つの番号だけ。家族全員に連絡するために必要な番号は、これだけです。\",\n      \"No phone of their own\": \"自分の電話がなくてもいい\",\n      \"Works from any phone — a friend's, a teacher's, a landline. Your child doesn't need a device to reach you.\": \"お友達の電話、先生の電話、固定電話——どんな電話からでも使えます。お子様が端末を持っていなくても、あなたにつながります。\",\n      \"Someone always answers\": \"必ず誰かが出る\",\n      \"If you're busy, the call rolls to your partner, then a grandparent, then a trusted neighbor — until a familiar voice picks up.\": \"あなたが手を離せないときは、パートナーへ、次に祖父母へ、その次に信頼できるご近所の方へ——聞き慣れた声が応えるまで、電話は順番に回ります。\",\n      \"You always know\": \"いつでも把握できる\",\n      \"Every grown-up in the circle gets a text the moment your child calls — so you're never the last to find out.\": \"お子様が電話をかけた瞬間、サークルの大人全員にSMSが届きます。あなただけが後から知る、ということはありません。\",\n      \"Different by time of day\": \"時間帯ごとに切り替え\",\n      \"Route to the babysitter after school and to you in the evening — automatically, so the right grown-up always answers.\": \"放課後はベビーシッターへ、夜はあなたへ——自動で切り替わるので、いつでも最適な大人が電話に出ます。\",\n      \"Private & protected\": \"プライバシーをしっかり保護\",\n      \"Everyone's real numbers stay hidden behind your single iCanCall line. All routing is encrypted, and your data is never sold.\": \"全員の実際の電話番号は、1つのiCanCall番号の裏に隠れたまま。ルーティングはすべて暗号化され、お客様のデータが販売されることは決してありません。\",\n      \"Simple, honest pricing\": \"シンプルで誠実な料金\",\n      \"Peace of mind, less than a phone bill.\": \"電話代より手頃な、毎日の安心。\",\n      \"/ month\": \"/ 月\",\n      \"What parents ask us most.\": \"保護者の方からよくいただく質問。\",\n      \"Does my child need their own phone?\": \"子どもに専用の電話は必要ですか？\",\n      \"No. That's the whole idea. iCanCall is one number that works from\": \"いいえ。それこそがiCanCallの考え方です。iCanCallは、\",\n      \"any\": \"どんな\",\n      \"phone — a friend's house, the school office, a neighbor's landline. Your child just needs to know the number, and a familiar grown-up answers.\": \"電話からでも使える1つの番号です。お友達の家、学校の事務室、ご近所の固定電話——どこからでも。お子様は番号を覚えているだけで、よく知っている大人が電話に出てくれます。\",\n      \"Isn't one number too simple for something urgent?\": \"緊急のときに、番号1つでは単純すぎませんか？\",\n      \"Simple is exactly what works under stress. One number rings each grown-up in your circle in order until someone picks up — so a child who's scared or hurt never has to decide\": \"緊張した場面でこそ、シンプルさが力を発揮します。1つの番号が、誰かが出るまでサークルの大人を順番に呼び出すので、怖い思いをしていたり、ケガをしていたりするお子様が、\",\n      \"who\": \"誰に\",\n      \"to call. (iCanCall is for reaching family quickly; for life-threatening emergencies, always teach your child to call 911 too.)\": \"かけるかを迷う必要はありません。（iCanCallは、ご家族にすばやく連絡するためのサービスです。命に関わる緊急時には、必ず911にも通報するようお子様に教えてください。）\",\n      \"What if I'm busy and can't pick up?\": \"忙しくて電話に出られないときは？\",\n      \"The call simply rolls to the next grown-up — your partner, then a grandparent, then a trusted neighbor — until someone answers. Everyone in the circle also gets a text that your child called, so you'll know the moment you're free.\": \"電話は次の大人へ——パートナー、祖父母、信頼できるご近所の方へと、誰かが出るまで順番に回ります。お子様から電話があったことはサークルの全員にSMSでも届くので、手が空いたらすぐに確認できます。\",\n      \"Can I change who's in the circle, or the order?\": \"サークルのメンバーや順番は変更できますか？\",\n      \"Anytime, in seconds, from your dashboard. Add the new babysitter, drop a contact, or reorder who's reached first. Changes take effect on the very next call.\": \"いつでも、ダッシュボードから数秒で変更できます。新しいベビーシッターを追加する、連絡先を外す、最初につなぐ人を入れ替える——変更は次の通話からすぐに反映されます。\",\n      \"Will strangers see our family's phone numbers?\": \"家族の電話番号を、知らない人に見られませんか？\",\n      \"Never. Everyone's personal numbers stay hidden behind your single iCanCall line. All routing is encrypted, and we never sell your data.\": \"決して見られません。全員の個人の電話番号は、1つのiCanCall番号の裏に隠れたまま。ルーティングはすべて暗号化され、お客様のデータを販売することは決してありません。\",\n      \"How do I help my child remember the number?\": \"子どもに番号を覚えさせるには、どうすればいいですか？\",\n      \"Most families turn it into a little rhyme or song and practice a \\\"pretend call\\\" together. Put it on a backpack tag and the school contact form, and within a week it sticks — because it's the only number they have to know.\": \"多くのご家族は、短いリズムや歌にして、親子で「電話ごっこ」の練習をしています。かばんのタグや学校の連絡先用紙にも書いておけば、1週間ほどで身につきます。覚える番号は、これ1つだけなのですから。\",\n      \"Give them one number. Give yourself peace of mind.\": \"お子様には1つの番号を。あなたには安心を。\",\n      \"In a few minutes, your child will have a single number that always reaches a grown-up who loves them — from any phone, anywhere. No device, no contact list, no guessing.\": \"ほんの数分で、お子様は「大切に思ってくれる大人に必ずつながる1つの番号」を手にします。どんな電話からでも、どこからでも。端末も、連絡先リストも、迷うこともありません。\",\n      \"One memorable number that always connects your child to a grown-up who loves them — from any phone, anywhere.\": \"お子様を大切に思う大人へ必ずつながる、たった1つの覚えやすい電話番号。どんな電話からでも、どこからでも。\",\n      \"For every family\": \"すべてのご家族に\"\n    },\n    \"attrs\": {\n      \"Name\": \"名前\",\n      \"Relationship\": \"関係性\"\n    }\n  },\n  \"zh\": {\n    \"text\": {\n      \"How it works\": \"工作原理\",\n      \"Features\": \"核心功能\",\n      \"Who it's for\": \"适用人群\",\n      \"Pricing\": \"套餐资费\",\n      \"FAQ\": \"常见问题\",\n      \"Login\": \"登录\",\n      \"See how it works\": \"查看使用方法\",\n      \"Select a Plan\": \"选择套餐\",\n      \"See How We Compare\"  per Number\": \"每个号码支持添加 15 位看护联系人\",\n      \"All Routing Modes + Scheduling\": \"全部呼叫路由模式 + 时段排班\",\n      \"150 pooled voice minutes\": \"150 分钟共享通话时长\",\n      \"2 Caregiver Logins\": \"2 个看护人登录账号\",\n      \"All plans include cascade routing, the caller menu, and 24/7 reliability. Set it up for your parent in minutes — cancel anytime.\": \"所有套餐均包含级联顺次呼叫、交互语音菜单以及 7×24 小时稳定服务。几分钟即可为长辈完成设置，随时可取消。\",\n      \"All plans include cascade routing, the caller menu, and 24/7 reliability. Set it up in minutes — cancel anytime.\": \"所有套餐均包含级联顺次呼叫、交互语音菜单以及 7×24 小时稳定服务。几分钟即可完成设置，随时可取消。\",\n      \"All plans include cascade routing, the caller menu, time-aware coverage, and 24/7 reliability. Cancel anytime.\": \"所有套餐均包含级联顺次呼叫、交互语音菜单、按时段生效的覆盖以及 7×24 小时稳定服务。随时可取消。\",\n      \"Designed for the moments that matter\": \"适用于任何您在意的看护场景\",\n      \"iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.\": \"iCanCall 极为契合那些需要极简、免除屏幕依赖的安全防护和日常家庭沟通的看护场景。\",\n      \"For Kids\": \"针对儿童\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"让孩子们可以使用任意座机或简单电话快速拨通家庭成员，使其免受智能手机应用和屏幕的干扰。\",\n      \"For Seniors\": \"针对老年人\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"专为不熟悉智能机操作的年长父母设计。仅需一键拨打一个号码，即可接通他们身后的所有看护家庭成员。\",\n      \"For Special Needs\": \"针对认知/身体障碍人士\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"无需记忆繁杂的各成员电话或在通讯录中翻找，给他们最直接、最信赖的语音救助和沟通渠道。\",\n      \"One number\": \"一个号码\",\n      \"Build the circle\": \"组建看护圈\",\n      \"Questions\": \"常见问题\",\n      \"For parents of young children\": \"为幼儿家长而设\",\n      \"they'll never forget.\": \"让他们永远忘不了。\",\n      \"Little ones can't memorize a whole contact list — but they can learn one number. iCanCall turns that single number into the entire family: it rings you, then your partner, then Grandma, then a trusted neighbor, until someone who loves them picks up.\": \"小孩子记不住一整串联系人——但他们能学会一个号码。iCanCall 把这一个号码变成整个家：先打给您，再打给您的伴侣，然后是奶奶，再是信得过的邻居，直到有一位爱他们的人接起电话。\",\n      \"No phone of their own required.\": \"不需要他们有自己的手机。\",\n      \"They can call from a friend's house, the school office, or any phone — and still reach family in seconds.\": \"无论在朋友家、学校办公室，还是用任何一部电话，他们都能在几秒内联系到家人。\",\n      \"Emma's iCanCall number\": \"Emma 的 iCanCall 号码\",\n      \"Incoming call\": \"来电\",\n      \"She dials one number — it finds a grown-up she knows, in order, until someone answers\": \"她只拨一个号码——系统按顺序联系她熟悉的大人，直到有人接听\",\n      \"Mom\": \"妈妈\",\n      \"Mobile\": \"手机\",\n      \"Standing by\": \"待命中\",\n      \"Dad\": \"爸爸\",\n      \"Grandma Rose\": \"Rose 奶奶\",\n      \"Grandparent\": \"祖父母\",\n      \"Neighbor\": \"邻居\",\n      \"Made for little hands and big worries\": \"为小小的手，也为大大的牵挂而设计\",\n      \"number to memorize\": \"需要记住的号码\",\n      \"grown-ups it can reach\": \"可联系到的大人\",\n      \"apps or phones needed\": \"所需的应用或手机\",\n      \"Any\": \"任意\",\n      \"phone, anywhere\": \"电话，任何地点\",\n      \"The whole lesson\": \"要学的就这些\",\n      \"One number is all they have to learn.\": \"他们只需要学会一个号码。\",\n      \"Ask a five-year-old to remember Mom's cell, Dad's cell, Grandma's house, and the neighbor next door, and you'll lose them at \\\"cell.\\\" iCanCall replaces the whole list with a single number — and quietly does the rest.\": \"让一个五岁的孩子记住妈妈的手机、爸爸的手机、奶奶家的电话和隔壁邻居的号码，刚说到“手机”他就已经晕了。iCanCall 用一个号码取代整张清单——其余的事，它悄悄替您办妥。\",\n      \"The old way\": \"过去的做法\",\n      \"A list no child can hold\": \"一张孩子根本记不住的清单\",\n      \"Too many numbers, scribbled on the fridge — and never the right one in the moment that counts.\": \"号码太多，潦草地贴在冰箱上——到了关键时刻，偏偏找不到该打的那个。\",\n      \"Mom — cell\": \"妈妈——手机\",\n      \"Dad — work\": \"爸爸——单位\",\n      \"\\\"Which one do I call if you don't answer?\\\"\": \"“要是你们不接，我该打哪一个？”\",\n      \"With iCanCall\": \"有了 iCanCall\",\n      \"One number, every grown-up\": \"一个号码，联系每位大人\",\n      \"They learn it like a nursery rhyme. It finds whoever's available — you don't have to be the one who picks up.\": \"他们像学儿歌一样把它记住。它会找到当下有空的人——接电话的不一定非得是您。\",\n      \"Our family number\": \"我们家的号码\",\n      \"\\\"If you ever need us, call this. Someone will always answer.\\\"\": \"“什么时候需要我们，就打这个号码。一定会有人接。”\",\n      \"Set it up once. Teach it once.\": \"设置一次，教一次。\",\n      \"A few minutes of setup buys years of \\\"I can always reach a grown-up.\\\"\": \"几分钟的设置，换来多年的“我随时都能找到大人”。\",\n      \"Claim your family number\": \"申领您家的专属号码\",\n      \"Pick one easy-to-remember iCanCall number. Put it on a backpack tag, a lunchbox card, and the classroom contact card — the only number your child needs anywhere they go.\": \"挑选一个好记的 iCanCall 号码。把它写在书包挂牌、午餐盒卡片和班级联系卡上——无论孩子去哪儿，只需要这一个号码。\",\n      \"Add the grown-ups\": \"添加大人\",\n      \"You, your partner, grandparents, a babysitter, a trusted neighbor — up to six people, in the order you want them reached. Adjust anytime from your phone.\": \"您、您的伴侣、祖父母、保姆、信得过的邻居——最多六人，按您希望的联系顺序排列。随时可在手机上调整。\",\n      \"Teach them the number\": \"教会他们这个号码\",\n      \"That's the whole job for them. When they call, iCanCall\": \"他们要做的仅此而已。当他们拨打电话时，iCanCall 会\",\n      \"cascades\": \"依次级联呼叫\",\n      \"through the circle until someone answers — and every grown-up gets a text that the call came in.\": \"看护圈中的每一位，直到有人接听——同时每位大人都会收到来电短信通知。\",\n      \"Wherever they are\": \"无论他们身在何处\",\n      \"The same number works\": \"同一个号码，\",\n      \"everywhere life happens.\": \"生活到哪里，就通到哪里。\",\n      \"No phone of their own? No problem. One number reaches family from any phone they can get to.\": \"没有自己的手机？没关系。只要能拿到一部电话，一个号码就能联系到家人。\",\n      \"Home after school\": \"放学回到家\",\n      \"Beat you home? One call lets them check in and reach whoever's free — you, Grandma, or the neighbor.\": \"比您先到家？打一通电话，他们就能报个平安，并联系到当下有空的人——您、奶奶或邻居。\",\n      \"At a friend's house\": \"在朋友家\",\n      \"From a friend's landline or a parent's phone, the one number still finds your family — no contacts to look up.\": \"用朋友家的座机或家长的手机，这个号码照样能找到您的家人——不用翻找任何联系方式。\",\n      \"Lost at the store\": \"在商店走失\",\n      \"A clerk or another grown-up can dial the number with them, and a familiar voice answers right away.\": \"店员或其他大人可以帮他们一起拨打这个号码，熟悉的声音马上就会接听。\",\n      \"When plans change\": \"计划有变时\",\n      \"Practice ran late or pickup got moved? One call routes to whoever can come — no scramble, no guessing.\": \"训练拖堂了，或者接送安排变了？一通电话就会转给能来的人——不慌乱，不用猜。\",\n      \"Try it yourself\": \"亲自试一试\",\n      \"Build the circle that answers for your child.\": \"为孩子组建一个随时应答的看护圈。\",\n      \"Add the grown-ups you trust, set their order, then place a pretend call. Choose\": \"添加您信任的大人，排好顺序，然后模拟拨打一通电话。您可以选择\",\n      \"cascade\": \"级联呼叫\",\n      \"— ring everyone in turn until someone picks up — or a simple\": \"——依次呼叫每个人，直到有人接听——也可以选择简单的\",\n      \"caller menu\": \"交互语音菜单\",\n      \". Your child only ever dials one number.\": \"。您的孩子始终只需拨打一个号码。\",\n      \"Routing mode\": \"呼叫路由模式\",\n      \"Call cascade\": \"级联呼叫\",\n      \"Caller menu\": \"交互语音菜单\",\n      \"You set this once in the dashboard\": \"只需在管理后台设置一次\",\n      \"Your child's circle\": \"孩子的看护圈\",\n      \"/6 contacts\": \"/6 位联系人\",\n      \"Ready\": \"准备就绪\",\n      \"Press call to start routing\": \"按下呼叫键，开始路由\",\n      \"Place a call\": \"拨打电话\",\n      \"Toggle contacts to \\\"Busy\\\" to see the cascade skip ahead.\": \"将联系人切换为“忙碌”，看看级联呼叫如何自动跳到下一位。\",\n      \"Why parents choose iCanCall\": \"为什么家长选择 iCanCall\",\n      \"Built so they always reach\": \"让他们总能找到\",\n      \"someone who loves them.\": \"爱他们的人。\",\n      \"One number to memorize\": \"只需记住一个号码\",\n      \"Children learn a single number instead of a fragile list. It's the only one they'll ever need to reach the whole family.\": \"孩子只学一个号码，而不是一张容易出错的清单。想联系全家人，他们只需要这一个。\",\n      \"No phone of their own\": \"不需要自己的手机\",\n      \"Works from any phone — a friend's, a teacher's, a landline. Your child doesn't need a device to reach you.\": \"任何电话都能拨打——朋友的、老师的、座机都行。孩子不需要任何设备就能找到您。\",\n      \"Someone always answers\": \"总有人接听\",\n      \"If you're busy, the call rolls to your partner, then a grandparent, then a trusted neighbor — until a familiar voice picks up.\": \"如果您正忙，来电会转给您的伴侣，再到祖父母，再到信得过的邻居——直到熟悉的声音接起电话。\",\n      \"You always know\": \"您总能第一时间知道\",\n      \"Every grown-up in the circle gets a text the moment your child calls — so you're never the last to find out.\": \"孩子一拨出电话，看护圈里的每位大人都会收到短信——您绝不会是最后一个知道的人。\",\n      \"Different by time of day\": \"不同时段，不同安排\",\n      \"Route to the babysitter after school and to you in the evening — automatically, so the right grown-up always answers.\": \"放学后转给保姆，晚上转给您——全部自动完成，接电话的总是最合适的大人。\",\n      \"Private & protected\": \"私密且受保护\",\n      \"Everyone's real numbers stay hidden behind your single iCanCall line. All routing is encrypted, and your data is never sold.\": \"每个人的真实号码都隐藏在您唯一的 iCanCall 号码之后。所有路由均经加密，您的数据绝不会被出售。\",\n      \"Simple, honest pricing\": \"简单透明的价格\",\n      \"Peace of mind, less than a phone bill.\": \"一份安心，比一张话费账单还便宜。\",\n      \"/ month\": \"/ 月\",\n      \"What parents ask us most.\": \"家长最常问的问题。\",\n      \"Does my child need their own phone?\": \"我的孩子需要自己的手机吗？\",\n      \"No. That's the whole idea. iCanCall is one number that works from\": \"不需要，这正是我们的初衷。iCanCall 就是一个号码，用\",\n      \"any\": \"任何\",\n      \"phone — a friend's house, the school office, a neighbor's landline. Your child just needs to know the number, and a familiar grown-up answers.\": \"电话都能拨打——朋友家的电话、学校办公室的电话、邻居家的座机都行。孩子只需记住这个号码，就会有熟悉的大人接听。\",\n      \"Isn't one number too simple for something urgent?\": \"遇到急事，只有一个号码会不会太简单了？\",\n      \"Simple is exactly what works under stress. One number rings each grown-up in your circle in order until someone picks up — so a child who's scared or hurt never has to decide\": \"越是紧张的时刻，越需要简单。一个号码会按顺序依次呼叫您看护圈里的每位大人，直到有人接听——孩子即使受了惊吓或受了伤，也不必纠结该打给\",\n      \"who\": \"谁\",\n      \"to call. (iCanCall is for reaching family quickly; for life-threatening emergencies, always teach your child to call 911 too.)\": \"。（iCanCall 用于快速联系家人；如遇危及生命的紧急情况，请务必同时教会孩子拨打 911。）\",\n      \"What if I'm busy and can't pick up?\": \"如果我正忙，接不了电话怎么办？\",\n      \"The call simply rolls to the next grown-up — your partner, then a grandparent, then a trusted neighbor — until someone answers. Everyone in the circle also gets a text that your child called, so you'll know the moment you're free.\": \"来电会自动转给下一位大人——您的伴侣，然后是祖父母，再是信得过的邻居——直到有人接听。看护圈里的每个人还会收到孩子来电的短信，所以您一有空就能知道。\",\n      \"Can I change who's in the circle, or the order?\": \"我可以更改看护圈的成员或顺序吗？\",\n      \"Anytime, in seconds, from your dashboard. Add the new babysitter, drop a contact, or reorder who's reached first. Changes take effect on the very next call.\": \"随时可以，在管理后台几秒钟就能完成。添加新保姆、移除某位联系人，或调整优先联系的顺序。更改从下一通电话起即刻生效。\",\n      \"Will strangers see our family's phone numbers?\": \"陌生人会看到我们家人的电话号码吗？\",\n      \"Never. Everyone's personal numbers stay hidden behind your single iCanCall line. All routing is encrypted, and we never sell your data.\": \"绝对不会。每个人的私人号码都隐藏在您唯一的 iCanCall 号码之后。所有路由均经加密，我们绝不出售您的数据。\",\n      \"How do I help my child remember the number?\": \"怎样帮孩子记住这个号码？\",\n      \"Most families turn it into a little rhyme or song and practice a \\\"pretend call\\\" together. Put it on a backpack tag and the school contact form, and within a week it sticks — because it's the only number they have to know.\": \"大多数家庭会把它编成一段小儿歌或顺口溜，再一起练习“模拟拨号”。把它写在书包挂牌和学校联系表上，不出一周就记牢了——因为他们只需要记这一个号码。\",\n      \"Give them one number. Give yourself peace of mind.\": \"给他们一个号码，给自己一份安心。\",\n      \"In a few minutes, your child will have a single number that always reaches a grown-up who loves them — from any phone, anywhere. No device, no contact list, no guessing.\": \"只需几分钟，您的孩子就会拥有一个号码，无论用哪部电话、身在何处，总能找到一位爱他们的大人。无需设备，无需联系人清单，也不用猜。\",\n      \"One memorable number that always connects your child to a grown-up who loves them — from any phone, anywhere.\": \"一个好记的号码，永远把您的孩子与爱他们的大人连在一起——任何电话，任何地点。\",\n      \"For every family\": \"适合每个家庭\",\n      \"iCanCall, Inc. All rights reserved.\": \"iCanCall, Inc. 保留所有权利。\"\n    },\n    \"attrs\": {\n      \"Name\": \"姓名\",\n      \"Relationship\": \"关系\"\n    }\n  },\n  \"ar\": {\n    \"text\": {\n      \"How it works\": \"كيف يعمل\",\n      \"Features\": \"الميزات\",\n      \"Who it's for\": \"لمن هذا\",\n      \"Pricing\": \"الأسعار\",\n      \"FAQ\": \"الأسئلة الشائعة\",\n      \"Login\": \"تسجيل الدخول\",\n      \"See how it works\": \"شاهد كيف يعمل\",\n      \"Select a Plan\": \"اختر خطة\",\n      \"See How We Compare\": \"شاهد كيف نقارن معهم\",\n      \"Comparison Chart\": \"جدول المقارنة\",\n      \"Key:\": \"المفتاح:\",\n      \"Included\": \"مشمول\",\n      \"Not available\": \"غير متاح\",\n      \"Limited or conditional\": \"جزئي محدود أو مشروط\",\n      \"Product\": \"المنتج\",\n      \"Who\": \"الجمهور\",\n      \"Company\": \"الشركة\",\n      \"Trust\": \"الثقة والأمان\",\n      \"Parents\": \"الوالدان والأطفال\",\n      \"Caregivers\": \"مقدمو الرعاية\",\n      \"Seniors\": \"كبار السن\",\n      \"About\": \"معلومات عنا\",\n      \"Careers\": \"الوظائف\",\n      \"Stories\": \"قصصنا\",\n      \"Contact\": \"اتصل بنا\",\n      \"Privacy\": \"سياسة الخصوصية\",\n      \"Security\": \"الأمان\",\n      \"Terms\": \"شروط الخدمة\",\n      \"Made for the moments that matter.\": \"صنع للحظات التي تهمك.\",\n      \"© 2026 iCanCall, Inc. All rights reserved.\": \"© 2026 جميع الحقوق محفوظة لشركة iCanCall, Inc.\",\n      \"One memorable number that always connects to the people who matter most. Safety on autopilot.\": \"رقم واحد سهل التذكر يربط دائماً بالأشخاص الأكثر أهمية. أمان في وضع الطيار الآلي.\",\n      \"Ready to secure your family?\": \"هل أنت مستعد لحماية عائلتك؟\",\n      \"Give your loved ones the safety and simplicity of iCanCall today. Set up in under 5 minutes.\": \"امنح أحباءك أمان وبساطة iCanCall اليوم. يتم الإعداد في أقل من 5 دقائق.\",\n      \"Get Started Now\": \"ابدأ الآن\",\n      \"Back to Homepage\": \"العودة للرئيسية\",\n      \"Set up in minutes · No setup fees · Cancel anytime\": \"الإعداد في دقائق · لا رسوم إعداد · إلغاء في أي وقت\",\n      \"One number your parent will never forget.\": \"رقم واحد لن ينساه والداك أبداً.\",\n      \"iCanCall connects seniors to their circle of support without smartphones, apps, or complicated tech. Starting at $12.99/mo.\": \"يربط iCanCall كبار السن بدائرة الدعم الخاصة بهم بدون هواتف ذكية أو تطبيقات معقدة. يبدأ من 12.99 دولاراً شهرياً.\",\n      \"See how it works for seniors\": \"شاهد كيف يعمل لكبار السن\",\n      \"Set it up for them\": \"قم بإعداده لهم\",\n      \"Get started\": \"ابدأ الآن\",\n      \"Select a plan for them\": \"اختر خطة لهم\",\n      \"How it works for seniors\": \"كيف يعمل لكبار السن\",\n      \"Safe, screen-free call routing for elderly parents.\": \"توجيه مكالمات آمن وخالٍ من الشاشات للآباء المسنين.\",\n      \"One number your child will never forget.\": \"رقم واحد لن ينساه طفلك أبداً.\",\n      \"iCanCall connects your kids to their circle of care without screen time, apps, or complex devices. Starting at $12.99/mo.\": \"يربط iCanCall أطفالك بدائرة الرعاية الخاصة بهم دون شاشات أو تطبيقات معقدة. يبدأ من 12.99 دولاراً شهرياً.\",\n      \"See how it works for kids\": \"شاهد كيف يعمل للأطفال\",\n      \"How it works for parents\": \"كيف يعمل للوالدين\",\n      \"Safe, screen-free call routing for young children.\": \"توجيه مكالمات آمن وخالٍ من الشاشات للأطفال الصغار.\",\n      \"One number your client will never forget.\": \"رقم واحد لن ينساه أحباؤك أبداً.\",\n      \"iCanCall connects your clients or loved ones to their care network instantly, without complex devices. Starting at $12.99/mo.\": \"يربط iCanCall أحباءك بشبكة الرعاية الخاصة بهم فوراً وبدون أجهزة معقدة. يبدأ من 12.99 دولاراً شهرياً.\",\n      \"See how it works for caregivers\": \"شاهد كيف يعمل لمقدمي الرعاية\",\n      \"How it w
