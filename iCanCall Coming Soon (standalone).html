document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

ize: 0.85rem; }\n.quote .by b { font-size: 0.92rem; display: block; }\n.quote .by span { font-size: 0.82rem; color: var(--ink-faint); }\n@media (max-width: 820px) { .quotes { grid-template-columns: 1fr; } }\n\n/* ---------- FAQ ---------- */\n.faq { max-width: 800px; margin: 48px auto 0; }\n.faq-item { border-bottom: 1px solid var(--line); }\n.faq-q { width: 100%; text-align: left; background: none; border: none; cursor: pointer; font-family: var(--font); padding: 24px 4px; display: flex; align-items: center; justify-content: space-between; gap: 20px; font-size: 1.1rem; font-weight: 600; color: var(--ink); }\n.faq-q .pm { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--tint); display: grid; place-items: center; transition: transform .25s, background .25s; color: var(--blue-deep); font-size: 1.2rem; line-height: 1; }\n.faq-item.open .faq-q .pm { transform: rotate(45deg); background: var(--blue); color: #fff; }\n.faq-a { max-height: 0; overflow: hidden; transition: max-height .32s ease; }\n.faq-a p { padding: 0 4px 24px; color: var(--ink-soft); font-size: 1rem; max-width: 68ch; }\n\n/* ---------- Final CTA ---------- */\n.cta-band { position: relative; overflow: hidden; }\n.cta-card {\n  position: relative; border-radius: var(--r-xl); padding: clamp(48px, 7vw, 88px) clamp(28px, 5vw, 72px);\n  background: linear-gradient(150deg, var(--blue-deep), var(--blue) 55%, var(--teal-deep));\n  color: #fff; text-align: center; overflow: hidden;\n  box-shadow: var(--shadow-lg);\n}\n.cta-card::before { content: \"\"; position: absolute; inset: 0; background: radial-gradient(50% 80% at 80% 0%, oklch(1 0 0 / 0.18), transparent 60%); pointer-events: none; }\n.cta-card h2 { color: #fff; position: relative; }\n.cta-card p { color: oklch(0.95 0.02 220); font-size: 1.18rem; margin: 18px auto 32px; max-width: 50ch; position: relative; }\n.cta-card .btn-primary { background: #fff; color: var(--blue-deep); box-shadow: 0 8px 24px oklch(0.2 0.05 240 / 0.3); }\n.ct l-success.show { display: flex; }\n.wl-success .tick {\n  width: 50px; height: 50px; border-radius: 14px; margin-bottom: 8px;\n  background: linear-gradient(150deg, var(--green), oklch(0.62 0.12 175));\n  display: grid; place-items: center; box-shadow: 0 8px 20px oklch(0.70 0.13 158 / 0.32);\n}\n.wl-success .tick svg { width: 26px; height: 26px; stroke: #fff; }\n.wl-success h3 { font-size: 1.35rem; }\n.wl-success p { color: var(--ink-soft); font-size: 0.98rem; }\n.wl-success .em { color: var(--blue-deep); font-weight: 600; }\n\n/* ---- Reserve card (static hero visual) ---- */\n.reserve { padding-bottom: 24px; }\n.reserve .demo-caption { margin-top: 4px; }\n.reserve .save-row {\n  display: flex; align-items: center; gap: 12px; margin-top: 16px;\n  padding: 13px 15px; border-radius: var(--r-md);\n  border: 1px dashed var(--line); background: var(--bg);\n}\n.reserve .save-row .badge {\n  width: 38px; height: 38px; border-radius: 11px; flex: none;\n  background: var(--tint); color: var(--blue-deep);\n  display: grid; place-items: center;\n}\n.reserve .save-row .badge svg { width: 19px; height: 19px; }\n.reserve .save-row .txt b { display: block; font-size: 0.95rem; font-weight: 600; }\n.reserve .save-row .txt span { font-size: 0.82rem; color: var(--ink-faint); }\n\n/* ---- What to expect ---- */\n.expect { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 52px; }\n.expect-card {\n  padding: 28px 26px; border-radius: var(--r-lg);\n  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm);\n}\n.expect-card .ic {\n  width: 46px; height: 46px; border-radius: 13px; margin-bottom: 18px;\n  background: var(--tint); color: var(--blue-deep); display: grid; place-items: center;\n}\n.expect-card .ic svg { width: 23px; height: 23px; }\n.expect-card h3 { font-size: 1.14rem; margin-bottom: 8px; }\n.expect-card p { color: var(--ink-soft); font-size: 0.96rem; }\n@media (max-width: 820px) { .expect { grid-template-columns: 1fr; } }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- ============== HEADER ============== -->\n<header class=\"header soon\">\n  <div class=\"wrap header-inner\">\n    <a class=\"brand\" href=\"#top\" aria-label=\"iCanCall home\">\n      <span class=\"mark\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>\n      <span>i<b>Can<\u002Fb>Call<\u002Fspan>\n    <\u002Fa>\n    <span class=\"soon-note\"><span class=\"dot\"><\u002Fspan><span class=\"txt\">Launching soon<\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"top\">\n\n<!-- ============== HERO / WAITLIST ============== -->\n<section class=\"hero soon-hero\">\n  <div class=\"wrap hero-grid\">\n    <div class=\"hero-copy\">\n      <span class=\"soon-badge\"><span class=\"pip\"><\u002Fspan>Launching soon · Private early access<\u002Fspan>\n      <h1>Be first<br><span class=\"accent\">in line.<\u002Fspan><\u002Fh1>\n      <p class=\"lead\">iCanCall gives the people you love one memorable number that's always answered — routing to up to six trusted contacts until someone picks up. We're putting the finishing touches on it. Join the waitlist and you'll be first through the door.<\u002Fp>\n\n      <!-- Waitlist form -->\n      <form class=\"waitlist\" id=\"waitlist\" novalidate=\"\">\n        <div class=\"wl-fields\">\n          <div class=\"wl-row\">\n            <div class=\"wl-field\">\n              <label for=\"wl-email\">Email<\u002Flabel>\n              <input id=\"wl-email\" name=\"email\" type=\"email\" placeholder=\"you@email.com\" autocomplete=\"email\" required=\"\">\n            <\u002Fdiv>\n            <div class=\"wl-field\">\n              <label for=\"wl-phone\">Mobile number<\u002Flabel>\n              <input id=\"wl-phone\" name=\"phone\" type=\"tel\" placeholder=\"(555) 123-4567\" autocomplete=\"tel\" required=\"\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <label class=\"wl-consent\" id=\"wl-consent\">\n          <input type=\"checkbox\" id=\"wl-sms\" name=\"sms\">\n          <span class=\"box\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span class=\"ctxt\"><b>Text me launch updates.<\u002Fb> I agree to receive occasional SMS messages from iCanCall about early access and launch. If you do not consent to receiving SMS messages, you will only receive email notifications. Msg &amp; data rates may apply; reply STOP to opt out anytime.<\u002Fspan>\n        <\u002Flabel>\n\n        <button class=\"btn btn-primary btn-lg btn-submit\" type=\"submit\">Join the waitlist<\u002Fbutton>\n\n        <p class=\"wl-error\" id=\"wl-error\">\n          <svg viewBox=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v5M12 16h.01\"><\u002Fpath><\u002Fsvg>\n          <span class=\"msg\">Please fix the highlighted fields.<\u002Fspan>\n        <\u002Fp>\n        <p class=\"wl-fine\">No spam, ever. We'll only reach out about your early-access invite — and you can unsubscribe in one tap. If you don't consent to SMS opt-in, you will only receive email notifications.<\u002Fp>\n      <\u002Fform>\n\n      <!-- Success state -->\n      <div class=\"wl-success\" id=\"wl-success\" role=\"status\" aria-live=\"polite\">\n        <span class=\"tick\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12 5 5L20 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <h3>You're on the list.<\u002Fh3>\n        <p>We saved your spot under <span class=\"em\" id=\"wl-shown-email\">your email<\u002Fspan>. The moment iCanCall goes live, you'll get your early-access invite and first pick of a memorable number.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Reserve card (animated routing motif) -->\n    <div class=\"demo reserve\" id=\"demo\" aria-label=\"iCanCall routing preview\">\n      <div class=\"demo-head\">\n        <div class=\"demo-number\">\n          <span class=\"ring\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <span class=\"num\">(415) 200-CARE<small>One number, always answered<\u002Fsmall><\u002Fspan>\n        <\u002Fdiv>\n        <span class=\"demo-status\"><span class=\"live\"><\u002Fspan><span class=\"txt\">Incoming call<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"demo-caption\">A preview of what's coming — one number that finds a person, in order, until someone answers<\u002Fp>\n      <div class=\"chain\">\n        <div class=\"contact\">\n          <span class=\"order\">1<\u002Fspan>\n          <span class=\"avatar\" style=\"background:oklch(0.58 0.115 232)\">YO<\u002Fspan>\n          <span class=\"who\"><b>You<\u002Fb><span>Mobile<\u002Fspan><\u002Fspan>\n          <span class=\"state\">Standing by<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"contact\">\n          <span class=\"order\">2<\u002Fspan>\n          <span class=\"avatar\" style=\"background:oklch(0.62 0.10 198)\">PA<\u002Fspan>\n          <span class=\"who\"><b>Your partner<\u002Fb><span>Mobile<\u002Fspan><\u002Fspan>\n          <span class=\"state\">Standing by<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"contact\">\n          <span class=\"order\">3<\u002Fspan>\n          <span class=\"avatar\" style=\"background:oklch(0.55 0.11 280)\">GP<\u002Fspan>\n          <span class=\"who\"><b>A grandparent<\u002Fb><span>Family<\u002Fspan><\u002Fspan>\n          <span class=\"state\">Standing by<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"contact\">\n          <span class=\"order\">4<\u002Fspan>\n          <span class=\"avatar\" style=\"background:oklch(0.6 0.12 30)\">NB<\u002Fspan>\n          <span class=\"who\"><b>A trusted neighbor<\u002Fb><span>Backup<\u002Fspan><\u002Fspan>\n          <span class=\"state\">Standing by<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"save-row\">\n        <span class=\"badge\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h11l3 3v13H5z\"><\u002Fpath><path d=\"M9 4v5h6\"><\u002Fpath><circle cx=\"12\" cy=\"14\" r=\"2.5\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n        <span class=\"txt\"><b>Reserve early, choose first<\u002Fb><span>Waitlist members get first pick of memorable numbers at launch<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============== WHAT TO EXPECT ============== -->\n<section class=\"section tint-band\" id=\"expect\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">What to expect<\u002Fspan>\n      <h2>A spot on the list comes<br>with a few good things.<\u002Fh2>\n      <p class=\"lead\">No commitment today — just the perks of being early when iCanCall opens its doors.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"expect\">\n      <div class=\"expect-card reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v4a2 2 0 0 1-2.2 2A16 16 0 0 1 3 6.2 2 2 0 0 1 5 4Z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>First pick of numbers<\u002Fh3>\n        <p>Memorable numbers go fast. Waitlist members choose theirs before doors open to everyone else.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"expect-card reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M5 21a7 7 0 0 1 14 0\"><\u002Fpath><path d=\"m17.5 4.5 1.2 1.2 2.3-2.3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Founding-member rate<\u002Fh3>\n        <p>Lock in launch pricing that stays yours for good — our thank-you for believing in this early.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"expect-card reveal\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16v11H7l-3 3V5Z\"><\u002Fpath><path d=\"M8 10h8M8 13h5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>A say in what we build<\u002Fh3>\n        <p>Early members shape the roadmap. We'll ask what matters most to your family — and listen.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<!-- ============== FOOTER ============== -->\n<footer class=\"footer\">\n  <div class=\"wrap\">\n    <div class=\"footer-grid\">\n      <div>\n        <a class=\"brand\" href=\"#top\">\n          <span class=\"mark\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span>i<b>Can<\u002Fb>Call<\u002Fspan>\n        <\u002Fa>\n        <p class=\"blurb\">One memorable number that's always answered — routed to the people you trust most, from any phone, anywhere.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h5>iCanCall<\u002Fh5>\n        <ul>\n          <li><a href=\"#expect\">What to expect<\u002Fa><\u002Fli>\n          <li><a href=\"#top\">Join the waitlist<\u002Fa><\u002Fli>\n          <li><a href=\"iCanCall Landing Page.html\">Preview the product<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h5>Company<\u002Fh5>\n        <ul>\n          <li><a href=\"#\">About<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Contact<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h5>Trust<\u002Fh5>\n        <ul>\n          <li><a href=\"#\">Privacy<\u002Fa><\u002Fli>\n          <li><a href=\"#\">SMS terms<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Terms<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer-bottom\">\n      <span>© <span id=\"year\">2026<\u002Fspan> iCanCall, Inc. All rights reserved.<\u002Fspan>\n      <span>Made for the moments that matter.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script src=\"b42fb5e0-e66d-40d1-8928-842ccd3fb2dd\"><\u002Fscript>\n<script>\n/* ---- Waitlist form handling ---- */\n(function waitlist() {\n  const form = document.getElementById('waitlist');\n  if (!form) return;\n  const email = document.getElementById('wl-email');\n  const phone = document.getElementById('wl-phone');\n  const sms = document.getElementById('wl-sms');\n  const consent = document.getElementById('wl-consent');\n  const errBox = document.getElementById('wl-error');\n  const errMsg = errBox.querySelector('.msg');\n  const success = document.getElementById('wl-success');\n  const shownEmail = document.getElementById('wl-shown-email');\n\n  const emailOk = (v) => /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(v.trim());\n  const phoneOk = (v) => (v.replace(/\\D/g, '').length >= 10);\n\n  function clearState() {\n    [email, phone].forEach((el) => el.classList.remove('invalid'));\n    consent.classList.remove('invalid');\n    errBox.classList.remove('show');\n  }\n\n  // live-clear an error once the user fixes a field\n  [email, phone].forEach((el) => el.addEventListener('input', () => el.classList.remove('invalid')));\n  sms.addEventListener('change', () => consent.classList.remove('invalid'));\n\n  form.addEventListener('submit', (e) => {\n    e.preventDefault();\n    clearState();\n\n    const problems = [];\n    if (!emailOk(email.value)) { email.classList.add('invalid'); problems.push('a valid email'); }\n    if (!phoneOk(phone.value)) { phone.classList.add('invalid'); problems.push('a valid mobile number'); }\n    \n\n    if (problems.length) {\n      errMsg.textContent = 'Please add ' + problems.join(', ') + ' to continue.';\n      errBox.classList.add('show');\n      const first = form.querySelector('.invalid input, input.invalid');\n      if (first && first.focus) first.focus();\n      return;\n    }\n\n    // persist locally (no backend in this prototype)\n    try {\n      const entry = { email: email.value.trim(), phone: phone.value.trim(), sms: sms.checked, at: new Date().toISOString() };\n      const list = JSON.parse(localStorage.getItem('ic_waitlist') || '[]');\n      list.push(entry);\n      localStorage.setItem('ic_waitlist', JSON.stringify(list));\n    } catch (_) { /* storage unavailable — still show success */ }\n\n    shownEmail.textContent = email.value.trim();\n    form.classList.add('done');\n    success.classList.add('show');\n    success.scrollTo ? null : null; // no scrollIntoView per guidelines\n  });\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
