,\n      \"How it works for seniors\": \"シニア向けの仕組み\",\n      \"Safe, screen-free call routing for elderly parents.\": \"画面操作不要。高齢のご両親のための安全な自動転送通話システム。\",\n      \"One number your child will never forget.\": \"お子様が忘れることのない、たった1つの電話番号。\",\n      \"iCanCall connects your kids to their circle of care without screen time, apps, or complex devices. Starting at $12.99\/mo.\": \"iCanCallは、スマホの画面を見せることなくお子様と家族をつなぎます。月額わずか $12.99 から。\",\n      \"See how it works for kids\": \"お子様向けの仕組みを見る\",\n      \"How it works for parents\": \"保護者向けの仕組み\",\n      \"Safe, screen-free call routing for young children.\": \"画面操作不要。小さなお子様のための安全な自動転送通話システム。\",\n      \"One number your client will never forget.\": \"大切なご家族が忘れることのない、たった1つの電話番号。\",\n      \"iCanCall connects your clients or loved ones to their care network instantly, without complex devices. Starting at $12.99\/mo.\": \"iCanCallは、複雑な機器を使わずに大切な人と介護ネットワークをつなぎます。月額わずか $12.99 から。\",\n      \"See how it works for caregivers\": \"介護者向けの仕組みを見る\",\n      \"How it works for caregivers\": \"介護者向けの仕組み\",\n      \"Safe, screen-free call routing for caregivers.\": \"画面操作不要。介護のための安全な自動転送通話システム。\",\n      \"Aging parent\": \"高齢のご両親\",\n      \"Aging parents\": \"高齢のご両親\",\n      \"Child calling home\": \"お子様からの連絡\",\n      \"Young children\": \"小さなお子様\",\n      \"Special-abilities care\": \"特別なケアが必要な方\",\n      \"Special abilities & caregivers\": \"特別ケアと介護者\",\n      \"Essential\": \"エッセンシャル\",\n      \"Essential Plan\": \"エッセンシャル・プラン\",\n      \"Pro\": \"プロ\",\n      \"Pro Plan\": \"プロ・プラン\",\n      \"Select Essential\": \"エッセンシャルを選択\",\n      \"Select Pro\": \"プロを選択\",\n      \"Most popular\": \"一番人気\",\n      \"Monthly\": \"月払い\",\n      \"Annual\": \"年払い\",\n      \"Save 17%\": \"17% お得\",\n      \"Save 20%\": \"20% お得\",\n      \"One number for one loved one.\": \"対象のご家族1名につき番号1つ。\",\n      \"Full protection for the whole circle.\": \"ケアサークル全員のための完全保護。\",\n      \"Billed monthly · cancel anytime\": \"月額課金 · いつでも解約可能\",\n      \"Just $10.75\/mo, billed annually\": \"年払いで実質月額わずか $10.75\",\n      \"Just $16.58\/mo, billed annually\": \"年払いで実質月額わずか $16.58\",\n      \"Everything included in the plan:\": \"プランに含まれるすべての機能：\",\n      \"1 number included\": \"専用の安全番号 1つ\",\n      \"3 routable trusted contacts\": \"登録連絡先 最大3名\",\n      \"Cascade routing + Caller Menu\": \"順次呼び出し＋音声ダイヤルメニュー\",\n      \"30 voice minutes\": \"無料通話 30分分\",\n      \"Bilingual greeting options\": \"2ヶ国語音声ガイダンス設定\",\n      \"Works on any phone — no app needed\": \"すべての電話機で動作 — アプリ不要\",\n      \"2 dedicated phone numbers\": \"専用の安全番号 2つ\",\n      \"6 routable trusted contacts\": \"登録連絡先 最大6名\",\n      \"60 minutes included\": \"無料通話 60分分込み\",\n      \"Real-time call alerts\": \"リアルタイム通話アラート\",\n      \"Admin dashboard\": \"管理者ダッシュボード\",\n      \"SMS & email notifications\": \"SMSおよびメール通知\",\n      \"Stories from families\": \"導入事例・ご家族の声\",\n      \"The calls that got through.\": \"つながった、という安心の声。\",\n      \"Questions, answered\": \"よくある質問\",\n      \"Everything you might ask.\": \"よく寄せられる疑問にお答えします。\",\n      \"Ringing…\": \"呼び出し中…\",\n      \"Connected ✓\": \"接続完了 ✓\",\n      \"Care Team\": \"ケアチーム\",\n      \"Select Plan\": \"プランを選択\",\n      \"One number for one parent.\": \"ご両親お一人につき番号1つ。\",\n      \"Full coverage for the whole care team.\": \"ケアチーム全員をカバーする完全保護。\",\n      \"Built for shared caregiving across several loved ones, with room for a second caregiver.\": \"複数のご家族を複数人で見守るための、2人目の介護者にも対応したプラン。\",\n      \"Just $12.42\/mo, billed annually\": \"年払いで実質月額わずか $12.42\",\n      \"Just $20.75\/mo, billed annually\": \"年払いで実質月額わずか $20.75\",\n      \"Just $41.58\/mo, billed annually\": \"年払いで実質月額わずか $41.58\",\n      \"1 Dedicated Safety Number\": \"専用の安全番号 1つ\",\n      \"Up to 3 Roster Contacts\": \"登録連絡先 最大3名\",\n      \"Call Cascade (Sequential)\": \"順次呼び出し（カスケード）\",\n      \"Real-time Email Alerts\": \"リアルタイムのメール通知\",\n      \"Standard voicemail box\": \"標準の留守番電話\",\n      \"30-day money-back guarantee\": \"30日間の返金保証\",\n      \"2 Dedicated Safety Numbers\": \"専用の安全番号 2つ\",\n      \"Up to 6 Roster Contacts\": \"登録連絡先 最大6名\",\n      \"Cascade & Caller Menu (IVR)\": \"順次呼び出し＋音声ダイヤルメニュー（IVR）\",\n      \"Time-of-day Scheduling\": \"時間帯別のスケジュール設定\",\n      \"Bilingual Greeting Options\": \"2ヶ国語音声ガイダンス設定\",\n      \"Instant Voicemail Email Transcriptions\": \"留守電の文字起こしを即メール送信\",\n      \"5 Dedicated Safety Numbers\": \"専用の安全番号 5つ\",\n      \"Up to 15 Roster Contacts per Number\": \"1番号あたり登録連絡先 最大15名\",\n      \"All Routing Modes + Scheduling\": \"全ルーティング方式＋スケジュール設定\",\n      \"150 pooled voice minutes\": \"共有の無料通話 150分\",\n      \"2 Caregiver Logins\": \"介護者ログイン 2アカウント\",\n      \"All plans include cascade routing, the caller menu, and 24\/7 reliability. Set it up for your parent in minutes — cancel anytime.\": \"すべてのプランに順次呼び出し、音声ダイヤルメニュー、24時間365日の安定稼働が含まれます。ご両親のための設定は数分で完了、いつでも解約可能です。\",\n      \"All plans include cascade routing, the caller menu, and 24\/7 reliability. Set it up in minutes — cancel anytime.\": \"すべてのプランに順次呼び出し、音声ダイヤルメニュー、24時間365日の安定稼働が含まれます。設定は数分で完了、いつでも解約可能です。\",\n      \"All plans include cascade routing, the caller menu, time-aware coverage, and 24\/7 reliability. Cancel anytime.\": \"すべてのプランに順次呼び出し、音声ダイヤルメニュー、時間帯に応じたカバー、24時間365日の安定稼働が含まれます。いつでも解約可能です。\",\n      \"Designed for the moments that matter\": \"大切な瞬間のために設計\",\n      \"iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.\": \"iCanCallは、シンプルで余計な画面操作を必要としない家族間コミュニケーションを提供します。\",\n      \"For Kids\": \"お子様の見守りに\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"スマートフォンを持たせていないお子様でも、自宅の固定電話やシンプルな電話から簡単に家族全員に連絡が取れます。\",\n      \"For Seniors\": \"高齢のご家族に\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"スマートフォン操作が苦手な親御様に最適です。1つの番号だけをダイヤルするだけで、家族のだれかに繋がります。\",\n      \"For Special Needs\": \"特別なケアが必要な方に\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"認知障害や身体的な制限がある方でも、複数の相手の番号を覚える必要がなく、すぐに必要なサポートへ繋がります。\",\n      \"Coverage\": \"カバー体制\",\n      \"Build the circle\": \"サークルをつくる\",\n      \"Questions\": \"よくある質問\",\n      \"For families & caregivers of loved ones with special abilities\": \"特別なケアが必要な方のご家族・介護者の方へ\",\n      \"One press.\": \"ひと押しで。\",\n      \"The right caregiver, every time.\": \"いつでも、最適な介護者へ。\",\n      \"For a loved one who can't work through a contact list, a single number — or one speed-dial button — connects them to exactly the right person on your care team. You decide who answers and when. They just press call.\": \"連絡先リストから相手を探すのが難しいご家族のために。1つの番号、あるいは短縮ダイヤルのボタン1つで、ケアチームの中のまさに最適な人につながります。誰が、いつ電話に出るかを決めるのはあなた。ご本人は、通話ボタンを押すだけです。\",\n      \"No list to navigate. No decision to make.\": \"リストを探す必要も、誰にかけるか決める必要もありません。\",\n      \"One press reaches a real person who knows them — and your whole care team is alerted the moment they call.\": \"ひと押しで、ご本人をよく知る人に直接つながります。そして電話をかけた瞬間、ケアチーム全員に通知が届きます。\",\n      \"Daniel's iCanCall number\": \"DanielのiCanCall番号\",\n      \"Incoming call\": \"着信\",\n      \"One press finds the right caregiver, in order, until someone who knows him answers\": \"ひと押しで——本人をよく知る誰かが出るまで、最適な介護者を順番に呼び出します\",\n      \"Mom · primary caregiver\": \"お母さん · 主担当の介護者\",\n      \"Standing by\": \"待機中\",\n      \"Co-caregiver\": \"共同介護者\",\n      \"Day program\": \"デイサービス\",\n      \"Nurse Dawn\": \"Dawn看護師\",\n      \"On-call\": \"オンコール\",\n      \"Independence for them, reassurance for you\": \"ご本人には自立を、あなたには安心を\",\n      \"press to reach help\": \"回押すだけで助けにつながる\",\n      \"lists to navigate\": \"操作が必要なリスト\",\n      \"caregiver coverage\": \"介護者によるカバー体制\",\n      \"Whole\": \"チーム全員\",\n      \"care team alerted\": \"に着信を通知\",\n      \"Around-the-clock coverage\": \"24時間体制のカバー\",\n      \"Someone is always responsible.\": \"いつでも、誰かが責任を持って応えます。\",\n      \"The number never changes — but who answers it does. iCanCall routes the same call to the right caregiver for the time of day, so coverage hands off cleanly and there's never a gap.\": \"番号は変わりません。変わるのは、電話に出る人です。iCanCallは同じ番号への電話を、時間帯に応じた担当の介護者へつなぎます。引き継ぎはスムーズで、空白の時間は生まれません。\",\n      \"Daniel's number — one number, all day\": \"Danielの番号——1日中、1つの番号で\",\n      \"Right now:\": \"現在：\",\n      \"On-call · overnight\": \"オンコール · 夜間\",\n      \"Weekday day program\": \"平日のデイサービス\",\n      \"Maria (Mom)\": \"Maria（お母さん）\",\n      \"Primary caregiver\": \"主担当の介護者\",\n      \"Evening\": \"夕方〜夜\",\n      \"12a\": \"0時\",\n      \"6a\": \"6時\",\n      \"12p\": \"12時\",\n      \"6p\": \"18時\",\n      \"· primary, afternoons\": \"· 主担当、午後\",\n      \"· evenings\": \"· 夕方〜夜\",\n      \"· weekdays\": \"· 平日\",\n      \"· overnight on-call\": \"· 夜間オンコール\",\n      \"If the assigned caregiver can't pick up, the call cascades to the next person in the circle — so a call is never left unanswered, at any hour.\": \"担当の介護者が出られない場合は、順次呼び出しでサークルの次の人へつながります。どの時間帯でも、電話が応答されないままになることはありません。\",\n      \"You build the care team.\": \"ケアチームをつくるのは、あなた。\",\n      \"They press one button.\": \"ご本人は、ボタンを1つ押すだけ。\",\n      \"All of the complexity lives with you, in the dashboard. For your loved one, it stays as simple as a single call.\": \"複雑な部分は、すべてあなたの側、ダッシュボードの中に。ご本人にとっては、電話を1本かけるだけのシンプルさです。\",\n      \"Claim one number\": \"番号を1つ取得する\",\n      \"Pick a single iCanCall number and set it as a speed-dial or a one-touch button on whatever device they use — a phone, a tablet, or an adaptive caller. That one button is all they ever need.\": \"iCanCall番号を1つ選び、ご本人が使っている機器——電話、タブレット、福祉用の通話機器——に短縮ダイヤルやワンタッチボタンとして設定します。ご本人に必要なのは、そのボタン1つだけです。\",\n      \"Build the care team\": \"ケアチームをつくる\",\n      \"Add up to six caregivers — family, co-caregivers, a day program, a group home, an on-call nurse — and set who should answer, and when, across the day.\": \"ご家族、共同介護者、デイサービス、グループホーム、オンコールの看護師など、最大6名の介護者を登録し、1日の中で誰が、いつ応答するかを設定します。\",\n      \"They reach the right person\": \"最適な人につながる\",\n      \"When they press call, iCanCall routes to the right caregiver for that moment and\": \"ご本人が通話ボタンを押すと、iCanCallがそのときの担当介護者につなぎ、必要に応じて\",\n      \"cascades\": \"順次呼び出し\",\n      \"on if needed — while every caregiver gets an instant text that the call came in.\": \"で次の人へ回します。同時に、着信があったことが介護者全員にすぐSMSで届きます。\",\n      \"Try it yourself\": \"実際に試してみましょう\",\n      \"Build the care team that answers.\": \"電話に応えるケアチームをつくりましょう。\",\n      \"Add the caregivers you trust, set their order, then place a pretend call. Choose\": \"信頼できる介護者を追加し、順番を決めて、模擬通話をかけてみましょう。方式は、\",\n      \"cascade\": \"順次呼び出し\",\n      \"— ring each caregiver in turn until someone picks up — or a simple\": \"（誰かが出るまで介護者を一人ずつ順番に呼び出します）か、シンプルな\",\n      \"caller menu\": \"音声ダイヤルメニュー\",\n      \". Your loved one only ever makes one call.\": \"から選べます。ご本人がかけるのは、いつも1本の電話だけです。\",\n      \"Routing mode\": \"ルーティング方式\",\n      \"Call cascade\": \"順次呼び出し\",\n      \"Caller menu\": \"音声ダイヤルメニュー\",\n      \"You set this once in the dashboard\": \"この設定は、ダッシュボードで一度行うだけです\",\n      \"The care team\": \"ケアチーム\",\n      \"\/6 contacts\": \"\/6名の連絡先\",\n      \"Ready\": \"準備完了\",\n      \"Press call to start routing\": \"通話ボタンを押すとルーティングが始まります\",\n      \"Place a call\": \"電話をかける\",\n      \"Toggle a caregiver to \\\"Busy\\\" to see the cascade skip ahead.\": \"介護者を「話し中」に切り替えると、順次呼び出しが次の人へ進む様子を確認できます。\",\n      \"Why caregivers choose iCanCall\": \"介護者の方がiCanCallを選ぶ理由\",\n      \"Simple for them.\": \"ご本人にはシンプルに。\",\n      \"Complete for you.\": \"あなたには万全の備えを。\",\n      \"One press, one action\": \"ひと押し、ひと動作\",\n      \"No contact list, no menus, no choosing. A single number or button is the entire interaction — designed for those a list would only overwhelm.\": \"連絡先リストも、メニューも、選ぶ手間もありません。1つの番号、あるいは1つのボタン——操作はそれだけ。リストがかえって負担になってしまう方のために設計されています。\",\n      \"Always the right caregiver\": \"いつでも最適な介護者へ\",\n      \"Time-aware routing sends the call to whoever's on for that part of the day — primary caregiver, day program, evening, or overnight on-call.\": \"時間帯に応じたルーティングで、その時間の担当者へ電話をつなぎます——主担当の介護者、デイサービス、夕方〜夜の担当、夜間のオンコールへ。\",\n      \"Whole team alerted\": \"チーム全員に通知\",\n      \"Every caregiver gets a text the instant a call comes in — vital when a loved one may not be able to explain where they are or what they need.\": \"着信と同時に、介護者全員にSMSが届きます。ご本人が居場所や必要なことをうまく伝えられない場合に、とても重要です。\",\n      \"No gaps at handoff\": \"引き継ぎに空白なし\",\n      \"Coverage passes cleanly from one caregiver to the next. If the assigned person can't answer, the call cascades onward — never a dead end.\": \"担当は、介護者から次の介護者へとスムーズに引き継がれます。担当者が出られなければ、順次呼び出しで次の人へ——行き止まりにはなりません。\",\n      \"Works with their setup\": \"今の環境でそのまま使える\",\n      \"Program it on a phone, a tablet, an adaptive caller, or a single speed-dial button. No app to install and nothing new to learn.\": \"電話、タブレット、福祉用の通話機器、あるいは短縮ダイヤルのボタン1つに登録できます。アプリのインストールも、新しく覚えることもありません。\",\n      \"Private & protected\": \"プライバシーをしっかり保護\",\n      \"Every caregiver's personal number stays hidden behind the single iCanCall line. All routing is encrypted, and your data is never sold.\": \"介護者全員の個人の電話番号は、1つのiCanCall番号の裏に隠れたまま。ルーティングはすべて暗号化され、お客様のデータが販売されることは決してありません。\",\n      \"Simple, honest pricing\": \"シンプルで誠実な料金\",\n      \"Coverage that costs less\": \"診察1回分の自己負担よりも\",\n      \"than a single co-pay.\": \"手頃な、安心のカバー体制。\",\n      \"\/ month\": \"\/ 月\",\n      \"What caregivers ask us most.\": \"介護者の方からよくいただく質問。\",\n      \"My loved one is non-verbal or can't explain where they are. Does this still help?\": \"本人は言葉を話せない、または居場所を説明できません。それでも役に立ちますか？\",\n      \"Yes — that's exactly who it's built for. They don't need to choose a contact or say anything in particular. One press connects them to a caregiver who knows them, and every caregiver in the circle gets an instant text that the call came in, so the right people are aware right away.\": \"はい。まさにそうした方のためにつくられています。連絡先を選ぶ必要も、決まった何かを話す必要もありません。ひと押しでご本人をよく知る介護者につながり、着信があったことがサークルの介護者全員にすぐSMSで届くので、必要な人たちがすぐに状況を把握できます。\",\n      \"Can it work as a single speed-dial button or with an adaptive device?\": \"短縮ダイヤルのボタン1つや、福祉用機器でも使えますか？\",\n      \"Absolutely. Because iCanCall is just one phone number, you can program it as a one-touch speed dial, a favorite, or a single button on whatever phone, tablet, or adaptive caller they already use. There's no app to install and nothing new for them to learn.\": \"もちろんです。iCanCallはただの電話番号1つなので、今お使いの電話、タブレット、福祉用の通話機器に、ワンタッチの短縮ダイヤル、お気に入り、あるいはボタン1つとして登録できます。アプリのインストールも、ご本人が新しく覚えることもありません。\",\n      \"How do multiple caregivers and shift changes work?\": \"複数の介護者や、シフトの交代にはどう対応しますか？\",\n      \"From your dashboard, you set who should answer at different times of day — a day program on weekday mornings, a primary caregiver in the afternoon, an evening caregiver, an overnight on-call nurse. The same number routes to whoever's on for that window, so coverage hands off without a gap.\": \"ダッシュボードから、時間帯ごとに誰が応答するかを設定できます。たとえば平日の午前はデイサービス、午後は主担当の介護者、夕方〜夜は夜の担当者、夜間はオンコールの看護師へ。同じ番号がその時間帯の担当者へつながるので、空白なく引き継がれます。\",\n      \"What if the assigned caregiver can't pick up?\": \"担当の介護者が出られない場合は？\",\n      \"The call cascades to the next person in the circle until someone answers. If everyone is unreachable, it goes to voicemail that's transcribed and texted to the whole team — so a call is never simply lost.\": \"誰かが出るまで、順次呼び出しでサークルの次の人へつながります。全員につながらない場合は留守番電話に切り替わり、文字起こしされてチーム全員にSMSで届きます。電話がそのまま失われることはありません。\",\n      \"Can a group home or day program be part of the circle?\": \"グループホームやデイサービスもサークルに入れられますか？\",\n      \"Yes. Any phone number can be a contact — a group home line, a day program, a case manager, a nurse, or family. You decide the order and the times, and adjust anytime as the care plan changes.\": \"はい。グループホームの代表番号、デイサービス、ケースマネージャー、看護師、ご家族など、どんな電話番号でも連絡先として登録できます。順番と時間帯はあなたが決め、ケアプランの変更に合わせていつでも調整できます。\",\n      \"Is iCanCall a medical alert or emergency service?\": \"iCanCallは、医療用アラートや緊急通報サービスですか？\",\n      \"No — iCanCall connects your loved one to the people on their care team quickly and simply. It complements, but does not replace, 911 or a medical-monitoring service. For life-threatening emergencies, always teach and rely on 911 where possible.\": \"いいえ。iCanCallは、ご本人とケアチームの人たちを、すばやく簡単につなぐサービスです。911や医療モニタリングサービスを補完するものであり、それらに代わるものではありません。命に関わる緊急時には、可能な限り911への通報を教え、利用してください。\",\n      \"One number. The right person. Every time.\": \"1つの番号で。最適な人へ。いつでも。\",\n      \"Give your loved one the independence of reaching help on their own — and give your care team the certainty of always being there. Set up iCanCall in minutes.\": \"ご本人には、自分の力で助けを呼べる自立を。ケアチームには、いつでもそばにいられる確かさを。iCanCallの設定は数分で完了します。\",\n      \"One memorable number — or one button — that always connects your loved one to the right caregiver, while keeping the whole team in the loop.\": \"ご本人を最適な介護者へ必ずつなぐ、たった1つの覚えやすい番号、あるいは1つのボタン。チーム全員への情報共有も欠かしません。\",\n      \"For every family\": \"すべてのご家族に\"\n    },\n    \"attrs\": {\n      \"Name\": \"名前\",\n      \"Relationship\": \"関係性\",\n      \"Role\": \"役割\"\n    }\n  },\n  \"zh\": {\n    \"text\": {\n      \"How it works\": \"工作原理\",\n      \"Features\": \"核心功能\",\n      \"Who it's for\": \"适用人群\",\n      \"Pricing\": \"套餐资费\",\n      \"FAQ\": \"常见问题\",\n      \"Login\": \"登录\",\n      \"See how it works\": \"查看使用方法\",\n      \"Select a Plan\": \"选择套餐\",\n      \"See How We Compare\": \"查看竞品差异\",\n      \"Comparison Chart\": \"竞合对照表\",\n      \"Key:\": \"图例说明：\",\n      \"Included\": \"已包含\",\n      \"Not available\": \"未提供 \/ 不可用\",\n      \"Limited or conditional\": \"部分提供 \/ 有限制条件\",\n      \"Product\": \"产品中心\",\n      \"Who\": \"适用场景\",\n      \"Company\": \"关于我们\",\n      \"Trust\": \"合规与信任\",\n      \"Parents\": \"针对家长儿童\",\n      \"Caregivers\": \"针对看护随行\",\n      \"Seniors\": \"针对年迈长辈\",\n      \"About\": \"关于团队\",\n      \"Careers\": \"招贤纳士\",\n      \"Stories\": \"用户故事\",\n      \"Contact\": \"联系我们\",\n      \"Privacy\": \"隐私协议\",\n      \"Security\": \"安全说明\",\n      \"Terms\": \"使用条款\",\n      \"Made for the moments that matter.\": \"只为生命中那些至关重要的时刻。\",\n      \"© 2026 iCanCall, Inc. All rights reserved.\": \"© 2026 iCanCall, Inc. 保留所有权利。\",\n      \"One memorable number that always connects to the people who matter most. Safety on autopilot.\": \"一个好记的号码，永远为您和至亲架起沟通的桥梁。全自动安全防线。\",\n      \"Ready to secure your family?\": \"立即为您的家人提供安全守护\",\n      \"Give your loved ones the safety and simplicity of iCanCall today. Set up in under 5 minutes.\": \"今天就让您所爱的人享受 iCanCall 的极简与安全。设置只需不到 5 分钟。\",\n      \"Get Started Now\": \"立即注册体验\",\n      \"Back to Homepage\": \"返回首页\",\n      \"Set up in minutes · No setup fees · Cancel anytime\": \"几分钟快速开通 · 无初装费 · 随时取消订阅\",\n      \"One number your parent will never forget.\": \"一个长辈永远不会忘记的号码。\",\n      \"iCanCall connects seniors to their circle of support without smartphones, apps, or complicated tech. Starting at $12.99\/mo.\": \"iCanCall 无需智能手机或复杂设备，即可将老年人与他们的看护圈相连。每月仅需 $12.99 起。\",\n      \"See how it works for seniors\": \"查看老年人使用方案\",\n      \"Set it up for them\": \"帮他们进行配置\",\n      \"Get started\": \"立即体验\",\n      \"Select a plan for them\": \"为他们选择套餐\",\n      \"How it works for seniors\": \"老年人使用指南\",\n      \"Safe, screen-free call routing for elderly parents.\": \"专为年迈父母设计的无屏幕安全电话转发系统。\",\n      \"One number your child will never forget.\": \"一个孩子永远不会忘记的号码。\",\n      \"iCanCall connects your kids to their circle of care without screen time, apps, or complex devices. Starting at $12.99\/mo.\": \"iCanCall 无需智能手机或 APP，即可将孩子们与家庭成员紧密相连。每月仅需 $12.99 起。\",\n      \"See how it works for kids\": \"查看儿童使用方案\",\n      \"How it works for parents\": \"家长管理指南\",\n      \"Safe, screen-free call routing for young children.\": \"专为幼儿设计的无屏幕安全电话转发系统。\",\n      \"One number your client will never forget.\": \"一个长辈或亲人永远不会忘记的号码。\",\n      \"iCanCall connects your clients or loved ones to their care network instantly, without complex devices. Starting at $12.99\/mo.\": \"iCanCall 无需复杂设备，即可立即将您的亲人与专属护理圈紧密相连。每月仅需 $12.99 起。\",\n      \"See how it works for caregivers\": \"查看看护人使用方案\",\n      \"How it works for caregivers\": \"看护人员使用指南\",\n      \"Safe, screen-free call routing for caregivers.\": \"专为看护人员设计的无屏幕安全电话转发系统。\",\n      \"Aging parent\": \"年迈父母\",\n      \"Aging parents\": \"年迈父母\",\n      \"Child calling home\": \"儿童拨号联络\",\n      \"Young children\": \"幼儿群体\",\n      \"Special-abilities care\": \"特殊障碍群体\",\n      \"Special abilities & caregivers\": \"特殊看护与随行\",\n      \"Essential\": \"基础套餐\",\n      \"Essential Plan\": \"基础套餐\",\n      \"Pro\": \"专业套餐\",\n      \"Pro Plan\": \"专业套餐\",\n      \"Select Essential\": \"选择基础套餐\",\n      \"Select Pro\": \"选择专业套餐\",\n      \"Most popular\": \"最受欢迎\",\n      \"Monthly\": \"按月付款\",\n      \"Annual\": \"按年付款\",\n      \"Save 17%\": \"年付省17%\",\n      \"Save 20%\": \"年付省20%\",\n      \"One number for one loved one.\": \"适合单家庭成员配置。\",\n      \"Full protection for the whole circle.\": \"为整个护理圈提供完整保护。\",\n      \"Billed monthly · cancel anytime\": \"按月结算 · 随时可取消\",\n      \"Just $10.75\/mo, billed annually\": \"仅需 $10.75\/月，按年计费\",\n      \"Just $16.58\/mo, billed annually\": \"仅需 $16.58\/月，按年计费\",\n      \"Everything included in the plan:\": \"套餐包含的所有服务：\",\n      \"1 number included\": \"1 个专属虚拟安全号码\",\n      \"3 routable trusted contacts\": \"支持添加 3 位看护人\",\n      \"Cascade routing + Caller Menu\": \"级联顺次呼叫 + 交互语音菜单\",\n      \"30 voice minutes\": \"30分钟通话时长\",\n      \"Bilingual greeting options\": \"双语语音引导录音选项\",\n      \"Works on any phone — no app needed\": \"支持任何手机\/座机 — 无需 APP\",\n      \"2 dedicated phone numbers\": \"2 个专属虚拟安全号码\",\n      \"6 routable trusted contacts\": \"多达 6 位看护联系人\",\n      \"60 minutes included\": \"包含 60 分钟通话时长\",\n      \"Real-time call alerts\": \"实时呼叫通知与提醒\",\n      \"Admin dashboard\": \"看护人管理后台\",\n      \"SMS & email notifications\": \"短信及邮件提醒\",\n      \"Stories from families\": \"用户故事分享\",\n      \"The calls that got through.\": \"那些成功连结彼此的呼叫 次呼叫、交互语音菜单以及 7×24 小时稳定服务。几分钟即可完成设置，随时可取消。\",\n      \"All plans include cascade routing, the caller menu, time-aware coverage, and 24\/7 reliability. Cancel anytime.\": \"所有套餐均包含级联顺次呼叫、交互语音菜单、按时段生效的覆盖以及 7×24 小时稳定服务。随时可取消。\",\n      \"Designed for the moments that matter\": \"适用于任何您在意的看护场景\",\n      \"iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.\": \"iCanCall 极为契合那些需要极简、免除屏幕依赖的安全防护和日常家庭沟通的看护场景。\",\n      \"For Kids\": \"针对儿童\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"让孩子们可以使用任意座机或简单电话快速拨通家庭成员，使其免受智能手机应用和屏幕的干扰。\",\n      \"For Seniors\": \"针对老年人\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"专为不熟悉智能机操作的年长父母设计。仅需一键拨打一个号码，即可接通他们身后的所有看护家庭成员。\",\n      \"For Special Needs\": \"针对认知\/身体障碍人士\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"无需记忆繁杂的各成员电话或在通讯录中翻找，给他们最直接、最信赖的语音救助和沟通渠道。\",\n      \"Coverage\": \"全天守护\",\n      \"Build the circle\": \"组建看护圈\",\n      \"Questions\": \"常见问题\",\n      \"For families & caregivers of loved ones with special abilities\": \"为有特殊需要亲人的家庭与看护人而设\",\n      \"One press.\": \"一键呼叫。\",\n      \"The right caregiver, every time.\": \"每次都找对看护人。\",\n      \"For a loved one who can't work through a contact list, a single number — or one speed-dial button — connects them to exactly the right person on your care team. You decide who answers and when. They just press call.\": \"对于无法在联系人列表中逐一查找的亲人，一个号码——或一个快速拨号键——就能把他们与护理团队中最合适的人直接连通。谁来接、何时接，由您决定。他们只需按下呼叫键。\",\n      \"No list to navigate. No decision to make.\": \"无需翻找列表，无需做任何选择。\",\n      \"One press reaches a real person who knows them — and your whole care team is alerted the moment they call.\": \"一键就能联系到一位了解他们的真人——他们一拨出电话，您的整个护理团队都会立即收到提醒。\",\n      \"Daniel's iCanCall number\": \"Daniel 的 iCanCall 号码\",\n      \"Incoming call\": \"来电\",\n      \"One press finds the right caregiver, in order, until someone who knows him answers\": \"一键按顺序联系合适的看护人，直到一位了解他的人接听\",\n      \"Mom · primary caregiver\": \"妈妈 · 主要看护人\",\n      \"Standing by\": \"待命中\",\n      \"Co-caregiver\": \"共同看护人\",\n      \"Sunrise Program\": \"Sunrise 项目\",\n      \"Day program\": \"日间照护项目\",\n      \"Nurse Dawn\": \"Dawn 护士\",\n      \"On-call\": \"值班\",\n      \"Independence for them, reassurance for you\": \"给他们一份自主，给您一份安心\",\n      \"press to reach help\": \"次按键即可求助\",\n      \"lists to navigate\": \"需要翻找的列表\",\n      \"caregiver coverage\": \"看护人值守覆盖\",\n      \"Whole\": \"整个\",\n      \"care team alerted\": \"护理团队收到提醒\",\n      \"Around-the-clock coverage\": \"全天候守护\",\n      \"Someone is always responsible.\": \"始终有人负责。\",\n      \"The number never changes — but who answers it does. iCanCall routes the same call to the right caregiver for the time of day, so coverage hands off cleanly and there's never a gap.\": \"号码永远不变——变的是接电话的人。iCanCall 会根据时段把同一通电话转给当班的看护人，交接顺畅，绝无空档。\",\n      \"Daniel's number — one number, all day\": \"Daniel 的号码——一个号码，全天通用\",\n      \"Right now:\": \"当前：\",\n      \"On-call · overnight\": \"值班 · 夜间\",\n      \"Weekday day program\": \"工作日日间项目\",\n      \"Maria (Mom)\": \"Maria（妈妈）\",\n      \"Primary caregiver\": \"主要看护人\",\n      \"Evening\": \"晚间\",\n      \"12a\": \"0点\",\n      \"6a\": \"6点\",\n      \"12p\": \"12点\",\n      \"6p\": \"18点\",\n      \"· primary, afternoons\": \"· 主要看护人，下午\",\n      \"· evenings\": \"· 晚间\",\n      \"· weekdays\": \"· 工作日\",\n      \"· overnight on-call\": \"· 夜间值班\",\n      \"If the assigned caregiver can't pick up, the call cascades to the next person in the circle — so a call is never left unanswered, at any hour.\": \"如果当班的看护人无法接听，来电会级联转给看护圈中的下一位——无论几点，都不会有无人接听的电话。\",\n      \"You build the care team.\": \"您来组建护理团队。\",\n      \"They press one button.\": \"他们只需按一个键。\",\n      \"All of the complexity lives with you, in the dashboard. For your loved one, it stays as simple as a single call.\": \"所有复杂的设置都留在您这边的管理后台里。对您的亲人来说，始终只是拨一通电话那么简单。\",\n      \"Claim one number\": \"申领一个号码\",\n      \"Pick a single iCanCall number and set it as a speed-dial or a one-touch button on whatever device they use — a phone, a tablet, or an adaptive caller. That one button is all they ever need.\": \"挑选一个 iCanCall 号码，在他们使用的任何设备上——手机、平板或辅助通话设备——把它设为快速拨号或一键拨号按钮。他们今后只需要这一个按钮。\",\n      \"Build the care team\": \"组建护理团队\",\n      \"Add up to six caregivers — family, co-caregivers, a day program, a group home, an on-call nurse — and set who should answer, and when, across the day.\": \"最多添加六位看护人——家人、共同看护人、日间照护项目、托养机构、值班护士——并设定一天中由谁接听、何时接听。\",\n      \"They reach the right person\": \"他们总能找到对的人\",\n      \"When they press call, iCanCall routes to the right caregiver for that moment and\": \"当他们按下呼叫键，iCanCall 会先接通当下当班的看护人，必要时再\",\n      \"cascades\": \"依次级联呼叫\",\n      \"on if needed — while every caregiver gets an instant text that the call came in.\": \"后面的联系人——同时每位看护人都会即时收到来电短信通知。\",\n      \"Try it yourself\": \"亲自试一试\",\n      \"Build the care team that answers.\": \"组建一支随时应答的护理团队。\",\n      \"Add the caregivers you trust, set their order, then place a pretend call. Choose\": \"添加您信任的看护人，排好顺序，然后模拟拨打一通电话。您可以选择\",\n      \"cascade\": \"级联呼叫\",\n      \"— ring each caregiver in turn until someone picks up — or a simple\": \"——依次呼叫每位看护人，直到有人接听——也可以选择简单的\",\n      \"caller menu\": \"交互语音菜单\",\n      \". Your loved one only ever makes one call.\": \"。您的亲人始终只需拨打一通电话。\",\n      \"Routing mode\": \"呼叫路由模式\",\n      \"Call cascade\": \"级联呼叫\",\n      \"Caller menu\": \"交互语音菜单\",\n      \"You set this once in the dashboard\": \"只需在管理后台设置一次\",\n      \"The care team\": \"护理团队\",\n      \"\/6 contacts\": \"\/6 位联系人\",\n      \"Ready\": \"准备就绪\",\n      \"Press call to start routing\": \"按下呼叫键，开始路由\",\n      \"Place a call\": \"拨打电话\",\n      \"Toggle a caregiver to \\\"Busy\\\" to see the cascade skip ahead.\": \"将某位看护人切换为“忙碌”，看看级联呼叫如何自动跳到下一位。\",\n      \"Why caregivers choose iCanCall\": \"为什么看护人选择 iCanCall\",\n      \"Simple for them.\": \"对他们，足够简单。\",\n      \"Complete for you.\": \"对您，足够周全。\",\n      \"One press, one action\": \"一次按键，一个动作\",\n      \"No contact list, no menus, no choosing. A single number or button is the entire interaction — designed for those a list would only overwhelm.\": \"没有联系人列表，没有菜单，不用做选择。一个号码或一个按钮就是全部操作——专为那些面对列表只会不知所措的人而设计。\",\n      \"Always the right caregiver\": \"始终找到合适的看护人\",\n      \"Time-aware routing sends the call to whoever's on for that part of the day — primary caregiver, day program, evening, or overnight on-call.\": \"按时段智能路由，把来电转给当前时段当班的人——主要看护人、日间照护项目、晚间看护人或夜间值班人员。\",\n      \"Whole team alerted\": \"全员即时知晓\",\n      \"Every caregiver gets a text the instant a call comes in — vital when a loved one may not be able to explain where they are or what they need.\": \"来电的那一刻，每位看护人都会收到短信——当亲人可能说不清自己在哪里、需要什么时，这一点至关重要。\",\n      \"No gaps at handoff\": \"交接无空档\",\n      \"Coverage passes cleanly from one caregiver to the next. If the assigned person can't answer, the call cascades onward — never a dead end.\": \"守护在看护人之间顺畅交接。如果当班的人无法接听，来电会继续级联转给下一位——永远不会无人回应。\",\n      \"Works with their setup\": \"适配他们现有的设备\",\n      \"Program it on a phone, a tablet, an adaptive caller, or a single speed-dial button. No app to install and nothing new to learn.\": \"可设置在手机、平板、辅助通话设备上，或设成一个快速拨号键。无需安装应用，也不用学任何新东西。\",\n      \"Private & protected\": \"私密且受保护\",\n      \"Every caregiver's personal number stays hidden behind the single iCanCall line. All routing is encrypted, and your data is never sold.\": \"每位看护人的私人号码都隐藏在唯一的 iCanCall 号码之后。所有路由均经加密，您的数据绝不会被出售。\",\n      \"Simple, honest pricing\": \"简单透明的价格\",\n      \"Coverage that costs less\": \"全天守护，花费还不到\",\n      \"than a single co-pay.\": \"一次看诊的自付费用。\",\n      \"\/ month\": \"\/ 月\",\n      \"What caregivers ask us most.\": \"看护人最常问的问题。\",\n      \"My loved one is non-verbal or can't explain where they are. Does this still help?\": \"我的亲人无法用言语表达，或说不清自己在哪里。这还有用吗？\",\n      \"Yes — that's exactly who it's built for. They don't need to choose a contact or say anything in particular. One press connects them to a caregiver who knows them, and every caregiver in the circle gets an instant text that the call came in, so the right people are aware right away.\": \"有用——这项服务正是为他们而设计的。他们不需要选择联系人，也不必说出特定的话。一键就能接通一位了解他们的看护人，看护圈中的每位看护人都会即时收到来电短信，该知道的人马上就能知道。\",\n      \"Can it work as a single speed-dial button or with an adaptive device?\": \"它能设成一个快速拨号键，或搭配辅助设备使用吗？\",\n      \"Absolutely. Because iCanCall is just one phone number, you can program it as a one-touch speed dial, a favorite, or a single button on whatever phone, tablet, or adaptive caller they already use. There's no app to install and nothing new for them to learn.\": \"当然可以。iCanCall 本质上就是一个电话号码，您可以在他们现有的任何手机、平板或辅助通话设备上，把它设为一键快速拨号、常用联系人或单独的按钮。无需安装应用，他们也不用学任何新东西。\",\n      \"How do multiple caregivers and shift changes work?\": \"多位看护人和交接班是如何运作的？\",\n      \"From your dashboard, you set who should answer at different times of day — a day program on weekday mornings, a primary caregiver in the afternoon, an evening caregiver, an overnight on-call nurse. The same number routes to whoever's on for that window, so coverage hands off without a gap.\": \"您可以在管理后台设定不同时段由谁接听——工作日上午是日间照护项目，下午是主要看护人，之后是晚间看护人，夜间是值班护士。同一个号码会转给该时段当班的人，交接毫无空档。\",\n      \"What if the assigned caregiver can't pick up?\": \"如果当班的看护人无法接听怎么办？\",\n      \"The call cascades to the next person in the circle until someone answers. If everyone is unreachable, it goes to voicemail that's transcribed and texted to the whole team — so a call is never simply lost.\": \"来电会级联转给看护圈中的下一位，直到有人接听。如果所有人都联系不上，来电会转入语音信箱，留言将转成文字并以短信发给整个团队——绝不会有电话就此石沉大海。\",\n      \"Can a group home or day program be part of the circle?\": \"托养机构或日间照护项目可以加入看护圈吗？\",\n      \"Yes. Any phone number can be a contact — a group home line, a day program, a case manager, a nurse, or family. You decide the order and the times, and adjust anytime as the care plan changes.\": \"可以。任何电话号码都能成为联系人——托养机构的电话、日间照护项目、个案管理员、护士或家人。顺序和时段由您决定，并可随照护计划的变化随时调整。\",\n      \"Is iCanCall a medical alert or emergency service?\": \"iCanCall 是医疗警报或紧急救援服务吗？\",\n      \"No — iCanCall connects your loved one to the people on their care team quickly and simply. It complements, but does not replace, 911 or a medical-monitoring service. For life-threatening emergencies, always teach and rely on 911 where possible.\": \"不是——iCanCall 的作用是让您的亲人快速、简单地联系到护理团队中的人。它是对 911 或医疗监护服务的补充，而非替代。如遇危及生命的紧急情况，请务必教会亲人拨打 911，并尽可能依靠 911。\",\n      \"One number. The right person. Every time.\": \"一个号码。对的人。每一次。\",\n      \"Give your loved one the independence of reaching help on their own — and give your care team the certainty of always being there. Set up iCanCall in minutes.\": \"让您的亲人拥有独立求助的自主，也让您的护理团队拥有始终在场的笃定。几分钟即可完成 iCanCall 设置。\",\n      \"One memorable number — or one button — that always connects your loved one to the right caregiver, while keeping the whole team in the loop.\": \"一个好记的号码——或一个按钮——永远把您的亲人与合适的看护人连在一起，同时让整个团队随时知情。\",\n      \"For every family\": \"适合每个家庭\",\n      \"iCanCall, Inc. All rights reserved.\": \"iCanCall, Inc. 保留所有权利。\"\n    },\n    \"attrs\": {\n      \"Name\": \"姓名\",\n      \"Relationship\": \"关系\",\n      \"Role\": \"角色\"\n    }\n  },\n  \"ar\": {\n    \"text\": {\n      \"How it works\": \"كيف يعمل\",\n      \"Features\": \"الميزات\",\n      \"Who it's for\": \"لمن هذا\",\n      \"Pricing\": \"الأسعار\",\n      \"FAQ\": \"الأسئلة الشائعة\",\n      \"Login\": \"تسجيل الدخول\",\n      \"See how it works\": \"شاهد كيف يعمل\",\n      \"Select a Plan\": \"اختر خطة\",\n      \"See How We Compare\": \"شاهد كيف نقارن معهم\",\n      \"Comparison Chart\": \"جدول المقارنة\",\n      \"Key:\": \"المفتاح:\",\n      \"Included\": \"مشمول\",\n      \"Not available\": \"غير متاح\",\n      \"Limited or conditional\": \"جزئي محدود أو مشروط\",\n      \"Product\": \"المنت قائمة جهات اتصال، رقم واحد — أو زر اتصال سريع واحد — يصله تماماً بالشخص المناسب في فريق رعايتك. أنت تقرر من يجيب ومتى. وهو يضغط زر الاتصال فقط.\",\n      \"No list to navigate. No decision to make.\": \"لا قائمة للتنقل فيها. ولا قرار يُتخذ.\",\n      \"One press reaches a real person who knows them — and your whole care team is alerted the moment they call.\": \"ضغطة واحدة تصله بشخص حقيقي يعرفه — ويُنبَّه فريق رعايتك بأكمله لحظة اتصاله.\",\n      \"Daniel's iCanCall number\": \"رقم iCanCall الخاص بـ Daniel\",\n      \"Incoming call\": \"مكالمة واردة\",\n      \"One press finds the right caregiver, in order, until someone who knows him answers\": \"ضغطة واحدة تجد مقدم الرعاية المناسب، بالترتيب، حتى يجيب شخص يعرفه\",\n      \"Mom · primary caregiver\": \"الأم · مقدمة الرعاية الأساسية\",\n      \"Standing by\": \"في وضع الاستعداد\",\n      \"Co-caregiver\": \"مقدم رعاية مشارك\",\n      \"Sunrise Program\": \"برنامج Sunrise\",\n      \"Day program\": \"برنامج نهاري\",\n      \"Nurse Dawn\": \"الممرضة Dawn\",\n      \"On-call\": \"مناوبة\",\n      \"Independence for them, reassurance for you\": \"استقلالية له، وطمأنينة لك\",\n      \"press to reach help\": \"ضغطة للوصول إلى المساعدة\",\n      \"lists to navigate\": \"قوائم للتنقل فيها\",\n      \"caregiver coverage\": \"تغطية من مقدمي الرعاية\",\n      \"Whole\": \"كامل\",\n      \"care team alerted\": \"فريق الرعاية يتلقى تنبيهاً\",\n      \"Around-the-clock coverage\": \"تغطية على مدار الساعة\",\n      \"Someone is always responsible.\": \"هناك دائماً شخص مسؤول.\",\n      \"The number never changes — but who answers it does. iCanCall routes the same call to the right caregiver for the time of day, so coverage hands off cleanly and there's never a gap.\": \"الرقم لا يتغير أبداً — لكن من يجيب عليه يتغير. يوجّه iCanCall المكالمة نفسها إلى مقدم الرعاية المناسب لوقت اليوم، فتنتقل التغطية بسلاسة ولا تحدث أي فجوة.\",\n      \"Daniel's number — one number, all day\": \"رقم Daniel — رقم واحد طوال اليوم\",\n      \"Right now:\": \"الآن:\",\n      \"On-call · overnight\": \"مناوبة · ليلاً\",\n      \"Weekday day program\": \"البرنامج النهاري في أيام الأسبوع\",\n      \"Maria (Mom)\": \"Maria (الأم)\",\n      \"Primary caregiver\": \"مقدمة الرعاية الأساسية\",\n      \"Evening\": \"المساء\",\n      \"12a\": \"12 ص\",\n      \"6a\": \"6 ص\",\n      \"12p\": \"12 م\",\n      \"6p\": \"6 م\",\n      \"· primary, afternoons\": \"· أساسية، بعد الظهر\",\n      \"· evenings\": \"· المساء\",\n      \"· weekdays\": \"· أيام الأسبوع\",\n      \"· overnight on-call\": \"· مناوبة ليلية\",\n      \"If the assigned caregiver can't pick up, the call cascades to the next person in the circle — so a call is never left unanswered, at any hour.\": \"إذا لم يتمكن مقدم الرعاية المكلّف من الرد، تنتقل المكالمة بالرنين المتتالي إلى الشخص التالي في الدائرة — فلا تبقى مكالمة بلا رد، في أي ساعة.\",\n      \"You build the care team.\": \"أنت تبني فريق الرعاية.\",\n      \"They press one button.\": \"وهو يضغط زراً واحداً.\",\n      \"All of the complexity lives with you, in the dashboard. For your loved one, it stays as simple as a single call.\": \"كل التعقيد يبقى عندك، في لوحة التحكم. أما لمن تحب، فيبقى الأمر ببساطة مكالمة واحدة.\",\n      \"Claim one number\": \"احجز رقماً واحداً\",\n      \"Pick a single iCanCall number and set it as a speed-dial or a one-touch button on whatever device they use — a phone, a tablet, or an adaptive caller. That one button is all they ever need.\": \"اختر رقم iCanCall واحداً واضبطه كاتصال سريع أو زر بلمسة واحدة على أي جهاز يستخدمه — هاتف أو جهاز لوحي أو جهاز اتصال تكيّفي. هذا الزر الواحد هو كل ما سيحتاج إليه.\",\n      \"Build the care team\": \"ابنِ فريق الرعاية\",\n      \"Add up to six caregivers — family, co-caregivers, a day program, a group home, an on-call nurse — and set who should answer, and when, across the day.\": \"أضف حتى ستة من مقدمي الرعاية — العائلة، ومقدمي رعاية مشاركين، وبرنامجاً نهارياً، ودار رعاية جماعية، وممرضة مناوبة — وحدّد من يجيب ومتى على مدار اليوم.\",\n      \"They reach the right person\": \"يصل إلى الشخص المناسب\",\n      \"When they press call, iCanCall routes to the right caregiver for that moment and\": \"عندما يضغط زر الاتصال، يوجّه iCanCall المكالمة إلى مقدم الرعاية المناسب لتلك اللحظة، ثم\",\n      \"cascades\": \"ينتقل بالرنين المتتالي\",\n      \"on if needed — while every caregiver gets an instant text that the call came in.\": \"إلى من يليه عند الحاجة — بينما يتلقى كل مقدم رعاية رسالة نصية فورية بورود المكالمة.\",\n      \"Try it yourself\": \"جرّبه بنفسك\",\n      \"Build the care team that answers.\": \"ابنِ فريق الرعاية الذي يجيب.\",\n      \"Add the caregivers you trust, set their order, then place a pretend call. Choose\": \"أضف مقدمي الرعاية الذين تثق بهم، ورتّبهم، ثم أجرِ مكالمة تجريبية. اختر\",\n      \"cascade\": \"الرنين المتتالي\",\n      \"— ring each caregiver in turn until someone picks up — or a simple\": \"— يرنّ على كل مقدم رعاية بالدور حتى يجيب أحدهم — أو خياراً بسيطاً هو\",\n      \"caller menu\": \"قائمة المتصل\",\n      \". Your loved one only ever makes one call.\": \". أما من تحب فلا يجري إلا مكالمة واحدة.\",\n      \"Routing mode\": \"وضع التوجيه\",\n      \"Call cascade\": \"رنين متتالي\",\n      \"Caller menu\": \"قائمة المتصل\",\n      \"You set this once in the dashboard\": \"تضبط هذا مرة واحدة في لوحة التحكم\",\n      \"The care team\": \"فريق الرعاية\",\n      \"\/6 contacts\": \"\/6 جهات اتصال\",\n      \"Ready\": \"جاهز\",\n      \"Press call to start routing\": \"اضغط «اتصال» لبدء التوجيه\",\n      \"Place a call\": \"أجرِ مكالمة\",\n      \"Toggle a caregiver to \\\"Busy\\\" to see the cascade skip ahead.\": \"بدّل حالة أحد مقدمي الرعاية إلى «مشغول» لترى الرنين المتتالي يتخطاه.\",\n      \"Why caregivers choose iCanCall\": \"لماذا يختار مقدمو الرعاية iCanCall\",\n      \"Simple for them.\": \"بسيط له.\",\n      \"Complete for you.\": \"متكامل لك.\",\n      \"One press, one action\": \"ضغطة واحدة، خطوة واحدة\",\n      \"No contact list, no menus, no choosing. A single number or button is the entire interaction — designed for those a list would only overwhelm.\": \"لا قائمة جهات اتصال، ولا قوائم خيارات، ولا اختيار. رقم واحد أو زر واحد هو التفاعل كله — مصمم لمن تربكهم القوائم.\",\n      \"Always the right caregiver\": \"مقدم الرعاية المناسب دائماً\",\n      \"Time-aware routing sends the call to whoever's on for that part of the day — primary caregiver, day program, evening, or overnight on-call.\": \"التوجيه حسب الوقت يرسل المكالمة إلى من يتولى تلك الفترة من اليوم — مقدم الرعاية الأساسي، أو البرنامج النهاري، أو مقدم رعاية المساء، أو المناوبة الليلية.\",\n      \"Whole team alerted\": \"تنبيه الفريق كله\",\n      \"Every caregiver gets a text the instant a call comes in — vital when a loved one may not be able to explain where they are or what they need.\": \"يتلقى كل مقدم رعاية رسالة نصية لحظة ورود المكالمة — وهو أمر حيوي حين لا يستطيع من تحب أن يشرح أين هو أو ماذا يحتاج.\",\n      \"No gaps at handoff\": \"لا فجوات عند التسليم\",\n      \"Coverage passes cleanly from one caregiver to the next. If the assigned person can't answer, the call cascades onward — never a dead end.\": \"تنتقل التغطية بسلاسة من مقدم رعاية إلى آخر. وإذا لم يتمكن الشخص المكلّف من الرد، تواصل المكالمة رنينها المتتالي — فلا طريق مسدود أبداً.\",\n      \"Works with their setup\": \"يتوافق مع أجهزته\",\n      \"Program it on a phone, a tablet, an adaptive caller, or a single speed-dial button. No app to install and nothing new to learn.\": \"برمجه على هاتف أو جهاز لوحي أو جهاز اتصال تكيّفي أو زر اتصال سريع واحد. لا تطبيق يُثبَّت ولا شيء جديد يُتعلَّم.\",\n      \"Private & protected\": \"خاص ومحمي\",\n      \"Every caregiver's personal number stays hidden behind the single iCanCall line. All routing is encrypted, and your data is never sold.\": \"يبقى الرقم الشخصي لكل مقدم رعاية مخفياً خلف خط iCanCall الواحد. كل التوجيه مشفّر، وبياناتك لا تُباع أبداً.\",\n      \"Simple, honest pricing\": \"أسعار بسيطة وصادقة\",\n      \"Coverage that costs less\": \"تغطية تكلّف أقل\",\n      \"than a single co-pay.\": \"من رسوم زيارة طبية واحدة.\",\n      \"\/ month\": \"\/ شهرياً\",\n      \"What caregivers ask us most.\": \"أكثر ما يسألنا عنه مقدمو الرعاية.\",\n      \"My loved one is non-verbal or can't explain where they are. Does this still help?\": \"من أحب لا يتكلم أو لا يستطيع أن يشرح أين هو. هل يفيده هذا أيضاً؟\",\n      \"Yes — that's exactly who it's built for. They don't need to choose a contact or say anything in particular. One press connects them to a caregiver who knows them, and every caregiver in the circle gets an instant text that the call came in, so the right people are aware right away.\": \"نعم — فقد صُمّم لأمثاله تحديداً. لا يحتاج إلى اختيار جهة اتصال أو قول شيء بعينه. ضغطة واحدة تصله بمقدم رعاية يعرفه، ويتلقى كل مقدم رعاية في الدائرة رسالة نصية فورية بورود المكالمة، فيعلم الأشخاص المناسبون على الفور.\",\n      \"Can it work as a single speed-dial button or with an adaptive device?\": \"هل يمكن أن يعمل كزر اتصال سريع واحد أو مع جهاز تكيّفي؟\",\n      \"Absolutely. Because iCanCall is just one phone number, you can program it as a one-touch speed dial, a favorite, or a single button on whatever phone, tablet, or adaptive caller they already use. There's no app to install and nothing new for them to learn.\": \"بالتأكيد. لأن iCanCall مجرد رقم هاتف واحد، يمكنك برمجته كاتصال سريع بلمسة واحدة، أو ضمن المفضلة، أو كزر واحد على أي هاتف أو جهاز لوحي أو جهاز اتصال تكيّفي يستخدمه أصلاً. لا تطبيق يُثبَّت ولا شيء جديد يتعلمه.\",\n      \"How do multiple caregivers and shift changes work?\": \"كيف يعمل مع تعدد مقدمي الرعاية وتبديل المناوبات؟\",\n      \"From your dashboard, you set who should answer at different times of day — a day program on weekday mornings, a primary caregiver in the afternoon, an evening caregiver, an overnight on-call nurse. The same number routes to whoever's on for that window, so coverage hands off without a gap.\": \"من لوحة التحكم، تحدد من يجيب في أوقات اليوم المختلفة — برنامج نهاري في صباح أيام الأسبوع، ومقدم الرعاية الأساسي بعد الظهر، ومقدم رعاية في المساء، وممرضة مناوبة ليلاً. يتجه الرقم نفسه إلى من يتولى تلك الفترة، فتنتقل التغطية بلا فجوة.\",\n      \"What if the assigned caregiver can't pick up?\": \"ماذا لو لم يتمكن مقدم الرعاية المكلّف من الرد؟\",\n      \"The call cascades to the next person in the circle until someone answers. If everyone is unreachable, it goes to voicemail that's transcribed and texted to the whole team — so a call is never simply lost.\": \"تنتقل المكالمة بالرنين المتتالي إلى الشخص التالي في الدائرة حتى يجيب أحدهم. وإذا تعذّر الوصول إلى الجميع، تتحول إلى بريد صوتي يُفرَّغ نصياً ويُرسل برسالة إلى الفريق كله — فلا تضيع أي مكالمة هكذا ببساطة.\",\n      \"Can a group home or day program be part of the circle?\": \"هل يمكن أن تكون دار رعاية جماعية أو برنامج نهاري جزءاً من الدائرة؟\",\n      \"Yes. Any phone number can be a contact — a group home line, a day program, a case manager, a nurse, or family. You decide the order and the times, and adjust anytime as the care plan changes.\": \"نعم. أي رقم هاتف يمكن أن يكون جهة اتصال — خط دار رعاية جماعية، أو برنامج نهاري، أو مدير حالة، أو ممرضة، أو أحد أفراد العائلة. أنت تحدد الترتيب والأوقات، وتعدّل في أي وقت مع تغيّر خطة الرعاية.\",\n      \"Is iCanCall a medical alert or emergency service?\": \"هل iCanCall خدمة تنبيه طبي أو خدمة طوارئ؟\",\n      \"No — iCanCall connects your loved one to the people on their care team quickly and simply. It complements, but does not replace, 911 or a medical-monitoring service. For life-threatening emergencies, always teach and rely on 911 where possible.\": \"لا — يصل iCanCall من تحب بأفراد فريق رعايته بسرعة وبساطة. وهو يكمّل خدمة 911 أو خدمات المراقبة الطبية، لكنه لا يحل محلها. وفي حالات الطوارئ المهددة للحياة، علّمه دائماً الاتصال بالرقم 911 واعتمد عليه كلما أمكن.\",\n      \"One number. The right person. Every time.\": \"رقم واحد. الشخص المناسب. في كل مرة.\",\n      \"Give your loved one the independence of reaching help on their own — and give your care team the certainty of always being there. Set up iCanCall in minutes.\": \"امنح من تحب استقلالية الوصول إلى المساعدة بنفسه — وامنح فريق رعايتك اليقين بأنه حاضر دائماً. أعدّ iCanCall في دقائق.\",\n      \"One memorable number — or one button — that always connects your loved one to the right caregiver, while keeping the whole team in the loop.\": \"رقم واحد سهل التذكر — أو زر واحد — يربط من تحب دائماً بمقدم الرعاية المناسب، مع إبقاء الفريق كله على اطلاع.\",\n      \"For every family\": \"لكل عائلة\",\n      \"iCanCall, Inc. All rights reserved.\": \"iCanCall, Inc. جميع الحقوق محفوظة.\"\n    },\n    \"attrs\": {\n      \"Name\": \"الاسم\",\n      \"Relationship\": \"العلاقة\",\n      \"Role\": \"الدور\"\n    }\n  },\n  \"hi\": {\n    \"text\": {\n      \"How it works\": \"यह कैसे काम करता है\",\n      \"Features\": \"विशेषताएं\",\n      \"Who it's for\": \"किसके लिए है\",\n      \"Pricing\": \"कीमतें\",\n      \"FAQ\": \"अक्सर पूछे जाने वाले प्रश्न\",\n      \"Login\": \"लॉगिन\",\n      \"See how it works\": \"देखें यह कैसे काम करता है\",\n      \"Select a Plan\": \"प्लान चुनें\",\n      \"See How We Compare\": \"देखें हम कैसे तुलना करते हैं\",\n      \"Comparison Chart\": \"तुलनात्मक तालिका\",\n      \"Key:\": \"संकेत:\",\n      \"Included\": \"शामिल\",\n      \"Not available\": \"उपलब्ध नहीं\",\n      \"Limited or conditional\": \"आंशिक सीमित या सशर्त\",\n      \"Product\": \"उत्पाद\",\n      \"Who\": \"किसके लिए\",\n      \"Company\": \"कंपनी\",\n      \"Trust\": \"विश्वसनीयता\",\n      \"Parents\": \"माता-पिता\",\n      \"Caregivers\": \"केयरटेकर\",\n      \"Seniors\": \"बुजुर्ग\",\n      \"About\": \"हमारे बारे में\",\n      \"Careers\": \"करियर\",\n      \"Stories\": \"कहानियां\",\n      \"Contact\": \"संपर्क\",\n      \"Privacy\": \"गोपनीयता नीति\",\n      \"Security\": \"सुरक्षा नीति\",\n      \"Terms\": \"सेवा की शर्तें\",\n      \"Made for the moments that matter.\": \"उन पलों के लिए जो मायने रखते हैं।\",\n      \"© 2026 iCanCall, Inc. All rights reserved.\": \"© 2026 iCanCall, Inc. सर्वाधिकार सुरक्षित।\",\n      \"One memorable number that always connects to the people who matter most. Safety on autopilot.\": \"एक याद रखने योग्य नंबर जो हमेशा आपके सबसे करीबी लोगों से जोड़ता है। ऑटोपायलट पर सुरक्षा।\",\n      \"Ready to secure your family?\": \"अपने परिवार को सुरक्षित रखने के लिए तैयार हैं?\",\n      \"Give your loved ones the safety and simplicity of iCanCall today. Set up in under 5 minutes.\": \"आज ही अपने प्रियजनों को iCanCall की सुरक्षा और सादगी दें। सेटअप में 5 मिनट से भी कम समय लगता है।\",\n      \"Get Started Now\": \"अभी शुरू करें\",\n      \"Back to Homepage\": \"होमपेज पर वापस\",\n      \"Set up in minutes · No setup fees · Cancel anytime\": \"मिनटों में सेटअप · कोई सेटअप शुल्क नहीं · किसी भी समय रद्द करें\",\n      \"One number your parent will never forget.\": \"एक नंबर जिसे आपके माता-पिता कभी नहीं भूलेंगे।\",\n      \"iCanCall connects seniors to their circle of support without smartphones, apps, or complicated tech. Starting at $12.99\/mo.\": \"iCanCall बिना स्मार्टफोन, ऐप या जटिल तकनीक के बुजुर्ग माता-पिता को उनके सहायता चक्र से जोड़ता है। शुरुआत $12.99\/माह से।\",\n      \"See how it works for seniors\": \"बुजुर्गों के लिए यह कैसे काम करता है देखें\",\n      \"Set it up for them\": \"उनके लिए सेटअप करें\",\n      \"Get started\": \"शुरू करें\",\n      \"Select a plan for them\": \"उनके लिए प्लान चुनें\",\n      \"How it works for seniors\": \"बुजुर्गों के लिए कार्यप्रणाली\",\n      \"Safe, screen-free call routing for elderly parents.\": \"बुजुर्ग माता-पिता के लिए सुरक्षित, स्क्रीन-मुक्त कॉल ट्रांसफर प्रणाली।\",\n      \"One number your child will never forget.\": \"एक नंबर जिसे आपका बच्चा कभी नहीं भूलेगा।\",\n      \"iCanCall connects your kids to their circle of care without screen time, apps, or complex devices. Starting at $12.99\/mo.\": \"iCanCall बिना स्क्रीन टाइम, ऐप या जटिल उपकरणों के आपके बच्चों को उनके देखभाल करने वालों से जोड़ता है। शुरुआत $12.99\/माह से।\",\n      \"See how it works for kids\":  मायने रखते हैं\",\n      \"iCanCall fits uniquely into the lives of families needing simple, screen-free safety communication.\": \"iCanCall उन परिवारों के लिए सटीक बैठता है जिन्हें बिना किसी स्क्रीन की उलझन के साधारण और सुरक्षित संचार साधन चाहिए।\",\n      \"For Kids\": \"बच्चों के लिए\",\n      \"Empower kids to reach family from any home phone, landline, or basic phone, without the distractions of a smartphone.\": \"बच्चों को किसी भी बुनियादी या लैंडलाइन फोन से परिवार तक पहुंचने की सुविधा दें, बिना स्मार्टफोन के भटकाव के।\",\n      \"For Seniors\": \"बुजुर्गों के लिए\",\n      \"A lifeline for elderly parents or grandparents. They only have to remember one number to reach their entire family.\": \"बुजुर्ग माता-पिता या दादा-दादी के लिए एक जीवन रेखा। पूरे परिवार तक पहुँचने के लिए उन्हें केवल एक नंबर याद रखना होगा।\",\n      \"For Special Needs\": \"विशेष आवश्यकताओं के लिए\",\n      \"Simplifies communication for individuals with cognitive or physical impairments, giving them direct access to support.\": \"संज्ञानात्मक या शारीरिक रूप से कमजोर व्यक्तियों के लिए कॉल मिलाना आसान बनाता है, जिससे उन्हें सीधे सहायता मिलती है।\",\n      \"Coverage\": \"कवरेज\",\n      \"Build the circle\": \"सर्कल बनाएं\",\n      \"Questions\": \"सवाल\",\n      \"For families & caregivers of loved ones with special abilities\": \"विशेष क्षमताओं वाले प्रियजनों के परिवारों और केयरटेकर के लिए\",\n      \"One press.\": \"एक बार दबाएं।\",\n      \"The right caregiver, every time.\": \"सही केयरटेकर, हर बार।\",\n      \"For a loved one who can't work through a contact list, a single number — or one speed-dial button — connects them to exactly the right person on your care team. You decide who answers and when. They just press call.\": \"जो प्रियजन कॉन्टैक्ट लिस्ट में खुद नहीं ढूंढ पाते, उनके लिए एक नंबर — या एक स्पीड-डायल बटन — उन्हें आपकी केयर टीम के बिल्कुल सही व्यक्ति से जोड़ देता है। कौन जवाब देगा और कब, यह आप तय करते हैं। वे बस कॉल दबाते हैं।\",\n      \"No list to navigate. No decision to make.\": \"न कोई लिस्ट खंगालनी है। न कोई फ़ैसला लेना है।\",\n      \"One press reaches a real person who knows them — and your whole care team is alerted the moment they call.\": \"एक बार दबाने पर वे किसी ऐसे असली इंसान तक पहुंचते हैं जो उन्हें जानता है — और उनके कॉल करते ही आपकी पूरी केयर टीम को सूचना मिल जाती है।\",\n      \"Daniel's iCanCall number\": \"Daniel का iCanCall नंबर\",\n      \"Incoming call\": \"इनकमिंग कॉल\",\n      \"One press finds the right caregiver, in order, until someone who knows him answers\": \"एक बार दबाने पर यह क्रम से सही केयरटेकर को ढूंढता है, जब तक उसे जानने वाला कोई जवाब न दे\",\n      \"Mom · primary caregiver\": \"माँ · मुख्य केयरटेकर\",\n      \"Standing by\": \"स्टैंडबाय पर\",\n      \"Co-caregiver\": \"सह-केयरटेकर\",\n      \"Day program\": \"डे प्रोग्राम\",\n      \"On-call\": \"ऑन-कॉल\",\n      \"Independence for them, reassurance for you\": \"उनके लिए आत्मनिर्भरता, आपके लिए तसल्ली\",\n      \"press to reach help\": \"बार दबाएं, मदद पाएं\",\n      \"lists to navigate\": \"लिस्ट खंगालने की ज़रूरत\",\n      \"caregiver coverage\": \"केयरटेकर कवरेज\",\n      \"Whole\": \"पूरी\",\n      \"care team alerted\": \"केयर टीम को सूचना\",\n      \"Around-the-clock coverage\": \"चौबीसों घंटे कवरेज\",\n      \"Someone is always responsible.\": \"कोई न कोई हमेशा ज़िम्मेदार है।\",\n      \"The number never changes — but who answers it does. iCanCall routes the same call to the right caregiver for the time of day, so coverage hands off cleanly and there's never a gap.\": \"नंबर कभी नहीं बदलता — पर जवाब देने वाला बदलता रहता है। iCanCall उसी कॉल को दिन के समय के हिसाब से सही केयरटेकर तक पहुंचाता है, ताकि ज़िम्मेदारी आसानी से एक से दूसरे के पास जाए और बीच में कभी कोई खाली जगह न रहे।\",\n      \"Daniel's number — one number, all day\": \"Daniel का नंबर — एक नंबर, पूरे दिन\",\n      \"Right now:\": \"अभी:\",\n      \"On-call · overnight\": \"ऑन-कॉल · रात भर\",\n      \"Weekday day program\": \"सप्ताह के दिनों का डे प्रोग्राम\",\n      \"Maria (Mom)\": \"Maria (माँ)\",\n      \"Primary caregiver\": \"मुख्य केयरटेकर\",\n      \"Evening\": \"शाम\",\n      \"12a\": \"रात 12\",\n      \"6a\": \"सुबह 6\",\n      \"12p\": \"दोपहर 12\",\n      \"6p\": \"शाम 6\",\n      \"· primary, afternoons\": \"· मुख्य, दोपहर बाद\",\n      \"· evenings\": \"· शाम\",\n      \"· weekdays\": \"· सप्ताह के दिन\",\n      \"· overnight on-call\": \"· रात भर ऑन-कॉल\",\n      \"If the assigned caregiver can't pick up, the call cascades to the next person in the circle — so a call is never left unanswered, at any hour.\": \"अगर तय केयरटेकर फोन न उठा पाए, तो कॉल सर्कल के अगले व्यक्ति के पास कैस्केड हो जाती है — ताकि किसी भी समय कोई कॉल अनुत्तरित न रहे।\",\n      \"You build the care team.\": \"केयर टीम आप बनाते हैं।\",\n      \"They press one button.\": \"वे बस एक बटन दबाते हैं।\",\n      \"All of the complexity lives with you, in the dashboard. For your loved one, it stays as simple as a single call.\": \"सारी जटिलता आपके पास रहती है, डैशबोर्ड में। आपके प्रियजन के लिए यह एक कॉल जितना ही सरल रहता है।\",\n      \"Claim one number\": \"एक नंबर चुनें\",\n      \"Pick a single iCanCall number and set it as a speed-dial or a one-touch button on whatever device they use — a phone, a tablet, or an adaptive caller. That one button is all they ever need.\": \"एक iCanCall नंबर चुनें और उसे उनके किसी भी डिवाइस पर — फोन, टैबलेट या अडैप्टिव कॉलर — स्पीड-डायल या वन-टच बटन के रूप में सेट कर दें। उन्हें बस उसी एक बटन की ज़रूरत है।\",\n      \"Build the care team\": \"केयर टीम बनाएं\",\n      \"Add up to six caregivers — family, co-caregivers, a day program, a group home, an on-call nurse — and set who should answer, and when, across the day.\": \"अधिकतम छह केयरटेकर जोड़ें — परिवार, सह-केयरटेकर, डे प्रोग्राम, ग्रुप होम, ऑन-कॉल नर्स — और तय करें कि दिन भर में कौन जवाब दे, और कब।\",\n      \"They reach the right person\": \"वे सही व्यक्ति तक पहुंचते हैं\",\n      \"When they press call, iCanCall routes to the right caregiver for that moment and\": \"जब वे कॉल दबाते हैं, तो iCanCall कॉल को उस पल के सही केयरटेकर तक पहुंचाता है और ज़रूरत पड़ने पर उसे आगे\",\n      \"cascades\": \"कैस्केड करता है\",\n      \"on if needed — while every caregiver gets an instant text that the call came in.\": \"— और हर केयरटेकर को तुरंत टेक्स्ट मिल जाता है कि कॉल आई है।\",\n      \"Try it yourself\": \"खुद आज़माकर देखें\",\n      \"Build the care team that answers.\": \"वह केयर टीम बनाएं जो जवाब दे।\",\n      \"Add the caregivers you trust, set their order, then place a pretend call. Choose\": \"अपने भरोसेमंद केयरटेकर जोड़ें, उनका क्रम तय करें, फिर एक नकली कॉल करके देखें। चुनें\",\n      \"cascade\": \"कैस्केड\",\n      \"— ring each caregiver in turn until someone picks up — or a simple\": \"— जब तक कोई फोन न उठा ले, हर केयरटेकर को बारी-बारी से रिंग करें — या एक सरल\",\n      \"caller menu\": \"कॉलर मेनू\",\n      \". Your loved one only ever makes one call.\": \"। आपके प्रियजन बस एक ही कॉल करते हैं।\",\n      \"Routing mode\": \"रूटिंग मोड\",\n      \"Call cascade\": \"कैस्केड कॉल\",\n      \"Caller menu\": \"कॉलर मेनू\",\n      \"You set this once in the dashboard\": \"यह आप डैशबोर्ड में एक बार सेट करते हैं\",\n      \"The care team\": \"केयर टीम\",\n      \"\/6 contacts\": \"\/6 संपर्क\",\n      \"Ready\": \"तैयार\",\n      \"Press call to start routing\": \"रूटिंग शुरू करने के लिए कॉल दबाएं\",\n      \"Place a call\": \"कॉल करें\",\n      \"Toggle a caregiver to \\\"Busy\\\" to see the cascade skip ahead.\": \"कैस्केड को आगे बढ़ते देखने के लिए किसी केयरटेकर को \\\"व्यस्त\\\" पर टॉगल करें।\",\n      \"Why caregivers choose iCanCall\": \"केयरटेकर iCanCall क्यों चुनते हैं\",\n      \"Simple for them.\": \"उनके लिए सरल।\",\n      \"Complete for you.\": \"आपके लिए संपूर्ण।\",\n      \"One press, one action\": \"एक बार दबाना, एक ही काम\",\n      \"No contact list, no menus, no choosing. A single number or button is the entire interaction — designed for those a list would only overwhelm.\": \"न कॉन्टैक्ट लिस्ट, न मेनू, न कुछ चुनना। एक नंबर या एक बटन — बस इतना ही करना होता है। यह उनके लिए बना है जिन्हें लिस्ट सिर्फ़ उलझा देती है।\",\n      \"Always the right caregiver\": \"हमेशा सही केयरटेकर\",\n      \"Time-aware routing sends the call to whoever's on for that part of the day — primary caregiver, day program, evening, or overnight on-call.\": \"समय-आधारित रूटिंग कॉल को उसी के पास भेजती है जो दिन के उस हिस्से में ड्यूटी पर हो — मुख्य केयरटेकर, डे प्रोग्राम, शाम, या रात भर का ऑन-कॉल।\",\n      \"Whole team alerted\": \"पूरी टीम को सूचना\",\n      \"Every caregiver gets a text the instant a call comes in — vital when a loved one may not be able to explain where they are or what they need.\": \"कॉल आते ही हर केयरटेकर को टेक्स्ट मिल जाता है — यह बेहद अहम है जब आपके प्रियजन शायद यह न बता पाएं कि वे कहां हैं या उन्हें क्या चाहिए।\",\n      \"No gaps at handoff\": \"ज़िम्मेदारी बदलते समय कोई गैप नहीं\",\n      \"Coverage passes cleanly from one caregiver to the next. If the assigned person can't answer, the call cascades onward — never a dead end.\": \"कवरेज आसानी से एक केयरटेकर से अगले के पास चला जाता है। अगर तय व्यक्ति जवाब न दे पाए, तो कॉल आगे कैस्केड हो जाती है — कभी बेकार नहीं जाती।\",\n      \"Works with their setup\": \"उनके सेटअप के साथ चलता है\",\n      \"Program it on a phone, a tablet, an adaptive caller, or a single speed-dial button. No app to install and nothing new to learn.\": \"इसे फोन, टैबलेट, अडैप्टिव कॉलर या एक स्पीड-डायल बटन पर सेट करें। न कोई ऐप इंस्टॉल करना है, न कुछ नया सीखना है।\",\n      \"Private & protected\": \"निजी और सुरक्षित\",\n      \"Every caregiver's personal number stays hidden behind the single iCanCall line. All routing is encrypted, and your data is never sold.\": \"हर केयरटेकर का निजी नंबर एक ही iCanCall लाइन के पीछे छिपा रहता है। पूरी रूटिंग एन्क्रिप्टेड है, और आपका डेटा कभी बेचा नहीं जाता।\",\n      \"Simple, honest pricing\": \"सरल, ईमानदार कीमतें\",\n      \"Coverage that costs less\": \"ऐसा कवरेज जिसकी कीमत\",\n      \"than a single co-pay.\": \"एक को-पे से भी कम है।\",\n      \"\/ month\": \"\/ माह\",\n      \"What caregivers ask us most.\": \"केयरटेकर हमसे सबसे ज़्यादा क्या पूछते हैं।\",\n      \"My loved one is non-verbal or can't explain where they are. Does this still help?\": \"मेरे प्रियजन बोल नहीं पाते या यह नहीं बता पाते कि वे कहां हैं। क्या यह तब भी मदद करेगा?\",\n      \"Yes — that's exactly who it's built for. They don't need to choose a contact or say anything in particular. One press connects them to a caregiver who knows them, and every caregiver in the circle gets an instant text that the call came in, so the right people are aware right away.\": \"हाँ — यह ठीक उन्हीं के लिए बना है। उन्हें न कोई संपर्क चुनना है, न कुछ खास कहना है। एक बार दबाने पर वे ऐसे केयरटेकर से जुड़ जाते हैं जो उन्हें जानता है, और सर्कल के हर केयरटेकर को तुरंत टेक्स्ट मिल जाता है कि कॉल आई है, ताकि सही लोगों को फ़ौरन खबर हो जाए।\",\n      \"Can it work as a single speed-dial button or with an adaptive device?\": \"क्या यह एक स्पीड-डायल बटन के रूप में या किसी अडैप्टिव डिवाइस के साथ काम कर सकता है?\",\n      \"Absolutely. Because iCanCall is just one phone number, you can program it as a one-touch speed dial, a favorite, or a single button on whatever phone, tablet, or adaptive caller they already use. There's no app to install and nothing new for them to learn.\": \"बिल्कुल। iCanCall बस एक फोन नंबर है, इसलिए आप इसे वन-टच स्पीड डायल, फेवरेट, या उनके मौजूदा फोन, टैबलेट या अडैप्टिव कॉलर के एक बटन के रूप में सेट कर सकते हैं। न कोई ऐप इंस्टॉल करना है, न उन्हें कुछ नया सीखना है।\",\n      \"How do multiple caregivers and shift changes work?\": \"कई केयरटेकर और शिफ्ट बदलने की व्यवस्था कैसे काम करती है?\",\n      \"From your dashboard, you set who should answer at different times of day — a day program on weekday mornings, a primary caregiver in the afternoon, an evening caregiver, an overnight on-call nurse. The same number routes to whoever's on for that window, so coverage hands off without a gap.\": \"अपने डैशबोर्ड से आप तय करते हैं कि दिन के अलग-अलग समय पर कौन जवाब दे — सप्ताह के दिनों में सुबह डे प्रोग्राम, दोपहर बाद मुख्य केयरटेकर, शाम का केयरटेकर, रात भर की ऑन-कॉल नर्स। वही नंबर उस समय ड्यूटी पर मौजूद व्यक्ति तक कॉल पहुंचाता है, ताकि ज़िम्मेदारी बिना किसी गैप के आगे बढ़े।\",\n      \"What if the assigned caregiver can't pick up?\": \"अगर तय केयरटेकर फोन न उठा पाए तो?\",\n      \"The call cascades to the next person in the circle until someone answers. If everyone is unreachable, it goes to voicemail that's transcribed and texted to the whole team — so a call is never simply lost.\": \"कॉल सर्कल के अगले व्यक्ति के पास कैस्केड हो जाती है, जब तक कोई जवाब न दे। अगर किसी से भी संपर्क न हो पाए, तो कॉल वॉइसमेल पर जाती है, जिसे लिखित रूप में बदलकर पूरी टीम को टेक्स्ट कर दिया जाता है — ताकि कोई कॉल यूं ही न छूट जाए।\",\n      \"Can a group home or day program be part of the circle?\": \"क्या कोई ग्रुप होम या डे प्रोग्राम सर्कल का हिस्सा बन सकता है?\",\n      \"Yes. Any phone number can be a contact — a group home line, a day program, a case manager, a nurse, or family. You decide the order and the times, and adjust anytime as the care plan changes.\": \"हाँ। कोई भी फोन नंबर संपर्क बन सकता है — ग्रुप होम की लाइन, डे प्रोग्राम, केस मैनेजर, नर्स, या परिवार। क्रम और समय आप तय करते हैं, और केयर प्लान बदलने पर कभी भी बदल सकते हैं।\",\n      \"Is iCanCall a medical alert or emergency service?\": \"क्या iCanCall कोई मेडिकल अलर्ट या इमरजेंसी सेवा है?\",\n      \"No — iCanCall connects your loved one to the people on their care team quickly and simply. It complements, but does not replace, 911 or a medical-monitoring service. For life-threatening emergencies, always teach and rely on 911 where possible.\": \"नहीं — iCanCall आपके प्रियजन को उनकी केयर टीम के लोगों से जल्दी और आसानी से जोड़ता है। यह 911 या किसी मेडिकल-मॉनिटरिंग सेवा का पूरक है, उनका विकल्प नहीं। जान को खतरे वाली इमरजेंसी के लिए, जहां तक संभव हो, हमेशा 911 सिखाएं और उसी पर भरोसा करें।\",\n      \"One number. The right person. Every time.\": \"एक नंबर। सही व्यक्ति। हर बार।\",\n      \"Give your loved one the independence of reaching help on their own — and give your care team the certainty of always being there. Set up iCanCall in minutes.\": \"अपने प्रियजन को खुद मदद तक पहुंच पाने की आत्मनिर्भरता दें — और अपनी केयर टीम को हमेशा मौजूद रहने का भरोसा। iCanCall को मिनटों में सेटअप करें।\",\n      \"One memorable number — or one button — that always connects your loved one to the right caregiver, while keeping the whole team in the loop.\": \"एक याद रखने योग्य नंबर — या एक बटन — जो आपके प्रियजन को हमेशा सही केयरटेकर से जोड़ता है, और पूरी टीम को खबर रखता है।\",\n      \"For every family\": \"हर परिवार के लिए\",\n      \"iCanCall, Inc. All rights reserved.\": \"iCanCall, Inc. सर्वाधिकार सुरक्षित।\"\n    },\n    \"attrs\": {\n      \"Name\": \"नाम\",\n      \"Relationship\": \"संबंध\",\n      \"Role\": \"भूमिका\"\n    }\n  },\n  \"pt\": {\n    \"text\": {\n      \"How it works\": \"Como funciona\",\n      \"Features\": \"Recursos\",\n      \"Who it's for\": \"Para quem\",\n      \"Pricing\": \"Preços\",\n      \"FAQ\": \"Perguntas frequentes\",\n      \"Login\": \"Entrar\",\n      \"See how it works\": \"Ver funcionamento\",\n      \"Select a Plan\": \"Escolher plano\",\n      \"See How We Compare\": \"Veja como nos comparamos\",\n      \"Comparison Chart\": \"Tabela de Comparação\",\n      \"Key:\": \"Legenda:\",\n      \"Included\": \"Incluso\",\n      \"Not available\": \"Não disponível\",\n      \"Limited or conditional\": \"Parcial Limitado ou condicional\",\n      \"Product\": \"Produto\",\n      \"Who\": \"Para quem\",\n      \"Company\": \"Empresa\",\n      \"Trust\": \"Suporte e Segurança\",\n      \"Parents\": \"Pais\",\n      \"Caregivers\": \"Cuidadores\",\n      \"Seniors\": \"Idosos\",\n      \"About\": \"Sobre nós\",\n      \"Careers\": \"Carreiras\",\n      \"Stories\": \"Histórias\",\n      \"Contact\": \"Contato\",\n      \"Privacy\": \"Privacidade\",\n      \"Security\": \"Segurança\",\n      \"Terms\": \"Term anCall conecta seus filhos ao seu círculo de cuidado sem telas, aplicativos ou dispositivos complexos. A partir de $12.99\/mês.\",\n      \"See how it works for kids\": \"Ver funcionamento para crianças\",\n      \"How it works for parents\": \"Como funciona para pais\",\n      \"Safe, screen-free call routing for young children.\": \"Encaminhamento de chamadas seguro e sem telas para crianças pequenas.\",\n      \"One number your client will never forget.\": \"Um único número que seu parente nunca esquecerá.\",\n      \"iCanCall connects your clients or loved ones to their care network instantly, without complex devices. Starting at $12.99\/mo.\": \"O iCanCall conecta seus familiares ao seu círculo de cuidados sem telas ou aparelhos complicados. A partir de $12.99\/mês.\",\n      \"See how it works for caregivers\": \"Ver funcionamento para cuidadores\",\n      \"How it works for caregivers\": \"Como funciona para cuidadores\",\n      \"Safe, screen-free call routing for caregivers.\": \"Encaminhamento de chamadas seguro e sem telas para cuidadores.\",\n      \"Aging parent\": \"Idoso sob cuidado\",\n      \"Aging parents\": \"Idosos sob cuidado\",\n      \"Child calling home\": \"Criança ligando para casa\",\n      \"Young children\": \"Crianças pequenas\",\n      \"Special-abilities care\": \"Necessidades especiais\",\n      \"Special abilities & caregivers\": \"Necessidades especiais & cuidadores\",\n      \"Essential\": \"Essencial\",\n      \"Essential Plan\": \"Plano Essencial\",\n      \"Pro\": \"Pro\",\n      \"Pro Plan\": \"Plano Pro\",\n      \"Select Essential\": \"Selecionar Essencial\",\n      \"Select Pro\": \"Selecionar Pro\",\n      \"Most popular\": \"Mais popular\",\n      \"Monthly\": \"Mensal\",\n      \"Annual\": \"Anual\",\n      \"Save 17%\": \"Economize 17%\",\n      \"Save 20%\": \"Economize 20%\",\n      \"One number for one loved one.\": \"Linha para um familiar.\",\n      \"Full protection for the whole circle.\": \"Proteção completa par
