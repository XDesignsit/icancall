s most.<\/p><\/div><aside class=\"hp-faq-help rv\" aria-labelledby=\"faq-help-title\"><span class=\"av\" aria-hidden=\"true\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-headset\"><\/use><\/svg><\/span><h3 id=\"faq-help-title\">Still have a question?<\/h3><p>Real people reply within one business day.<\/p><a class=\"btn\" href=\"/contact\">Contact us<svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-arrow-r\"><\/use><\/svg><\/a><\/aside><\/div><div class=\"faq hp-qa-list\"><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:0\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">01<\/span><span class=\"t\">Do I need any special hardware?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>No. iCanCall is a phone number, not a device. Your loved one dials it from the phone they already have.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:1\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">02<\/span><span class=\"t\">How does the Call Cascade work?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Calls ring your contacts one at a time, in the order you choose. If someone doesn&#x27;t answer, the call moves to the next person. If no one answers, the caller can leave a voicemail. On Pro and Care Team, you&#x27;ll get the transcript by email.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:2\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">03<\/span><span class=\"t\">Can I have more than one number?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Yes. Pro includes 2 numbers and Care Team includes 5. Extra numbers are $6.99/month each.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:3\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">04<\/span><span class=\"t\">Is there a setup fee or contract?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>No setup fees, no activation costs, no contracts.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:4\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">05<\/span><span class=\"t\">What&#x27;s your refund policy?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Every plan has a 14-day service guarantee. If iCanCall doesn&#x27;t work, contact support within 14 days of purchase. If we can&#x27;t fix it, you get a full refund. If you change your mind on a monthly plan, contact support within 14 days and we&#x27;ll refund half of your first month. The half we keep covers costs we pay from day one: your dedicated phone number, your calls and payment processing. You can cancel anytime from your dashboard, and service runs to the end of your billing period.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:5\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">06<\/span><span class=\"t\">Does the guarantee cover annual plans?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Yes. Annual plans have the same 14-day service guarantee. You can also cancel an annual plan within 14 days of purchase for any reason and get the annual charge back, minus one month&#x27;s price of your plan. After 14 days, unused months aren&#x27;t refunded.<\/p><\/div><\/details><details class=\"faq-item hp-qa\" name=\"faq\" style=\"--i:6\"><summary class=\"faq-q\"><span class=\"n mono\" aria-hidden=\"true\">07<\/span><span class=\"t\">Is my family&#x27;s information private?<\/span><span class=\"pm\" aria-hidden=\"true\"><i><\/i><i><\/i><\/span><\/summary><div class=\"faq-a\"><p>Yes. Personal numbers s
