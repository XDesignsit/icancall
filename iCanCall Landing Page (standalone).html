ent: flex-start; align-items: stretch; text-align: left; }\n.sim-menu { display: flex; flex-direction: column; gap: 8px; width: 100%; }\n.sim-menu .menu-title { font-size: 0.85rem; color: oklch(0.92 0.02 220); margin-bottom: 4px; font-weight: 600; }\n.sim-opt { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; background: oklch(1 0 0 \/ 0.12); border: 1px solid oklch(1 0 0 \/ 0.18); color: #fff; padding: 10px 12px; border-radius: 12px; cursor: pointer; font-family: var(--font); transition: background .15s, transform .15s, border-color .15s; }\n.sim-opt:hover { background: oklch(1 0 0 \/ 0.24); transform: translateY(-1px); border-color: oklch(1 0 0 \/ 0.4); }\n.sim-opt .digit { width: 30px; height: 30px; border-radius: 9px; background: oklch(1 0 0 \/ 0.22); display: grid; place-items: center; font-weight: 700; font-size: 1rem; flex: none; }\n.sim-opt .opt-who { min-width: 0; }\n.sim-opt .opt-who b { font-size: 0.95rem; display: block; line-height: 1.2; }\n.sim-opt .opt-who small { font-size: 0.76rem; color: oklch(0.9 0.02 220); }\n\n\/* ---------- Features ---------- *\/\n.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 56px; }\n.feature { padding: 28px 26px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); transition: transform .2s, box-shadow .2s, border-color .2s; }\n.feature:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--blue); }\n.feature .ic { width: 46px; height: 46px; border-radius: 13px; background: var(--tint); display: grid; place-items: center; margin-bottom: 18px; color: var(--blue-deep); }\n.feature .ic svg { width: 23px; height: 23px; }\n.feature h3 { font-size: 1.18rem; margin-bottom: 8px; }\n.feature p { color: var(--ink-soft); font-size: 0.96rem; }\n@media (max-width: 820px) { .features { grid-template-columns: 1fr; } }\n\n\/* ---------- Use cases ---------- *\/\n.usecases { display: grid; grid-template-co px 0 2px; }\n.plan .price b { font-size: 2.8rem; font-weight: 700; letter-spacing: -0.03em; }\n.plan .price span { color: var(--ink-faint); font-size: 0.95rem; }\n.plan .price-yr { font-size: 0.9rem; color: var(--ink-soft); margin-bottom: 4px; }\n.plan .price-yr b { color: var(--blue-deep); font-weight: 700; }\n\n.bill-toggle { display: flex; width: fit-content; gap: 4px; padding: 5px; margin: 30px auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow-sm); }\n.bill-btn { border: none; background: none; font-family: var(--font); font-size: 0.95rem; font-weight: 600; color: var(--ink-soft); padding: 10px 22px; border-radius: 999px; cursor: pointer; transition: background .2s, color .2s; display: inline-flex; align-items: center; gap: 8px; }\n.bill-btn:hover:not(.active) { color: var(--ink); }\n.bill-btn.active { background: var(--blue); color: #fff; box-shadow: 0 4px 12px oklch(0.58 0.115 232 \/ 0.3); }\n.bill-btn em { font-style: normal; font-size: 0.74rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: oklch(0.70 0.13 158 \/ 0.18); color: oklch(0.42 0.13 158); letter-spacing: 0.01em; }\n.bill-btn.active em { background: oklch(1 0 0 \/ 0.22); color: #fff; }\n.plan ul { list-style: none; margin: 22px 0 26px; display: flex; flex-direction: column; gap: 12px; flex: 1; }\n.plan li { display: flex; gap: 10px; font-size: 0.95rem; color: var(--ink-soft); align-items: flex-start; }\n.plan li svg { width: 19px; height: 19px; flex: none; margin-top: 1px; color: var(--teal-deep); }\n.plan .btn { width: 100%; }\n@media (max-width: 820px) { .pricing { grid-template-columns: 1fr; } .plan.featured { transform: none; } }\n\n\/* ---------- Testimonials ---------- *\/\n.quotes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 56px; }\n.quote { padding: 28px 26px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; }\n.quote .stars { color: var(--teal-deep); letter-spacing: 3px; margin-bottom: 14px; font-size: 0.95rem; }\n.quote p { font-size: 1.04rem; color: var(--ink); line-height: 1.5; flex: 1; }\n.quote .by { display: flex; align-items: center; gap: 12px; margin-top: 22px; }\n.quote .by .avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 0.85rem; }\n.quote .by b { font-size: 0.92rem; display: block; }\n.quote .by span { font-size: 0.82rem; color: var(--ink-faint); }\n@media (max-width: 820px) { .quotes { grid-template-columns: 1fr; } }\n\n\/* ---------- FAQ ---------- *\/\n.faq { max-width: 800px; margin: 48px auto 0; }\n.faq-item { border-bottom: 1px solid var(--line); }\n.faq-q { width: 100%; text-align: left; background: none; border: none; cursor: pointer; font-family: var(--font); padding: 24px 4px; display: flex; align-items: center; justify-content: space-between; gap: 20px; font-size: 1.1rem; font-weight: 600; color: var(--ink); }\n.faq-q .pm { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--tint); display: grid; place-items: center; transition: transform .25s, background .25s; color: var(--blue-deep); font-size: 1.2rem; line-height: 1; }\n.faq-item.open .faq-q .pm { transform: rotate(45deg); background: var(--blue); color: #fff; }\n.faq-a { max-height: 0; overflow: hidden; transition: max-height .32s ease; }\n.faq-a p { padding: 0 4px 24px; color: var(--ink-soft); font-size: 1rem; max-width: 68ch; }\n\n\/* ---------- Final CTA ---------- *\/\n.cta-band { position: relative; overflow: hidden; }\n.cta-card {\n  position: relative; border-radius: var(--r-xl); padding: clamp(48px, 7vw, 88px) clamp(28px, 5vw, 72px);\n  background: linear-gradient(150deg, var(--blue-deep), var(--blue) 55%, var(--teal-deep));\n  color: #fff; text-align: center; overflow: hidden;\n  box-shadow: var(--shadow-lg);\n}\n.cta-card::before { otion: reduce) {\n  * { animation: none !important; transition: none !important; }\n  .reveal { opacity: 1; transform: none; }\n}\n<\/style>\n<\/head>\n<body>\n\n\n\n<!-- ============== HEADER ============== -->\n<header class=\"header\">\n  <div class=\"wrap header-inner\">\n    <a class=\"brand\" href=\"#top\" aria-label=\"iCanCall home\">\n      <span class=\"mark\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n      <\/span>\n      <span>i<b>Can<\/b>Call<\/span>\n    <\/a>\n    <nav class=\"nav\">\n      <a href=\"#how\">How it works<\/a>\n      <a href=\"#features\">Features<\/a>\n      <a href=\"#usecases\">Who it's for<\/a>\n      <a href=\"#pricing\">Pricing<\/a>\n      <a href=\"#faq\">FAQ<\/a>\n    <\/nav>\n    <div class=\"header-cta\">\n      <a class=\"btn btn-ghost\" href=\"#how\">See how it works<\/a>\n      <a class=\"btn btn-primary\" href=\"#pricing\">Select a Plan<\/a>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main id=\"top\">\n\n<!-- ============== HERO ============== -->\n<section class=\"hero\">\n  <div class=\"wrap hero-grid\">\n    <div class=\"hero-copy\">\n      <span class=\"eyebrow\">Safety on autopilot<\/span>\n      <h1>One number.<br><span class=\"accent\">Always answered.<\/span><\/h1>\n      <p class=\"lead\">When it matters most, the people you love should never reach a dead end. iCanCall routes a single, memorable number to up to six trusted contacts — until someone picks up.<\/p>\n      <div class=\"hero-actions\">\n        <a class=\"btn btn-primary btn-lg\" href=\"#pricing\">Select a Plan<\/a>\n        <a class=\"btn btn-ghost btn-lg\" href=\"#how\">How it works<\/a>\n      <\/div>\n      <div class=\"hero-note\"><span class=\"dot\"><\/span> No new hardware · Works with any phone · Set up in minutes<\/div>\n    <\/div>\n\n    <!-- Animated routing demo -->\n    <div class=\"demo\" id=\"demo\" aria-label=\"Live call-routing demonstration\">\n      <div class=\"demo-head\">\n        <div class=\"demo-number\">\n          <span class=\"ring\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A16 16 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5Z\"><\/path><\/svg>\n          <\/span>\n          <span class=\"num\">(415) 200-CARE<small>Mom's iCanCall number<\/small><\/span>\n        <\/div>\n        <span class=\"demo-status\"><span class=\"live\"><\/span><span class=\"txt\">Incoming call<\/span><\/span>\n      <\/div>\n      <p class=\"demo-caption\">Routing through trusted contacts, in order, until answered<\/p>\n      <div class=\"chain\">\n        <div class=\"contact\">\n          <span class=\"order\">1<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.58 0.115 232)\">SR<\/span>\n          <span class=\"who\"><b>Sarah R.<\/b><span>Daughter<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">2<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.62 0.10 198)\">DM<\/span>\n          <span class=\"who\"><b>David M.<\/b><span>Son<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">3<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.55 0.11 280)\">LN<\/span>\n          <span class=\"who\"><b>Lena N.<\/b><span>Neighbor<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n        <div class=\"contact\">\n          <span class=\"order\">4<\/span>\n          <span class=\"avatar\" style=\"background:oklch(0.6 0.12 30)\">DR<\/span>\n          <span class=\"who\"><b>Dr. Patel<\/b><span>Care team<\/span><\/span>\n          <span class=\"state\">Standing by<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== TRUST STRIP ============== -->\n<section class=\"trust\">\n  <div class=\"wrap trust-inner\">\n    <span class=\"trust-label\">Built for the moments that matter<\/span>\n    <div class=\"trust-stats\">\n      <div class=\"stat\"><b>1<\/b><span>number to remember<\/span><\/div>\n      <div class=\"stat\"><b>6<\/b><span>contacts per number<\/span><\/div>\n      <div class=\"stat\"><b>&lt;3s<\/b><span>to start routing<\/span><\/div>\n      <div class=\"stat\"><b>99.99%<\/b><span>uptime, always on<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== HOW IT WORKS ============== -->\n<section class=\"section\" id=\"how\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">How it works<\/span>\n      <h2>Set it once. Trust it forever.<\/h2>\n      <p class=\"lead\">Three simple steps stand between you and complete peace of mind.<\/p>\n    <\/div>\n    <div class=\"steps\">\n      <div class=\"step reveal\">\n        <div class=\"idx\">1<\/div>\n        <h3>Claim your number<\/h3>\n        <p>Pick a single, easy-to-remember iCanCall number. Share it once — on a bracelet, a fridge, a school form — and never juggle a list of numbers again.<\/p>\n        <svg class=\"step-arrow\" width=\"60\" height=\"24\" viewBox=\"0 0 60 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M0 12h54m0 0-7-7m7 7-7 7\"><\/path><\/svg>\n      <\/div>\n      <div class=\"step reveal\">\n        <div class=\"idx\">2<\/div>\n        <h3>Add your circle<\/h3>\n        <p>Designate up to six trusted contacts and set the order they should be reached. Family, neighbors, caregivers, doctors — your circle, your priority.<\/p>\n        <svg class=\"step-arrow\" width=\"60\" height=\"24\" viewBox=\"0 0 60 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M0 12h54m0 0-7-7m7 7-7 7\"><\/path><\/svg>\n      <\/div>\n      <div class=\"step reveal\">\n        <div class=\"idx\">3<\/div>\n        <h3>Choose how to connect<\/h3>\n        <p>Pick your routing in the dashboard: let iCanCall <b>cascade<\/b> through the circle until someone answers, or greet callers with a simple <b>menu<\/b> to reach the right person directly.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== TRY IT (interactive) ============== -->\n<section class=\"section tint-band\" id=\"try\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Interactive demo<\/span>\n      <h2>Build your circle. Place a call.<\/h2>\n      <p class=\"lead\">Add the people you trust, then choose how callers reach them: let iCanCall <b>cascade<\/b> through the circle until someone answers, or hand callers a <b>menu<\/b> to pick exactly who to dial. Try both below.<\/p>\n    <\/div>\n    <div class=\"mode-toggle reveal\">\n      <span class=\"mode-label\">Routing mode<\/span>\n      <div class=\"seg\" role=\"tablist\" aria-label=\"Routing mode\">\n        <button class=\"seg-btn active\" type=\"button\" data-mode=\"cascade\" role=\"tab\">Call cascade<\/button>\n        <button class=\"seg-btn\" type=\"button\" data-mode=\"menu\" role=\"tab\">Caller menu<\/button>\n      <\/div>\n      <span class=\"mode-note\">\n        <svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"10\" rx=\"2\"><\/rect><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"><\/path><\/svg>\n        Set by the account owner in the dashboard\n      <\/span>\n    <\/div>\n    <div class=\"builder reveal\">\n      <!-- editor -->\n      <div class=\"builder-panel\">\n        <div class=\"builder-head\">\n          <h3>Your style=\"background:oklch(0.58 0.115 232)\">JM<\/span><span><b>Jenna M.<\/b><span>Daughter &amp; caregiver<\/span><\/span><\/figcaption>\n      <\/figure>\n      <figure class=\"quote reveal\">\n        <div class=\"stars\">★★★★★<\/div>\n        <p>\"My seven-year-old only has to remember one number. Whether it finds me at work or her grandma at home, she always reaches someone who loves her.\"<\/p>\n        <figcaption class=\"by\"><span class=\"avatar\" style=\"background:oklch(0.62 0.10 198)\">AT<\/span><span><b>Andre T.<\/b><span>Dad of two<\/span><\/span><\/figcaption>\n      <\/figure>\n      <figure class=\"quote reveal\">\n        <div class=\"stars\">★★★★★<\/div>\n        <p>\"For our son, a contact list was impossible. Now one button, one number, and the right caregiver answers — every single time. It changed everything for us.\"<\/p>\n        <figcaption class=\"by\"><span class=\"avatar\" style=\"background:oklch(0.55 0.11 280)\">PR<\/span><span><b>Priya R.<\/b><span>Special-abilities parent<\/span><\/span><\/figcaption>\n      <\/figure>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== FAQ ============== -->\n<section class=\"section tint-band\" id=\"faq\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow\">Questions, answered<\/span>\n      <h2>Everything you might ask.<\/h2>\n    <\/div>\n    <div class=\"faq reveal\">\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Do my contacts need to install an app?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>No. iCanCall works with any phone — landline or mobile. Callers simply dial your one number, and your contacts answer on whatever phone they already use. No apps, no new hardware.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">What happens if nobody answers?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>iCanCall rings each contact in your chosen order until someone picks up. If the full circle is unreachable, the caller can leave a voicemail that's instantly transcribed and texted to every contact, so no message is ever lost.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Cascade or caller menu — what's the difference?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>You choose how callers connect, right from your dashboard. <b>Call cascade<\/b> rings your contacts one after another until someone answers — ideal for emergencies, when reaching <i>anyone<\/i> is what matters. <b>Caller menu<\/b> greets callers and lets them choose who to reach (\"press 1 for Mom, press 2 for the nurse\") — ideal when the right person depends on the situation. Switch modes anytime.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Can I change the contacts or their order?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Anytime, in seconds. Add, remove, or reorder up to six contacts from your dashboard. Changes take effect on the very next call.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">Is my family's information private?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Always. Personal numbers stay hidden behind your single iCanCall line, all routing is encrypted, and we never sell your data.<\/p><\/div>\n      <\/div>\n      <div class=\"faq-item\">\n        <button class=\"faq-q\">How quickly can I get set up?<span class=\"pm\">+<\/span><\/button>\n        <div class=\"faq-a\"><p>Most families are protected in under five minutes: claim a number, add your contacts, and you're live. No technician visit and no equipment required.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- ============== FINAL CTA ============== -->\n<section class=\"section cta-band\" id=\"cta\">\n  <div class=\"wrap\">\n
